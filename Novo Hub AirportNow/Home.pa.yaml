                                    - Function_resumo_diario_graph_1:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          BasePaletteColor: =thmPrimaria
                                          Icon: ="GridDots"
                                          IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: |-
                                            =//Set(varUltimaAtividade; Now());;
                                            // Coleta dos registros filtrados com filtro de aeroporto + data
                                            ClearCollect(
                                                colResumoFiltrado,
                                                Sort(
                                                    Filter(
                                                        col_resumoDiario,

                                                        // Filtro por aeroporto
                                                        IsBlank(ComboboxCanvasAeroporto_2.Selected.Value) ||
                                                        StartsWith(
                                                            aeroportoResumo,
                                                            Text(ComboboxCanvasAeroporto_2.Selected.Value)
                                                        ) ||
                                                        StartsWith(
                                                            aeroportoResumo,
                                                            LookUp(
                                                                colAeros,
                                                                Aeroporto = Text(ComboboxCanvasAeroporto_2.Selected.Value)
                                                            ).IATA
                                                        ),

                                                        // Filtro por data (Comparando com ComboBox)
                                                        IsBlank(ComboboxCanvasData.Selected.Value) ||
                                                        DateValue(Criado) = DateValue(ComboboxCanvasData.Selected.Value)
                                                    ),
                                                    Criado,
                                                    SortOrder.Descending
                                                )
                                            );

                                            // Agrupamento por módulo
                                            ClearCollect(
                                                colResumoPorModulo,
                                                SortByColumns(
                                                    AddColumns(
                                                        ShowColumns(
                                                            GroupBy(colResumoFiltrado, modulo, registros),
                                                            modulo, registros
                                                        ),
                                                        total, CountRows(registros)
                                                    ),
                                                    "total",
                                                    SortOrder.Descending
                                                )
                                            );

                                            // Agrupamento por status (tratando valores em branco como "Finalizado")
                                            ClearCollect(
                                                colResumoPorStatus,
                                                SortByColumns(
                                                    AddColumns(
                                                        ShowColumns(
                                                            GroupBy(
                                                                AddColumns(
                                                                    colResumoFiltrado,
                                                                    StatusFinal,
                                                                    If(
                                                                        IsBlank(Status) || Lower(Status) = "finalizado",
                                                                        "Finalizado",
                                                                        "Em andamento"
                                                                    )
                                                                ),
                                                                StatusFinal,
                                                                registros
                                                            ),
                                                            StatusFinal,
                                                            registros
                                                        ),
                                                        total,
                                                        CountRows(registros)
                                                    ),
                                                    "total",
                                                    SortOrder.Descending
                                                )
                                            );


                                            ClearCollect(
                                                colResumoPorCategoria,
                                                ForAll(
                                                    GroupBy(colResumoFiltrado, categoria, registrosCategoria),
                                                    With(
                                                        {
                                                            modulosAgrupados:
                                                            SortByColumns(
                                                                AddColumns(
                                                                    GroupBy(registrosCategoria, modulo, registrosModulo),
                                                                    total,
                                                                    CountRows(registrosModulo)
                                                                ),
                                                                "total",
                                                                SortOrder.Descending
                                                            )
                                                        },
                                                        {
                                                            categoria: categoria,
                                                            modulos: modulosAgrupados,
                                                            totalCategoria: Sum(modulosAgrupados, total)
                                                        }
                                                    )
                                                )
                                            );

                                            // Agora ordene a coleção por totalCategoria decrescente
                                            ClearCollect(
                                                colResumoPorCategoria,
                                                SortByColumns(colResumoPorCategoria, "totalCategoria", SortOrder.Descending)
                                            );


                                            // Agrupamento por criticidade
                                            ClearCollect(
                                                colResumoPorCriticidade,
                                                SortByColumns(
                                                    AddColumns(
                                                        ShowColumns(
                                                            GroupBy(colResumoFiltrado, criticidade, registros),
                                                            criticidade, registros
                                                        ),
                                                        total, CountRows(registros)
                                                    ),
                                                    "total",
                                                    SortOrder.Descending
                                                )
                                            );

                                            // Somatórios de criticidade
                                            Set(varTotalCriticidade, Sum(colResumoPorCriticidade, total));
                                            Set(varAlta, LookUp(colResumoPorCriticidade, criticidade = "Alta", total));
                                            Set(varMedia, LookUp(colResumoPorCriticidade, criticidade = "Média", total));
                                            Set(varBaixa, LookUp(colResumoPorCriticidade, criticidade = "Baixa", total));

                                            // Percentuais tratados para evitar divisão por zero
                                            Set(varPercAlta, If(varTotalCriticidade > 0, Round((varAlta / varTotalCriticidade) * 100, 0), 0));
                                            Set(varPercMedia, If(varTotalCriticidade > 0, Round((varMedia / varTotalCriticidade) * 100, 0), 0));
                                            Set(varPercBaixa, If(varTotalCriticidade > 0, 100 - varPercAlta - varPercMedia, 0));

                                            // Total de registros usado nas barras de proporção por módulo.
                                            // Era Sum(colResumoFiltrado, 1) recalculado dentro do Concat, uma vez por módulo.
                                            Set(varTotalFiltrado, CountRows(colResumoFiltrado));

                                            // Geração do HTML agrupando por categoria
                                            Set(
                                                TemplateHTMLmodulo,
                                                "<div style='" & htmlFonte & " font-size:13px; color:" & hxTexto & "; padding:10px;'>

                                                    <div style='background:" & hxSuperficie & "; border-radius:12px; padding:20px; margin-bottom:24px;
                                                                box-shadow:0 2px 6px rgba(0,0,0,0.08);'>

                                                        <h3 style='color:" & hxPrimariaEscura & "; font-size:16px; margin-bottom:10px;'>
                                                            Módulos Registrados por Categoria"& "
                                                        </h3>

                                                        <div style='display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between;'>"
                                                        &

                                                        Concat(
                                                            Sort(colResumoPorCategoria,totalCategoria,SortOrder.Descending),
                                                            "<div style='flex: 1 1 32%; background:" & hxFundo & "; border-radius:10px; padding:12px;
                                                                  margin-bottom:10px; box-sizing:border-box;'>
                                                                <h4 style='color:" & hxPrimaria & "; font-size:15px; margin-bottom:10px;'>" & categoria & "</h4>" &

                                                                Concat(
                                                                    modulos,
                                                                    "<div style='margin-bottom:12px;'>
                                                                        <div style='display:flex; justify-content:space-between; font-weight:500; margin-bottom:6px;'>
                                                                            <span>" & modulo & "</span>
                                                                            <span>" & total & "</span>
                                                                        </div>
                                                                        <div style='background:" & hxGradeLinha & "; height:10px; border-radius:5px; overflow:hidden;'>
                                                                            <div style='height:10px; width:" &
                                                                                Text((total / varTotalFiltrado) * 100, "0") & "%;
                                                                                background:linear-gradient(90deg, " & hxPrimaria & ", " & hxPrimariaClara & "); border-radius:5px;'>
                                                                            </div>
                                                                        </div>
                                                                    </div>"
                                                                ) &
                                                            "</div>"
                                                        ) &

                                                        "</div>
                                                    </div>
                                                </div>"
                                            );

                                            Set(
                                                TemplateHTMLdashboard,
                                                "<div style='" & htmlFonte & " font-size:13px; color:" & hxTexto & "; padding:10px;'>

                                                    <!-- CARD 1 - TOTAL DE REGISTROS -->
                                                    <div style='background:" & hxSuperficie & "; border-radius:12px; padding:24px; margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,0.08); text-align:center;'>
                                                        <h3 style='color:" & hxPrimaria & "; font-size:16px; margin-bottom:8px;'>Total de Registros do Dia - " & Text(ComboboxCanvasData.Selected.Value, "dd/mm/yyyy") & "</h3>
                                                        <div style='font-size:28px; font-weight:bold; color:" & hxPrimariaEscura & ";'>
                                                            " & varTotalFiltrado & "
                                                        </div>
                                                    </div>

                                                    <!-- CARD 2 - REGISTROS POR STATUS -->
                                                    <div style='background:" & hxSuperficie & "; border-radius:12px; padding:16px; margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,0.08);'>
                                                        <h3 style='color:" & hxOperacional & "; font-size:16px; margin-bottom:12px;'>Registros por Status</h3>" &

                                                        Concat(
                                                            colResumoPorStatus,
                                                            "<div style='margin-bottom:12px;'>
                                                                <div style='display:flex; justify-content:space-between; font-weight:500; margin-bottom:6px;'>
                                                                    <span>" & StatusFinal & "</span>
                                                                    <span>" & total & "</span>
                                                                </div>
                                                                <div style='height:10px; border-radius:5px; overflow:hidden;'>
                                                                    <div style='height:10px; border-radius:5px; width:" & Text((total / Sum(colResumoPorStatus, total)) * 100, "0") & "%;
                                                                        background:" & Switch(
                                                                            Lower(StatusFinal),
                                                                            "finalizado", "linear-gradient(90deg, rgba(52,152,47,0.7), rgba(132,203,123,0.7))",
                                                                            "em andamento", "linear-gradient(90deg, rgba(255,193,7,1), rgba(255,228,143,1))",
                                                                            "linear-gradient(90deg, rgba(173,181,189,1), rgba(222,226,230,1))"
                                                                        ) & ";'></div>
                                                                </div>
                                                            </div>"
                                                        ) &
                                                    "</div>

                                                    <!-- CARD 3 - DISTRIBUIÇÃO POR CRITICIDADE -->
                                                    <div style='background:" & hxSuperficie & "; border-radius:12px; padding:16px; box-shadow:0 2px 6px rgba(0,0,0,0.08);'>
                                                        <h3 style='color:" & hxVermelho & "; font-size:16px; margin-bottom:12px;'>Distribuição por Criticidade</h3>
                                                        <div style='display:flex; align-items:center; justify-content:center; margin-bottom:20px;'>
                                                            <div style='width:120px; height:120px; border-radius:50%;
                                                                background:conic-gradient(
                                                                    #ff6b6b 0% " & Text(varPercAlta, "0") & "%,
                                                                    #ffe066 " & Text(varPercAlta, "0") & "% " & Text(varPercAlta + varPercMedia, "0") & "%,
                                                                    #51cf66 " & Text(varPercAlta + varPercMedia, "0") & "% 100%
                                                                );
                                                                box-shadow:inset 0 0 6px rgba(0,0,0,0.1);'>
                                                            </div>
                                                        </div>
                                                        <div style='display:flex; flex-direction:column; gap:6px; font-size:13px;'>
                                                            <div><span style='display:inline-block; width:12px; height:12px; background:#ff6b6b; margin-right:6px; border-radius:3px;'></span>Alta: " & varAlta & " (" & varPercAlta & "%)</div>
                                                            <div><span style='display:inline-block; width:12px; height:12px; background:#ffe066; margin-right:6px; border-radius:3px;'></span>Média: " & varMedia & " (" & varPercMedia & "%)</div>
                                                            <div><span style='display:inline-block; width:12px; height:12px; background:#51cf66; margin-right:6px; border-radius:3px;'></span>Baixa: " & varBaixa & " (" & varPercBaixa & "%)</div>
                                                        </div>
                                                    </div>

                                                </div>"
                                            )
                                          Text: =
                                          Visible: =false
                                          Width: =40
                                          X: =1139
