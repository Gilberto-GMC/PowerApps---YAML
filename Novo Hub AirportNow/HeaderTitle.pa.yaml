ComponentDefinitions:
  HeaderTitle:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      IconVisible:
        PropertyKind: Input
        DisplayName: IconVisible
        Description: Uma propriedade personalizada
        DataType: Boolean
        Default: =true
      ScreenNavigator:
        PropertyKind: Input
        DisplayName: ScreenNavigator
        Description: Uma propriedade personalizada
        DataType: Screen
        Default: =Blank()
      var_subtitulo1:
        PropertyKind: Input
        DisplayName: var_subtitulo1
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =""
      var_subtitulo2:
        PropertyKind: Input
        DisplayName: var_subtitulo2
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =""
      var_tituloModulo:
        PropertyKind: Input
        DisplayName: var_tituloModulo
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =var_tituloModulo
    Properties:
      Height: =50
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Container83_89:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =thmPrimariaEscura
            DropShadow: =DropShadow.None
            Fill: =thmPrimaria
            Height: =50
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =1
            PaddingTop: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Icon2_3:
                Control: Classic/Icon@2.5.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  Color: =thmTextoInverso
                  Height: =30
                  HoverColor: =thmPrimariaClara
                  Icon: =Icon.BackArrow
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  OnSelect: |
                    =Set(varUltimaAtividade, Now());
                    If(
                        !IsBlank(HeaderTitle.ScreenNavigator),
                        Navigate(
                            HeaderTitle.ScreenNavigator,
                            ScreenTransition.Fade
                        ),
                        Back()
                    )
                  Visible: =HeaderTitle.IconVisible
                  Width: =50
            - Button21_88:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =thmSuperficie
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =thmTextoInverso
                  DisabledBorderColor: =thmTransparente
                  DisabledColor: =thmPrimariaEscura
                  DisabledFill: =thmTransparente
                  DisplayMode: =DisplayMode.View
                  Fill: =thmTransparente
                  FillPortions: =1
                  Height: =30
                  HoverBorderColor: =
                  HoverColor: =thmPrimariaClara
                  HoverFill: =
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =300
                  OnSelect: =
                  PaddingLeft: =If(!HeaderTitle.IconVisible, 20, 5)
                  PaddingTop: =2
                  PressedBorderColor: =
                  PressedColor: =thmPrimariaClara
                  PressedFill: =
                  Size: =12
                  Text: |-
                    =HeaderTitle.var_tituloModulo & If(
                        !IsBlank(HeaderTitle.var_subtitulo1),
                        " > " & HeaderTitle.var_subtitulo1
                    ) & If(
                        !IsBlank(HeaderTitle.var_subtitulo2),
                        " > " & HeaderTitle.var_subtitulo2
                    )
                  Width: =500
            - Image3:
                Control: Image@2.2.3
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =thmPrimariaEscura
                  Image: =ASUR_Logo_Branco
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Width: =110
