                  Y: =527
            - Button20_58:
                Control: Classic/Button@2.2.0
                Group: btnConfDadosSalvar_28
                Properties:
                  BorderColor: =thmPrimariaEscura
                  Color: =thmTextoInverso
                  DisabledBorderColor: =thmDesabilitado
                  DisabledFill: =thmDesabilitadoFundo
                  DisplayMode: |-
                    =If(
                        Len(txtNvSenha1_2.Text) >= 6 And txtNvSenha1_2.Text = txtNvSenha2_2.Text,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Fill: =thmTransparente
                  HoverColor: =thmTextoInverso
                  HoverFill: =ColorFade(thmPrimariaClara, -10%)
                  OnSelect: |-
                    =If(
                        IsBlank(varAuthUser),
                        Notify(
                            "Não foi possível confirmar a sua identidade. Entre novamente.",
                            NotificationType.Error
                        );
                        UpdateContext({varUpdSenha: false}),

                        UpdateContext(
                            {
                                code1: Concat(
                                    FirstN(
                                        Shuffle(Split("abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789", "")),
                                        110
                                    ),
                                    Value
                                ),
                                code2: Concat(
                                    FirstN(
                                        Shuffle(Split("abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789", "")),
                                        110
                                    ),
                                    Value
                                )
                            }
                        );
                        Patch(
                            User,
                            varAuthUser,
                            {
                                Senha: Concatenate(
                                    Left(txtNvSenha2_2.Text, 2),
                                    code1,
                                    Mid(txtNvSenha2_2.Text, 3, 2),
                                    code2,
                                    Mid(txtNvSenha2_2.Text, 5)
                                ),
                                Validacao: 1
                            }
                        );
                        If(
                            IsEmpty(Errors(User)),
                            Set(varAuthUser, Blank());
                            Reset(txtNvSenha1_2);
                            Reset(txtNvSenha2_2);
                            UpdateContext({varUpdSenha: false});
                            UpdateContext({varResetSenha: false});
                            Notify(
                                "Senha cadastrada com sucesso!",
                                NotificationType.Success
                            ),
                            Notify(
                                "Não foi possível gravar a nova senha. Tente novamente.",
                                NotificationType.Error
                            )
                        )
                    )
                  PressedFill: =
                  Size: =30
                  Text: =""
                  VerticalAlign: =VerticalAlign.Bottom
                  Width: =221
                  X: =801
                  Y: =527
