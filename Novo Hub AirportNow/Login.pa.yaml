                      Children:
                        - htmlBtnEntrar:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              Fill: =thmTransparente
                              Height: =Parent.Height
                              HtmlText: |-
                                ="<div style='position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden; " & htmlFonte & " display:flex; align-items:center; justify-content:center; border-radius:8px; background:linear-gradient(90deg, " & hxAzulASUR & " 0%, " & hxPrimaria & " 100%); color:" & hxSuperficie & "; font-size:17px; font-weight:700;'>Entrar &nbsp;&rarr;</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Width: =Parent.Width
                        - ButtonCanvas41:
                            Control: Button@0.0.45
                            Properties:
                              AccessibleLabel: ="Entrar"
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =8
                              Font: =thmFonte
                              FontColor: =thmTextoInverso
                              Height: =Parent.Height
                              OnSelect: |-
                                =// Definir variáveis temporárias e exibir o loader
                                UpdateContext({var_visibleSpinLoader: true});
                                // Busca delegavel: Filter por igualdade + Sort por ID.
                                // Mantem a semantica original (registro mais recente do usuario)
                                // sem trazer a lista inteira para o cliente.
                                Set(
                                    userRecord,
                                    First(
                                        Sort(
                                            Filter(
                                                User,
                                                Usuarios = txtUser_2.Value
                                            ),
                                            ID,
                                            SortOrder.Descending
                                        )
                                    )
                                );
                                // Registro que passou pela conferência de usuário E senha.
                                // Fica em branco quando a senha está errada — e é ele, não o
                                // nome de usuário, que autoriza a troca de senha.
                                // Derivado de userRecord: nao precisa de uma segunda consulta.
                                Set(
                                    varAuthUser,
                                    If(
                                        Not(IsBlank(userRecord)) And userRecord.Senha = txtSenha_2.Value,
                                        userRecord
                                    )
                                );
                                // Verificar se o usuário existe
                                If(
                                    IsBlank(userRecord),
                                    Notify(
                                        "Usuário ou senha inválidos",
                                        NotificationType.Error
                                    );
                                    UpdateContext({var_visibleSpinLoader: false}),
                                    // Usuário encontrado, continuar validação
                                    If(
                                        And(
                                            Not(IsBlank(varAuthUser)),
                                            varAuthUser.Validacao = 0
                                        ),
                                        // Primeiro acesso: abre o painel de troca de senha.
                                        // varRegTroca alimenta os campos do painel com uma
                                        // unica consulta, no lugar de tres LookUp repetidos.
                                        Set(
                                            varRegTroca,
                                            LookUp(
                                                User,
                                                Email = User().Email
                                            )
                                        );
                                        UpdateContext({varUpdSenha: true});
                                        Reset(txtSenha_2);
                                        UpdateContext({var_visibleSpinLoader: false}),
                                        Set(
                                            varTempPass,
                                            userRecord.Senha
                                        );
                                        If(
                                            varTempPass = Concatenate(
                                                Left(
                                                    txtSenha_2.Value,
                                                    2
                                                ),
                                                Mid(
                                                    varTempPass,
                                                    3,
                                                    110
                                                ),
                                                Mid(
                                                    txtSenha_2.Value,
                                                    3,
                                                    2
                                                ),
                                                Mid(
                                                    varTempPass,
                                                    115,
                                                    110
                                                ),
                                                Mid(
                                                    txtSenha_2.Value,
                                                    5
                                                )
                                            ),
                                        // Senha válida, configurar variáveis do usuário
                                            Set(
                                                varIdUser,
                                                userRecord.ID
                                            );
                                            Set(
                                                varNomeUser,
                                                userRecord.usrNome
                                            );
                                            Set(
                                                varEmailUser,
                                                userRecord.Email
                                            );
                                            Set(
                                                varFuncaoUser,
                                                userRecord.Funcao
                                            );
                                            Set(
                                                varBlocoUser,
                                                userRecord.Bloco
                                            );
                                            Set(
                                                varAeroUser,
                                                userRecord.Aeroporto
                                            );
                                            // Um unico LookUp em colAeros para ICAO e IATA
                                            Set(
                                                varRegAero,
                                                LookUp(
                                                    colAeros,
                                                    Aeroporto = userRecord.Aeroporto
                                                )
                                            );
                                            Set(
                                                varICAOUser,
                                                varRegAero.ICAO
                                            );
                                            Set(
                                                varIATAUser,
                                                varRegAero.IATA
                                            );
                                            Set(
                                                varPerfilUser,
                                                userRecord.Perfil
                                            );
                                            Set(
                                                varAutUser,
                                                userRecord.Autorizacao
                                            );
                                            // Foto do usuário: uma chamada, pelo e-mail do
                                            // registro. IfError cobre usuario sem foto.
                                            Set(
                                                varFotoUser,
                                                IfError(
                                                    UsuáriosdoOffice365.UserPhotoV2(userRecord.Email),
                                                    Blank()
                                                )
                                            );
                                            Set(
                                                varViewSafaty,
                                                userRecord.View_safety
                                            );
                                            // Login bem-sucedido
                                            Set(
                                                Logado,
                                                true
                                            );
                                            // Navegar para a tela correspondente (Windows ou Mobile)
                                            If(
                                                Host.OSType = "Windows",
                                                Navigate(
                                                    Home,
                                                    ScreenTransition.Fade
                                                    /*;  ........................................................................visible popup de controle de versões...
                                                    {var_visibleControleVersoes: true}*/
                                                ),
                                                Navigate(
                                                    HomeMob,
                                                    ScreenTransition.Fade
                                                )
                                            );
                                            UpdateContext({var_visibleSpinLoader: false}),
                                        // Senha inválida
                                            Notify(
                                                "Senha inválida. Por favor, verifique e tente novamente.",
                                                NotificationType.Error
                                            );
                                            UpdateContext({var_visibleSpinLoader: false});
                                            Reset(txtSenha_2)
                                        )
                                    )
                                )
