Screens:
  ScreenDueDiligenceInicio:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
    Children:
      - cntInicioRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - hdrDd_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 23, 42, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =60
                  LayoutMinWidth: =16
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Image1_1:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =40
                        Image: =MOTIVA_RGB_Logo_VersaoNegativa_Branca
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingRight: =50
                        Width: =170
                  - cntHdrDdTitulo_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtHdrDdTitulo_1:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =27
                              Size: =18
                              Text: ="DUE DILIGENCE"
                              Weight: ='TextCanvas.Weight'.Bold
                              Wrap: =false
                        - txtHdrDdSubtitulo_1:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(203, 213, 225, 1)
                              Height: =18
                              Size: =9
                              Text: ="INTEGRITY HUB • COMPLIANCE"
                              Weight: ='TextCanvas.Weight'.Semibold
                              Wrap: =false
                  - txtHdrDdUsuario_1:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.End
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(226, 232, 240, 1)
                        Height: =40
                        PaddingRight: =20
                        Size: =10
                        Text: =User().FullName
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Semibold
                        Width: =230
                        Wrap: =false
            - cntInicioDdBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =10
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - htmlInicioDdPainel:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        HtmlText: |-
                          =With(
                              {
                                  _usuario: User().FullName,
                                  _dataHora: Text(
                                      Now(),
                                      "[$-pt-BR]dd/mm/yyyy HH:mm"
                                  )
                              },
                              "<div style='font-family:Segoe UI,Arial,sans-serif;color:#0F172A;width:100%;height:100%;box-sizing:border-box;'>" &

                              "<div style='background:linear-gradient(135deg,#0F172A 0%,#24105F 58%,#391694 100%);padding:22px 28px;border:1px solid #1E293B;box-sizing:border-box;'>" &
                                  "<table role='presentation' style='width:100%;border-collapse:collapse;table-layout:fixed;'>" &
                                      "<tr>" &
                                          "<td style='vertical-align:middle;'>" &
                                              "<div style='display:inline-block;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);padding:5px 9px;font-size:9px;font-weight:700;letter-spacing:1px;color:#E2E8F0;margin-bottom:10px;'>INTEGRITY HUB • COMPLIANCE</div>" &
                                              "<div style='font-size:29px;line-height:1.12;font-weight:700;color:#FFFFFF;margin-bottom:8px;'>Due Diligence de Terceiros</div>" &
                                              "<div style='font-size:12px;line-height:1.55;color:#CBD5E1;max-width:880px;'>Avaliação estruturada de integridade, exposição e conformidade para apoiar decisões responsáveis durante todo o ciclo de relacionamento com terceiros.</div>" &
                                              "<table role='presentation' style='margin-top:14px;border-collapse:separate;border-spacing:7px 0;'>" &
                                                  "<tr>" &
                                                      "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);padding:5px 9px;font-size:9px;font-weight:700;color:#FFFFFF;'>RISCO PARAMETRIZADO</td>" &
                                                      "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);padding:5px 9px;font-size:9px;font-weight:700;color:#FFFFFF;'>TRILHA DE AUDITORIA</td>" &
                                                      "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);padding:5px 9px;font-size:9px;font-weight:700;color:#FFFFFF;'>DECISÃO RASTREÁVEL</td>" &
                                                  "</tr>" &
                                              "</table>" &
                                              "<div style='margin-top:12px;font-size:10px;color:#A5B4FC;'>Acesso identificado: <strong style='color:#FFFFFF;'>" & _usuario & "</strong> &nbsp;•&nbsp; " & _dataHora & "</div>" &
                                          "</td>" &
                                      "</tr>" &
                                  "</table>" &
                              "</div>" &

                              "<div style='background:#FFFFFF;border:1px solid #E2E8F0;border-top:0;padding:16px 18px;box-sizing:border-box;'>" &
                                  "<table role='presentation' style='width:100%;border-collapse:collapse;margin-bottom:10px;'>" &
                                      "<tr>" &
                                          "<td style='font-size:10px;font-weight:700;letter-spacing:.7px;color:#391694;'>FLUXO DE CONFORMIDADE</td>" &
                                          "<td style='font-size:9px;text-align:right;color:#64748B;'>AVALIAÇÃO • EVIDÊNCIA • DECISÃO</td>" &
                                      "</tr>" &
                                  "</table>" &

                                  "<table role='presentation' style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:8px 0;'>" &
                                      "<tr>" &
                                          "<td style='vertical-align:top;background:#F8FAFC;border:1px solid #E2E8F0;border-top:3px solid #391694;padding:10px 11px;'>" &
                                              "<div style='font-size:17px;font-weight:700;color:#391694;margin-bottom:4px;'>01</div>" &
                                              "<div style='font-size:11px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Solicitação</div>" &
                                              "<div style='font-size:9px;line-height:1.4;color:#64748B;'>Cadastro, contexto da contratação e avaliação do solicitante.</div>" &
                                          "</td>" &
                                          "<td style='vertical-align:top;background:#F8FAFC;border:1px solid #E2E8F0;border-top:3px solid #6366F1;padding:10px 11px;'>" &
                                              "<div style='font-size:17px;font-weight:700;color:#4F46E5;margin-bottom:4px;'>02</div>" &
                                              "<div style='font-size:11px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Terceiro</div>" &
                                              "<div style='font-size:9px;line-height:1.4;color:#64748B;'>Coleta externa de declarações, treinamento e evidências.</div>" &
                                          "</td>" &
                                          "<td style='vertical-align:top;background:#F8FAFC;border:1px solid #E2E8F0;border-top:3px solid #B54708;padding:10px 11px;'>" &
                                              "<div style='font-size:17px;font-weight:700;color:#B54708;margin-bottom:4px;'>03</div>" &
                                              "<div style='font-size:11px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Compliance</div>" &
                                              "<div style='font-size:9px;line-height:1.4;color:#64748B;'>Análise proporcional ao risco e desdobramentos documentados.</div>" &
                                          "</td>" &
                                          "<td style='vertical-align:top;background:#F8FAFC;border:1px solid #E2E8F0;border-top:3px solid #067647;padding:10px 11px;'>" &
                                              "<div style='font-size:17px;font-weight:700;color:#067647;margin-bottom:4px;'>04</div>" &
                                              "<div style='font-size:11px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Decisão</div>" &
                                              "<div style='font-size:9px;line-height:1.4;color:#64748B;'>Parecer, homologação, classificação e preservação do histórico.</div>" &
                                          "</td>" &
                                      "</tr>" &
                                  "</table>" &

                                  "<table role='presentation' style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:8px 0;margin-top:11px;'>" &
                                      "<tr>" &
                                          "<td style='background:#F4F0FF;border:1px solid #DDD6FE;padding:8px 10px;'>" &
                                              "<div style='font-size:9px;font-weight:700;color:#391694;margin-bottom:2px;'>RASTREABILIDADE</div>" &
                                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Autoria, data, contexto e evidência em cada decisão.</div>" &
                                          "</td>" &
                                          "<td style='background:#EFF6FF;border:1px solid #DBEAFE;padding:8px 10px;'>" &
                                              "<div style='font-size:9px;font-weight:700;color:#1D4ED8;margin-bottom:2px;'>PROPORCIONALIDADE</div>" &
                                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Profundidade de análise compatível com a exposição.</div>" &
                                          "</td>" &
                                          "<td style='background:#ECFDF3;border:1px solid #D1FAE5;padding:8px 10px;'>" &
                                              "<div style='font-size:9px;font-weight:700;color:#067647;margin-bottom:2px;'>INTEGRIDADE</div>" &
                                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Ética, transparência e responsabilidade corporativa.</div>" &
                                          "</td>" &
                                      "</tr>" &
                                  "</table>" &
                              "</div>" &
                              "</div>"
                          )
                        LayoutMinHeight: =390
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =!IsBlank(Self.HtmlText)
                        Width: =Min(1180, Parent.Width - 36)
                  - cntInicioDdAcoes:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =52
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Min(1180, Parent.Width - 36)
                      Children:
                        - btnInicioDdAcessar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(57, 22, 148, 1)
                              BorderRadius: =0
                              FontSize: =14
                              Height: =44
                              Icon: ="ArrowRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =Navigate(
                                    ScreenDueDiligence,
                                    ScreenTransition.Fade
                                )
                              Text: ="Acessar o módulo de Due Diligence"
                              Width: =320
                  - htmlInicioDdRodape:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =34
                        HtmlText: |-
                          ="<div style='font-family:Segoe UI,Arial,sans-serif;text-align:center;font-size:9px;line-height:1.35;color:#64748B;padding:6px 12px;border-top:1px solid #E2E8F0;'>Uso corporativo restrito às atividades autorizadas de avaliação, conformidade e gestão de terceiros.</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Min(1180, Parent.Width - 36)
