Screens:
  ScreenDueDiligenceInicio:
    Properties:
      BackgroundImage: =ASUR_RGB_background
      Fill: =RGBA(0, 135, 154, 1)
      ImagePosition: =ImagePosition.Fill
      LoadingSpinnerColor: =RGBA(0, 135, 154, 1)
      OnVisible: |-
        =UpdateContext(
            {
                varDdPodeAnalisarCompliance: IfError(
                    With(
                        {_email: Lower(Trim(User().Email))},
                        !IsBlank(_email) && !IsBlank(LookUp(tb_dueDiligenceCompliance, email = _email && ativo = 1, ID))
                    ),
                    false
                )
            }
        )
    Children:
      - cntInicioRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - hdrDd_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =60
                  LayoutMinWidth: =16
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Image1_1:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =40
                        Image: ='image-removebg-preview'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingRight: =50
                        Width: =170
                  - cntHdrDdTitulo_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtHdrDdTitulo_1:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =27
                              Size: =18
                              Text: ="DUE DILIGENCE"
                              Weight: ='TextCanvas.Weight'.Bold
                              Wrap: =false
                        - txtHdrDdSubtitulo_1:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(203, 213, 225, 1)
                              Height: =18
                              Size: =9
                              Text: ="INTEGRITY HUB • COMPLIANCE"
                              Weight: ='TextCanvas.Weight'.Semibold
                              Wrap: =false
                  - txtHdrDdUsuario_1:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.End
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(226, 232, 240, 1)
                        Height: =40
                        PaddingRight: =20
                        Size: =10
                        Text: =User().FullName
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Semibold
                        Width: =230
                        Wrap: =false
            - cntInicioDdBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =24
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - htmlInicioDdPainel:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        HtmlText: |-
                          =With(
                              {
                                  _usuario: User().FullName,
                                  _dataHora: Text(
                                      Now(),
                                      "[$-pt-BR]dd/mm/yyyy HH:mm"
                                  )
                              },
                              "<div style='font-family:Segoe UI,-apple-system,Helvetica,Arial,sans-serif;color:#0F172A;width:100%;height:100%;box-sizing:border-box;'>" &

                              "<div style='width:100%;border:1px solid rgba(15,23,42,.06);box-shadow:0 26px 60px -20px rgba(0,180,205,.35),0 10px 24px -12px rgba(15,23,42,.35);box-sizing:border-box;'>" &

                              "<div style='background:linear-gradient(135deg,#0F172A 0%,#005864 48%,#00879A 85%,#00CBE6 145%);padding:28px 32px;box-sizing:border-box;'>" &
                              "<table role='presentation' style='width:100%;border-collapse:collapse;table-layout:fixed;'>" &
                              "<tr>" &
                              "<td style='vertical-align:middle;'>" &
                              "<div style='display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:#E2E8F0;margin-bottom:12px;'>INTEGRITY HUB • COMPLIANCE</div>" &
                              "<div style='font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.3px;color:#FFFFFF;margin-bottom:9px;'>Due Diligence de Terceiros</div>" &
                              "<div style='font-size:12.5px;line-height:1.6;color:#CBD5E1;max-width:640px;'>Avaliação estruturada de integridade, exposição e conformidade que orienta decisões responsáveis em todo o ciclo de relacionamento com terceiros.</div>" &
                              "<table role='presentation' style='margin-top:16px;border-collapse:separate;border-spacing:8px 0;'>" &
                              "<tr>" &
                              "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:.4px;color:#FFFFFF;'>RISCO PARAMETRIZADO</td>" &
                              "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:.4px;color:#FFFFFF;'>TRILHA DE AUDITORIA</td>" &
                              "<td style='background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:6px 11px;font-size:9px;font-weight:700;letter-spacing:.4px;color:#FFFFFF;'>DECISÃO RASTREÁVEL</td>" &
                              "</tr>" &
                              "</table>" &
                              "<div style='margin-top:16px;font-size:10px;color:#A5B4FC;'>Acesso identificado: <strong style='color:#FFFFFF;'>" & _usuario & "</strong>&nbsp;•&nbsp;" & _dataHora & "</div>" &
                              "</td>" &
                              "</tr>" &
                              "</table>" &
                              "</div>" &

                              "<div style='background:#FFFFFF;padding:22px 24px 24px;box-sizing:border-box;'>" &
                              "<table role='presentation' style='width:100%;border-collapse:collapse;margin-bottom:12px;'>" &
                              "<tr>" &
                              "<td style='font-size:10px;font-weight:800;letter-spacing:.7px;color:#00879A;'><span style='display:inline-block;width:6px;height:6px;background:#00879A;margin-right:7px;'></span>FLUXO DE CONFORMIDADE</td>" &
                              "<td style='font-size:9px;text-align:right;color:#64748B;letter-spacing:.3px;'>AVALIAÇÃO • EVIDÊNCIA • DECISÃO</td>" &
                              "</tr>" &
                              "</table>" &

                              "<table role='presentation' style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:9px 0;'>" &
                              "<tr>" &
                              "<td style='vertical-align:top;background:#FFFFFF;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid #E2E8F0;border-top:3px solid #00879A;padding:14px 13px;'>" &
                              "<div style='display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#00879A;color:#FFFFFF;font-size:12px;font-weight:800;border-radius:50%;margin-bottom:9px;'>1</div>" &
                              "<div style='font-size:11.5px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Solicitação</div>" &
                              "<div style='font-size:9px;line-height:1.45;color:#64748B;'>Cadastro, contexto da contratação e avaliação do solicitante.</div>" &
                              "</td>" &
                              "<td style='vertical-align:top;background:#FFFFFF;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid #E2E8F0;border-top:3px solid #6366F1;padding:14px 13px;'>" &
                              "<div style='display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#6366F1;color:#FFFFFF;font-size:12px;font-weight:800;border-radius:50%;margin-bottom:9px;'>2</div>" &
                              "<div style='font-size:11.5px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Terceiro</div>" &
                              "<div style='font-size:9px;line-height:1.45;color:#64748B;'>Coleta externa de declarações, treinamento e evidências.</div>" &
                              "</td>" &
                              "<td style='vertical-align:top;background:#FFFFFF;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid #E2E8F0;border-top:3px solid #B54708;padding:14px 13px;'>" &
                              "<div style='display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#B54708;color:#FFFFFF;font-size:12px;font-weight:800;border-radius:50%;margin-bottom:9px;'>3</div>" &
                              "<div style='font-size:11.5px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Compliance</div>" &
                              "<div style='font-size:9px;line-height:1.45;color:#64748B;'>Análise proporcional ao risco e desdobramentos documentados.</div>" &
                              "</td>" &
                              "<td style='vertical-align:top;background:#FFFFFF;box-shadow:0 1px 3px rgba(15,23,42,.08);border:1px solid #E2E8F0;border-top:3px solid #067647;padding:14px 13px;'>" &
                              "<div style='display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#067647;color:#FFFFFF;font-size:12px;font-weight:800;border-radius:50%;margin-bottom:9px;'>4</div>" &
                              "<div style='font-size:11.5px;font-weight:700;color:#0F172A;margin-bottom:3px;'>Decisão</div>" &
                              "<div style='font-size:9px;line-height:1.45;color:#64748B;'>Parecer, classificação, vigência e preservação do histórico.</div>" &
                              "</td>" &
                              "</tr>" &
                              "</table>" &

                              "<table role='presentation' style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:9px 0;margin-top:12px;'>" &
                              "<tr>" &
                              "<td style='background:#EBF5F7;border:1px solid #BFE1E6;box-shadow:0 1px 2px rgba(15,23,42,.04);padding:9px 11px;'>" &
                              "<div style='font-size:9px;font-weight:800;letter-spacing:.3px;color:#00879A;margin-bottom:2px;'><span style='display:inline-block;width:6px;height:6px;background:#00879A;margin-right:6px;'></span>RASTREABILIDADE</div>" &
                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Autoria, data, contexto e evidência em cada decisão.</div>" &
                              "</td>" &
                              "<td style='background:#EFF6FF;border:1px solid #DBEAFE;box-shadow:0 1px 2px rgba(15,23,42,.04);padding:9px 11px;'>" &
                              "<div style='font-size:9px;font-weight:800;letter-spacing:.3px;color:#1D4ED8;margin-bottom:2px;'><span style='display:inline-block;width:6px;height:6px;background:#1D4ED8;margin-right:6px;'></span>PROPORCIONALIDADE</div>" &
                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Profundidade de análise compatível com a exposição.</div>" &
                              "</td>" &
                              "<td style='background:#ECFDF3;border:1px solid #D1FAE5;box-shadow:0 1px 2px rgba(15,23,42,.04);padding:9px 11px;'>" &
                              "<div style='font-size:9px;font-weight:800;letter-spacing:.3px;color:#067647;margin-bottom:2px;'><span style='display:inline-block;width:6px;height:6px;background:#067647;margin-right:6px;'></span>INTEGRIDADE</div>" &
                              "<div style='font-size:9px;line-height:1.35;color:#64748B;'>Ética, transparência e responsabilidade corporativa.</div>" &
                              "</td>" &
                              "</tr>" &
                              "</table>" &
                              "</div>" &
                              "</div>" &
                              "</div>"
                          )
                        LayoutMinHeight: =390
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =!IsBlank(Self.HtmlText)
                        Width: =Min(1180, Parent.Width - 36)
                  - cntInicioDdAcoes:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =52
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Min(1180, Parent.Width - 36)
                      Children:
                        - btnInicioDdAcessar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(0, 135, 154, 1)
                              BorderRadius: =0
                              FontSize: =14
                              Height: =44
                              Icon: ="ArrowRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =Navigate(
                                    ScreenDueDiligence,
                                    ScreenTransition.Fade
                                )
                              Text: ="Acessar o módulo de Due Diligence"
                              Width: =320
                        - btnInicioDdPainel:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =RGBA(0, 135, 154, 1)
                              BorderRadius: =0
                              FontSize: =14
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =Navigate(
                                    ScreenDueDiligencePainel,
                                    ScreenTransition.Fade
                                )
                              Text: ="Painel de indicadores"
                              Visible: =varDdPodeAnalisarCompliance
                              Width: =260
                  - htmlInicioDdRodape:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =34
                        HtmlText: |-
                          ="<div style='font-family:Segoe UI,Arial,sans-serif;text-align:center;font-size:9px;line-height:1.35;color:#64748B;padding:6px 12px;border-top:1px solid #E2E8F0;'>Uso corporativo restrito às atividades autorizadas de avaliação, conformidade e gestão de terceiros.</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Min(1180, Parent.Width - 36)
