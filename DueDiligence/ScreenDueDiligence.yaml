Screens:
  ScreenDueDiligence:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =UpdateContext(
            {
                varVisibleDueDiligence: "Registros",
                varAcaoDueDiligence: Blank(),
                varRegistroDueDiligence: Blank(),
                varVisibleProcessandoDd: false,
                varVisibleExcluirDd: false,
                varVisibleInstrucoesDd: false,
                varColunaOrdenacaoDd: "ID",
                varDirecaoOrdenacaoDd: SortOrder.Descending,
                varPontuacaoSolicitanteForm: 0,
                varEncerraBaixoForm: false
            }
        );
        If(
            IsEmpty(colDdParametros),
            ClearCollect(
                colDdParametros,
                SortByColumns(
                    Filter(
                        tb_dueDiligenceParametros,
                        ativo = 1 && versao_questionario = 1
                    ),
                    "ordem",
                    SortOrder.Ascending
                )
            )
        )
    Children:
      - cntDdRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - hdrDd_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(15, 23, 42, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =60
                  LayoutMinWidth: =16
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Image1_3:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =40
                        Image: =MOTIVA_RGB_Logo_VersaoNegativa_Branca
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingRight: =50
                        Width: =170
                  - cntHdrDdTitulo_2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtHdrDdTitulo_2:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =27
                              Size: =18
                              Text: ="DUE DILIGENCE"
                              Weight: ='TextCanvas.Weight'.Bold
                              Wrap: =false
                        - txtHdrDdSubtitulo_2:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(203, 213, 225, 1)
                              Height: =18
                              Size: =9
                              Text: ="INTEGRITY HUB • COMPLIANCE"
                              Weight: ='TextCanvas.Weight'.Semibold
                              Wrap: =false
                  - txtHdrDdUsuario_2:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.End
                        Font: =Font.'Segoe UI'
                        FontColor: =RGBA(226, 232, 240, 1)
                        Height: =40
                        PaddingRight: =20
                        Size: =10
                        Text: =User().FullName
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Semibold
                        Width: =230
                        Wrap: =false
            - cntDdBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntDdMain:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =2
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =650
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntDdTabs:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(229, 229, 229, 1)
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingLeft: =2
                              PaddingRight: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =530
                            Children:
                              - btnDdNovo:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(varVisibleDueDiligence = Self.Text, 'ButtonCanvas.Appearance'.Secondary, 'ButtonCanvas.Appearance'.Transparent)
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    BorderRadius: =0
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    FontColor: =If(varVisibleDueDiligence = Self.Text, RGBA(57, 22, 148, 1), RGBA(148, 163, 184, 1))
                                    FontSize: =16
                                    Height: =40
                                    Icon: ="Add"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =UpdateContext(
                                          {
                                              varVisibleDueDiligence: Self.Text,
                                              varAcaoDueDiligence: "new",
                                              varRegistroDueDiligence: Defaults(tb_dueDiligence)
                                          }
                                      );
                                      NewForm(frmDdSolicitante);
                                      SetFocus(txt_cnpj_cpf)
                                    Text: ="Nova Solicitação"
                                    Width: =190
                              - btnDdRegistros:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(varVisibleDueDiligence = Self.Text, 'ButtonCanvas.Appearance'.Secondary, 'ButtonCanvas.Appearance'.Transparent)
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    BorderRadius: =0
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    FontColor: =If(varVisibleDueDiligence = Self.Text, RGBA(57, 22, 148, 1), RGBA(148, 163, 184, 1))
                                    FontSize: =16
                                    Height: =40
                                    Icon: ="History"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =UpdateContext(
                                          {
                                              varVisibleDueDiligence: Self.Text,
                                              varAcaoDueDiligence: Blank(),
                                              varRegistroDueDiligence: Blank()
                                          }
                                      )
                                    Text: ="Registros"
                                    Width: =170
                              - Text1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: =
                              - btnInicioDdAcessar_1:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(57, 22, 148, 1)
                                    BorderRadius: =0
                                    FontSize: =16
                                    Height: =40
                                    Icon: ="ArrowExit"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Navigate(
                                          ScreenDueDiligenceInicio,
                                          ScreenTransition.Fade
                                      )
                                    Text: ="Voltar ao início"
                                    Width: =170
                        - cntDdCadastro:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varVisibleDueDiligence = "Nova Solicitação"
                            Children:
                              - HtmlText1:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    HtmlText: |-
                                      =With(
                                          {
                                              _selecoes: Table(
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s01.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s01.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s02.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s02.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: If(
                                                          dd_s02.Selected.texto_opcao = "Sim",
                                                          Coalesce(
                                                              dd_s03.Selected.pontuacao,
                                                              0
                                                          ),
                                                          0
                                                      ),
                                                      encerra: If(
                                                          dd_s02.Selected.texto_opcao = "Sim",
                                                          Coalesce(
                                                              dd_s03.Selected.encerra_risco_baixo,
                                                              0
                                                          ),
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s04.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s04.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s05.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s05.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s06.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s06.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s07.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s07.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s08.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s08.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s11.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s11.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s12.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s12.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s13.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s13.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s14.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s14.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s15.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s15.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s16.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s16.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s17.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s17.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  },
                                                  {
                                                      pontuacao: Coalesce(
                                                          dd_s19.Selected.pontuacao,
                                                          0
                                                      ),
                                                      encerra: Coalesce(
                                                          dd_s19.Selected.encerra_risco_baixo,
                                                          0
                                                      )
                                                  }
                                              ),
                                              _pontTerceiro: Coalesce(
                                                  varRegistroDueDiligence.pontuacao_terceiro,
                                                  0
                                              ),
                                              _temRespostaTerceiro: !IsBlank(varRegistroDueDiligence.data_resposta_terceiro),
                                              _limite: Coalesce(
                                                  LookUp(
                                                      colDdParametros,
                                                      codigo_opcao = "config_limite_risco_alto",
                                                      pontuacao
                                                  ),
                                                  300
                                              )
                                          },
                                          With(
                                              {
                                                  _pontSolicitante: Sum(
                                                      _selecoes,
                                                      pontuacao
                                                  ),
                                                  _encerraSolicitante: CountIf(
                                                      _selecoes,
                                                      encerra = 1
                                                  ) > 0
                                              },
                                              With(
                                                  {
                                                      _pontTotal: _pontSolicitante + _pontTerceiro,
                                                      _percentual: Min(
                                                          100,
                                                          Round(
                                                              ((_pontSolicitante + _pontTerceiro) / If(
                                                                  _limite <= 0,
                                                                  1,
                                                                  _limite
                                                              )) * 100,
                                                              0
                                                          )
                                                      ),
                                                      _resultado: If(
                                                          _encerraSolicitante,
                                                          "Baixo",
                                                          _temRespostaTerceiro,
                                                          Coalesce(
                                                              varRegistroDueDiligence.classificacao_risco,
                                                              "Em avaliação"
                                                          ),
                                                          "Em avaliação"
                                                      ),
                                                      _statusFluxo: If(
                                                          varAcaoDueDiligence = "new",
                                                          "Em preenchimento",
                                                          _encerraSolicitante,
                                                          "Encerramento automático",
                                                          _temRespostaTerceiro,
                                                          Coalesce(
                                                              varRegistroDueDiligence.status,
                                                              "Pendente Compliance"
                                                          ),
                                                          Coalesce(
                                                              varRegistroDueDiligence.status,
                                                              "Aguardando envio ao terceiro"
                                                          )
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          _corResultado: Switch(
                                                              Lower(_resultado),
                                                              "alto",
                                                              "#B42318",
                                                              "baixo",
                                                              "#067647",
                                                              "médio",
                                                              "#B54708",
                                                              "medio",
                                                              "#B54708",
                                                              "#391694"
                                                          ),
                                                          _fundoResultado: Switch(
                                                              Lower(_resultado),
                                                              "alto",
                                                              "#FEF3F2",
                                                              "baixo",
                                                              "#ECFDF3",
                                                              "médio",
                                                              "#FFFAEB",
                                                              "medio",
                                                              "#FFFAEB",
                                                              "#F4F0FF"
                                                          ),
                                                          _textoTerceiro: If(
                                                              _temRespostaTerceiro,
                                                              Text(
                                                                  _pontTerceiro,
                                                                  "0"
                                                              ),
                                                              "—"
                                                          ),
                                                          _subTextoTerceiro: If(
                                                              _temRespostaTerceiro,
                                                              "Resposta externa processada",
                                                              "Aguardando Microsoft Forms"
                                                          )
                                                      },
                                                      "<div style='font-family:Segoe UI,Arial,sans-serif;background:#F8FAFC;border:1px solid #E2E8F0;padding:12px 14px;box-sizing:border-box'>" & "<table role='presentation' style='width:100%;border-collapse:collapse;margin-bottom:9px'>" & "<tr>" & "<td style='font-size:11px;font-weight:700;letter-spacing:.7px;color:#391694'>RESUMO DA AVALIAÇÃO</td>" & "<td style='font-size:10px;text-align:right;color:#64748B'>" & If(
                                                          IsBlank(varRegistroDueDiligence.ID),
                                                          "NOVA SOLICITAÇÃO",
                                                          "DD-" & Text(
                                                              varRegistroDueDiligence.ID,
                                                              "000000"
                                                          )
                                                      ) & "</td>" & "</tr>" & "</table>" & "<table role='presentation' style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:8px 0'>" & "<tr>" & "<td style='vertical-align:top;background:#FFFFFF;border:1px solid #E2E8F0;border-top:3px solid #391694;padding:10px 12px'>" & "<div style='font-size:9px;font-weight:700;letter-spacing:.5px;color:#64748B'>PONTUAÇÃO SOLICITANTE</div>" & "<div style='font-size:25px;line-height:30px;font-weight:700;color:#24105F'>" & Text(
                                                          _pontSolicitante,
                                                          "0"
                                                      ) & "</div>" & "<div style='font-size:10px;color:#94A3B8'>Questionário interno</div>" & "</td>" & "<td style='vertical-align:top;background:#FFFFFF;border:1px solid #E2E8F0;border-top:3px solid #64748B;padding:10px 12px'>" & "<div style='font-size:9px;font-weight:700;letter-spacing:.5px;color:#64748B'>PONTUAÇÃO TERCEIRO</div>" & "<div style='font-size:25px;line-height:30px;font-weight:700;color:#0F172A'>" & _textoTerceiro & "</div>" & "<div style='font-size:10px;color:#94A3B8'>" & _subTextoTerceiro & "</div>" & "</td>" & "<td style='vertical-align:top;background:#FFFFFF;border:1px solid #E2E8F0;border-top:3px solid " & _corResultado & ";padding:10px 12px'>" & "<div style='font-size:9px;font-weight:700;letter-spacing:.5px;color:#64748B'>PONTUAÇÃO TOTAL</div>" & "<div style='font-size:25px;line-height:30px;font-weight:700;color:#0F172A'>" & Text(
                                                          _pontTotal,
                                                          "0"
                                                      ) & "</div>" & "<div style='height:5px;background:#E2E8F0;margin-top:4px'>" & "<div style='height:5px;width:" & Text(
                                                          _percentual,
                                                          "0"
                                                      ) & "%;background:" & _corResultado & "'></div>" & "</div>" & "<div style='font-size:9px;color:#94A3B8;margin-top:4px'>Referência de risco alto: " & Text(
                                                          _limite,
                                                          "0"
                                                      ) & "</div>" & "</td>" & "<td style='vertical-align:top;background:#FFFFFF;border:1px solid #E2E8F0;border-top:3px solid " & _corResultado & ";padding:10px 12px'>" & "<div style='font-size:9px;font-weight:700;letter-spacing:.5px;color:#64748B;margin-bottom:7px'>RESULTADO / FLUXO</div>" & "<span style='display:inline-block;padding:4px 9px;background:" & _fundoResultado & ";color:" & _corResultado & ";font-size:10px;font-weight:700'>" & Upper(_resultado) & "</span>" & "<div style='font-size:10px;font-weight:600;color:#475569;margin-top:8px'>" & _statusFluxo & "</div>" & "</td>" & "</tr>" & "</table>" & "</div>"
                                                  )
                                              )
                                          )
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Visible: =varVisibleDueDiligence = "Nova Solicitação"
                                    Width: =Parent.Width - 40
                              - frmDdSolicitante:
                                  Control: Form@2.4.4
                                  Layout: Vertical
                                  Properties:
                                    DataSource: =tb_dueDiligence
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =2500
                                    Item: =varRegistroDueDiligence
                                    OnFailure: |-
                                      =UpdateContext({varVisibleProcessandoDd: false});
                                      Notify(
                                          "Não foi possível salvar a solicitação: " & Self.Error,
                                          NotificationType.Error,
                                          10000
                                      )
                                    OnSuccess: |-
                                      =With(
                                          {
                                              _registroAtualizado: Self.LastSubmit,
                                              _statusAnterior: Coalesce(varRegistroDueDiligence.status, Blank())
                                          },
                                          IfError(
                                              Patch(
                                                  tb_dueDiligenceDesdobramentos,
                                                  Defaults(tb_dueDiligenceDesdobramentos),
                                                  {
                                                      solicitacao_id: _registroAtualizado.ID,
                                                      tipo_desdobramento: If(varAcaoDueDiligence = "new", "Criação", "Atualização do solicitante"),
                                                      status_anterior: _statusAnterior,
                                                      status_novo: _registroAtualizado.status,
                                                      descricao: If(
                                                          varAcaoDueDiligence = "new",
                                                          If(_registroAtualizado.status = "Encerrado - risco baixo", "Solicitação criada e encerrada automaticamente por regra de risco baixo.", "Solicitação criada. O envio do formulário externo ao terceiro será processado pelo Power Automate."),
                                                          "Dados do solicitante e pontuação recalculados."
                                                      ),
                                                      visivel_solicitante: 1,
                                                      ativo: 1
                                                  }
                                              ),
                                              Notify(
                                                  "A solicitação foi salva, mas o histórico não pôde ser registrado.",
                                                  NotificationType.Warning,
                                                  8000
                                              )
                                          );
                                          UpdateContext(
                                              {
                                                  varRegistroDueDiligence: _registroAtualizado,
                                                  varVisibleProcessandoDd: false,
                                                  varVisibleDueDiligence: "Registros",
                                                  varAcaoDueDiligence: Blank(),
                                                  varPontuacaoSolicitanteForm: 0,
                                                  varEncerraBaixoForm: false
                                              }
                                          );
                                          Refresh(tb_dueDiligence);
                                          Refresh(tb_dueDiligenceDesdobramentos);
                                          ResetForm(Self);
                                          Notify(
                                              "Solicitação salva com sucesso.",
                                              NotificationType.Success
                                          )
