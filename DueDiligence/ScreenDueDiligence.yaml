                                    Y: =6
                                  Children:
                                    - lblDdPrazoResposta:
                                        Control: Text@0.0.51
                                        Properties:
                                          Height: =22
                                          Text: ="Prazo para resposta (opcional)"
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =10
                                    - dpDdPrazoResposta:
                                        Control: DatePicker@0.0.46
                                        MetadataKey: DateFieldValue
                                        Properties:
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderRadius: =0
                                          DateTimeZone: ='DatePickerCanvas.DateTimeZone'.Local
                                          Format: ='DatePickerCanvas.Format'.Short
                                          Height: =40
                                          SelectedDate: =Parent.Default
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =36
                              - ativo_desdobramento_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: NumberEdit
                                  Properties:
                                    DataField: ="ativo"
                                    Default: =1
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, ativo)
                                    Required: =true
                                    Update: =1
                                    Visible: =false
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =7
                              - anexos_desdobramento_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicAttachmentsEdit
                                  Properties:
                                    DataField: ="{Attachments}"
                                    Default: =ThisItem.Anexos
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, Anexos)
                                    Height: =150
                                    Required: =false
                                    Update: =attDdDesdobramento.Attachments
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =8
                                  Children:
                                    - lblDdAnexosDesdobramento:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =34
                                          Size: =10
                                          Text: ="Anexos"
                                          Width: =Parent.Width - 60
                                          X: =24
                                          Y: =10
                                    - attDdDesdobramento:
                                        Control: Attachments@2.3.0
                                        MetadataKey: FieldValue
                                        Properties:
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderThickness: =1
                                          DisplayMode: =Parent.DisplayMode
                                          Font: =Font.'Open Sans'
                                          Height: =100
                                          ItemColor: =RGBA(255, 255, 255, 1)
                                          ItemFill: =RGBA(56, 96, 178, 1)
                                          Items: =Parent.Default
                                          MaxAttachmentSize: =90
                                          PaddingBottom: =5
                                          PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                                          PaddingRight: =5
                                          PaddingTop: =5
                                          Size: =10
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =44
                        - cntDdAcoesDesdobramento:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =10
                              PaddingLeft: =23
                              PaddingRight: =23
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =cntDdDesdTitulo.Visible
                            Children:
                              - btnDdRegistrarDesdobramento:
                                  Control: Button@0.0.45
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    BorderRadius: =0
                                    DisplayMode: =If(varAcaoDueDiligence = "edit", DisplayMode.Edit, DisplayMode.Disabled)
                                    FillPortions: =1
                                    Height: =40
                                    OnSelect: |-
                                      =If(
                                          IsBlank(cmbDdTipoDesdobramento.Selected.Value) ||
                                          IsBlank(cmbDdDesdStatusNovo.Selected.Value) ||
                                          IsBlank(Trim(txtDdDesdDescricao.Value)),
                                          Notify(
                                              "Preencha Tipo de desdobramento, Novo status e Descrição antes de registrar.",
                                              NotificationType.Warning,
                                              8000
                                          ),
                                          UpdateContext({varVisibleProcessandoDd: true});
                                          SubmitForm(frmDdDesdobramento)
                                      )
                                    Text: ="Registrar desdobramento e atualizar status"
                                    Visible: =varAcaoDueDiligence = "edit"
                                    Width: =290
                                    X: =Parent.Width - 210
                                    Y: =10
                        - txtDdHistoricoTitulo:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =RGBA(57, 22, 148, 1)
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =14
                              Text: ="HISTÓRICO"
                              VerticalAlign: =VerticalAlign.Bottom
                        - htmlDdHistorico:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              HtmlText: |-
                                =With(
                                    {
                                        _itens: SortByColumns(
                                            Filter(
                                                tb_dueDiligenceDesdobramentos,
                                                solicitacao_id = varRegistroDueDiligence.ID && ativo = 1
                                            ),
                                            "Created",
                                            SortOrder.Descending
                                        )
                                    },
                                    "<div style='padding:8px 4px;font-family:Segoe UI,sans-serif;font-size:13px'>" &
                                    If(
                                        IsEmpty(_itens),
                                        "<div style='padding:24px 16px;background:#f9fafb;border:1px dashed #d1d5db;text-align:center;color:#6b7280;font-weight:700'>Nenhum desdobramento registrado</div>",
                                        Concat(
                                            _itens As D,
                                            "<div style='margin-bottom:14px;background:#fff;border:1px solid #e5e7eb;border-left:4px solid #391694;padding:10px 12px'>" &
                                            "<div style='display:flex;justify-content:space-between;margin-bottom:7px'>" &
                                            "<span style='font-size:11px;font-weight:700;color:#391694'>" & Upper(D.tipo_desdobramento) & "</span>" &
                                            "<span style='font-size:10px;color:#9ca3af'>" & Text(D.Created, "[$-pt-BR]dd/mm/yyyy HH:mm") & "</span></div>" &
                                            "<div style='font-size:11px;color:#64748b;margin-bottom:7px'>" & Coalesce(D.status_anterior, "-") & " → " & Coalesce(D.status_novo, "-") & "</div>" &
                                            "<div style='font-size:12px;color:#374151;background:#f9fafb;padding:8px'>" & Substitute(Coalesce(D.descricao, "Sem descrição"), Char(10), "<br>") & "</div>" &
                                            "<div style='margin-top:7px;font-size:10px;color:#9ca3af'>&#128100; " & D.'Criado por'.DisplayName & "</div></div>"
                                        )
                                    ) & "</div>"
                                )
      - cntDdProcessando:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 0.92)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varVisibleProcessandoDd
            Width: =Parent.Width
          Children:
            - icoDdProcessando:
                Control: Icon@0.0.7
                Properties:
                  Height: =70
                  Icon: ="Clock"
                  IconColor: =RGBA(57, 22, 148, 1)
                  Width: =70
            - txtDdProcessando:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  FontColor: =RGBA(2, 16, 59, 1)
                  Height: =55
                  Size: =28
                  Text: ="Processando..."
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =500
      - cntDdExcluir:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varVisibleExcluirDd
            Width: =Parent.Width
          Children:
            - cntDdExcluirCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =300
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =15
                  PaddingBottom: =20
                  PaddingLeft: =25
                  PaddingRight: =25
                  PaddingTop: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =400
                Children:
                  - txtDdExcluirTitulo:
                      Control: Text@0.0.51
                      Properties:
                        FontColor: =RGBA(2, 16, 59, 1)
                        Height: =45
                        Size: =22
                        Text: ="Excluir solicitação"
                        Weight: ='TextCanvas.Weight'.Bold
                  - txtDdExcluirMensagem:
                      Control: Text@0.0.51
                      Properties:
                        AutoHeight: =true
                        FillPortions: =1
                        FontColor: =RGBA(103, 107, 112, 1)
                        Text: ="Deseja excluir a solicitação DD-" & Text(varRegistroDueDiligence.ID, "000000") & "? Os desdobramentos vinculados também serão removidos."
                  - cntDdExcluirBotoes:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =15
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnDdExcluirCancelar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              FillPortions: =1
                              Height: =45
                              OnSelect: |-
                                =UpdateContext({varVisibleExcluirDd: false})
                              Text: ="Cancelar"
                        - btnDdExcluirConfirmar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              FillPortions: =1
                              Height: =45
                              OnSelect: |-
                                =UpdateContext({varVisibleProcessandoDd: true, varVisibleExcluirDd: false});
                                IfError(
                                    RemoveIf(
                                        tb_dueDiligenceDesdobramentos,
                                        solicitacao_id = varRegistroDueDiligence.ID
                                    );
                                    Remove(
                                        tb_dueDiligence,
                                        varRegistroDueDiligence
                                    );
                                    Notify(
                                        "Solicitação excluída com sucesso.",
                                        NotificationType.Success
                                    );
                                    UpdateContext(
                                        {
                                            varVisibleProcessandoDd: false,
                                            varRegistroDueDiligence: Blank()
                                        }
                                    ),
                                    UpdateContext({varVisibleProcessandoDd: false});
                                    Notify(
                                        "Não foi possível excluir a solicitação.",
                                        NotificationType.Error,
                                        10000
                                    )
                                )
                              Text: ="Confirmar"
