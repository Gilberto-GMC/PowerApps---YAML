                                                            IsBlank(dpDdDataInicio.SelectedDate) || Created >= dpDdDataInicio.SelectedDate,
                                                            IsBlank(dpDdDataFim.SelectedDate) || Created < DateAdd(dpDdDataFim.SelectedDate, 1, TimeUnit.Days)
                                                        ),
                                                        Filter(
                                                            tb_dueDiligence,
                                                            ativo = 1,
                                                            StartsWith(razao_social, _busca) || StartsWith(cnpj_cpf, _busca),
                                                            IsBlank(cmbDdFiltroStatus.Selected.Value) || status = cmbDdFiltroStatus.Selected.Value,
                                                            IsBlank(dpDdDataInicio.SelectedDate) || Created >= dpDdDataInicio.SelectedDate,
                                                            IsBlank(dpDdDataFim.SelectedDate) || Created < DateAdd(dpDdDataFim.SelectedDate, 1, TimeUnit.Days)
                                                        )
                                                    ),
                                                    varColunaOrdenacaoDd,
                                                    varDirecaoOrdenacaoDd
                                                )
                                            )
                                          TemplateSize: =72
                                        Children:
                                          - cntDdLinha:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =70
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =5
                                                PaddingLeft: =20
                                                PaddingRight: =15
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.Width - 10
                                              Children:
                                                - lblDdId:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Size: =10
                                                      Text: ="DD-"&Text(ThisItem.ID, "000000")
                                                      Width: =110
                                                - lblDdData:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Size: =10
                                                      Text: =Text(ThisItem.Created, "[$-pt-BR]dd/mm/yyyy")
                                                      Width: =125
                                                - lblDdRazao:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Size: =10
                                                      Text: =ThisItem.razao_social
                                                      Tooltip: =ThisItem.razao_social
                                                      Width: =200
                                                - lblDdDocumento:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Size: =10
                                                      Text: =ThisItem.cnpj_cpf
                                                      Width: =160
                                                - lblDdPontuacao:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Align: =Align.Center
                                                      FontWeight: =FontWeight.Semibold
                                                      Size: =10
                                                      Text: =Text(If(IsBlank(ThisItem.data_resposta_terceiro), Coalesce(ThisItem.pontuacao_solicitante, 0), Coalesce(ThisItem.pontuacao_total, 0)), "0")
                                                      Tooltip: |-
                                                        ="Solicitante: " & Text(Coalesce(ThisItem.pontuacao_solicitante, 0), "0") & " | Terceiro: " & Text(Coalesce(ThisItem.pontuacao_terceiro, 0), "0")
                                                      Width: =95
                                                - lblDdRisco:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Align: =Align.Center
                                                      Color: =Switch(ThisItem.classificacao_risco, "Alto", Color.Red, "Baixo", RGBA(17, 141, 92, 1), RGBA(100, 116, 139, 1))
                                                      FontWeight: =FontWeight.Semibold
                                                      Size: =10
                                                      Text: =Coalesce(ThisItem.classificacao_risco, "-")
                                                - htmlDdStatus:
                                                    Control: HtmlViewer@2.1.0
                                                    Properties:
                                                      Height: =70
                                                      HtmlText: |-
                                                        =With(
                                                            {
                                                                _cor: Switch(
                                                                    ThisItem.status,
                                                                    "Aprovado", "#118D5C",
                                                                    "Aprovado com ressalvas", "#C47F00",
                                                                    "Reprovado parcialmente", "#D97706",
                                                                    "Reprovado", "#D93025",
                                                                    "Cancelado", "#64748B",
                                                                    "#391694"
                                                                ),
                                                                _fundo: Switch(
                                                                    ThisItem.status,
                                                                    "Aprovado", "#E1F9ED",
                                                                    "Aprovado com ressalvas", "#FFF4D6",
                                                                    "Reprovado parcialmente", "#FFF4D6",
                                                                    "Reprovado", "#FFE5E5",
                                                                    "Cancelado", "#F1F5F9",
                                                                    "#F3F0FF"
                                                                )
                                                            },
                                                            "<div style='text-align:center;padding-top:18px;font-family:Segoe UI'><span style='display:inline-block;padding:5px 12px;background:" & _fundo & ";color:" & _cor & ";font-size:10px;font-weight:700'>" & Upper(ThisItem.status) & "</span></div>"
                                                        )
                                                      Width: =250
                                                - lblDdAcoesCab_2:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Align: =Align.Center
                                                      FillPortions: =1
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinWidth: =0
                                                      Size: =10
                                                      Text: =
                                                      Width: =110
                                                - tbDdAcoes:
                                                    Control: Toolbar@2.0.5
                                                    Properties:
                                                      Alignment: ='Toolbar.Alignment'.Vertical
                                                      Height: =40
                                                      Items: |-
                                                        =Table(
                                                            {ItemKey: "ver", ItemDisplayName: "Ver", ItemIconName: "Eye", ItemTooltip: "Visualizar"},
                                                            {
                                                                ItemKey: "editar",
                                                                ItemDisplayName: "Editar",
                                                                ItemIconName: "Edit",
                                                                ItemDisabled: ThisItem.status in ["Encerrado - risco baixo", "Aprovado", "Aprovado com ressalvas", "Reprovado parcialmente", "Reprovado", "Cancelado"],
                                                                ItemTooltip: "Editar"
                                                            },
                                                            {
                                                                ItemKey: "terceiro",
                                                                ItemDisplayName: If(ThisItem.status = "Aguardando terceiro", "Reenviar Forms", "Enviar Forms"),
                                                                ItemIconName: "Send",
                                                                ItemDisabled: Not(ThisItem.status in ["Aguardando envio ao terceiro", "Aguardando terceiro", "Erro no envio ao terceiro"]),
                                                                ItemTooltip: "Solicitar ao Power Automate o envio do Microsoft Forms"
                                                            },
                                                            {ItemKey: "excluir", ItemDisplayName: "Excluir", ItemIconName: "Delete", ItemTooltip: "Excluir"}
                                                        )
                                                      OnSelect: |-
                                                        =Switch(
                                                            Self.Selected.ItemKey,
                                                            "ver",
                                                            UpdateContext(
                                                                {
                                                                    varRegistroDueDiligence: ThisItem,
                                                                    varVisibleDueDiligence: "Nova Solicitação",
                                                                    varAcaoDueDiligence: "view"
                                                                }
                                                            );
                                                            ViewForm(frmDdSolicitante);
                                                            ViewForm(frmDdDesdobramento),
                                                            "editar",
                                                            UpdateContext(
                                                                {
                                                                    varRegistroDueDiligence: ThisItem,
                                                                    varVisibleDueDiligence: "Nova Solicitação",
                                                                    varAcaoDueDiligence: "edit"
                                                                }
                                                            );
                                                            EditForm(frmDdSolicitante);
                                                            NewForm(frmDdDesdobramento),
                                                            "terceiro",
                                                            With(
                                                                {
                                                                    _registroBase: LookUp(tb_dueDiligence, ID = ThisItem.ID),
                                                                    _statusAnterior: ThisItem.status
                                                                },
                                                                IfError(
                                                                    With(
                                                                        {
                                                                            _registroAtualizado: Patch(
                                                                                tb_dueDiligence,
                                                                                _registroBase,
                                                                                {status: "Aguardando envio ao terceiro"}
                                                                            )
                                                                        },
                                                                        IfError(
                                                                            Patch(
                                                                                tb_dueDiligenceDesdobramentos,
                                                                                Defaults(tb_dueDiligenceDesdobramentos),
                                                                                {
                                                                                    solicitacao_id: ThisItem.ID,
                                                                                    tipo_desdobramento: If(_statusAnterior = "Aguardando terceiro", "Solicitação de reenvio ao terceiro", "Solicitação de envio ao terceiro"),
                                                                                    status_anterior: _statusAnterior,
                                                                                    status_novo: "Aguardando envio ao terceiro",
                                                                                    descricao: "O envio do Microsoft Forms foi colocado na fila do Power Automate para o e-mail " & ThisItem.email_terceiro & ".",
                                                                                    visivel_solicitante: 1,
                                                                                    ativo: 1
                                                                                }
                                                                            ),
                                                                            Notify(
                                                                                "O envio foi colocado na fila, mas o histórico da solicitação não pôde ser criado.",
                                                                                NotificationType.Warning,
                                                                                8000
                                                                            )
                                                                        );
                                                                        Refresh(tb_dueDiligence);
                                                                        Refresh(tb_dueDiligenceDesdobramentos);
                                                                        Notify(
                                                                            "Solicitação de envio registrada. O Power Automate deverá enviar o Forms e atualizar o status para Aguardando terceiro.",
                                                                            NotificationType.Success,
                                                                            8000
                                                                        )
                                                                    ),
                                                                    Notify(
                                                                        "Não foi possível colocar o envio do Forms na fila.",
                                                                        NotificationType.Error,
                                                                        10000
                                                                    )
                                                                )
                                                            ),
                                                            "excluir",
                                                            UpdateContext(
                                                                {
                                                                    varRegistroDueDiligence: ThisItem,
                                                                    varVisibleExcluirDd: true
                                                                }
                                                            )
                                                        )
                                                      Width: =60
                                    - lblDdQtd:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100, 116, 139, 1)
                                          Fill: =RGBA(248, 250, 252, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =35
                                          PaddingLeft: =20
                                          Size: =10
                                          Text: =galDdRegistros.AllItemsCount & " REGISTRO(S) ENCONTRADO(S)"
                  - cntDdDesdobramentos:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(235, 240, 245, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =16
                        LayoutMinWidth: =380
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =!IsBlank(varRegistroDueDiligence.ID) && (varAcaoDueDiligence = "edit" || varAcaoDueDiligence = "view")
                      Children:
                        - cntDdDesdTitulo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varAcaoDueDiligence <> "view"
                            Children:
                              - txtDdDesdTitulo:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(57, 22, 148, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    Size: =14
                                    Text: ="DESDOBRAMENTOS"
                              - btnDdInstrucoes:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =RGBA(57, 22, 148, 1)
                                    Icon: ="Warning"
                                    Layout: =ButtonLayout.IconAfter
                                    OnSelect: |-
                                      =UpdateContext({varVisibleInstrucoesDd: !varVisibleInstrucoesDd})
                                    Text: =""
                                    Width: =45
                        - htmlDdInstrucoes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              HtmlText: |-
                                ="<div style='font-family:Segoe UI;font-size:12px;background:#f4f7f9;border:1px solid #dbe3ea;padding:12px;color:#334155'><strong>Orientação:</strong> registre cada dúvida, resposta, parecer ou alteração de status como um desdobramento. Use a opção de visibilidade para controlar o que poderá ser consultado pelo solicitante.</div>"
                              Visible: =varVisibleInstrucoesDd
                        - frmDdDesdobramento:
                            Control: Form@2.4.4
                            Layout: Vertical
                            Properties:
                              DataSource: =tb_dueDiligenceDesdobramentos
                              FillPortions: =0
                              Height: =650
                              Item: =Defaults(tb_dueDiligenceDesdobramentos)
                              OnFailure: |-
                                =UpdateContext({varVisibleProcessandoDd: false});
                                Notify(
                                    "Não foi possível registrar o desdobramento: " & Self.Error,
                                    NotificationType.Error,
                                    10000
                                )
                              OnSuccess: |-
                                =With(
                                    {
                                        _desdobramento: Self.LastSubmit,
                                        _idSolicitacao: Value(Self.LastSubmit.solicitacao_id),
                                        _statusNovo: Trim(Coalesce(Self.LastSubmit.status_novo, ""))
                                    },
                                    With(
                                        {
                                            _registroBase: LookUp(tb_dueDiligence, ID = _idSolicitacao)
                                        },
                                        If(
                                            IsBlank(_registroBase.ID) || IsBlank(_statusNovo),
                                            Remove(tb_dueDiligenceDesdobramentos, _desdobramento);
                                            UpdateContext({varVisibleProcessandoDd: false});
                                            Notify(
                                                "O desdobramento foi revertido porque o registro principal ou o novo status não foi localizado.",
                                                NotificationType.Error,
                                                10000
                                            ),
                                            IfError(
                                                With(
                                                    {
                                                        _registroAtualizado: Patch(
                                                            tb_dueDiligence,
                                                            _registroBase,
                                                            {
                                                                status: _statusNovo,
                                                                responsavel_compliance_email: If(
                                                                    _statusNovo = "Em análise Compliance",
                                                                    Lower(User().Email),
                                                                    _registroBase.responsavel_compliance_email
                                                                ),
                                                                data_conclusao: If(
                                                                    _statusNovo in ["Encerrado - risco baixo", "Aprovado", "Aprovado com ressalvas", "Reprovado parcialmente", "Reprovado", "Cancelado"],
                                                                    Coalesce(_registroBase.data_conclusao, Now()),
                                                                    Blank()
                                                                )
                                                            }
                                                        )
                                                    },
                                                    UpdateContext(
                                                        {
                                                            varRegistroDueDiligence: _registroAtualizado,
                                                            varVisibleProcessandoDd: false
                                                        }
                                                    );
                                                    ResetForm(Self);
                                                    NewForm(Self);
                                                    Refresh(tb_dueDiligence);
                                                    Refresh(tb_dueDiligenceDesdobramentos);
                                                    Notify(
                                                        "Desdobramento registrado e status principal atualizado para: " & _statusNovo,
                                                        NotificationType.Success,
                                                        7000
                                                    )
                                                ),
                                                Remove(tb_dueDiligenceDesdobramentos, _desdobramento);
                                                UpdateContext({varVisibleProcessandoDd: false});
                                                Notify(
                                                    "O status principal não pôde ser atualizado. O desdobramento foi revertido.",
                                                    NotificationType.Error,
                                                    10000
                                                )
                                            )
                                        )
                                    )
                                )
                              SnapToColumns: =false
                              Visible: =cntDdDesdTitulo.Visible
                            Children:
                              - solicitacao_id_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: NumberEdit
                                  Properties:
                                    DataField: ="solicitacao_id"
                                    Default: =varRegistroDueDiligence.ID
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, solicitacao_id)
                                    Required: =true
                                    Update: =varRegistroDueDiligence.ID
                                    Visible: =false
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                              - tipo_desdobramento_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: TextualEdit
                                  Properties:
                                    DataField: ="tipo_desdobramento"
                                    Default: =ThisItem.tipo_desdobramento
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, tipo_desdobramento)
                                    Height: =90
                                    MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                                    Required: =true
                                    Update: =cmbDdTipoDesdobramento.Selected.Value
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =1
                                  Children:
                                    - lblDdTipoDesdobramento:
                                        Control: Text@0.0.51
                                        MetadataKey: FieldName
                                        Properties:
                                          Height: =22
                                          Text: ="Tipo de desdobramento"
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =10
                                    - cmbDdTipoDesdobramento:
                                        Control: ComboBox@0.0.51
                                        MetadataKey: FieldValue
                                        Properties:
                                          Appearance: ='ComboboxCanvas.Appearance'.FilledLighter
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderRadius: =0
                                          BorderThickness: =1
                                          Height: =40
                                          IsSearchable: =false
                                          Items: =["Envio ao terceiro", "Resposta do terceiro", "Início da análise", "Dúvida Compliance", "Resposta à dúvida", "Parecer final", "Encaminhamento para homologação", "Retorno da homologação", "Reabertura", "Cancelamento"]
                                          Required: =Parent.Required
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =36
                              - status_anterior_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: TextualEdit
                                  Properties:
                                    DataField: ="status_anterior"
                                    Default: =varRegistroDueDiligence.status
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, status_anterior)
                                    MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                                    Required: =false
                                    Update: =varRegistroDueDiligence.status
                                    Visible: =false
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =2
                              - status_novo_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: TextualEdit
                                  Properties:
                                    DataField: ="status_novo"
                                    Default: =ThisItem.status_novo
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, status_novo)
                                    Height: =90
                                    MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                                    Required: =true
                                    Update: =cmbDdDesdStatusNovo.Selected.Value
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =3
                                  Children:
                                    - lblDdDesdStatusNovo:
                                        Control: Text@0.0.51
                                        MetadataKey: FieldName
                                        Properties:
                                          Height: =22
                                          Text: ="Novo status"
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =10
                                    - cmbDdDesdStatusNovo:
                                        Control: ComboBox@0.0.51
                                        MetadataKey: FieldValue
                                        Properties:
                                          Appearance: ='ComboboxCanvas.Appearance'.FilledLighter
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderRadius: =0
                                          BorderThickness: =1
                                          DefaultSelectedItems: =If(IsBlank(varRegistroDueDiligence.status), [], [varRegistroDueDiligence.status])
                                          Height: =40
                                          IsSearchable: =false
                                          Items: =["Aguardando envio ao terceiro", "Aguardando terceiro", "Pendente Compliance", "Em análise Compliance", "Aguardando esclarecimento", "Em homologação", "Aprovado", "Aprovado com ressalvas", "Reprovado parcialmente", "Reprovado", "Cancelado", "Erro no envio ao terceiro"]
                                          Required: =Parent.Required
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =36
                              - descricao_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: TextualEdit
                                  Properties:
                                    DataField: ="descricao"
                                    Default: =ThisItem.descricao
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, descricao)
                                    Height: =155
                                    MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                                    Required: =true
                                    Update: =Trim(txtDdDesdDescricao.Value)
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =4
                                  Children:
                                    - lblDdDesdDescricao:
                                        Control: Text@0.0.51
                                        MetadataKey: FieldName
                                        Properties:
                                          Height: =22
                                          Text: ="Descrição / parecer / resposta"
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =10
                                    - txtDdDesdDescricao:
                                        Control: TextInput@0.0.54
                                        MetadataKey: FieldValue
                                        Properties:
                                          Appearance: ='TextInputCanvas.Appearance'.FilledDarker
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderRadius: =0
                                          BorderThickness: =1
                                          Height: =100
                                          Mode: ='TextInputCanvas.Mode'.Multiline
                                          Placeholder: ="Descreva a ação, dúvida, resposta ou parecer."
                                          Required: =Parent.Required
                                          TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                                          Value: =Parent.Default
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =36
                              - visivel_solicitante_DataCard:
                                  Control: TypedDataCard@1.0.7
                                  Variant: NumberEdit
                                  Properties:
                                    DataField: ="visivel_solicitante"
                                    Default: =Coalesce(ThisItem.visivel_solicitante, 1)
                                    DisplayName: =DataSourceInfo([@tb_dueDiligenceDesdobramentos], DataSourceInfo.DisplayName, visivel_solicitante)
                                    Height: =60
                                    Required: =true
                                    Update: =If(togDdVisivelSolicitante.Checked, 1, 0)
                                    Width: =Parent.Width
