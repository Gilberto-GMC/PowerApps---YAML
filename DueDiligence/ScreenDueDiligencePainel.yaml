                        Height: =40
                        Icon: ="History"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        OnSelect: |-
                          =Navigate(
                              ScreenDueDiligence,
                              ScreenTransition.Fade
                          )
                        Text: ="Registros"
                        Width: =170
                  - btnDdPainelIndicadores:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BorderColor: =RGBA(0, 135, 154, 1)
                        BorderRadius: =0
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =2
                        FontColor: =RGBA(0, 135, 154, 1)
                        FontSize: =16
                        Height: =40
                        Icon: ="Eye"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Text: ="Painel"
                        Width: =150
                  - txtDdPainelEspaco:
                      Control: ModernText@1.0.0
                      Properties:
                        FillPortions: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: =
                  - btnDdPainelAtualizar:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BorderRadius: =0
                        FontSize: =14
                        Height: =40
                        Icon: ="ArrowClockwise"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        OnSelect: |-
                          =UpdateContext(
                              // espelho do OnVisible — manter os dois idênticos
                              {
                                  varDdPainelAcesso: If(
                                      IfError(
                                          With(
                                              {_email: Lower(Trim(User().Email))},
                                              !IsBlank(_email) && !IsBlank(LookUp(tb_dueDiligenceCompliance, email = _email && ativo = 1, ID))
                                          ),
                                          false
                                      ),
                                      "sim",
                                      "nao"
                                  )
                              }
                          );
                          If(
                              varDdPainelAcesso <> "sim",
                              Clear(colDdPainel);
                              Clear(colDdPainelVigencia);
                              Clear(colDdPainelAbertos),
                              varDdPainelCarregando && !IsBlank(varDdPainelDesde) && DateDiff(varDdPainelDesde, Now(), TimeUnit.Seconds) < 60,
                              Notify(
                                  "Aguarde: o painel ainda está sendo atualizado.",
                                  NotificationType.Warning,
                                  3000
                              ),
                              UpdateContext({varDdPainelCarregando: true, varDdPainelDesde: Now()});
                              IfError(
                                  With(
                                      {
                                          _periodo: Coalesce(cmbDdPainelPeriodo.Selected.Value, "Últimos 12 meses"),
                                          _fim: DateAdd(Today(), 1, TimeUnit.Days)
                                      },
                                      With(
                                          {
                                              _ini: Switch(
                                                  _periodo,
                                                  "Últimos 30 dias", DateAdd(Today(), -29, TimeUnit.Days),
                                                  "Últimos 90 dias", DateAdd(Today(), -89, TimeUnit.Days),
                                                  "Ano atual", Date(Year(Today()), 1, 1),
                                                  "Todo o período", With(
                                                      {_primeiro: First(Sort(tb_dueDiligence, Created, SortOrder.Ascending)).Created},
                                                      If(IsBlank(_primeiro), Today(), Date(Year(_primeiro), Month(_primeiro), Day(_primeiro)))
                                                  ),
                                                  DateAdd(Today(), -12, TimeUnit.Months)
                                              )
                                          },
                                          // Janelas de 30 dias: cada Filter é delegável e fica bem abaixo
                                          // do limite de linhas do app, então o período longo não é cortado.
                                          Clear(colDdPainelCarga);
                                          Clear(colDdPainelLotes);
                                          ForAll(
                                              Sequence(RoundUp(DateDiff(_ini, _fim, TimeUnit.Days) / 30, 0)) As _j,
                                              With(
                                                  {
                                                      _lote: ForAll(
                                                          Filter(
                                                              tb_dueDiligence,
                                                              ativo = 1 &&
                                                              Created >= DateAdd(_ini, (_j.Value - 1) * 30, TimeUnit.Days) &&
                                                              Created < DateAdd(_ini, _j.Value * 30, TimeUnit.Days)
                                                          ) As _r,
                                                          {
                                                              ID: _r.ID,
                                                              Created: _r.Created,
                                                              aeroporto: _r.aeroporto,
                                                              area_solicitante: _r.area_solicitante,
                                                              categoria_contraparte: _r.categoria_contraparte,
                                                              tipo_contrato: _r.tipo_contrato,
                                                              classificacao_risco: _r.classificacao_risco,
                                                              status: _r.status,
                                                              fluxo_classificacao: _r.fluxo_classificacao,
                                                              decisao_compliance: _r.decisao_compliance,
                                                              data_envio_terceiro: _r.data_envio_terceiro,
                                                              data_resposta_terceiro: _r.data_resposta_terceiro,
                                                              data_decisao_compliance: _r.data_decisao_compliance
                                                          }
                                                      )
                                                  },
                                                  Collect(colDdPainelCarga, _lote);
                                                  Collect(colDdPainelLotes, {qtd: CountRows(_lote)})
                                              )
                                          );
                                          // Troca só no fim: durante a carga os cartões mantêm o desenho anterior.
                                          ClearCollect(colDdPainel, colDdPainelCarga);
                                          UpdateContext({varDdPainelIni: _ini, varDdPainelFim: Today()})
                                      )
                                  );
                                  ClearCollect(
                                      colDdPainelVigencia,
                                      ForAll(
                                          Filter(
                                              tb_dueDiligence,
                                              ativo = 1 &&
                                              data_vencimento >= DateAdd(Today(), -365, TimeUnit.Days) &&
                                              data_vencimento < DateAdd(Today(), 91, TimeUnit.Days) &&
                                              (status = "Aprovado" || status = "Aprovado com Ressalvas" || status = "Reprovado Parcialmente" || status = "Vencido")
                                          ) As _v,
                                          {
                                              ID: _v.ID,
                                              razao_social: _v.razao_social,
                                              aeroporto: _v.aeroporto,
                                              classificacao_risco: _v.classificacao_risco,
                                              status: _v.status,
                                              data_vencimento: _v.data_vencimento
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colDdPainelAbertos,
                                      ForAll(
                                          Filter(
                                              tb_dueDiligence,
                                              ativo = 1 &&
                                              (status = "Aguardando Terceiro" || status = "Pendente Compliance")
                                          ) As _a,
                                          {
                                              ID: _a.ID,
                                              razao_social: _a.razao_social,
                                              status: _a.status,
                                              Created: _a.Created,
                                              data_envio_terceiro: _a.data_envio_terceiro,
                                              data_resposta_terceiro: _a.data_resposta_terceiro
                                          }
                                      )
                                  );
                                  UpdateContext(
                                      {
                                          varDdPainelSlaTerceiro: With(
                                              {_p: LookUp(tb_dueDiligenceParametros, codigo_opcao = "config_sla_terceiro_dias" && ativo = 1, pontuacao)},
                                              If(Coalesce(_p, 0) > 0, _p, 10)
                                          ),
                                          varDdPainelSlaCompliance: With(
                                              {_p: LookUp(tb_dueDiligenceParametros, codigo_opcao = "config_sla_compliance_dias" && ativo = 1, pontuacao)},
                                              If(Coalesce(_p, 0) > 0, _p, 5)
                                          ),
                                          varDdPainelAtualizadoEm: Now(),
                                          varDdPainelTruncado: CountIf(colDdPainelLotes, qtd >= 500) > 0 || CountRows(colDdPainelVigencia) >= 500 || CountRows(colDdPainelAbertos) >= 500
                                      }
                                  ),
                                  Notify(
                                      "Não foi possível atualizar o painel: " & FirstError.Message,
                                      NotificationType.Error,
                                      10000
                                  )
                              );
                              UpdateContext({varDdPainelCarregando: false, varDdPainelDesde: Blank()})
                          )
                        Text: ="Atualizar"
                        Width: =140
                  - btnDdPainelVoltar:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(0, 135, 154, 1)
                        BorderRadius: =0
                        FontSize: =16
                        Height: =40
                        Icon: ="ArrowExit"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        OnSelect: |-
                          =Navigate(
                              ScreenDueDiligenceInicio,
                              ScreenTransition.Fade
                          )
                        Text: ="Voltar ao início"
                        Width: =190
            - cntDdPainelCorpo:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =18
                  LayoutMinHeight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =18
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =varDdPainelAcesso = "sim"
                Children:
                  - htmDdPainelAtual:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          =With(
                              {
                                  _op: If(varDdPainelCarregando, "opacity:.45;", ""),
                                  _card: "background:#FFFFFF;border:1px solid #E2E8F0;padding:16px 18px;vertical-align:top;",
                                  _abertos: ForAll(
                                      colDdPainelAbertos As _a,
                                      With(
                                          {_compliance: _a.status = "Pendente Compliance"},
                                          {
                                              ID: _a.ID,
                                              razao: Coalesce(_a.razao_social, ""),
                                              etapa: If(_compliance, "Compliance", "Terceiro"),
                                              dias: DateDiff(If(_compliance, Coalesce(_a.data_resposta_terceiro, _a.Created), Coalesce(_a.data_envio_terceiro, _a.Created)), Now(), TimeUnit.Days),
                                              prazo: If(_compliance, varDdPainelSlaCompliance, varDdPainelSlaTerceiro)
                                          }
                                      )
                                  )
                              },
                              With(
                                  {
                                      _vencidas: CountIf(colDdPainelVigencia, status = "Vencido" || data_vencimento < Today()),
                                      _ate30: CountIf(colDdPainelVigencia, status <> "Vencido" && data_vencimento >= Today() && data_vencimento <= DateAdd(Today(), 30, TimeUnit.Days)),
                                      _ate60: CountIf(colDdPainelVigencia, status <> "Vencido" && data_vencimento > DateAdd(Today(), 30, TimeUnit.Days) && data_vencimento <= DateAdd(Today(), 60, TimeUnit.Days)),
                                      _ate90: CountIf(colDdPainelVigencia, status <> "Vencido" && data_vencimento > DateAdd(Today(), 60, TimeUnit.Days)),
                                      _proximos: FirstN(Sort(Filter(colDdPainelVigencia, status <> "Vencido" && data_vencimento >= Today()), data_vencimento, SortOrder.Ascending), 8),
                                      _totTerceiro: CountIf(_abertos, etapa = "Terceiro"),
                                      _totCompliance: CountIf(_abertos, etapa = "Compliance"),
                                      _foraTerceiro: CountIf(_abertos, etapa = "Terceiro" && dias > prazo),
                                      _foraCompliance: CountIf(_abertos, etapa = "Compliance" && dias > prazo),
                                      _antigos: FirstN(Sort(_abertos, dias, SortOrder.Descending), 6)
                                  },
                                  "<div style='font-family:Segoe UI,Arial,sans-serif;" & _op & "'>" &
                                  "<div style='font-size:11px;font-weight:700;letter-spacing:.7px;color:#00879A;'>SITUAÇÃO ATUAL</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 10px;'>Vencimentos e pendências de hoje, em todos os aeroportos. Não dependem do período escolhido mais abaixo.</div>" &
                                  "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;'><tr>" &
                                  "<td style='" & _card & "width:57%;'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Vigências</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Vencidas nos últimos 12 meses e vencimentos dos próximos 90 dias</div>" &
                                  "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;'><tr>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:#8A1C12;margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _vencidas & "</div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>Vencidas</div></td>" &
                                  "<td style='width:8px;'></td>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:#B9281B;margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _ate30 & "</div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>Vencem em até 30 dias</div></td>" &
                                  "<td style='width:8px;'></td>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:#DE5346;margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _ate60 & "</div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>Em 31 a 60 dias</div></td>" &
                                  "<td style='width:8px;'></td>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:#EC8177;margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _ate90 & "</div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>Em 61 a 90 dias</div></td>" &
                                  "</tr></table>" &
                                  "<div style='font-size:11px;font-weight:700;color:#475569;margin:16px 0 6px;'>Próximos vencimentos</div>" &
                                  "<table role='presentation' style='width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;'>" &
                                  If(
                                      IsEmpty(_proximos),
                                      "<tr><td style='padding:10px 0;color:#64748B;border-top:1px solid #F1F5F9;'>Nenhum vencimento nos próximos 90 dias.</td></tr>",
                                      Concat(
                                          _proximos As P,
                                          "<tr>" &
                                          "<td style='padding:7px 8px 7px 0;border-top:1px solid #F1F5F9;'><span style='font-weight:700;color:#0F172A;'>DD-" & Text(P.ID, "000000") & "</span> <span style='color:#475569;'>" & Substitute(Substitute(Substitute(Left(Coalesce(P.razao_social, ""), 34), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & If(Len(Coalesce(P.razao_social, "")) > 34, "…", "") & "</span></td>" &
                                          "<td style='padding:7px 8px 7px 0;border-top:1px solid #F1F5F9;color:#475569;width:22%;'>" & Coalesce(P.aeroporto, "—") & "</td>" &
                                          "<td style='padding:7px 8px 7px 0;border-top:1px solid #F1F5F9;color:#475569;width:12%;'>" & Coalesce(P.classificacao_risco, "—") & "</td>" &
                                          "<td style='padding:7px 0;border-top:1px solid #F1F5F9;text-align:right;white-space:nowrap;color:#0F172A;width:26%;'>" & Text(P.data_vencimento, "[$-pt-BR]dd/mm/yyyy") & "<span style='color:#64748B;'> · em " & DateDiff(Today(), P.data_vencimento, TimeUnit.Days) & " d</span></td>" &
                                          "</tr>"
                                      )
                                  ) &
                                  "</table>" &
                                  "</td>" &
                                  "<td style='width:16px;'></td>" &
                                  "<td style='" & _card & "'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Pendências fora do prazo</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Terceiro: " & varDdPainelSlaTerceiro & " dias após o envio · Compliance: " & varDdPainelSlaCompliance & " dias após a resposta</div>" &
                                  "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;'><tr>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:" & If(_foraTerceiro > 0, "#D93025", "#118D5C") & ";margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _foraTerceiro & "<span style='font-size:12px;font-weight:400;color:#64748B;'> de " & _totTerceiro & "</span></div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>Com o terceiro</div></td>" &
                                  "<td style='width:8px;'></td>" &
                                  "<td style='vertical-align:top;border:1px solid #E2E8F0;padding:10px 12px;'>" &
                                  "<div style='height:4px;width:28px;background:" & If(_foraCompliance > 0, "#D93025", "#118D5C") & ";margin-bottom:8px;'></div>" &
                                  "<div style='font-size:24px;font-weight:700;color:#0F172A;line-height:1.1;'>" & _foraCompliance & "<span style='font-size:12px;font-weight:400;color:#64748B;'> de " & _totCompliance & "</span></div>" &
                                  "<div style='font-size:11px;color:#475569;margin-top:3px;'>No Compliance</div></td>" &
                                  "</tr></table>" &
                                  "<div style='font-size:11px;font-weight:700;color:#475569;margin:16px 0 6px;'>Em aberto há mais tempo</div>" &
                                  "<table role='presentation' style='width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;'>" &
                                  If(
                                      IsEmpty(_antigos),
                                      "<tr><td style='padding:10px 0;color:#64748B;border-top:1px solid #F1F5F9;'>Nenhuma solicitação em aberto.</td></tr>",
                                      Concat(
                                          _antigos As A,
                                          "<tr>" &
                                          "<td style='padding:7px 8px 7px 0;border-top:1px solid #F1F5F9;'><span style='font-weight:700;color:#0F172A;'>DD-" & Text(A.ID, "000000") & "</span> <span style='color:#475569;'>" & Substitute(Substitute(Substitute(Left(A.razao, 24), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & If(Len(A.razao) > 24, "…", "") & "</span></td>" &
                                          "<td style='padding:7px 8px 7px 0;border-top:1px solid #F1F5F9;color:#475569;width:24%;'>" & A.etapa & "</td>" &
                                          "<td style='padding:7px 0;border-top:1px solid #F1F5F9;text-align:right;white-space:nowrap;color:#0F172A;width:22%;'>" & If(A.dias > A.prazo, "<span style='display:inline-block;width:8px;height:8px;background:#D93025;margin-right:6px;'></span>", "") & A.dias & " d</td>" &
                                          "</tr>"
                                      )
                                  ) &
                                  "</table>" &
                                  "<div style='font-size:10px;color:#64748B;margin-top:8px;'><span style='display:inline-block;width:8px;height:8px;background:#D93025;margin-right:6px;'></span>fora do prazo</div>" &
                                  "</td>" &
                                  "</tr></table></div>"
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - cntDdPainelPeriodo:
