                  LayoutMinWidth: =16
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - imgDdPainelLogo:
                      Control: Image@2.2.3
                      Properties:
