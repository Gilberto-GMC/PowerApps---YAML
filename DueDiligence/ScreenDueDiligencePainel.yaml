                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtDdPainelTitulo:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Font: =Font.'Segoe UI'
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =27
