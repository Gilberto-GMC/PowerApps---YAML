                              OnChange: =Select(btnDdPainelAtualizar)
                              Width: =220
                  - htmDdPainelKpis:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          =With(
                              {
                                  _op: If(varDdPainelCarregando, "opacity:.45;", ""),
                                  _tile: "background:#FFFFFF;border:1px solid #E2E8F0;padding:16px 18px;vertical-align:top;",
                                  _total: CountRows(colDdPainel),
                                  _fluxo3: CountIf(colDdPainel, fluxo_classificacao = "FLUXO III"),
                                  _terceiro: CountIf(colDdPainel, status = "Aguardando Terceiro"),
                                  _compliance: CountIf(colDdPainel, status = "Pendente Compliance"),
                                  _aprovado: CountIf(colDdPainel, status = "Aprovado"),
                                  _ressalvas: CountIf(colDdPainel, status = "Aprovado com Ressalvas"),
                                  _automaticas: CountIf(colDdPainel, status = "Aprovado" && IsBlank(decisao_compliance)),
                                  _reprovado: CountIf(colDdPainel, status = "Reprovado"),
                                  _parcial: CountIf(colDdPainel, status = "Reprovado Parcialmente"),
                                  _cancelado: CountIf(colDdPainel, status = "Cancelado"),
                                  _vencido: CountIf(colDdPainel, status = "Vencido")
                              },
                              "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Segoe UI,Arial,sans-serif;" & _op & "'><tr>" &
                              "<td style='" & _tile & "width:26%;border-top:3px solid #00879A;'>" &
                              "<div style='font-size:11px;font-weight:600;color:#475569;'>Solicitações no período</div>" &
                              "<div style='font-size:48px;font-weight:700;color:#0F172A;line-height:1.05;margin-top:6px;'>" & _total & "</div>" &
                              "<div style='font-size:11px;color:#64748B;margin-top:4px;'>" & _fluxo3 & " com due diligence (Fluxo III)</div></td>" &
                              "<td style='width:12px;'></td>" &
                              "<td style='" & _tile & "'>" &
                              "<div style='font-size:11px;font-weight:600;color:#475569;'><span style='display:inline-block;width:8px;height:8px;background:#00879A;margin-right:6px;'></span>Em andamento</div>" &
                              "<div style='font-size:30px;font-weight:700;color:#0F172A;line-height:1.1;margin-top:12px;'>" & (_terceiro + _compliance) & "</div>" &
                              "<div style='font-size:11px;color:#64748B;margin-top:4px;'>" & _terceiro & " com o terceiro · " & _compliance & " no Compliance</div></td>" &
                              "<td style='width:12px;'></td>" &
                              "<td style='" & _tile & "'>" &
                              "<div style='font-size:11px;font-weight:600;color:#475569;'><span style='display:inline-block;width:8px;height:8px;background:#118D5C;margin-right:6px;'></span>Aprovadas</div>" &
                              "<div style='font-size:30px;font-weight:700;color:#0F172A;line-height:1.1;margin-top:12px;'>" & (_aprovado + _ressalvas) & "</div>" &
                              "<div style='font-size:11px;color:#64748B;margin-top:4px;'>" & _ressalvas & " com ressalvas · " & _automaticas & " automáticas</div></td>" &
                              "<td style='width:12px;'></td>" &
                              "<td style='" & _tile & "'>" &
                              "<div style='font-size:11px;font-weight:600;color:#475569;'><span style='display:inline-block;width:8px;height:8px;background:#D93025;margin-right:6px;'></span>Reprovadas</div>" &
                              "<div style='font-size:30px;font-weight:700;color:#0F172A;line-height:1.1;margin-top:12px;'>" & (_reprovado + _parcial) & "</div>" &
                              "<div style='font-size:11px;color:#64748B;margin-top:4px;'>" & _parcial & " parcialmente</div></td>" &
                              "<td style='width:12px;'></td>" &
                              "<td style='" & _tile & "'>" &
                              "<div style='font-size:11px;font-weight:600;color:#475569;'><span style='display:inline-block;width:8px;height:8px;background:#64748B;margin-right:6px;'></span>Canceladas</div>" &
                              "<div style='font-size:30px;font-weight:700;color:#0F172A;line-height:1.1;margin-top:12px;'>" & _cancelado & "</div>" &
                              "<div style='font-size:11px;color:#64748B;margin-top:4px;'>" & If(_vencido > 0, _vencido & " já vencidas no período", "no período") & "</div></td>" &
                              "</tr></table>"
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - htmDdPainelLinha1:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          =With(
                              {
                                  _op: If(varDdPainelCarregando, "opacity:.45;", ""),
                                  _card: "background:#FFFFFF;border:1px solid #E2E8F0;padding:16px 18px;vertical-align:top;",
                                  _total: CountRows(colDdPainel),
                                  _porAero: Sort(
                                      ForAll(
                                          Distinct(colDdPainel, Coalesce(aeroporto, "Não informado")) As _d,
                                          {rotulo: _d.Value, qtd: CountIf(colDdPainel, Coalesce(aeroporto, "Não informado") = _d.Value)}
                                      ),
                                      If(rotulo = "Não informado", -1, qtd),
                                      SortOrder.Descending
                                  ),
                                  _porArea: Sort(
                                      ForAll(
                                          Distinct(colDdPainel, Coalesce(area_solicitante, "Não informado")) As _d,
                                          {rotulo: _d.Value, qtd: CountIf(colDdPainel, Coalesce(area_solicitante, "Não informado") = _d.Value)}
                                      ),
                                      If(rotulo = "Não informado", -1, qtd),
                                      SortOrder.Descending
                                  )
                              },
                              With(
                                  {
                                      _maxAero: If(IsEmpty(_porAero), 1, Max(_porAero, qtd)),
                                      _maxArea: If(IsEmpty(_porArea), 1, Max(_porArea, qtd))
                                  },
                                  "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Segoe UI,Arial,sans-serif;" & _op & "'><tr>" &
                                  "<td style='" & _card & "width:50%;'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Solicitações por aeroporto</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Quantidade de solicitações e % sobre o total do período</div>" &
                                  If(
                                      IsEmpty(_porAero),
                                      "<div style='padding:12px 0;font-size:11px;color:#64748B;'>Nenhuma solicitação no período.</div>",
                                      "<table role='presentation' style='width:100%;border-collapse:collapse;'>" &
                                      Concat(
                                          _porAero As B,
                                          "<tr><td style='padding:4px 10px 4px 0;font-size:11px;color:#334155;width:36%;vertical-align:middle;'>" & B.rotulo & "</td>" &
                                          "<td style='padding:4px 0;white-space:nowrap;vertical-align:middle;'>" &
                                          "<span style='display:inline-block;vertical-align:middle;height:10px;width:" & Text(Max(1, Round(B.qtd / _maxAero * 78, 0))) & "%;background:" & If(B.rotulo = "Não informado", "#94A3B8", "#00879A") & ";border-radius:0 4px 4px 0;'></span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:700;color:#0F172A;'>" & B.qtd & "</span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:4px;font-size:10px;color:#64748B;'>" & If(Round(B.qtd / Max(_total, 1) * 100, 0) = 0, "<1%", Text(Round(B.qtd / Max(_total, 1) * 100, 0)) & "%") & "</span>" &
                                          "</td></tr>"
                                      ) &
                                      "</table>"
                                  ) &
                                  "</td>" &
                                  "<td style='width:16px;'></td>" &
                                  "<td style='" & _card & "'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Solicitações por área solicitante</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Quantidade de solicitações e % sobre o total do período</div>" &
                                  If(
                                      IsEmpty(_porArea),
                                      "<div style='padding:12px 0;font-size:11px;color:#64748B;'>Nenhuma solicitação no período.</div>",
                                      "<table role='presentation' style='width:100%;border-collapse:collapse;'>" &
                                      Concat(
                                          _porArea As B,
                                          "<tr><td style='padding:4px 10px 4px 0;font-size:11px;color:#334155;width:40%;vertical-align:middle;'>" & B.rotulo & "</td>" &
                                          "<td style='padding:4px 0;white-space:nowrap;vertical-align:middle;'>" &
                                          "<span style='display:inline-block;vertical-align:middle;height:10px;width:" & Text(Max(1, Round(B.qtd / _maxArea * 78, 0))) & "%;background:" & If(B.rotulo = "Não informado", "#94A3B8", "#00879A") & ";border-radius:0 4px 4px 0;'></span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:700;color:#0F172A;'>" & B.qtd & "</span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:4px;font-size:10px;color:#64748B;'>" & If(Round(B.qtd / Max(_total, 1) * 100, 0) = 0, "<1%", Text(Round(B.qtd / Max(_total, 1) * 100, 0)) & "%") & "</span>" &
                                          "</td></tr>"
                                      ) &
                                      "</table>"
                                  ) &
                                  "</td>" &
                                  "</tr></table>"
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - htmDdPainelLinha2:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          =With(
                              {
                                  _op: If(varDdPainelCarregando, "opacity:.45;", ""),
                                  _card: "background:#FFFFFF;border:1px solid #E2E8F0;padding:16px 18px;vertical-align:top;",
                                  _total: CountRows(colDdPainel),
                                  _baixo: CountIf(colDdPainel, classificacao_risco = "Baixo"),
                                  _medio: CountIf(colDdPainel, classificacao_risco = "Médio" || classificacao_risco = "Medio"),
                                  _alto: CountIf(colDdPainel, classificacao_risco = "Alto"),
                                  _porCategoria: Sort(
                                      ForAll(
                                          Distinct(colDdPainel, Coalesce(categoria_contraparte, "Não informado")) As _d,
                                          {rotulo: _d.Value, qtd: CountIf(colDdPainel, Coalesce(categoria_contraparte, "Não informado") = _d.Value)}
                                      ),
                                      If(rotulo = "Não informado", -1, qtd),
                                      SortOrder.Descending
                                  )
                              },
                              With(
                                  {
                                      _classif: _baixo + _medio + _alto,
                                      _ultimo: If(_alto > 0, "alto", _medio > 0, "medio", "baixo"),
                                      _maxCat: If(IsEmpty(_porCategoria), 1, Max(_porCategoria, qtd))
                                  },
                                  "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Segoe UI,Arial,sans-serif;" & _op & "'><tr>" &
                                  "<td style='" & _card & "width:42%;'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Classificação de risco</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 14px;'>% sobre as solicitações do período com risco definido</div>" &
                                  If(
                                      _classif = 0,
                                      "<div style='padding:12px 0;font-size:11px;color:#64748B;'>Nenhuma solicitação classificada no período.</div>",
                                      "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:2px 0;table-layout:fixed;'><tr>" &
                                      If(_baixo > 0, "<td style='width:" & Text(Max(1, Round(_baixo / _classif * 100, 0))) & "%;height:18px;padding:0;background:#118D5C;" & If(_ultimo = "baixo", "border-radius:0 4px 4px 0;", "") & "'></td>", "") &
                                      If(_medio > 0, "<td style='width:" & Text(Max(1, Round(_medio / _classif * 100, 0))) & "%;height:18px;padding:0;background:#C47F00;" & If(_ultimo = "medio", "border-radius:0 4px 4px 0;", "") & "'></td>", "") &
                                      If(_alto > 0, "<td style='width:" & Text(Max(1, Round(_alto / _classif * 100, 0))) & "%;height:18px;padding:0;background:#D93025;border-radius:0 4px 4px 0;'></td>", "") &
                                      "</tr></table>" &
                                      "<table role='presentation' style='width:100%;border-collapse:collapse;margin-top:14px;font-size:12px;'>" &
                                      "<tr><td style='width:18px;padding:6px 0;'><div style='width:10px;height:10px;background:#118D5C;'></div></td><td style='padding:6px 0;color:#0F172A;font-weight:600;'>Baixo <span style='font-weight:400;color:#64748B;font-size:11px;'>· vigência de 3 anos</span></td><td style='padding:6px 0;text-align:right;color:#0F172A;font-weight:700;'>" & _baixo & " <span style='font-weight:400;color:#64748B;font-size:11px;'>" & If(_baixo = 0, "—", Round(_baixo / _classif * 100, 0) = 0, "<1%", Text(Round(_baixo / _classif * 100, 0)) & "%") & "</span></td></tr>" &
                                      "<tr><td style='width:18px;padding:6px 0;border-top:1px solid #F1F5F9;'><div style='width:10px;height:10px;background:#C47F00;'></div></td><td style='padding:6px 0;border-top:1px solid #F1F5F9;color:#0F172A;font-weight:600;'>Médio <span style='font-weight:400;color:#64748B;font-size:11px;'>· vigência de 2 anos</span></td><td style='padding:6px 0;border-top:1px solid #F1F5F9;text-align:right;color:#0F172A;font-weight:700;'>" & _medio & " <span style='font-weight:400;color:#64748B;font-size:11px;'>" & If(_medio = 0, "—", Round(_medio / _classif * 100, 0) = 0, "<1%", Text(Round(_medio / _classif * 100, 0)) & "%") & "</span></td></tr>" &
                                      "<tr><td style='width:18px;padding:6px 0;border-top:1px solid #F1F5F9;'><div style='width:10px;height:10px;background:#D93025;'></div></td><td style='padding:6px 0;border-top:1px solid #F1F5F9;color:#0F172A;font-weight:600;'>Alto <span style='font-weight:400;color:#64748B;font-size:11px;'>· vigência de 1 ano</span></td><td style='padding:6px 0;border-top:1px solid #F1F5F9;text-align:right;color:#0F172A;font-weight:700;'>" & _alto & " <span style='font-weight:400;color:#64748B;font-size:11px;'>" & If(_alto = 0, "—", Round(_alto / _classif * 100, 0) = 0, "<1%", Text(Round(_alto / _classif * 100, 0)) & "%") & "</span></td></tr>" &
                                      "</table>"
                                  ) &
                                  If(
                                      _total - _classif > 0,
                                      "<div style='font-size:11px;color:#64748B;margin-top:8px;'>" & (_total - _classif) & " sem classificação de risco (registros legados ou incompletos)</div>",
                                      ""
                                  ) &
                                  "</td>" &
                                  "<td style='width:16px;'></td>" &
                                  "<td style='" & _card & "'>" &
                                  "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Categoria da contraparte</div>" &
                                  "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Quantidade de solicitações e % sobre o total do período</div>" &
                                  If(
                                      IsEmpty(_porCategoria),
                                      "<div style='padding:12px 0;font-size:11px;color:#64748B;'>Nenhuma solicitação no período.</div>",
                                      "<table role='presentation' style='width:100%;border-collapse:collapse;'>" &
                                      Concat(
                                          _porCategoria As B,
                                          "<tr><td style='padding:5px 10px 5px 0;font-size:11px;color:#334155;width:44%;vertical-align:middle;'>" & B.rotulo & "</td>" &
                                          "<td style='padding:5px 0;white-space:nowrap;vertical-align:middle;'>" &
                                          "<span style='display:inline-block;vertical-align:middle;height:10px;width:" & Text(Max(1, Round(B.qtd / _maxCat * 78, 0))) & "%;background:" & If(B.rotulo = "Não informado", "#94A3B8", "#00879A") & ";border-radius:0 4px 4px 0;'></span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:700;color:#0F172A;'>" & B.qtd & "</span>" &
                                          "<span style='display:inline-block;vertical-align:middle;margin-left:4px;font-size:10px;color:#64748B;'>" & If(Round(B.qtd / Max(_total, 1) * 100, 0) = 0, "<1%", Text(Round(B.qtd / Max(_total, 1) * 100, 0)) & "%") & "</span>" &
                                          "</td></tr>"
                                      ) &
                                      "</table>"
                                  ) &
                                  "</td>" &
                                  "</tr></table>"
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - htmDdPainelLinha3:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          =With(
                              {
                                  _op: If(varDdPainelCarregando, "opacity:.45;", ""),
                                  _card: "background:#FFFFFF;border:1px solid #E2E8F0;padding:16px 18px;vertical-align:top;",
                                  _celula: "padding:9px 0;border-top:1px solid #F1F5F9;",
                                  _total: CountRows(colDdPainel),
                                  _tipos: Sort(
                                      ForAll(
                                          Distinct(colDdPainel, Coalesce(tipo_contrato, "Não informado")) As _d,
                                          {rotulo: _d.Value, qtd: CountIf(colDdPainel, Coalesce(tipo_contrato, "Não informado") = _d.Value)}
                                      ),
                                      If(rotulo = "Não informado", -1, qtd),
                                      SortOrder.Descending
                                  ),
                                  _resp: ForAll(
                                      Filter(colDdPainel, !IsBlank(data_envio_terceiro) && !IsBlank(data_resposta_terceiro)) As _x,
                                      {dias: DateDiff(_x.data_envio_terceiro, _x.data_resposta_terceiro, TimeUnit.Hours) / 24}
                                  ),
                                  _anal: ForAll(
                                      Filter(colDdPainel, !IsBlank(data_resposta_terceiro) && !IsBlank(data_decisao_compliance)) As _x,
                                      {dias: DateDiff(_x.data_resposta_terceiro, _x.data_decisao_compliance, TimeUnit.Hours) / 24}
                                  ),
                                  _ciclo: ForAll(
                                      Filter(colDdPainel, fluxo_classificacao = "FLUXO III" && !IsBlank(data_decisao_compliance)) As _x,
                                      {dias: DateDiff(_x.Created, _x.data_decisao_compliance, TimeUnit.Hours) / 24}
                                  ),
                                  _envio: ForAll(
                                      Filter(colDdPainel, !IsBlank(data_envio_terceiro)) As _x,
                                      {dias: DateDiff(_x.Created, _x.data_envio_terceiro, TimeUnit.Minutes) / 1440}
                                  )
                              },
                              With(
                                  {
                                      _topTipos: FirstN(_tipos, 8),
                                      _nOutros: Max(CountRows(_tipos) - 8, 0),
                                      _qOutros: If(CountRows(_tipos) <= 8, 0, Sum(LastN(_tipos, CountRows(_tipos) - 8), qtd)),
                                      _maxTipo: If(IsEmpty(_tipos), 1, Max(_tipos, qtd)),
                                      _nResp: CountRows(_resp),
                                      _nAnal: CountRows(_anal),
                                      _nCiclo: CountRows(_ciclo),
                                      _nEnvio: CountRows(_envio),
                                      _sResp: Sort(_resp, dias, SortOrder.Ascending),
                                      _sAnal: Sort(_anal, dias, SortOrder.Ascending),
                                      _sCiclo: Sort(_ciclo, dias, SortOrder.Ascending),
                                      _sEnvio: Sort(_envio, dias, SortOrder.Ascending),
                                      _okResp: CountIf(_resp, dias <= varDdPainelSlaTerceiro),
                                      _okAnal: CountIf(_anal, dias <= varDdPainelSlaCompliance)
                                  },
                                  With(
                                      {
                                          _medResp: If(_nResp = 0, Blank(), Mod(_nResp, 2) = 1, Index(_sResp, (_nResp + 1) / 2).dias, (Index(_sResp, _nResp / 2).dias + Index(_sResp, _nResp / 2 + 1).dias) / 2),
                                          _medAnal: If(_nAnal = 0, Blank(), Mod(_nAnal, 2) = 1, Index(_sAnal, (_nAnal + 1) / 2).dias, (Index(_sAnal, _nAnal / 2).dias + Index(_sAnal, _nAnal / 2 + 1).dias) / 2),
                                          _medCiclo: If(_nCiclo = 0, Blank(), Mod(_nCiclo, 2) = 1, Index(_sCiclo, (_nCiclo + 1) / 2).dias, (Index(_sCiclo, _nCiclo / 2).dias + Index(_sCiclo, _nCiclo / 2 + 1).dias) / 2),
                                          _medEnvio: If(_nEnvio = 0, Blank(), Mod(_nEnvio, 2) = 1, Index(_sEnvio, (_nEnvio + 1) / 2).dias, (Index(_sEnvio, _nEnvio / 2).dias + Index(_sEnvio, _nEnvio / 2 + 1).dias) / 2),
                                          _medioResp: If(_nResp = 0, Blank(), Sum(_resp, dias) / _nResp),
                                          _medioAnal: If(_nAnal = 0, Blank(), Sum(_anal, dias) / _nAnal),
                                          _medioCiclo: If(_nCiclo = 0, Blank(), Sum(_ciclo, dias) / _nCiclo),
                                          _medioEnvio: If(_nEnvio = 0, Blank(), Sum(_envio, dias) / _nEnvio)
                                      },
                                      "<table role='presentation' style='width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:Segoe UI,Arial,sans-serif;" & _op & "'><tr>" &
                                      "<td style='" & _card & "width:46%;'>" &
                                      "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Tipo de contrato</div>" &
                                      "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Os oito mais frequentes no período; os demais somados em Outros</div>" &
                                      If(
                                          IsEmpty(_tipos),
                                          "<div style='padding:12px 0;font-size:11px;color:#64748B;'>Nenhuma solicitação no período.</div>",
                                          "<table role='presentation' style='width:100%;border-collapse:collapse;'>" &
                                          Concat(
                                              _topTipos As B,
                                              "<tr><td style='padding:4px 10px 4px 0;font-size:11px;color:#334155;width:46%;vertical-align:middle;'>" & B.rotulo & "</td>" &
                                              "<td style='padding:4px 0;white-space:nowrap;vertical-align:middle;'>" &
                                              "<span style='display:inline-block;vertical-align:middle;height:10px;width:" & Text(Max(1, Round(B.qtd / _maxTipo * 78, 0))) & "%;background:" & If(B.rotulo = "Não informado", "#94A3B8", "#00879A") & ";border-radius:0 4px 4px 0;'></span>" &
                                              "<span style='display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:700;color:#0F172A;'>" & B.qtd & "</span>" &
                                              "<span style='display:inline-block;vertical-align:middle;margin-left:4px;font-size:10px;color:#64748B;'>" & If(Round(B.qtd / Max(_total, 1) * 100, 0) = 0, "<1%", Text(Round(B.qtd / Max(_total, 1) * 100, 0)) & "%") & "</span>" &
                                              "</td></tr>"
                                          ) &
                                          If(
                                              _nOutros > 0,
                                              "<tr><td style='padding:4px 10px 4px 0;font-size:11px;color:#64748B;width:46%;vertical-align:middle;'>Outros (" & _nOutros & " tipos)</td>" &
                                              "<td style='padding:4px 0;white-space:nowrap;vertical-align:middle;'>" &
                                              "<span style='display:inline-block;vertical-align:middle;height:10px;width:" & Text(Min(78, Max(1, Round(_qOutros / _maxTipo * 78, 0)))) & "%;background:#94A3B8;border-radius:0 4px 4px 0;'></span>" &
                                              "<span style='display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:700;color:#0F172A;'>" & _qOutros & "</span>" &
                                              "<span style='display:inline-block;vertical-align:middle;margin-left:4px;font-size:10px;color:#64748B;'>" & If(Round(_qOutros / Max(_total, 1) * 100, 0) = 0, "<1%", Text(Round(_qOutros / Max(_total, 1) * 100, 0)) & "%") & "</span>" &
                                              "</td></tr>",
                                              ""
                                          ) &
                                          "</table>"
                                      ) &
                                      "</td>" &
                                      "<td style='width:16px;'></td>" &
                                      "<td style='" & _card & "'>" &
                                      "<div style='font-size:13px;font-weight:700;color:#0F172A;'>Tempo de resposta e SLA</div>" &
                                      "<div style='font-size:11px;color:#64748B;margin:2px 0 12px;'>Dias corridos, sobre as solicitações criadas no período</div>" &
                                      "<table role='presentation' style='width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;'>" &
                                      "<tr style='font-size:10px;font-weight:700;letter-spacing:.3px;color:#64748B;'><td style='padding:0 0 8px;'>ETAPA</td><td style='padding:0 0 8px;text-align:right;width:15%;'>MÉDIA</td><td style='padding:0 0 8px;text-align:right;width:15%;'>MEDIANA</td><td style='padding:0 0 8px 16px;width:32%;'>DENTRO DO PRAZO</td></tr>" &
                                      "<tr><td style='" & _celula & "'><div style='color:#0F172A;font-weight:600;'>Envio do questionário</div><div style='font-size:11px;color:#64748B;'>criação até o envio ao terceiro</div></td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medioEnvio), "—", Text(Round(_medioEnvio * 24, 1)) & " h") & "</td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medEnvio), "—", Text(Round(_medEnvio * 24, 1)) & " h") & "</td>" &
                                      "<td style='" & _celula & "padding-left:16px;font-size:11px;color:#64748B;'>automático</td></tr>" &
                                      "<tr><td style='" & _celula & "'><div style='color:#0F172A;font-weight:600;'>Resposta do terceiro</div><div style='font-size:11px;color:#64748B;'>prazo de " & varDdPainelSlaTerceiro & " dias</div></td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medioResp), "—", Text(Round(_medioResp, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medResp), "—", Text(Round(_medResp, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "padding-left:16px;'>" &
                                      If(
                                          _nResp = 0,
                                          "<span style='font-size:11px;color:#64748B;'>sem respostas</span>",
                                          "<div style='height:8px;background:#D5EEF1;'><div style='height:8px;width:" & Text(Round(_okResp / _nResp * 100, 0)) & "%;background:#00879A;border-radius:0 4px 4px 0;'></div></div>" &
                                          "<div style='font-size:11px;color:#0F172A;margin-top:4px;'><strong>" & If(_okResp > 0 && Round(_okResp / _nResp * 100, 0) = 0, "<1%", Text(Round(_okResp / _nResp * 100, 0)) & "%") & "</strong><span style='color:#64748B;'> · " & _okResp & " de " & _nResp & "</span></div>"
                                      ) &
                                      "</td></tr>" &
                                      "<tr><td style='" & _celula & "'><div style='color:#0F172A;font-weight:600;'>Análise do Compliance</div><div style='font-size:11px;color:#64748B;'>prazo de " & varDdPainelSlaCompliance & " dias após a resposta</div></td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medioAnal), "—", Text(Round(_medioAnal, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medAnal), "—", Text(Round(_medAnal, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "padding-left:16px;'>" &
                                      If(
                                          _nAnal = 0,
                                          "<span style='font-size:11px;color:#64748B;'>sem pareceres</span>",
                                          "<div style='height:8px;background:#D5EEF1;'><div style='height:8px;width:" & Text(Round(_okAnal / _nAnal * 100, 0)) & "%;background:#00879A;border-radius:0 4px 4px 0;'></div></div>" &
                                          "<div style='font-size:11px;color:#0F172A;margin-top:4px;'><strong>" & If(_okAnal > 0 && Round(_okAnal / _nAnal * 100, 0) = 0, "<1%", Text(Round(_okAnal / _nAnal * 100, 0)) & "%") & "</strong><span style='color:#64748B;'> · " & _okAnal & " de " & _nAnal & "</span></div>"
                                      ) &
                                      "</td></tr>" &
                                      "<tr><td style='" & _celula & "'><div style='color:#0F172A;font-weight:600;'>Ciclo completo</div><div style='font-size:11px;color:#64748B;'>criação até o parecer, no Fluxo III</div></td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medioCiclo), "—", Text(Round(_medioCiclo, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "text-align:right;color:#0F172A;'>" & If(IsBlank(_medCiclo), "—", Text(Round(_medCiclo, 1)) & " d") & "</td>" &
                                      "<td style='" & _celula & "padding-left:16px;font-size:11px;color:#64748B;'>" & _nCiclo & " concluída(s)</td></tr>" &
                                      "</table>" &
                                      "</td>" &
                                      "</tr></table>"
                                  )
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                  - htmDdPainelNotas:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Fill: =RGBA(0, 0, 0, 0)
                        HtmlText: |-
                          ="<div style='font-family:Segoe UI,Arial,sans-serif;font-size:11px;color:#64748B;line-height:1.6;border-top:1px solid #E2E8F0;padding-top:10px;'>" &
                          If(
                              varDdPainelTruncado,
                              "<div style='color:#B42318;font-weight:600;margin-bottom:4px;'>Uma das consultas trouxe 500 linhas ou mais. Se o limite de linhas do app for 500, parte dos dados pode ter ficado de fora; escolha um período menor.</div>",
                              ""
                          ) &
                          "Tempos em dias corridos. Prazos atuais: resposta do terceiro em " & varDdPainelSlaTerceiro & " dias e análise do Compliance em " & varDdPainelSlaCompliance & " dias, ajustáveis em tb_dueDiligenceParametros (config_sla_terceiro_dias e config_sla_compliance_dias). " &
                          If(IsBlank(varDdPainelAtualizadoEm), "", "Atualizado às " & Text(varDdPainelAtualizadoEm, "[$-pt-BR]HH:mm") & ".") &
                          "</div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
            - htmDdPainelRestrito:
                Control: HtmlViewer@2.1.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  HtmlText: |-
                    ="<div style='font-family:Segoe UI,Arial,sans-serif;padding:48px 24px;'>" &
                    "<div style='max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-top:3px solid #00879A;padding:24px 28px;'>" &
                    "<div style='font-size:16px;font-weight:700;color:#0F172A;'>Painel restrito ao Compliance</div>" &
                    "<div style='font-size:12px;color:#475569;line-height:1.6;margin-top:8px;'>Os indicadores de due diligence aparecem só para quem está cadastrado na lista tb_dueDiligenceCompliance.</div>" &
                    "<div style='font-size:12px;color:#475569;line-height:1.6;margin-top:8px;'>Se você é do Compliance, peça a inclusão deste login: <strong style='color:#0F172A;'>" & Lower(User().Email) & "</strong></div>" &
                    "</div></div>"
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Visible: =varDdPainelAcesso = "nao"
