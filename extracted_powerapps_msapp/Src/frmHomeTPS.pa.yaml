      - HtmlText3_4:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =333
            HtmlText: "=\"<style>\n    body {\n        font-family: Arial;\n        font-size: 10px;\n        margin: 0;\n    }\n    .header {\n        display: flex;\n        justify-content: space-between;\n        align-items: center;\n        margin-bottom: 10px;\n        padding: 10px;\n    }\n    .title {\n        color: #6600ed;\n        font-size: 18px;\n        font-weight: bold;\n    }\n    .logo {\n        height: 40px;\n    }\n    table {\n        width: 100%;\n        border-collapse: collapse;\n        margin-bottom: 20px;\n    }\n    thead {\n        display: table-header-group;\n    }\n    th, td {\n        border: 1px solid #ddd;\n        padding: 6px;\n        text-align: left;\n    }\n    th {\n        background-color: #f2f2f2;\n    }\n    td {\n        font-size: 10px;\n    }\n    tr:nth-child(even) {\n        background-color: #f9f9f9;\n    }\n    .footer {\n        font-size: 10px;\n        text-align: right;\n        padding: 5px 10px;\n        border-top: 1px solid #ccc;\n    }\n    .col-protocolo {\n        width: 130px;\n        word-break: break-word;\n    }\n    .col-criado {\n        width: 100px;\n        word-break: break-word;\n    }\n</style>\n\n<div class='header'>\n    <div class='title'>Relatório de Inspeção TPS</div>\n</div>\n\n<table>\n    <thead>\n        <tr>\n            <th class='col-protocolo'>Protocolo</th>\n            <th>Criado em</th>\n            <th>Local</th>\n            <th>Item</th>\n            <th>Status</th>\n            <th>Descrição</th>\n        </tr>\n    </thead>\n    <tbody>\" &\n\nConcat(\n   \n        If(\n            !IsBlank(var_consultaItensInspecao),\n            Filter(\n                tbl_inspTPSitens,\n                ID_insp = var_consultaItensInspecao.ID\n            ),\n            FirstN(\n                Sort(\n                    Filter(\n                        tbl_inspTPSitens,\n                        (IsBlank(cmbHomeAeroporto_7.Selected.Result) || StartsWith(\n                            Aeroporto,\n                            Text(cmbHomeAeroporto_7.Selected.Result)\n                        )) && \n                        (IsBlank(cmbHomeBloco_7.Selected.Value) || StartsWith(\n                            Bloco,\n                            Text(cmbHomeBloco_7.Selected.Value)\n                        )) && \n                        (IsBlank(cmbApontStatus_3.Selected.Value) || StartsWith(\n                            Status,\n                            cmbApontStatus_3.Selected.Value\n                        )) && \n                        (IsBlank(cmbHomeLocal_2.Selected.Value) || StartsWith(\n                            Local,\n                            cmbHomeLocal_2.Selected.Value\n                        )) && \n                        (IsBlank(cmbHomeItem_4.Selected.Value) || StartsWith(\n                            Item,\n                            cmbHomeItem_4.Selected.Value\n                        )) && \n                        Criado >= dtpHomeDtfInicio_7.SelectedDate && \n                        Criado <= If(\n                            IsBlank(dtpHomeDtfTermino_7.SelectedDate),\n                            Today(),\n                            DateAdd(dtpHomeDtfTermino_7.SelectedDate, 1, TimeUnit.Days)\n                        )\n                    ),\n                    ID,\n                    SortOrder.Descending\n                ),\n                Value(txtLimitApont_2.Text)\n            )\n        ),\n    \"<tr><td class='col-protocolo'>\" & LookUp(colAeros, Aeroporto = cmbHomeAeroporto_7.Selected.Result).IATA & \"-INSP-TPS-\" & ID & \"</td>\" &\n    \"<td class='col-criado'>\" & Text(Criado, \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</td>\" &\n    \"<td>\" & Local & \"</td>\" &\n    \"<td>\" & Item & \"</td>\" &\n    \"<td>\" & Status & \"</td>\" &\n    \"<td>\" & Descricao & \"</td></tr>\"\n) &\n\n\"</tbody></table>\n<div class='footer'>Gerado em: \" & Text(Now(), \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div>\"\n"
            Size: =10
            Visible: =false
            Width: =556
            X: =810
            Y: =435
