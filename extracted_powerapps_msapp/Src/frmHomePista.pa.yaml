      - HtmlText3_5:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =290
            HtmlText: |
              ="<style>
                  body {
                      font-family: Arial;
                      font-size: 10px;
                      margin: 0;
                  }
                  .header, .section {
                      padding: 10px;
                      margin-bottom: 10px;
                  }
                  .section-title {
                      font-weight: bold;
                      color: #6600ed;
                      font-size: 14px;
                      margin-bottom: 5px;
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-top: 10px;
                  }
                  th, td {
                      border: 1px solid #ddd;
                      padding: 6px;
                      text-align: left;
                      font-size: 10px;
                  }
                  th {
                      background-color: #f2f2f2;
                  }
                  tr:nth-child(even) {
                      background-color: #f9f9f9;
                  }
                  .footer {
                      font-size: 10px;
                      text-align: right;
                      padding: 5px 10px;
                      border-top: 1px solid #ccc;
                      margin-top: 10px;
                  }
              </style>

              <div class='header'>
                  <div class='section-title'>Relatório de Inspeção de Pista</div>

                  <table>
                      <tbody>
                          <tr><th>Protocolo</th><td>" & Var_InspPistaRelatorios.IATA & "-INSP-PISTA-" & Var_InspPistaRelatorios.ID & "</td></tr>
                          <tr><th>Aeroporto</th><td>" & Var_InspPistaRelatorios.Bloco & " - " & Var_InspPistaRelatorios.IATA & " - " & Var_InspPistaRelatorios.Aeroporto & "</td></tr>
                          <tr><th>Tipo</th><td>" & Var_InspPistaRelatorios.TipoInsp & " - " & Var_InspPistaRelatorios.MotivEsp & " - " & Var_InspPistaRelatorios.DescEsp & "</td></tr>
                          <tr><th>Início</th><td>" & Var_InspPistaRelatorios.Data & " - " & Var_InspPistaRelatorios.Inicio & "</td></tr>
                          <tr><th>Término</th><td>" & Var_InspPistaRelatorios.DataFim & " - " & Var_InspPistaRelatorios.Fim & "</td></tr>
                          <tr><th>Status</th><td>" & Var_InspPistaRelatorios.Status & "</td></tr>
                          <tr><th>Criador</th><td>" & Var_InspPistaRelatorios.Usuario & "</td></tr>
                      </tbody>
                  </table>
              </div>

              <div class='section'>
                  <div class='section-title'>Não Conformidades</div>
                  <table>
                      <thead>
                          <tr>
                              <th>Item</th>
                              <th>Identificação</th>
                              <th>Nº Chamado</th>
                              <th>Data</th>
                              <th>Usuário</th>
                              <th>Descrição</th>
                          </tr>
                      </thead>
                      <tbody>" &

                      Concat(
                          Sort(col_relatorioPistaNaoConforme, "local", SortOrder.Ascending) As item,
                          "<tr>
                              <td>" & item.Local & " > " & item.Item & " > <b>" & item.sIten & "</b></td>
                              <td>" & If(IsBlank(item.Identificação), "N/A", item.Identificação) & "</td>
                              <td>" & item.Chamado & "</td>
                              <td>" & Text(item.Criado, "[$-pt-BR]dd/mm/yyyy") & "</td>
                              <td>" & item.'Criado por'.DisplayName & "</td>
                              <td>" & item.Descricao & "</td>
                          </tr>"
                      ) &

                      "</tbody>
                  </table>
              </div>

              <div class='section'>
                  <div class='section-title'>Itens Sem Alterações</div>
                  <table>
                      <thead>
                          <tr>
                              <th>Local</th>
                              <th>Categoria</th>
                              <th>Item</th>
                              <th>Status</th>
                          </tr>
                      </thead>
                      <tbody>" &

                      Concat(
                          Sort(
                              Sort(
                                  Sort(col_relatorioPistaConforme, item, SortOrder.Ascending),
                                  categoria, SortOrder.Ascending
                              ),
                              local, SortOrder.Ascending
                          ) As item,
                          "<tr>
                              <td>" & item.local & "</td>
                              <td>" & item.categoria & "</td>
                              <td>" & item.item & "</td>
                              <td>" & If(item.item = "Outros", "N/A", "<b><font style='color: #16630b'>Conforme</font></b>") & "</td>
                          </tr>"
                      ) &

                      "</tbody>
                  </table>
              </div>

              <div class='footer'>Gerado em: " & Text(Now(), "[$-pt-BR]dd/mm/yyyy HH:mm") & "</div>"
            Size: =10
            Visible: =false
            Width: =530
            X: =836
