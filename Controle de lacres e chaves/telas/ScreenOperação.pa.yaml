                        NumberOfColumns: =1
                        OnSuccess: |-
                          =
                          // Captura os IDs uma única vez
                          With(
                              {
                                  idChave: Self.LastSubmit.id_chave,
                                  idEntrega: Self.LastSubmit.id_entrega
                              },
                              // Executa tudo em paralelo e trata erros
                              IfError(
                                  Concurrent(
                                      // 1) Fonte de dados principal - CHAVE
                                      Patch(
                                          tbl_chave,
                                          {ID: idChave},// Evita LookUp: usa o ID direto
                                          {ativo: false}
                                      ),
                                      // 2) Coleção local espelhada - CHAVE
                                      UpdateIf(
                                          col_chave,
                                          ID = idChave,
                                          {ativo: false}
                                      ),
                                      // 3) Fonte de dados principal - MOVIMENTAÇÕES
                                      Patch(
                                          tbl_movimentacoes,
                                          {ID: idEntrega},// Evita LookUp: usa o ID direto
                                          {operacao: "Extraviada"}
                                      ),
                                      // 4) Coleção local espelhada - MOVIMENTAÇÕES
                                      UpdateIf(
                                          col_movimentacoes,
                                          ID = idEntrega,
                                          {operacao: "Extraviada"}
                                      )
                                  ),
                                  // OnError: mensagens de erro claras
                                  Notify(
                                      "Não foi possível marcar a chave como extraviada. Tente novamente ou verifique sua conexão.",
                                      NotificationType.Error
                                  ),
                                  // OnSuccess: confirmação
                                  Navigate(
                                      ScreenSucesso,
                                      ScreenTransition.Fade,
                                      {var_navigateSucess: ScreenOperação}
                                  )
                              )
                          );
                          // Fecha o formulário primeiro (UI responsiva)
                          UpdateContext({var_formExtravio: false})
