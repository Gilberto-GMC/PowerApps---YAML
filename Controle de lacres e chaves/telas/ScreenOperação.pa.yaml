                      Children:
                        - HtmlConfirmaLoteDev:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              HtmlText: |-
                                ="<div style='font-family:Segoe UI; font-size:12px; color:#222;'>" &
                                Concat(
                                    col_movSel,
                                    "<div style='padding:4px 0; border-bottom:1px solid #eee;'><strong>" & Identificacao & "</strong> — retirada por " & Coalesce(sequencial_colaborador, "-") & "</div>"
                                ) &
                                If(
                                    CountRows(Distinct(col_movSel, sequencial_colaborador)) > 1,
                                    "<div style='margin-top:8px; padding:6px 8px; background-color:#fff4ce; border-left:3px solid #f0a30a; font-size:11px;'>Estas chaves foram retiradas por <strong>pessoas diferentes</strong>. Se você escolher um nome acima, ele será gravado como quem devolveu em todas; deixando em branco, cada uma mantém quem a retirou.</div>",
                                    ""
                                ) &
                                "</div>"
                              Size: =10
                              Width: =Parent.Width
                  - BotoesConfirmaLoteDev:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingLeft: =10
                        PaddingRight: =10
                      Children:
                        - ButtonConfDevNao:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =UpdateContext({var_confirmaLoteDev: false})
                              Text: ="Não"
                              Width: =80
                        - ButtonConfDevSim:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =UpdateContext({var_confirmaLoteDev: false});

                                // Devolucao e UPDATE do proprio registro da retirada, nao insert.
                                // Patch por {ID: ...} e o padrao do FormExtravio.OnSuccess desta
                                // mesma tela. Cada campo abaixo copia o Update do DataCard.
                                With(
                                    {
                                        dtEntrega: If(
                                            Not IsBlank(DateValue2_1.SelectedDate),
                                            DateTime(
                                                Year(DateValue2_1.SelectedDate),
                                                Month(DateValue2_1.SelectedDate),
                                                Day(DateValue2_1.SelectedDate),
                                                Value(HourValue2_1.Selected.Value),
                                                Value(MinuteValue2_1.Selected.Value),
                                                Second(DateValue2_1.SelectedDate)
                                            )
                                        )
                                    },
                                    IfError(
                                        ForAll(
                                            col_movSel As M,
                                            Patch(
                                                tbl_movimentacoes,
                                                {ID: M.ID},
                                                {
                                                    operacao: "Devolução",
                                                    data_hora_entrega: dtEntrega,
                                                    responsavel_recebimento: DataCardValue7_1.Value,
                                                    sequencial_colaborador_entrega: Coalesce(
                                                        ComboBoxRazaoSocial_4.Selected.Nome,
                                                        M.sequencial_colaborador
                                                    ),
                                                    observacao_recebimento: DataCardValue8_1.Value
                                                }
                                            )
                                        ),

                                        Notify(
                                            "Não foi possível concluir a devolução em lote. " &
                                            Coalesce(FirstError.Message, "Erro não informado.") &
                                            " ATENÇÃO: parte das chaves pode ter sido devolvida. Atualize a lista e confira.",
                                            NotificationType.Error,
                                            8000
                                        ),

                                        // Ordem obrigatoria: RemoveIf ANTES do Clear. Invertido,
                                        // o "in col_movSel.ID" nao casaria com ninguem e as chaves
                                        // devolvidas ficariam na lista ate o proximo Atualizar.
                                        RemoveIf(
                                            col_movimentacoes,
                                            ThisRecord.ID in col_movSel.ID
                                        );
                                        Clear(col_movSel);
                                        UpdateContext(
                                            {
                                                var_formDevolucao: false,
                                                var_modoLoteDev: false
                                            }
                                        );
                                        ResetForm(FormDevolucao);
                                        Navigate(
                                            ScreenSucesso,
                                            ScreenTransition.Fade,
                                            {var_navigateSucess: ScreenOperação}
                                        )
                                    )
                                )
