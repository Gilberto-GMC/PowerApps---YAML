      - ContainerConfirmaLoteRet:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =var_confirmaLoteRet
            Width: =Parent.Width
          Children:
            - CardConfirmaLoteRet:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Height: =360
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =460
                Children:
                  - TituloConfirmaLoteRet:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingLeft: =10
                        PaddingRight: =10
                      Children:
                        - IconConfirmaLoteRet:
                            Control: Icon@0.0.7
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Height: =30
                              Icon: ="Warning"
                              IconColor: =RGBA(0, 0, 0, 1)
                              IconStyle: ='Icon.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =40
                              Width: =30
                        - LabelConfirmaLoteRet:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Size: =11
                              Text: |-
                                ="Confirmar a retirada de " & CountRows(col_chaveSel) & " chave(s) para " & ComboBoxRazaoSocial_6.Selected.Nome & "?"
                  - ListaConfirmaLoteRet:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingLeft: =12
                        PaddingRight: =12
                      Children:
                        - HtmlConfirmaLoteRet:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Fill: =RGBA(0, 0, 0, 0)
                              HtmlText: |-
                                ="<div style='font-family:Segoe UI; font-size:12px; color:#222;'>" &
                                Concat(
                                    col_chaveSel,
                                    "<div style='padding:4px 0; border-bottom:1px solid #eee;'><strong>" & identificacao & "</strong> — " & local &
                                    If(reservada, " <span style='color:#d13438; font-weight:600;'>(restrita)</span>", "") & "</div>"
                                ) &
                                "<div style='padding:8px 0; font-size:11px; color:#666;'>Devolução prevista: " & Text(DateAdd(DateValue1.SelectedDate, Value(dcvNumDias.Value)), "dd/mm/yyyy") & "</div></div>"
                              Size: =10
                              Width: =Parent.Width
                  - BotoesConfirmaLoteRet:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingLeft: =10
                        PaddingRight: =10
                      Children:
                        - ButtonConfRetNao:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =UpdateContext({var_confirmaLoteRet: false})
                              Text: ="Não"
                              Width: =80
                        - ButtonConfRetSim:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =UpdateContext({var_confirmaLoteRet: false});

                                // =======================================================
                                // 1 - REVALIDACAO. Os predicados delegaveis vao no Filter
                                //     contra a tabela; a intersecao com a selecao acontece
                                //     depois, local. E o mesmo arranjo do ButtonAtualizar,
                                //     e e o que mantem a consulta delegada.
                                // =======================================================
                                With(
                                    {
                                        idsOcupadosAgora: ShowColumns(
                                            Filter(
                                                tbl_movimentacoes,
                                                aeroporto = Coalesce(
                                                    ComboboxCanvasAeroporto.Selected.Value,
                                                    varAeroUser
                                                ) && operacao = "Retirada"
                                            ),
                                            id_chave
                                        )
                                    },
                                    With(
                                        {
                                            conflitos: Filter(
                                                col_chaveSel,
                                                ID in idsOcupadosAgora
                                            )
                                        },
                                        If(
                                            CountRows(conflitos) > 0,

                                            // Conflito: nao grava NADA. A assinatura foi colhida
                                            // para aquele conjunto -- gravar so parte seria pior.
                                            Notify(
                                                "Estas chaves foram retiradas por outro operador enquanto você preenchia: " &
                                                Concat(
                                                    conflitos,
                                                    identificacao & "; "
                                                ) &
                                                " Elas foram desmarcadas. Confira a lista e confirme de novo.",
                                                NotificationType.Error,
                                                8000
                                            );
                                            RemoveIf(
                                                col_chaveSel,
                                                ThisRecord.ID in idsOcupadosAgora
                                            ),

                                            // =======================================================
                                            // 2 - GRAVACAO. Cada campo abaixo e copia literal do
                                            //     Update do DataCard correspondente do FormRetirada.
                                            //     So id_chave muda (vem do ForAll) e lote e novo.
                                            // =======================================================
                                            With(
                                                {
                                                    loteCod: "L" & Text(Year(Now()), "0000") & Text(Month(Now()), "00") & Text(Day(Now()), "00")
                                                        & "-" & Text(Hour(Now()), "00") & Text(Minute(Now()), "00") & Text(Second(Now()), "00")
                                                        & "-" & Left(Coalesce(ComboboxCanvasAeroporto.Selected.Value, varAeroUser), 3),
                                                    dtRetirada: If(
                                                        Not IsBlank(DateValue1.SelectedDate),
                                                        DateTime(
                                                            Year(DateValue1.SelectedDate),
                                                            Month(DateValue1.SelectedDate),
                                                            Day(DateValue1.SelectedDate),
                                                            Value(HourValue1.Selected.Value),
                                                            Value(MinuteValue1.Selected.Value),
                                                            Second(DateValue1.SelectedDate)
                                                        )
                                                    ),
                                                    dtVencimento: If(
                                                        Not IsBlank(DateValue3.SelectedDate),
                                                        DateTime(
                                                            Year(DateValue3.SelectedDate),
                                                            Month(DateValue3.SelectedDate),
                                                            Day(DateValue3.SelectedDate),
                                                            Value(HourValue3.Selected.Value),
                                                            Value(MinuteValue3.Selected.Value),
                                                            Second(DateValue3.SelectedDate)
                                                        )
                                                    )
                                                },
                                                IfError(
                                                    Collect(
                                                        col_movimentacoes,
                                                        ForAll(
                                                            col_chaveSel As C,
                                                            Patch(
                                                                tbl_movimentacoes,
                                                                Defaults(tbl_movimentacoes),
                                                                {
                                                                    data_hora: dtRetirada,
                                                                    Dias: Value(dcvNumDias.Value),
                                                                    vencimento: dtVencimento,
                                                                    sequencial_colaborador: ComboBoxRazaoSocial_6.Selected.Nome,
                                                                    responsavel_entrega: DataCardValue4.Value,
                                                                    observacao: DataCardValue5.Value,
                                                                    assinatura: Image3.Image,
                                                                    operacao: DataCardValue2.Value,
                                                                    aeroporto: DataCardValue1.Value,
                                                                    id_chave: C.ID,
                                                                    lote: loteCod
                                                                }
                                                            )
                                                        )
                                                    ),

                                                    // Sem transacao no SharePoint: se falhar na
                                                    // terceira de cinco, duas ja foram gravadas.
                                                    // A mensagem diz isso em vez de fingir.
                                                    Notify(
                                                        "Não foi possível gravar a retirada em lote. " &
                                                        Coalesce(FirstError.Message, "Erro não informado.") &
                                                        " ATENÇÃO: parte das chaves pode ter sido gravada. Atualize a lista e confira antes de tentar de novo.",
                                                        NotificationType.Error,
                                                        8000
                                                    ),

                                                    // O formulario so fecha DEPOIS de gravar: se
                                                    // fechasse antes, Image3.Image e os DataCardValue
                                                    // poderiam ser lidos ja resetados.
                                                    Clear(col_chaveSel);
                                                    UpdateContext(
                                                        {
                                                            var_formRetirada: false,
                                                            var_modoLote: false
                                                        }
                                                    );
                                                    ResetForm(FormRetirada);
                                                    Navigate(
                                                        ScreenSucesso,
                                                        ScreenTransition.Fade,
                                                        {var_navigateSucess: ScreenOperação}
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              Text: ="Sim"
                              Width: =80
