                  - ButtonAtualizar:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Icon: ="ArrowClockwise"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// =======================
                          // RESET DE ESTADO
                          // =======================
                          UpdateContext(
                              {
                                  CurrentItemId: Blank(),
                                  newMode: false,
                                  editMode: false,
                                  viewMode: false,
                                  isItemSelected: false
                              }
                          );

                          // =======================
                          // CACHE DE CHAVES (DELEGÁVEL)
                          // =======================
                          ClearCollect(
                              col_chave,
                              Filter(
                                  tbl_chave,
                                  ativo &&
                                  (
                                      IsBlank(ComboboxCanvasAeroporto.Selected.Value) ||
                                      aeroporto = ComboboxCanvasAeroporto.Selected.Value
                                  )
                              )
                          );

                          // =======================
                          // MOVIMENTAÇÕES (FILTRO PRIMEIRO)
                          // =======================
                          ClearCollect(
                              col_movimentacoes,
                              SortByColumns(
                                  Filter(
                                      tbl_movimentacoes,
                                      aeroporto = ComboboxCanvasAeroporto.Selected.Value &&
                                      operacao = "Retirada" &&
                                      id_chave in col_chave.ID
                                  ),
                                  "data_hora",
                                  SortOrder.Descending
                              )
                          );

                          // =======================
                          // SELECOES: descarta o que deixou de estar disponivel.
                          // E isto que faz a trava "chave ja retirada nao entra
                          // na selecao" valer continuamente, e nao so no clique.
                          // =======================
                          RemoveIf(
                              col_chaveSel,
                              !(ThisRecord.ID in col_chave.ID)
                              || (ThisRecord.ID in ShowColumns(col_movimentacoes, id_chave))
                          );
                          RemoveIf(
                              col_movSel,
                              !(ThisRecord.ID in col_movimentacoes.ID)
                          )


                          /*UpdateContext(
                              {
                                  CurrentItemId: "";
                                  newMode: false;
                                  editMode: false;
                                  viewMode: false;
                                  isItemSelected: false
                              }
                          );;
                          ClearCollect(
                              col_chave;
                              Sort(
                                  Filter(
                                      tbl_chave;
                                      ativo And IsBlank(ComboboxCanvasAeroporto.Selected.Value) || aeroporto = ComboboxCanvasAeroporto.Selected.Value
                                  );
                                  ID;
                                  SortOrder.Descending
                              )
                          );;
                          With(
                              {
                                  ids: Distinct(
                                      col_chave;
                                      ID
                                  )
                              };
                              ClearCollect(
                                  col_movimentacoes;
                                  Filter(
                                      Filter(
                                          SortByColumns(
                                              tbl_movimentacoes;
                                              "data_hora";
                                              SortOrder.Descending
                                          );
                                          aeroporto = ComboboxCanvasAeroporto.Selected.Value And operacao = "Retirada"
                                      );
                                      id_chave in ids
                                  )
                              )
                          )*/
                        Text: =
                        Width: =40
