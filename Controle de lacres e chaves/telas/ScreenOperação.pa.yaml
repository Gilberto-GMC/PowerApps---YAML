                  - ButtonCanvas5_1:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        Icon: ="Eraser"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: =Reset(ComboboxCanvasBloco_5);Reset(ComboboxCanvasAeroporto);Reset(SearchInput2);Reset(rbgAcessoRestrito)
                        Text: =
