                                    Width: =120
                        - Gallery3:
                            Control: Gallery@2.15.0
                            Variant: VariableHeight
                            Properties:
                              Items: |-
                                =With(
                                    {
                                        idsUsados: ShowColumns(
                                            col_movimentacoes,
                                            id_chave
                                        ),
                                        filtroAeroporto: ComboboxCanvasAeroporto.Selected.Value
                                    },
                                    Search(
                                        Sort(
                                            AddColumns(
                                                Filter(
                                                    col_chave,
                                                    Not(ID in idsUsados) && (IsBlank(filtroAeroporto) || aeroporto = filtroAeroporto) && ativo && If(
                                                        rbgAcessoRestrito.Selected.Value = "Chaves Restritas",
                                                        reservada = true,
                                                        If(
                                                            rbgAcessoRestrito.Selected.Value = "Chaves Comuns",
                                                            reservada = false,
                                                            true
                                                        )
                                                    )
                                                ),
                                                AREA,
                                                Text(area.Value)
                                            ),
                                            identificacao
                                        ),
                                        SearchInput2.Value,
                                        identificacao,
                                        AREA,
                                        local
                                    )
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LoadingSpinner: =LoadingSpinner.None
                              TemplatePadding: =4
                              Width: =0
                            Children:
                              - HtmlText4:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Height: =100
                                    HtmlText: |-
                                      =// A marcacao vive no proprio HTML do cartao: nenhum
                                      // controle novo entra no template da galeria, e por isso
                                      // nenhum X novo corre o risco de ser descartado na colagem.
                                      With(
                                          {
                                              marcada: ThisItem.ID in col_chaveSel.ID
                                          },
                                          "
                                      <div style='border:2px solid " & If(marcada, "#0566B2", "#dddddd") & "; height:auto; border-radius:10px; padding:10px 8px; margin-bottom:0px; background-color:" & If(marcada, "#EAF3FB", "#ffffff") & "; box-shadow:0 1px 4px rgba(0,0,0,0.1); font-family:Segoe UI;'>
                                        <div style='display:flex; flex-direction:column; gap:0px; margin-left:60px; margin-right:80px'>

                                          <div style='overflow-wrap:break-word; word-break:break-word;'>
                                            <div style='font-size:12px; color:#888;'>Identificação</div>
                                            <div style='font-size:14px; font-weight:600; color:#000000; line-height:1.2;'>
                                              " & ThisItem.identificacao & " - " & ThisItem.local & "
                                            </div>
                                          </div>

                                          <div style='overflow:hidden;'>
                                            <div style='font-size:12px; color:#888;'>Área</div>
                                            <div style='font-size:14px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                              " & ThisItem.area.Value & "
                                            </div>
                                          </div>

                                          <div style='font-size:11px; font-weight:700; color:#0566B2; height:14px; letter-spacing:0.5px;'>
                                            " & If(marcada, "SELECIONADA", "") & "
                                          </div>

                                        </div>
                                      </div>
                                      "
                                      )
                                    OnSelect: |-
                                      =// Clicar no cartao marca / desmarca. A trava local pega o
                                      // caso comum de a chave ja ter sido retirada desde o ultimo
                                      // Atualizar; a corrida real e revalidada no servidor na hora
                                      // de gravar o lote.
                                      With(
                                          {
                                              idSel: ThisItem.ID
                                          },
                                          If(
                                              !IsBlank(
                                                  LookUp(
                                                      col_movimentacoes,
                                                      id_chave = idSel
                                                  )
                                              ),
                                              Notify(
                                                  "Esta chave já consta como retirada. Atualize a lista antes de continuar.",
                                                  NotificationType.Warning,
                                                  5000
                                              ),
                                              If(
                                                  idSel in col_chaveSel.ID,
                                                  RemoveIf(
                                                      col_chaveSel,
                                                      ID = idSel
                                                  ),
                                                  Collect(
                                                      col_chaveSel,
                                                      {
                                                          ID: idSel,
                                                          identificacao: ThisItem.identificacao,
                                                          local: ThisItem.local,
                                                          reservada: ThisItem.reservada,
                                                          reservada_motivo: ThisItem.reservada_motivo
                                                      }
                                                  )
                                              )
                                          )
                                      )
                                    Size: =10
                                    Tooltip: |-
                                      ="Local: "&ThisItem.local
                                    Width: =Parent.Width -20
                              - ButtonCanvas3:
