                                            =// Sem trava de autor, igual ao Editar e ao Novo ponto
                                            // desta mesma tela. A regra antiga
                                            // (varNomeUser = ThisItem.Author.DisplayName) reprovava
                                            // todo mundo, porque os pontos foram criados por outra
                                            // pessoa -- e era incoerente permitir que qualquer um
                                            // ALTERASSE um ponto mas so o autor pudesse exclui-lo.
                                            // Quem manda na permissao e a lista do SharePoint.
                                            // A trava do lacre aberto mora no OnSelect.
                                            DisplayMode.Edit
                                          FontColor: =RGBA(255, 0, 0, 1)
                                          Height: =30
                                          Icon: ="Delete"
                                          IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                          Layout: ='ButtonCanvas.Layout'.IconBefore
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: |-
                                            =// A trava e no dado real, nao no campo Status: um ponto
                                            // criado por engano nasce "Ativo" sem nunca ter recebido
                                            // lacre, e travar por Status obrigaria o operador a
                                            // inventar um lacre so para poder excluir.
                                            // Lacre aberto = aplicacao gravada e ainda sem rompimento.
                                            If(
                                                !IsBlank(
                                                    LookUp(
                                                        col_aplic_ponto,
                                                        Value(ID_Ponto_Lacravel) = ThisItem.ID
                                                        && IsBlank(Data_Rompimento)
                                                    )
                                                ),

