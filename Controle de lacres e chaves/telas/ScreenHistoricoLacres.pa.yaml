Screens:
  ScreenHistoricoLacres:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      OnVisible: =Select(btnHistLacreAtualizar)
    Children:
      - ScreenContainerHistLacre:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderContainerHistLacre2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =App.Theme.Colors.Primary
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - HeaderContainerHistLacre1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
                        Fill: =App.Theme.Colors.Primary
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        PaddingLeft: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =1920
                      Children:
                        - btnHistLacreVoltar:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =34
                              Icon: ="ChevronLeft"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              Layout: ='ButtonCanvas.Layout'.IconOnly
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              OnSelect: =Navigate(ScreenHome,ScreenTransition.Fade)
                              Text: =
                              Width: =50
                        - lblHistLacreTitulo:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Size: =15
                              Text: ="Controle de Lacres - Histórico"
                              Width: =300
                        - imgHistLacreMarca:
                            Control: Image@2.2.3
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderStyle: =BorderStyle.None
                              Image: =MOTIVA_RGB_Simbolo_VersaoNegativa_Branca
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              X: =Parent.Width - Self.Width
                              Y: =Parent.Height - Self.Height
            - BodyContainerHistLacre:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - RightContainerHistLacre:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =7
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingBottom: =2
                        PaddingLeft: =2
                        PaddingRight: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =0
                      Children:
                        - lblHistLacreSubtitulo:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Size: =15
                              Text: ="Histórico de Lacres"
                        - SearchContainerHistLacre:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 245, 245, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingLeft: =20
                              PaddingRight: =5
                            Children:
                              - ContainerHistLacreBloco:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =100
                                  Children:
                                    - cbxHistLacreBloco:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AllowEmptySelection: =true
                                          BorderColor: =RGBA(215, 223, 240, 1)
                                          BorderStyle: =BorderStyle.None
                                          ChevronBackground: =RGBA(0, 0, 0, 0)
                                          ChevronFill: =RGBA(39, 67, 125, 1)
                                          ChevronHoverFill: =RGBA(38, 36, 123, 1)
                                          Default: =varBlocoUser
                                          DisplayMode: |-
                                            =If(
                                                varPerfilUser = "Sede",
                                                DisplayMode.Edit,
                                                DisplayMode.View
                                            )
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Items: =Distinct(colAeros,Bloco)
                                          Items.Value: =Value
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =30
                                          LayoutMinWidth: =100
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(0, 18, 107, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(38, 36, 123, 1)
                                          Size: =10
                                          Width: =0
                              - ContainerHistLacreAero:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =150
                                  Children:
                                    - cbxHistLacreAero:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AllowEmptySelection: =true
                                          BorderColor: =cbxHistLacreBloco.BorderColor
                                          BorderStyle: =BorderStyle.None
                                          ChevronBackground: =RGBA(0, 0, 0, 0)
                                          ChevronFill: =RGBA(39, 67, 125, 1)
                                          ChevronHoverFill: =RGBA(38, 36, 123, 1)
                                          Default: =varAeroUser
                                          DisplayMode: |-
                                            =If(
                                                varPerfilUser = "Base",
                                                DisplayMode.View,
                                                DisplayMode.Edit
                                            )
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Items: |-
                                            =Distinct(
                                                Filter(
                                                    colAeros,
                                                    Bloco = cbxHistLacreBloco.Selected.Value
                                                ),
                                                Aeroporto
                                            )
                                          Items.Value: =Value
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =30
                                          LayoutMinWidth: =100
                                          OnChange: =Select(btnHistLacreAtualizar)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(0, 18, 107, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(38, 36, 123, 1)
                                          Size: =10
                                          Width: =0
                              - ContainerHistLacreDatas:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =280
                                  Children:
                                    - dtpHistLacreInicio:
                                        Control: DatePicker@0.0.46
                                        Properties:
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =1
                                          FontSize: =14
                                          Format: ='DatePickerCanvas.Format'.Short
                                          Height: =30
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinWidth: =0
                                          SelectedDate: =DateAdd(Today(), -24, TimeUnit.Months)
                                          Width: =120
                                    - dtpHistLacreFim:
                                        Control: DatePicker@0.0.46
                                        Properties:
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =1
                                          FontSize: =14
                                          Format: ='DatePickerCanvas.Format'.Short
                                          Height: =30
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinWidth: =0
                                          SelectedDate: =Today()
                                          Width: =120
                              - ContainerHistLacrePonto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =300
                                  Children:
                                    - cbxHistLacrePonto:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AllowEmptySelection: =true
                                          BorderColor: =cbxHistLacreBloco.BorderColor
                                          BorderStyle: =BorderStyle.None
                                          ChevronBackground: =RGBA(0, 0, 0, 0)
                                          ChevronFill: =RGBA(39, 67, 125, 1)
                                          ChevronHoverFill: =RGBA(38, 36, 123, 1)
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =30
                                          HoverFill: =RGBA(186, 202, 226, 1)
                                          Items: =SortByColumns(col_hist_pontos, "Localizacao", SortOrder.Ascending)
                                          Items.Value: =Localizacao
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =30
                                          LayoutMinWidth: =100
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(0, 18, 107, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(38, 36, 123, 1)
                                          Size: =10
                                          Width: =0
                              - ContainerHistLacreBusca:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =30
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =260
                                  Children:
                                    - txtHistLacreBusca:
                                        Control: TextInput@0.0.54
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: ='TextInputCanvas.Appearance'.FilledLighter
                                          FillPortions: =1
                                          Height: =44
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Placeholder: ="Nº do lacre ou responsável"
                                          TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                              - btnHistLacreLimpar:
                                  Control: Button@0.0.45
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Icon: ="Eraser"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =Reset(cbxHistLacreBloco);
                                      Reset(cbxHistLacreAero);
                                      Reset(dtpHistLacreInicio);
                                      Reset(dtpHistLacreFim);
                                      Reset(txtHistLacreBusca);
                                      Reset(cbxHistLacrePonto)
                                    Text: =
                                    Width: =40
                              - btnHistLacreAtualizar:
                                  Control: Button@0.0.45
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Icon: ="ArrowSync"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =// Pontos do aeroporto, em memoria. Serve para dar nome ao
                                      // ID_Ponto_Lacravel de cada linha sem um LookUp remoto por
                                      // linha, e para alimentar o filtro por ponto.
                                      // NAO filtra Excluido: ponto inativado tem que continuar
                                      // legivel no historico -- e essa a razao de ele ser
                                      // inativado em vez de apagado.
                                      ClearCollect(
                                          col_hist_pontos,
                                          Filter(
                                              tbl_Pontos_Lacraveis,
                                              Aeroporto = cbxHistLacreAero.Selected.Value
                                          )
                                      )
                                    Text: =
                                    Width: =40
                              - btnHistLacrePowerBI:
                                  Control: Button@0.0.45
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Icon: ="AppsListDetail"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Launch("https://app.powerbi.com/links/t3EMM3rqRh?ctid=d233d58a-9973-43a7-af69-6763630548a0&pbi_source=linkShare")
                                    Text: ="Dashboard"
                                    Width: =130
                        - htmlHistLacre:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              FillPortions: =1
                              Height: =500
                              HtmlText: |-
                                =With(
                                    {
                                        // =======================
                                        // GRID BASE (1 FONTE DE VERDADE)
                                        // =======================
                                        // A Localizacao e a coluna que identifica a linha para o
                                        // operador -- ela leva a maior fatia, e o resto e fixo no
                                        // que basta para o conteudo real de cada campo.
                                        _grid: "display:grid;
                                                grid-template-columns:
                                                    minmax(220px, 2.4fr)
                                                    0.8fr
                                                    1fr
                                                    1.3fr
                                                    1fr
                                                    1.1fr
                                                    1fr
                                                    0.8fr;
                                                align-items:center;
                                                column-gap:8px;",

                                        // =======================
                                        // FILTRO DELEGAVEL
                                        // =======================
                                        dadosBase:
                                            SortByColumns(
                                                Filter(
                                                    tbl_Lacres_Aplicacao,
                                                    Aeroporto = cbxHistLacreAero.Selected.Value &&
                                                    (IsBlank(cbxHistLacrePonto.Selected.ID)   || ID_Ponto_Lacravel = Text(cbxHistLacrePonto.Selected.ID)) &&
                                                    (IsBlank(dtpHistLacreInicio.SelectedDate) || Data_Aplicacao >= dtpHistLacreInicio.SelectedDate) &&
                                                    (IsBlank(dtpHistLacreFim.SelectedDate)    || Data_Aplicacao <  DateAdd(dtpHistLacreFim.SelectedDate, 1, TimeUnit.Days)) &&
                                                    (
                                                        IsBlank(txtHistLacreBusca.Value) ||
                                                        StartsWith(Numero_Lacre,            txtHistLacreBusca.Value) ||
                                                        StartsWith(Responsavel_Aplicacao,   txtHistLacreBusca.Value) ||
                                                        StartsWith(Responsavel_Rompimento,  txtHistLacreBusca.Value)
                                                    )
                                                ),
                                                "Data_Aplicacao",
                                                SortOrder.Descending
                                            ),

                                        // Total do aeroporto ignorando periodo e busca. Existe para
                                        // que "vazio" seja legivel: 0 de 0 e aeroporto sem lacre;
                                        // 0 de 340 e filtro estreito demais.
                                        totalAero:
                                            CountRows(
                                                Filter(
                                                    tbl_Lacres_Aplicacao,
                                                    Aeroporto = cbxHistLacreAero.Selected.Value
                                                )
                                            )
                                    },

                                    // =======================
                                    // CONTAGEM
                                    // =======================
                                    "<div style='
                                        text-align:right;
                                        font-size:10px;
                                        color:#7a8a8f;
                                        font-family:Segoe UI, sans-serif;
                                        padding:0 12px 6px 0;
                                    '>Mostrando <b>" & CountRows(dadosBase) & "</b> de <b>" & totalAero & "</b> movimentos do aeroporto</div>"
                                    &

                                    // =======================
                                    // CABECALHO
                                    // =======================
                                    "<div style='" & _grid & "
                                        background-color:#D6EAF8;
                                        font-weight:600;
                                        padding:8px 12px;
                                        font-size:11px;
                                        font-family:Segoe UI, sans-serif;
                                        border-radius:6px 6px 0 0;
                                    '>
                                        <div>Ponto lacrável</div>
                                        <div>Nº do lacre</div>
                                        <div>Aplicado em</div>
                                        <div>Aplicado por</div>
                                        <div>Rompido em</div>
                                        <div>Rompido por</div>
                                        <div>Tipo de rompimento</div>
                                        <div>Situação</div>
                                    </div>"
                                    &

                                    // =======================
                                    // ENRIQUECIMENTO (pos-filtro, em memoria)
                                    // =======================
                                    With(
                                        {
                                            dados:
                                                AddColumns(
                                                    dadosBase,
                                                    pontoSel, LookUp(col_hist_pontos, ID = Value(ID_Ponto_Lacravel))
                                                )
                                        },

                                        // =======================
                                        // LINHAS
                                        // =======================
                                        Concat(
                                            dados,
                                            With(
                                                {
                                                    zebra: If(Mod(ThisRecord.ID, 2) = 0, "#f9f9f9", "#ffffff"),

                                                    // Lacre intacto e o estado bom: verde.
                                                    // Rompido normal e vermelho claro; rompimento
                                                    // sem autorizador ou marcado como nao
                                                    // intencional e vermelho forte, para os dois
                                                    // continuarem distinguiveis a distancia.
                                                    corRomp: If(
                                                        IsBlank(Data_Rompimento),
                                                        "#e6f4ea",
                                                        IsBlank(Autorizador) || Intencional = "Não",
                                                        "#ffd6d6",
                                                        "#fdecec"
                                                    ),
                                                    situacao: If(
                                                        IsBlank(Data_Rompimento),
                                                        "ATIVO",
                                                        IsBlank(Autorizador) || Intencional = "Não",
                                                        "VERIFICAR",
                                                        "ROMPIDO"
                                                    ),
                                                    corBadge: If(
                                                        IsBlank(Data_Rompimento),
                                                        "#16a673",
                                                        IsBlank(Autorizador) || Intencional = "Não",
                                                        "#d73a3c",
                                                        "#e2686a"
                                                    )
                                                },

                                                "<div style='" & _grid & "
                                                    padding:8px 12px;
                                                    background-color:" & zebra & ";
                                                    border-bottom:1px solid #eee;
                                                    font-size:10px;
                                                    font-family:Segoe UI, sans-serif;
                                                '>

                                                    <div style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; color:#1f2733;' title='" & Coalesce(pontoSel.Localizacao, "-") & "'>
                                                        " & Coalesce(pontoSel.Localizacao, "-") &
                                                        If(pontoSel.Excluido, " <span style='color:#8a93a2; font-weight:400;'>(inativado)</span>", "") & "
                                                    </div>

                                                    <div style='font-family:Consolas,monospace; font-weight:600;'>
                                                        " & Coalesce(Numero_Lacre, "-") & "
                                                    </div>

                                                    <div style='font-family:Consolas,monospace;'>
                                                        " & If(IsBlank(Data_Aplicacao), "-", Text(Data_Aplicacao, "dd/mm/yyyy hh:mm")) & "
                                                    </div>

                                                    <div style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(Responsavel_Aplicacao, "-") & "
                                                    </div>

                                                    <div style='background-color:" & corRomp & "; padding:4px; font-family:Consolas,monospace;'>
                                                        " & If(IsBlank(Data_Rompimento), "-", Text(Data_Rompimento, "dd/mm/yyyy hh:mm")) & "
                                                    </div>

                                                    <div style='background-color:" & corRomp & "; padding:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(Responsavel_Rompimento, "-") & "
                                                    </div>

                                                    <div style='background-color:" & corRomp & "; padding:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(Tipo_Rompimento.Value, "-") & "
                                                    </div>

                                                    <div style='background-color:" & corRomp & "; padding:4px;'>
                                                        <span style='
                                                            border:1px solid " & corBadge & ";
                                                            color:" & corBadge & ";
                                                            font-size:9px;
                                                            font-weight:700;
                                                            letter-spacing:.5px;
                                                            padding:2px 8px;
                                                            border-radius:16px;
                                                            white-space:nowrap;
                                                        '>" & situacao & "</span>
                                                    </div>

                                                </div>"
                                            )
                                        )
                                    )
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
