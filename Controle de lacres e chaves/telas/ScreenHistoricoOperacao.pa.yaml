                                                    background-color:" & zebra & ";
                                                    border-bottom:1px solid #eee;
                                                    font-size:10px;
                                                    font-family:Segoe UI, sans-serif;
                                                '>

                                                    <div style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(chaveSel.identificacao, "-") & "
                                                    </div>

                                                    <div style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(responsavel_entrega, "-") & "
                                                    </div>

                                                    <div>
                                                        " & If(IsBlank(data_hora), "-", Text(data_hora, "dd/mm/yyyy hh:mm")) & "
                                                    </div>

                                                    <div style='white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(retiradoPorNome, "-") & "
                                                    </div>

