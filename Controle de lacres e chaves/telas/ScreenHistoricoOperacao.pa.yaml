                                                )
                                            ) & "</div>
                                                <div style='flex:1; background-color:" & corDevolucao & "; border-radius:0px; padding:4px;'>" & If(
                                                IsBlank(sequencial_colaborador_entrega);
                                                "-";
                                                LookUp(
                                                    col_colaboradores;
                                                    Nome = sequencial_colaborador_entrega
                                                ).Nome
                                            ) & "</div>
                                                <div style='flex:1; background-color:" & corDevolucao & "; border-radius:0px; padding:4px;'>" & operacao & "</div>
                                            </div>"
                                        )
                                    )
                                )*/
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
