                                                        " & Coalesce(responsavel_recebimento, "-") & "
                                                    </div>

                                                    <div style='background-color:" & corDev & "; padding:4px;'>
                                                        " & If(IsBlank(data_hora_entrega), "-", Text(data_hora_entrega, "dd/mm/yyyy hh:mm")) & "
                                                    </div>

                                                    <div style='background-color:" & corDev & "; padding:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>
                                                        " & Coalesce(devolvidoPorNome, "-") & "
                                                    </div>

                                                    <div style='background-color:" & corDev & "; padding:4px; font-weight:600;'>
                                                        " & Coalesce(operacao, "-") & "
                                                    </div>

                                                </div>"
                                            )
                                        )
                                    )
                                )



