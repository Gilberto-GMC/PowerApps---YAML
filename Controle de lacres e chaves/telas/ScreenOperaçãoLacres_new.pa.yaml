                          =Notify(
                              "Não foi possível gravar o rompimento. " & Coalesce(FormRompimentoLacre_1.Error, "Revise os campos obrigatórios e tente novamente."),
                              NotificationType.Error,
                              5000
                          )
                        OnSuccess: |-
                          =// O rompimento ja esta gravado neste ponto. Se o Patch do status
                          // falhar, o lacre fica registrado e o ponto com o estado antigo --
                          // por isso o erro precisa aparecer, e nao sumir em silencio.
                          IfError(
                              Patch(
                                  tbl_Pontos_Lacraveis,
                                  LookUp(
                                      tbl_Pontos_Lacraveis,
                                      ID = Value(FormRompimentoLacre_1.LastSubmit.ID_Ponto_Lacravel)
                                  ),
                                  {
                                      Status: "Rompido"
                                  }
                              ),
                              Notify(
                                  "O rompimento foi gravado, mas o status do ponto não foi atualizado. " & Coalesce(FirstError.Message, "Erro não informado.") & " Avise a supervisão.",
                                  NotificationType.Error,
                                  8000
                              )
                          );
                          ResetForm(FormRompimentoLacre_1);
                          UpdateContext(
                              {
                                  varRompeLacre: Blank(),
                                  var_acao: Blank(),
                                  varVisible: "list"
                              }
                          );
                          Set(
