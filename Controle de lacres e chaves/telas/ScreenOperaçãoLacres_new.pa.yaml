                        - ButtonAtualizar_2:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BorderRadius: =8
                              Height: =40
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =// =======================
                                // RESET DE ESTADO
                                // =======================
                                UpdateContext(
                                    {
                                        CurrentItemId: Blank(),
                                        newMode: false,
                                        editMode: false,
                                        viewMode: false,
                                        isItemSelected: false
                                    }
                                );

                                // =======================
                                // 1 - PONTOS VIGENTES DO AEROPORTO
                                //    (uma consulta, delegavel)
                                // =======================
                                ClearCollect(
                                    col_ponto_lacravel,
                                    Filter(
                                        tbl_Pontos_Lacraveis,
                                        Excluido <> true
                                        && (
                                            IsBlank(ComboboxCanvasAeroporto_2.Selected.Value)
                                            || Aeroporto = ComboboxCanvasAeroporto_2.Selected.Value
                                        )
                                    )
                                );

                                // =======================
                                // 2 - APLICACOES DO AEROPORTO
                                //    (uma consulta, delegavel)
                                // =======================
                                ClearCollect(
                                    col_aplicacao_bruta,
                                    Filter(
                                        tbl_Lacres_Aplicacao,
                                        IsBlank(ComboboxCanvasAeroporto_2.Selected.Value)
                                        || Aeroporto = ComboboxCanvasAeroporto_2.Selected.Value
                                    )
                                );

                                // =======================
                                // 3 - UM CARTAO POR PONTO, COM O ULTIMO MOVIMENTO
                                //    Tudo em memoria. O ponto manda; a aplicacao
                                //    so aparece atraves dele. Ponto excluido ou
                                //    aplicacao orfa nao entram por construcao.
                                // =======================
                                ClearCollect(
                                    col_aplicacao,
                                    Filter(
                                        ForAll(
                                            col_ponto_lacravel As P,
                                            With(
                                                {
                                                    U: First(
                                                        Sort(
                                                            Filter(
                                                                col_aplicacao_bruta,
                                                                Value(ID_Ponto_Lacravel) = P.ID
                                                            ),
                                                            Data_Aplicacao,
                                                            SortOrder.Descending
                                                        )
                                                    )
                                                },
                                                {
                                                    ID: U.ID,
                                                    ID_Ponto: P.ID,
                                                    ID_Ponto_Lacravel: Text(P.ID),
                                                    Numero_Lacre: U.Numero_Lacre,
                                                    Data_Aplicacao: U.Data_Aplicacao,
                                                    Responsavel_Aplicacao: U.Responsavel_Aplicacao,
                                                    Data_Rompimento: U.Data_Rompimento,
                                                    Responsavel_Rompimento: U.Responsavel_Rompimento,
                                                    Intencional: U.Intencional,
                                                    Autorizador: U.Autorizador,
                                                    Aeroporto: P.Aeroporto,
                                                    // Status DERIVADO do dado, nao lido do campo.
                                                    // O ponto so esta "Ativo" se existe aplicacao
                                                    // gravada e ainda sem rompimento. O campo
                                                    // Status da lista continua sendo gravado pelos
                                                    // formularios, porque o Power BI le ele -- mas
                                                    // a tela nao depende mais dele estar certo.
                                                    StatusPonto: If(
                                                        IsBlank(U.ID),
                                                        "Criado",
                                                        IsBlank(U.Data_Rompimento),
                                                        "Ativo",
                                                        "Rompido"
                                                    ),
                                                    TipoAcesso: P.Tipo_Acesso.Value,
                                                    Local: Text(P.Localizacao)
                                                }
                                            )
                                        ),

                                        // Ponto que nunca teve lacre entra sempre.
                                        // Com movimento, respeita o periodo escolhido.
                                        IsBlank(Data_Aplicacao)
                                        || (
                                            (
                                                IsBlank(dtpInicio.SelectedDate)
                                                || Data_Aplicacao >= dtpInicio.SelectedDate
                                            )
                                            && (
                                                IsBlank(dtpFinal.SelectedDate)
                                                || Data_Aplicacao < DateAdd(dtpFinal.SelectedDate, 1, TimeUnit.Days)
                                            )
                                        )
                                    )
                                )
                              Text: ="Aplicar"
                              Width: =Parent.Width - 30
