                                          Height: =250
                                          HtmlText: "=\"<div style='font-family:Segoe UI,Arial,sans-serif;max-width:380px;margin:0 auto;background:#ffffff;border-radius:14px;border:1px solid #e8eaed;overflow:hidden;box-shadow:0 0px 0px rgba(0,0,0,0.06);'>\n  \n  <div style='height:6px;background:\" & \n    Switch(ThisItem.StatusPonto, \n      \"Ativo\", \"#16a673\", \n      \"Rompido\", \"#f57c00\", \n      \"Criado\", \"#8a93a2\", \n      \"#6b7280\"\n    ) & \";'></div>\n  \n  <div style='padding:8px 12px;'>\n    \n    <div style='display:flex;justify-content:space-between;align-items:flex-start;'>\n      <div>\n        <div style='font-size:9px;letter-spacing:1px;color:#8a93a2;font-weight:600;'>NÚMERO DO LACRE</div>\n        <div style='font-size:16px;font-weight:700;color:#1f2733;margin-top:2px;'>\" & \n          Coalesce(ThisItem.Numero_Lacre, \"-\") \n        & \" </div>\n      </div>\n      <span style='border:1px solid \" & \n        Switch(ThisItem.StatusPonto, \"Ativo\", \"#16a673\", \"Rompido\", \"#f57c00\", \"Criado\", \"#8a93a2\", \"#6b7280\") \n      & \";color:\" & \n        Switch(ThisItem.StatusPonto, \"Ativo\", \"#16a673\", \"Rompido\", \"#f57c00\", \"Criado\", \"#8a93a2\", \"#6b7280\") \n      & \";font-size:9px;font-weight:700;letter-spacing:.5px;padding:2px 10px;border-radius:16px;white-space:nowrap;'>\" & \n        Switch(ThisItem.StatusPonto, \n          \"Ativo\", \"&#9679; APLICADO\", \n          \"Rompido\", \"&#9679; ROMPIDO\", \n          \"Criado\", \"SEM LACRE\", \n          \"INDEFINIDO\"\n        ) & \"</span>\n    </div>\n\n    <div style='font-size:9px;letter-spacing:1px;color:#8a93a2;font-weight:600;margin-top:12px;'>LOCALIZAÇÃO</div>\n    <div style='font-size:11px;font-weight:700;color:#1f2733;margin-top:2px;'>\" & \n      Coalesce(ThisItem.Local, \"-\") \n    & \"</div>\n\n    <div style='display:flex;margin-top:12px;'>\n      <div style='flex:1;'>\n        <div style='font-size:9px;letter-spacing:.5px;color:#8a93a2;font-weight:600;'>TIPO DE ACESSO</div>\n        <div style='font-size:11px;font-weight:700;color:#1f2733;margin-top:2px;'>\" & \n          Coalesce(ThisItem.TipoAcesso, \"-\") \n        & \"</div>\n      </div>\n      <div style='flex:1;'>\n        <div style='font-size:9px;letter-spacing:.5px;color:#8a93a2;font-weight:600;'>STATUS SISTEMA</div>\n        <div style='font-size:11px;font-weight:700;color:#5b6ef5;margin-top:2px;'>#\" & Upper(ThisItem.StatusPonto) & \"</div>\n      </div>\n    </div>\n\n    <div style='border-top:1px solid #eef0f3;margin-top:12px;padding-top:8px;'>\" &\n    \n    If(ThisItem.StatusPonto = \"Criado\",\n        \"<div style='font-size:11px;color:#8a93a2;text-align:center;'>Nenhum lacre aplicado no momento.</div>\",\n        \n        \"\n        <div style='display:flex;justify-content:space-between;margin-bottom:4px;'>\n          <span style='font-size:11px;color:#8a93a2;'>\" & \n            If(ThisItem.StatusPonto = \"Rompido\", \"Rompido por:\", \"Aplicado por:\") \n          & \"</span>\n          <span style='font-size:11px;font-weight:700;color:#1f2733;'>\" & \n            If(ThisItem.StatusPonto = \"Rompido\", \n               Coalesce(ThisItem.Responsavel_Rompimento, \"-\"), \n               Coalesce(ThisItem.Responsavel_Aplicacao, \"-\")\n            ) \n          & \"</span>\n        </div>\n        <div style='display:flex;justify-content:space-between;'>\n          <span style='font-size:11px;color:#8a93a2;'>\" & \n            If(ThisItem.StatusPonto = \"Rompido\", \"Data de rompimento:\", \"Data de aplicação:\") \n          & \"</span>\n          <span style='font-size:11px;font-weight:700;color:#1f2733;font-family:Consolas,monospace;'>\" & \n            If(ThisItem.StatusPonto = \"Rompido\", \n               Text(ThisItem.Data_Rompimento, \"dd/mm/yyyy, HH:mm\"), \n               Text(ThisItem.Data_Aplicacao, \"dd/mm/yyyy, HH:mm\")\n            ) \n          & \"</span>\n        </div>\n        \"\n    ) & \"\n    </div>\n    \n    <div style='height:45px;width:100%;'></div>\n\n  </div>\n</div>\""
