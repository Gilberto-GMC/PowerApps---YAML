                  - FormLacresAplicacao_1:
                      Control: Form@2.4.4
                      Layout: Vertical
                      Properties:
                        DataSource: =tbl_Lacres_Aplicacao
                        DefaultMode: |
                          =//FormMode.Edit
                          If(
                              var_acao = "edit",
                              FormMode.Edit,
                              FormMode.New
                          )
                        Height: =280
                        Item: |-
                          =LookUp(
                              tbl_Lacres_Aplicacao,
                              ID = var_AplicaLacres_dados.ID
                          )
                        LayoutMaxHeight: =
                        LayoutMinWidth: =0
                        NumberOfColumns: =2
                        OnFailure: |-
                          =Notify(
                              "Não foi possível gravar a aplicação do lacre. " & Coalesce(FormLacresAplicacao_1.Error, "Revise os campos obrigatórios e tente novamente."),
                              NotificationType.Error,
                              5000
                          )
                        OnSuccess: |-
                          =// Self.LastSubmit E o registro recem-gravado. A versao anterior
                          // reconsultava a lista para reencontra-lo (Filter + Sort por ID):
                          // custava uma ida ao servidor e, com duas gravacoes ao mesmo tempo,
                          // podia pegar o registro do outro.
                          IfError(
                              Patch(
                                  tbl_Lacres_Aplicacao,
                                  Self.LastSubmit,
                                  {
                                      Alerta_Enviado: false
                                  }
                              ),
                              Notify(
                                  "O lacre foi gravado, mas o aviso recorrente não foi rearmado. " & Coalesce(FirstError.Message, "Erro não informado."),
                                  NotificationType.Error,
                                  8000
                              )
                          );

                          // Se este Patch falhar, o lacre fica registrado e o ponto com o
                          // estado antigo. O erro precisa aparecer, e nao sumir em silencio.
                          IfError(
                              Patch(
                                  tbl_Pontos_Lacraveis,
                                  LookUp(
                                      tbl_Pontos_Lacraveis,
                                      ID = Value(Self.LastSubmit.ID_Ponto_Lacravel)
                                  ),
                                  {
                                      Status: "Ativo"
                                  }
                              ),
                              Notify(
                                  "O lacre foi gravado, mas o status do ponto não foi atualizado. " & Coalesce(FirstError.Message, "Erro não informado.") & " Avise a supervisão.",
                                  NotificationType.Error,
                                  8000
                              )
                          );

                          ResetForm(FormLacresAplicacao_1);
                          NewForm(FormLacresAplicacao_1);

                          UpdateContext(
                              {
                                  varVisibleFormAplica: false,
                                  var_visibleRompimento: false
                              }
                          );

                          Select(ButtonAtualizar_2)
