                              - FormDesk_2:
                                  Control: Form@2.4.4
                                  Variant: Classic
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    DataSource: =tbl_ServiceDesk
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Parent.Height - Self.Y - 92
                                    NumberOfColumns: =1
                                    OnFailure: |-
                                      =UpdateContext(
                                          {
                                              varDeskProcessando: false,
                                              varDeskOcupadoDesde: Blank()
                                          }
                                      );
                                      Notify(
                                          Coalesce(
                                              FormDesk_2.Error,
                                              "Não foi possível criar o chamado. Verifique os campos obrigatórios e tente novamente."
                                          ),
                                          NotificationType.Error,
                                          5000
                                      )
                                    OnSuccess: |-
                                      =UpdateContext(
                                          {
                                              varDeskProcessando: false,
                                              varDeskRegistroCriado: true,
                                              varDeskOcupadoDesde: Blank()
                                          }
                                      );
                                      IfError(
                                          If(
                                              varDeskCategoriaChave = "RESET_SENHA",

                                              Set(
                                                  varNovaSenha,
                                                  Concatenate(
                                                      Upper(Mid("abcdefghjkmnpqrstuvwxyz", Int(Rand() * 23) + 1, 1)),
                                                      Upper(Mid("abcdefghjkmnpqrstuvwxyz", Int(Rand() * 23) + 1, 1)),
                                                      Text(Int(Rand() * 90) + 10, "00"),
                                                      Upper(Mid("abcdefghjkmnpqrstuvwxyz", Int(Rand() * 23) + 1, 1)),
                                                      Upper(Mid("abcdefghjkmnpqrstuvwxyz", Int(Rand() * 23) + 1, 1)),
                                                      Text(Int(Rand() * 90) + 10, "00")
                                                  )
                                              );
                                              With(
                                                  {
                                                      locUsr: LookUp(
                                                          User,
                                                          usrNome = varDeskUsuario
                                                      )
                                                  },
                                                  If(
                                                      IsBlank(locUsr),
                                                      Error(
                                                          {
                                                              Kind: ErrorKind.NotFound,
                                                              Message: "Usuário não localizado no cadastro; a senha temporária não foi aplicada."
                                                          }
                                                      ),
                                                      Patch(
                                                          User,
                                                          locUsr,
                                                          {
                                                              Senha: varNovaSenha,
                                                              Validacao: 0
                                                          }
                                                      );
                                                      Office365Outlook.SendEmailV2(
                                                          varDeskUsuEmail,
                                                          "AirPort Now - Abertura de chamado: " & Text(varNumChamado, "000000"),
                                                          "<p><b>Novo chamado criado: " & Text(varNumChamado, "000000") & "</b></p>" &
                                                          "<p>Criado em " & Text(Now(), "dd/mm/yyyy hh:mm") & "</p>" &
                                                          "<p>Categoria: " & varDeskCategoria & "</p>" &
                                                          "<p>Usuário: " & varDeskUsuario & "</p>" &
                                                          "<p>Descrição: " & varDeskDescricao & "</p>" &
                                                          "<p><br>Status: <b>Resolvido em auto atendimento.</b></p>" &
                                                          "<p>Segue as informações de acesso temporário ao AirPort Now.</p>" &
                                                          "<p><b>Usuário: </b>" & Left(varDeskUsuEmail, Coalesce(Find("@", varDeskUsuEmail), Len(varDeskUsuEmail) + 1) - 1) & "</p>" &
                                                          "<p><b>Senha temporária: </b>" & varNovaSenha & "</p>" &
                                                          "<p><i>Você será solicitado a criar uma nova senha no primeiro acesso.</i></p>" &
                                                          "<br><br><br><br>" &
                                                          "<p><i>Esta mensagem foi gerada automaticamente pelo AirPort Now.</i></p>",
                                                          {
                                                              Importance: "High",
                                                              Cc: "douglas.nardelli@motiva.com.br; gilberto.claudino@motiva.com.br"
                                                          }
                                                      )
                                                  )
                                              ),

                                              Office365Outlook.SendEmailV2(
                                                  varDeskUsuEmail,
                                                  "AirPort Now - Abertura do chamado: " & Text(varNumChamado, "000000"),
                                                  "<p><b>Novo chamado criado: " & Text(varNumChamado, "000000") & "</b></p>" &
                                                  "<p>Criado em " & Text(Now(), "dd/mm/yyyy hh:mm") & "</p>" &
                                                  "<p>Categoria: " & varDeskCategoria & "</p>" &
                                                  "<p>Usuário: " & varDeskUsuario & "</p>" &
                                                  "<p>Descrição: " & varDeskDescricao & "</p>" &
                                                  "<p>Status: <b>Em atendimento.</b></p>" &
                                                  "<p>Aguarde contato.</p>" &
                                                  "<br><br><br><br>" &
                                                  "<p><i>Esta mensagem foi gerada automaticamente pelo AirPort Now.</i></p>",
                                                  {
                                                      Importance: "High",
                                                      Attachments: ForAll(
                                                          DataCardValue48_1.Attachments,
                                                          {
                                                              Name: ThisRecord.Name,
                                                              ContentBytes: ThisRecord.Value
                                                          }
                                                      ),
                                                      Cc: "douglas.nardelli@motiva.com.br; gilberto.claudino@motiva.com.br"
                                                  }
                                              )
                                          ),
                                          UpdateContext({varDeskErroFluxo: true})
                                      );
                                      If(
                                          varDeskErroFluxo,

                                          Notify(
                                              "Chamado " & Text(varNumChamado, "000000") & " registrado, mas uma etapa posterior falhou. Não envie novamente; utilize Voltar.",
                                              NotificationType.Warning,
                                              6000
                                          ),

                                          Notify(
                                              "Chamado criado com sucesso!",
                                              NotificationType.Success,
                                              3000
                                          );
                                          ResetForm(FormDesk_2);
                                          Set(
                                              varNumChamado,
                                              Blank()
                                          );
                                          Navigate(
                                              Login,
                                              ScreenTransition.Fade
                                          )
                                      )
                                    Width: =Parent.Width - (2 * Self.X)
                                    X: =If(Parent.Width < 600, 16, 24)
                                    Y: =If(cntDeskWarning.Visible, 184, 120)
                                  Children:
                                    - desk_categoria_DataCard2_2:
