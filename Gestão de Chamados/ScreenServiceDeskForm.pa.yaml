Screens:
  ScreenServiceDeskForm:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =UpdateContext(
            {
                varDeskProcessando: false,
                varDeskTentouEnviar: false,
                varDeskRegistroCriado: false,
                varDeskErroFluxo: false,
                varDeskOcupadoDesde: Blank()
            }
        );
        Set(
            varNumChamado,
            Coalesce(
                First(
                    Sort(
                        tbl_ServiceDesk,
                        desk_id,
                        SortOrder.Descending
                    )
                ).desk_id + 1,
                1
            )
        );
        ClearCollect(
            colDeskCategorias,
            Table(
                {Chave: "RESET_SENHA", Nome: "Reset da Senha",                 Ciclo: "SUPORTE", Prioridade: "MEDIA",  Ordem: 1},
                {Chave: "ACESSO",      Nome: "Acesso e permissão",             Ciclo: "SUPORTE", Prioridade: "ALTA",   Ordem: 2},
                {Chave: "ERRO",        Nome: "Erro no sistema",                Ciclo: "SUPORTE", Prioridade: "ALTA",   Ordem: 3},
                {Chave: "DADO",        Nome: "Correção de dado ou registro",   Ciclo: "SUPORTE", Prioridade: "MEDIA",  Ordem: 4},
                {Chave: "DESEMPENHO",  Nome: "Lentidão ou desempenho",         Ciclo: "SUPORTE", Prioridade: "MEDIA",  Ordem: 5},
                {Chave: "DUVIDA",      Nome: "Dúvida de uso",                  Ciclo: "SUPORTE", Prioridade: "BAIXA",  Ordem: 6},
                {Chave: "NOVO_MODULO", Nome: "Solicitação de novo módulo",     Ciclo: "DEMANDA", Prioridade: "MEDIA",  Ordem: 7},
                {Chave: "MELHORIA",    Nome: "Melhoria em módulo existente",   Ciclo: "DEMANDA", Prioridade: "MEDIA",  Ordem: 8},
                {Chave: "INTEGRACAO",  Nome: "Integração com outro sistema",   Ciclo: "DEMANDA", Prioridade: "MEDIA",  Ordem: 9},
                {Chave: "RELATORIO",   Nome: "Novo relatório ou indicador",    Ciclo: "DEMANDA", Prioridade: "BAIXA",  Ordem: 10}
            )
        );
        NewForm(FormDesk_2)
