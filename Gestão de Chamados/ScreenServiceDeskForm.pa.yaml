                                    FontWeight: =FontWeight.Semibold
                                    Height: =42
                                    Icon: ="Save"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    OnSelect: |-
                                      =If(
                                          cmbDeskCategoria.Selected.Ciclo = "DEMANDA",
                                          Navigate(
                                              ScreenNovoModuloWizard,
                                              ScreenTransition.Fade
                                          ),

                                          varDeskRegistroCriado,
                                          Notify(
                                              "Este chamado já foi registrado. Utilize Voltar.",
                                              NotificationType.Warning,
                                              4000
                                          ),

                                          !IsBlank(varDeskOcupadoDesde) && DateDiff(varDeskOcupadoDesde, Now(), TimeUnit.Seconds) < 30,
                                          Notify(
                                              "Aguarde: o envio anterior ainda está sendo processado.",
                                              NotificationType.Warning,
                                              3000
                                          ),

                                          UpdateContext(
                                              {
                                                  varDeskOcupadoDesde: Now(),
                                                  varDeskTentouEnviar: true
                                              }
                                          );
                                          If(
                                              IsBlank(cmbDeskCategoria.Selected.Nome) ||
                                              IsBlank(DataCardValue11_3.Selected.Email) ||
                                              IsBlank(Trim(DataCardValue14_2.Text)),

                                              UpdateContext({varDeskOcupadoDesde: Blank()});
                                              Notify(
                                                  "Preencha os campos obrigatórios antes de confirmar.",
                                                  NotificationType.Warning,
                                                  4000
                                              ),

                                              Set(
                                                  varNumChamado,
                                                  Coalesce(
                                                      First(
                                                          Sort(
                                                              tbl_ServiceDesk,
                                                              desk_id,
                                                              SortOrder.Descending
                                                          )
                                                      ).desk_id + 1,
                                                      1
                                                  )
                                              );
                                              UpdateContext(
                                                  {
                                                      varDeskCategoria: cmbDeskCategoria.Selected.Nome,
                                                      varDeskCategoriaChave: cmbDeskCategoria.Selected.Chave,
                                                      varDeskUsuario: DataCardValue11_3.Selected.DisplayName,
                                                      varDeskDescricao: Trim(DataCardValue14_2.Text),
