                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderRadius: =0
                                    DisplayMode: =If(varDeskProcessando, DisplayMode.Disabled, DisplayMode.Edit)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =42
                                    Icon: ="Dismiss"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    OnSelect: |-
                                      =If(
                                          !varDeskProcessando,
                                          ResetForm(FormDesk_2);
                                          UpdateContext(
                                              {
                                                  varDeskTentouEnviar: false,
                                                  varDeskRegistroCriado: false,
                                                  varDeskErroFluxo: false,
                                                  varDeskOcupadoDesde: Blank()
                                              }
                                          );
                                          Set(
                                              varNumChamado,
                                              Blank()
                                          );
                                          Navigate(
                                              Login,
                                              ScreenTransition.Fade
                                          )
                                      )
                                    Text: =If(varDeskRegistroCriado, "Voltar", "Cancelar")
                                    Width: =118
