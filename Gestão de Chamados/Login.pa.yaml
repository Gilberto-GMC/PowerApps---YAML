                  - ButtonCanvas41:
                      Control: Button@0.0.45
                      Properties:
                        BorderRadius: =4
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// Definir variáveis temporárias e exibir o loader
                          UpdateContext({var_visibleSpinLoader: true});
                          // Obter usuário e senha
                          Set(
                              userRecord,
                              LookUp(
                                  Sort(
                                      User,
                                      ID,
                                      SortOrder.Descending
                                  ),
                                  Usuarios = txtUser_2.Value
                              )
                          );
                          // Registro que passou pela conferência de usuário E senha.
                          // Fica em branco quando a senha está errada — e é ele, não o
                          // nome de usuário, que autoriza a troca de senha.
                          Set(
                              varAuthUser,
                              LookUp(
                                  User,
                                  Usuarios = txtUser_2.Value And Senha = txtSenha_2.Value
                              )
                          );
                          // Verificar se o usuário existe
                          If(
                              IsBlank(userRecord),
                              Notify(
                                  "Usuário ou senha inválidos",
                                  NotificationType.Error
                              );
                              UpdateContext({var_visibleSpinLoader: false}),
                              // Usuário encontrado, continuar validação
                              If(
                                  And(
                                      Not(IsBlank(varAuthUser)),
                                      varAuthUser.Validacao = 0
                                  ),
                                  UpdateContext({varUpdSenha: true});
                                  Reset(txtSenha_2),
                                  Set(
                                      varTempPass,
                                      userRecord.Senha
                                  );
                                  If(
                                      varTempPass = Concatenate(
                                          Left(
                                              txtSenha_2.Value,
                                              2
                                          ),
                                          Mid(
                                              varTempPass,
                                              3,
                                              110
                                          ),
                                          Mid(
                                              txtSenha_2.Value,
                                              3,
                                              2
                                          ),
                                          Mid(
                                              varTempPass,
                                              115,
                                              110
                                          ),
                                          Mid(
                                              txtSenha_2.Value,
                                              5
                                          )
                                      ),
                                  // Senha válida, configurar variáveis do usuário
                                      Set(
                                          varIdUser,
                                          userRecord.ID
                                      );
                                      Set(
                                          varNomeUser,
                                          userRecord.usrNome
                                      );
                                      Set(
                                          varEmailUser,
                                          userRecord.Email
                                      );
                                      Set(
                                          varFuncaoUser,
                                          userRecord.Funcao
                                      );
                                      Set(
                                          varBlocoUser,
                                          userRecord.Bloco
                                      );
                                      Set(
                                          varAeroUser,
                                          userRecord.Aeroporto
                                      );
                                      Set(
                                          varICAOUser,
                                          LookUp(
                                              colAeros,
                                              Aeroporto = varAeroUser
                                          ).ICAO
                                      );
                                      Set(
                                          varIATAUser,
                                          LookUp(
                                              colAeros,
                                              Aeroporto = varAeroUser
                                          ).IATA
                                      );
                                      Set(
                                          varPerfilUser,
                                          userRecord.Perfil
                                      );
                                      Set(
                                          varAutUser,
                                          userRecord.Autorizacao
                                      );
                                      // Buscar foto do usuário
                          Set(
                                          varFotoUser,
                                          UsuáriosdoOffice365.UserPhoto(First(UsuáriosdoOffice365.SearchUser({searchTerm: varNomeUser})).Id)
                                      );
                                      Set(
                                          varViewSafaty,
                                          userRecord.View_safety
                                      );
                                      // Login bem-sucedido
                          Set(
                                          Logado,
                                          true
                                      );
                                      // Navegar para a tela correspondente (Windows ou Mobile)
                          If(
                                          Host.OSType = "Windows",
                                          Navigate(
                                              Home,
                                              ScreenTransition.Fade
                                              /*;  ........................................................................visible popup de controle de versões...
                                              {var_visibleControleVersoes: true}*/
                                          ),
                                          Navigate(
                                              HomeMob,
                                              ScreenTransition.Fade
                                          )
                                      );
                                      UpdateContext({var_visibleSpinLoader: false}),
                                  // Senha inválida
                                      Notify(
                                          "Senha inválida. Por favor, verifique e tente novamente.",
                                          NotificationType.Error
                                      );
                                      UpdateContext({var_visibleSpinLoader: false});
                                      Reset(txtSenha_2)
                                  )
                              )
                          )
