                                    OnSelect: |-
                                      =UpdateContext({varCadTentou: true});
                                      If(
                                          IsBlank(Trim(txtCadUsrNome.Text)) ||
                                          IsBlank(Trim(txtCadUsrEmail.Text)) ||
                                          IsBlank(Trim(txtCadUsrUser.Text)) ||
                                          IsBlank(cmbUserAero.Selected.Value) ||
                                          IsBlank(cmbCadUsrPerf.Selected.Value) ||
                                          IsBlank(cmbCadUsrAut.Selected.Value),
                                          Notify(
                                              "Preencha nome, e-mail, usuário, aeroporto, perfil e autorização.",
