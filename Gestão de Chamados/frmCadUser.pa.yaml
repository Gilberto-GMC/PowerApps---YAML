Screens:
  frmCadUser:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =UpdateContext(
            {
                varCadCarregando: true,
                varCadSelId: Blank(),
                varCadOcupadoDesde: Blank(),
                varCadTentou: false,
                varCadConfirmar: ""
            }
        );
        Set(
            varCadAad,
            Blank()
        );
        ClearCollect(
            colAeros,
            {
                IATA: "",
                ICAO: "",
                Bloco: "CENTRAL",
                Aeroporto: "",
                Cluster: ""
            },
            {
                IATA: "GYN",
                ICAO: "SBGO",
                Bloco: "CENTRAL",
                Aeroporto: "GOIÂNIA",
                Cluster: "GOIÂNIA"
            },
            {
                IATA: "IMP",
                ICAO: "SBIZ",
                Bloco: "CENTRAL",
                Aeroporto: "IMPERATRIZ",
                Cluster: "GOIÂNIA"
            },
            {
                IATA: "PMW",
                ICAO: "SBPJ",
                Bloco: "CENTRAL",
                Aeroporto: "PALMAS",
                Cluster: "GOIÂNIA"
            },
            {
                IATA: "PLU",
                ICAO: "SBBH",
                Bloco: "CENTRAL",
                Aeroporto: "PAMPULHA",
                Cluster: "GOIÂNIA"
            },
            {
                IATA: "PNZ",
                ICAO: "SBPL",
                Bloco: "CENTRAL",
                Aeroporto: "PETROLINA",
                Cluster: "SÃO LUÍS"
            },
            {
                IATA: "SLZ",
                ICAO: "SBSL",
                Bloco: "CENTRAL",
                Aeroporto: "SÃO LUIS",
                Cluster: "SÃO LUÍS"
            },
            {
                IATA: "THE",
                ICAO: "SBTE",
                Bloco: "CENTRAL",
                Aeroporto: "TERESINA",
                Cluster: "SÃO LUÍS"
            },
            {
                IATA: "",
                ICAO: "",
                Bloco: "SUL",
                Aeroporto: "",
                Cluster: ""
            },
            {
                IATA: "BFH",
                ICAO: "SBBI",
                Bloco: "SUL",
                Aeroporto: "BACACHERI",
                Cluster: "CURITIBA"
            },
            {
                IATA: "CWB",
                ICAO: "SBCT",
                Bloco: "SUL",
                Aeroporto: "CURITIBA",
                Cluster: "CURITIBA",
                TurnoA: "07:00",
                TurnoB: "19:00"
            },
            {
                IATA: "JOI",
                ICAO: "SBJV",
                Bloco: "SUL",
                Aeroporto: "JOINVILLE",
                Cluster: "CURITIBA"
            },
            {
                IATA: "NVT",
                ICAO: "SBNF",
                Bloco: "SUL",
                Aeroporto: "NAVEGANTES",
                Cluster: "CURITIBA"
            },
            {
                IATA: "BGX",
                ICAO: "SBBG",
                Bloco: "SUL",
                Aeroporto: "BAGÉ",
                Cluster: "FOZ DO IGUAÇU"
            },
            {
                IATA: "IGU",
                ICAO: "SBFI",
                Bloco: "SUL",
                Aeroporto: "FOZ DO IGUAÇU",
                Cluster: "FOZ DO IGUAÇU"
            },
            {
                IATA: "LDB",
                ICAO: "SBLO",
                Bloco: "SUL",
                Aeroporto: "LONDRINA",
                Cluster: "FOZ DO IGUAÇU"
            },
            {
                IATA: "PET",
                ICAO: "SBPK",
                Bloco: "SUL",
                Aeroporto: "PELOTAS",
                Cluster: "FOZ DO IGUAÇU"
            },
            {
                IATA: "URG",
                ICAO: "SBUG",
                Bloco: "SUL",
                Aeroporto: "URUGUAIANA",
                Cluster: "FOZ DO IGUAÇU"
            }
        );
        ClearCollect(
            col_usuarios,
            User
        );
        UpdateContext({varCadCarregando: false})
    Children:
      - ContainerCadUser_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(247, 247, 247, 1)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderTitleCadUser:
                Control: CanvasComponent
                ComponentName: HeaderTitle
                Properties:
                  Height: =50
                  IconVisible: =true
                  ScreenNavigator: =frmAdmin
                  Width: =Parent.Width
                  var_subtitulo1: ="Administração"
                  var_subtitulo2: =""
                  var_tituloModulo: ="Cadastro de Usuários"
            - cntCadMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(247, 247, 247, 1)
                  Height: =Parent.Height - HeaderTitleCadUser.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =HeaderTitleCadUser.Height
                Children:
                  - cntCadShell:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - If(Parent.Height < 700, 16, 48)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Max(300, Parent.Width - If(Parent.Width < 700, 16, 64))
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =If(Parent.Height < 700, 8, 24)
                      Children:
                        - cntCadSidebar:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(57, 22, 148, 1)
                              Height: =Parent.Height-4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =Parent.Width >= 1100
                              Width: =300
                              Y: =2
                            Children:
                              - recCadSidebarOverlay:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 38, 255, 0.16)
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                              - lblCadBrand:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =24
                                    Text: ="Airport Now"
                                    Width: =240
                                    X: =28
                                    Y: =34
                              - lblCadSideTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(255, 255, 255, 0.72)
                                    Font: =Font.'Open Sans'
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Text: ="Quem acessa o AirPort Now"
                                    Width: =240
                                    X: =28
                                    Y: =75
                              - recCadSideDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(255, 255, 255, 0.18)
                                    Height: =1
                                    Width: =244
                                    X: =28
                                    Y: =117
                              - htmCadResumo:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =260
                                    HtmlText: |-
                                      ="<div style='font-family:Open Sans,Segoe UI,sans-serif;'>" &
                                      "<div style='font-size:12px;font-weight:600;color:rgba(255,255,255,.92);margin-bottom:14px;'>Base de usuários</div>" &
                                      "<table style='width:100%;border-collapse:collapse;'>" &
                                      "<tr><td style='padding:9px 0;font-size:12px;color:rgba(255,255,255,.78);'>Cadastrados</td>" &
                                      "<td style='text-align:right;font-size:20px;font-weight:800;color:#FFFFFF;'>" & CountRows(col_usuarios) & "</td></tr>" &
                                      "<tr><td style='padding:9px 0;font-size:12px;color:rgba(255,255,255,.78);'>Administradores</td>" &
                                      "<td style='text-align:right;font-size:20px;font-weight:800;color:#FDBA74;'>" &
                                      CountRows(Filter(col_usuarios, Autorizacao = "Admin" Or Autorizacao = "AdmAVSEC")) & "</td></tr>" &
                                      "<tr><td style='padding:9px 0;font-size:12px;color:rgba(255,255,255,.78);'>Atendem chamados</td>" &
                                      "<td style='text-align:right;font-size:20px;font-weight:800;color:#FFFFFF;'>" &
                                      CountRows(Filter(col_usuarios, usr_papel_chamados = "ATENDENTE" Or usr_papel_chamados = "GESTOR")) & "</td></tr>" &
                                      "<tr><td style='padding:9px 0;border-top:1px solid rgba(255,255,255,.18);font-size:12px;color:rgba(255,255,255,.6);'>Aguardando 1º acesso</td>" &
                                      "<td style='text-align:right;border-top:1px solid rgba(255,255,255,.18);font-size:20px;font-weight:800;color:rgba(255,255,255,.72);'>" &
                                      CountRows(Filter(col_usuarios, Validacao = 0)) & "</td></tr>" &
                                      "</table></div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =244
                                    X: =28
                                    Y: =144
                              - cntCadSenhaBox:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =RGBA(255, 255, 255, 0.16)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 0.08)
                                    Height: =106
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =244
                                    X: =28
                                    Y: =Parent.Height - 134
                                  Children:
                                    - lblCadSenhaTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =10
                                          Text: ="Senha inicial"
                                          Width: =204
                                          X: =18
                                          Y: =14
                                    - lblCadSenhaText:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(255, 255, 255, 0.68)
                                          Font: =Font.'Open Sans'
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =9
                                          Text: ="Todo cadastro e todo reset gravam ccr" & Year(Now()) & ". O usuário troca no primeiro acesso."
                                          Width: =204
                                          X: =18
                                          Y: =40
                        - cntCadPanel:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height-4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width - Self.X
                              X: =If(cntCadSidebar.Visible, 324, 0)
                              Y: =2
                            Children:
                              - lblCadEyebrow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(96, 70, 237, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    Text: ="ADMINISTRAÇÃO"
                                    Width: =260
                                    X: =If(Parent.Width < 600, 18, 28)
                                    Y: =20
                              - lblCadTitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =22
                                    Text: ="Cadastro de usuários"
                                    Width: =Parent.Width - (2 * Self.X)
                                    X: =If(Parent.Width < 600, 18, 28)
                                    Y: =42
                              - lblCadSubtitulo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(100, 116, 139, 1)
                                    Font: =Font.'Open Sans'
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Selecione alguém na lista para editar, ou busque um nome no diretório para cadastrar."
                                    Width: =Parent.Width - (2 * Self.X)
                                    X: =If(Parent.Width < 600, 18, 28)
                                    Y: =76
                              - recCadHeaderDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(226, 232, 240, 1)
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =108
                              - cntCadLista:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =Parent.Height - 232
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Min(400, Max(260, (Parent.Width - 72) * 0.30))
                                    X: =24
                                    Y: =124
                                  Children:
                                    - TextInputConsultaNome:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(203, 213, 225, 1)
                                          BorderThickness: =1
                                          Default: =""
                                          DelayOutput: =true
                                          Fill: =RGBA(248, 250, 252, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =34
                                          HintText: ="Buscar por nome"
                                          HoverBorderColor: =RGBA(96, 70, 237, 1)
                                          PaddingLeft: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =10
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =0
                                    - Label5_38:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(100, 116, 139, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =8
                                          Text: ="AEROPORTO"
                                          Width: =(Parent.Width - 10) / 2
                                          X: =0
                                          Y: =46
                                    - DropdownConsultaAeroporto:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AllowEmptySelection: =true
                                          BorderColor: =RGBA(203, 213, 225, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverFill: =RGBA(96, 70, 237, 1)
                                          Default: =Blank()
                                          Fill: =RGBA(248, 250, 252, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =32
                                          Items: =colAeros
                                          Items.Value: =Aeroporto
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(96, 70, 237, 1)
                                          Size: =9
                                          Width: =(Parent.Width - 10) / 2
                                          X: =0
                                          Y: =64
                                    - Label5_40:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(100, 116, 139, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =8
                                          Text: ="AUTORIZAÇÃO"
                                          Width: =(Parent.Width - 10) / 2
                                          X: =(Parent.Width + 10) / 2
                                          Y: =46
                                    - DropdownConsultaAutorizacao:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AllowEmptySelection: =true
                                          BorderColor: =RGBA(203, 213, 225, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverFill: =RGBA(96, 70, 237, 1)
                                          Default: =Blank()
                                          Fill: =RGBA(248, 250, 252, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =32
                                          Items: =["","Usuário","Admin","AdmAVSEC"]
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(96, 70, 237, 1)
                                          Size: =9
                                          Width: =(Parent.Width - 10) / 2
                                          X: =(Parent.Width + 10) / 2
                                          Y: =64
                                    - Label63:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(100, 116, 139, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =18
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =9
                                          Text: =galUser.AllItemsCount & " de " & CountRows(col_usuarios) & " usuário(s)"
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =106
                                    - galUser:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          BorderColor: =RGBA(226, 232, 240, 1)
                                          BorderStyle: =BorderStyle.None
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =Parent.Height - Self.Y
                                          Items: |-
                                            =SortByColumns(
                                                Filter(
                                                    col_usuarios,
                                                    StartsWith(
                                                        Aeroporto,
                                                        Text(DropdownConsultaAeroporto.Selected.Aeroporto)
                                                    ),
                                                    StartsWith(
                                                        Autorizacao,
                                                        Text(DropdownConsultaAutorizacao.Selected.Value)
                                                    ),
                                                    StartsWith(
                                                        usrNome,
                                                        Text(TextInputConsultaNome.Text)
                                                    )
                                                ),
                                                "usrNome",
                                                SortOrder.Ascending
                                            )
                                          LayoutMinHeight: =0
                                          ShowScrollbar: =true
                                          TemplatePadding: =0
                                          TemplateSize: =64
                                          Visible: =And(Not(varCadCarregando), Self.AllItemsCount > 0)
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =130
                                        Children:
                                          - htmCadLinha:
                                              Control: HtmlViewer@2.1.0
                                              Properties:
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Font: =Font.'Open Sans'
                                                Height: =62
                                                HtmlText: |-
                                                  ="<table style='width:100%;border-collapse:collapse;border-left:3px solid " &
                                                  If(varCadSelId = ThisItem.ID, "#6046ED", "#FFFFFF") &
                                                  ";border-bottom:1px solid #E2E8F0;font-family:Open Sans,Segoe UI,sans-serif;'><tr>" &
                                                  "<td style='vertical-align:top;padding:10px 6px 0 10px;'>" &
                                                  "<div style='font-size:12px;font-weight:700;color:#0F172A;'>" & Coalesce(ThisItem.usrNome, "—") & "</div>" &
                                                  "<div style='font-size:10px;color:#64748B;margin-top:4px;'>" &
                                                  Coalesce(ThisItem.Aeroporto, "—") & " &middot; " & Coalesce(ThisItem.Bloco, "—") & "</div></td>" &
                                                  "<td style='width:96px;vertical-align:top;text-align:right;padding:10px 8px 0 0;'>" &
                                                  "<span style='display:inline-block;background:" &
                                                  Switch(ThisItem.Autorizacao, "Admin", "#EEF2FF", "AdmAVSEC", "#FFF7ED", "#F1F5F9") &
                                                  ";color:" &
                                                  Switch(ThisItem.Autorizacao, "Admin", "#6046ED", "AdmAVSEC", "#B45309", "#64748B") &
                                                  ";padding:3px 8px;font-size:9px;font-weight:700;'>" &
                                                  Upper(Coalesce(ThisItem.Autorizacao, "—")) & "</span>" &
                                                  If(
                                                      ThisItem.usr_papel_chamados = "GESTOR" Or ThisItem.usr_papel_chamados = "ATENDENTE",
                                                      "<div style='font-size:9px;font-weight:700;color:#391694;margin-top:5px;'>" & ThisItem.usr_papel_chamados & "</div>",
                                                      ""
                                                  ) &
                                                  "</td></tr></table>"
                                                OnSelect: |-
                                                  =Select(Parent);
                                                  UpdateContext({varCadSelId: ThisItem.ID});
                                                  ClearCollect(
                                                      colUsrPerfTemp,
                                                      Filter(
                                                          UserPerfil,
                                                          IdUser = ThisItem.ID
                                                      )
                                                  );
                                                  Set(
                                                      varCadAad,
                                                      First(
                                                          UsuáriosdoOffice365.SearchUser({searchTerm: ThisItem.usrNome})
                                                      )
                                                  );
                                                  UpdateContext({varCadTentou: false})
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =10
                                                Width: =Parent.Width - 34
                                                X: =0
                                                Y: =0
                                          - Icon10:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                Color: =RGBA(100, 116, 139, 1)
                                                Height: =22
                                                Icon: =Icon.Lock
                                                OnSelect: |-
                                                  =Select(Parent);
                                                  UpdateContext(
                                                      {
                                                          varCadSelId: ThisItem.ID,
                                                          varCadConfirmar: "RESET"
                                                      }
                                                  )
                                                PaddingBottom: =4
                                                PaddingLeft: =4
                                                PaddingRight: =4
                                                PaddingTop: =4
                                                Tooltip: ="Resetar a senha deste usuário"
                                                Width: =22
                                                X: =Parent.Width - 28
                                                Y: =20
                                    - cntCadListaVazia:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          BorderColor: =RGBA(226, 232, 240, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(248, 250, 252, 1)
                                          Height: =140
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =And(Not(varCadCarregando), galUser.AllItemsCount = 0)
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =130
                                        Children:
                                          - lblCadListaVaziaTitulo:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                Color: =RGBA(15, 23, 42, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =26
