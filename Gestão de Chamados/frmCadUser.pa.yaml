                                          Notify(
                                              "Já existe um cadastro com este e-mail.",
                                              NotificationType.Warning,
                                              4000
                                          ),

                                          !IsBlank(varCadOcupadoDesde) && DateDiff(varCadOcupadoDesde, Now(), TimeUnit.Seconds) < 30,
                                          Notify(
                                              "Aguarde: a gravação anterior ainda está sendo processada.",
                                              NotificationType.Warning,
                                              3000
                                          ),

                                          UpdateContext({varCadOcupadoDesde: Now()});
                                          IfError(
