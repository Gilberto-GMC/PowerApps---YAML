                                    Height: =38
                                    Size: =9
                                    Text: =If(varWizPasso = 6, "Confira e envie. Depois disso o acompanhamento é por Meus chamados.", "Passo " & varWizPasso & " de 5 — os campos com * são obrigatórios.")
                                    Visible: =Parent.Width >= 700
                                    Width: =Parent.Width - 420
                                    X: =28
                                    Y: =Parent.Height - 62
                              - btnWizVoltar:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderRadius: =0
                                    DisplayMode: =If(IsBlank(varWizOcupadoDesde), DisplayMode.Edit, DisplayMode.Disabled)
                                    FontSize: =11
                                    Height: =40
                                    Icon: ="ChevronLeft"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    OnSelect: |-
                                      =If(
                                          varWizPasso > 1,
                                          UpdateContext(
                                              {
                                                  varWizPasso: varWizPasso - 1,
                                                  varWizTentou: false
                                              }
                                          ),
                                          Navigate(
                                              ScreenServiceDeskForm,
                                              ScreenTransition.Fade
                                          )
                                      )
                                    Text: =If(varWizPasso > 1, "Voltar", "Cancelar")
                                    Width: =130
                                    X: =Parent.Width - 320
                                    Y: =Parent.Height - 62
                              - btnWizAvancar:
                                  Control: Button@0.0.45
                                  Properties:
                                    BorderRadius: =0
                                    DisplayMode: =If(IsBlank(varWizOcupadoDesde), DisplayMode.Edit, DisplayMode.Disabled)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Icon: ="ChevronRight"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =UpdateContext({varWizTentou: true});
                                      If(
                                          (varWizPasso = 1 && (IsBlank(Trim(txtWizNome.Text)) || IsBlank(cmbWizArea.Selected.Value) || CountRows(cmbWizAeros.SelectedItems) = 0)) ||
                                          (varWizPasso = 2 && (IsBlank(Trim(txtWizHoje.Text)) || IsBlank(cmbWizFerramenta.Selected.Value))) ||
                                          (varWizPasso = 3 && (IsBlank(Trim(txtWizRegistrar.Text)) || IsBlank(Trim(txtWizConsulta.Text)))) ||
                                          (varWizPasso = 4 && (IsBlank(cmbWizRegulatorio.Selected.Value) || (cmbWizRegulatorio.Selected.Value = "SIM" && IsBlank(Trim(txtWizNorma.Text))))) ||
                                          (varWizPasso = 5 && (IsBlank(cmbWizPatrocinador.Selected.Email) || IsBlank(Trim(txtWizImpacto.Text)))),
                                          Notify(
                                              "Preencha os campos obrigatórios deste passo antes de avançar.",
                                              NotificationType.Warning,
                                              4000
                                          ),
                                          UpdateContext(
                                              {
                                                  varWizPasso: varWizPasso + 1,
                                                  varWizTentou: false
                                              }
                                          )
                                      )
                                    Text: ="Avançar"
                                    Visible: =varWizPasso < 6
                                    Width: =160
                                    X: =Parent.Width - 188
                                    Y: =Parent.Height - 62
                              - btnWizEnviar:
                                  Control: Button@0.0.45
                                  Properties:
                                    BorderRadius: =0
                                    DisplayMode: =If(IsBlank(varWizOcupadoDesde), DisplayMode.Edit, DisplayMode.Disabled)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =40
                                    Icon: ="Send"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    OnSelect: |-
                                      =If(
                                          !IsBlank(varWizOcupadoDesde) && DateDiff(varWizOcupadoDesde, Now(), TimeUnit.Seconds) < 30,
                                          Notify(
                                              "Aguarde: o envio anterior ainda está sendo processado.",
                                              NotificationType.Warning,
                                              3000
                                          ),

                                          UpdateContext({varWizOcupadoDesde: Now()});
                                          Set(
                                              varWizNumChamado,
                                              Coalesce(
                                                  First(
                                                      Sort(
                                                          tbl_ServiceDesk,
                                                          desk_id,
                                                          SortOrder.Descending
                                                      )
                                                  ).desk_id + 1,
                                                  1
                                              )
                                          );
                                          IfError(
                                              Patch(
                                                  tbl_ServiceDesk,
                                                  Defaults(tbl_ServiceDesk),
                                                  {
                                                      desk_id: varWizNumChamado,
                                                      desk_categoria: "Solicitação de novo módulo",
                                                      desk_categoria_chave: "NOVO_MODULO",
                                                      desk_ciclo: "DEMANDA",
                                                      desk_status: "Aberto",
                                                      desk_prioridade: If(cmbWizRegulatorio.Selected.Value = "SIM", "ALTA", "MEDIA"),
                                                      desk_solicitante_email: varEmailUser,
                                                      desk_descricao:
                                                          "MÓDULO: " & Trim(txtWizNome.Text) & Char(10) &
                                                          "ÁREA: " & cmbWizArea.Selected.Value & Char(10) &
                                                          "AEROPORTOS: " & Concat(cmbWizAeros.SelectedItems, Value, "; ") & Char(10) & Char(10) &
                                                          "COMO É HOJE: " & Trim(txtWizHoje.Text) & Char(10) &
                                                          "FERRAMENTA ATUAL: " & cmbWizFerramenta.Selected.Value & Char(10) & Char(10) &
                                                          "O QUE PRECISA REGISTRAR: " & Trim(txtWizRegistrar.Text) & Char(10) &
                                                          "QUEM CONSULTA: " & Trim(txtWizConsulta.Text) & Char(10) & Char(10) &
                                                          "REGULATÓRIA: " & Coalesce(cmbWizRegulatorio.Selected.Value, "NAO") & Char(10) &
                                                          "PATROCINADOR: " & cmbWizPatrocinador.Selected.usrNome & Char(10) &
                                                          "IMPACTO SE NÃO FIZER: " & Trim(txtWizImpacto.Text)
                                                  }
                                              );
                                              Patch(
                                                  tb_chamadoDemanda,
                                                  Defaults(tb_chamadoDemanda),
                                                  {
                                                      id_fk_chamado: varWizNumChamado,
                                                      nome_modulo: Trim(txtWizNome.Text),
                                                      area: cmbWizArea.Selected.Value,
                                                      aeroportos: Concat(cmbWizAeros.SelectedItems, Value, "; "),
                                                      como_e_hoje: Trim(txtWizHoje.Text),
                                                      ferramenta_atual: cmbWizFerramenta.Selected.Value,
                                                      volume_mensal: Value(txtWizVolume.Text),
                                                      tempo_gasto: cmbWizTempo.Selected.Value,
                                                      quem_executa: Trim(txtWizQuemExecuta.Text),
                                                      o_que_registrar: Trim(txtWizRegistrar.Text),
                                                      quem_consulta: Trim(txtWizConsulta.Text),
                                                      decisoes: Trim(txtWizDecisoes.Text),
                                                      indicadores: Trim(txtWizIndicadores.Text),
                                                      regulatorio: If(cmbWizRegulatorio.Selected.Value = "SIM", 1, 0),
                                                      norma: Trim(txtWizNorma.Text),
                                                      exige_evidencia: If(cmbWizEvidencia.Selected.Value = "SIM", 1, 0),
                                                      exige_aprovacao: If(cmbWizAprovacao.Selected.Value = "SIM", 1, 0),
                                                      patrocinador_email: cmbWizPatrocinador.Selected.Email,
                                                      prazo_desejado: dtpWizPrazo.SelectedDate,
                                                      impacto_sem: Trim(txtWizImpacto.Text)
                                                  }
                                              );
                                              Patch(
                                                  tb_chamadoHistorico,
                                                  Defaults(tb_chamadoHistorico),
                                                  {
                                                      id_fk_chamado: varWizNumChamado,
                                                      status_para: "Aberto",
                                                      autor_email: varEmailUser,
                                                      observacao: "Demanda aberta pelo roteiro guiado de novo módulo."
                                                  }
                                              );
                                              Notify(
                                                  "Demanda #" & Text(varWizNumChamado, "000000") & " registrada. Acompanhe em Meus chamados.",
                                                  NotificationType.Success,
                                                  6000
                                              );
                                              Set(
                                                  varWizNumChamado,
                                                  Blank()
                                              );
                                              Navigate(
                                                  ScreenMeusChamados,
                                                  ScreenTransition.Fade
                                              ),
                                              Notify(
                                                  "Não foi possível registrar a demanda. Confira a conexão e tente novamente.",
                                                  NotificationType.Error,
                                                  6000
                                              )
                                          );
                                          UpdateContext({varWizOcupadoDesde: Blank()})
                                      )
                                    Text: ="Enviar solicitação"
                                    Visible: =varWizPasso = 6
                                    Width: =188
                                    X: =Parent.Width - 216
                                    Y: =Parent.Height - 62
                              - cntWizLoading:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 0.9)
                                    Height: =Parent.Height
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =Or(varWizCarregando, Not(IsBlank(varWizOcupadoDesde)))
                                    Width: =Parent.Width
                                  Children:
                                    - lblWizLoading:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(57, 22, 148, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          Size: =13
                                          Text: =If(varWizCarregando, "Preparando o roteiro...", "Registrando a demanda...")
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =(Parent.Height - Self.Height) / 2
