                                            Height: =Parent.Height
                                            HtmlText: |-
                                              ="<div style='font-family:Open Sans,Segoe UI,sans-serif;color:#334155;'>" &
                                              "<table style='width:100%;border-collapse:collapse;font-size:11px;'>" &
                                              "<tr><td style='padding:6px 0;width:210px;color:#64748B;'>Nome do módulo</td><td style='padding:6px 0;font-weight:700;color:#0F172A;'>" & Coalesce(txtWizNome.Text, "—") & "</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Área</td><td style='padding:6px 0;'>" & Coalesce(cmbWizArea.Selected.Value, "—") & "</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Aeroportos</td><td style='padding:6px 0;'>" & Coalesce(Concat(cmbWizAeros.SelectedItems, Value, "; "), "—") & "</td></tr>" &
                                              "<tr><td colspan='2' style='padding:12px 0 4px 0;font-weight:800;color:#391694;font-size:10px;letter-spacing:.06em;'>COMO É HOJE</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Situação atual</td><td style='padding:6px 0;'>" & Left(Substitute(Coalesce(txtWizHoje.Text, "—"), "<", " "), 300) & "</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Ferramenta</td><td style='padding:6px 0;'>" & Coalesce(cmbWizFerramenta.Selected.Value, "—") & "</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Volume / tempo</td><td style='padding:6px 0;'>" &
                                              Coalesce(txtWizVolume.Text, "—") & " por mês &middot; " & Coalesce(cmbWizTempo.Selected.Value, "—") & "</td></tr>" &
                                              "<tr><td colspan='2' style='padding:12px 0 4px 0;font-weight:800;color:#391694;font-size:10px;letter-spacing:.06em;'>O QUE PRECISA MUDAR</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Registrar</td><td style='padding:6px 0;'>" & Left(Substitute(Coalesce(txtWizRegistrar.Text, "—"), "<", " "), 300) & "</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Quem consulta</td><td style='padding:6px 0;'>" & Left(Substitute(Coalesce(txtWizConsulta.Text, "—"), "<", " "), 200) & "</td></tr>" &
                                              "<tr><td colspan='2' style='padding:12px 0 4px 0;font-weight:800;color:#391694;font-size:10px;letter-spacing:.06em;'>REGRAS E PATROCÍNIO</td></tr>" &
                                              "<tr><td style='padding:6px 0;color:#64748B;'>Regulatória</td><td style='padding:6px 0;'>" &
