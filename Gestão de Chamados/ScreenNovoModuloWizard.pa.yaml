Screens:
  ScreenNovoModuloWizard:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =UpdateContext(
            {
                varWizCarregando: true,
                varWizPasso: 1,
                varWizTentou: false,
                varWizOcupadoDesde: Blank()
            }
        );
        Reset(txtWizNome);
        Reset(cmbWizArea);
        Reset(cmbWizAeros);
        Reset(txtWizHoje);
        Reset(cmbWizFerramenta);
        Reset(txtWizVolume);
        Reset(cmbWizTempo);
        Reset(txtWizQuemExecuta);
        Reset(txtWizRegistrar);
        Reset(txtWizConsulta);
        Reset(txtWizDecisoes);
        Reset(txtWizIndicadores);
        Reset(cmbWizRegulatorio);
        Reset(txtWizNorma);
        Reset(cmbWizEvidencia);
        Reset(cmbWizAprovacao);
        Reset(cmbWizPatrocinador);
        Reset(dtpWizPrazo);
        Reset(txtWizImpacto);
        ClearCollect(
            colWizPassos,
            Table(
                {N: 1, Nome: "O que você precisa"},
                {N: 2, Nome: "Como é hoje"},
                {N: 3, Nome: "O que precisa mudar"},
                {N: 4, Nome: "Regras e obrigações"},
                {N: 5, Nome: "Patrocínio e urgência"},
                {N: 6, Nome: "Revisão"}
            )
        );
        ClearCollect(
            colWizUsuarios,
            User
        );
        ClearCollect(
            colWizAreas,
            Sort(
                Distinct(colWizUsuarios, Area),
                Value
            )
        );
        ClearCollect(
            colWizAeros,
            Sort(
                Distinct(colWizUsuarios, Aeroporto),
                Value
            )
        );
        Set(
            varWizNumChamado,
            Coalesce(
                First(
                    Sort(
                        tbl_ServiceDesk,
                        desk_id,
                        SortOrder.Descending
                    )
                ).desk_id + 1,
                1
            )
        );
        UpdateContext({varWizCarregando: false})
    Children:
      - ContainerWiz_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(247, 247, 247, 1)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderTitleWiz:
                Control: CanvasComponent
                ComponentName: HeaderTitle
                Properties:
                  Height: =50
                  IconVisible: =true
                  ScreenNavigator: =ScreenServiceDeskForm
                  Width: =Parent.Width
                  var_subtitulo1: ="Suporte e atendimento"
                  var_subtitulo2: =""
                  var_tituloModulo: ="Solicitação de novo módulo"
            - cntWizMain:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(247, 247, 247, 1)
                  Height: =Parent.Height - HeaderTitleWiz.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  Y: =HeaderTitleWiz.Height
                Children:
                  - cntWizShell:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - If(Parent.Height < 700, 16, 48)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Max(300, Parent.Width - If(Parent.Width < 700, 16, 64))
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =If(Parent.Height < 700, 8, 24)
                      Children:
                        - cntWizSidebar:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(57, 22, 148, 1)
                              Height: =Parent.Height-4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
