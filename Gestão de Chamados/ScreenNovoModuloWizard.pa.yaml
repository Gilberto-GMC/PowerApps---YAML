                              Width: =300
                              Y: =2
                            Children:
                              - recWizSidebarOverlay:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(0, 38, 255, 0.16)
                                    Height: =Parent.Height
                                    Width: =Parent.Width
                              - lblWizBrand:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(255, 255, 255, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =24
                                    Text: ="Airport Now"
                                    Width: =240
                                    X: =28
                                    Y: =34
                              - lblWizSideTitle:
                                  Control: Label@2.5.1
