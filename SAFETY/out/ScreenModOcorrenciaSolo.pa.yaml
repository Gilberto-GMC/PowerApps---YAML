                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// ── TRAVA DE REENTRÂNCIA ──────────────────────────────────────
                          // Clique duplo / toque repetido no celular gravava a ocorrência
                          // duas vezes. A trava expira sozinha em 60s para nunca deixar o
                          // botão morto se algo falhar no meio.
                          If(
                              var_salvandoOcoSolo And DateDiff(
                                  var_salvandoEmOcoSolo,
                                  Now(),
                                  TimeUnit.Seconds
                              ) < 60,
                              Notify(
                                  "Gravação em andamento, aguarde.",
                                  NotificationType.Warning
                              ),
                              UpdateContext(
                                  {
                                      var_salvandoOcoSolo: true,
                                      var_salvandoEmOcoSolo: Now()
                                  }
                              );
                              ClearCollect(
                                  col_ocoSoloImgList,
                                  '16.1-tbl_OcoSoloImagens'
                              );
                              UpdateContext(
                                  {
                                      varVisibleSpinerOcoSoloCadastrar: true,
                                      varCampoVazio: false
                                  }
                              );
                              Switch(
                                  true,
                                  IsBlank(cmbOcoSoloHora.Selected.Value),
                                  UpdateContext(
                                      {
                                          varCampoVazio: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbOcoSoloMinuto.Selected.Value),
                                  UpdateContext(
                                      {
                                          varCampoVazio: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(dropOcoSoloCiaAerea.Selected.Value),
                                  UpdateContext(
                                      {
                                          varCampoVazio: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  dropOcoSoloCiaAerea.Selected.Value = "Aviação geral" And IsBlank(TxtOcoSoloPrefixoNome.Text),
                                  UpdateContext(
                                      {
                                          varCampoVazio: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  dropOcoSoloCiaAerea.Selected.Value = "Internacional" And IsBlank(TxtOcoSoloPrefixoNome.Text),
                                  UpdateContext(
                                      {
                                          varCampoVazio: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtOcoSoloMatAero.Text),
                                  UpdateContext(
                                      {
