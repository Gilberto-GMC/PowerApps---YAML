            - GalleryOcoSoloListar:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbOcoSoloAeroporto.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbOcoSoloBloco.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpOcoSoloDtfInicio.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpOcoSoloDtfTermino.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '16.1-tbl_OcoSolo',
                                        ocoSolo_aeroporto = _aero,
                                        ocoSolo_data >= _ini,
                                        ocoSolo_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '16.1-tbl_OcoSolo',
                                        ocoSolo_bloco = _bloco,
                                        ocoSolo_data >= _ini,
                                        ocoSolo_data < _fim
                                    ),
                                    Filter(
                                        '16.1-tbl_OcoSolo',
                                        ocoSolo_data >= _ini,
                                        ocoSolo_data < _fim
                                    )
                                ),
                                IsBlank(cmbStatus_9.Selected.Value) ||
                                Status = cmbStatus_9.Selected.Value,
                                IsBlank(txtOcoSoloBuscar.Text) ||
                                ID = Value(txtOcoSoloBuscar.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =200
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Container1_9:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =If(HtmlText2_10.Height < 40, 40 , HtmlText2_10.Height)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
