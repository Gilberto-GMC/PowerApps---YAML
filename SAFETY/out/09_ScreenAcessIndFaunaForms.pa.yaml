                                          SortByColumns(
                                              Filter(
                                                  '14.7-tbl_AcessIndFauna',
                                                  aceIndFauna_id > 0
                                              ),
                                              "ID",
                                              SortOrder.Descending
                                          )
                                      ).aceIndFauna_id + 1
                                  )
                              }
                          );
                          Switch(
                              true,
                              cmbAceIndFauHoraCadastro.Selected.Value = "hor",
                              UpdateContext(
