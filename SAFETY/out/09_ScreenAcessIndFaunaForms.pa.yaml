# ************************************************************************************************
# AirportNow — Safety & Fauna  ·  ScreenAcessIndFaunaForms  (correção pontual)
#
# ⚠️ LOCALE — ARQUIVO NO FORMATO INVARIANTE ("," para argumentos, ";" para encadear,
#    "." decimal). É assim que a EXIBIÇÃO DE CÓDIGO do Studio lê e grava, mesmo com o
#    Studio em pt-BR. NÃO converta para ";" / ";;": o arquivo para de compilar.
#
# COLAR EM: Studio > tela ScreenAcessIndFaunaForms > exibição de código > substituir tudo.
#
# POR QUE ESTA TELA ENTROU NA ENTREGA
#
#   Ela é a única tela que FICA no app e ainda apontava para uma das 21 telas que serão
#   excluídas. Sem esta correção, apagar ScreenIncursaoPista quebra o formulário de
#   Acesso Indevido de Fauna.
#
# O BUG (de cópia, estava em produção)
#
#   Ao salvar um Acesso Indevido de FAUNA, a tela de sucesso voltava para
#   ScreenIncursaoPista — o módulo de Incursão de Pista. O usuário cadastrava fauna e
#   caía na lista do módulo errado.
#
#       {var_navigateSucess: ScreenIncursaoPista}   ->   {var_navigateSucess: ScreenFauna}
#
# O QUE ESTA TELA AINDA NÃO TEM (diferente das 7 ScreenMod*)
#
#   Esta é uma correção pontual, não a refatoração completa. Continuam pendentes aqui:
#     · o ID ainda é calculado no cliente (max + 1) — mesmo risco de protocolo duplicado;
#     · aceIndFauna_aeroporto ainda grava varAeroUser fixo, sem o combo de aeroporto;
#     · sem trava de reentrância no botão de gravar.
#   Me peça e eu aplico o mesmo tratamento das ScreenMod* aqui.
# ************************************************************************************************
