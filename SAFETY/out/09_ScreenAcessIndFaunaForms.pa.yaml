                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbAceIndFauMinuCadastro.Selected.Value = "min",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtAceIndFauLocal.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtAceIndFauMapaGrade.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(cmbAceIndFauCausaProvavel.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
