                              cmbAceIndFauCausaProvavel.Selected.Value = "Outros" And IsBlank(TxtAceIndFauCausaProvavelOutros.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
