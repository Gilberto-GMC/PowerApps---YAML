            - GalleryExcPistaRegistros:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbExcPistaAeroporto.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbExcPistaBloco.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpExcPistaDtfInicio.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpExcPistaDtfTermino.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '14.6-tbl_ExcPista',
                                        excPista_aeroporto = _aero,
                                        excPista_data >= _ini,
                                        excPista_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '14.6-tbl_ExcPista',
                                        excPista_bloco = _bloco,
                                        excPista_data >= _ini,
                                        excPista_data < _fim
                                    ),
                                    Filter(
                                        '14.6-tbl_ExcPista',
                                        excPista_data >= _ini,
                                        excPista_data < _fim
                                    )
                                ),
                                IsBlank(cmbStatus_4.Selected.Value) ||
                                Status = cmbStatus_4.Selected.Value,
                                IsBlank(txtExcPistaBuscar.Text) ||
                                ID = Value(txtExcPistaBuscar.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =80
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Container1_4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =If(HtmlText2_5.Height < 40, 40 , HtmlText2_5.Height)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
