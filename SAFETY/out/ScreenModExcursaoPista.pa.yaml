                  - ButtonCanvas7_33:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// ── TRAVA DE REENTRÂNCIA ──────────────────────────────────────
                          // Clique duplo / toque repetido no celular gravava a ocorrência
                          // duas vezes. A trava expira sozinha em 60s para nunca deixar o
                          // botão morto se algo falhar no meio.
                          If(
                              var_salvandoExcPista And DateDiff(
                                  var_salvandoEmExcPista,
                                  Now(),
                                  TimeUnit.Seconds
                              ) < 60,
                              Notify(
                                  "Gravação em andamento, aguarde.",
                                  NotificationType.Warning
                              ),
                              UpdateContext(
                                  {
                                      var_salvandoExcPista: true,
                                      var_salvandoEmExcPista: Now()
                                  }
                              );
                              UpdateContext(
                                  {
                                      var_visibleSpiner: true,
                                      var_formErro: false
                                  }
                              );
                              Switch(
                                  true,
                                  IsBlank(cmbExcPistaHoraCadastro.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaMinuCadastro.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaLocal.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaCondPista.Selected) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaCondMeteor.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaTeto.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaVisibi.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaMatAero.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaTipOperacao.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaPontoSaida.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaDistPercorrida.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaPosFinalAero.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaEvacEmergencia.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaDanosAero.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbExcPistaAeroImpraticavel.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtExcPistaDescOcorrencia.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  CountRows(col_excPistaImg) = 0,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  UpdateContext(
                                      {var_formErro: false
                                          //;varBordaDefault: Color.Red
                              }
                                  )
                              );
                              If(
                                  var_formErro = true,
                                  Notify(
                                      "Atenção todas as informações devem ser preenchidas!",
                                      NotificationType.Error
                                  ),
                                  //Insert de dados no database------------------------------------------------------------------------------
                                  // ── GRAVAÇÃO ────────────────────────────────────────────────────
                                  // O ID deixou de ser calculado no cliente (max + 1): dois usuários
                                  // salvando ao mesmo tempo geravam o MESMO protocolo e os filhos
                                  // (imagens/envolvidos) iam parar na ocorrência errada.
                                  // Agora grava-se primeiro, lê-se o ID real devolvido pelo SharePoint
                                  // e só então ele é carimbado de volta em excPista_id.
                                  UpdateContext(
                                      {
                                          var_regNovoExcPista: Patch(
                                              '14.6-tbl_ExcPista',
                                              Defaults('14.6-tbl_ExcPista'),
                                              {
                                                  excPista_data: dtpExcPistaDataCadastro.SelectedDate,
                                                  excPista_hora: cmbExcPistaHoraCadastro.Selected.Value & ":" & cmbExcPistaMinuCadastro.Selected.Value,
                                                  excPista_local: TxtExcPistaLocal.Text,
                                                  excPista_condPista: cmbExcPistaCondPista.Selected.Value,
                                                  excPista_condMeteo: cmbExcPistaCondMeteor.Selected.Value,
                                                  excPista_teto: TxtExcPistaTeto.Text,
                                                  excPista_visibilidade: TxtExcPistaVisibi.Text,
                                                  excPista_matricula: TxtExcPistaMatAero.Text,
                                                  excPista_tipOperacao: cmbExcPistaTipOperacao.Selected.Value,
                                                  excPista_pontoSaida: TxtExcPistaPontoSaida.Text,
                                                  excPista_distPercorrida: TxtExcPistaDistPercorrida.Text,
                                                  excPista_posFinalAero: TxtExcPistaPosFinalAero.Text,
                                                  excPista_evacEmergencia: cmbExcPistaEvacEmergencia.Selected.Value,
                                                  excPista_danosAero: TxtExcPistaDanosAero.Text,
                                                  excPista_aeroImpraticavel: cmbExcPistaAeroImpraticavel.Selected.Value,
                                                  excPista_descOcorrencia: TxtExcPistaDescOcorrencia.Text,
                                                  excPista_bloco: LookUp(
                                                      colAeros,
                                                      Aeroporto = cmbFrmExcPistaAeroporto.Selected.Aeroporto
                                                  ).Bloco,
                                                  excPista_aeroporto: cmbFrmExcPistaAeroporto.Selected.Aeroporto
                                              }
                                          )
                                      }
                                  );
                                  UpdateContext(
                                      {var_excPistaId: Coalesce(
                                          var_regNovoExcPista.ID,
                                          0
                                      )}
                                  );
                                  If(
                                      var_excPistaId <= 0,
                                      // falhou: avisa, libera a tela e não cria nenhum filho órfão
                                      Notify(
                                          "Não foi possível gravar a ocorrência. Verifique a conexão e tente novamente.",
                                          NotificationType.Error,
                                          6000
                                      );
                                      UpdateContext(
                                          {
                                              var_visibleSpiner: false,
                                              var_salvandoExcPista: false
                                          }
                                      ),
                                      Patch(
                                          '14.6-tbl_ExcPista',
                                          var_regNovoExcPista,
                                          {excPista_id: var_excPistaId}
                                      )
                                  );
                                  //insert das imagens
                              If(
                                  var_excPistaId > 0,
                                  ForAll(
                                          col_excPistaImg,
                                          Patch(
                                              '14.6-tbl_ExcPistaImg',
                                              Defaults('14.6-tbl_ExcPistaImg'),
                                              {
                                                  excPistaImg_idOcorrencia: var_excPistaId,
                                                  excPistaImg_imagem: img
                                              }
                                          )
                                      )
                              );
                                  If(
                                      var_excPistaId > 0,
                                      Select(ButtonResetFormExcPista);
                                      Navigate(
                                          ScreenSucesso,
                                          ScreenTransition.Fade,
                                          {var_navigateSucess: ScreenModExcursaoPista}
                                      )
                                  )
                              );
                              UpdateContext({var_visibleSpiner: false});
                              UpdateContext(
                                  {
                                      var_salvandoExcPista: false,
                                      var_visibleSpiner: false
                                  }
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Salvar"
                        Width: =150
