            - GalleryDerFlu:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbDerFluAeroporto.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbDerFluBloco.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpDerFluDtfInicio.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpDerFluDtfTermino.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '14.2-tbl_DerramamentoDeFluidos',
                                        derFlu_aeroporto = _aero,
                                        derFlu_data >= _ini,
                                        derFlu_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '14.2-tbl_DerramamentoDeFluidos',
                                        derFlu_bloco = _bloco,
                                        derFlu_data >= _ini,
                                        derFlu_data < _fim
                                    ),
                                    Filter(
                                        '14.2-tbl_DerramamentoDeFluidos',
                                        derFlu_data >= _ini,
                                        derFlu_data < _fim
                                    )
                                ),
                                IsBlank(cmbStatus_2.Selected.Value) ||
                                Status = cmbStatus_2.Selected.Value,
                                IsBlank(txtDerFluBuscar.Text) ||
                                ID = Value(txtDerFluBuscar.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =80
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Container1_2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =If(HtmlText2_3.Height < 40, 40 , HtmlText2_3.Height)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
