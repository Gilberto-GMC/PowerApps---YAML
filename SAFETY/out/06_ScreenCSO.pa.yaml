      - HtmlText3_2:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =856
            HtmlText: "=\n\"<div style='font-family:Segoe UI, sans-serif; font-size:12px; width:800px; margin:0 auto; border:1px solid #ccc; padding:20px;'>\n    <!-- Cabeçalho -->\n    <table style='width:100%; border-collapse:collapse; margin-bottom:20px;'>\n        <tr>\n            <td style='width:50%; font-weight:bold;'>FOR-CO-OPER-002</td>\n            <td style='width:50%; text-align:right;'>Revisão 01 | Data: \" & DateValue(CurrentItem.Modificado) & \"</td>\n        </tr>\n        <tr>\n            <td colspan='2' style='text-align:center; font-size:18px; font-weight:bold; padding:10px; background-color:#f2f2f2;'>\n                ATA DE REUNIÃO - COMISSÃO DE SEGURANÇA OPERACIONAL\n            </td>\n        </tr>\n    </table>\n\n    <!-- Informações da Reunião -->\n    <table style='width:100%; border-collapse:collapse; margin-bottom:15px;'>\n        <tr><td style='padding:6px; font-weight:bold; width:150px;'>Tipo:</td><td style='padding:6px;'>\" & CurrentItem.Tipo_da_Reunião.Value & \"</td></tr>\n        <tr><td style='padding:6px; font-weight:bold;'>Data:</td><td style='padding:6px;'>\" & CurrentItem.'Data/Hora' & \"</td></tr>\n        <tr><td style='padding:6px; font-weight:bold;'>Local:</td><td colspan='3' style='padding:6px;'>\" & CurrentItem.Local & \"</td></tr>\n        <tr><td style='padding:6px; font-weight:bold;'>Modalidade:</td><td colspan='3' style='padding:6px;'>\" & CurrentItem.Modalidade.Value & \"</td></tr>\n    </table>\n\n    <!-- Objetivo -->\n    <div style='font-weight:bold; margin-bottom:6px;'>Objetivo:</div>\n    <div style='border:1px solid #ccc; padding:8px; margin-bottom:15px;'>\" & CurrentItem.Objetivo & \"</div>\n\n    <!-- Lista de Presença -->\n    <table style='width:100%; border-collapse:collapse; margin-bottom:15px;'>\n        <thead>\n            <tr style='background-color:#6046ed; color:#fff; text-align:center;'>\n                <th style='border:1px solid #ccc; padding:8px;'>Participante</th>\n                <th style='border:1px solid #ccc; padding:8px;'>Empresa</th>\n                <th style='border:1px solid #ccc; padding:8px;'>Assinatura</th>\n            </tr>\n        </thead>\n        <tbody>\" & Concat(\n            col_partipantes,\n            \"<tr>\n                <td style='border:1px solid #ccc; padding:6px;'>\" & nome & \"</td>\n                <td style='border:1px solid #ccc; padding:6px;'>\" & empresa & \"</td>\n                <td style='border:1px solid #ccc; padding:6px; text-align:center;'>__________________________</td>\n            </tr>\"\n        ) & \"</tbody>\n    </table>\n\n    <!-- Assuntos abordados -->\n    <div style='font-weight:bold; margin-top:10px;'>Assuntos abordados:</div>\n    <div style='border:1px solid #ccc; padding:8px; margin-bottom:15px;'>\" & CurrentItem.Assuntos_Abordados & \"</div>\n\n    <!-- Desdobramentos -->\n    <div style='font-weight:bold; font-size:14px; margin-bottom:8px; color:#004b87;'>Desdobramentos da Reunião</div>\n    <table style='width:100%; border-collapse:collapse; font-size:12px;'>\n        <thead>\n            <tr style='background-color:#6046ed; color:#fff; text-align:center;'>\n                <th style='border:1px solid #ccc; padding:8px;'>Data</th>\n               \n                <th style='border:1px solid #ccc; padding:8px;'>Descrição</th>\n            </tr>\n        </thead>\n        <tbody>\" & Concat(\n            Sort(\n                Filter(tbl_desdobramentos, Modulo = \"CSO\" && ID_ocorrencia = CurrentItem.ID),\n                Criado, SortOrder.Ascending\n            ),\n            \"<tr>\n                <td style='border:1px solid #ccc; padding:6px; text-align:center; width:120px;'>\" & Criado & \"</td>\n                \n                <td style='border:1px solid #ccc; padding:6px;'>\" & descricao & \"</td>\n            </tr>\"\n        ) & \"</tbody>\n    </table>\n    <div style='margin-top:10px; font-size:11px; color:#666;'>*As demandas levantadas nesta reunião serão acompanhadas pelo comitê.</div>\n\n    <!-- Rodapé -->\n    <div style='width:100%; text-align:right; font-size:11px; color:#666; margin-top:20px; border-top:1px solid #ccc; padding-top:6px;'>\n        Ata criada por \" & CurrentItem.'Criado por'.DisplayName & \" em \" & Text(CurrentItem.Criado, \"dd/mm/yyyy HH:mm\") & \"\n    </div>\n</div>\"\n\n/*\n\"<div style='font-family:Segoe UI, sans-serif; font-size:12px; width:100%; border:1px solid #ccc; padding:10px;'>\n    <!-- Cabeçalho -->\n    <table style='width:100%; border-collapse:collapse; margin-bottom:10px;'>\n        <tr>\n            <td style='width:50%; font-weight:bold;'> FOR-CO-OPER-002 </td>\n            <td style='width:50%; text-align:right;'>Revisão 01 | Data: \" & DateValue(CurrentItem.Modificado) & \"</td>\n        </tr>\n        <tr>\n            <td colspan='2' style='text-align:center; font-size:16px; font-weight:bold; padding:8px; background-color:#f2f2f2;'>\n                ATA DE REUNIÃO - COMISSÃO DE SEGURANÇA OPERACIONAL\n            </td>\n        </tr>\n    </table>\n    <!-- Informações da Reunião -->\n    <table style='width:100%; border-collapse:collapse; margin-bottom:10px;'>\n    <tr>\n            <td style='padding:6px; font-weight:bold; width: 150px'>Tipo:</td>\n            <td style='padding:6px;'>\" & CurrentItem.Tipo_da_Reunião.Value & \"</td>\n        </tr>\n        <tr>\n            <td style='padding:6px; font-weight:bold; width: 150px'>Data:</td>\n            <td style='padding:6px;'>\" & CurrentItem.'Data/Hora' & \"</td>\n        </tr>\n        <tr>\n            <td style='padding:6px; font-weight:bold; width: 150px'>Local:</td>\n            <td colspan='3' style='padding:6px;'>\" & CurrentItem.Local & \"</td>\n        </tr>\n        <tr>\n            <td style='padding:6px; font-weight:bold; width: 150px'>Modalidade:</td>\n            <td colspan='3' style='padding:6px;'\" & CurrentItem.Modalidade.Value & \"</td>\n        </tr>\n    </table>\n    <!-- Objetivo -->\n    <div style='font-we