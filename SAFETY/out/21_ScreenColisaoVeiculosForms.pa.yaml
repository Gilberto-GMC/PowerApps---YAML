                              ChevronHoverBackground: =ColorFade(nfCorPrimaria, -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DisplayFields: =["Value"]
                              Height: =30
                              HoverFill: =nfCorFundoFraco
                              InputTextPlaceholder: =
                              Items: |-
                                =// DisplayFields/SearchFields procuram a coluna "Value". ForAll com corpo
                                // escalar nao garante esse nome, e a lista abre com 104 linhas em branco.
                                // O registro explicito fixa o nome da coluna.
                                ForAll(
                                    Sequence(104, 1, 1),
                                    {Value: Switch(
                                        true,
                                        Value <= 26, Char(64 + Value),
                                        Value <= 52, "A" & Char(64 + (Value - 26)),
                                        Value <= 78, "B" & Char(64 + (Value - 52)),
                                        Value <= 104, "C" & Char(64 + (Value - 78))
                                    )}
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =nfCorPrimariaEsc
