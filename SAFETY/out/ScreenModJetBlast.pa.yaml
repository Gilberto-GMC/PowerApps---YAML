            - GalleryJetBlastRegistros:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbJetBlastAeroporto.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbJetBlastBloco.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpJetBlastDtfInicio.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpJetBlastDtfTermino.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '14.8-tbl_JetBlast',
                                        jetBlast_aeroporto = _aero,
                                        jetBlast_data >= _ini,
                                        jetBlast_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '14.8-tbl_JetBlast',
                                        jetBlast_bloco = _bloco,
                                        jetBlast_data >= _ini,
                                        jetBlast_data < _fim
                                    ),
                                    Filter(
                                        '14.8-tbl_JetBlast',
                                        jetBlast_data >= _ini,
                                        jetBlast_data < _fim
                                    )
                                ),
                                IsBlank(cmbStatus_8.Selected.Value) ||
                                Status = cmbStatus_8.Selected.Value,
                                IsBlank(txtJetBlastBuscar.Text) ||
                                ID = Value(txtJetBlastBuscar.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =80
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Container1_8:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =If(HtmlText2_9.Height < 40, 40 , HtmlText2_9.Height)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
