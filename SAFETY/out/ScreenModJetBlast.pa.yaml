                        Width: =150
                  - ButtonCanvas7_65:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |
                          =// ── TRAVA DE REENTRÂNCIA ──────────────────────────────────────
                          // Clique duplo / toque repetido no celular gravava a ocorrência
                          // duas vezes. A trava expira sozinha em 60s para nunca deixar o
                          // botão morto se algo falhar no meio.
                          If(
                              var_salvandoJetBlast And DateDiff(
                                  var_salvandoEmJetBlast,
                                  Now(),
                                  TimeUnit.Seconds
                              ) < 60,
                              Notify(
                                  "Gravação em andamento, aguarde.",
                                  NotificationType.Warning
                              ),
                              UpdateContext(
                                  {
                                      var_salvandoJetBlast: true,
                                      var_salvandoEmJetBlast: Now()
                                  }
                              );
                              UpdateContext(
                                  {
                                      var_visibleSpiner: true,
                                      var_formErro: false
                                  }
                              );
                              Switch(
                                  true,
                                  cmbJetBlastHoraCadastro.Selected.Value = "hor",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  cmbJetBlastMinuCadastro.Selected.Value = "min",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(dropJetBlastOpeAereo.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  dropJetBlastOpeAereo.Selected.Value = "Outro" And IsBlank(TxtJetBlastPrefixoNome.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastVoo.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastMatAero.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbJetBlastFaseOpAero.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastLocal.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastMapaGrade.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbJetBlastDano.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  cmbJetBlastDano.Selected.Value = "Sim" And IsBlank(TxtJetBlastDanoDesc.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastAcoesTomadas.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtJetBlastDescOcorrencia.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  CountRows(col_jetBlastItemAtingido) = 0,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  CountRows(col_jetBlastImg) = 0,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  UpdateContext(
                                      {var_formErro: false
                                          //;varBordaDefault: Color.Red
                              }
                                  )
                              );
                              If(
                                  var_formErro = true,
                                  Notify(
                                      "Atenção todas as informações devem ser preenchidas!",
                                      NotificationType.Error
                                  ),
                                  //Insert de dados no database------------------------------------------------------------------------------
                                  // ── GRAVAÇÃO ────────────────────────────────────────────────────
                                  // O ID deixou de ser calculado no cliente (max + 1): dois usuários
                                  // salvando ao mesmo tempo geravam o MESMO protocolo e os filhos
                                  // (imagens/envolvidos) iam parar na ocorrência errada.
                                  // Agora grava-se primeiro, lê-se o ID real devolvido pelo SharePoint
                                  // e só então ele é carimbado de volta em jetBlast_id.
                                  UpdateContext(
                                      {
                                          var_regNovoJetBlast: Patch(
                                              '14.8-tbl_JetBlast',
                                              Defaults('14.8-tbl_JetBlast'),
                                              {
                                                  jetBlast_data: dtpJetBlastDataCadastro.SelectedDate,
                                                  jetBlast_hora: cmbJetBlastHoraCadastro.Selected.Value & ":" & cmbJetBlastMinuCadastro.Selected.Value,
                                                  jetBlast_opeAereo: dropJetBlastOpeAereo.Selected.Value,
                                                  jetBlast_opePrefixo: TxtJetBlastPrefixoNome.Text,
                                                  jetBlast_voo: TxtJetBlastVoo.Text,
                                                  jetBlast_matAereo: TxtJetBlastMatAero.Text,
                                                  jetBlast_faseOperacao: cmbJetBlastFaseOpAero.Selected.Value,
                                                  'jetBlast_local (jetBlast_local0)': TxtJetBlastLocal.Text,
                                                  jetBlast_mapaGrade: TxtJetBlastMapaGrade.Text,
                                                  jetBlast_dano: cmbJetBlastDano.Selected.Value,
                                                  jetBlast_danoDesc: TxtJetBlastDanoDesc.Text,
                                                  jetBlast_acoesIniciais: TxtJetBlastAcoesTomadas.Text,
                                                  jetBlast_ocorrenciaDesc: TxtJetBlastDescOcorrencia.Text,
                                                  jetBlast_bloco: LookUp(
                                                      colAeros,
                                                      Aeroporto = cmbFrmJetBlastAeroporto.Selected.Aeroporto
                                                  ).Bloco,
                                                  jetBlast_aeroporto: cmbFrmJetBlastAeroporto.Selected.Aeroporto
                                              }
                                          )
                                      }
                                  );
                                  UpdateContext(
                                      {var_jetBlastId: Coalesce(
                                          var_regNovoJetBlast.ID,
                                          0
                                      )}
                                  );
                                  If(
                                      var_jetBlastId <= 0,
                                      // falhou: avisa, libera a tela e não cria nenhum filho órfão
                                      Notify(
                                          "Não foi possível gravar a ocorrência. Verifique a conexão e tente novamente.",
                                          NotificationType.Error,
                                          6000
                                      );
                                      UpdateContext(
                                          {
                                              var_visibleSpiner: false,
                                              var_salvandoJetBlast: false
                                          }
                                      ),
                                      Patch(
                                          '14.8-tbl_JetBlast',
                                          var_regNovoJetBlast,
                                          {jetBlast_id: var_jetBlastId}
                                      )
                                  );
                                  //insert dos envolvidos
                              If(
                                  var_jetBlastId > 0,
                                  ForAll(
                                          col_jetBlastItemAtingido,
                                          Patch(
                                              '14.8-tbl_JetBlastItemAtingido',
                                              Defaults('14.8-tbl_JetBlastItemAtingido'),
                                              {
                                                  jetBlastIA_idOcorrencia: var_jetBlastId,
                                                  jetBlastIA_item: item,
                                                  jetBlastIA_info: info
                                              }
                                          )
                                      )
                              );
                                  //insert das imagens
                              If(
                                  var_jetBlastId > 0,
                                  ForAll(
                                          col_jetBlastImg,
                                          Patch(
                                              '14.8-tbl_JetBlastImg',
                                              Defaults('14.8-tbl_JetBlastImg'),
                                              {
                                                  jetBlastImg_idOcorrencia: var_jetBlastId,
                                                  jetBlastImg_imagem: img
                                              }
                                          )
                                      )
                              );
                                  If(
                                      var_jetBlastId > 0,
                                      Select(ButtonResetFormJetBlast);
                                      Navigate(
                                          ScreenSucesso,
                                          ScreenTransition.Fade,
                                          {var_navigateSucess: ScreenModJetBlast}
                                      )
                                  )
                              );
                              UpdateContext({var_visibleSpiner: false});
                              UpdateContext(
                                  {
                                      var_salvandoJetBlast: false,
                                      var_visibleSpiner: false
                                  }
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Salvar"
                        Width: =150
