            - GalleryColVeiRegistros:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbHomeAeroporto_1.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbHomeBloco_1.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpHomeDtfInicio_1.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpHomeDtfTermino_1.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '14.4-tbl_ColVeiculos',
                                        colVei_aeroporto = _aero,
                                        colVei_data >= _ini,
                                        colVei_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '14.4-tbl_ColVeiculos',
                                        colVei_bloco = _bloco,
                                        colVei_data >= _ini,
                                        colVei_data < _fim
                                    ),
                                    Filter(
                                        '14.4-tbl_ColVeiculos',
                                        colVei_data >= _ini,
                                        colVei_data < _fim
                                    )
                                ),
                                IsBlank(cmbHomeStatus_1.Selected.Value) ||
                                Status = cmbHomeStatus_1.Selected.Value,
                                IsBlank(txtBuscar1_1.Text) ||
                                ID = Value(txtBuscar1_1.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =100
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Icon9_1:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(240, 240, 240, 1)
                        Height: =1
