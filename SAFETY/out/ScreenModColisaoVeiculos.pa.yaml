                  - ButtonCanvas7_4:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// ── TRAVA DE REENTRÂNCIA ──────────────────────────────────────
                          // Clique duplo / toque repetido no celular gravava a ocorrência
                          // duas vezes. A trava expira sozinha em 60s para nunca deixar o
                          // botão morto se algo falhar no meio.
                          If(
                              var_salvandoColVei And DateDiff(
                                  var_salvandoEmColVei,
                                  Now(),
                                  TimeUnit.Seconds
                              ) < 60,
                              Notify(
                                  "Gravação em andamento, aguarde.",
                                  NotificationType.Warning
                              ),
                              UpdateContext(
                                  {
                                      var_salvandoColVei: true,
                                      var_salvandoEmColVei: Now()
                                  }
                              );
                              UpdateContext(
                                  {
                                      var_visibleSpiner: true,
                                      var_formErro: false
                                  }
                              );
                              Switch(
                                  true,
                                  IsBlank(cmbColVeiHoraCadastro.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbColVeiMinuCadastro.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtColVeiLocal.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(ComboBoxMG1.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(ComboBoxMG2.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbColVeiTipColisao.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtColVeiDescOcorrencia.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtColVeiDanos.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  CountRows(col_colVeiGalleryImg) = 0,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  CountRows(col_colVeiEnvolvidos) = 0,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  UpdateContext({var_formErro: false})
                              );
                              If(
                                  var_formErro = true,
                                  Notify(
                                      "Atenção todas as informações devem ser preenchidas!",
                                      NotificationType.Error
                                  ),
                                  //Insert de dados no database------------------------------------------------------------------------------
                                  // ── GRAVAÇÃO ────────────────────────────────────────────────────
                                  // O ID deixou de ser calculado no cliente (max + 1): dois usuários
                                  // salvando ao mesmo tempo geravam o MESMO protocolo e os filhos
                                  // (imagens/envolvidos) iam parar na ocorrência errada.
                                  // Agora grava-se primeiro, lê-se o ID real devolvido pelo SharePoint
                                  // e só então ele é carimbado de volta em colVei_id.
                                  UpdateContext(
                                      {
                                          var_regNovoColVei: Patch(
                                              '14.4-tbl_ColVeiculos',
                                              Defaults('14.4-tbl_ColVeiculos'),
                                              {
                                                  colVei_data: dtpColVeiDataCadastro.SelectedDate,
                                                  colVei_hora: cmbColVeiHoraCadastro.Selected.Value & ":" & cmbColVeiMinuCadastro.Selected.Value,
                                                  colVei_local: TxtColVeiLocal.Text,
                                                  colVei_mapaGrade: ComboBoxMG1.Selected.Value&"-"&ComboBoxMG2.Selected.Value,
                                                  colVei_tipoColisao: cmbColVeiTipColisao.Selected.Value,
                                                  colVei_descOcorrencia: TxtColVeiDescOcorrencia.Text,
                                                  colVei_danos: TxtColVeiDanos.Text,
                                                  colVei_bloco: LookUp(
                                                      colAeros,
                                                      Aeroporto = cmbFrmColVeiAeroporto.Selected.Aeroporto
                                                  ).Bloco,
                                                  colVei_aeroporto: cmbFrmColVeiAeroporto.Selected.Aeroporto
                                              }
                                          )
                                      }
                                  );
                                  UpdateContext(
                                      {var_colVeiId: Coalesce(
                                          var_regNovoColVei.ID,
                                          0
                                      )}
                                  );
                                  If(
                                      var_colVeiId <= 0,
                                      // falhou: avisa, libera a tela e não cria nenhum filho órfão
                                      Notify(
                                          "Não foi possível gravar a ocorrência. Verifique a conexão e tente novamente.",
                                          NotificationType.Error,
                                          6000
                                      );
                                      UpdateContext(
                                          {
                                              var_visibleSpiner: false,
                                              var_salvandoColVei: false
                                          }
                                      ),
                                      Patch(
                                          '14.4-tbl_ColVeiculos',
                                          var_regNovoColVei,
                                          {colVei_id: var_colVeiId}
                                      )
                                  );
                                  //insert dos envolvidos
                              If(
                                  var_colVeiId > 0,
                                  ForAll(
                                          col_colVeiEnvolvidos,
                                          Patch(
                                              '14.4-tbl_ColVeiculosEnvolvidos',
                                              Defaults('14.4-tbl_ColVeiculosEnvolvidos'),
                                              {
                                                  colVeiEnv_idOcorrencia: var_colVeiId,
                                                  colVeiEnv_nome: nome,
                                                  colVeiEnv_colete: colete,
                                                  colVeiEnv_empresa: empresa,
                                                  colVeiEnv_codVeiculo: codVeiculo,
                                                  colVeiEnv_empresaProp: empresaProp,
                                                  colVeiEnv_cnhComp: cnhCompativel,
                                                  colVeiEnv_boaCondicoes: boaCondicao
                                              }
                                          )
                                      )
                              );
                                  //insert das imagens
                              If(
                                  var_colVeiId > 0,
                                  ForAll(
                                          col_colVeiGalleryImg,
                                          Patch(
                                              '14.4-tbl_ColVeiculosImg',
                                              Defaults('14.4-tbl_ColVeiculosImg'),
                                              {
                                                  colVeiImg_idOcorrencia: var_colVeiId,
                                                  colVeiImg_imagem: img
                                              }
                                          )
                                      )
                              );

                              If(
                                      varPerfilUser = "Sede",
                                      ClearCollect(
                                          col_colVeiRegistros,
                                          Sort(
                                              '14.4-tbl_ColVeiculos',
                                              colVei_id,
                                              SortOrder.Descending
                                          )
                                      ),
                                      ClearCollect(
                                          col_colVeiRegistros,
                                          Sort(
                                              Filter(
                                                  '14.4-tbl_ColVeiculos',
                                                  colVei_aeroporto = varAeroUser
                                              ),
                                              colVei_id,
                                              SortOrder.Descending
                                          )
                                      )
                                  );
                                  If(
                                      var_colVeiId > 0,
                                      Select(ButtonResetFormColVei);
                                      Navigate(
                                          ScreenSucesso,
                                          ScreenTransition.Fade,
                                          {var_navigateSucess: ScreenModColisaoVeiculos}
                                      )
                                  )
                              );
                              UpdateContext({var_visibleSpiner: false});
                              UpdateContext(
                                  {
                                      var_salvandoColVei: false,
                                      var_visibleSpiner: false
                                  }
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Salvar"
                        Width: =150
