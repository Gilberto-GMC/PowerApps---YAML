            - GalleryIncPistaRegistros:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =// ═══════════════════════════════════════════════════════════════════
                    // ESCOPO DE SEGURANÇA (não é filtro de usuário — é regra de acesso).
                    //   varEscopoAero  <> branco  -> perfil Base, travado no próprio aeroporto
                    //   varEscopoBloco <> branco  -> perfil Bloco, travado no próprio bloco
                    // Antes esta galeria consultava a lista inteira quando o filtro de aeroporto
                    // ficava em branco, e o perfil Base enxergava todos os aeroportos.
                    //
                    // DELEGAÇÃO: o recorte por aeroporto/bloco + intervalo de datas é feito no
                    // SharePoint (delegável). Só status, tipo e busca por ID — que já operam sobre
                    // o conjunto recortado — rodam localmente.
                    // ═══════════════════════════════════════════════════════════════════
                    With(
                        {
                            _aero: If(
                                !IsBlank(varEscopoAero),
                                varEscopoAero,
                                cmbIncPistaAeroporto.Selected.Aeroporto
                            ),
                            _bloco: If(
                                !IsBlank(varEscopoBloco),
                                varEscopoBloco,
                                cmbIncPistaBloco.Selected.Value
                            ),
                            _ini: Coalesce(
                                dtpIncPistaDtfInicio.SelectedDate,
                                nfDataPiso
                            ),
                            _fim: DateAdd(
                                Coalesce(
                                    dtpIncPistaDtfTermino.SelectedDate,
                                    Today()
                                ),
                                1,
                                TimeUnit.Days
                            )
                        },
                        SortByColumns(
                            Filter(
                                Switch(
                                    true,
                                    !IsBlank(_aero),
                                    Filter(
                                        '14.3-tbl_IncPista',
                                        incPista_aeroporto = _aero,
                                        incPista_data >= _ini,
                                        incPista_data < _fim
                                    ),
                                    !IsBlank(_bloco),
                                    Filter(
                                        '14.3-tbl_IncPista',
                                        incPista_bloco = _bloco,
                                        incPista_data >= _ini,
                                        incPista_data < _fim
                                    ),
                                    Filter(
                                        '14.3-tbl_IncPista',
                                        incPista_data >= _ini,
                                        incPista_data < _fim
                                    )
                                ),
                                IsBlank(cmbStatus_5.Selected.Value) ||
                                Status = cmbStatus_5.Selected.Value,
                                IsBlank(txtIncPistaBuscar.Text) ||
                                ID = Value(txtIncPistaBuscar.Text)
                            ),
                            "ID",
                            SortOrder.Descending
                        )
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =80
                  Transition: =Transition.Push
                  Width: =1728.84
                Children:
                  - Container1_5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =If(HtmlText2_6.Height < 40, 40 , HtmlText2_6.Height)
