                        OnSelect: |-
                          =If(
                              !var_visiblePainelTipo,
                              Select(ButtonResetFormIntExt);
                              UpdateContext({var_visiblePainelTipo: true}),
                              Set(
                                  var_vista,
                                  "lista"
                              )
                          )
                        PaddingBottom: =0
