                        Width: =150
                  - ButtonCanvas7_57:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// ── TRAVA DE REENTRÂNCIA ──────────────────────────────────────
                          // Clique duplo / toque repetido no celular gravava a ocorrência
                          // duas vezes. A trava expira sozinha em 60s para nunca deixar o
                          // botão morto se algo falhar no meio.
                          If(
                              var_salvandoIntExt And DateDiff(
                                  var_salvandoEmIntExt,
                                  Now(),
                                  TimeUnit.Seconds
                              ) < 60,
                              Notify(
                                  "Gravação em andamento, aguarde.",
                                  NotificationType.Warning
                              ),
                              UpdateContext(
                                  {
                                      var_salvandoIntExt: true,
                                      var_salvandoEmIntExt: Now()
                                  }
                              );
                              UpdateContext(
                                  {
                                      var_visibleSpiner: true,
                                      var_formErro: false
                                  }
                              );
                              Switch(
                                  true,
                                  cmbIntExtHoraCadastro.Selected.Value = "hor",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  cmbIntExtMinuCadastro.Selected.Value = "min",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtIntExtLocal.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtIntExtMapaGrade.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(cmbIntExtFechaAer.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  cmbIntExtFechaAer.Selected.Value = "Sim" And cmbIntExtHoraFechAer.Selected.Value = "hor",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  cmbIntExtFechaAer.Selected.Value = "Sim" And cmbIntExtMinuFechAer.Selected.Value = "min",
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  IsBlank(TxtIntExtDescOcorrencia.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                              //Validação Pipa///////////////////////////////////////////////////////////////////////////////////////////
                                  var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtImpVoo.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And cmbIntExtImpVoo.Selected.Value = "Sim" And IsBlank(TxtIntExtImpVooDesc.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtDanoAeronave.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And cmbIntExtDanoAeronave.Selected.Value = "Sim" And IsBlank(TxtIntExtDanoAeronaveDesc.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtAcionaSegur.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtEncInspecao.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And cmbIntExtEncInspecao.Selected.Value = "Não" And IsBlank(cmbIntExtReportado.Selected.Value) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  var_tipoIntExt = "Pipa" And cmbIntExtEncInspecao.Selected.Value = "Não" And cmbIntExtReportado.Selected.Value = "Outros" And IsBlank(TxtIntExtReportadoOutros.Text) = true,
                                  UpdateContext(
                                      {
                                          var_formErro: true,
                                          varBordaDefault: Color.Red
                                      }
                                  ),
                                  UpdateContext({var_formErro: false})
                              );
                              If(
                                  var_formErro = true,
                                  Notify(
                                      "Atenção todas as informações devem ser preenchidas!",
                                      NotificationType.Error
                                  ),
                                  //Insert de dados no database------------------------------------------------------------------------------
                                  // ── GRAVAÇÃO ────────────────────────────────────────────────────
                                  // O ID deixou de ser calculado no cliente (max + 1): dois usuários
                                  // salvando ao mesmo tempo geravam o MESMO protocolo e os filhos
                                  // (imagens/envolvidos) iam parar na ocorrência errada.
                                  // Agora grava-se primeiro, lê-se o ID real devolvido pelo SharePoint
                                  // e só então ele é carimbado de volta em intExt_id.
                                  UpdateContext(
                                      {
                                          var_regNovoIntExt: Patch(
                                              '14.5-tbl_IntExterna',
                                              Defaults('14.5-tbl_IntExterna'),
                                              {
                                                  //Dados gerais
                                                  intExt_tipo: var_tipoIntExt,
                                                  intExt_descOcorrencia: TxtIntExtDescOcorrencia.Text,
                                                  intExt_data: dtpIntExtDataCadastro.SelectedDate,
                                                  intExt_hora: cmbIntExtHoraCadastro.Selected.Value & ":" & cmbIntExtMinuCadastro.Selected.Value,
                                                  intExt_local: TxtIntExtLocal.Text,
                                                  intExt_mapaGrade: TxtIntExtMapaGrade.Text,
                                                  intExt_fechaAero: cmbIntExtFechaAer.Selected.Value,
                                                  intExt_tempo: If(
                                                      cmbIntExtFechaAer.Selected.Value = "Sim",
                                                      cmbIntExtHoraFechAer.Selected.Value & " hora(s) e " & cmbIntExtMinuFechAer.Selected.Value & " minuto(s)"
                                                  ),
                                                  intExt_impVoo: cmbIntExtImpVoo.Selected.Value,
                                                  intExt_impVooDesc: TxtIntExtImpVooDesc.Text,
                                                  intExt_danoAero: cmbIntExtDanoAeronave.Selected.Value,
                                                  intExt_danoAeroDesc: TxtIntExtDanoAeronaveDesc.Text,
                                                  intExt_encInspecao: cmbIntExtEncInspecao.Selected.Value,
                                                  intExt_acionSeguranca: cmbIntExtAcionaSegur.Selected.Value,
                                                  intExt_reportadoPor: cmbIntExtReportado.Selected.Value,
                                                  intExt_reportadoPorDesc: TxtIntExtReportadoOutros.Text,
                                                  intExt_recAparelho: cmbIntExtRecAparelho.Selected.Value,
                                                  intExt_bloco: LookUp(
                                                      colAeros,
                                                      Aeroporto = cmbFrmIntExtAeroporto.Selected.Aeroporto
                                                  ).Bloco,
                                                  intExt_aeroporto: cmbFrmIntExtAeroporto.Selected.Aeroporto,
                                                  //Dados Balão
                                                  intExt_balaoFaseMCA: dropIntExtBalaoOpMCA36.Selected.Value,
                                                  intExt_balaoCondCeu: dropIntExtBalaoCondCeu.Selected.Value,
                                                  intExt_balaoEfeitoVoo: dropIntExtBalaoEfeitoVoo.Selected.Value,
                                                  intExt_balaoExplo: cmbIntExtBalaoExplo.SelectedText.Value,
                                                  intExt_balaoPropaganda: cmbIntExtBalaoPropaganda.Selected.Value,
                                                  intExt_balaoCang: cmbIntExtBalaoCangalha.Selected.Value,
                                                  intExt_balaoCorTam: TxtIntExtImpBalaoCorTam.Text,
                                                  intExt_balaoQuantidade: cmbIntExtBalaoQuantidade.Selected.Value,
                                                  intExt_balaoColisao: cmbIntExtBalaoColisao.Selected.Value,
                                                  intExt_balaoColisaoParte: cmbIntExtBalaoColisaoPartesAtingidas.Selected.Value,
                                                  intExt_balaoNotificouATC: cmbIntExtBalaoNotifiATC.Selected.Value,
                                                  intExt_balaoReportadaATC: cmbIntExtBalaoReportadaATC.Selected.Value,
                                                  //Dados Laser
                                                  intExt_laserFaseMCA: dropIntExtLaserOpMCA36.Selected.Value,
                                                  intExt_laserPosAero: TxtIntExtLaserPosAeronave.Text,
                                                  intExt_laserDistEstimada: TxtIntExtLaserDistEstimada.Text,
                                                  intExt_laserCor: cmbIntExtLaserCor.Selected.Value,
                                                  intExt_laserEmissorMov: cmbIntExtLaserFontEmissoMov.Selected.Value,
                                                  intExt_laserDiretoFonte: cmbIntExtLaserDiretoFonte.Selected.Value,
                                                  intExt_laserQtdEmissor: cmbIntExtLaserQtdFontEmissor.Selected.Value,
                                                  intExt_laserTempoExpo: TxtIntExLaserTempExpo.Text,
                                                  intExt_laserIntencional: cmbIntExtLaserIntencional.Selected.Value,
                                                  intExt_laserAltTrajetoVoo: cmbIntExtLaserTrajManEvasiva.Selected.Value,
                                                  intExt_laserAcuidadePiloto: dropIntExtLaserAcuidadePiloto.Selected.Value,
                                                  intExt_laserReportadaATC: cmbIntExtLaserReportadaATC.Selected.Value
                                              }
                                          )
                                      }
                                  );
                                  UpdateContext(
                                      {var_intExtId: Coalesce(
                                          var_regNovoIntExt.ID,
                                          0
                                      )}
                                  );
                                  If(
                                      var_intExtId <= 0,
                                      // falhou: avisa, libera a tela e não cria nenhum filho órfão
                                      Notify(
                                          "Não foi possível gravar a ocorrência. Verifique a conexão e tente novamente.",
                                          NotificationType.Error,
                                          6000
                                      );
                                      UpdateContext(
                                          {
                                              var_visibleSpiner: false,
                                              var_salvandoIntExt: false
                                          }
                                      ),
                                      Patch(
                                          '14.5-tbl_IntExterna',
                                          var_regNovoIntExt,
                                          {intExt_id: var_intExtId}
                                      )
                                  );
                                  //insert das imagens
                              If(
                                  var_intExtId > 0,
                                  ForAll(
                                          col_intExtGalleryImg,
                                          Patch(
                                              '14.5-tbl_IntExternaImg',
                                              Defaults('14.5-tbl_IntExternaImg'),
                                              {
                                                  intExtImg_idOcorrencia: var_intExtId,
                                                  intExtImg_imagem: img
                                              }
                                          )
                                      )
                              );
                                  If(
                                      var_intExtId > 0,
                                      Select(ButtonResetFormIntExt);
                                      Navigate(
                                          ScreenSucesso,
                                          ScreenTransition.Fade,
                                          {var_navigateSucess: ScreenModInterferenciaExterna}
                                      )
                                  )
                              );
                              UpdateContext({var_visibleSpiner: false});
                              UpdateContext(
                                  {
                                      var_salvandoIntExt: false,
                                      var_visibleSpiner: false
                                  }
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Salvar"
