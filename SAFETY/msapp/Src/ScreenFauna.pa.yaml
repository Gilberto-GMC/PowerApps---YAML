'Formulário de Focos (Atrativos e Vulnerabilidade)';\n            If(\n                IsBlank(varIATA);\n                true;\n                Aeroporto=varIATA               \n            )\n        );\n        ID;\n        SortOrder.Descending\n    )\n)\n);\n\n\n\n   /* ClearCollect(\n        col_foco;\n        Filter(\n            Sort(\n                'Formulário de Focos (Atrativos e Vulnerabilidade)';\n                'Data e Hora da ocorrência';\n                SortOrder.Descending\n            );\n            // Filtro por aeroporto (IATA)\n            IsBlank(cmbOcoFaunaAeroporto.Selected.Result) || (\n                Aeroporto = \n                Text(\n                    LookUp(\n                        colAeros;\n                        Aeroporto = Text(cmbOcoFaunaAeroporto.Selected.Result)\n                    ).IATA\n                )\n            )\n        )\n    );   \n\n    //acesso indevido de fauna\n    If(\n        varPerfilUser <> \"Base\";\n        ClearCollect(\n            col_aceIndFaunaRegistros;\n            Sort(\n                '14.7-tbl_AcessIndFauna';\n                aceIndFauna_id;\n                SortOrder.Descending\n            )\n        );\n        ClearCollect(\n            col_aceIndFaunaRegistros;\n            Sort(\n                Filter(\n                    '14.7-tbl_AcessIndFauna';\n                    aceIndFauna_aeroporto = varAeroUser\n                );\n                aceIndFauna_id;\n                SortOrder.Descending\n            )\n        )\n    )\n);;\nRefresh('AIRPORTNOW - FAUNA RELACIONAMENTO')*/"
