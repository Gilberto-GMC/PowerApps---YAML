                                      intExt_local: TxtIntExtLocal.Text,
                                      intExt_mapaGrade: TxtIntExtMapaGrade.Text,
                                      intExt_fechaAero: cmbIntExtFechaAer.Selected.Value,
                                      intExt_tempo: If(
                                          cmbIntExtFechaAer.Selected.Value = "Sim",
                                          cmbIntExtHoraFechAer.Selected.Value & " hora(s) e " & cmbIntExtMinuFechAer.Selected.Value & " minuto(s)"
                                      ),
                                      intExt_impVoo: cmbIntExtImpVoo.Selected.Value,
                                      intExt_impVooDesc: TxtIntExtImpVooDesc.Text,
                                      intExt_danoAero: cmbIntExtDanoAeronave.Selected.Value,
                                      intExt_danoAeroDesc: TxtIntExtDanoAeronaveDesc.Text,
                                      intExt_encInspecao: cmbIntExtEncInspecao.Selected.Value,
                                      intExt_acionSeguranca: cmbIntExtAcionaSegur.Selected.Value,
                                      intExt_reportadoPor: cmbIntExtReportado.Selected.Value,
                                      intExt_reportadoPorDesc: TxtIntExtReportadoOutros.Text,
                                      intExt_recAparelho: cmbIntExtRecAparelho.Selected.Value,
                                      intExt_bloco: varBlocoUser,
                                      intExt_aeroporto: varAeroUser,
                                      //Dados Balão
                                      intExt_balaoFaseMCA: dropIntExtBalaoOpMCA36.Selected.Value,
                                      intExt_balaoCondCeu: dropIntExtBalaoCondCeu.Selected.Value,
                                      intExt_balaoEfeitoVoo: dropIntExtBalaoEfeitoVoo.Selected.Value,
                                      intExt_balaoExplo: cmbIntExtBalaoExplo.SelectedText.Value,
                                      intExt_balaoPropaganda: cmbIntExtBalaoPropaganda.Selected.Value,
                                      intExt_balaoCang: cmbIntExtBalaoCangalha.Selected.Value,
                                      intExt_balaoCorTam: TxtIntExtImpBalaoCorTam.Text,
                                      intExt_balaoQuantidade: cmbIntExtBalaoQuantidade.Selected.Value,
                                      intExt_balaoColisao: cmbIntExtBalaoColisao.Selected.Value,
                                      intExt_balaoColisaoParte: cmbIntExtBalaoColisaoPartesAtingidas.Selected.Value,
                                      intExt_balaoNotificouATC: cmbIntExtBalaoNotifiATC.Selected.Value,
                                      intExt_balaoReportadaATC: cmbIntExtBalaoReportadaATC.Selected.Value,
                                      //Dados Laser
                                      intExt_laserFaseMCA: dropIntExtLaserOpMCA36.Selected.Value,
                                      intExt_laserPosAero: TxtIntExtLaserPosAeronave.Text,
                                      intExt_laserDistEstimada: TxtIntExtLaserDistEstimada.Text,
                                      intExt_laserCor: cmbIntExtLaserCor.Selected.Value,
                                      intExt_laserEmissorMov: cmbIntExtLaserFontEmissoMov.Selected.Value,
                                      intExt_laserDiretoFonte: cmbIntExtLaserDiretoFonte.Selected.Value,
                                      intExt_laserQtdEmissor: cmbIntExtLaserQtdFontEmissor.Selected.Value,
                                      intExt_laserTempoExpo: TxtIntExLaserTempExpo.Text,
                                      intExt_laserIntencional: cmbIntExtLaserIntencional.Selected.Value,
                                      intExt_laserAltTrajetoVoo: cmbIntExtLaserTrajManEvasiva.Selected.Value,
                                      intExt_laserAcuidadePiloto: dropIntExtLaserAcuidadePiloto.Selected.Value,
                                      intExt_laserReportadaATC: cmbIntExtLaserReportadaATC.Selected.Value
                                  }
                              );
                              //insert das imagens
                          ForAll(
                                  col_intExtGalleryImg,
                                  Patch(
                                      '14.5-tbl_IntExternaImg',
                                      Defaults('14.5-tbl_IntExternaImg'),
                                      {
                                          intExtImg_idOcorrencia: var_intExtId,
                                          intExtImg_imagem: img
                                      }
                                  )
                              );
                              Select(ButtonResetFormIntExt);
                              Navigate(
                                  ScreenSucesso,
                                  ScreenTransition.Fade,
                                  {var_navigateSucess: ScreenInterferenciaExterna}
                              )
                          );
                          UpdateContext({var_visibleSpiner: false})
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
