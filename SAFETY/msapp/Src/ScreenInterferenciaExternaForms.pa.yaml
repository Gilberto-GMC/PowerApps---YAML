                  - ButtonCanvas7_57:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BorderRadius: =4
                        BorderStyle: =BorderStyle.None
                        FontSize: =20
                        FontWeight: =FontWeight.Normal
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconBefore
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =UpdateContext(
                              {
                                  var_visibleSpiner: true,
                                  var_formErro: false,
                                  var_intExtId: Value(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  '14.5-tbl_IntExterna',
                                                  intExt_id > 0
                                              ),
                                              "ID",
                                              SortOrder.Descending
                                          )
                                      ).intExt_id + 1
                                  )
                              }
                          );
                          Switch(
                              true,
                              cmbIntExtHoraCadastro.Selected.Value = "hor",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbIntExtMinuCadastro.Selected.Value = "min",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtIntExtLocal.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtIntExtMapaGrade.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(cmbIntExtFechaAer.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbIntExtFechaAer.Selected.Value = "Sim" And cmbIntExtHoraFechAer.Selected.Value = "hor",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbIntExtFechaAer.Selected.Value = "Sim" And cmbIntExtMinuFechAer.Selected.Value = "min",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtIntExtDescOcorrencia.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                          //Validação Pipa///////////////////////////////////////////////////////////////////////////////////////////
                              var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtImpVoo.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And cmbIntExtImpVoo.Selected.Value = "Sim" And IsBlank(TxtIntExtImpVooDesc.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtDanoAeronave.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And cmbIntExtDanoAeronave.Selected.Value = "Sim" And IsBlank(TxtIntExtDanoAeronaveDesc.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtAcionaSegur.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And IsBlank(cmbIntExtEncInspecao.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And cmbIntExtEncInspecao.Selected.Value = "Não" And IsBlank(cmbIntExtReportado.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              var_tipoIntExt = "Pipa" And cmbIntExtEncInspecao.Selected.Value = "Não" And cmbIntExtReportado.Selected.Value = "Outros" And IsBlank(TxtIntExtReportadoOutros.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              UpdateContext({var_formErro: false})
                          );
                          If(
                              var_formErro = true,
                              Notify(
                                  "Atenção todas as informações devem ser preenchidas!",
                                  NotificationType.Error
                              ),
                              //Insert de dados no database------------------------------------------------------------------------------
                              Patch(
                                  '14.5-tbl_IntExterna',
                                  Defaults('14.5-tbl_IntExterna'),
                                  {
                                      //Dados gerais
                                      intExt_id: var_intExtId,
