            - GalleryDerFlu:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =SortByColumns(
                        Filter(
                            '14.2-tbl_DerramamentoDeFluidos',

                            // ✅ Aeroporto — opcional
                            IsBlank(cmbDerFluAeroporto.Selected.Aeroporto) ||
                            derFlu_aeroporto = cmbDerFluAeroporto.Selected.Aeroporto,

                            // ✅ Status — opcional
                            IsBlank(cmbStatus_2.Selected.Value) ||
                            Status = cmbStatus_2.Selected.Value,

                            // ✅ Data Início — opcional
                            IsBlank(dtpDerFluDtfInicio.SelectedDate) ||
                            derFlu_data >= DateTimeValue(dtpDerFluDtfInicio.SelectedDate),

                            // ✅ Data Término — opcional
                            IsBlank(dtpDerFluDtfTermino.SelectedDate) ||
                            derFlu_data < DateAdd(
                                DateTimeValue(dtpDerFluDtfTermino.SelectedDate),
                                1,
                                TimeUnit.Days
                            ),

