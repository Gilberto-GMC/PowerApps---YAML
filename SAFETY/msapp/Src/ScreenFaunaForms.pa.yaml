                  - FormInspPistaItensDetalhesCOLISAO:
                      Control: Form@2.4.4
                      Layout: Vertical
                      Properties:
                        DataSource: ='AIRPORTNOW - Colisões/Quase-Colisão/Avistamento'
                        Item: |-
                          =First(
                              Filter(
                                  Sort(
                                      'AIRPORTNOW - Colisões/Quase-Colisão/Avistamento',
                                      ID,
                                      SortOrder.Descending
                                  ),
                                  ID = varItemId
                              )
                          )
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NumberOfColumns: =1
                        OnSuccess: "=\n    If(\n        var_acaoFauna = \"Cadastrar\",\n        ForAll(\n            col_ListaAnimais As ANIMAL,\n            Patch(\n                'AIRPORTNOW - FAUNA RELACIONAMENTO',\n                Defaults('AIRPORTNOW - FAUNA RELACIONAMENTO'),\n                {\n                    ID_tblPrincipal: FormInspPistaItensDetalhesCOLISAO.LastSubmit.ID,\n                    Espécie: ANIMAL.Espécie,\n                    'Tipo de Registro': ANIMAL.'Tipo de Registro',\n                    'Tipo de Animal': ANIMAL.'Tipo de Animal',\n                    Tamanho: ANIMAL.Tamanho,\n                    'Mapa de Grade': ANIMAL.'Mapa de Grade',\n                    'Amostra coletada de DNA?': ANIMAL.'Amostra coletada de DNA?',\n                    'Amostras enviadas para DNA?': ANIMAL.'Amostras enviadas para DNA?',\n                    'Quantidade (Quantidade0)': ANIMAL.'Quantidade (Quantidade0)'\n                }\n            )\n        )\n    );\n    NotifyFauna.Run(\n        Value(FormInspPistaItensDetalhesCOLISAO.LastSubmit.ID),\n        Text(FormInspPistaItensDetalhesCOLISAO.LastSubmit.Aeroporto),\n        Text(VAR_DESTINATARIOS),\n        Text(FormInspPistaItensDetalhesCOLISAO.LastSubmit.'Tipo de Registro')\n    );\n    ResetForm(FormInspPistaItensDetalhesCOLISAO);\n    UpdateContext(\n        {\n            var_visibleCadFauna: false,\n            var_visibleHome: true,\n            var_visibleFormFauna: false\n        }\n    );\n    Notify(\n        \"Operação realizada com sucesso!\",\n        NotificationType.Success\n    \n);\nNavigate(\n    ScreenFauna,\n    ScreenTransition.Fade\n)"
                        Visible: |-
                          =Switch(
                              varItem,
                              "Colisão com dano",
                              true,
                              "Colisão sem dano",
                              true,
                              "Quase colisão",
                              true,
                              "Avistamento",
                              true,
                              "Colisões/Quase-Colisão/Avistamento",
                              true,
                              false
                          )
