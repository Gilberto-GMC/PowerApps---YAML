Screens:
  frmHome:
    Properties:
      Fill: =RGBA(0, 0, 0, 0)
      OnVisible: |-
        =If(
            !IsBlank(var_redirectAN),
            Select(ButtonCanvasredirect)
        )
    Children:
      - ScreenContainerMain_3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Max(App.Height, App.MinScreenHeight)
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - ContainerHeader_8:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(30, 30, 100, 1)
                  Fill: =RGBA(0, 0, 0, 1)
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =0
                Children:
                  - Icon8:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =30
                        Icon: =Icon.Leave
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        OnSelect: |-
                          =Launch(
                              "/providers/Microsoft.PowerApps/apps/"&varHub,
                              {
                                  LOGADO: "z0x9c8v7b6n5" & Text(
                                      Now(),
                                      "ddmmyyyy"
                                  ) & Rand() * 100,
                                  USUARIO: varIdUser
                              },
                              LaunchTarget.Replace
                          )
                        PaddingBottom: =3
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =3
                        Tooltip: ="Voltar ao menu principal"
                        Width: =75.94
                  - Label1_26:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: |-
                          ="Safety & Fauna"
                          /*If(
                              varPerfilUser = "Base";
                              "AIRPORT NOW - " & varIATAUser &" - "& varAeroUser;
                              varPerfilUser = "Bloco";
                              "AIRPORT NOW - BLOCO " & Upper(varBlocoUser);
                              varPerfilUser = "Sede";
                              "AIRPORT NOW - SEDE";
                              "AIRPORT NOW"
                          )*/
                        Width: =0
                  - Image3_19:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =40
                        Image: =MOTIVA_WHITE
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        OnSelect: =Navigate(frmHome, ScreenTransition.Fade)
                        Visible: =true //If(ScreenContainer2_1.Width < 700; false;true)
                        Width: =75.94
            - Gallery1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(255, 255, 255, 0)
                  Items: |-
                    =Sort(
                        col_menuModulos,
                        Titulo,
                        SortOrder.Ascending
                    )
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =150
                  Transition: =Transition.Push
                  Width: =Parent.Width - 20
                  WrapCount: |
                    =Switch(
                        true,
                        frmHome.Width <= 450, 2,
                        frmHome.Width > 450 && frmHome.Width <= 700, 3,
                        frmHome.Width > 700 && frmHome.Width <= 1000, 5,
                        frmHome.Width > 1000 && frmHome.Width <= 1200, 6,
                        frmHome.Width > 1200 && frmHome.Width <= 1400, 7,
                        frmHome.Width > 1400 && frmHome.Width <= 1600, 8,
                        frmHome.Width > 1600 && frmHome.Width <= 1800, 9,
                        frmHome.Width > 1800 && frmHome.Width <= 2000, 10,
                        11 // Valor padrão para tamanhos maiores que 2000
                    )
                Children:
                  - Container84_13:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =120
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =140
                        X: =23
                        Y: =12
                      Children:
                        - Label2_50:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              FontWeight: =FontWeight.Bold
                              Height: =55
                              OnSelect: =
                              Size: =11
                              Text: =ThisItem.Titulo
                              Width: =140
                              Y: =65
                        - Image1_19:
                            Control: Image@2.2.3
                            Group: Group1_4
                            Properties:
                              Height: =60
                              Image: =ThisItem.Logo.Large
                              OnSelect: =
                              RadiusBottomLeft: =100
                              RadiusBottomRight: =100
                              RadiusTopLeft: =100
                              RadiusTopRight: =100
                              Width: =60
                              X: =15
                              Y: =10
                        - Circle1_5:
                            Control: Circle@2.3.0
                            Group: Group1_4
                            Properties:
                              Fill: =RGBA(0, 0, 0, 0.1)
                              Height: =60
                              Width: =60
                              X: =15
                              Y: =10
                        - Button3_138:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(ThisItem.Status.Value = "Em desenvolvimento", Color.Red,  RGBA(0, 0, 0, 0))
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =0
                              Color: =Color.Transparent
                              DisabledColor: =Color.Transparent
                              DisabledFill: =Color.Transparent
                              DisplayMode: |-
                                =If(
                                    ThisItem.Status.Value = "Desativado",
                                    DisplayMode.View,
                                    DisplayMode.Edit
                                )
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              HoverColor: =Color.Transparent
                              HoverFill: =RGBA(255, 255, 255, 0.7)
                              OnSelect: |-
                                =If(
                                    ThisItem.Status.Value <> "Em desenvolvimento",
                                    Set(
                                        var_tituloModulo,
                                        ThisItem.Titulo
                                    );
                                    Navigate(
                                        LookUp(
                                            col_NavTelas,
                                            Id = ThisItem.ID,
                                            TelaListar
                                        ),
                                        ScreenTransition.Fade
                                    )
                                )
                              PaddingRight: =6.33
                              PaddingTop: =6.33
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0,18,107,0.1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =12.66
                              Text: =""
                              VerticalAlign: =VerticalAlign.Bottom
                              Width: =140
                  - InfoButtonCanvas5_4:
                      Control: InfoButton@0.0.33
                      Properties:
                        Content: =ThisItem.Descricao
                        FontSize: =16
                        Height: =25
                        Width: =31.64
                        X: =123
                        Y: =19
                  - Icon2:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =RGBA(39, 113, 194, 1)
                        DisplayMode: =DisplayMode.View
                        Height: =25
                        Icon: |-
                          =Switch(
                              ThisItem.Status.Value,
                              "Ativo",
                              Icon.Check,
                              "Desativado",
                              Icon.Cancel,
                              "Em desenvolvimento",
                              Icon.ToolsWrench,
                              "Em teste",
                              Icon.Clock
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =6.33
                        PaddingTop: =6.33
                        Tooltip: =ThisItem.Status.Value
                        Width: =31.64
                        X: =123
                        Y: =40
      - ButtonCanvasredirect:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =78
            OnSelect: |-
              =Set(
                  var_tituloModulo,
                  var_redirectAN
              );
              Navigate(
                  LookUp(
                      col_NavTelas,
                      Id = Value(Param("ID_MODULO")),
                      TelaListar
                  ),
                  ScreenTransition.Fade
              )
            Text: ="Redirect"
            Visible: =false
            Width: =247
            X: =957
            Y: =366
