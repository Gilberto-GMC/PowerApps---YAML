                            Status = cmbStatus_5.Selected.Value,

                            // ✅ Data Início — opcional
                            IsBlank(dtpIncPistaDtfInicio.SelectedDate) ||
                            incPista_data >= DateTimeValue(dtpIncPistaDtfInicio.SelectedDate),

                            // ✅ Data Término — opcional
                            IsBlank(dtpIncPistaDtfTermino.SelectedDate) ||
                            incPista_data < DateAdd(
                                DateTimeValue(dtpIncPistaDtfTermino.SelectedDate),
                                1,
                                TimeUnit.Days
