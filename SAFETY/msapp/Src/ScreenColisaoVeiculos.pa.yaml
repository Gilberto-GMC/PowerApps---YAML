                Variant: VariableHeight
                Properties:
                  BorderStyle: =BorderStyle.None
                  Items: |-
                    =SortByColumns(
                        Filter(
                            '14.4-tbl_ColVeiculos',

                            // ✅ Bloco — opcional
                            IsBlank(cmbHomeBloco_1.Selected.Value) ||
                            colVei_bloco = cmbHomeBloco_1.Selected.Value,

