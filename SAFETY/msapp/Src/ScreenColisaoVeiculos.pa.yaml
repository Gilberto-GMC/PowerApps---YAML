                            colVei_aeroporto = cmbHomeAeroporto_1.Selected.Aeroporto,

                            // ✅ Data Início — opcional
                            IsBlank(dtpHomeDtfInicio_1.SelectedDate) ||
                            colVei_data >= DateTimeValue(dtpHomeDtfInicio_1.SelectedDate),

                            // ✅ Data Término — opcional
                            IsBlank(dtpHomeDtfTermino_1.SelectedDate) ||
                            colVei_data < DateAdd(
                                DateTimeValue(dtpHomeDtfTermino_1.SelectedDate),
                                1,
                                TimeUnit.Days
