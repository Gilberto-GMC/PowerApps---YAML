                        OnSelect: |-
                          =UpdateContext(
                              {
                                  var_visibleSpiner: true,
                                  var_formErro: false,
                                  var_excPistaId: Value(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  '14.6-tbl_ExcPista',
                                                  excPista_id > 0
                                              ),
                                              "ID",
                                              SortOrder.Descending
                                          )
                                      ).excPista_id + 1
                                  )
                              }
                          );
                          Switch(
                              true,
                              IsBlank(cmbExcPistaHoraCadastro.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(cmbExcPistaMinuCadastro.Selected.Value) = true,
                              UpdateContext(
