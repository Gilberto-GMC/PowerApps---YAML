                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |
                          =UpdateContext(
                              {
                                  var_visibleSpiner: true,
                                  var_formErro: false,
                                  var_jetBlastId: Value(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  '14.8-tbl_JetBlast',
                                                  jetBlast_id > 0
                                              ),
                                              "ID",
                                              SortOrder.Descending
                                          )
                                      ).jetBlast_id + 1
                                  )
                              }
                          );
                          Switch(
                              true,
                              cmbJetBlastHoraCadastro.Selected.Value = "hor",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbJetBlastMinuCadastro.Selected.Value = "min",
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(dropJetBlastOpeAereo.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              dropJetBlastOpeAereo.Selected.Value = "Outro" And IsBlank(TxtJetBlastPrefixoNome.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastVoo.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastMatAero.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(cmbJetBlastFaseOpAero.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastLocal.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastMapaGrade.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(cmbJetBlastDano.Selected.Value) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              cmbJetBlastDano.Selected.Value = "Sim" And IsBlank(TxtJetBlastDanoDesc.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastAcoesTomadas.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              IsBlank(TxtJetBlastDescOcorrencia.Text) = true,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              CountRows(col_jetBlastItemAtingido) = 0,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              CountRows(col_jetBlastImg) = 0,
                              UpdateContext(
                                  {
                                      var_formErro: true,
                                      varBordaDefault: Color.Red
                                  }
                              ),
                              UpdateContext(
                                  {var_formErro: false
                                      //;varBordaDefault: Color.Red
                          }
                              )
                          );
                          If(
                              var_formErro = true,
                              Notify(
                                  "Atenção todas as informações devem ser preenchidas!",
                                  NotificationType.Error
                              ),
                              //Insert de dados no database------------------------------------------------------------------------------
                              Patch(
                                  '14.8-tbl_JetBlast',
                                  Defaults('14.8-tbl_JetBlast'),
                                  {
                                      jetBlast_id: var_jetBlastId,
                                      jetBlast_data: dtpJetBlastDataCadastro.SelectedDate,
                                      jetBlast_hora: cmbJetBlastHoraCadastro.Selected.Value & ":" & cmbJetBlastMinuCadastro.Selected.Value,
                                      jetBlast_opeAereo: dropJetBlastOpeAereo.Selected.Value,
                                      jetBlast_opePrefixo: TxtJetBlastPrefixoNome.Text,
                                      jetBlast_voo: TxtJetBlastVoo.Text,
                                      jetBlast_matAereo: TxtJetBlastMatAero.Text,
                                      jetBlast_faseOperacao: cmbJetBlastFaseOpAero.Selected.Value,
                                      'jetBlast_local (jetBlast_local0)': TxtJetBlastLocal.Text,
                                      jetBlast_mapaGrade: TxtJetBlastMapaGrade.Text,
                                      jetBlast_dano: cmbJetBlastDano.Selected.Value,
                                      jetBlast_danoDesc: TxtJetBlastDanoDesc.Text,
                                      jetBlast_acoesIniciais: TxtJetBlastAcoesTomadas.Text,
                                      jetBlast_ocorrenciaDesc: TxtJetBlastDescOcorrencia.Text,
                                      jetBlast_bloco: varBlocoUser,
                                      jetBlast_aeroporto: varAeroUser
                                  }
                              );
                              //insert dos envolvidos
                          ForAll(
                                  col_jetBlastItemAtingido,
                                  Patch(
                                      '14.8-tbl_JetBlastItemAtingido',
                                      Defaults('14.8-tbl_JetBlastItemAtingido'),
                                      {
                                          jetBlastIA_idOcorrencia: var_jetBlastId,
                                          jetBlastIA_item: item,
                                          jetBlastIA_info: info
                                      }
                                  )
                              );
                              //insert das imagens
                          ForAll(
                                  col_jetBlastImg,
                                  Patch(
                                      '14.8-tbl_JetBlastImg',
                                      Defaults('14.8-tbl_JetBlastImg'),
                                      {
                                          jetBlastImg_idOcorrencia: var_jetBlastId,
                                          jetBlastImg_imagem: img
                                      }
                                  )
                              );
                              Select(ButtonResetFormJetBlast);
                              Navigate(
                                  ScreenSucesso,
                                  ScreenTransition.Fade,
                                  {var_navigateSucess: ScreenJetBlast}
                              )
                          );
                          UpdateContext({var_visibleSpiner: false});
