Screens:
  Screen1_1:
    Children:
      - Container13_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 1)
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - HEADER_1:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =50
                  Items: |-
                    =Sequence(
                        16,
                        1,
                        1
                    )
                  TemplatePadding: =0
                  TemplateSize: =62
                  Width: =Image7_1.Width
                  X: =Image7_1.X
                  Y: =Image7_1.Y - 50
                Children:
                  - ButtonCanvas10_8:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BorderRadius: =50
                        FontSize: =18
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Text: =ThisItem.Value
                        Width: =40
                        X: =12
            - LEFT_1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =Image7_1.Height + 20
                  Items: |-
                    =Sequence(
                        10,
                        1,
                        1
                    )
                  TemplateSize: =66
                  Width: =50
                  X: =Image7_1.X - 50
                  Y: =Image7_1.Y
                Children:
                  - ButtonCanvas10_9:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BorderRadius: =50
                        FontSize: =18
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Text: =Char(64 + ThisItem.Value)
                        Width: =40
            - Image7_1:
                Control: Image@2.2.3
                Properties:
                  Height: =700
                  Image: ='Captura de tela 2025-10-01 164911'
                  ImagePosition: =ImagePosition.Stretch
                  Width: =1000
                  X: =Parent.Width / 2 - Self.Width / 2
                  Y: =Parent.Height / 2 - Self.Height / 2
            - LINHA_1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderStyle: =BorderStyle.None
                  Height: =Image7_1.Height
                  Items: |-
                    =[
                        "A",
                        "B",
                        "C",
                        "D",
                        "E",
                        "F",
                        "G",
                        "H",
                        "I",
                        "J"
                    ]
                  TemplatePadding: =0
                  TemplateSize: =70
                  Width: =Image7_1.Width
                  X: =Image7_1.X
                  Y: =Image7_1.Y
                Children:
                  - Gallery3_1:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Height: =70
                        Items: |-
                          =AddColumns(
                              Sequence(
                                  16,
                                  1,
                                  1
                              ),
                              L,
                              ThisItem.Value
                          )
                        TemplatePadding: =2
                        TemplateSize: =60
                        Width: '=Parent.Width '
                      Children:
                        - Button1:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =65
                              HoverColor: =RGBA(255, 255, 0, 1)
                              HoverFill: =RGBA(255, 255, 255, 0.7)
                              OnSelect: |-
                                =Set(
                                    varLinhaSelecionada,
                                    ThisItem.L
                                );
                                Set(
                                    varColunaSelecionada,
                                    ThisItem.Value
                                )
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =12
                              Text: =ThisItem.L&ThisItem.Value
                              Width: =60
                        - Label5_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255, 191, 0, 0.5)
                              Height: =65
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =15
                              PaddingTop: =40
                              Size: =12
                              Text: =ThisItem.L&ThisItem.Value
                              Visible: =false
                              Width: =60
                        - Icon4_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =RGBA(0, 0, 0, 0)
                              Height: =65
                              HoverFill: =RGBA(255, 255, 255, 0.7)
                              Icon: =Icon.Database
                              OnSelect: |-
                                =Set(
                                    varLinhaSelecionada,
                                    ThisItem.L
                                );
                                Set(
                                    varColunaSelecionada,
                                    ThisItem.Value
                                )
                              Width: =60
            - Label6_1:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(54, 176, 75, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =100
                  Size: =24
                  Text: |-
                    ="MAPA DE GRADE: " & varLinhaSelecionada & varColunaSelecionada
                  Width: =300
                  X: =Parent.Width - 400
                  Y: =50
