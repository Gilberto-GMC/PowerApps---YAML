App:
  Properties:
    OnStart: |
      =// 🔄 Inicializa carregamentos
      Set(
          var_load,
          true
      );
      Set(
          varControleIndex,
          true
      );
      // 🆕 Carrega última versão do sistema
      Set(
          var_ultimaVersao,
          Value(
              Max(
                  tbl_controle_versoes,
                  Numero_versao
              )
          )
      );
      // 🗺️ (Descomente se quiser capturar localização)
      // Set(var_latitude; Location.Latitude);;
      // Set(var_longitude; Location.Longitude);;
      // ✈️ Carrega lista de aeroportos fixos
      ClearCollect(
          colAeros,
          {
              IATA: "",
              ICAO: "",
              Bloco: "CENTRAL",
              Aeroporto: "",
              Cluster: ""
          },
          {
              IATA: "GYN",
              ICAO: "SBGO",
              Bloco: "CENTRAL",
              Aeroporto: "GOIÂNIA",
              Cluster: "GOIÂNIA"
          },
          {
              IATA: "IMP",
              ICAO: "SBIZ",
              Bloco: "CENTRAL",
              Aeroporto: "IMPERATRIZ",
              Cluster: "GOIÂNIA"
          },
          {
              IATA: "PMW",
              ICAO: "SBPJ",
              Bloco: "CENTRAL",
              Aeroporto: "PALMAS",
              Cluster: "GOIÂNIA"
          },
          {
              IATA: "PLU",
              ICAO: "SBBH",
              Bloco: "CENTRAL",
              Aeroporto: "PAMPULHA",
              Cluster: "GOIÂNIA"
          },
          {
              IATA: "PNZ",
              ICAO: "SBPL",
              Bloco: "CENTRAL",
              Aeroporto: "PETROLINA",
              Cluster: "SÃO LUÍS"
          },
          {
              IATA: "SLZ",
              ICAO: "SBSL",
              Bloco: "CENTRAL",
              Aeroporto: "SÃO LUIS",
              Cluster: "SÃO LUÍS"
          },
          {
              IATA: "THE",
              ICAO: "SBTE",
              Bloco: "CENTRAL",
              Aeroporto: "TERESINA",
              Cluster: "SÃO LUÍS"
          },
          {
              IATA: "",
              ICAO: "",
              Bloco: "SUL",
              Aeroporto: "",
              Cluster: ""
          },
          {
              IATA: "BFH",
              ICAO: "SBBI",
              Bloco: "SUL",
              Aeroporto: "BACACHERI",
              Cluster: "CURITIBA"
          },
          {
              IATA: "CWB",
              ICAO: "SBCT",
              Bloco: "SUL",
              Aeroporto: "CURITIBA",
              Cluster: "CURITIBA"
          },
          {
              IATA: "JOI",
              ICAO: "SBJV",
              Bloco: "SUL",
              Aeroporto: "JOINVILLE",
              Cluster: "CURITIBA"
          },
          {
              IATA: "NVT",
              ICAO: "SBNF",
              Bloco: "SUL",
              Aeroporto: "NAVEGANTES",
              Cluster: "CURITIBA"
          },
          {
              IATA: "BGX",
              ICAO: "SBBG",
              Bloco: "SUL",
              Aeroporto: "BAGÉ",
              Cluster: "FOZ DO IGUAÇU"
          },
          {
              IATA: "IGU",
              ICAO: "SBFI",
              Bloco: "SUL",
              Aeroporto: "FOZ DO IGUAÇU",
              Cluster: "FOZ DO IGUAÇU"
          },
          {
              IATA: "LDB",
              ICAO: "SBLO",
              Bloco: "SUL",
              Aeroporto: "LONDRINA",
              Cluster: "FOZ DO IGUAÇU"
          },
          {
              IATA: "PET",
              ICAO: "SBPK",
              Bloco: "SUL",
              Aeroporto: "PELOTAS",
              Cluster: "FOZ DO IGUAÇU"
          },
          {
              IATA: "URG",
              ICAO: "SBUG",
              Bloco: "SUL",
              Aeroporto: "URUGUAIANA",
              Cluster: "FOZ DO IGUAÇU"
          }
      );
      // 👤 Carrega informações do usuário com base no parâmetro
      Set(
          varIdUser,
          Coalesce(
              Value(Param("USUARIO")),
              LookUp(
                  User,
                  usrNome = User().FullName
              ).ID
          )
      );
      //Set(varIdUser;318);;
      // Agrupa todas as variáveis relacionadas ao usuário em um só `With`
      With(
          {
              usuario: LookUp(
                  User,
                  ID = varIdUser
              ),
              iataUsuario: LookUp(
                  colAeros,
                  Aeroporto = LookUp(
                      User,
                      ID = varIdUser
                  ).Aeroporto
              ).IATA
          },
          Set(
              varNomeUser,
              usuario.usrNome
          );
          Set(
              varEmailUser,
              usuario.Email
          );
          Set(
              varFuncaoUser,
              usuario.Funcao
          );
          Set(
              varBlocoUser,
              usuario.Bloco
          );
          Set(
              varAeroUser,
              usuario.Aeroporto
          );
          Set(
              varPerfilUser,
              usuario.Perfil
          );
          Set(
              varAutUser,
              usuario.Autorizacao
          );
          Set(
              varIATAUser,
              iataUsuario
          )
      );
      // ✅ Finaliza carregamento
      Set(
          var_load,
          false
      );
    Theme: =MOTIVA
