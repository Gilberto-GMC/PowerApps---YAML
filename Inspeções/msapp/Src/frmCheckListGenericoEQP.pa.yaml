                  - GalleryCLG:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextOneImageVariant_ver4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =691
                        Items: "=If(\n    tgMostraApontamentos.Checked,\n\n    // Exibe apenas os apontamentos com erro\n    With(\n        {\n            blocoFiltro: Text(cmbCLGbloco.Selected.Value),\n            aeroportoFiltro: Text(cmbCLGaeroporto.Selected.Result)\n        },\n        FirstN(\n          \n                Filter(\n                    Sort(\n                    tbl_Checklist_generico_base, ID , SortOrder.Descending) As Base,\n                    (IsBlank(blocoFiltro) || StartsWith(Base.Bloco, blocoFiltro)) &&\n                    (IsBlank(aeroportoFiltro) || StartsWith(Base.Aeroporto, aeroportoFiltro)) &&\n                    !IsBlank(\n                        LookUp(\n                            Filter(tbl_Checklist_generico_objeto, ID_checkList = Base.ID),\n                            Resposta = \"Não conforme\" And Status <> \"Normalizado\"\n                        )\n                    )\n                ),\n                \n            Value(txtLimit_5.Text)\n        )\n    ),\n\n    // Exibe todos com filtros opcional de empresa\n    With(\n        {\n            blocoFiltro: Text(cmbCLGbloco.Selected.Value),\n            aeroportoFiltro: Text(cmbCLGaeroporto.Selected.Result),\n            empresaBusca: txtBuscarInspPatio_4.Text\n        },\n        FirstN(\n            SortByColumns(\n                Filter(\n                    AddColumns(\n                        Sort(\n                        tbl_Checklist_generico_base,ID,SortOrder.Descending),\n                        EmpresaNome,\n                        With(\n                            {\n                                veic: First(\n                                    SortByColumns(\n                                        Filter(Sort( tbl_Veiculos_equipamentos,ID, SortOrder.Descending), ID = ID_FK),\n                                        \"ID\",\n                                        SortOrder.Descending\n                                    )\n                                )\n                            },\n                            If(!IsBlank(veic), veic.Empresa, \"\")\n                        )\n                    ),\n                    (IsBlank(blocoFiltro) || StartsWith(Bloco, blocoFiltro)) &&\n                    (IsBlank(aeroportoFiltro) || StartsWith(Aeroporto, aeroportoFiltro)) &&\n                    (IsBlank(empresaBusca) || StartsWith(EmpresaNome, empresaBusca))\n                ),\n                \"ID\",\n                SortOrder.Descending\n            ),\n            Value(txtLimit_5.Text)\n        )\n    )\n)\n\n\n/*\n   If(\n        tgMostraApontamentos.Checked;\n     FirstN(\n        Sort(            \n        Filter(tbl_Checklist_generico_base As Base;\n                StartsWith(\n                    Base.Bloco;\n                    Text(cmbCLGbloco.Selected.Value)\n                );\n                StartsWith(\n                    Base.Aeroporto;\n                    Text(cmbCLGaeroporto.Selected.Result)\n                );\n        !IsBlank(\n            LookUp(\n                Filter(\n                    tbl_Checklist_generico_objeto;\n                    ID_checkList = Base.ID\n                );\n                Resposta = \"Não conforme\" And Status <> \"Normalizado\"\n            )        \n        )\n        );\n        ID;\n        SortOrder.Descending\n        );\n        txtLimit_5.Text\n    );\n   FirstN(\n    Sort(\n        Filter(\n            AddColumns(\n                tbl_Checklist_generico_base;\n                EmpresaNome;\n                First(\n                      FirstN(\n                Sort(\n                    Filter(\n                        tbl_Veiculos_equipamentos;\n                        ID = ID_FK\n                    );\n                    ID;\n        SortOrder.Descending\n    );\n    Value(txtLimit_5.Text)\n                )).Empresa\n            );\n            StartsWith(Bloco; Text(cmbCLGbloco.Selected.Value)) &&\n            StartsWith(Aeroporto; Text(cmbCLGaeroporto.Selected.Result)) &&\n            (IsBlank(txtBuscarInspPatio_4.Text) || StartsWith(EmpresaNome; txtBuscarInspPatio_4.Text))\n        );\n        ID;\n        SortOrder.Descending\n    );\n    Value(txtLimit_5.Text)\n\n\n   )\n\n\n\n   )*/"
