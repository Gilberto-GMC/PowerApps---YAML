Screens:
  frmHome:
    Properties:
      Fill: =RGBA(96, 70, 237, 1)
      LoadingSpinnerColor: =
      OnHidden: |-
        =Set(
            var_visibleHome,
            true
        );
        UpdateContext(
            {
                var_visibleInspecaoPista: false,
                var_visibleInspecaoCad: false,
                var_visibleContinue: false,
                var_visibleInspecaoCad1: false,
                var_visibleInspecaoCad2: false,
                var_visibleInspecaoCad3: false,
                var_visibleFilterInspPista: false,
                var_visibleInspPistaDetalhes: false,
                var_visibleFormItensDetalhes: false
            }
        )
      OnVisible: |-
        =If(
            Host.OSType = "Windows" And varControleIndex = true,
            Set(
                var_usuarioID,
                Param("USUARIO")
            );
            If(
                Mid(
                    Param("LOGADO"),
                    13,
                    8
                ) = Text(
                    Now(),
                    "ddmmyyyy"
                ),
                UpdateContext({var_visibleErro: false}),
                UpdateContext({var_visibleErro: true})
            ),
            If(
                IsBlank(
                    LookUp(
                        User,
                        Email = User().Email
                    )
                ),
                UpdateContext({var_visibleContaErro: true}),
                UpdateContext({var_visibleContaErro: false})
            )
        );
        UpdateContext({var_visibleErro: false})
