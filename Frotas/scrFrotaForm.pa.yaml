Screens:
  scrFrotaForm:
    Properties:
      OnVisible: |-
        =UpdateContext({locErro: ""})
    Children:
      - cntShellFrm:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =0
            LayoutMinHeight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuFrm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMenuMarcaFrm:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>MOTIVA</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>GESTÃO DE FROTAS</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left; margin-left:12px;'>GF</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntMenuNavFrm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnMenuPainelFrm:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrFrotaPainel, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "PAINEL", "")
                        - btnMenuFrotaFrm:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varFiltroAero, "Todos");
                                Navigate(scrFrotaLista, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "CONSULTAR FROTA", "")
                        - btnMenuNovoFrm:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              DisplayMode: =If(varPerfilNivel >= 3, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Add"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varFormModo, "Novo");
                                Set(
                                    varFormRec,
                                    Patch(
                                        Defaults(tb_ativosFrota),
                                        {
                                            aeroporto: varAeroUser,
                                            status: "Ativo",
                                            situacao_operacional: "Disponível",
                                            tipo_propriedade: "Próprio",
                                            circula_lado_ar: 0,
                                            medidor_km: 0,
                                            medidor_horas: 0
                                        }
                                    )
                                );
                                Navigate(scrFrotaForm, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "NOVO ATIVO", "")
                  - htmMenuUsuarioFrm:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "border-top:1px solid " & hxBordaBarra & ";padding-top:12px;'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:12px;font-weight:700;color:" & hxTextoBarra & ";'>" & varUsuario.nome_usuario & "</div><div style='font-size:10px;color:" & hxTextoBarraFraco & ";margin-top:2px;'>" & Upper(varUsuario.perfil) & " &middot; " & varAeroUser & "</div>",
                              "<div style='font-size:11px;font-weight:700;color:" & hxTextoBarraSuave & ";text-align:center;'>" & varAeroUser & "</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =10
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - btnMenuRecolherFrm:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoBarra
                        BorderRadius: =0
                        FontColor: =thmTextoBarra
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER MENU", "")
                  - btnMenuSairFrm:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoBarra
                        BorderRadius: =0
                        FontColor: =thmTextoBarra
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        Icon: ="ArrowExit"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrLoginContexto, ScreenTransition.Fade)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "SAIR DO SISTEMA", "")
            - cntFrmRaiz:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                Children:
                  - cntFrmTopo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmFrmTitulo:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>" & If(varFormModo = "Editar", "EDITAR ATIVO", "NOVO ATIVO") & "</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" & If(varFormModo = "Editar", Coalesce(varFormRec.codigo_ativo, "sem código") & " &nbsp;&middot;&nbsp; registro " & varFormRec.ID, "O código FRT é gerado na gravação, a partir do ID do SharePoint") & "</div>" &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - btnFrmCancelar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmSuperficie
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              OnSelect: =Navigate(scrFrotaLista, ScreenTransition.Fade)
                              Text: ="CANCELAR"
                              Width: =130
                        - btnFrmSalvar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmAcao
                              BorderRadius: =0
                              DisplayMode: =If(varPerfilNivel >= 3, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Save"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =If(
                                    !IsBlank(varOcupadoDesde) && DateDiff(varOcupadoDesde, Now(), TimeUnit.Seconds) < 20,
                                    Notify("Aguarde: a gravação anterior ainda está em andamento.", NotificationType.Warning, 3000),
                                    UpdateContext(
                                        {
                                            locErro: If(
                                                IsBlank(drpFrmTipo.Selected.Value), "Escolha o tipo de ativo.",
                                                IsBlank(drpFrmCategoria.Selected.Value), "Escolha a categoria de uso.",
                                                IsBlank(Trim(txtFrmMarca.Value)), "Informe a marca.",
                                                IsBlank(Trim(txtFrmModelo.Value)), "Informe o modelo.",
                                                !IsNumeric(txtFrmAnoFab.Value) Or Value(txtFrmAnoFab.Value) < 1950 Or Value(txtFrmAnoFab.Value) > Year(Today()) + 1,
                                                    "Ano de fabricação inválido — use o ano com 4 dígitos.",
                                                IsBlank(drpFrmCombustivel.Selected.Value), "Escolha o combustível.",
                                                IsBlank(drpFrmTipoMedidor.Selected.Value), "Escolha o tipo de medidor.",
                                                IsBlank(drpFrmAero.Selected.Value), "Escolha o aeroporto de lotação.",
                                                IsBlank(Trim(txtFrmCentroCusto.Value)), "Informe o centro de custo.",
                                                IsBlank(Trim(txtFrmSetor.Value)), "Informe o setor responsável.",
                                                IsBlank(drpFrmStatus.Selected.Value), "Escolha o status do ativo.",
                                                IsBlank(drpFrmSituacao.Selected.Value), "Escolha a situação operacional.",
                                                IsBlank(drpFrmPropriedade.Selected.Value), "Escolha o tipo de propriedade.",
                                                LookUp(colTipoAtivo, Tipo = drpFrmTipo.Selected.Value).ExigePlaca And IsBlank(Trim(txtFrmPlaca.Value)),
                                                    "Este tipo de ativo exige placa.",
                                                !IsBlank(Trim(txtFrmPlaca.Value)) And !IsMatch(Upper(Trim(txtFrmPlaca.Value)), "([A-Z]{3}[0-9]{4})|([A-Z]{3}[0-9][A-Z][0-9]{2})"),
                                                    "Placa inválida — use o formato AAA0000 ou AAA0A00, sem hífen.",
                                                !IsBlank(Trim(txtFrmGestorEmail.Value)) And !IsMatch(Trim(txtFrmGestorEmail.Value), Match.Email),
                                                    "E-mail do gestor inválido.",
                                                drpFrmStatus.Selected.Value <> "Ativo" And IsBlank(Trim(txtFrmMotivo.Value)),
                                                    "Ativo fora do status Ativo exige o motivo da situação.",
                                                ""
                                            )
                                        }
                                    );
                                    If(
                                        !IsBlank(locErro),
                                        Notify(locErro, NotificationType.Error, 4000),
                                        Set(varOcupadoDesde, Now());
                                        Set(
                                            varAtivoGravado,
                                            Patch(
                                                'tb_ativosFrota',
                                                If(varFormModo = "Editar", varFormRec, Defaults('tb_ativosFrota')),
                                                {
                                                    identificacao_visual: Trim(txtFrmIdVisual.Value),
                                                    placa: Upper(Trim(txtFrmPlaca.Value)),
                                                    renavam: Trim(txtFrmRenavam.Value),
                                                    chassi: Trim(txtFrmChassi.Value),
                                                    n_serie: Trim(txtFrmNSerie.Value),
                                                    n_patrimonio: Trim(txtFrmNPatrimonio.Value),
                                                    tipo_ativo: drpFrmTipo.Selected.Value,
                                                    categoria_uso: drpFrmCategoria.Selected.Value,
                                                    marca: Trim(txtFrmMarca.Value),
                                                    modelo: Trim(txtFrmModelo.Value),
                                                    ano_fabricacao: If(IsNumeric(txtFrmAnoFab.Value), Value(txtFrmAnoFab.Value), 0),
                                                    ano_modelo: If(IsNumeric(txtFrmAnoModelo.Value), Value(txtFrmAnoModelo.Value), 0),
                                                    cor: Trim(txtFrmCor.Value),
                                                    combustivel: drpFrmCombustivel.Selected.Value,
                                                    capacidade_tanque: If(IsNumeric(txtFrmTanque.Value), Value(txtFrmTanque.Value), 0),
                                                    qtd_passageiros: If(IsNumeric(txtFrmQtdPassageiros.Value), Value(txtFrmQtdPassageiros.Value), 0),
                                                    capacidade_carga_kg: If(IsNumeric(txtFrmCapacidadeCarga.Value), Value(txtFrmCapacidadeCarga.Value), 0),
                                                    tipo_medidor: drpFrmTipoMedidor.Selected.Value,
                                                    medidor_km: If(IsNumeric(txtFrmMedidorKm.Value), Value(txtFrmMedidorKm.Value), 0),
                                                    medidor_horas: If(IsNumeric(txtFrmMedidorHoras.Value), Value(txtFrmMedidorHoras.Value), 0),
                                                    medidor_data: dtpFrmMedidorData.SelectedDate,
                                                    aeroporto: drpFrmAero.Selected.Value,
                                                    base_operacional: Trim(txtFrmBase.Value),
                                                    centro_custo: Trim(txtFrmCentroCusto.Value),
                                                    setor_responsavel: Trim(txtFrmSetor.Value),
                                                    gestor_nome: Trim(txtFrmGestorNome.Value),
                                                    gestor_email: Trim(txtFrmGestorEmail.Value),
                                                    status: drpFrmStatus.Selected.Value,
                                                    situacao_operacional: drpFrmSituacao.Selected.Value,
                                                    motivo_situacao: Trim(txtFrmMotivo.Value),
                                                    tipo_propriedade: drpFrmPropriedade.Selected.Value,
                                                    fornecedor_txt: Trim(txtFrmFornecedor.Value),
                                                    contrato_numero: Trim(txtFrmContrato.Value),
                                                    data_aquisicao: dtpFrmDataAquisicao.SelectedDate,
                                                    valor_aquisicao: If(IsNumeric(txtFrmValorAquisicao.Value), Value(txtFrmValorAquisicao.Value), 0),
                                                    data_fim_contrato: dtpFrmDataFimContrato.SelectedDate,
                                                    circula_lado_ar: If(tglFrmLadoAr.Checked, 1, 0),
                                                    observacoes: Trim(txtFrmObservacoes.Value),
                                                    bloco: LookUp(colAeros, IATA = drpFrmAero.Selected.Value).Bloco,
                                                    medidor_origem: If(varFormModo = "Editar" And If(IsNumeric(txtFrmMedidorKm.Value), Value(txtFrmMedidorKm.Value), 0) = Coalesce(varFormRec.medidor_km, 0) And If(IsNumeric(txtFrmMedidorHoras.Value), Value(txtFrmMedidorHoras.Value), 0) = Coalesce(varFormRec.medidor_horas, 0), Coalesce(varFormRec.medidor_origem, "Cadastro"), "Cadastro"),
                                                    data_situacao: If(varFormModo = "Editar" And drpFrmStatus.Selected.Value = varFormRec.status And drpFrmSituacao.Selected.Value = varFormRec.situacao_operacional, varFormRec.data_situacao, Now()),
                                                    ativo: 1
                                                }
                                            )
                                        );
                                        If(
                                            IsBlank(varAtivoGravado.ID),
                                            Notify("Falha ao gravar. Nenhum registro foi salvo.", NotificationType.Error, 5000);
                                            Set(varOcupadoDesde, Blank()),
                                            If(
                                                IsBlank(varAtivoGravado.codigo_ativo),
                                                Patch(
                                                    'tb_ativosFrota',
                                                    varAtivoGravado,
                                                    {codigo_ativo: "FRT-" & Text(varAtivoGravado.ID, "00000")}
                                                )
                                            );
                                            RemoveIf(colFrota, ID = varAtivoGravado.ID);
                                            Collect(
                                                colFrota,
                                                ForAll(
                                                    Filter(
                                                        'tb_ativosFrota' As _reg,
                                                        _reg.ID = varAtivoGravado.ID
                                                    ) As _r,
                                                    {
                                                        ID: _r.ID,
                                                        codigo_ativo: _r.codigo_ativo,
                                                        identificacao_visual: _r.identificacao_visual,
                                                        placa: _r.placa,
                                                        tipo_ativo: _r.tipo_ativo,
                                                        categoria_uso: _r.categoria_uso,
                                                        marca: _r.marca,
                                                        modelo: _r.modelo,
                                                        ano_fabricacao: _r.ano_fabricacao,
                                                        combustivel: _r.combustivel,
                                                        aeroporto: _r.aeroporto,
                                                        bloco: _r.bloco,
                                                        base_operacional: _r.base_operacional,
                                                        centro_custo: _r.centro_custo,
                                                        setor_responsavel: _r.setor_responsavel,
                                                        gestor_nome: _r.gestor_nome,
                                                        gestor_email: _r.gestor_email,
                                                        status: _r.status,
                                                        situacao_operacional: _r.situacao_operacional,
                                                        motivo_situacao: _r.motivo_situacao,
                                                        tipo_medidor: _r.tipo_medidor,
                                                        medidor_km: _r.medidor_km,
                                                        medidor_horas: _r.medidor_horas,
                                                        medidor_data: _r.medidor_data,
                                                        tipo_propriedade: _r.tipo_propriedade,
                                                        fornecedor_txt: _r.fornecedor_txt,
                                                        circula_lado_ar: _r.circula_lado_ar
                                                    }
                                                )
                                            );
                                            Notify(
                                                If(varFormModo = "Editar", "Ativo atualizado: ", "Ativo cadastrado: ") & LookUp(colFrota, ID = varAtivoGravado.ID).codigo_ativo,
                                                NotificationType.Success,
                                                3000
                                            );
                                            Set(varOcupadoDesde, Blank());
                                            // a lista abre no recorte onde o ativo salvo aparece
                                            Set(varFiltroAero, drpFrmAero.Selected.Value);
                                            Set(varFiltroTipo, "Todos");
                                            Set(varFiltroSituacao, "Todos");
                                            Set(varFiltroStatus, "Ativo");
                                            Navigate(scrFrotaLista, ScreenTransition.Fade)
                                        )
                                    )
                                )
                              Text: =If(varFormModo = "Editar", "SALVAR ALTERAÇÕES", "CADASTRAR ATIVO")
                              Width: =230
                  - cntFrmCorpo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =26
                        LayoutMinHeight: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =26
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmFrmErro:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Fill: =thmFundo
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "background:" & hxVermelhoSuave & ";border:1px solid " & hxVermelho & ";border-left:4px solid " & hxVermelho & ";padding:13px 16px;'>" &
                                "<div style='font-size:10px;font-weight:800;letter-spacing:.14em;color:" & hxVermelho & ";'>CORRIJA PARA CONTINUAR</div>" &
                                "<div style='font-size:13px;color:" & hxTexto & ";margin-top:5px;'>" & locErro & "</div></div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Visible: =!IsBlank(locErro)
                        - cntFrmSec1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =thmBorda
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =0
                              Height: =276
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              PaddingBottom: =20
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =18
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htmFrmSec1:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =false
                                    Fill: =thmSuperficie
                                    FillPortions: =0
                                    Font: =thmFonte
                                    Height: =46
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "border-bottom:1px solid " & hxBorda & ";padding-bottom:8px;'>" &
                                      "<div style='font-size:12px;font-weight:800;letter-spacing:.14em;color:" & hxPrimaria & ";'>IDENTIFICAÇÃO</div>" &
                                      "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:2px;'>O código FRT é gerado pelo app na gravação — não se digita.</div></div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                              - cntFrmLin1_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    Fill: =thmSuperficie
                                    FillPortions: =0
                                    Height: =80
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
