Screens:
  scrFrotaLista:
    Properties:
      OnVisible: |-
        =UpdateContext(
            {
                locDetalhe: false,
                locNonce: 0,
                locReset: false
            }
        )
    Children:
      - cntShellLst:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuLst:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMenuMarcaLst:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>MOTIVA</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>GESTÃO DE FROTAS</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left; margin-left:12px;'>GF</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntMenuNavLst:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnMenuPainelLst:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrFrotaPainel, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "PAINEL", "")
                        - btnMenuFrotaLst:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varFiltroAero, "Todos");
                                Navigate(scrFrotaLista, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "CONSULTAR FROTA", "")
                        - btnMenuNovoLst:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              DisplayMode: =If(varPerfilNivel >= 3, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Add"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varFormModo, "Novo");
                                Set(
                                    varFormRec,
                                    Patch(
                                        Defaults(tb_ativosFrota),
                                        {
                                            aeroporto: varAeroUser,
                                            status: "Ativo",
                                            situacao_operacional: "Disponível",
                                            tipo_propriedade: "Próprio",
                                            circula_lado_ar: 0,
                                            medidor_km: 0,
                                            medidor_horas: 0
                                        }
                                    )
                                );
                                Navigate(scrFrotaForm, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "NOVO ATIVO", "")
                  - htmMenuUsuarioLst:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "border-top:1px solid " & hxBordaBarra & ";padding-top:12px;'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:12px;font-weight:700;color:" & hxTextoBarra & ";'>" & varUsuario.nome_usuario & "</div><div style='font-size:10px;color:" & hxTextoBarraFraco & ";margin-top:2px;'>" & Upper(varUsuario.perfil) & " &middot; " & varAeroUser & "</div>",
                              "<div style='font-size:11px;font-weight:700;color:" & hxTextoBarraSuave & ";text-align:center;'>" & varAeroUser & "</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =10
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - btnMenuRecolherLst:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoBarra
                        BorderRadius: =0
                        FontColor: =thmTextoBarra
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER MENU", "")
                  - btnMenuSairLst:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoBarra
                        BorderRadius: =0
                        FontColor: =thmTextoBarra
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        Icon: ="ArrowExit"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrLoginContexto, ScreenTransition.Fade)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "SAIR DO SISTEMA", "")
            - cntListaRaiz:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntListaTopo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmListaTitulo:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>CONSULTA DA FROTA</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>Busca e filtros rodam em memória sobre o cache carregado no login</div>" &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - btnListaNovo:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(168, 110, 235, 1)
                              BorderRadius: =0
                              DisplayMode: =If(varPerfilNivel >= 3, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Add"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =Set(varFormModo, "Novo");
                                Set(
                                    varFormRec,
                                    Patch(
                                        Defaults(tb_ativosFrota),
                                        {
                                            aeroporto: varAeroUser,
                                            status: "Ativo",
                                            situacao_operacional: "Disponível",
                                            tipo_propriedade: "Próprio",
                                            circula_lado_ar: 0,
                                            medidor_km: 0,
                                            medidor_horas: 0
                                        }
                                    )
                                );
                                Navigate(scrFrotaForm, ScreenTransition.Fade)
                              Text: ="NOVO ATIVO"
                              Width: =160
                  - cntListaFiltros:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =thmBorda
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        FillPortions: =0
                        Height: =78
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - txtListaBusca:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              Default: =""
                              DelayOutput: =true
                              Fill: =thmSuperficie
                              FillPortions: =1
                              Height: =42
                              HintText: ="Buscar por código, placa, identificação ou modelo"
                              PaddingLeft: =14
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Reset: =locReset
                              Size: =12
                        - drpListaAero:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =[Coalesce(varFiltroAero, "Todos")]
                              Height: =42
                              Items: =Filter(colFiltroAero, locNonce >= 0)
                              Width: =150
                        - drpListaTipo:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =[Coalesce(varFiltroTipo, "Todos")]
                              Height: =42
                              Items: =Filter(colFiltroTipo, locNonce >= 0)
                              Width: =190
                        - drpListaSituacao:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =[Coalesce(varFiltroSituacao, "Todos")]
                              Height: =42
                              Items: =Filter(colFiltroSituacao, locNonce >= 0)
                              Width: =170
                        - drpListaStatus:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =[Coalesce(varFiltroStatus, "Ativo")]
                              Height: =42
                              Items: =Filter(colFiltroStatus, locNonce >= 0)
                              Width: =130
                        - drpListaOrdem:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =["Código"]
                              Height: =42
                              Items: =Filter(colOpOrdem, locNonce >= 0)
                              Width: =180
                        - btnListaLimpar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =42
                              OnSelect: |-
                                =UpdateContext({locReset: true, locNonce: locNonce + 1});
                                Set(varFiltroAero, "Todos");
                                Set(varFiltroTipo, "Todos");
                                Set(varFiltroSituacao, "Todos");
                                Set(varFiltroStatus, "Ativo");
                                Set(varRecorte, "TODOS");
                                UpdateContext(
                                    {
                                        locDetalhe: false,
                                        locReset: false
                                    }
                                )
                              Text: ="LIMPAR FILTROS"
                              Width: =150
                  - cntListaRecortes:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =0
                        Height: =58
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        PaddingBottom: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntListaRecortesEsq:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =1
                              Height: =34
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnRecorteTodos:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(Coalesce(varRecorte, "TODOS") = "TODOS", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    BasePaletteColor: =If(Coalesce(varRecorte, "TODOS") = "TODOS", thmPrimaria, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(Coalesce(varRecorte, "TODOS") = "TODOS", thmTextoBarra, thmTexto)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    Icon: ="Search"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Set(varRecorte, "TODOS");
                                      UpdateContext({locDetalhe: false})
                                    Text: ="TODA A FROTA"
                                    Width: =160
                              - btnRecorteMeus:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(Coalesce(varRecorte, "TODOS") = "MEUS", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    BasePaletteColor: =If(Coalesce(varRecorte, "TODOS") = "MEUS", thmPrimaria, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(Coalesce(varRecorte, "TODOS") = "MEUS", thmTextoBarra, thmTexto)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    Icon: ="Eye"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Set(varRecorte, "MEUS");
                                      UpdateContext({locDetalhe: false})
                                    Text: ="SOB MINHA GESTÃO"
                                    Width: =190
                              - btnRecortePendencia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(Coalesce(varRecorte, "TODOS") = "PENDENCIA", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    BasePaletteColor: =If(Coalesce(varRecorte, "TODOS") = "PENDENCIA", thmPrimaria, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(Coalesce(varRecorte, "TODOS") = "PENDENCIA", thmTextoBarra, thmTexto)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    Icon: ="Warning"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Set(varRecorte, "PENDENCIA");
                                      UpdateContext({locDetalhe: false})
                                    Text: ="COM PENDÊNCIA"
                                    Width: =175
                              - btnRecorteSemCodigo:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: =If(Coalesce(varRecorte, "TODOS") = "SEMCODIGO", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    BasePaletteColor: =If(Coalesce(varRecorte, "TODOS") = "SEMCODIGO", thmPrimaria, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(Coalesce(varRecorte, "TODOS") = "SEMCODIGO", thmTextoBarra, thmTexto)
                                    FontSize: =11
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    Icon: ="DismissCircle"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: |-
                                      =Set(varRecorte, "SEMCODIGO");
                                      UpdateContext({locDetalhe: false})
                                    Text: ="SEM CÓDIGO FRT"
                                    Width: =180
                        - btnListaAtualizar:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontSize: =11
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =If(
                                    !IsBlank(varOcupadoDesde) && DateDiff(varOcupadoDesde, Now(), TimeUnit.Seconds) < 20,
                                    Notify("Aguarde: a atualização anterior ainda está em andamento.", NotificationType.Warning, 3000),
                                    Set(varOcupadoDesde, Now());
                                    Clear(colFrota);
                                    ForAll(
                                        varAerosPermitidos As _aero,
                                        Collect(
                                            colFrota,
                                            ForAll(
                                                Filter(
                                                    tb_ativosFrota,
                                                    ativo = 1,
                                                    aeroporto = _aero.IATA
                                                ) As _r,
                                                {
                                                    ID: _r.ID,
                                                    codigo_ativo: _r.codigo_ativo,
                                                    identificacao_visual: _r.identificacao_visual,
                                                    placa: _r.placa,
                                                    tipo_ativo: _r.tipo_ativo,
                                                    categoria_uso: _r.categoria_uso,
                                                    marca: _r.marca,
                                                    modelo: _r.modelo,
                                                    ano_fabricacao: _r.ano_fabricacao,
                                                    combustivel: _r.combustivel,
                                                    aeroporto: _r.aeroporto,
                                                    bloco: _r.bloco,
                                                    base_operacional: _r.base_operacional,
                                                    centro_custo: _r.centro_custo,
                                                    setor_responsavel: _r.setor_responsavel,
                                                    gestor_nome: _r.gestor_nome,
                                                    gestor_email: _r.gestor_email,
                                                    status: _r.status,
                                                    situacao_operacional: _r.situacao_operacional,
                                                    motivo_situacao: _r.motivo_situacao,
                                                    tipo_medidor: _r.tipo_medidor,
                                                    medidor_km: _r.medidor_km,
                                                    medidor_horas: _r.medidor_horas,
                                                    medidor_data: _r.medidor_data,
                                                    tipo_propriedade: _r.tipo_propriedade,
                                                    fornecedor_txt: _r.fornecedor_txt,
                                                    circula_lado_ar: _r.circula_lado_ar
                                                }
                                            )
                                        )
                                    );
                                    Set(varCacheEm, Now());
                                    Set(varCacheTruncado, CountRows(colFrota) >= 2000);
                                    Set(varOcupadoDesde, Blank());
                                    Notify(
                                        "Frota atualizada: " & CountRows(colFrota) & " ativos em " & CountRows(varAerosPermitidos) & " aeroporto(s).",
                                        NotificationType.Success,
                                        2500
                                    )
                                )
                              Text: ="ATUALIZAR CACHE"
                              Width: =180
                  - cntListaCorpo:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =26
                        LayoutMinHeight: =0
                        PaddingBottom: =26
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntListaResultado:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =3
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htmListaContador:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Fill: =thmSuperficie
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<table style='width:100%;border-collapse:collapse;" & htmlFonte & "'><tr>" &
                                      "<td style='font-size:11px;font-weight:800;letter-spacing:.14em;color:" & hxTextoFraco & ";'>" & Text(
                                          CountRows(
                                              Filter(
                                                  colFrota,
                                                  (drpListaAero.Selected.Value = "Todos" Or aeroporto = drpListaAero.Selected.Value) And
                                                  (drpListaTipo.Selected.Value = "Todos" Or tipo_ativo = drpListaTipo.Selected.Value) And
                                                  (drpListaSituacao.Selected.Value = "Todos" Or situacao_operacional = drpListaSituacao.Selected.Value) And
                                                  (drpListaStatus.Selected.Value = "Todos" Or status = drpListaStatus.Selected.Value) And
                                                  (Coalesce(varRecorte, "TODOS") <> "MEUS" Or gestor_email = User().Email) And
                                                  (Coalesce(varRecorte, "TODOS") <> "PENDENCIA" Or IsBlank(codigo_ativo) Or IsBlank(gestor_email) Or IsBlank(medidor_data) Or medidor_data < DateAdd(Today(), -90, TimeUnit.Days)) And
                                                  (Coalesce(varRecorte, "TODOS") <> "SEMCODIGO" Or IsBlank(codigo_ativo)) And
                                                  (
                                                      IsBlank(txtListaBusca.Text) Or
                                                      StartsWith(codigo_ativo, txtListaBusca.Text) Or
