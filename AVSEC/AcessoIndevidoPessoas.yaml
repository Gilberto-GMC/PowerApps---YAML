Screens:
  AcessoIndevidoPessoas:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =UpdateContext(
            {
                var_filterButtonAction: "TODOS",
                var_visible: "Novo Registro",
                var_acao: "new",
                var_visibleExcluir: false,
                var_visibleProcessando: false,
                var_visibleDesdobramento: false,
                var_processandoDesdobramento: false,
                var_processandoAnalise: false
            }
        );
        Set(var_dados_avsec, Defaults(tb_avsecOcorrencias));
        Set(var_dados_desdobramento, Defaults(tb_avsecDesdobramentos));
        Set(var_ocorrenciaAvsec, Defaults(tb_avsecOcorrencias));
        ResetForm(FormAvsecOcorrencia_1);
        NewForm(FormAvsecOcorrencia_1);
        ResetForm(FormAvsecDesdobramento_1);
        NewForm(FormAvsecDesdobramento_1)
    Children:
      - ScreenRootAvsecAcesso:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - BodyContainerAvsec:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - SidebarContainerAvsec:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =If(App.Width < 900, 0, If(IsBlank(var_sideBarWidth), 250, var_sideBarWidth))
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =App.Width >= 900
                        Width: =If(IsBlank(var_sideBarWidth), 250, var_sideBarWidth)
                      Children:
                        - SideMenu_AvsecAcesso:
                            Control: CanvasComponent
                            ComponentName: SideMenu
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =RGBA(57, 22, 148, 1)
                              FillPortions: =1
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(IsBlank(var_sideBarWidth), 250, var_sideBarWidth)
                              avsec: =AcessoIndevidoPessoas
                              bibliotecaProcedimentos: =App.ActiveScreen
                              configuracoes: =App.ActiveScreen
                              home: =Home
                              liçõeAprendidas: =App.ActiveScreen
                              operacoesAeroportuarias: =OperacoesAeroportuarias
                              respostaEmergencia: =App.ActiveScreen
                              sair: =Login
                              segurancaOperacional: =App.ActiveScreen
                              terminalPassageiros: =App.ActiveScreen
                  - ContentScrollAvsec:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - BackNavContainerAvsec:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(980, Parent.Width - 24)
                            Children:
                              - BackButtonCircleAvsec:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 1)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =100
                                    RadiusBottomRight: =100
                                    RadiusTopLeft: =100
                                    RadiusTopRight: =100
                                    Width: =32
                                  Children:
                                    - btnVoltarPainelAvsec:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          BorderRadius: =100
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          FontSize: =16
                                          Icon: ="ArrowLeft"
                                          IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                          OnSelect: =Navigate(OperacoesAeroportuarias, ScreenTransition.Fade)
                                          Text: =""
                                          Width: =32
                              - lblVoltarPainelAvsec:
                                  Control: Text@0.0.51
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontColor: =RGBA(148, 163, 184, 1)
                                    Height: =35
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =15
                                    Size: =13
                                    Text: ="VOLTAR AO PAINEL"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Weight: ='TextCanvas.Weight'.Bold
                                    Width: =1000
                        - HeaderContainerAvsec:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(229, 229, 229, 1)
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =90
                              AlignInContainer: =AlignInContainer.Center
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinWidth: =0
                              PaddingLeft: =If(App.Width < 900, 12, 50)
                              PaddingRight: =If(App.Width < 900, 12, 50)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(980, Parent.Width - If(App.Width < 900, 24, 100))
                            Children:
                              - HeaderTitleContainerAvsec:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblTituloModuloAvsec:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(2, 16, 59, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Size: =24
                                          Text: ="ACESSO INDEVIDO DE PESSOAS"
                                          Width: =Parent.Width
                                    - lblSubtituloModuloAvsec:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(148, 163, 184, 1)
                                          Font: =Font.'Segoe UI'
                                          Size: =10
                                          Text: ="Registro, análise e acompanhamento de ocorrências AVSEC"
                                          Width: =Parent.Width
                              - HeaderContextContainerAvsec:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinWidth: =240
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =280
                                  Children:
                                    - lblUsuarioContextoAvsec:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          AutoHeight: =true
                                          Color: =RGBA(51, 65, 85, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =10
                                          Text: =Coalesce(varNomeUser, User().FullName)
                                          Width: =Parent.Width
                                    - lblAeroportoContextoAvsec:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Right
                                          AutoHeight: =true
                                          Color: =RGBA(148, 163, 184, 1)
                                          Font: =Font.'Segoe UI'
                                          Size: =9
                                          Text: |-
                                            ="Aeroporto: " & Coalesce(varAeroUser, "Não definido")
                                          Width: =Parent.Width
                        - rectHeaderTopAvsec:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                        - TabsContainerAvsec:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(229, 229, 229, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(248, 250, 252, 1)
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutWrap: =true
                              PaddingBottom: =2
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Min(350, Parent.Width - 20)
                            Children:
                              - btnNovoRegistroAvsec:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: |-
                                      =If(
                                          IsBlank(var_visible) Or var_visible = Self.Text,
                                          'ButtonCanvas.Appearance'.Secondary,
                                          'ButtonCanvas.Appearance'.Transparent
                                      )
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    BorderRadius: =0
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    FillPortions: =1
                                    FontColor: |-
                                      =If(
                                          IsBlank(var_visible) Or var_visible = Self.Text,
                                          RGBA(57, 22, 148, 1),
                                          RGBA(148, 163, 184, 1)
                                      )
                                    FontSize: =16
                                    Height: =40
                                    Icon: ="Add"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =UpdateContext(
                                          {
                                              var_visible: "Novo Registro",
                                              var_acao: "new",
                                              var_visibleExcluir: false,
                                              var_visibleDesdobramento: false
                                          }
                                      );
                                      Set(var_dados_avsec, Defaults(tb_avsecOcorrencias));
                                      NewForm(FormAvsecOcorrencia_1);
                                      ResetForm(FormAvsecOcorrencia_1)
                                    Text: ="Novo Registro"
                                    Width: =150
                              - btnRegistrosAvsec:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: |-
                                      =If(
                                          IsBlank(var_visible) Or var_visible = Self.Text,
                                          'ButtonCanvas.Appearance'.Secondary,
                                          'ButtonCanvas.Appearance'.Transparent
                                      )
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    BorderRadius: =0
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    FillPortions: =1
                                    FontColor: |-
                                      =If(
                                          IsBlank(var_visible) Or var_visible = Self.Text,
                                          RGBA(57, 22, 148, 1),
                                          RGBA(148, 163, 184, 1)
                                      )
                                    FontSize: =16
                                    Height: =40
                                    Icon: ="History"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =UpdateContext(
                                          {
                                              var_visible: "Registros",
                                              var_visibleExcluir: false,
                                              var_visibleDesdobramento: false
                                          }
                                      );
                                      Refresh(tb_avsecOcorrencias)
                                    Text: ="Registros"
                                    Width: =150
                        - rectHeaderBottomAvsec:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =DisplayMode.View
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                        - NovoRegistroViewAvsec:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =1840
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =20
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =Coalesce(var_visible, "Novo Registro") = "Novo Registro"
                              Width: =Min(980, Parent.Width - If(App.Width < 900, 24, 100))
                            Children:
                              - DefinitionCardAvsec:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =RGBA(241, 215, 156, 1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 247, 230, 1)
                                    FillPortions: =0
                                    Height: =htmlDefinitionAvsec.Height + 20
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =20
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - htmlDefinitionAvsec:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =RGBA(146, 64, 14, 1)
                                          FillPortions: =1
                                          Font: =Font.'Open Sans'
                                          Height: =230
                                          HtmlText: |-
                                            ="<div style='font-family: Arial, sans-serif; text-align: justify; padding: 0px; line-height: 1.6;'>
                                              <h3 style='margin-bottom: 10px; font-size: 1.1em; font-weight: bold;'>
                                                ATENÇÃO: ACESSO INDEVIDO DE PESSOAS
                                              </h3>
                                              <p style='margin: 0 0 8px 0;'>
                                                Destina-se ao registro e acompanhamento de acesso indevido ou tentativa de acesso indevido em áreas controladas, públicas ou restritas de segurança (ARS).
                                              </p>
                                              <ul style='margin: 0; padding-left: 18px;'>
                                                <li>Registre os fatos de forma objetiva e identifique os envolvidos quando possível.</li>
                                                <li>Informe a pronta resposta executada e anexe evidências relevantes.</li>
                                                <li>Para acesso indevido em ARS, informe obrigatoriamente a realização da varredura.</li>
                                                <li>O prazo de avaliação para DSAC é de 30 dias a partir da ocorrência.</li>
                                              </ul>
                                            </div>"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingTop: =0
                                          Size: =11
                              - FormCardAvsec:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 229, 229, 1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =1605
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =1605
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - FormHeaderAvsec:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(229, 229, 229, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =68
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinWidth: =0
                                          PaddingLeft: =20
                                          PaddingRight: =20
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - FormHeaderTextAvsec:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - lblFormTitleAvsec:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(2, 16, 59, 1)
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Bold
                                                      Size: =15
                                                      Text: =If(var_acao = "edit", "EDITAR OCORRÊNCIA", "NOVO REGISTRO")
                                                      Width: =Parent.Width
                                                - lblFormSubtitleAvsec:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      AutoHeight: =true
                                                      Color: =RGBA(148, 163, 184, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Size: =9
                                                      Text: ="Preencha os dados objetivos da ocorrência e a ação imediata executada."
                                                      Width: =Parent.Width
                                          - btnVoltarFormularioAvsec:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                BorderRadius: =0
                                                Font: =Font.'Segoe UI'
                                                FontSize: =12
                                                FontWeight: =FontWeight.Semibold
                                                Icon: ="ArrowLeft"
                                                Layout: ='ButtonCanvas.Layout'.IconBefore
                                                OnSelect: |-
                                                  =ResetForm(FormAvsecOcorrencia_1);
                                                  UpdateContext({var_visible: "Registros", var_acao: "view"})
                                                Text: ="Voltar"
                                                Width: =105
                                    - FormAvsecOcorrencia_1:
                                        Control: Form@2.4.4
                                        Variant: Classic
                                        Layout: Vertical
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          DataSource: =tb_avsecOcorrencias
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =1470
                                          Item: =var_dados_avsec
                                          NumberOfColumns: =2
                                          OnFailure: |-
                                            =UpdateContext({var_visibleProcessando: false});
                                            Notify(
                                                "Não foi possível salvar a ocorrência. " & Coalesce(FormAvsecOcorrencia_1.Error, "Revise os campos obrigatórios e tente novamente."),
                                                NotificationType.Error,
                                                5000
                                            )
                                          OnSuccess: |-
                                            =Set(var_ocorrenciaAvsec, Self.LastSubmit);
                                            Set(var_dados_avsec, Self.LastSubmit);
                                            Set(
                                                var_configAvsec,
                                                LookUp(
                                                    tb_avsecConfigAeroportos,
                                                    aeroporto = Self.LastSubmit.aeroporto And
                                                    (ativo = true Or IsBlank(ativo))
                                                )
                                            );
                                            Set(var_grupoResponsavelAvsec, var_configAvsec.grupo_responsavel_avsec);
                                            Set(var_grupoBlocoAvsec, var_configAvsec.grupo_bloco);
                                            UpdateContext(
                                                {
                                                    var_visibleProcessando: false,
                                                    var_visible: "Detalhes",
                                                    var_acao: "view",
                                                    var_visibleDesdobramento: false
                                                }
                                            );
                                            Refresh(tb_avsecOcorrencias);
                                            Refresh(tb_avsecDesdobramentos);
                                            If(
                                                IsBlank(var_configAvsec.ID),
                                                Notify(
                                                    "Ocorrência salva, mas não existe configuração AVSEC ativa para o aeroporto selecionado.",
                                                    NotificationType.Warning,
                                                    5000
                                                ),
                                                Notify(
                                                    "Ocorrência salva com sucesso.",
                                                    NotificationType.Success,
                                                    3000
                                                )
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - modulo_DataCardAvsec:
                                              Control: TypedDataCard@1.0.7
                                              Variant: ClassicTextualEdit
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                DataField: ="modulo"
                                                Default: =ThisItem.modulo
                                                DisplayName: ="modulo"
                                                Fill: =RGBA(255, 255, 255, 1)
                                                MaxLength: =DataSourceInfo([@tb_avsecOcorrencias], DataSourceInfo.MaxLength, modulo)
                                                Required: =true
                                                Update: ="acesso_indevido_pessoas"
                                                Visible: =false
                                                Width: =Parent.Width
                                                X: =0
                                                Y: =0
                                          - aeroporto_DataCardAvsec:
                                              Control: TypedDataCard@1.0.7
                                              Variant: TextualEdit
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                DataField: ="aeroporto"
                                                Default: =ThisItem.aeroporto
                                                DisplayName: ="aeroporto"
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =100
                                                MaxLength: =DataSourceInfo([@tb_avsecOcorrencias], DataSourceInfo.MaxLength, aeroporto)
                                                Required: =true
                                                Update: =cmbAeroportoAvsec.Selected.Aeroporto
                                                Width: =If(App.Width < 1050, Parent.Width, Parent.Width / 2)
                                                X: =0
                                                Y: =1
                                              Children:
                                                - lblAeroportoAvsec:
                                                    Control: Text@0.0.51
                                                    MetadataKey: FieldName
                                                    Properties:
                                                      Height: =22
                                                      Text: ="Aeroporto *"
                                                      Weight: ='TextCanvas.Weight'.Bold
                                                      Width: =Parent.Width - 48
                                                      Wrap: =false
                                                      Y: =10
                                                - cmbAeroportoAvsec:
                                                    Control: ComboBox@0.0.51
                                                    MetadataKey: FieldValue
                                                    Properties:
                                                      AccessibleLabel: =Parent.DisplayName
                                                      Appearance: ='ComboboxCanvas.Appearance'.FilledLighter
                                                      BorderColor: =RGBA(229, 229, 229, 1)
                                                      BorderRadius: =0
                                                      BorderStyle: =BorderStyle.Solid
                                                      BorderThickness: =1
                                                      DefaultSelectedItems: =If(IsBlank(Parent.Default), Filter(AddColumns(colAeros, "Value", Aeroporto), Aeroporto = varAeroUser), Filter(AddColumns(colAeros, "Value", Aeroporto), Aeroporto = Parent.Default))
                                                      DisplayMode: =Parent.DisplayMode
                                                      Height: =40
                                                      InputTextPlaceholder: ="Selecione o aeroporto"
                                                      IsSearchable: =true
                                                      Items: =AddColumns(SortByColumns(Filter(colAeros, !IsBlank(Aeroporto)), "Aeroporto", SortOrder.Ascending), "Value", Aeroporto)
                                                      ValidationState: =If(IsBlank(Parent.Error), "None", "Error")
                                                      Width: =Parent.Width - 24
                                                      Y: =lblAeroportoAvsec.Y + lblAeroportoAvsec.Height + 4
                                                - errAeroportoAvsec:
                                                    Control: Text@0.0.51
                                                    MetadataKey: ErrorMessage
                                                    Properties:
                                                      Height: =30
