      - HtmlText3:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =246
            HtmlText: |
              ="<style>
                  body {
                      font-family: Arial;
                      font-size: 10px;
                      margin: 0;
                  }
                  .header {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      margin-bottom: 10px;
                      padding: 10px;
                  }
                  .title {
                      color: #6600ed;
                      font-size: 18px;
                      font-weight: bold;
                  }
                  table {
                      width: 100%;
                      border-collapse: collapse;
                      margin-bottom: 20px;
                  }
                  th, td {
                      border: 1px solid #ddd;
                      padding: 6px;
                      text-align: left;
                      vertical-align: top;
                  }
                  th {
                      background-color: #f2f2f2;
                  }
                  td {
                      font-size: 10px;
                  }
                  tr:nth-child(even) {
                      background-color: #f9f9f9;
                  }
                  .footer {
                      font-size: 10px;
                      text-align: right;
                      padding: 5px 10px;
                      border-top: 1px solid #ccc;
                  }
                  .col-protocolo {
                      width: 130px;
                      word-break: break-word;
                  }
                  .col-criado {
                      width: 100px;
                      word-break: break-word;
                  }
              </style>
              <div class='header'>
                  <div class='title'>Relatório de Perdidos e Achados</div>
              </div>
              <table>
                  <thead>
                      <tr>
                          <th class='col-protocolo'>Protocolo</th>
                          <th>Criado em</th>
                          <th>Itens</th>
                      </tr>
                  </thead>
                  <tbody>" & 
                  Concat(
                      Gallery2.AllItems As GalleryPrincipal,
                      "<tr>
                          <td class='col-protocolo'>" & GalleryPrincipal.iata & "-ANPA-" & GalleryPrincipal.ID & "</td>
                          <td class='col-criado'>" & Text(GalleryPrincipal.data, "[$-pt-BR]dd/mm/yyyy HH:mm") & "</td>
                          <td>
                              <table style='width:100%; border:1px solid #ccc; border-collapse: collapse;'>
                                  <thead>
                                      <tr style='font-size: 10px;'>
                                          <th style='background-color:#f2f2f2;'>Categoria</th>
                                          <th style='background-color:#f2f2f2;'>Subcategoria</th>
                                          <th style='background-color:#f2f2f2;'>Descrição</th>
                                          <th style='background-color:#f2f2f2;'>Status</th>
                                      </tr>
                                  </thead>
                                  <tbody>" & 
                                      Concat(
                                          Sort(
                  Filter(
                      Sort(
                          col_itensPAconsulta,
                          ID,
                          SortOrder.Descending
                      ),
                      ID_fk = GalleryPrincipal.ID
                  ),
                  ID,
                  SortOrder.Descending
              )As TBL_ITENS,
                                          "<tr>
                                              <td>" & TBL_ITENS.categoria & "</td>
                                              <td>" & TBL_ITENS.subCategoria & "</td>
                                              <td>" & TBL_ITENS.descricao & "</td>
                                              <td>" &
                                                  If(
                                                      TBL_ITENS.status <> "Recebido",
                                                      "<span style='color:#FFA500'>" & TBL_ITENS.status & "</span>",
                                                      TBL_ITENS.status
                                                  ) &
                                              "</td>
                                          </tr>"
                                      ) &
                                  "</tbody>
                              </table>
                          </td>
                      </tr>"
                  ) &
              "</tbody></table>
              <div class='footer'>Gerado em: " & Text(Now(), "[$-pt-BR]dd/mm/yyyy HH:mm") & "</div>"
            Size: =10
            Visible: =false
            Width: =337
            X: =1565
            Y: =790
