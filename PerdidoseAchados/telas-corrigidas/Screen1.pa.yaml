Screens:
  Screen1:
    Properties:
      OnVisible: =Set(varUltimaAtividade, Now())
    Children:
      - Gallery3:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneTextVariant_ver5.0
          Properties:
            Height: =989
            Items: |
              =Filter(
                  Sort(
                      '11-tbl_AchadosPerdidos',
                      ID,
                      SortOrder.Descending
                  ),
                  Categoria = "Documentos" && Modulo_id = Blank()
              )
            TemplateSize: =50
            Width: =1682
            Y: =90
          Children:
            - RowContainerDoc:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(0, 0, 0, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Height: =Parent.TemplateHeight
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  Width: =Parent.TemplateWidth
                Children:
                  - LinhaDoc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 0, 0, 0)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =0
                        PaddingRight: =12
                      Children:
                        - Rectangle2:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =thmPrimaria
                              OnSelect: =Select(Gallery3)
                              Visible: =ThisItem.IsSelected
                              AlignInContainer: =AlignInContainer.Stretch
                              FillPortions: =0
                              Width: =4
                        - Title4:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =thmTexto
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Gallery3)
                              PaddingBottom: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =ThisItem.ID &" - "&ThisItem.Categoria&" - "&ThisItem.SubCategoria&" - "&ThisItem.Modulo_id
                              VerticalAlign: =VerticalAlign.Top
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Width: =777
                              PaddingLeft: =12
                        - Image6:
                            Control: Image@2.2.3
                            Properties:
                              Image: =ThisItem.ImgIdent.Small
                              OnSelect: =Select(Gallery3)
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Width: =62
                              Height: =42
                        - EspacoDoc1:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =RGBA(0, 0, 0, 0)
                              OnSelect: =Select(Gallery3)
                              FillPortions: =0
                              Width: =193
                        - ButtonCanvas9_3:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =thmVermelho
                              Icon: ="Delete"
                              OnSelect: |-
                                =Patch(
                                    '11-tbl_AchadosPerdidos',
                                    LookUp(
                                        '11-tbl_AchadosPerdidos',
                                        ID = ThisItem.ID
                                    ),
                                    {
                                        ImgIdent: Blank(),
                                        Modulo_id: 1
                                    }
                                )
                              Text: =
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Width: =40
                              Height: =40
                        - EspacoDoc2:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =RGBA(0, 0, 0, 0)
                              OnSelect: =Select(Gallery3)
                              FillPortions: =0
                              Width: =107
                        - ButtonCanvas9_4:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =thmVermelho
                              Icon: ="ArrowClockwise"
                              OnSelect: |-
                                =Patch(
                                    '11-tbl_AchadosPerdidos',
                                    LookUp(
                                        '11-tbl_AchadosPerdidos',
                                        ID = ThisItem.ID
                                    ),
                                    {Modulo_id: 1}
                                )
                              Text: =
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Width: =40
                              Height: =40
                        - EspacoDoc3:
                            Control: Rectangle@2.3.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =RGBA(0, 0, 0, 0)
                              OnSelect: =Select(Gallery3)
                              FillPortions: =1
                        - NextArrow2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              Color: =thmTextoFraco
                              Icon: =Icon.ChevronRight
                              OnSelect: =Select(Gallery3)
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              Tooltip: ="Exibir detalhes do item"
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =0
                              Width: =50
                              Height: =42
                  - Separator6:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        OnSelect: =Select(Gallery3)
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =0
                        Height: =8
      - ButtonCanvas9:
          Control: Button@0.0.45
          Properties:
            BasePaletteColor: =thmVermelho
            Icon: ="Delete"
            OnSelect: |-
              =ForAll(
                  Sequence(Value(TextInput1.Text)),
                  Patch(
                      '11-tbl_AchadosPerdidos',
                      First(
                          Filter(
                              Sort(
                                  '11-tbl_AchadosPerdidos',
                                  ID,
                                  SortOrder.Descending
                              ),
                              Categoria = "Documentos" && Modulo_id = Blank()
                          )
                      ),
                      {
                          ImgIdent: Blank(),
                          Modulo_id: 1
                      }
                  )
              )
            Text: =
            X: =779
            Y: =28
      - TextCanvas3:
          Control: Text@0.0.51
          Properties:
            Align: ='TextCanvas.Align'.Center
            Height: =62
            Size: =30
            Text: =Gallery3.AllItemsCount
            Weight: ='TextCanvas.Weight'.Bold
            Width: =339
            X: =1187
            Y: =13
      - ButtonCanvas9_2:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            BasePaletteColor: =thmPrimaria
            Icon: ="ArrowClockwise"
            OnSelect: =Refresh('11-tbl_AchadosPerdidos')
            Text: =
            X: =512
            Y: =28
      - TextInput1:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =
            Format: =TextFormat.Number
            Height: =35
            Width: =82
            X: =652
            Y: =26
      - Timer2_8:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            OnTimerEnd: |+
              =
              If(
                  varSessaoAtiva &&
                  (
                      DateDiff(varUltimaAtividade, Now(), TimeUnit.Minutes) >= 15
                      || varForcarExpiracao
                  ),
                  Set(varSessaoAtiva, false);
                  Set(varForcarExpiracao, false);
                  Navigate(scrSessaoExpirada, ScreenTransition.Fade)
              )

            Repeat: =true
            Visible: =false
            X: =20
            Y: =80
