                              # ================================ TELA DA ESCALA
                              - htmEscalaGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Tela da escala" & varEstGuia.fim &
                                      varEstGuia.sub & "aberta pelo botão ESCALA do mês" & varEstGuia.fim &
                                      varEstGuia.serve & "Responde: <b>os turnos cadastrados põem, em cada hora de cada dia, pelo menos a quantidade que a malha exige? " &
                                      "Se não, é preciso remanejar ou contratar?</b>" & varEstGuia.fim &
                                      varEstGuia.p & "O exigido vem pronto da tela do mês, com as premissas que estavam lá. Mudou uma premissa? Volte ao mês, toque em RECALCULAR " &
                                      "e abra a escala de novo. A tela tem duas abas: " & varEstGuia.bt & "ANÁLISE" & varEstGuia.btf & " e " & varEstGuia.bt & "TURNOS" & varEstGuia.btf & "." & varEstGuia.fim &
                                      varEstGuia.h3 & "O VEREDITO" & varEstGuia.fim &
                                      varEstGuia.p & "Um cartão para APACs e um para supervisores, com uma de três respostas:" & varEstGuia.fim &
                                      "<table style='border-collapse:separate;border-spacing:0 6px;font-size:13px;max-width:980px;width:100%;'>" &
                                      "<tr><td style='width:240px;padding:10px 14px;background:#DCFCE7;color:" & hxVerde & ";font-size:18px;font-weight:800;'>COBRE O MÊS</td>" &
                                      "<td style='padding:10px 14px;background:#DCFCE7;line-height:1.5;'>Nenhuma hora de nenhum dia fica abaixo do exigido.</td></tr>" &
                                      "<tr><td style='width:240px;padding:10px 14px;background:#FDE68A;color:" & hxAmbar & ";font-size:18px;font-weight:800;'>REPOSICIONAR TURNOS</td>" &
                                      "<td style='padding:10px 14px;background:#FDE68A;line-height:1.5;'>Falta gente em algumas horas, mas o total em escala já alcança o mínimo do mês. Mudar os horários dos turnos resolve.</td></tr>" &
                                      "<tr><td style='width:240px;padding:10px 14px;background:" & hxVermelhoSuave & ";color:" & hxVermelho & ";font-size:18px;font-weight:800;'>CONTRATAR n</td>" &
                                      "<td style='padding:10px 14px;background:" & hxVermelhoSuave & ";line-height:1.5;'>Falta gente, e o total em escala está abaixo do mínimo. Nenhum rearranjo resolve; n é quanto falta até o mínimo.</td></tr>" &
                                      "</table>" &
                                      varEstGuia.nota & "Cada cartão mostra ainda quantas pessoas estão em escala por dia, o mínimo do mês, quantos dias têm falta e o quadro com folguistas." & varEstGuia.fim &
                                      varEstGuia.h3 & "HORA A HORA" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Exigido" & varEstGuia.mid & "O pior dia do mês naquela hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Escalado" & varEstGuia.mid & "Quantas pessoas os turnos põem trabalhando naquela hora, já sem quem está no intervalo." & varEstGuia.trf &
                                      varEstGuia.tr & "Saldo" & varEstGuia.mid & "Escalado − exigido. Positivo sobra, negativo falta, com as mesmas três cores do veredito." & varEstGuia.trf &
                                      varEstGuia.tr & "Dias com falta" & varEstGuia.mid & "Em quantos dias do mês aquela hora fica abaixo do exigido." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "A RÉGUA DOS TURNOS" & varEstGuia.fim &
                                      varEstGuia.p & "Cada linha é um turno cadastrado, pintado nas horas em que conta. <b>QTD</b> é quantas pessoas trabalham nele." & varEstGuia.fim &
                                      varEstGuia.amostra & varEstGuia.rotAmostra & "TRECHO DA RÉGUA" & varEstGuia.fim &
                                      varEstGuia.grade &
                                      "<tr>" & varEstGuia.thr & "TURNO" & varEstGuia.td & varEstGuia.th & "QTD" & varEstGuia.td & varEstGuia.th & "02" & varEstGuia.td & varEstGuia.th & "03" & varEstGuia.td &
                                      varEstGuia.th & "04" & varEstGuia.td & varEstGuia.th & "05" & varEstGuia.td & varEstGuia.th & "06" & varEstGuia.td & varEstGuia.th & "07" & varEstGuia.td &
                                      varEstGuia.th & "08" & varEstGuia.td & varEstGuia.th & "09" & varEstGuia.td & varEstGuia.th & "10" & varEstGuia.td & varEstGuia.th & "11" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "APAC 22h–06h (intervalo 03h)" & varEstGuia.td & varEstGuia.ce & "2" & varEstGuia.td &
                                      varEstGuia.tur & varEstGuia.td & varEstGuia.tint & "int" & varEstGuia.td & varEstGuia.tur & varEstGuia.td & varEstGuia.tur & varEstGuia.td &
                                      varEstGuia.tvaz & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td &
                                      varEstGuia.tvaz & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "APAC 03h–11h (intervalo 07h)" & varEstGuia.td & varEstGuia.ce & "4" & varEstGuia.td &
                                      varEstGuia.tvaz & varEstGuia.td & varEstGuia.tur & varEstGuia.td & varEstGuia.tur & varEstGuia.td & varEstGuia.tur & varEstGuia.td &
                                      varEstGuia.tur & varEstGuia.td & varEstGuia.tint & "int" & varEstGuia.td & varEstGuia.tur & varEstGuia.td & varEstGuia.tur & varEstGuia.td &
                                      varEstGuia.tur & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "Supervisor 03h–11h (intervalo 07h)" & varEstGuia.td & varEstGuia.ce & "1" & varEstGuia.td &
                                      varEstGuia.tvaz & varEstGuia.td & varEstGuia.tsup & varEstGuia.td & varEstGuia.tsup & varEstGuia.td & varEstGuia.tsup & varEstGuia.td &
                                      varEstGuia.tsup & varEstGuia.td & varEstGuia.tint & "int" & varEstGuia.td & varEstGuia.tsup & varEstGuia.td & varEstGuia.tsup & varEstGuia.td &
                                      varEstGuia.tsup & varEstGuia.td & varEstGuia.tvaz & varEstGuia.td & "</tr>" &
                                      varEstGuia.tabf &
                                      "<div style='font-size:12px;color:" & hxTextoFraco & ";margin-top:10px;line-height:2;'>" &
                                      varEstGuia.sw & hxCarga2 & varEstGuia.swf & "APAC trabalhando" &
                                      varEstGuia.sw & hxCarga3 & varEstGuia.swf & "supervisor trabalhando" &
                                      varEstGuia.sw & hxAmbarSuave & varEstGuia.swf & "<b>int</b> = hora de intervalo" &
                                      "</div>" & varEstGuia.fim &
                                      varEstGuia.aviso & "<b>O que é int.</b> É a hora de <b>intervalo</b> do turno: a pausa de 1 hora dentro das 8 horas de presença. " &
                                      "Nessa hora a pessoa está no turno, mas não está trabalhando, então <b>não conta</b> no escalado. No exemplo, os 2 APACs das 22h às 06h " &
                                      "param às 03h: contam às 02h e às 04h, mas não às 03h. Na tela, parar o mouse sobre a célula mostra essa explicação." & varEstGuia.fim &
                                      varEstGuia.p & "Um turno conta numa hora só quando a <b>hora inteira</b> está dentro dele: o turno das 22h às 06h conta das 22h às 05h. " &
                                      "As duas últimas linhas da régua somam o escalado de APACs e de supervisores em cada hora." & varEstGuia.fim &
                                      varEstGuia.h3 & "DIA A DIA" & varEstGuia.fim &
                                      varEstGuia.p & "Cada célula é <b>exigido/escalado</b> naquela hora daquele dia. O botão do olho troca entre APACs e supervisores." & varEstGuia.fim &
                                      varEstGuia.amostra & varEstGuia.rotAmostra & "COMO LER AS CÉLULAS" & varEstGuia.fim &
                                      varEstGuia.grade &
                                      "<tr>" & varEstGuia.thr & "SITUAÇÃO DO MÊS" & varEstGuia.td & varEstGuia.th & "18" & varEstGuia.td & varEstGuia.th & "19" & varEstGuia.td & varEstGuia.th & "20" & varEstGuia.td & varEstGuia.thr & "HORAS" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "cobre" & varEstGuia.td & varEstGuia.ok & "14/14" & varEstGuia.td & varEstGuia.ok & "14/16" & varEstGuia.td & varEstGuia.ok & "11/13" & varEstGuia.td & varEstGuia.ok & "ok" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "remanejar" & varEstGuia.td & varEstGuia.ok & "14/14" & varEstGuia.td & varEstGuia.rem & "14/11" & varEstGuia.td & varEstGuia.rem & "14/11" & varEstGuia.td & varEstGuia.rem & "2" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "contratar" & varEstGuia.td & varEstGuia.ok & "14/14" & varEstGuia.td & varEstGuia.fal & "14/10" & varEstGuia.td & varEstGuia.fal & "14/9" & varEstGuia.td & varEstGuia.fal & "2" & varEstGuia.td & "</tr>" &
                                      varEstGuia.tabf &
                                      "<div style='font-size:12px;color:" & hxTextoFraco & ";margin-top:10px;line-height:2;'>" &
                                      varEstGuia.sw & "#DCFCE7" & varEstGuia.swf & "tem o exigido ou mais" &
                                      varEstGuia.sw & "#FDE68A" & varEstGuia.swf & "falta, mas remanejando cobre" &
                                      varEstGuia.sw & hxVermelho & varEstGuia.swf & "falta, só contratando" &
                                      "</div>" & varEstGuia.fim &
                                      varEstGuia.p & "<b>14/11</b> quer dizer que a malha pede 14 e a escala põe 11: faltam 3. <b>HORAS</b> é quantas horas daquele dia ficam abaixo do exigido." & varEstGuia.fim &
                                      varEstGuia.aviso & "<b>Por que as faltas de um mês são todas amarelas ou todas vermelhas.</b> A escala é uma só para todos os dias do mês, " &
                                      "então a decisão entre remanejar e contratar vale para o mês inteiro. Se o total em escala alcança o mínimo do mês, existe uma arrumação " &
                                      "de turnos que cobre tudo: amarelo. Se não alcança, nenhuma arrumação cobre: vermelho." & varEstGuia.fim &
                                      varEstGuia.h3 & "A ABA TURNOS" & varEstGuia.fim &
                                      varEstGuia.p & "À esquerda, a lista dos turnos do mês; tocar num turno abre o formulário para corrigir. À direita, o formulário." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Quem trabalha" & varEstGuia.mid & "APAC ou supervisor." & varEstGuia.trf &
                                      varEstGuia.tr & "Começa às" & varEstGuia.mid & "Hora cheia de início." & varEstGuia.trf &
                                      varEstGuia.tr & "Presença" & varEstGuia.mid & "Horas no turno, contando o intervalo. O padrão é 8h." & varEstGuia.trf &
                                      varEstGuia.tr & "Intervalo começa às" & varEstGuia.mid & "Hora da pausa. Tem de cair dentro do turno, ou o app recusa. Escolha <b>sem intervalo</b> quando não há pausa." & varEstGuia.trf &
                                      varEstGuia.tr & "Duração do intervalo" & varEstGuia.mid & "Em minutos. O padrão é 60." & varEstGuia.trf &
                                      varEstGuia.tr & "Quantas pessoas" & varEstGuia.mid & "Quantas pessoas fazem exatamente esse turno." & varEstGuia.trf &
                                      varEstGuia.tr & "Nome do turno" & varEstGuia.mid & "Opcional; em branco, o app monta, como APAC 03h–11h (intervalo 07h)." & varEstGuia.trf &
                                      varEstGuia.tr & "Ativo" & varEstGuia.mid & "Turno não se apaga: desligue para ele sair da conta." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.nota & "Turno que atravessa a meia-noite é um cadastro só: começa às 22:00 com 8h e termina às 06:00. Cada mês tem a sua escala; " &
                                      "para carregar muitos turnos de uma vez, cole o arquivo da escala na lista tb_apacEscala em Editar no modo de grade." & varEstGuia.fim &
                                      "</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Visible: =varSecGuia = "ESCALA"
                              # ================================ CADASTROS
                              - htmCadGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Cadastros" & varEstGuia.fim &
                                      varEstGuia.sub & "aberta pelo botão CADASTROS do mês" & varEstGuia.fim &
                                      varEstGuia.serve & "Responde: <b>com que premissas o app calcula, desde quando, e quais postos existem independentemente dos voos.</b>" & varEstGuia.fim &
                                      varEstGuia.h3 & "ABA PREMISSAS" & varEstGuia.fim &
                                      varEstGuia.p & "Cada linha da lista é uma <b>vigência</b>: um conjunto de premissas que vale a partir de uma data. O cálculo usa a vigência ativa mais recente." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "EM VIGOR" & varEstGuia.mid & "A vigência que o cálculo está usando agora." & varEstGuia.trf &
                                      varEstGuia.tr & "INATIVA" & varEstGuia.mid & "Desligada. Fica na lista para explicar números antigos." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "NOVA VIGÊNCIA" & varEstGuia.btf & varEstGuia.mid & "Abre o formulário preenchido com a vigência em vigor. Mude o que mudou e informe a data." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "SALVAR" & varEstGuia.btf & varEstGuia.mid & "Grava. O app recusa duas vigências na mesma data." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.p & "Por que não se sobrescreve: o dimensionamento vira número de contrato. Daqui a meses alguém vai perguntar com que premissa aquele " &
                                      "número foi feito, e a resposta tem de estar gravada." & varEstGuia.fim &
                                      varEstGuia.h3 & "ABA POSTOS FIXOS" & varEstGuia.fim &
                                      varEstGuia.p & "Postos que precisam de gente independentemente da malha, como Acesso C (3), Portão Principal (1) e Apoio (1). O app soma a quantidade " &
                                      "em cada hora cheia entre <b>DAS</b> e <b>ATÉ</b>, por cima dos módulos." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Posto" & varEstGuia.mid & "Nome do posto." & varEstGuia.trf &
                                      varEstGuia.tr & "Quem ocupa" & varEstGuia.mid & "APAC ou supervisor." & varEstGuia.trf &
                                      varEstGuia.tr & "Das · Até" & varEstGuia.mid & "Faixa de horário em horas cheias. Posto que atravessa a meia-noite vira dois cadastros: 22:00 às 24:00 e 00:00 às 06:00." & varEstGuia.trf &
                                      varEstGuia.tr & "Quantidade" & varEstGuia.mid & "Pessoas no posto ao mesmo tempo." & varEstGuia.trf &
                                      varEstGuia.tr & "Ativo" & varEstGuia.mid & "Desligar tira o posto de todas as contas." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.aviso & "Os postos fixos pesam muito no resultado. Em outubro, com os 5 APACs de posto fixo por hora, a escala do escopo pede contratar 4; " &
                                      "sem eles, cobre o mês com folga." & varEstGuia.fim &
                                      "</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Visible: =varSecGuia = "CADASTROS"
                              # ================================ IMPORTAR MALHA
                              - htmImpGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Importar malha" & varEstGuia.fim &
                                      varEstGuia.sub & "aberta pelo botão IMPORTAR MALHA do mês" & varEstGuia.fim &
                                      varEstGuia.serve & "Responde: <b>a malha que o app está usando é a do arquivo mais recente?</b>" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "1. O que importar" & varEstGuia.mid & "<b>TODAS</b> grava todas as competências do arquivo, a temporada inteira (cerca de 3.800 voos). Escolher um mês grava só aquele mês e não toca nos outros." & varEstGuia.trf &
                                      varEstGuia.tr & "2. Anexar" & varEstGuia.mid & "O export de DECOLAGENS do Power BI (.xlsx)." & varEstGuia.trf &
                                      varEstGuia.tr & "3. Importar" & varEstGuia.mid & "A barra mostra o andamento. A malha anterior das mesmas competências é apagada e a nova é gravada; reimportar o mesmo arquivo não duplica." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "SITUAÇÕES" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "PRONTO" & varEstGuia.mid & "Arquivo enviado, esperando o processamento (até um minuto)." & varEstGuia.trf &
                                      varEstGuia.tr & "PROCESSANDO" & varEstGuia.mid & "Lendo e gravando." & varEstGuia.trf &
                                      varEstGuia.tr & "CONCLUIDO" & varEstGuia.mid & "Terminou. Confira <b>gravados / lidos</b>: os dois números devem ser iguais." & varEstGuia.trf &
                                      varEstGuia.tr & "ERRO" & varEstGuia.mid & "Parou. A mensagem diz o motivo." & varEstGuia.trf &
                                      varEstGuia.tr & "Histórico" & varEstGuia.mid & "As importações anteriores: o que foi importado, situação, gravados/lidos e o arquivo." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.nota & "O arquivo precisa ter as colunas Horário, Data, Voo e Assentos, achadas pelo nome, em qualquer ordem. Linha sem data ou horário " &
                                      "de verdade é ignorada; é assim que o rodapé de filtros do Power BI fica de fora." & varEstGuia.fim &
                                      "</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Visible: =varSecGuia = "IMPORTAR"
                              # ================================ PALAVRAS DO APP
                              - htmTermosGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Palavras do app" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "APAC" & varEstGuia.mid & "Agente de Proteção da Aviação Civil." & varEstGuia.trf &
                                      varEstGuia.tr & "Módulo" & varEstGuia.mid & "Um canal de inspeção de passageiros com raio-X, operado por 3 APACs." & varEstGuia.trf &
                                      varEstGuia.tr & "Competência" & varEstGuia.mid & "O mês de referência, escrito AAAA-MM (2026-10 = outubro de 2026)." & varEstGuia.trf &
                                      varEstGuia.tr & "Malha" & varEstGuia.mid & "As decolagens planejadas do aeroporto, com assentos ofertados." & varEstGuia.trf &
                                      varEstGuia.tr & "Volumetria" & varEstGuia.mid & "Passageiros passando pela inspeção numa hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Antecedência" & varEstGuia.mid & "Quanto tempo antes da decolagem o passageiro é inspecionado." & varEstGuia.trf &
                                      varEstGuia.tr & "Exigido" & varEstGuia.mid & "Quantas pessoas a malha pede numa hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Escalado" & varEstGuia.mid & "Quantas pessoas os turnos põem trabalhando numa hora, sem quem está em intervalo." & varEstGuia.trf &
                                      varEstGuia.tr & "Mínimo do mês" & varEstGuia.mid & "O menor quadro diário, com turnos de 8h e 1h de intervalo, que cobre o pior dia de cada hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Folguista" & varEstGuia.mid & "Quem cobre as folgas da escala 6x2; 1 para cada 3 em escala." & varEstGuia.trf &
                                      varEstGuia.tr & "No quadro" & varEstGuia.mid & "Em escala + folguistas; o número de contrato." & varEstGuia.trf &
                                      varEstGuia.tr & "int" & varEstGuia.mid & "Hora de intervalo de um turno, na régua da escala. Não conta como gente trabalhando." & varEstGuia.trf &
                                      varEstGuia.tr & "Vigência" & varEstGuia.mid & "Conjunto de premissas que vale a partir de uma data." & varEstGuia.trf &
                                      varEstGuia.tr & "Posto fixo" & varEstGuia.mid & "Posto que precisa de gente independentemente dos voos." & varEstGuia.trf &
                                      varEstGuia.tr & "Estouro" & varEstGuia.mid & "Hora que pede mais módulos do que há raios-X." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "O QUE FICA DE FORA DE TODAS AS CONTAS" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Vigilância" & varEstGuia.mid & "Não é o foco deste app. Turnos de vigilância não entram em nenhuma conta, nem aparecem." & varEstGuia.trf &
                                      varEstGuia.tr & "Ausências" & varEstGuia.mid & "Férias, afastamentos, absenteísmo e treinamento. O no quadro é o mínimo sem essas perdas." & varEstGuia.trf &
                                      varEstGuia.tr & "Outras funções" & varEstGuia.mid & "Técnico de segurança, administrativo e preposto." & varEstGuia.trf &
                                      varEstGuia.tr & "Realizado" & varEstGuia.mid & "O app trabalha com a malha planejada, não com os voos que de fato aconteceram." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      "</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Visible: =varSecGuia = "TERMOS"
