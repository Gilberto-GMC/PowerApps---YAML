Screens:
  scrApacGuia:
    Properties:
      Fill: =thmFundo
      OnVisible: |-
        =Set(varSecGuia, Coalesce(varSecGuia, "COMECAR"));
        Set(
            varEstGuia,
            {
                tit: "<div style='font-size:24px;font-weight:800;line-height:1.15;color:" & hxTexto & ";margin:0 0 2px 0;'>",
                sub: "<div style='font-size:11px;color:" & hxTextoFraco & ";font-family:Consolas,monospace;margin:0 0 10px 0;'>",
                serve: "<div style='font-size:15px;line-height:1.55;margin:6px 0 14px 0;max-width:920px;color:" & hxTexto & ";'>",
                h3: "<div style='font-size:12px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";margin:22px 0 6px 0;'>",
                p: "<div style='font-size:13px;line-height:1.6;margin:0 0 8px 0;max-width:920px;color:" & hxTexto & ";'>",
                nota: "<div style='font-size:12px;line-height:1.5;margin:6px 0 8px 0;max-width:920px;color:" & hxTextoFraco & ";'>",
                aviso: "<div style='font-size:13px;line-height:1.55;margin:14px 0;padding:10px 14px;max-width:900px;background:" & hxPrimariaClara & ";border-left:3px solid " & hxPrimaria & ";color:" & hxTexto & ";'>",
                fim: "</div>",
                tab: "<table style='border-collapse:collapse;font-size:13px;max-width:980px;width:100%;'>",
                tr: "<tr><td style='padding:6px 18px 6px 0;vertical-align:top;font-weight:700;white-space:nowrap;width:220px;border-bottom:1px solid " & hxGradeFina & ";color:" & hxTexto & ";'>",
                mid: "</td><td style='padding:6px 0;vertical-align:top;line-height:1.5;border-bottom:1px solid " & hxGradeFina & ";color:" & hxTexto & ";'>",
                trf: "</td></tr>",
                tabf: "</table>",
                amostra: "<div style='margin:12px 0 6px 0;padding:12px 14px;border:1px solid " & hxBorda & ";background:" & hxSuperficie & ";display:inline-block;'>",
                rotAmostra: "<div style='font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco & ";margin:0 0 8px 0;'>",
                grade: "<table style='border-collapse:collapse;font-size:12px;font-family:Consolas,monospace;'>",
                th: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxPrimariaClara & ";font-weight:700;'>",
                thr: "<td style='border:1px solid " & hxGradeFina & ";text-align:left;padding:4px 10px;background:" & hxPrimariaClara & ";font-weight:700;white-space:nowrap;font-family:Segoe UI,Arial,sans-serif;'>",
                cr: "<td style='border:1px solid " & hxGradeFina & ";text-align:left;padding:4px 10px;font-weight:600;white-space:nowrap;font-family:Segoe UI,Arial,sans-serif;'>",
                ce: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;'>",
                c0: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxCarga0 & ";'>",
                c1: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxCarga1 & ";'>",
                c2: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxCarga2 & ";color:#FFFFFF;'>",
                c3: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxCarga3 & ";color:#FFFFFF;'>",
                cp: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:46px;background:" & hxPrimariaClara & ";font-weight:800;'>",
                ok: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:52px;background:#DCFCE7;color:" & hxVerde & ";font-weight:700;'>",
                rem: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:52px;background:#FDE68A;color:" & hxAmbar & ";font-weight:700;'>",
                fal: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:52px;background:" & hxVermelho & ";color:#FFFFFF;font-weight:700;'>",
                tur: "<td style='border:1px solid " & hxGradeFina & ";padding:4px 0;width:40px;background:" & hxCarga2 & ";'>",
                tsup: "<td style='border:1px solid " & hxGradeFina & ";padding:4px 0;width:40px;background:" & hxCarga3 & ";'>",
                tint: "<td style='border:1px solid " & hxGradeFina & ";text-align:center;padding:4px 0;width:40px;background:" & hxAmbarSuave & ";color:" & hxAmbar & ";font-weight:700;'>",
                tvaz: "<td style='border:1px solid " & hxGradeFina & ";padding:4px 0;width:40px;'>",
                td: "</td>",
                sw: "<span style='display:inline-block;width:20px;height:12px;vertical-align:middle;margin:0 6px 0 16px;border:1px solid " & hxGradeFina & ";background:",
                swf: ";'></span>",
                bt: "<span style='font-size:11px;font-weight:700;letter-spacing:.5px;border:1px solid " & hxBorda & ";background:" & hxSuperficie & ";padding:1px 7px;white-space:nowrap;'>",
                btf: "</span>"
            }
        )
    Children:
      # O guia é o mesmo texto do guia_das_telas.html, em HTML de estilo inline: o HtmlViewer não aceita
      # bloco <style>. Os pedaços de estilo que se repetem ficam em varEstGuia, montada no OnVisible, para
      # cada seção não repetir as mesmas strings dezenas de vezes.
      # Quem chama: botão COMO LER das telas do mês, do dia, da escala, de cadastros e de importação, que
      # grava varOrigemGuia (para o VOLTAR) e varSecGuia (para abrir na seção daquela tela).
      - cntRaizGuia:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntColunaGuia:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  # ------------------------------------------------ barra
                  - cntBarraGuia:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        PaddingBottom: =0
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - htmMarcaGuia:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmTransparente
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL · " &
                                varAero & "</div>" &
                                "<div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>APACs POR MÓDULOS — COMO LER AS TELAS</div>" &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        # Volta para a tela que chamou. Navigate com tela em variável não tem precedente, e Back()
                        # também não — por isso um If com cada origem.
                        - btnVoltarGuia:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =thmAlturaCampo
                              OnSelect: |-
                                =If(
                                    varOrigemGuia = "DIA", Navigate(scrApacDia, ScreenTransition.Fade),
                                    varOrigemGuia = "ESCALA", Navigate(scrApacEscala, ScreenTransition.Fade),
                                    varOrigemGuia = "CADASTROS", Navigate(scrApacCadastro, ScreenTransition.Fade),
                                    varOrigemGuia = "IMPORTAR", Navigate(scrApacImport, ScreenTransition.Fade),
                                    Navigate(scrApacMes, ScreenTransition.Fade)
                                )
                              Text: |-
                                ="◀ VOLTAR" & If(
                                    varOrigemGuia = "DIA", " AO DIA",
                                    varOrigemGuia = "ESCALA", " À ESCALA",
                                    varOrigemGuia = "CADASTROS", " AOS CADASTROS",
                                    varOrigemGuia = "IMPORTAR", " À IMPORTAÇÃO",
                                    " AO MÊS"
                                )
                              Width: =220
                  # ------------------------------------------------ corpo
                  - cntCorpoGuia:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        # ---------------------------------------- seções
                        - cntSecoesGuia:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =14
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =14
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - btnSecComecarGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "COMECAR", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "COMECAR")
                                    PaddingLeft: =12
                                    Text: ="POR ONDE COMEÇAR"
                              - btnSecMesGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "MES", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "MES")
                                    PaddingLeft: =12
                                    Text: ="TELA DO MÊS"
                              - btnSecDiaGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "DIA", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "DIA")
                                    PaddingLeft: =12
                                    Text: ="TELA DO DIA"
                              - btnSecEscalaGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "ESCALA", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "ESCALA")
                                    PaddingLeft: =12
                                    Text: ="TELA DA ESCALA"
                              - btnSecCadGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "CADASTROS", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "CADASTROS")
                                    PaddingLeft: =12
                                    Text: ="CADASTROS"
                              - btnSecImpGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "IMPORTAR", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "IMPORTAR")
                                    PaddingLeft: =12
                                    Text: ="IMPORTAR MALHA"
                              - btnSecTermosGuia:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =If(varSecGuia = "TERMOS", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                    Height: =thmAlturaCampo
                                    OnSelect: =Set(varSecGuia, "TERMOS")
                                    PaddingLeft: =12
                                    Text: ="PALAVRAS DO APP"
                        # ---------------------------------------- conteúdo
                        - cntTextoGuia:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =24
                              PaddingLeft: =28
                              PaddingRight: =28
                              PaddingTop: =20
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              # ================================ POR ONDE COMEÇAR
                              - htmComecarGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Por onde começar" & varEstGuia.fim &
                                      varEstGuia.serve & "O app transforma a malha de decolagens em quantos agentes de proteção (APACs) e supervisores precisam estar " &
                                      "trabalhando em cada hora, e confere se a escala entrega isso. As telas dependem umas das outras nesta ordem. " &
                                      "Pular um passo não dá erro: dá número vazio ou aviso âmbar." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "1. Importar a malha" & varEstGuia.mid & "Do mês ou da temporada. Sem malha, nenhuma tela tem o que calcular." & varEstGuia.trf &
                                      varEstGuia.tr & "2. Conferir os cadastros" & varEstGuia.mid & "As premissas do cálculo e os postos fixos." & varEstGuia.trf &
                                      varEstGuia.tr & "3. Abrir o mês" & varEstGuia.mid & "Para ver o que a malha exige, hora a hora, e o efetivo mínimo." & varEstGuia.trf &
                                      varEstGuia.tr & "4. Abrir o dia" & varEstGuia.mid & "Quando precisar entender por que uma hora pediu o que pediu." & varEstGuia.trf &
                                      varEstGuia.tr & "5. Abrir a escala" & varEstGuia.mid & "Para ver se os turnos cadastrados cobrem o mês, e o que fazer se não cobrem." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.aviso & "Os números de exemplo deste guia são de <b>outubro de 2026 em Navegantes</b>, com as premissas em vigor: " &
                                      "185 passageiros por hora por módulo, 85% de ocupação, 90 minutos de antecedência, corte de 150 assentos, 3 APACs por módulo, " &
                                      "1 supervisor a cada 2 módulos e 3 raios-X. Com outra malha ou outra premissa, os números mudam." & varEstGuia.fim &
                                      varEstGuia.nota & "Em cada tela, o botão " & varEstGuia.bt & "COMO LER" & varEstGuia.btf & " abre este guia na parte daquela tela." & varEstGuia.fim &
                                      "</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Visible: =varSecGuia = "COMECAR"
                              # ================================ TELA DO MÊS
                              - htmMesGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Tela do mês" & varEstGuia.fim &
                                      varEstGuia.sub & "a tela principal" & varEstGuia.fim &
                                      varEstGuia.serve & "Responde: <b>quantas pessoas a malha deste mês exige em cada hora de cada dia, e qual o menor quadro que dá conta disso.</b>" & varEstGuia.fim &
                                      varEstGuia.h3 & "A BARRA DO TOPO" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & varEstGuia.bt & "◀" & varEstGuia.btf & " " & varEstGuia.bt & "▶" & varEstGuia.btf & varEstGuia.mid & "Mês anterior e seguinte. Tudo abaixo é refeito para o mês escolhido." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "ABRIR O DIA DE PICO" & varEstGuia.btf & varEstGuia.mid & "Abre a tela do dia no dia de maior carga do mês, o marcado com ★." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "ESCALA" & varEstGuia.btf & varEstGuia.mid & "Compara a escala com o que este mês exige. Fica apagado enquanto o mês não tem malha." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "CADASTROS" & varEstGuia.btf & varEstGuia.mid & "Premissas e postos fixos." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "IMPORTAR MALHA" & varEstGuia.btf & varEstGuia.mid & "Envia o export de decolagens do Power BI." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "AS PREMISSAS" & varEstGuia.fim &
                                      varEstGuia.p & "Os campos logo abaixo da barra são os coeficientes do cálculo. Mudar um campo e tocar " & varEstGuia.bt & "RECALCULAR" & varEstGuia.btf &
                                      " refaz a tela inteira <b>sem gravar nada</b>. Serve para testar cenários, como <i>e se a ocupação fosse 95%?</i> " &
                                      "Para mudar de verdade, grave uma vigência nova em Cadastros." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Pax por módulo/h" & varEstGuia.mid & "Quantos passageiros um módulo de inspeção processa em uma hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Ocupação %" & varEstGuia.mid & "Que parte dos assentos ofertados vira passageiro." & varEstGuia.trf &
                                      varEstGuia.tr & "Antecedência" & varEstGuia.mid & "Quantos minutos antes da decolagem os passageiros passam pela inspeção." & varEstGuia.trf &
                                      varEstGuia.tr & "Assentos mín." & varEstGuia.mid & "Voo com <b>mais</b> assentos que isso abre módulo sozinho, pela contagem." & varEstGuia.trf &
                                      varEstGuia.tr & "APAC/módulo" & varEstGuia.mid & "Quantos APACs trabalham em cada módulo aberto." & varEstGuia.trf &
                                      varEstGuia.tr & "Raios-X" & varEstGuia.mid & "Quantos módulos existem de fato. A conta nunca passa disso." & varEstGuia.trf &
                                      varEstGuia.tr & "Botão do olho" & varEstGuia.mid & "Troca a grade entre <b>APAC</b> (pessoas) e <b>MÓDULOS</b> (canais abertos). O texto do botão diz o que está sendo mostrado." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "O QUADRO DE EFETIVO MÍNIMO" & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Em escala por dia" & varEstGuia.mid & "O menor número de pessoas trabalhando no dia que cobre todas as horas do mês, com turnos de 8 horas e 1 hora de intervalo. Em outubro: 36 APACs e 5 supervisores." & varEstGuia.trf &
                                      varEstGuia.tr & "Folguistas" & varEstGuia.mid & "Quem cobre as folgas da escala 6x2: 1 para cada 3 em escala." & varEstGuia.trf &
                                      varEstGuia.tr & "No quadro" & varEstGuia.mid & "Em escala + folguistas. É o número que vai para o contrato. Em outubro: 48 APACs e 7 supervisores." & varEstGuia.trf &
                                      varEstGuia.tr & "Pico por hora" & varEstGuia.mid & "A maior quantidade exigida numa única hora do mês." & varEstGuia.trf &
                                      varEstGuia.tr & "Homem-hora no dia" & varEstGuia.mid & "A soma do exigido nas 24 horas. Dividida pelas 7 horas trabalhadas de cada turno, dá um piso para o quadro." & varEstGuia.trf &
                                      varEstGuia.tr & "Linha EXIGIDO" & varEstGuia.mid & "Para cada hora, o dia mais pesado do mês. É contra essa linha que o mínimo é calculado; as horas destacadas são as de pico." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.h3 & "A GRADE DIAS × HORAS" & varEstGuia.fim &
                                      varEstGuia.p & "Cada linha é um dia; cada coluna é uma hora cheia (a coluna 19 vai de 19:00 a 19:59). O número é quantos APACs, ou quantos módulos, a malha pede naquela hora." & varEstGuia.fim &
                                      varEstGuia.amostra & varEstGuia.rotAmostra & "TRECHO DA GRADE · APAC · OUTUBRO DE 2026" & varEstGuia.fim &
                                      varEstGuia.grade &
                                      "<tr>" & varEstGuia.thr & "DIA" & varEstGuia.td & varEstGuia.th & "03" & varEstGuia.td & varEstGuia.th & "04" & varEstGuia.td & varEstGuia.th & "05" & varEstGuia.td &
                                      varEstGuia.th & "10" & varEstGuia.td & varEstGuia.th & "11" & varEstGuia.td & varEstGuia.th & "12" & varEstGuia.td & varEstGuia.th & "19" & varEstGuia.td &
                                      varEstGuia.th & "20" & varEstGuia.td & varEstGuia.th & "21" & varEstGuia.td & varEstGuia.thr & "PICO" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "01" & varEstGuia.td & varEstGuia.c1 & "8" & varEstGuia.td & varEstGuia.c1 & "8" & varEstGuia.td & varEstGuia.c2 & "11" & varEstGuia.td &
                                      varEstGuia.c3 & "14" & varEstGuia.td & varEstGuia.c2 & "11" & varEstGuia.td & varEstGuia.c0 & "" & varEstGuia.td & varEstGuia.c3 & "14" & varEstGuia.td &
