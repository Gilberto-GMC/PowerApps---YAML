                                      "<tr>" & varEstGuia.cr & "MÓDULOS ABERTOS" & varEstGuia.td & varEstGuia.c3 & "3" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "EMBARQUE — APAC" & varEstGuia.td & varEstGuia.ce & "9" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "EMBARQUE — SUPERVISOR" & varEstGuia.td & varEstGuia.ce & "2" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "POSTOS FIXOS" & varEstGuia.td & varEstGuia.ce & "5" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.thr & "TOTAL APAC" & varEstGuia.td & varEstGuia.cp & "14" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.thr & "TOTAL SUPERVISOR" & varEstGuia.td & varEstGuia.cp & "2" & varEstGuia.td & "</tr>" &
                                      "<tr>" & varEstGuia.cr & "quem mandou" & varEstGuia.td & varEstGuia.ce & "voos" & varEstGuia.td & "</tr>" &
                                      varEstGuia.tabf & varEstGuia.fim &
                                      varEstGuia.nota & "Na tela aparecem as 24 horas lado a lado; aqui só a coluna das 20:00." & varEstGuia.fim &
                                      varEstGuia.tab &
                                      varEstGuia.tr & "Volumetria" & varEstGuia.mid & "Passageiros passando pela inspeção naquela hora (assentos × ocupação, espalhados na antecedência)." & varEstGuia.trf &
                                      varEstGuia.tr & "Módulos abertos" & varEstGuia.mid & "Quantos módulos a hora pede, com as mesmas cores do mês. Um <b>!</b> indica que pediu mais do que os raios-X existentes." & varEstGuia.trf &
                                      varEstGuia.tr & "Embarque — APAC" & varEstGuia.mid & "Módulos × APACs por módulo." & varEstGuia.trf &
                                      varEstGuia.tr & "Embarque — supervisor" & varEstGuia.mid & "1 supervisor a cada 2 módulos." & varEstGuia.trf &
                                      varEstGuia.tr & "Postos fixos" & varEstGuia.mid & "Os postos cadastrados que não dependem de voo." & varEstGuia.trf &
                                      varEstGuia.tr & "Total geral" & varEstGuia.mid & "Todo mundo que precisa estar trabalhando naquela hora." & varEstGuia.trf &
                                      varEstGuia.tr & "Quem mandou" & varEstGuia.mid & "<b>voos</b> quando a contagem de aeronaves grandes decidiu os módulos; <b>volumetria</b> quando foi a soma de passageiros." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "◀" & varEstGuia.btf & " " & varEstGuia.bt & "▶" & varEstGuia.btf & varEstGuia.mid & "Dia anterior e seguinte." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "VER O MÊS" & varEstGuia.btf & varEstGuia.mid & "Volta para a tela do mês." & varEstGuia.trf &
                                      varEstGuia.tr & varEstGuia.bt & "SALVAR PREMISSAS" & varEstGuia.btf & varEstGuia.mid & "Grava os campos de premissa desta tela como uma vigência nova." & varEstGuia.trf &
                                      varEstGuia.tabf &
                                      varEstGuia.aviso & "<b>Por que existem dois pisos.</b> Às 20:00 de 24/12 há só 171 passageiros, que pela volumetria dariam 1 módulo. " &
                                      "Mas saem 3 aeronaves com mais de 150 assentos na mesma hora, então abrem 3 módulos e o total é de 14 APACs." & varEstGuia.fim &
