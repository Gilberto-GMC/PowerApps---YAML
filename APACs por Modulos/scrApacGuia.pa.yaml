                              # ================================ TELA DO DIA
                              - htmDiaGuia:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                      varEstGuia.tit & "Tela do dia" & varEstGuia.fim &
                                      varEstGuia.sub & "aberta pelo botão ABRIR O DIA DE PICO do mês" & varEstGuia.fim &
                                      varEstGuia.serve & "Responde: <b>por que esta hora pediu o que pediu.</b> É a planilha do escopo reproduzida para um dia, hora a hora." & varEstGuia.fim &
                                      varEstGuia.amostra & varEstGuia.rotAmostra & "24/12/2026 · COLUNA DAS 20:00" & varEstGuia.fim &
                                      varEstGuia.grade &
                                      "<tr>" & varEstGuia.thr & "HORA" & varEstGuia.td & varEstGuia.th & "20" & varEstGuia.td & "</tr>" &
