                                      varEstGuia.tr & "2. Módulos" & varEstGuia.mid & "O maior de dois pisos: passageiros da hora ÷ 185, arredondado para cima, ou o número de decolagens com mais de 150 assentos dentro da hora. Nunca passa dos 3 raios-X." & varEstGuia.trf &
                                      varEstGuia.tr & "3. Pessoas" & varEstGuia.mid & "APACs = módulos × 3 + postos fixos. Supervisores = 1 a cada 2 módulos, arredondado para cima." & varEstGuia.trf &
