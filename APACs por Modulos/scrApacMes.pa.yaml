Screens:
  scrApacMes:
    Properties:
      Fill: =thmFundo
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, First(colAerosApac).Aeroporto));
        Set(varData, Coalesce(varData, Today()));
        Set(varRefMes, Coalesce(varRefMes, Date(Year(varData), Month(varData), 1)));
        Set(varComp, Text(varRefMes, "yyyy-mm"));
        Set(varVerApac, Coalesce(varVerApac, false));
        Set(
            varParam,
            First(
                Sort(
                    Filter(colParamApac, aeroporto = varAero),
                    vigencia_inicio,
                    SortOrder.Descending
                )
            )
        );
        Set(varCap, Coalesce(varCap, varParam.pax_por_modulo_hora, 185));
        Set(varOcup, Coalesce(varOcup, varParam.ocupacao_pct, 85));
        Set(varAntec, Coalesce(varAntec, varParam.antecedencia_min, 90));
        Set(varAssentosMin, Coalesce(varAssentosMin, varParam.assentos_min, 150));
        Set(varApacMod, Coalesce(varApacMod, varParam.apac_por_modulo, 3));
        Set(varModSup, Coalesce(varModSup, varParam.modulos_por_supervisor, 2));
        Set(varRaiosX, Coalesce(varRaiosX, varParam.raiosx_disponiveis, 3));
        Select(btnLerMes)
    Children:
      # ------------------------------------------------------------------ leitura
      # ⚠️ Um mês da temporada tem ~830 voos. O app PRECISA estar com o
      # "Limite de linhas de dados" em 2000 (Configurações > Geral), senão o Power Apps traz
      # 500 e a grade fica certa escondendo o fim do mês — o defeito do Mapa de 04/09/2026.
      # Nenhum termo desta consulta é não delegável: só igualdade e AND.
      - btnLerMes:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colVoosMes,
                  ForAll(
                      Filter(
                          tb_apacMalha,
                          aeroporto = varAero,
                          ativo = 1,
                          competencia = varComp
                      ) As _v,
                      {
                          voo: _v.voo,
                          empresa: _v.empresa,
                          assentos: _v.assentos,
                          hora_min: _v.hora_min,
                          dia_num: Day(_v.data)
                      }
                  )
              );
              Set(varDiasNoMes, Day(DateAdd(DateAdd(varRefMes, 1, TimeUnit.Months), -1, TimeUnit.Days)));
              Select(btnCalcMes)
            Text: ="ler"
            Visible: =false
            Width: =1
            X: =-40
            Y: =-40
      - btnCalcMes:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colFixoHoraMes,
                  ForAll(
                      Sequence(apacHorasDia, 0) As _h,
                      {
                          hora: _h.Value,
                          apac: Sum(
                              Filter(
                                  colPostosApac,
                                  aeroporto = varAero,
                                  papel = "APAC",
                                  hora_inicio <= _h.Value * 60,
                                  hora_fim >= _h.Value * 60 + 60
                              ),
                              quantidade
                          ),
                          sup: Sum(
                              Filter(
                                  colPostosApac,
                                  aeroporto = varAero,
                                  papel = "SUPERVISOR",
                                  hora_inicio <= _h.Value * 60,
                                  hora_fim >= _h.Value * 60 + 60
                              ),
                              quantidade
                          )
                      }
                  )
              );
              ClearCollect(
                  colMesCel,
                  ForAll(
                      Sequence(apacCelulasMes, 0) As _i,
                      With(
                          {
                              diaCel: Int(_i.Value / 24) + 1,
                              horaCel: Mod(_i.Value, 24)
                          },
                          With(
                              {
                                  janIni: horaCel * 60,
                                  janFim: horaCel * 60 + 60
                              },
                              With(
                                  {
                                      paxCel: Sum(
                                          Filter(colVoosMes, dia_num = diaCel Or dia_num = diaCel + 1),
                                          With(
                                              {
                                                  posic: hora_min + If(dia_num = diaCel, 0, 1440)
                                              },
                                              With(
                                                  {
                                                      corteA: Max(janIni, posic - varAntec),
                                                      corteB: Min(janFim, posic)
                                                  },
                                                  If(
                                                      corteB > corteA,
                                                      (corteB - corteA) / Max(1, varAntec) * assentos * varOcup / 100,
                                                      0
                                                  )
                                              )
                                          )
                                      ),
                                      decCel: CountRows(
                                          Filter(
                                              colVoosMes,
                                              dia_num = diaCel,
                                              assentos > varAssentosMin,
                                              hora_min >= janIni,
                                              hora_min < janFim
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          modPaxCel: With(
                                              { q: paxCel / Max(1, varCap) },
                                              Int(q) + If(q > Int(q), 1, 0)
                                          )
                                      },
                                      With(
                                          { pedidoCel: Max(modPaxCel, decCel) },
                                          {
                                              dia: diaCel,
                                              hora: horaCel,
                                              pax: paxCel,
                                              mod: Min(pedidoCel, varRaiosX),
                                              estouro: If(pedidoCel > varRaiosX, 1, 0),
                                              apac: Min(pedidoCel, varRaiosX) * varApacMod +
                                                  LookUp(colFixoHoraMes, hora = horaCel).apac,
                                              sup: With(
                                                  { s: Min(pedidoCel, varRaiosX) / Max(1, varModSup) },
                                                  Int(s) + If(s > Int(s), 1, 0)
                                              ) + LookUp(colFixoHoraMes, hora = horaCel).sup
                                          }
                                      )
                                  )
                              )
                          )
                      )
                  )
              );
              ClearCollect(
                  colMesDia,
                  ForAll(
                      Sequence(Max(1, varDiasNoMes), 1) As _d,
                      With(
                          { linha: Filter(colMesCel, dia = _d.Value) },
                          {
                              dia: _d.Value,
                              apac_pico: Max(linha, apac),
                              sup_pico: Max(linha, sup),
                              mod_pico: Max(linha, mod),
                              horas_estouro: Sum(linha, estouro),
                              carga: Sum(linha, apac)
                          }
                      )
                  )
              );
              // ------------------------------------------------ efetivo mínimo do mês
              // Envelope: a maior exigência de cada hora entre os dias do mês, já com os postos fixos.
              ClearCollect(
                  colEnvMes,
                  ForAll(
                      Sequence(apacHorasDia, 0) As _h,
                      With(
                          { linhaHora: Filter(colMesCel, hora = _h.Value, dia <= varDiasNoMes) },
                          {
                              hora: _h.Value,
                              apac: Max(linhaHora, apac),
                              sup: Max(linhaHora, sup)
                          }
                      )
                  )
              );
              // ⚠️ Mínimo = o MAIOR entre dois limites que nenhuma escala consegue furar:
              //   porCobertura — menor número de turnos de apacJornadaPresenca horas contíguas que cobre todas
              //                  as horas do envelope. Sem laço: em cada uma das 24 rotações do dia, t1..t4
              //                  guardam a maior soma de 1..4 horas espaçadas de pelo menos uma jornada; t4 na
              //                  última hora é o número de turnos da rotação, e a menor rotação é o mínimo.
              //                  Cada rotação devolve { n } e o Min lê n — Min(ForAll(...), Value) não tem
              //                  precedente validado neste repositório; ForAll que devolve registro tem.
              //                  Quatro níveis bastam para jornada de 6h ou mais.
              //   porHomemHora — homem-hora do envelope dividido pelas horas trabalhadas, para cima: é o limite
              //                  que obriga o intervalo de 1h a caber dentro do turno.
              // Conferido em 14/09/2026 contra o mínimo exato e contra escala real com intervalo no meio do
              // turno: 5 meses + temporada, 9 cenários, 2 papéis = 108 casos, 0 divergências.
              // Reproduzir: node valida_minimo_app.js
              ClearCollect(
                  colMinMes,
                  ForAll(
                      Table({ papel: "APAC" }, { papel: "SUPERVISOR" }) As _p,
                      With(
                          {
                              dem: ForAll(
                                  colEnvMes As _e,
                                  { hora: _e.hora, d: If(_p.papel = "APAC", _e.apac, _e.sup) }
                              )
                          },
                          With(
                              {
                                  porCobertura: Min(
                                      ForAll(
                                          Sequence(apacHorasDia, 0) As _r,
                                          With(
                                              {
                                                  d0: ForAll(
                                                      Sequence(apacHorasDia, 0) As _k,
                                                      {
                                                          k: _k.Value,
                                                          d: LookUp(dem, hora = Mod(_r.Value + _k.Value, apacHorasDia)).d
                                                      }
                                                  )
                                              },
                                              With(
                                                  {
                                                      t1: ForAll(
                                                          Sequence(apacHorasDia, 0) As _h,
                                                          { k: _h.Value, v: Max(Filter(d0, k <= _h.Value), d) }
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          g2: ForAll(
                                                              d0 As _x,
                                                              {
                                                                  k: _x.k,
                                                                  g: _x.d + If(
                                                                      _x.k >= apacJornadaPresenca,
                                                                      LookUp(t1, k = _x.k - apacJornadaPresenca).v,
                                                                      0
                                                                  )
                                                              }
                                                          )
                                                      },
                                                      With(
                                                          {
                                                              t2: ForAll(
                                                                  Sequence(apacHorasDia, 0) As _h,
                                                                  { k: _h.Value, v: Max(Filter(g2, k <= _h.Value), g) }
                                                              )
                                                          },
                                                          With(
                                                              {
                                                                  g3: ForAll(
                                                                      d0 As _x,
                                                                      {
                                                                          k: _x.k,
                                                                          g: _x.d + If(
                                                                              _x.k >= apacJornadaPresenca,
                                                                              LookUp(t2, k = _x.k - apacJornadaPresenca).v,
                                                                              0
                                                                          )
                                                                      }
                                                                  )
                                                              },
                                                              With(
                                                                  {
                                                                      t3: ForAll(
                                                                          Sequence(apacHorasDia, 0) As _h,
                                                                          { k: _h.Value, v: Max(Filter(g3, k <= _h.Value), g) }
                                                                      )
                                                                  },
                                                                  With(
                                                                      {
                                                                          g4: ForAll(
                                                                              d0 As _x,
                                                                              {
                                                                                  k: _x.k,
                                                                                  g: _x.d + If(
                                                                                      _x.k >= apacJornadaPresenca,
                                                                                      LookUp(t3, k = _x.k - apacJornadaPresenca).v,
                                                                                      0
                                                                                  )
                                                                              }
                                                                          )
                                                                      },
                                                                      With(
                                                                          {
                                                                              t4: ForAll(
                                                                                  Sequence(apacHorasDia, 0) As _h,
                                                                                  { k: _h.Value, v: Max(Filter(g4, k <= _h.Value), g) }
                                                                              )
                                                                          },
                                                                          { n: LookUp(t4, k = apacHorasDia - 1).v }
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      ),
                                      n
                                  ),
                                  porHomemHora: With(
                                      { q: Sum(dem, d) / Max(1, apacHorasTrabalhadas) },
                                      Int(q) + If(q > Int(q), 1, 0)
                                  ),
                                  homemHora: Sum(dem, d)
                              },
                              With(
                                  { minimo: Max(porCobertura, porHomemHora) },
                                  With(
                                      {
                                          folguistas: With(
                                              { f: minimo / Max(1, apacTurnosPorFolguista) },
                                              Int(f) + If(f > Int(f), 1, 0)
                                          )
                                      },
                                      {
                                          papel: _p.papel,
                                          minimo: minimo,
                                          folguistas: folguistas,
                                          total: minimo + folguistas,
                                          porCobertura: porCobertura,
                                          porHomemHora: porHomemHora,
                                          homemHora: homemHora
                                      }
                                  )
                              )
                          )
                      )
                  )
              );
              Set(varMesLido, true)
            Text: ="calcular"
            Visible: =false
            Width: =1
            X: =-40
            Y: =-80
      # ------------------------------------------------------------------ tela
