                  # ------------------------------------------------ grade do mês
                  - cntGradeApacMes:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =14
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - htmMinimoApacMes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    CountRows(colVoosMes) = 0,
                                    "",
                                    With(
                                        {
                                            mA: LookUp(colMinMes, papel = "APAC"),
                                            mS: LookUp(colMinMes, papel = "SUPERVISOR"),
                                            picoA: Max(colEnvMes, apac),
                                            picoS: Max(colEnvMes, sup),
                                            celH: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;",
                                            rotH: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;font-weight:700;white-space:nowrap;font-size:10px;",
                                            cardBase: "width:50%;vertical-align:top;padding:12px 14px;border:1px solid " & hxBorda & ";background:" & hxPrimariaClara & ";"
                                        },
                                        "<div style='" & htmlFonte & "color:" & hxTexto & ";margin-bottom:20px;'>" &
                                        "<div style='font-size:11px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco &
                                        ";margin-bottom:8px;'>EFETIVO MÍNIMO PARA COBRIR " & varComp & "</div>" &
                                        "<table style='border-collapse:separate;border-spacing:10px 0;width:100%;margin-bottom:10px;'><tr>" &
                                        "<td style='" & cardBase & "'>" &
                                        "<div style='font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";'>AGENTES DE PROTEÇÃO</div>" &
                                        "<div style='font-size:30px;font-weight:800;line-height:1.15;color:" & hxTexto & ";'>" & Text(mA.minimo) &
                                        " <span style='font-size:13px;font-weight:600;color:" & hxTextoFraco & ";'>em escala por dia</span></div>" &
                                        "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;'>+ " & Text(mA.folguistas) &
                                        " folguistas (1 para " & Text(apacTurnosPorFolguista) & ") = <b style='color:" & hxTexto & ";'>" &
                                        Text(mA.total) & " no quadro</b></div>" &
                                        "<div style='font-size:10px;color:" & hxTextoFraco & ";margin-top:6px;'>pico de " & Text(picoA) &
                                        " por hora · " & Text(mA.homemHora) & " homem-hora no dia</div>" &
                                        "</td>" &
                                        "<td style='" & cardBase & "'>" &
                                        "<div style='font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";'>SUPERVISORES</div>" &
                                        "<div style='font-size:30px;font-weight:800;line-height:1.15;color:" & hxTexto & ";'>" & Text(mS.minimo) &
                                        " <span style='font-size:13px;font-weight:600;color:" & hxTextoFraco & ";'>em escala por dia</span></div>" &
                                        "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;'>+ " & Text(mS.folguistas) &
                                        " folguistas (1 para " & Text(apacTurnosPorFolguista) & ") = <b style='color:" & hxTexto & ";'>" &
                                        Text(mS.total) & " no quadro</b></div>" &
                                        "<div style='font-size:10px;color:" & hxTextoFraco & ";margin-top:6px;'>pico de " & Text(picoS) &
                                        " por hora · " & Text(mS.homemHora) & " homem-hora no dia</div>" &
                                        "</td>" &
                                        "</tr></table>" &
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotH & "width:" & apacLarguraRotulo & "px;background:" & hxPrimariaClara & ";'>EXIGIDO</td>" &
                                        Concat(
                                            Sequence(apacHorasDia, 0),
                                            "<td style='" & celH & "background:" & hxPrimariaClara & ";font-weight:700;'>" &
                                            Right("0" & Text(Value), 2) & "</td>"
                                        ) &
                                        "</tr><tr><td style='" & rotH & "'>APACs</td>" &
                                        Concat(
                                            Sort(colEnvMes, hora, SortOrder.Ascending),
                                            "<td style='" & celH & "background:" & If(apac = picoA, hxCarga2, hxSuperficie) & ";'>" &
                                            Text(apac) & "</td>"
                                        ) &
                                        "</tr><tr><td style='" & rotH & "'>Supervisores</td>" &
                                        Concat(
                                            Sort(colEnvMes, hora, SortOrder.Ascending),
                                            "<td style='" & celH & "background:" & If(sup = picoS And sup > 0, hxCarga2, hxSuperficie) & ";'>" &
                                            If(sup = 0, "", Text(sup)) & "</td>"
                                        ) &
                                        "</tr></table>" &
                                        "<div style='font-size:10px;color:" & hxTextoFraco & ";margin-top:8px;line-height:1.5;'>" &
                                        "Exigido = a hora mais pesada de cada faixa entre os dias do mês, já com os postos fixos. " &
                                        "Mínimo = o menor quadro diário que cobre todas essas horas com turnos de " & Text(apacJornadaPresenca) &
                                        "h de presença e 1h de intervalo dentro do turno. " &
                                        "É o maior entre dois limites: turnos contíguos (" & Text(mA.porCobertura) & " APACs · " &
                                        Text(mS.porCobertura) & " sup.) e homem-hora ÷ " & Text(apacHorasTrabalhadas) & " (" &
                                        Text(mA.porHomemHora) & " · " & Text(mS.porHomemHora) & "). " &
                                        "Não inclui férias, absenteísmo nem treinamento.</div>" &
                                        "</div>"
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - htmGradeApacMes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =With(
                                    {
                                        celBase: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;",
                                        rotBase: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;font-weight:700;white-space:nowrap;font-size:10px;",
                                        diaPico: First(Sort(colMesDia, carga, SortOrder.Descending)).dia
                                    },
                                    "<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                    If(
                                        CountRows(colVoosMes) = 0,
                                        "<div style='padding:26px 10px;border:1px dashed " & hxBorda & ";background:" & hxAmbarSuave &
                                        ";color:" & hxAmbar & ";font-size:13px;font-weight:600;'>Não há malha importada para a competência " &
                                        varComp & ". Use IMPORTAR MALHA antes de dimensionar — grade vazia aqui significa " &
                                        "falta de importação, não falta de gente.</div>",
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotBase & "width:" & apacLarguraRotulo & "px;background:" & hxPrimariaClara & ";'>DIA</td>" &
                                        Concat(
                                            Sequence(apacHorasDia, 0),
                                            "<td style='" & celBase & "background:" & hxPrimariaClara & ";font-weight:700;'>" &
                                            Right("0" & Text(Value), 2) & "</td>"
                                        ) &
                                        "<td style='" & celBase & "background:" & hxPrimaria & ";color:#FFFFFF;font-weight:700;'>PICO</td></tr>" &
                                        Concat(
                                            Sort(colMesDia, dia, SortOrder.Ascending),
                                            With(
                                                { d: dia, ehPico: dia = diaPico },
                                                "<tr><td style='" & rotBase & "background:" &
                                                If(ehPico, hxAmbarSuave, hxSuperficie) & ";'>" &
                                                Right("0" & Text(d), 2) &
                                                If(ehPico, " ★", "") & "</td>" &
                                                Concat(
                                                    Sort(Filter(colMesCel, dia = d), hora, SortOrder.Ascending),
                                                    "<td style='" & celBase & "color:" &
                                                    If(mod >= 2, "#FFFFFF", hxTexto) & ";background:" &
                                                    If(
                                                        estouro = 1,
                                                        hxCargaEstouro,
                                                        If(mod >= 3, hxCarga3, If(mod = 2, hxCarga2, If(mod = 1, hxCarga1, hxCarga0)))
                                                    ) & ";'>" &
                                                    If(
                                                        mod = 0,
                                                        "",
                                                        If(varVerApac, Text(apac), Text(mod))
                                                    ) & "</td>"
                                                ) &
                                                "<td style='" & celBase & "background:" & hxPrimariaClara &
                                                ";font-weight:800;'>" & Text(apac_pico) & "</td></tr>"
                                            )
                                        ) &
                                        "</table>"
                                    ) &
                                    "</div>"
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - htmRodapeApacMes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "font-size:11px;color:" & hxTextoFraco & ";margin-top:14px;'>" &
                                If(
                                    CountRows(colVoosMes) = 0,
                                    "",
                                    "<div><b style='color:" & hxTexto & ";'>" & Text(CountRows(colVoosMes)) &
                                    " decolagens</b> na competência " & varComp & " · pico do mês: <b style='color:" & hxTexto &
                                    ";'>" & Text(Max(colMesDia, apac_pico)) & " APACs</b> e <b style='color:" & hxTexto & ";'>" &
                                    Text(Max(colMesDia, sup_pico)) & " supervisores</b> por hora" &
                                    If(
                                        Sum(colMesDia, horas_estouro) > 0,
                                        " · <b style='color:" & hxVermelho & ";'>" & Text(Sum(colMesDia, horas_estouro)) &
                                        " hora(s) do mês pedindo mais que os " & Text(varRaiosX) & " raios-X</b>",
                                        ""
                                    ) &
                                    "</div>" &
                                    "<div style='margin-top:6px;'>" & Text(CountRows(Filter(colVoosMes, assentos <= varAssentosMin))) &
                                    " voos abaixo de " & Text(varAssentosMin) & " assentos — não abrem módulo por contagem, só por volumetria</div>" &
                                    "<div style='margin-top:6px;font-size:10px;'>★ dia de maior carga do mês, o que alimenta o escopo do contrato · " &
                                    "premissas: " & Text(varCap) & " pax/h · " & Text(varOcup) & "% · " & Text(varAntec) & " min</div>"
                                ) &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
