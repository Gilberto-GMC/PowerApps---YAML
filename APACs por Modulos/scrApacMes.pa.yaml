                                      ="<div style='" & htmlFonte & "font-size:9px;letter-spacing:.06em;font-weight:700;color:" & hxTextoFraco & ";white-space:nowrap;'>ASSENTOS MÍN.</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
