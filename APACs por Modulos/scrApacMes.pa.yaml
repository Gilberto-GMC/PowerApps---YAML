                              OnSelect: |-
                                =Set(
                                    varData,
                                    Date(
                                        Year(varRefMes),
                                        Month(varRefMes),
                                        Max(1, First(Sort(colMesDia, carga, SortOrder.Descending)).dia)
                                    )
                                );
                                Navigate(scrApacDia, ScreenTransition.Fade)
                              Text: ="ABRIR O DIA DE PICO"
                              Width: =188
                  # ------------------------------------------------ premissas
