                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - txtApacModMes:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="APAC/MÓDULO"
                                    Height: =thmAlturaCampo
                                    Placeholder: ="APAC"
                                    Value: =Text(varApacMod)
                        - cntRaiosXMes:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmTransparente
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =92
                            Children:
                              - htmRotRaiosXMes:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTextoFraco
                                    Fill: =thmTransparente
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "font-size:9px;letter-spacing:.06em;font-weight:700;color:" & hxTextoFraco & ";white-space:nowrap;'>RAIOS-X</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - txtRaiosXMes:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="RAIOS-X"
                                    Height: =thmAlturaCampo
                                    Placeholder: ="raios-X"
                                    Value: =Text(varRaiosX)
                        - btnRecalcularMes:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              Height: =thmAlturaCampo
                              OnSelect: |-
                                =Set(varCap, Max(1, Value(txtCapMes.Value)));
                                Set(varOcup, Max(1, Min(100, Value(txtOcupMes.Value))));
                                Set(varAntec, Max(1, Value(txtAntecMes.Value)));
                                Set(varAssentosMin, Max(0, Value(txtAssentosMes.Value)));
                                Set(varApacMod, Max(1, Value(txtApacModMes.Value)));
                                Set(varRaiosX, Max(1, Value(txtRaiosXMes.Value)));
                                Select(btnCalcMes)
                              Text: ="RECALCULAR"
