                      Children:
                        - htmMarcaApacMes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmTransparente
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL · " &
                                varAero & "</div>" &
                                "<div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>APACs POR MÓDULOS — " &
                                Upper(LookUp(apacMesesNomes, n = Month(varRefMes), nome)) & " DE " & Text(Year(varRefMes)) &
                                "</div>" &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - btnMesAnterior:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =thmAlturaCampo
                              OnSelect: |-
                                =Set(varRefMes, DateAdd(varRefMes, -1, TimeUnit.Months));
                                Set(varComp, Text(varRefMes, "yyyy-mm"));
                                Select(btnLerMes)
                              Text: ="◀"
                              Width: =46
                        - btnMesSeguinte:
