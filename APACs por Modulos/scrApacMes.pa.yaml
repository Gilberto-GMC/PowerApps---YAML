                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =thmAlturaCampo
                              OnSelect: |-
                                =Set(varRefMes, DateAdd(varRefMes, 1, TimeUnit.Months));
                                Set(varComp, Text(varRefMes, "yyyy-mm"));
                                Select(btnLerMes)
                              Text: ="▶"
                              Width: =46
                        # Abre o dia de maior carga do mês — que é o que alimenta o escopo do
                        # contrato. A célula da grade não é clicável: HtmlViewer é desenho, não
                        # controle. Clique por célula exigiria a camada de 744 botões, e isso
                        # não se gera em execução no Power Apps.
                        - btnVerPico:
                            Control: Button@0.0.45
