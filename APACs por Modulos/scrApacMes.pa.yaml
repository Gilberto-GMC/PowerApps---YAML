                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =With(
                                    {
                                        celBase: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;",
                                        rotBase: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;font-weight:700;white-space:nowrap;font-size:10px;",
                                        diaPico: First(Sort(colMesDia, carga, SortOrder.Descending)).dia
                                    },
                                    "<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                    If(
                                        CountRows(colVoosMes) = 0,
                                        "<div style='padding:26px 10px;border:1px dashed " & hxBorda & ";background:" & hxAmbarSuave &
                                        ";color:" & hxAmbar & ";font-size:13px;font-weight:600;'>Não há malha importada para a competência " &
                                        varComp & ". Use IMPORTAR MALHA antes de dimensionar — grade vazia aqui significa " &
                                        "falta de importação, não falta de gente.</div>",
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotBase & "width:" & apacLarguraRotulo & "px;background:" & hxPrimariaClara & ";'>DIA</td>" &
                                        Concat(
                                            Sequence(apacHorasDia, 0),
                                            "<td style='" & celBase & "background:" & hxPrimariaClara & ";font-weight:700;'>" &
                                            Right("0" & Text(Value), 2) & "</td>"
                                        ) &
                                        "<td style='" & celBase & "background:" & hxPrimaria & ";color:#FFFFFF;font-weight:700;'>PICO</td></tr>" &
                                        Concat(
                                            Sort(colMesDia, dia, SortOrder.Ascending),
                                            With(
                                                { d: dia, ehPico: dia = diaPico },
                                                "<tr><td style='" & rotBase & "background:" &
                                                If(ehPico, hxAmbarSuave, hxSuperficie) & ";'>" &
                                                Right("0" & Text(d), 2) &
                                                If(ehPico, " ★", "") & "</td>" &
                                                Concat(
                                                    Sort(Filter(colMesCel, dia = d), hora, SortOrder.Ascending),
                                                    "<td style='" & celBase & "color:" &
                                                    If(mod >= 2, "#FFFFFF", hxTexto) & ";background:" &
                                                    If(
                                                        estouro = 1,
                                                        hxCargaEstouro,
                                                        If(mod >= 3, hxCarga3, If(mod = 2, hxCarga2, If(mod = 1, hxCarga1, hxCarga0)))
                                                    ) & ";'>" &
                                                    If(
                                                        mod = 0,
                                                        "",
                                                        If(varVerApac, Text(apac), Text(mod))
                                                    ) & "</td>"
                                                ) &
                                                "<td style='" & celBase & "background:" & hxPrimariaClara &
                                                ";font-weight:800;'>" & Text(apac_pico) & "</td></tr>"
                                            )
                                        ) &
                                        "</table>"
                                    ) &
                                    "</div>"
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - htmRodapeApacMes:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "font-size:11px;color:" & hxTextoFraco & ";margin-top:14px;'>" &
                                If(
                                    CountRows(colVoosMes) = 0,
                                    "",
                                    "<div><b style='color:" & hxTexto & ";'>" & Text(CountRows(colVoosMes)) &
                                    " decolagens</b> na competência " & varComp & " · pico do mês: <b style='color:" & hxTexto &
                                    ";'>" & Text(Max(colMesDia, apac_pico)) & " APACs</b> e <b style='color:" & hxTexto & ";'>" &
                                    Text(Max(colMesDia, sup_pico)) & " supervisores</b> por hora" &
                                    If(
                                        Sum(colMesDia, horas_estouro) > 0,
                                        " · <b style='color:" & hxVermelho & ";'>" & Text(Sum(colMesDia, horas_estouro)) &
                                        " hora(s) do mês pedindo mais que os " & Text(varRaiosX) & " raios-X</b>",
                                        ""
                                    ) &
                                    "</div>" &
                                    "<div style='margin-top:6px;'>" & Text(CountRows(Filter(colVoosMes, assentos <= varAssentosMin))) &
                                    " voos abaixo de " & Text(varAssentosMin) & " assentos — não abrem módulo por contagem, só por volumetria</div>" &
                                    "<div style='margin-top:6px;font-size:10px;'>★ dia de maior carga do mês, o que alimenta o escopo do contrato · " &
                                    "premissas: " & Text(varCap) & " pax/h · " & Text(varOcup) & "% · " & Text(varAntec) & " min</div>"
                                ) &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
