Screens:
  scrApacEscala:
    Properties:
      Fill: =thmFundo
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, First(colAerosApac).Aeroporto));
        Set(varModoEsc, Coalesce(varModoEsc, "ANALISE"));
        Set(varPapelVerEsc, Coalesce(varPapelVerEsc, "APAC"));
        Select(btnLerEsc)
    Children:
      # ------------------------------------------------------------------ leitura
      # Os turnos da competência aberta na tela do mês, INCLUSIVE inativos (é aqui que se reativa).
      # O exigido NÃO é recalculado aqui: vem de colMesCel e colMinMes, que o btnCalcMes da scrApacMes
      # deixou prontos para varCompCalc. Por isso esta tela só se abre pelo botão ESCALA do mês.
      # Filtro só por igualdade: delegável.
      - btnLerEsc:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Refresh(tb_apacEscala);
              // Só APAC e supervisor. Vigilância não é o foco do app (Douglas, 15/09/2026): turno de vigilância
              // que estiver na lista não entra em conta nenhuma nem aparece na tela.
              ClearCollect(
                  colEscalaCad,
                  Filter(tb_apacEscala, aeroporto = varAero, competencia = varComp, papel = "APAC" Or papel = "SUPERVISOR")
              );
              ClearCollect(
                  colHorasEsc,
                  ForAll(Sequence(apacHorasDia, 0) As _h, { Value: Right("0" & Text(_h.Value), 2) & ":00" })
              );
              ClearCollect(
                  colDurEsc,
                  ForAll(Sequence(12, 1) As _h, { Value: Right("0" & Text(_h.Value), 2) & "h" })
              );
              ClearCollect(
                  colIntEsc,
                  ForAll(
                      Sequence(apacHorasDia + 1, 0) As _h,
                      { Value: If(_h.Value = 0, "sem intervalo", Right("0" & Text(_h.Value - 1), 2) & ":00") }
                  )
              );
              ClearCollect(colPapeisEsc, Table({ Value: "APAC" }, { Value: "SUPERVISOR" }));
              If(
                  IsBlank(varFormEsc),
                  Set(
                      varFormEsc,
                      {
                          papel: "APAC",
                          ini: "06:00",
                          dur: "08h",
                          intIni: "10:00",
                          intMin: "60",
                          qtd: "1",
                          rot: "",
                          ordem: Text(Coalesce(Max(colEscalaCad, ordem), 0) + 1),
                          ativo: true
                      }
                  )
              );
              Select(btnCalcEsc)
            Text: ="ler"
            Visible: =false
            Width: =1
            X: =-40
            Y: =-40
      # Cobertura da escala hora a hora e falta por dia × hora.
      # ⚠️ A REGRA DE COBERTURA é a mesma do escala_do_escopo.js, que foi conferida contra as linhas de total
      # da planilha da Simone nas 24 horas: o turno conta na hora h se a hora INTEIRA está dentro da presença
      # (atravessando a meia-noite) e não encosta no intervalo. Mudar aqui exige mudar lá e rodar de novo.
      # Números esperados por competência: node testar_escala.js
      - btnCalcEsc:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colCobEsc,
                  ForAll(
                      Sequence(apacHorasDia, 0) As _h,
                      With(
                          {
                              vale: Filter(
                                  colEscalaCad As _t,
                                  _t.ativo = 1,
                                  (_h.Value * 60 >= _t.hora_inicio And _h.Value * 60 + 60 <= _t.hora_inicio + _t.duracao_min) Or
                                  (_h.Value * 60 + 1440 >= _t.hora_inicio And _h.Value * 60 + 1500 <= _t.hora_inicio + _t.duracao_min),
                                  !(
                                      _t.intervalo_min > 0 And
                                      (
                                          (_h.Value * 60 < _t.intervalo_inicio + _t.intervalo_min And _h.Value * 60 + 60 > _t.intervalo_inicio) Or
                                          (_h.Value * 60 + 1440 < _t.intervalo_inicio + _t.intervalo_min And _h.Value * 60 + 1500 > _t.intervalo_inicio)
                                      )
                                  )
                              )
                          },
                          {
                              hora: _h.Value,
                              apac: Coalesce(Sum(Filter(vale, papel = "APAC"), quantidade), 0),
                              sup: Coalesce(Sum(Filter(vale, papel = "SUPERVISOR"), quantidade), 0)
                          }
                      )
                  )
              );
              ClearCollect(
                  colFaltaEsc,
                  ForAll(
                      Filter(colMesCel, dia <= varDiasNoMes) As _c,
                      With(
                          { cob: LookUp(colCobEsc, hora = _c.hora) },
                          {
                              dia: _c.dia,
                              hora: _c.hora,
                              exigA: _c.apac,
                              exigS: _c.sup,
                              escA: cob.apac,
                              escS: cob.sup,
                              faltaA: Max(0, _c.apac - cob.apac),
                              faltaS: Max(0, _c.sup - cob.sup)
                          }
                      )
                  )
              );
              ClearCollect(
                  colResumoEsc,
                  ForAll(
                      Sequence(apacHorasDia, 0) As _h,
                      With(
                          {
                              linha: Filter(colFaltaEsc, hora = _h.Value),
                              cob: LookUp(colCobEsc, hora = _h.Value)
                          },
                          {
                              hora: _h.Value,
                              exigA: Max(linha, exigA),
                              exigS: Max(linha, exigS),
                              escA: cob.apac,
                              escS: cob.sup,
                              faltaA: Max(linha, faltaA),
                              faltaS: Max(linha, faltaS),
                              diasA: CountRows(Filter(linha, faltaA > 0)),
                              diasS: CountRows(Filter(linha, faltaS > 0))
                          }
                      )
                  )
              );
              ClearCollect(
                  colDiasEsc,
                  ForAll(
                      Sequence(Max(1, varDiasNoMes), 1) As _d,
                      With(
                          { linha: Filter(colFaltaEsc, dia = _d.Value) },
                          {
                              dia: _d.Value,
                              faltaA: Max(linha, faltaA),
                              faltaS: Max(linha, faltaS),
                              horasA: CountRows(Filter(linha, faltaA > 0)),
                              horasS: CountRows(Filter(linha, faltaS > 0))
                          }
                      )
                  )
              );
              Set(varPessoasAEsc, Coalesce(Sum(Filter(colEscalaCad, ativo = 1, papel = "APAC"), quantidade), 0));
              Set(varPessoasSEsc, Coalesce(Sum(Filter(colEscalaCad, ativo = 1, papel = "SUPERVISOR"), quantidade), 0));
              Set(varMinAEsc, LookUp(colMinMes, papel = "APAC").minimo);
              Set(varMinSEsc, LookUp(colMinMes, papel = "SUPERVISOR").minimo);
              Set(varDiasFaltaAEsc, CountRows(Filter(colDiasEsc, faltaA > 0)));
              Set(varDiasFaltaSEsc, CountRows(Filter(colDiasEsc, faltaS > 0)))
            Text: ="calcular"
            Visible: =false
            Width: =1
            X: =-40
            Y: =-80
      # ------------------------------------------------------------------ tela
      - cntRaizEsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntColunaEsc:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  # ------------------------------------------------ barra
                  - cntBarraEsc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        PaddingBottom: =0
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - htmMarcaEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmTransparente
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL · " &
                                varAero & "</div>" &
                                "<div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>APACs POR MÓDULOS — ESCALA DE " &
                                Upper(LookUp(apacMesesNomes, n = Month(varRefMes), nome)) & " DE " & Text(Year(varRefMes)) &
                                "</div>" &
                                "</div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        - btnAbaAnaEsc:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: =If(varModoEsc = "ANALISE", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                              Height: =thmAlturaCampo
                              OnSelect: =Set(varModoEsc, "ANALISE")
                              Text: ="ANÁLISE"
                              Width: =110
                        - btnAbaTurEsc:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: =If(varModoEsc = "TURNOS", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                              Height: =thmAlturaCampo
                              OnSelect: =Set(varModoEsc, "TURNOS")
                              Text: ="TURNOS"
                              Width: =110
                        - btnGuiaEsc:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =thmAlturaCampo
                              OnSelect: |-
                                =Set(varOrigemGuia, "ESCALA");
                                Set(varSecGuia, "ESCALA");
                                Navigate(scrApacGuia, ScreenTransition.Fade)
                              Text: ="COMO LER"
                              Width: =110
                        - btnVoltarEsc:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Height: =thmAlturaCampo
                              OnSelect: =Navigate(scrApacMes, ScreenTransition.Fade)
                              Text: ="◀ VOLTAR AO MÊS"
                              Width: =170
                  # ================================================ ANÁLISE
                  - cntCorpoAnaEsc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =0
                        LayoutMinHeight: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =14
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =varModoEsc = "ANALISE"
                        Width: =Parent.Width
                      Children:
                        # ---------------------------------------- veredito
                        - htmVereditoEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =With(
                                    {
                                        aviso: "padding:22px 14px;border:1px dashed " & hxBorda & ";background:" & hxAmbarSuave & ";color:" & hxAmbar & ";font-size:13px;font-weight:600;line-height:1.5;",
                                        cardBase: "width:50%;vertical-align:top;padding:12px 14px;border:1px solid " & hxBorda & ";"
                                    },
                                    "<div style='" & htmlFonte & "color:" & hxTexto & ";margin-bottom:18px;'>" &
                                    If(
                                        CountRows(colVoosMes) = 0 Or varCompCalc <> varComp,
                                        "<div style='" & aviso & "'>O exigido de " & varComp & " não está calculado. Volte ao mês, confira que a grade " &
                                        "tem malha e toque em ESCALA de novo.</div>",
                                        CountRows(Filter(colEscalaCad, ativo = 1)) = 0,
                                        "<div style='" & aviso & "'>Nenhum turno ativo cadastrado para " & varComp & ". Cadastre em TURNOS, " &
                                        "ou cole o arquivo escala_escopo_" & varComp & ".csv na lista tb_apacEscala (modo de grade).</div>",
                                        "<div style='font-size:11px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco &
                                        ";margin-bottom:8px;'>A ESCALA CADASTRADA COBRE " & varComp & "?</div>" &
                                        "<table style='border-collapse:separate;border-spacing:10px 0;width:100%;'><tr>" &
                                        // ------------------------------ APAC
                                        With(
                                            {
                                                ok: varDiasFaltaAEsc = 0,
                                                contratar: varDiasFaltaAEsc > 0 And varPessoasAEsc < varMinAEsc
                                            },
                                            "<td style='" & cardBase & "background:" & If(ok, hxPrimariaClara, contratar, hxVermelhoSuave, hxAmbarSuave) & ";'>" &
                                            "<div style='font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";'>AGENTES DE PROTEÇÃO</div>" &
                                            "<div style='font-size:24px;font-weight:800;line-height:1.2;color:" & If(ok, hxVerde, contratar, hxVermelho, hxAmbar) & ";'>" &
                                            If(ok, "COBRE O MÊS", contratar, "CONTRATAR " & Text(varMinAEsc - varPessoasAEsc), "REPOSICIONAR TURNOS") & "</div>" &
                                            "<div style='font-size:12px;margin-top:6px;line-height:1.5;'><b>" & Text(varPessoasAEsc) & "</b> em escala por dia" &
                                            " · mínimo do mês <b>" & Text(varMinAEsc) & "</b>" &
                                            " · <b>" & Text(varDiasFaltaAEsc) & "</b> dia(s) com falta</div>" &
                                            "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;line-height:1.5;'>" &
                                            If(
                                                ok,
                                                "Nenhuma hora de nenhum dia fica abaixo do exigido." &
                                                If(varPessoasAEsc > varMinAEsc, " A escala tem " & Text(varPessoasAEsc - varMinAEsc) & " acima do mínimo.", ""),
                                                contratar,
                                                "Com " & Text(varPessoasAEsc) & " pessoas nenhum rearranjo de horário cobre o mês: o mínimo com turnos de " &
                                                Text(apacJornadaPresenca) & "h é " & Text(varMinAEsc) & ". Contrate e depois posicione os turnos nas horas em vermelho.",
                                                "O número basta, mas os turnos estão nas horas erradas: há gente sobrando em algumas horas e faltando nas horas " &
                                                "em vermelho abaixo. Mova turnos para elas."
                                            ) &
                                            " No quadro, com folguistas: " & Text(varPessoasAEsc + With({ q: varPessoasAEsc / Max(1, apacTurnosPorFolguista) }, Int(q) + If(q > Int(q), 1, 0))) & ".</div>" &
                                            "</td>"
                                        ) &
                                        // ------------------------------ SUPERVISOR
                                        With(
                                            {
                                                ok: varDiasFaltaSEsc = 0,
                                                contratar: varDiasFaltaSEsc > 0 And varPessoasSEsc < varMinSEsc
                                            },
                                            "<td style='" & cardBase & "background:" & If(ok, hxPrimariaClara, contratar, hxVermelhoSuave, hxAmbarSuave) & ";'>" &
                                            "<div style='font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";'>SUPERVISORES</div>" &
                                            "<div style='font-size:24px;font-weight:800;line-height:1.2;color:" & If(ok, hxVerde, contratar, hxVermelho, hxAmbar) & ";'>" &
                                            If(ok, "COBRE O MÊS", contratar, "CONTRATAR " & Text(varMinSEsc - varPessoasSEsc), "REPOSICIONAR TURNOS") & "</div>" &
                                            "<div style='font-size:12px;margin-top:6px;line-height:1.5;'><b>" & Text(varPessoasSEsc) & "</b> em escala por dia" &
                                            " · mínimo do mês <b>" & Text(varMinSEsc) & "</b>" &
                                            " · <b>" & Text(varDiasFaltaSEsc) & "</b> dia(s) com falta</div>" &
                                            "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;line-height:1.5;'>" &
                                            If(
                                                ok,
                                                "Nenhuma hora de nenhum dia fica sem o supervisor exigido." &
                                                If(varPessoasSEsc > varMinSEsc, " A escala tem " & Text(varPessoasSEsc - varMinSEsc) & " acima do mínimo.", ""),
                                                contratar,
                                                "Com " & Text(varPessoasSEsc) & " supervisores nenhum rearranjo cobre o mês: o mínimo é " & Text(varMinSEsc) &
                                                ". Contrate e depois posicione o turno nas horas em vermelho.",
                                                "O número basta, mas os turnos estão nas horas erradas. Mova turnos para as horas em vermelho abaixo."
                                            ) &
                                            " No quadro, com folguistas: " & Text(varPessoasSEsc + With({ q: varPessoasSEsc / Max(1, apacTurnosPorFolguista) }, Int(q) + If(q > Int(q), 1, 0))) & ".</div>" &
                                            "</td>"
                                        ) &
                                        "</tr></table>"
                                    ) &
                                    "</div>"
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        # ---------------------------------------- hora a hora
                        - htmHorasEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    CountRows(colVoosMes) = 0 Or varCompCalc <> varComp Or CountRows(Filter(colEscalaCad, ativo = 1)) = 0,
                                    "",
                                    With(
                                        {
                                            celH: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;",
                                            rotH: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;font-weight:700;white-space:nowrap;font-size:10px;",
                                            rH: Sort(colResumoEsc, hora, SortOrder.Ascending)
                                        },
                                        "<div style='" & htmlFonte & "color:" & hxTexto & ";margin-bottom:18px;'>" &
                                        "<div style='font-size:11px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco &
                                        ";margin-bottom:8px;'>HORA A HORA — O PIOR DIA DO MÊS CONTRA A ESCALA</div>" &
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotH & "width:" & apacLarguraRotulo & "px;background:" & hxPrimariaClara & ";'>HORA</td>" &
                                        Concat(rH, "<td style='" & celH & "background:" & hxPrimariaClara & ";font-weight:700;'>" & Right("0" & Text(hora), 2) & "</td>") &
                                        "</tr>" &
                                        "<tr><td style='" & rotH & "'>APAC exigido</td>" &
                                        Concat(rH, "<td style='" & celH & "'>" & Text(exigA) & "</td>") & "</tr>" &
                                        "<tr><td style='" & rotH & "'>APAC escalado</td>" &
                                        Concat(rH, "<td style='" & celH & "'>" & Text(escA) & "</td>") & "</tr>" &
                                        "<tr><td style='" & rotH & "'>APAC saldo</td>" &
                                        Concat(
                                            rH,
                                            "<td style='" & celH & "font-weight:700;background:" &
                                            If(escA >= exigA, "#DCFCE7", varPessoasAEsc >= varMinAEsc, "#FDE68A", hxVermelho) &
                                            ";color:" & If(escA >= exigA, hxVerde, varPessoasAEsc >= varMinAEsc, hxAmbar, "#FFFFFF") & ";'>" &
                                            If(escA < exigA, "−" & Text(exigA - escA), escA > exigA, "+" & Text(escA - exigA), "0") & "</td>"
                                        ) & "</tr>" &
                                        "<tr><td style='" & rotH & "'>dias com falta</td>" &
                                        Concat(rH, "<td style='" & celH & "color:" & hxVermelho & ";font-weight:700;'>" & If(diasA = 0, "", Text(diasA)) & "</td>") &
                                        "</tr>" &
                                        "<tr><td style='" & rotH & "border-top:2px solid " & hxBorda & ";'>SUP exigido</td>" &
                                        Concat(rH, "<td style='" & celH & "border-top:2px solid " & hxBorda & ";'>" & Text(exigS) & "</td>") & "</tr>" &
                                        "<tr><td style='" & rotH & "'>SUP escalado</td>" &
                                        Concat(rH, "<td style='" & celH & "'>" & Text(escS) & "</td>") & "</tr>" &
                                        "<tr><td style='" & rotH & "'>SUP saldo</td>" &
                                        Concat(
                                            rH,
                                            "<td style='" & celH & "font-weight:700;background:" &
                                            If(escS >= exigS, "#DCFCE7", varPessoasSEsc >= varMinSEsc, "#FDE68A", hxVermelho) &
                                            ";color:" & If(escS >= exigS, hxVerde, varPessoasSEsc >= varMinSEsc, hxAmbar, "#FFFFFF") & ";'>" &
                                            If(escS < exigS, "−" & Text(exigS - escS), escS > exigS, "+" & Text(escS - exigS), "0") & "</td>"
                                        ) & "</tr>" &
                                        "<tr><td style='" & rotH & "'>dias com falta</td>" &
                                        Concat(rH, "<td style='" & celH & "color:" & hxVermelho & ";font-weight:700;'>" & If(diasS = 0, "", Text(diasS)) & "</td>") &
                                        "</tr></table></div>"
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        # ---------------------------------------- régua dos turnos
                        - htmReguaEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    CountRows(Filter(colEscalaCad, ativo = 1)) = 0,
                                    "",
                                    With(
                                        {
                                            celR: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;",
                                            rotR: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;white-space:nowrap;overflow:hidden;font-size:10px;"
                                        },
                                        "<div style='" & htmlFonte & "color:" & hxTexto & ";margin-bottom:18px;'>" &
                                        "<div style='font-size:11px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco &
                                        ";margin-bottom:8px;'>OS TURNOS NA RÉGUA DO DIA</div>" &
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotR & "width:" & (apacLarguraRotulo * 2) & "px;background:" & hxPrimariaClara & ";font-weight:700;'>TURNO</td>" &
                                        "<td style='" & celR & "width:34px;background:" & hxPrimariaClara & ";font-weight:700;'>QTD</td>" &
                                        Concat(
                                            Sequence(apacHorasDia, 0),
                                            "<td style='" & celR & "background:" & hxPrimariaClara & ";font-weight:700;'>" & Right("0" & Text(Value), 2) & "</td>"
                                        ) & "</tr>" &
                                        Concat(
                                            Sort(Filter(colEscalaCad, ativo = 1), ordem, SortOrder.Ascending) As _t,
                                            "<tr><td style='" & rotR & "' title='" & Coalesce(_t.rotulo, "") & "'>" &
                                            Coalesce(_t.rotulo, "") & "</td>" &
                                            "<td style='" & celR & "font-weight:700;'>" & Text(_t.quantidade) & "</td>" &
                                            Concat(
                                                Sequence(apacHorasDia, 0) As _h,
                                                With(
                                                    {
                                                        pres: (_h.Value * 60 >= _t.hora_inicio And _h.Value * 60 + 60 <= _t.hora_inicio + _t.duracao_min) Or
                                                            (_h.Value * 60 + 1440 >= _t.hora_inicio And _h.Value * 60 + 1500 <= _t.hora_inicio + _t.duracao_min),
                                                        inter: _t.intervalo_min > 0 And
                                                            (
                                                                (_h.Value * 60 < _t.intervalo_inicio + _t.intervalo_min And _h.Value * 60 + 60 > _t.intervalo_inicio) Or
                                                                (_h.Value * 60 + 1440 < _t.intervalo_inicio + _t.intervalo_min And _h.Value * 60 + 1500 > _t.intervalo_inicio)
                                                            )
                                                    },
                                                    "<td title='" & If(pres And inter, "intervalo: nesta hora o turno está em pausa e não conta", "") &
                                                    "' style='" & celR & "background:" &
                                                    If(
                                                        pres And inter, hxAmbarSuave,
                                                        pres And _t.papel = "SUPERVISOR", hxCarga3,
                                                        pres, hxCarga2,
                                                        hxSuperficie
                                                    ) &
                                                    ";color:" & If(pres And inter, hxAmbar, pres And _t.papel = "SUPERVISOR", "#FFFFFF", hxTexto) & ";'>" &
                                                    If(pres And inter, "int", "") & "</td>"
                                                )
                                            ) & "</tr>"
                                        ) &
                                        "<tr><td style='" & rotR & "font-weight:700;border-top:2px solid " & hxBorda & ";'>ESCALADOS APAC" &
                                        "</td><td style='" & celR & "border-top:2px solid " & hxBorda & ";'></td>" &
                                        Concat(
                                            Sort(colCobEsc, hora, SortOrder.Ascending),
                                            "<td style='" & celR & "font-weight:700;border-top:2px solid " & hxBorda & ";'>" & Text(apac) & "</td>"
                                        ) & "</tr>" &
                                        "<tr><td style='" & rotR & "font-weight:700;'>ESCALADOS SUP</td><td style='" & celR & "'></td>" &
                                        Concat(
                                            Sort(colCobEsc, hora, SortOrder.Ascending),
                                            "<td style='" & celR & "font-weight:700;'>" & If(sup = 0, "", Text(sup)) & "</td>"
                                        ) & "</tr>" &
                                        "</table></div>"
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        # ---------------------------------------- escolha do papel da grade de dias
                        - cntPapelGradeEsc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmTransparente
                              FillPortions: =0
                              Height: =52
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              PaddingBottom: =8
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =CountRows(colVoosMes) > 0 And varCompCalc = varComp And CountRows(Filter(colEscalaCad, ativo = 1)) > 0
                              Width: =Parent.Width
                            Children:
                              - htmTitGradeEsc:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTextoFraco
                                    Fill: =thmTransparente
                                    FillPortions: =1
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "font-size:11px;font-weight:700;letter-spacing:1px;color:" & hxTextoFraco & ";'>" &
                                      "DIA A DIA — " & If(varPapelVerEsc = "APAC", "APACs", "SUPERVISORES") & " EXIGIDOS / ESCALADOS EM CADA HORA</div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                              - btnPapelGradeEsc:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =thmAlturaCampo
                                    Icon: ="Eye"
                                    OnSelect: =Set(varPapelVerEsc, If(varPapelVerEsc = "APAC", "SUPERVISOR", "APAC"))
                                    Text: =If(varPapelVerEsc = "APAC", "APAC", "SUPERVISORES")
                                    Width: =160
                        # ---------------------------------------- dia × hora
                        - htmDiasEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    CountRows(colVoosMes) = 0 Or varCompCalc <> varComp Or CountRows(Filter(colEscalaCad, ativo = 1)) = 0,
                                    "",
                                    With(
                                        {
                                            celD: "border:1px solid " & hxGradeFina & ";text-align:center;padding:3px 0;font-size:10px;white-space:nowrap;",
                                            rotD: "border:1px solid " & hxGradeFina & ";text-align:left;padding:3px 6px;font-weight:700;white-space:nowrap;font-size:10px;",
                                            // Amarelo ou vermelho se decide pelo MÊS, não pela hora: a escala é uma só para todos os
                                            // dias, e o mínimo do mês é o menor quadro que cobre todas as horas com turnos de 8h.
                                            // Quem tem o mínimo cobre remanejando; quem não tem, só contratando.
                                            podeRemanejar: If(varPapelVerEsc = "APAC", varPessoasAEsc >= varMinAEsc, varPessoasSEsc >= varMinSEsc),
                                            verdeFundo: "#DCFCE7",
                                            amareloFundo: "#FDE68A"
                                        },
                                        "<div style='" & htmlFonte & "color:" & hxTexto & ";'>" &
                                        "<table style='border-collapse:collapse;width:100%;table-layout:fixed;'>" &
                                        "<tr><td style='" & rotD & "width:" & apacLarguraRotulo & "px;background:" & hxPrimariaClara & ";'>DIA</td>" &
                                        Concat(
                                            Sequence(apacHorasDia, 0),
                                            "<td style='" & celD & "background:" & hxPrimariaClara & ";font-weight:700;'>" & Right("0" & Text(Value), 2) & "</td>"
                                        ) &
                                        "<td style='" & celD & "background:" & hxPrimaria & ";color:#FFFFFF;font-weight:700;'>HORAS</td></tr>" &
                                        Concat(
                                            Sort(colDiasEsc, dia, SortOrder.Ascending) As _d,
                                            With(
                                                { horasF: If(varPapelVerEsc = "APAC", _d.horasA, _d.horasS) },
                                                "<tr><td style='" & rotD & "background:" &
                                                If(horasF = 0, verdeFundo, podeRemanejar, amareloFundo, hxVermelhoSuave) & ";'>" &
                                                Right("0" & Text(_d.dia), 2) & "</td>" &
                                                Concat(
                                                    Sort(Filter(colFaltaEsc, dia = _d.dia), hora, SortOrder.Ascending),
                                                    With(
                                                        {
                                                            f: If(varPapelVerEsc = "APAC", faltaA, faltaS),
                                                            ex: If(varPapelVerEsc = "APAC", exigA, exigS),
                                                            tem: If(varPapelVerEsc = "APAC", escA, escS)
                                                        },
                                                        "<td style='" & celD & "font-weight:" & If(f > 0, "800", "600") & ";background:" &
                                                        If(ex = 0 And tem = 0, hxSuperficie, f = 0, verdeFundo, podeRemanejar, amareloFundo, hxVermelho) &
                                                        ";color:" & If(f = 0, hxVerde, podeRemanejar, hxAmbar, "#FFFFFF") & ";'>" &
                                                        If(ex = 0 And tem = 0, "", Text(ex) & "/" & Text(tem)) & "</td>"
                                                    )
                                                ) &
                                                "<td style='" & celD & "font-weight:800;background:" &
                                                If(horasF = 0, verdeFundo, podeRemanejar, amareloFundo, hxVermelho) & ";color:" &
                                                If(horasF = 0, hxVerde, podeRemanejar, hxAmbar, "#FFFFFF") & ";'>" &
                                                If(horasF > 0, Text(horasF), "ok") & "</td></tr>"
                                            )
                                        ) &
                                        "</table></div>"
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                        # ---------------------------------------- legenda
                        - htmLegendaEsc:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmTransparente
                              Font: =thmFonte
                              HtmlText: |-
                                =With(
                                    {
                                        sw: "display:inline-block;width:18px;height:11px;vertical-align:middle;margin:0 5px 0 0;border:1px solid " & hxGradeFina & ";background:",
                                        item: "margin:0 16px 4px 0;display:inline-block;white-space:nowrap;",
                                        tit: "font-size:10px;font-weight:700;letter-spacing:1px;color:" & hxPrimariaEscura & ";margin:12px 0 4px 0;",
                                        par: "margin:0 0 4px 0;line-height:1.55;"
                                    },
                                    "<div style='" & htmlFonte & "font-size:11px;color:" & hxTextoFraco & ";margin-top:14px;padding:12px 14px;border:1px solid " &
                                    hxBorda & ";background:" & hxSuperficie & ";'>" &
                                    "<div style='" & tit & "margin-top:0;'>O QUE ESTA TELA RESPONDE</div>" &
                                    "<div style='" & par & "'>Se os turnos cadastrados para " & varComp & " põem, <b>em cada hora de cada dia</b>, pelo menos o " &
                                    "número de pessoas que a malha exige. O exigido é o mesmo da tela do mês (módulos × APACs por módulo + postos fixos; " &
                                    "supervisores por módulo), com as premissas que estavam lá quando você tocou em ESCALA.</div>" &
                                    "<div style='" & tit & "'>COMO A ESCALA É CONTADA</div>" &
                                    "<div style='" & par & "'>Um turno conta numa hora quando a <b>hora inteira</b> está dentro dele e não encosta no intervalo. " &
                                    "Turno das 22:00 às 06:00 conta de 22 a 05; com intervalo às 03:00, a hora 03 fica sem ele. É a mesma regra que reproduz, " &
                                    "hora a hora, as linhas de total da planilha do escopo. A mesma escala vale para todos os dias do mês (6x2: quem folga é " &
                                    "coberto pelo folguista, que não entra na conta da hora).</div>" &
                                    "<div style='" & par & "'>Só contam turnos de <b>APAC</b> e de <b>supervisor</b>. Os postos fixos cadastrados em " &
                                    "CADASTROS estão dentro do exigido de APAC e precisam ser cobertos por turnos de APAC.</div>" &
                                    "<div style='" & tit & "'>COMO LER O VEREDITO</div>" &
                                    "<div style='" & par & "'><b style='color:" & hxVerde & ";'>COBRE O MÊS</b> — nenhuma hora de nenhum dia fica abaixo do exigido. " &
                                    "<b style='color:" & hxVermelho & ";'>CONTRATAR n</b> — há falta e a escala tem menos gente que o <b>mínimo do mês</b> " &
                                    "(o menor quadro diário que cobre o pior dia de cada hora com turnos de " & Text(apacJornadaPresenca) & "h e 1h de intervalo); " &
                                    "nenhum rearranjo resolve sem contratar. " &
                                    "<b style='color:" & hxAmbar & ";'>REPOSICIONAR TURNOS</b> — há falta, mas a escala já tem gente suficiente: " &
                                    "o problema é o horário dos turnos. <b>No quadro</b> soma 1 folguista a cada " & Text(apacTurnosPorFolguista) & ".</div>" &
                                    "<div style='" & tit & "'>AS TABELAS</div>" &
                                    "<div style='" & par & "'><b>Hora a hora:</b> exigido é o pior dia do mês naquela hora; escalado é quem a escala põe na hora; " &
                                    "saldo em vermelho é quanto falta no pior dia; dias com falta diz quantos dias do mês ficam descobertos naquela hora. " &
                                    "<b>Régua:</b> cada linha é um turno cadastrado, pintado nas horas em que conta; int marca a hora de intervalo. " &
                                    "<b>Dia a dia:</b> cada célula é <b>exigido/escalado</b> naquela hora daquele dia (14/11 = a malha pede 14, a escala põe 11); " &
                                    "HORAS é quantas horas do dia ficam abaixo do exigido. O botão com o olho troca entre APAC e supervisores.</div>" &
                                    "<div style='" & tit & "'>AS CORES</div>" &
                                    "<div style='margin:6px 0 2px 0;'>" &
                                    "<span style='" & item & "'><span style='" & sw & "#DCFCE7;'></span><b style='color:" & hxVerde & ";'>verde</b> — tem o exigido ou mais</span>" &
                                    "<span style='" & item & "'><span style='" & sw & "#FDE68A;'></span><b style='color:" & hxAmbar & ";'>amarelo</b> — falta nesta hora, mas a escala do mês tem gente para cobrir remanejando turnos</span>" &
                                    "<span style='" & item & "'><span style='" & sw & hxVermelho & ";'></span><b style='color:" & hxVermelho & ";'>vermelho</b> — falta, e só contratando</span>" &
                                    "</div>" &
                                    "<div style='" & par & "'>Amarelo ou vermelho se decide pelo mês inteiro, não pela hora: a escala é uma só para todos os dias, " &
                                    "então remanejar só resolve se o total em escala alcança o mínimo do mês. Por isso, num mesmo mês, as faltas são todas " &
                                    "amarelas ou todas vermelhas.</div>" &
                                    "<div style='margin:6px 0 2px 0;'>" &
                                    "<span style='" & item & "'><span style='" & sw & hxCarga2 & ";'></span>régua: APAC no turno</span>" &
                                    "<span style='" & item & "'><span style='" & sw & hxCarga3 & ";'></span>supervisor no turno</span>" &
                                    "<span style='" & item & "'><span style='" & sw & hxAmbarSuave & ";'></span>intervalo</span>" &
                                    "</div>" &
                                    "<div style='margin-top:10px;padding-top:8px;border-top:1px solid " & hxGradeFina & ";font-size:10px;'>" &
                                    "Não entram na conta: férias, afastamentos, absenteísmo, treinamento, técnico de segurança, ADM e preposto. " &
                                    "Mudou uma premissa? Mude na tela do mês, toque RECALCULAR e volte em ESCALA.</div>" &
                                    "</div>"
                                )
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                  # ================================================ TURNOS
                  - cntCorpoTurEsc:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =varModoEsc = "TURNOS"
                      Children:
                        - cntListaTurEsc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htmCabListaTurEsc:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmSuperficie
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "padding:12px 14px;border-bottom:1px solid " & hxBorda & ";'>" &
                                      "<div style='font-size:10px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";'>TURNOS DE " & varComp & " · " & varAero & "</div>" &
                                      "<div style='font-size:11px;color:" & hxTexto & ";line-height:1.5;margin-top:4px;'>" &
                                      "Ativos: <b>" & Text(Coalesce(Sum(Filter(colEscalaCad, ativo = 1, papel = "APAC"), quantidade), 0)) & " APAC</b> · <b>" &
                                      Text(Coalesce(Sum(Filter(colEscalaCad, ativo = 1, papel = "SUPERVISOR"), quantidade), 0)) & " supervisores</b> por dia. " &
                                      "Cada competência tem a sua escala. Para carregar a escala da planilha do escopo de uma vez, abra a lista " &
                                      "tb_apacEscala em <b>Editar no modo de grade</b> e cole o arquivo <b>escala_escopo_" & varComp & ".csv</b>." &
                                      "</div></div>"
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                              - galTurEsc:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =thmBorda
                                    BorderStyle: =BorderStyle.None
                                    Fill: =thmSuperficie
                                    FillPortions: =1
                                    Items: =Sort(colEscalaCad, ordem, SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplatePadding: =0
                                    TemplateSize: =46
                                  Children:
                                    - cntLinhaTurEsc:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmTransparente
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width - 18
                                        Children:
                                          - btnItemTurEsc:
                                              Control: Button@0.0.45
                                              Properties:
                                                Align: =Align.Left
                                                Appearance: =If(varTurSelEsc.ID = ThisItem.ID, 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                                BasePaletteColor: =If(ThisItem.ativo = 1, thmPrimaria, thmTextoFraco)
                                                BorderRadius: =0
                                                FillPortions: =1
                                                FontSize: =12
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(varTurSelEsc, ThisItem);
                                                  Set(
                                                      varFormEsc,
                                                      {
                                                          papel: ThisItem.papel,
                                                          ini: Right("0" & Text(Int(ThisItem.hora_inicio / 60)), 2) & ":00",
                                                          dur: Right("0" & Text(Int(ThisItem.duracao_min / 60)), 2) & "h",
                                                          intIni: If(
                                                              ThisItem.intervalo_min > 0,
                                                              Right("0" & Text(Int(Coalesce(ThisItem.intervalo_inicio, 0) / 60)), 2) & ":00",
                                                              "sem intervalo"
                                                          ),
                                                          intMin: Text(If(ThisItem.intervalo_min > 0, ThisItem.intervalo_min, 60)),
                                                          qtd: Text(ThisItem.quantidade),
                                                          rot: Coalesce(ThisItem.rotulo, ""),
                                                          ordem: Text(ThisItem.ordem),
                                                          ativo: ThisItem.ativo = 1
                                                      }
                                                  )
                                                PaddingLeft: =12
                                                PaddingRight: =12
                                                Text: |-
                                                  =Text(ThisItem.quantidade) & " " & ThisItem.papel & "   ·   " &
                                                  Right("0" & Text(Int(ThisItem.hora_inicio / 60)), 2) & ":00 às " &
                                                  Right("0" & Text(Int(Mod(ThisItem.hora_inicio + ThisItem.duracao_min, 1440) / 60)), 2) & ":00" &
                                                  If(
                                                      ThisItem.intervalo_min > 0,
                                                      "   ·   intervalo " & Right("0" & Text(Int(Coalesce(ThisItem.intervalo_inicio, 0) / 60)), 2) & ":00",
                                                      "   ·   sem intervalo"
                                                  ) &
                                                  If(ThisItem.ativo = 1, "", "   ·   INATIVO")
                        - cntFormTurEsc:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =16
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =430
                            Children:
                              - htmAjudaTurEsc:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =thmTexto
                                    Fill: =thmSuperficie
                                    Font: =thmFonte
                                    HtmlText: |-
                                      ="<div style='" & htmlFonte & "font-size:10px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";'>" &
                                      If(IsBlank(varTurSelEsc.ID), "NOVO TURNO EM " & varComp, "EDITAR TURNO SELECIONADO") & "</div>" &
                                      "<div style='" & htmlFonte & "font-size:11px;color:" & hxTexto & ";line-height:1.5;padding:6px 0 4px 0;'>" &
                                      "Turno que atravessa a meia-noite é <b>um cadastro só</b>: início 22:00 com 8h termina às 06:00. " &
                                      "O intervalo tem de ficar dentro do turno. Turno não se apaga: desligue <b>Ativo</b>.</div>"
                                    Size: =11
                              - lblPapelEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="QUEM TRABALHA NO TURNO *"
                              - drpPapelEsc:
                                  Control: DropDown@0.0.45
                                  Properties:
                                    DefaultSelectedItems: =[Coalesce(varFormEsc.papel, "APAC")]
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    Items: =colPapeisEsc
                              - lblIniEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="COMEÇA ÀS *"
                              - drpIniEsc:
                                  Control: DropDown@0.0.45
                                  Properties:
                                    DefaultSelectedItems: =[Coalesce(varFormEsc.ini, "06:00")]
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    Items: =colHorasEsc
                              - lblDurEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="PRESENÇA (HORAS, COM O INTERVALO) *"
                              - drpDurEsc:
                                  Control: DropDown@0.0.45
                                  Properties:
                                    DefaultSelectedItems: =[Coalesce(varFormEsc.dur, "08h")]
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    Items: =colDurEsc
                              - lblIntEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="INTERVALO COMEÇA ÀS *"
                              - drpIntEsc:
                                  Control: DropDown@0.0.45
                                  Properties:
                                    DefaultSelectedItems: =[Coalesce(varFormEsc.intIni, "sem intervalo")]
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    Items: =colIntEsc
                              - lblIntMinEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="DURAÇÃO DO INTERVALO EM MINUTOS"
                              - txtIntMinEsc:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Duração do intervalo em minutos"
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    MaxLength: =3
                                    Value: =Coalesce(varFormEsc.intMin, "60")
                              - lblQtdEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="QUANTAS PESSOAS NESTE TURNO *"
                              - txtQtdEsc:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Quantas pessoas neste turno"
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    MaxLength: =2
                                    Value: =Coalesce(varFormEsc.qtd, "")
                              - lblRotEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="NOME DO TURNO (em branco, o app monta)"
                              - txtRotEsc:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Nome do turno"
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    MaxLength: =80
                                    Value: =Coalesce(varFormEsc.rot, "")
                              - lblOrdemEsc:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    PaddingTop: =6
                                    Size: =10
                                    Text: ="ORDEM NA LISTA"
                              - txtOrdemEsc:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Ordem na lista"
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    MaxLength: =3
                                    Value: =Coalesce(varFormEsc.ordem, "")
                              - tglAtivoEsc:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    AccessibleLabel: ="Ativo"
                                    BasePaletteColor: =thmPrimaria
                                    Checked: =Coalesce(varFormEsc.ativo, true)
                                    DisplayMode: =DisplayMode.Edit
                                    FontColor: =thmTexto
                                    Height: =44
                                    Label: ="Ativo"
                                    LabelPosition: ='Toggle.LabelPosition'.Before
                              - cntAcoesTurEsc:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =thmSuperficie
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingTop: =12
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - btnNovoTurEsc:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Secondary
                                          Height: =thmAlturaCampo
                                          OnSelect: |-
                                            =Set(varTurSelEsc, Blank());
                                            Set(
                                                varFormEsc,
                                                {
                                                    papel: "APAC",
                                                    ini: "06:00",
                                                    dur: "08h",
                                                    intIni: "10:00",
                                                    intMin: "60",
                                                    qtd: "1",
                                                    rot: "",
                                                    ordem: Text(Coalesce(Max(colEscalaCad, ordem), 0) + 1),
                                                    ativo: true
                                                }
                                            )
                                          Text: ="NOVO TURNO"
                                          Width: =130
                                    - btnSalvarTurEsc:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          FillPortions: =1
                                          Height: =thmAlturaCampo
                                          OnSelect: |-
                                            =With(
                                                {
                                                    minIni: Value(Left(drpIniEsc.Selected.Value, 2)) * 60,
                                                    minDur: Value(Left(drpDurEsc.Selected.Value, 2)) * 60,
                                                    semInt: drpIntEsc.Selected.Value = "sem intervalo",
                                                    minInt: If(drpIntEsc.Selected.Value = "sem intervalo", 0, Value(Left(drpIntEsc.Selected.Value, 2)) * 60)
                                                },
                                                With(
                                                    {
                                                        // posição do intervalo dentro do turno, contando a virada da meia-noite
                                                        relInt: Mod(minInt - minIni + 1440, 1440)
                                                    },
                                                    If(
                                                        IsBlank(drpPapelEsc.Selected.Value),
                                                        Notify("Escolha quem trabalha no turno.", NotificationType.Error, 6000),
                                                        IsBlank(drpIniEsc.Selected.Value) Or IsBlank(drpDurEsc.Selected.Value),
                                                        Notify("Informe o início e a presença do turno.", NotificationType.Error, 6000),
                                                        !IsNumeric(txtQtdEsc.Value) Or Value(txtQtdEsc.Value) < 1 Or Value(txtQtdEsc.Value) <> Int(Value(txtQtdEsc.Value)),
                                                        Notify("Quantidade precisa ser um número inteiro maior que zero.", NotificationType.Error, 6000),
                                                        !semInt And (!IsNumeric(txtIntMinEsc.Value) Or Value(txtIntMinEsc.Value) < 1),
                                                        Notify("Duração do intervalo precisa ser um número de minutos maior que zero.", NotificationType.Error, 6000),
                                                        !semInt And relInt + Value(txtIntMinEsc.Value) > minDur,
                                                        Notify("O intervalo cai fora do turno. Escolha um horário entre o início e o fim da presença.", NotificationType.Error, 8000),
                                                        Trim(txtOrdemEsc.Value) <> "" And !IsNumeric(txtOrdemEsc.Value),
                                                        Notify("Ordem precisa ser um número.", NotificationType.Error, 6000),
                                                        UpdateContext(
                                                            {
                                                                locErroTurEsc: IsError(
                                                                    Patch(
                                                                        tb_apacEscala,
                                                                        If(
                                                                            IsBlank(varTurSelEsc.ID),
                                                                            Defaults(tb_apacEscala),
                                                                            LookUp(tb_apacEscala, ID = varTurSelEsc.ID)
                                                                        ),
                                                                        {
                                                                            aeroporto: varAero,
                                                                            competencia: varComp,
                                                                            papel: drpPapelEsc.Selected.Value,
                                                                            rotulo: If(
                                                                                Trim(txtRotEsc.Value) = "",
                                                                                drpPapelEsc.Selected.Value & " " & Left(drpIniEsc.Selected.Value, 2) & "h–" &
                                                                                Right("0" & Text(Int(Mod(minIni + minDur, 1440) / 60)), 2) & "h" &
                                                                                If(semInt, " (sem intervalo)", " (intervalo " & Left(drpIntEsc.Selected.Value, 2) & "h)"),
                                                                                Trim(txtRotEsc.Value)
                                                                            ),
                                                                            hora_inicio: minIni,
                                                                            duracao_min: minDur,
                                                                            // sem intervalo: grava início = início do turno e 0 minuto, que a regra de cobertura ignora
                                                                            intervalo_inicio: If(semInt, minIni, minInt),
                                                                            intervalo_min: If(semInt, 0, Value(txtIntMinEsc.Value)),
                                                                            quantidade: Value(txtQtdEsc.Value),
                                                                            ordem: If(IsNumeric(txtOrdemEsc.Value), Value(txtOrdemEsc.Value), 0),
                                                                            ativo: If(tglAtivoEsc.Checked, 1, 0)
                                                                        }
                                                                    )
                                                                )
                                                            }
                                                        );
                                                        If(
                                                            locErroTurEsc,
                                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                                            Set(varTurSelEsc, Blank());
                                                            Set(varFormEsc, Blank());
                                                            Select(btnLerEsc);
                                                            Notify("Turno gravado. A ANÁLISE já está recalculada com ele.", NotificationType.Success, 6000)
                                                        )
                                                    )
                                                )
                                            )
                                          Text: ="SALVAR"
