# SONDAS — Inspeção de Pista: NÃO colar no app de produção. Arquivo > Salvar como (cópia),
# criar tela em branco, renomear para scrSondaOffline, Exibição de código > substituir tudo, arrastar a
# tela para o topo da árvore (vira a tela inicial da cópia), publicar a cópia e abrir no tablet.
# LOCALE: formato INVARIANTE ("," separa argumentos, ";" encadeia, "." decimal). NÃO converter.
#
Screens:
  scrSondaOffline:
    Children:
      - sondaTitulo:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =18
            Text: ="Sondas offline · piloto Inspeção de Pista"
            VerticalAlign: =VerticalAlign.Top
            Width: =900
            Wrap: =true
            X: =20
            Y: =8
      - sondaInstrucao:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =30
            Size: =11
            Text: ="Use numa CÓPIA do app, no tablet. Anote cada resultado em Inspeções/build/sondas_offline.md. Depois de S3, toque em Apagar sonda."
            VerticalAlign: =VerticalAlign.Top
            Width: =1320
            Wrap: =true
            X: =20
            Y: =44
      - sondaStatus:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =12
            Text: |-
              ="Conexão: " & If(Connection.Connected, "on-line", "OFF-LINE") & "   |   Host: " & Host.OSType
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =950
            Y: =8
      - sondaBtnS2Gravar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS2: ""});
              ClearCollect(
                  colSondaS2,
                  {texto: "sonda", numero: 1.5, quando: Now(), marcado: true}
              );
              IfError(
                  SaveData(colSondaS2, "an_sonda_s2"),
                  UpdateContext({locSondaS2: "ERRO SaveData: " & FirstError.Message & " | "})
              );
              UpdateContext({locSondaS2: locSondaS2 & "gravado às " & Text(Now(), "hh:mm:ss") & ". Feche o app (deslize para fechar), abra de novo e toque em S2 Ler."})
            Size: =11
            Text: ="S2 · Gravar dados"
            Visible: =true
            Width: =250
            X: =20
            Y: =90
      - sondaBtnS2Ler:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS2: ""});
              Clear(colSondaS2);
              IfError(
                  LoadData(colSondaS2, "an_sonda_s2", true),
                  UpdateContext({locSondaS2: "ERRO LoadData: " & FirstError.Message & " | "})
              );
              UpdateContext(
                  {
                      locSondaS2: locSondaS2 & "lidos " & CountRows(colSondaS2) & ": " &
                          First(colSondaS2).texto & " / " & First(colSondaS2).numero & " / " &
                          Text(First(colSondaS2).quando, "dd/mm/yyyy hh:mm:ss") & " / " & First(colSondaS2).marcado
                  }
              )
            Size: =11
            Text: ="S2 · Ler dados"
            Visible: =true
            Width: =250
            X: =20
            Y: =150
      - sondaResS2:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =110
            Size: =11
            Text: =locSondaS2
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =280
            Y: =90
      - sondaBtnS6:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaFotoUri: Substitute(JSON(sondaImgCapturada.Image, JSONFormat.IncludeBinaryData), Char(34), "")});
              UpdateContext({locSondaS6: "base64: " & Len(locSondaFotoUri) & " caracteres (" & Round(Len(locSondaFotoUri) / 1048576, 2) & " MB) | "});
              ClearCollect(
                  colSondaFotos,
                  {chave: "foto1", dataUri: locSondaFotoUri}
              );
              IfError(
                  SaveData(colSondaFotos, "an_sonda_fotos"),
                  UpdateContext({locSondaS6: locSondaS6 & "ERRO SaveData: " & FirstError.Message & " | "})
              );
              UpdateContext({locSondaS6: locSondaS6 & "guardado às " & Text(Now(), "hh:mm:ss")})
            Size: =11
            Text: ="S6 · Converter foto e guardar"
            Visible: =true
            Width: =250
            X: =20
            Y: =220
      - sondaResS6:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =50
            Size: =11
            Text: =locSondaS6
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =280
            Y: =220
      - sondaBtnS4:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS4: ""});
              Clear(colSondaFotos);
              IfError(
                  LoadData(colSondaFotos, "an_sonda_fotos", true),
                  UpdateContext({locSondaS4: "ERRO LoadData: " & FirstError.Message & " | "})
              );
              UpdateContext({locSondaS4: locSondaS4 & "fotos lidas: " & CountRows(colSondaFotos) & " | tamanho: " & Len(First(colSondaFotos).dataUri) & " (a foto tem de aparecer no quadro 2)"})
            Size: =11
            Text: ="S4 · Ler foto convertida"
            Visible: =true
            Width: =250
            X: =20
            Y: =280
      - sondaResS4:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =50
            Size: =11
            Text: =locSondaS4
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =280
            Y: =280
      - sondaBtnS4bGravar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS4b: ""});
              ClearCollect(
                  colSondaFotoBruta,
                  {chave: "foto1", img: sondaImgCapturada.Image}
              );
              IfError(
                  SaveData(colSondaFotoBruta, "an_sonda_foto_bruta"),
                  UpdateContext({locSondaS4b: "ERRO SaveData: " & FirstError.Message & " | "})
              );
              UpdateContext({locSondaS4b: locSondaS4b & "guardado às " & Text(Now(), "hh:mm:ss") & ". Feche e reabra o app antes de ler."})
            Size: =11
            Text: ="S4b · Guardar foto sem converter"
            Visible: =true
            Width: =250
            X: =20
            Y: =340
      - sondaBtnS4bLer:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS4b: ""});
              Clear(colSondaFotoBruta);
              IfError(
                  LoadData(colSondaFotoBruta, "an_sonda_foto_bruta", true),
                  UpdateContext({locSondaS4b: "ERRO LoadData: " & FirstError.Message & " | "})
              );
              UpdateContext({locSondaS4b: locSondaS4b & "lidas: " & CountRows(colSondaFotoBruta) & " (a foto tem de aparecer no quadro 3)"})
            Size: =11
            Text: ="S4b · Ler foto sem converter"
            Visible: =true
            Width: =250
            X: =20
            Y: =400
      - sondaResS4b:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =110
            Size: =11
            Text: =locSondaS4b
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =280
            Y: =340
      - sondaBtnLimpar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =IfError(ClearData("an_sonda_s2"), false);
              IfError(ClearData("an_sonda_fotos"), false);
              IfError(ClearData("an_sonda_foto_bruta"), false);
              UpdateContext({locSondaS2: "arquivos da sonda apagados do aparelho", locSondaS4: "", locSondaS4b: "", locSondaS6: ""})
            Size: =11
            Text: ="Apagar arquivos da sonda"
            Visible: =true
            Width: =250
            X: =20
            Y: =460
      - sondaBtnS3Gravar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS3: "", locSondaS3Inicio: Now()});
              IfError(
                  Patch(
                      '7.4.1-tbl_InspPistaItens',
                      Defaults('7.4.1-tbl_InspPistaItens'),
                      {
                          Hash: "SONDA-S3",
                          IdInsp: 0,
                          Status: "SONDA",
                          UsuarioCriador: "SONDA OFFLINE (apagar)",
                          Foto: sondaImgLida.Image
                      }
                  ),
                  UpdateContext({locSondaS3: "ERRO Patch: " & FirstError.Message & " | "})
              );
              UpdateContext(
                  {
                      locSondaS3: locSondaS3 & "no servidor: " &
                          If(IsBlank(LookUp('7.4.1-tbl_InspPistaItens', Hash = "SONDA-S3").ID), "NÃO", "sim") &
                          " | " & DateDiff(locSondaS3Inicio, Now(), TimeUnit.Milliseconds) & " ms (a foto tem de aparecer no quadro 4)"
                  }
              )
            Size: =11
            Text: ="S3 · Gravar foto lida na lista"
            Visible: =true
            Width: =250
            X: =690
            Y: =90
      - sondaBtnS3Apagar:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =IfError(
                  RemoveIf('7.4.1-tbl_InspPistaItens', Hash = "SONDA-S3"),
                  UpdateContext({locSondaS3: "ERRO ao apagar: " & FirstError.Message})
              );
              UpdateContext({locSondaS3: "registro da sonda apagado da lista de itens às " & Text(Now(), "hh:mm:ss")})
            Size: =11
            Text: ="S3 · Apagar sonda"
            Visible: =true
            Width: =250
            X: =690
            Y: =150
      - sondaResS3:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =110
            Size: =11
            Text: =locSondaS3
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =950
            Y: =90
      - sondaBtnS13:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =ClearCollect(
                  colSondaRand,
                  ForAll(Sequence(3), {r: Rand()})
              );
              UpdateContext({locSondaS13: "3 sorteios dentro de ForAll: " & Concat(colSondaRand, Text(r, "0.000000"), "  |  ")})
            Size: =11
            Text: ="S13 · Rand em ForAll"
            Visible: =true
            Width: =250
            X: =690
            Y: =220
      - sondaResS13:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =50
            Size: =11
            Text: =locSondaS13
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =950
            Y: =220
      - sondaBtnS16:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS16a: "não rodou", locSondaS16b: "não rodou"});
              Select(sondaBtnOcultoDesabilitado);
              Select(sondaBtnOcultoHabilitado)
            Size: =11
            Text: ="S16 · Select em botão oculto"
            Visible: =true
            Width: =250
            X: =690
            Y: =280
      - sondaResS16:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =50
            Size: =11
            Text: |-
              ="oculto e desabilitado: " & locSondaS16a & "  |  oculto e habilitado: " & locSondaS16b
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =950
            Y: =280
      - sondaBtnS17:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext(
                  {
                      locSondaS17: "maior ID na lista de itens: " & First(Sort('7.4.1-tbl_InspPistaItens', ID, SortOrder.Descending)).ID &
                          "  |  maior ID em tbl_inspMenu: " & First(Sort(tbl_inspMenu, ID, SortOrder.Descending)).ID &
                          "  |  itens de menu PISTA carregados: " & CountRows(col_inspPistaMenu) & " (0 enquanto a tela principal não abriu)"
                  }
              )
            Size: =11
            Text: ="S17 · Tamanho das listas"
            Visible: =true
            Width: =250
            X: =690
            Y: =340
      - sondaResS17:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =110
            Size: =11
            Text: =locSondaS17
            VerticalAlign: =VerticalAlign.Top
            Width: =400
            Wrap: =true
            X: =950
            Y: =340
      - sondaLegendaFotos:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(51, 51, 51, 1)
            Height: =24
            Size: =10
            Text: ="1 capturada   ·   2 base64 relida   ·   3 sem conversão relida   ·   4 gravada no SharePoint"
            VerticalAlign: =VerticalAlign.Top
            Width: =900
            Wrap: =true
            X: =20
            Y: =520
      - sondaImgCapturada:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =sondaAddMedia.Media
            ImagePosition: =ImagePosition.Fit
            Width: =200
            X: =20
            Y: =548
      - sondaImgLida:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =First(colSondaFotos).dataUri
            ImagePosition: =ImagePosition.Fit
            Width: =200
            X: =240
            Y: =548
      - sondaImgBruta:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =First(colSondaFotoBruta).img
            ImagePosition: =ImagePosition.Fit
            Width: =200
            X: =460
            Y: =548
      - sondaImgServidor:
          Control: Image@2.2.3
          Properties:
            Height: =150
            Image: =LookUp('7.4.1-tbl_InspPistaItens', Hash = "SONDA-S3").Foto.Full
            ImagePosition: =ImagePosition.Fit
            Width: =200
            X: =680
            Y: =548
      - sondaAddMedia:
          Control: AddMedia@2.2.1
          Properties:
            Height: =150
            Width: =200
            X: =20
            Y: =548
      - sondaBtnOcultoDesabilitado:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Disabled
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS16a: "RODOU"})
            Size: =11
            Text: ="oculto desabilitado"
            Visible: =false
            Width: =250
            X: =690
            Y: =460
      - sondaBtnOcultoHabilitado:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            OnSelect: |-
              =UpdateContext({locSondaS16b: "RODOU"})
            Size: =11
            Text: ="oculto habilitado"
            Visible: =false
            Width: =250
            X: =690
            Y: =460
