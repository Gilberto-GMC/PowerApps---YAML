Screens:
  frmInspPistaMob:
    Properties:
      OnVisible: |
        =If(
            Host.OSType = "Windows" And varControleIndex = true,
            Set(
                var_usuarioID,
                Param("USUARIO")
            );
            If(
                Mid(
                    Param("LOGADO"),
                    13,
                    8
                ) = Text(
                    Now(),
                    "ddmmyyyy"
                ),
                UpdateContext({var_visibleErro: false}),
                UpdateContext({var_visibleErro: true})
            ),
            If(
                IsBlank(
                    LookUp(
                        User,
                        Email = User().Email
                    )
                ),
                UpdateContext({var_visibleContaErro: true}),
                UpdateContext({var_visibleContaErro: false})
            )
        );
        UpdateContext({var_visibleErro: false});
        UpdateContext({var_visibleInspecaoCad1: false});
        Select(IconRefreshInspPistaMob);
        ClearCollect(
            col_inspPistaMenu,
            Filter(
                tbl_inspMenu,
                inspecao = "PISTA"
            )
        );
        Set(
            var_visibleHome,
            true
        );
