                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: "=// ⏳ Inicia indicador de carregamento\nUpdateContext({var_loadVincularInspPista: true});\n\n// \U0001F4DD Cria inspeção principal a partir do dado temporário\nWith(\n    {\n        novoRegistro: Patch(\n            '7.4-tbl_InspPista',\n            Defaults('7.4-tbl_InspPista'),\n            LookUp(col_inspPista_mob_temp, hash = var_hash)\n        )\n    },\n    \n    UpdateContext({var_idInspRegister: novoRegistro});\n\n    // \U0001F194 Atualiza campo ID_pk e gera protocolo\n    Patch(\n        '7.4-tbl_InspPista',\n        novoRegistro,\n        {\n            ID_pk: novoRegistro.ID,\n            Protocolo: varIATAUser & \"-INSP-PISTA-\" & novoRegistro.ID\n        }\n    );\n\n    // \U0001F4CB Registra todos os itens da inspeção\n    ForAll(\n        col_inspPistaItens_mob_temp,\n        Patch(\n            '7.4.1-tbl_InspPistaItens',\n            Defaults('7.4.1-tbl_InspPistaItens'),\n            {\n                IdInsp: novoRegistro.ID,\n                Bloco: ThisRecord.Bloco,\n                IATA: ThisRecord.IATA,\n                Aeroporto: ThisRecord.Aeroporto,\n                Local: ThisRecord.Local,\n                Item: ThisRecord.Item,\n                sIten: ThisRecord.sIten,\n                Latitude: ThisRecord.Latitude,\n                Longitude: ThisRecord.Longitude,\n                Status: \"Pendente\",\n                DataInicioApont: ThisRecord.DataInicioApont,\n                HoraInicioApont: ThisRecord.HoraInicioApont,\n                UsuarioCriador: ThisRecord.UsuarioCriador,\n                Hash: ThisRecord.Hash,\n                Foto: ThisRecord.Foto,\n                Foto2: ThisRecord.Foto2,\n                Foto3: ThisRecord.Foto3\n            }\n        )\n    );\n\n    // \U0001F9FE Recupera os itens recém-criados para adicionar protocolo item a item\n    ClearCollect(\n        col_addProtocoloItens,\n        Filter(\n            '7.4.1-tbl_InspPistaItens',\n            IdInsp = novoRegistro.ID\n        )\n    );\n\n    ForAll(\n        col_addProtocoloItens,\n        Patch(\n            '7.4.1-tbl_InspPistaItens',\n            ThisRecord,\n            {\n                Protocolo: varIATAUser & \"-INSP-PISTA-ITEM-\" & ThisRecord.ID\n            }\n        )\n    );\n\n    // \U0001F3A4 Salva anotações de áudio, se existirem\n    If(\n        CountRows(col_anotacaoAudio_mob) > 0,\n        ForAll(\n            col_anotacaoAudio_mob,\n            Patch(\n                tbl_inspPistaAnotacao,\n                Defaults(tbl_inspPistaAnotacao),\n                {\n                    ID_FK: novoRegistro.ID,\n                    Audio: ThisRecord.AUDIO,\n                    Local: ThisRecord.LOCAL,\n                    Item: ThisRecord.ITEM,\n                    SItem: ThisRecord.SITEM\n                }\n            )\n        )\n    );\n\n    // ✅ Finaliza carregamento quando registros forem compatíveis\n    If(\n        CountRows(\n            Filter(\n                FirstN(\n                    Sort(\n                        '7.4.1-tbl_InspPistaItens',\n                        ID,\n                        SortOrder.Descending\n                    ),\n                    100\n                ),\n                IdInsp = novoRegistro.ID\n            )\n        ) = CountRows(GalleryResumo_7.AllItems),\n        UpdateContext({var_loadVincularInspPista: false})\n    )\n)\n"
                              PaddingLeft: =0
