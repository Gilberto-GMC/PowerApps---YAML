App:
  Properties:
    OnStart: "=// \U0001F504 Inicializa carregamentos\nSet(var_load, true);\nSet(varControleIndex, true);\n/*\n// \U0001F195 Carrega última versão do sistema\nSet(\n    var_ultimaVersao;\n    Value(Max(tbl_controle_versoes; Numero_versao))\n);;*/\n\n// \U0001F5FA️ (Descomente se quiser capturar localização)\n// Set(var_latitude; Location.Latitude);;\n// Set(var_longitude; Location.Longitude);;\n\n// ✈️ Carrega lista de aeroportos fixos\nClearCollect(\n    colAeros,\n    {IATA: \"\", ICAO: \"\", Bloco: \"CENTRAL\", Aeroporto: \"\", Cluster: \"\"},\n    {IATA: \"GYN\", ICAO: \"SBGO\", Bloco: \"CENTRAL\", Aeroporto: \"GOIÂNIA\", Cluster: \"GOIÂNIA\"},\n    {IATA: \"IMP\", ICAO: \"SBIZ\", Bloco: \"CENTRAL\", Aeroporto: \"IMPERATRIZ\", Cluster: \"GOIÂNIA\"},\n    {IATA: \"PMW\", ICAO: \"SBPJ\", Bloco: \"CENTRAL\", Aeroporto: \"PALMAS\", Cluster: \"GOIÂNIA\"},\n    {IATA: \"PLU\", ICAO: \"SBBH\", Bloco: \"CENTRAL\", Aeroporto: \"PAMPULHA\", Cluster: \"GOIÂNIA\"},\n    {IATA: \"PNZ\", ICAO: \"SBPL\", Bloco: \"CENTRAL\", Aeroporto: \"PETROLINA\", Cluster: \"SÃO LUÍS\"},\n    {IATA: \"SLZ\", ICAO: \"SBSL\", Bloco: \"CENTRAL\", Aeroporto: \"SÃO LUIS\", Cluster: \"SÃO LUÍS\"},\n    {IATA: \"THE\", ICAO: \"SBTE\", Bloco: \"CENTRAL\", Aeroporto: \"TERESINA\", Cluster: \"SÃO LUÍS\"},\n    {IATA: \"\", ICAO: \"\", Bloco: \"SUL\", Aeroporto: \"\", Cluster: \"\"},\n    {IATA: \"BFH\", ICAO: \"SBBI\", Bloco: \"SUL\", Aeroporto: \"BACACHERI\", Cluster: \"CURITIBA\"},\n    {IATA: \"CWB\", ICAO: \"SBCT\", Bloco: \"SUL\", Aeroporto: \"CURITIBA\", Cluster: \"CURITIBA\"},\n    {IATA: \"JOI\", ICAO: \"SBJV\", Bloco: \"SUL\", Aeroporto: \"JOINVILLE\", Cluster: \"CURITIBA\"},\n    {IATA: \"NVT\", ICAO: \"SBNF\", Bloco: \"SUL\", Aeroporto: \"NAVEGANTES\", Cluster: \"CURITIBA\"},\n    {IATA: \"BGX\", ICAO: \"SBBG\", Bloco: \"SUL\", Aeroporto: \"BAGÉ\", Cluster: \"FOZ DO IGUAÇU\"},\n    {IATA: \"IGU\", ICAO: \"SBFI\", Bloco: \"SUL\", Aeroporto: \"FOZ DO IGUAÇU\", Cluster: \"FOZ DO IGUAÇU\"},\n    {IATA: \"LDB\", ICAO: \"SBLO\", Bloco: \"SUL\", Aeroporto: \"LONDRINA\", Cluster: \"FOZ DO IGUAÇU\"},\n    {IATA: \"PET\", ICAO: \"SBPK\", Bloco: \"SUL\", Aeroporto: \"PELOTAS\", Cluster: \"FOZ DO IGUAÇU\"},\n    {IATA: \"URG\", ICAO: \"SBUG\", Bloco: \"SUL\", Aeroporto: \"URUGUAIANA\", Cluster: \"FOZ DO IGUAÇU\"}\n);\n\n// \U0001F464 Carrega informações do usuário com base no parâmetro\nSet(varIdUser, Coalesce( Value(Param(\"USUARIO\")), LookUp(User, usrNome = User().FullName).ID ));\n// Agrupa todas as variáveis relacionadas ao usuário em um só `With`\nWith(\n    {\n        usuario: LookUp(User, ID = varIdUser),\n        iataUsuario: LookUp(colAeros, Aeroporto = LookUp(User, ID = varIdUser).Aeroporto).IATA\n    },\n    \n    Set(varNomeUser, usuario.usrNome);\n    Set(varEmailUser, usuario.Email);\n    Set(varFuncaoUser, usuario.Funcao);\n    Set(varBlocoUser, usuario.Bloco);\n    Set(varAeroUser, usuario.Aeroporto);\n    Set(varPerfilUser, usuario.Perfil);\n    Set(varAutUser, usuario.Autorizacao);\n    Set(varIATAUser, iataUsuario)\n);\n\n// ✅ Finaliza carregamento\nSet(var_load, false);\n// \U0001F6A8 Carrega itens não conformes (hoje) por local\nConcurrent(\n        ClearCollect(\n            col_itensPouso,\n            Filter(\n                '7.4.1-tbl_InspPistaItens',\n                Aeroporto = varAeroUser && Local = \"Pista de Pouso\" && Status = \"Não conforme\" && Year(Criado) = Year(Today())\n            )\n        ),\n        ClearCollect(\n            col_itensTaxi,\n            Filter(\n                '7.4.1-tbl_InspPistaItens',\n                Aeroporto = varAeroUser && Local = \"Pista de taxi\" && Status = \"Não conforme\" && Year(Criado) = Year(Today())\n            )\n        ),\n        ClearCollect(\n            col_itensAids,\n            Filter(\n                '7.4.1-tbl_InspPistaItens',\n                Aeroporto = varAeroUser && Local = \"NAV AIDS\" && Status = \"Não conforme\" && Year(Criado) = Year(Today())\n            )\n        )\n    );"
    Theme: =CCR
