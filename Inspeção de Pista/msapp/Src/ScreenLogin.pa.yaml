Screens:
  ScreenLogin:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      ImagePosition: =ImagePosition.Fill
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Container21_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            PaddingBottom: =30
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: |
              =Parent.Width
          Children:
            - Icon1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AlignInContainer: =AlignInContainer.End
                  Height: =50
                  Icon: =Icon.Leave
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: =Exit()
                  PaddingBottom: =5
                  PaddingTop: =5
                  Width: =50
            - Label45_3:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(9, 33, 98, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =If(Container21_1.Height < 800, 100, 200)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =0
                  Size: =60
                  Text: ="Airport Now"
                  Width: =Parent.Width
            - Label18_13:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Height: =20
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Text: =""
            - Label4_6:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =RGBA(122, 122, 122, 1)
                  Font: =Font.'Segoe UI'
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =30
                  Text: ="Usuário"
                  X: =48
                  Y: =135
            - txtUser_2:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =1
                  Default: =
                  DisabledBorderColor: =RGBA(39, 113, 194, 1)
                  DisabledColor: =RGBA(39, 113, 194, 1)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =80
                  HintText: =
                  HoverBorderColor: =RGBA(39, 113, 194, 1)
                  HoverColor: =RGBA(39, 113, 194, 1)
                  HoverFill: =RGBA(247, 247, 247, 1)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =0
                  PaddingTop: =3
                  Size: =25
                  Width: =485
                  X: =72
                  Y: =180
            - Label4_7:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =RGBA(122, 122, 122, 1)
                  Font: =Font.'Segoe UI'
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =30
                  Text: ="Senha"
                  X: =48
                  Y: =241
            - txtSenha_2:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =1
                  Default: =""
                  DisabledBorderColor: =RGBA(39, 113, 194, 1)
                  DisabledColor: =RGBA(39, 113, 194, 1)
                  Fill: =RGBA(245, 245, 245, 1)
                  Height: =80
                  HintText: =
                  HoverBorderColor: =RGBA(39, 113, 194, 1)
                  HoverColor: =RGBA(39, 113, 194, 1)
                  HoverFill: =RGBA(247, 247, 247, 1)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =0
                  Mode: =TextMode.Password
                  PaddingTop: =3
                  Size: =25
                  Width: =485
                  X: =72
                  Y: =289
            - Label18_11:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Height: =100
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Text: =""
            - Container1_1:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =RGBA(9, 33, 98, 1)
                  FillPortions: =0
                  Height: =150
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =100
                  RadiusBottomRight: =100
                  RadiusTopLeft: =100
                  RadiusTopRight: =100
                  Width: =150
                Children:
                  - Icon39:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =Parent.Height
                        HoverColor: =RGBA(71, 158, 245, 1)
                        Icon: =Icon.NextArrow
                        OnSelect: |-
                          =UpdateContext({var_visibleSpinLoader: true});
                          UpdateContext(
                              {
                                  varTempPass: First(
                                      SortByColumns(
                                          Filter(
                                              User,
                                              Usuarios = txtUser_2.Text
                                          ),
                                          "ID",
                                          SortOrder.Ascending
                                      )
                                  ).Senha
                              }
                          );
                          If(
                              LookUp(
                                  User,
                                  Usuarios = txtUser_2.Text,
                                  Senha = Concatenate(
                                      Left(
                                          txtSenha_2.Text,
                                          2
                                      ),
                                      Mid(
                                          varTempPass,
                                          3,
                                          110
                                      ),
                                      Mid(
                                          txtSenha_2.Text,
                                          3,
                                          2
                                      ),
                                      Mid(
                                          varTempPass,
                                          115,
                                          110
                                      ),
                                      Mid(
                                          txtSenha_2.Text,
                                          5
                                      )
                                  )
                              ),
                              Set(
                                  varIdUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).ID
                              );
                              Set(
                                  varNomeUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).usrNome
                              );
                              Set(
                                  varEmailUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Email
                              );
                              Set(
                                  varFuncaoUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Funcao
                              );
                              Set(
                                  varBlocoUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Bloco
                              );
                              Set(
                                  varAeroUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Aeroporto
                              );
                              Set(
                                  varICAOUser,
                                  LookUp(
                                      colAeros,
                                      Aeroporto = varAeroUser
                                  ).ICAO
                              );
                              Set(
                                  varIATAUser,
                                  LookUp(
                                      colAeros,
                                      Aeroporto = varAeroUser
                                  ).IATA
                              );
                              Set(
                                  varPerfilUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Perfil
                              );
                              Set(
                                  varAutUser,
                                  LookUp(
                                      User,
                                      Usuarios = txtUser_2.Text
                                  ).Autorizacao
                              );
                              // 📄 Carrega inspeções do dia para o aeroporto do usuário
                          ClearCollect(
                                  col_inspPista_mob,
                                  SortByColumns(
                                      Filter(
                                          '7.4-tbl_InspPista',
                                          StartsWith(
                                              Aeroporto,
                                              varAeroUser
                                          ) && Data = Today()
                                      ),
                                      "ID",
                                      SortOrder.Descending
                                  )
                              );
                              // 🔁 Inicializa coleções temporárias vazias (mantém estrutura)
                          ClearCollect(
                                  col_inspPista_mob_temp,
                                  FirstN(
                                      col_inspPista_mob,
                                      0
                                  )
                              );
                              ClearCollect(
                                  col_inspPistaItens_mob_temp,
                                  FirstN(
                                      AddColumns(
                                          '7.4.1-tbl_InspPistaItens',
                                          InspHash,
                                          ""
                                      ),
                                      0
                                  )
                              );
                              // 🚨 Carrega itens não conformes (hoje) por local
                          Concurrent(
                                  ClearCollect(
                                      col_itensPouso,
                                      Filter(
                                          '7.4.1-tbl_InspPistaItens',
                                          Aeroporto = varAeroUser && Local = "Pista de Pouso" && Status = "Não conforme" && Year(Criado) = Year(Today())
                                      )
                                  ),
                                  ClearCollect(
                                      col_itensTaxi,
                                      Filter(
                                          '7.4.1-tbl_InspPistaItens',
                                          Aeroporto = varAeroUser && Local = "Pista de taxi" && Status = "Não conforme" && Year(Criado) = Year(Today())
                                      )
                                  ),
                                  ClearCollect(
                                      col_itensAids,
                                      Filter(
                                          '7.4.1-tbl_InspPistaItens',
                                          Aeroporto = varAeroUser && Local = "NAV AIDS" && Status = "Não conforme" && Year(Criado) = Year(Today())
                                      )
                                  )
                              );
                              Set(
                                  Logado,
                                  true
                              );
                              Navigate(
                                  frmInspPistaMob,
                                  ScreenTransition.Fade
                              ),
                              Notify(
                                  "Usuario ou Senha não conferem",
                                  NotificationType.Error
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        Width: =Parent.Width
            - Label18_12:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  Height: =10
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Text: =""
