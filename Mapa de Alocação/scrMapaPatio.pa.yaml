                                =If(
                                    locHangarExcluir = 0,
                                    UpdateContext({ locHangarExcluir: 1 });
                                    Notify("Toque de novo em EXCLUIR para confirmar.", NotificationType.Warning, 4000),
                                    IfError(
                                        Patch(tb_alocacoesMapa, LookUp(tb_alocacoesMapa, ID = locHangarEdit.id), { ativo: 0 });
                                        UpdateContext({ locHangarForm: false, locHangarExcluir: 0 });
                                        Notify("Registro excluído.", NotificationType.Success, 3000);
                                        Select(btnAtualizarMap),
                                        Notify("Não foi possível excluir. Nada foi alterado.", NotificationType.Error, 6000)
                                    )
                                )
                              Text: =If(locHangarExcluir = 1, "CONFIRMAR", "EXCLUIR")
                              Visible: =!IsBlank(locHangarEdit.id)
                              Width: =130
            - lblHangarListaMap:
                Control: Label@2.5.1
                Properties:
                  Color: =thmTextoFraco
                  Font: =thmFonte
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  Size: =10
                  Text: ="NESTA DATA — TOQUE PARA EDITAR"
            - galHangarListaMap:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderStyle: =BorderStyle.None
                  Fill: =thmFundo
                  FillPortions: =0
                  Height: =Max(46, CountRows(Filter(colHangarDia, (drpHangarFiltroMap.Selected.Value = "TODOS OS HANGARES" Or posicao_txt = drpHangarFiltroMap.Selected.Value) And (IsBlank(Trim(txtHangarBuscaMap.Value)) Or Upper(Trim(txtHangarBuscaMap.Value)) in Upper(Coalesce(prefixo, ""))))) * 46)
                  Items: =Sort(Filter(colHangarDia, (drpHangarFiltroMap.Selected.Value = "TODOS OS HANGARES" Or posicao_txt = drpHangarFiltroMap.Selected.Value) And (IsBlank(Trim(txtHangarBuscaMap.Value)) Or Upper(Trim(txtHangarBuscaMap.Value)) in Upper(Coalesce(prefixo, "")))), If(abs_fim > varHangarRefMin, 0, 100000000) + abs_ini, SortOrder.Ascending)
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =46
                Children:
                  - cntLinhaHangarMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmTransparente
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =galHangarListaMap.Width
                      Children:
                        - btnHangarItemMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =1
                              FontSize: =11
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =UpdateContext(
                                    {
                                        locHangarPos: LookUp(colHangaresAero As _h, _h.id = ThisItem.id_posicao),
                                        locHangarEdit: ThisItem,
                                        locHangarExcluir: 0,
                                        locNonceEq: locNonceEq + 1,
                                        locEquipSug: "",
                                        locHangarDados: {
                                            prefixo: Coalesce(ThisItem.prefixo, ""),
                                            equip: Coalesce(ThisItem.equip, "—"),
                                            data: ThisItem.data_ini,
                                            hora: Text(Int(ThisItem.h_ini / 60), "00") & ":" & Text(Mod(ThisItem.h_ini, 60), "00"),
                                            obs: Coalesce(ThisItem.obs, "")
                                        },
                                        locHangarForm: true
                                    }
                                )
                              PaddingLeft: =10
                              PaddingRight: =10
                              Text: |-
                                =If(ThisItem.abs_fim > varHangarRefMin, "", "SAIU · ") & ThisItem.posicao_txt & "   " & Coalesce(ThisItem.prefixo, "—") & If(IsBlank(ThisItem.equip), "", " · " & ThisItem.equip) &
                                "   entrada " & Text(ThisItem.data_ini, "dd/mm") & " " & Text(Int(ThisItem.h_ini / 60), "00") & ":" & Text(Mod(ThisItem.h_ini, 60), "00") &
                                If(ThisItem.data_f = mapSaidaEmAberto, "   em aberto", "   saída " & Text(ThisItem.data_f, "dd/mm") & " " & Text(Int(ThisItem.h_fim / 60), "00") & ":" & Text(Mod(ThisItem.h_fim, 60), "00"))
                        - btnHangarSaidaMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmOperacional
                              BorderRadius: =0
                              DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =11
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    { _agora: Hour(Now()) * 60 + Minute(Now()) },
                                    If(
                                        ThisItem.data_ini > Today() Or (ThisItem.data_ini = Today() And _agora <= ThisItem.h_ini),
                                        Notify("A saída não pode ser antes da entrada.", NotificationType.Error, 5000),
                                        IfError(
                                            Patch(tb_alocacoesMapa, LookUp(tb_alocacoesMapa, ID = ThisItem.id), { data_fim: Today(), hora_fim: Max(1, _agora) });
                                            Notify("Saída registrada: " & Coalesce(ThisItem.prefixo, "") & ".", NotificationType.Success, 4000);
                                            Select(btnAtualizarMap),
                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 6000)
                                        )
                                    )
                                )
                              Text: ="SAÍDA"
                              Visible: =ThisItem.data_f = mapSaidaEmAberto
                              Width: =104
