Screens:
  scrMapaPatio:
    Properties:
      OnVisible: |-
        =Set(varMapaVisivel, true);
        Set(varPainelAberto, false);
        Set(varAlocSel, Blank());
        UpdateContext(
            {
                locPatio: "TODOS",
                locNonce: 0,
                locConfirmaConting: 0,
                locConfirmaExcluir: 0,
                locDesatualizado: false,
                locSalvando: false,
                locOcupado: Blank()
            }
        );
        Select(btnAtualizarMap)
    Children:
      - cntShellMap:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaMap:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>MOTIVA</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Select(btnAtualizarMap)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavRefMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varMapaVisivel, false);
                                Navigate(scrMapaReferencia, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavInicioMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varMapaVisivel, false);
                                Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - cntMenuRodapeMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        FillPortions: =0
                        Height: =108
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmUsuarioMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimariaEscura
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    varMenuAberto,
                                    "<div style='" & htmlFonte & "color:" & hxTextoBarra & ";font-size:10px;line-height:1.5;border-top:1px solid " & hxBordaBarra & ";padding-top:10px;'>" &
                                    "<div style='font-weight:700;'>" & Upper(Coalesce(varUsuarioNome, "USUÁRIO")) & "</div>" &
                                    "<div style='opacity:.6;'>" & varAero & " &nbsp;&middot;&nbsp; " & If(varPodeEditar, "EDIÇÃO", "SOMENTE LEITURA") & "</div>" &
                                    "</div>",
                                    ""
                                )
                              PaddingLeft: =4
                              PaddingRight: =4
                              Size: =10
                        - btnRecolherMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmBotaoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="ChevronRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuAberto, !varMenuAberto)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>MAPA DE ALOCAÇÃO DE PÁTIO</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAero & " &nbsp;&middot;&nbsp; " & Upper(Text(varData, "ddd dd/mm/yyyy")) &
                                " &nbsp;&middot;&nbsp; " & CountRows(colDia) & " registro(s)" &
                                " &nbsp;&middot;&nbsp; carregado às " & Text(varCarregadoEm, "HH:mm") &
                                "</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                        - htmKpiMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<table style='" & htmlFonte & "color:" & hxTextoBarra & ";border-spacing:14px 0;text-align:right;'><tr>" &
                                "<td><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>VOOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, tipo = "VOO")) & "</div></td>" &
                                "<td><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>PESQUISADOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, pesq = 1)) & "</div></td>" &
                                "<td><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>BLOQUEIOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, tipo <> "VOO")) & "</div></td>" &
                                "</tr></table>"
                              Size: =11
                              Width: =330
                  - cntAvisoMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmAmbar
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =locDesatualizado
                      Children:
                        - htmAvisoMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmAmbar
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";font-size:12px;font-weight:700;'>A programação deste dia foi alterada por outra pessoa. Atualize para ver a versão mais recente.</div>"
                              LayoutMinWidth: =0
                              Size: =12
                        - btnVerNovoMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmTextoBarra
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Select(btnAtualizarMap)
                              PaddingLeft: =14
                              PaddingRight: =14
                              Text: ="ATUALIZAR AGORA"
                              Width: =190
                  - cntFiltrosMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        FillPortions: =0
                        Height: =62
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - dtpDataMap:
                            Control: DatePicker@0.0.46
                            Properties:
                              AccessibleLabel: ="Data da operação"
                              FillPortions: =0
                              Format: =DateTimeFormat.ShortDate
                              SelectedDate: =varData
                              Width: =150
                        - btnVerDiaMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmTextoBarra
                              FontSize: =13
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="ArrowRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, dtpDataMap.SelectedDate);
                                Select(btnAtualizarMap)
                              PaddingLeft: =14
                              PaddingRight: =14
                              Text: ="VER DIA"
                              Width: =126
                        - btnOntemMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, DateAdd(varData, -1, TimeUnit.Days));
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="ONTEM"
                              Width: =88
                        - btnHojeMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, Today());
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="HOJE"
                              Width: =78
                        - btnAmanhaMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, DateAdd(varData, 1, TimeUnit.Days));
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="AMANHÃ"
                              Width: =96
                        - drpPatioMap:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: |-
                                =[Coalesce(LookUp(colPatios As _q, _q.patio = locPatio).nome_patio, "TODOS OS PÁTIOS")]
                              Height: =40
                              Items: =colPatiosSel
                              Width: =210
                        - btnAplicarPatioMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =UpdateContext(
                                    {
                                        locPatio: Coalesce(
                                            LookUp(colPatios As _p, _p.nome_patio = drpPatioMap.Selected.Value).patio,
                                            "TODOS"
                                        )
                                    }
                                )
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="FILTRAR"
                              Width: =104
                        - btnAtualizarMap:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmOperacional
                              BorderRadius: =0
                              FillPortions: =0
                              FontColor: =thmOperacional
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =ClearCollect(
                                    colDia,
                                    ForAll(
                                        Filter(
                                            'tb_alocacoesMapa',
                                            aeroporto = varAero And data_operacao = varData And ativo = 1
                                        ) As _r,
                                        {
                                            id: _r.ID,
                                            id_posicao: _r.id_posicao,
                                            posicao_txt: _r.posicao_txt,
                                            patio_txt: _r.patio_txt,
                                            cia: _r.cia_sigla,
                                            voo_ida: _r.voo_chegada,
                                            voo_volta: _r.voo_saida,
                                            prefixo: _r.prefixo,
                                            ini: _r.hora_inicio,
                                            fim: _r.hora_fim,
                                            portao: _r.portao,
                                            tipo: _r.tipo_registro,
                                            pesq: _r.pesquisado,
                                            env: _r.envergadura_m,
                                            obs: _r.observacao,
                                            alterado_em: _r.Modificado,
                                            alterado_por: _r.'Modificado por'.DisplayName
                                        }
                                    )
                                );
                                Set(varUltimaAlt, Max(colDia, alterado_em));
                                Set(varCarregadoEm, Now());
                                ClearCollect(
                                    colGrade,
                                    ForAll(
                                        Sort(colPosicoes, ordem, SortOrder.Ascending) As _p,
                                        With(
                                            {
                                                _bl: Sort(Filter(colDia, id_posicao = _p.id), ini, SortOrder.Ascending)
                                            },
                                            {
                                                id_posicao: _p.id,
                                                posicao: _p.posicao,
                                                patio: _p.patio,
                                                qtd: CountRows(_bl),
                                                restricao: If(
                                                    !IsBlank(_p.aeronave_max),
                                                    _p.aeronave_max,
                                                    If(_p.classe = "HELICOPTERO", "HELICÓPTERO", "CLASSE " & _p.classe)
                                                ),
                                                cor_patio: Switch(
                                                    _p.patio,
                                                    "PRINCIPAL", hxPrimaria,
                                                    "PATIO23", hxOperacional,
                                                    hxVerde
                                                ),
                                                html: "<table style='width:100%;table-layout:fixed;border-collapse:collapse;" & htmlFonte & "'><tr>" &
                                                If(
                                                    CountRows(_bl) = 0,
                                                    "<td style='height:44px;border-bottom:1px solid " & hxGradeLinha & ";'></td>",
                                                    Concat(
                                                        Sequence(CountRows(_bl)) As _i,
                                                        With(
                                                            {
                                                                _b: Index(_bl, _i.Value),
                                                                _ant: If(_i.Value = 1, 0, Index(_bl, _i.Value - 1).fim)
                                                            },
                                                            With(
                                                                {
                                                                    _cia: LookUp(colCias As _cc, _cc.sigla = _b.cia),
                                                                    _prt: LookUp(colPortoes As _pp, _pp.portao = _b.portao),
                                                                    _bloq: _b.tipo <> "VOO"
                                                                },
                                                                If(
                                                                    _b.ini > _ant,
                                                                    "<td style='width:" & Text((_b.ini - _ant) * 100 / mapMinutosDia, "0.000", "en-US") & "%;border-bottom:1px solid " & hxGradeLinha & ";'></td>",
                                                                    ""
                                                                ) &
                                                                "<td style='width:" & Text((_b.fim - _b.ini) * 100 / mapMinutosDia, "0.000", "en-US") & "%;height:44px;" &
                                                                "background:" & If(_bloq, hxTextoFraco, Coalesce(_cia.cor_hex, hxBorda)) & ";" &
                                                                "color:" & If(_bloq, hxTextoBarra, Coalesce(_cia.cor_texto, hxTexto)) & ";" &
                                                                "border:3px solid " & If(_b.pesq = 1, hxVermelho, Coalesce(_prt.cor_hex, hxBorda)) & ";" &
                                                                "font-size:10px;font-weight:700;line-height:1.2;padding:2px 3px;text-align:center;'>" &
                                                                "<div style='overflow:hidden;white-space:nowrap;'>" &
                                                                If(
                                                                    _b.pesq = 1,
                                                                    "<span style='background:" & hxVermelho & ";color:" & hxTextoBarra & ";padding:0 3px;margin-right:3px;'>P</span>",
                                                                    ""
                                                                ) &
                                                                If(
                                                                    _bloq,
                                                                    If(_b.tipo = "INTERDICAO", "INTERDITADO", "RESERVADO"),
                                                                    Trim(Coalesce(_b.cia, "") & " " & Coalesce(_b.prefixo, "")) & " " & Coalesce(_b.voo_ida, "") &
                                                                    If(!IsBlank(_b.voo_volta), "/" & _b.voo_volta, "")
                                                                ) &
                                                                "</div>" &
                                                                "<div style='font-size:8px;font-weight:600;opacity:.85;overflow:hidden;white-space:nowrap;'>" &
                                                                Text(Int(_b.ini / 60), "00") & ":" & Text(Mod(_b.ini, 60), "00") & "&ndash;" &
                                                                Text(Int(_b.fim / 60), "00") & ":" & Text(Mod(_b.fim, 60), "00") &
                                                                If(!IsBlank(_b.portao), " &middot; P" & _b.portao, "") &
                                                                "</div></td>"
                                                            )
                                                        )
                                                    ) &
                                                    With(
                                                        {
                                                            _ult: Coalesce(Last(_bl).fim, 0)
                                                        },
                                                        If(
                                                            _ult < mapMinutosDia,
                                                            "<td style='width:" & Text((mapMinutosDia - _ult) * 100 / mapMinutosDia, "0.000", "en-US") & "%;border-bottom:1px solid " & hxGradeLinha & ";'></td>",
                                                            ""
                                                        )
                                                    )
                                                ) &
                                                "</tr></table>"
                                            }
                                        )
                                    )
                                );
                                UpdateContext({locDesatualizado: false})
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="ATUALIZAR"
                              Width: =134
                        - btnNovoMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmAcao
                              BorderRadius: =0
                              DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.Disabled)
                              FillPortions: =0
                              FontColor: =thmTextoBarra
                              FontSize: =13
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Add"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varAlocSel, Blank());
                                Set(
                                    varForm,
                                    {
                                        tipo: "Voo",
                                        posicao: Coalesce(varPosSel.posicao, "T1"),
                                        cia: "—",
                                        voo_ida: "",
                                        voo_volta: "",
                                        prefixo: "",
                                        portao: "—",
                                        ini: "",
                                        fim: "",
                                        env: "",
                                        obs: "",
                                        pesq: false
                                    }
                                );
                                UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locNonce: locNonce + 1});
