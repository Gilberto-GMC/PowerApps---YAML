                        - htmReguaMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmSuperficie
                              Font: =thmFonte
                              HtmlText: |-
                                ="<table style='width:99.3%;table-layout:fixed;border-collapse:separate;border-spacing:0;" & htmlFonte & "'><tr>" &
                                "<td style='width:" & mapLarguraRotulo & "px;box-sizing:border-box;padding:0 8px 4px 12px;vertical-align:bottom;font-size:9px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>POSIÇÃO</td>" &
                                "<td style='box-sizing:border-box;padding:0;'>" &
                                // faixa das horas: um bloco por hora, a hora de agora na cor da marca
                                "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:2px 0;'><tr>" &
                                Concat(
                                    ForAll(Sequence(RoundUp(Max(varJanelaMin, 60) / 60, 0), 0) As _k, { h: RoundDown(varJanelaIni / 60, 0) + _k.Value }) As _c,
                                    "<td style='box-sizing:border-box;background:" & If(varAgoraMin >= _c.h * 60 And varAgoraMin < _c.h * 60 + 60, hxPrimaria, hxTextoFraco) &
                                    ";color:" & hxTextoBarra & ";font-size:10px;font-weight:700;text-align:center;padding:2px 0;white-space:nowrap;overflow:hidden;'>" &
                                    Text(Mod(_c.h, 24), "0") & "h</td>"
                                ) &
                                "</tr></table>" &
                                // faixa dos minutos: 0 15 30 45 em toda janela — no dia inteiro com fonte menor (cada quarto tem ~16 px)
                                If(
                                    varJanelaMin > 0,
                                    "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;margin-top:2px;'><tr>" &
                                    Concat(
                                        ForAll(Sequence(Max(varJanelaMin, 60) / 15, 0) As _k, { m: varJanelaIni + _k.Value * 15 }) As _c,
                                        "<td style='box-sizing:border-box;padding:1px 0 4px " & If(varJanelaMin > 720, "1", "3") & "px;font-size:" & If(varJanelaMin > 720, "7", "9") & "px;white-space:nowrap;overflow:hidden;border-left:1px solid " &
                                        If(Mod(_c.m, 60) = 0, hxTextoFraco, hxGradeLinha) & ";'>" &
                                        If(
                                            varAgoraMin >= _c.m And varAgoraMin < _c.m + 15,
                                            "<span style='background:" & hxPrimaria & ";color:" & hxTextoBarra & ";font-weight:700;padding:0 " & If(varJanelaMin > 720, "1", "4") & "px;'>" & Text(Mod(_c.m, 60), "0") & "</span>",
                                            "<span style='color:" & hxTextoFraco & ";font-weight:" & If(Mod(_c.m, 60) = 0, "700", "500") & ";'>" & Text(Mod(_c.m, 60), "0") & "</span>"
                                        ) & "</td>"
                                    ) &
                                    "</tr></table>",
                                    ""
                                ) &
                                "</td></tr></table>"
