                                                      Sort(Filter(tb_alocacoesMapa, prefixo = Left(_p, 2) & "-" & Mid(_p, 3), ativo = 1), ID, SortOrder.Descending),
                                                      20
                                                  ) As _y,
                                                  !IsBlank(_y.equipamento)
                                              ).equipamento
                                          )
                                      },
                                      If(
                                          !IsBlank(LookUp(colEquip As _c, _c.equip = _eq).equip),
                                          UpdateContext({ locEquipSug: _eq, locNonceEq: locNonceEq + 1 })
                                      )
                                  )
                              )
                          )
                        Placeholder: ="ex. PSESP"
                        Value: =Coalesce(varForm.prefixo, "")
                        Visible: =drpTipoMap.Selected.Value <> "Interdição"
                  - lblPrefixoAvisoMap:
