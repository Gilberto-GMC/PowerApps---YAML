                                          Coalesce(varAlocSel.id, 0) = 0,
                                          Blank(),
                                          LookUp(tb_alocacoesMapa, ID = Coalesce(varAlocSel.id, 0))
                                      ),
                                      locPos: LookUp(colPosicoesAero As _p, _p.posicao = drpPosicaoMap.Selected.Value),
                                      locTipo: Coalesce(LookUp(colTiposReg As _t, _t.rotulo = drpTipoMap.Selected.Value).tipo, "VOO"),
                                      locCia: If(drpCiaMap.Selected.Value = "—", "", drpCiaMap.Selected.Value),
                                      locPortao: If(drpPortaoMap.Selected.Value = "—", "", drpPortaoMap.Selected.Value),
                                      locEquip: If(
                                          drpEquipMap.Selected.Value = "—",
                                          "",
                                          Coalesce(LookUp(colEquip As _e, _e.nome_equip = drpEquipMap.Selected.Value).equip, "")
                                      ),
                                      locEnvDigitada: If(IsNumeric(txtEnvergaduraMap.Value), Value(txtEnvergaduraMap.Value), -1),
                                      locIni: If(
                                          IsMatch(txtIniMap.Value, "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"),
                                          Value(Left(txtIniMap.Value, 2)) * 60 + Value(Right(txtIniMap.Value, 2)),
                                          -1
                                      ),
                                      locFim: If(
                                          IsMatch(txtFimMap.Value, "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"),
                                          Value(Left(txtFimMap.Value, 2)) * 60 + Value(Right(txtFimMap.Value, 2)),
                                          -1
                                      )
                                  }
                              );
                              UpdateContext(
                                  {
                                      locEnv: If(
                                          locEnvDigitada >= 0,
                                          locEnvDigitada,
                                          Coalesce(LookUp(colEquip As _e, _e.equip = locEquip).envergadura_m, 0)
                                      ),
                                      locComp: Coalesce(LookUp(colEquip As _ec, _ec.equip = locEquip).comprimento_m, 0),
                                      locCompMax: Coalesce(
                                          LookUp(colPosicoesAero As _pc, _pc.posicao = drpPosicaoMap.Selected.Value).comp_max,
                                          0
                                      ),
                                      locEnvMax: With(
                                          { _pm: LookUp(colPosicoesAero As _pp, _pp.posicao = drpPosicaoMap.Selected.Value) },
                                          If(
                                              _pm.env_max > 0,
                                              _pm.env_max,
                                              Coalesce(LookUp(colEquip As _em, _em.equip = _pm.equip_max).envergadura_m, 0)
                                          )
                                      ),
                                      locDias: DateDiff(locDataIni, locDataFim, TimeUnit.Days),
                                      locAbsIni: DateDiff(mapDataBase, locDataIni, TimeUnit.Days) * mapMinutosDia + locIni,
                                      locAbsFim: DateDiff(mapDataBase, locDataFim, TimeUnit.Days) * mapMinutosDia + locFim
                                  }
                              );
                              ClearCollect(
                                  colValida,
                                  ForAll(
                                      Filter(
                                          tb_alocacoesMapa,
                                          aeroporto = varAero And data_operacao <= locDataFim And data_fim >= locDataIni And ativo = 1
                                      ) As _v,
                                      {
                                          id: _v.ID,
                                          id_posicao: _v.id_posicao,
                                          posicao_txt: _v.posicao_txt,
                                          portao: _v.portao,
                                          cia: _v.cia_sigla,
                                          prefixo: _v.prefixo,
                                          voo_ida: _v.voo_chegada,
                                          data_ini: _v.data_operacao,
                                          data_f: _v.data_fim,
                                          h_ini: _v.hora_inicio,
                                          h_fim: _v.hora_fim,
                                          abs_ini: DateDiff(mapDataBase, _v.data_operacao, TimeUnit.Days) * mapMinutosDia + _v.hora_inicio,
                                          abs_fim: DateDiff(mapDataBase, _v.data_fim, TimeUnit.Days) * mapMinutosDia + _v.hora_fim,
                                          equip: _v.equipamento
                                      }
                                  )
                              );
                              UpdateContext(
                                  {
                                      locBloqueio: "," & locPos.posicao & "," &
                                          "," & Substitute(Coalesce(locPos.ocupa, ""), " ", "") & "," &
                                          Concat(
                                              Filter(
                                                  colPosicoesAero As _q,
                                                  !IsBlank(
                                                      Find(
                                                          "," & locPos.posicao & ",",
                                                          "," & Substitute(Coalesce(_q.ocupa, ""), " ", "") & ","
                                                      )
                                                  )
                                              ) As _q2,
                                              _q2.posicao & ","
                                          ) &
                                          Concat(
                                              Filter(colRegras As _r1, _r1.tipo_regra = "BLOQUEIO" And _r1.posicao = locPos.posicao) As _r1b,
                                              "," & Substitute(Coalesce(_r1b.vizinha, ""), " ", "") & ","
                                          ) &
                                          Concat(
                                              Filter(
                                                  colRegras As _r2,
                                                  _r2.tipo_regra = "BLOQUEIO" And
                                                  !IsBlank(
                                                      Find(
                                                          "," & locPos.posicao & ",",
                                                          "," & Substitute(Coalesce(_r2.vizinha, ""), " ", "") & ","
                                                      )
                                                  )
                                              ) As _r2b,
                                              _r2b.posicao & ","
                                          )
                                  }
                              );
                              UpdateContext(
                                  {
                                      locConflito: LookUp(
                                          colValida As _o,
                                          !IsBlank(Find("," & _o.posicao_txt & ",", locBloqueio)) And _o.id <> locIdEdit And
                                          _o.abs_ini < locAbsFim And _o.abs_fim > locAbsIni
                                      ),
                                      locConflitoPortao: LookUp(
                                          colValida As _g,
                                          locPortao <> "" And _g.portao = locPortao And _g.id <> locIdEdit And _g.abs_ini < locAbsFim And _g.abs_fim > locAbsIni
                                      ),
                                      locVetoProprio: LookUp(
                                          colRegras As _r,
                                          locEquip <> "" And _r.posicao = locPos.posicao And IsBlank(_r.vizinha) And
                                          !IsBlank(Find("," & locEquip & ",", "," & Substitute(_r.equip_a, " ", "") & ","))
                                      )
                                  }
                              );
                              ClearCollect(
                                  colVetoPar,
                                  Filter(
                                      ForAll(
                                          Filter(colRegras, !IsBlank(vizinha)) As _r,
                                          {
                                              mensagem: _r.mensagem,
                                              bate: If(
                                                  locEquip <> "" And
                                                  (
                                                      (
                                                          _r.posicao = locPos.posicao And
                                                          !IsBlank(Find("," & locEquip & ",", "," & Substitute(_r.equip_a, " ", "") & ",")) And
                                                          !IsBlank(
                                                              LookUp(
                                                                  colValida As _o,
                                                                  _o.posicao_txt = _r.vizinha And _o.id <> locIdEdit And
                                                                  _o.abs_ini < locAbsFim And _o.abs_fim > locAbsIni And
                                                                  !IsBlank(Find("," & _o.equip & ",", "," & Substitute(_r.equip_b, " ", "") & ","))
                                                              ).id
                                                          )
                                                      ) Or (
                                                          _r.vizinha = locPos.posicao And
                                                          !IsBlank(Find("," & locEquip & ",", "," & Substitute(_r.equip_b, " ", "") & ",")) And
                                                          !IsBlank(
                                                              LookUp(
                                                                  colValida As _o,
                                                                  _o.posicao_txt = _r.posicao And _o.id <> locIdEdit And
                                                                  _o.abs_ini < locAbsFim And _o.abs_fim > locAbsIni And
                                                                  !IsBlank(Find("," & _o.equip & ",", "," & Substitute(_r.equip_a, " ", "") & ","))
                                                              ).id
                                                          )
                                                      )
                                                  ),
                                                  1,
                                                  0
                                              )
                                          }
                                      ),
                                      bate = 1
                                  )
                              );
                              UpdateContext({locVetoPar: First(colVetoPar)});
                              If(
                                  locIni < 0 Or locFim < 0,
                                  Notify("Horário inválido. Use HH:mm, entre 00:00 e 24:00.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locIni >= mapMinutosDia,
                                  Notify("A chegada tem que ser entre 00:00 e 23:59. Para uma ocupação que começa à meia-noite, use 00:00 no dia seguinte.", NotificationType.Error, 7000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locDias < 0,
                                  Notify("A DATA FINAL não pode ser anterior à DATA INICIAL.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locDias > mapDiasMax,
                                  Notify(
                                      "Período de " & Text(locDias) & " dias acima do limite de " & Text(mapDiasMax) &
                                      " dias. Confira a DATA FINAL.",
                                      NotificationType.Error,
                                      7000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locAbsFim <= locAbsIni,
                                  Notify("A saída tem que ser depois da chegada. Se a ocupação vira o dia, coloque a DATA FINAL no dia da saída.", NotificationType.Error, 7000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  IsBlank(locPos.id),
                                  Notify("Escolha a posição.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locTipo = "VOO" And locEquip = "",
                                  Notify("Escolha o equipamento do voo.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locVetoProprio.mensagem),
                                  Notify(locVetoProprio.mensagem, NotificationType.Error, 8000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locVetoPar.mensagem),
                                  Notify(locVetoPar.mensagem, NotificationType.Error, 8000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locIdEdit <> 0 And IsBlank(locRegistroBase),
                                  Notify("Este registro não existe mais na lista — provavelmente foi excluído ou alterado por outra pessoa. Toque em ATUALIZAR e tente de novo.", NotificationType.Error, 8000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locConflito.id),
                                  Notify(
                                      "Posição " & locConflito.posicao_txt & " já ocupada de " &
                                      Text(locConflito.data_ini, "dd/mm") & " " &
                                      Text(Int(locConflito.h_ini / 60), "00") & ":" & Text(Mod(locConflito.h_ini, 60), "00") & " até " &
                                      Text(locConflito.data_f, "dd/mm") & " " &
                                      Text(Int(locConflito.h_fim / 60), "00") & ":" & Text(Mod(locConflito.h_fim, 60), "00") & " por " &
                                      Trim(Coalesce(locConflito.cia, "") & " " & Coalesce(locConflito.prefixo, "") & " " & Coalesce(locConflito.voo_ida, "")) &
                                      If(
                                          locConflito.posicao_txt = locPos.posicao,
                                          ". Mude o horário ou a posição.",
                                          " — e ela ocupa o mesmo espaço físico de " & locPos.posicao & "."
                                      ),
                                      NotificationType.Error,
                                      8000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locConflitoPortao.id) And locConfirmaPortao <> locPortao & "-" & Text(locConflitoPortao.id),
                                  Notify(
                                      "Portão " & locPortao & " já está em uso de " &
                                      Text(locConflitoPortao.data_ini, "dd/mm") & " " &
                                      Text(Int(locConflitoPortao.h_ini / 60), "00") & ":" & Text(Mod(locConflitoPortao.h_ini, 60), "00") & " até " &
                                      Text(locConflitoPortao.data_f, "dd/mm") & " " &
                                      Text(Int(locConflitoPortao.h_fim / 60), "00") & ":" & Text(Mod(locConflitoPortao.h_fim, 60), "00") &
                                      " na posição " & locConflitoPortao.posicao_txt & ". Toque em SALVAR de novo para confirmar.",
                                      NotificationType.Warning,
                                      8000
                                  );
                                  UpdateContext({locConfirmaPortao: locPortao & "-" & Text(locConflitoPortao.id), locSalvando: false, locOcupado: Blank()}),
                                  // COMPRIMENTO bloqueia: e limite fisico medido do box, cabe ou nao cabe.
                                  locCompMax > 0 And locComp > locCompMax,
                                  Notify(
                                      "Comprimento de " & Text(locComp) & " m nao cabe na posição " & locPos.posicao &
                                      " (máximo " & Text(locCompMax) & " m).",
                                      NotificationType.Error,
                                      7000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  // ENVERGADURA pergunta em vez de bloquear: o limite real e distancia de ponta
                                  // de asa (RBAC 154), e o operador pode autorizar deixando a vizinha vazia.
                                  locEnvMax > 0 And locEnv > locEnvMax And locConfirmaEnv <> locPos.id,
                                  Notify(
                                      "Envergadura de " & Text(locEnv) & " m acima do previsto para a posição " & locPos.posicao &
                                      " (" & Text(locEnvMax) & " m). Só entra se a posição vizinha ficar livre. " &
                                      "Toque em SALVAR de novo para confirmar.",
                                      NotificationType.Warning,
                                      9000
                                  );
                                  UpdateContext({locConfirmaEnv: locPos.id, locSalvando: false, locOcupado: Blank()}),
                                  locPos.contingencia = 1 And locConfirmaConting <> locPos.id,
                                  Notify(
                                      "A posição " & locPos.posicao & " é de contingência. Toque em SALVAR de novo para confirmar.",
                                      NotificationType.Warning,
                                      7000
                                  );
                                  UpdateContext({locConfirmaConting: locPos.id, locSalvando: false, locOcupado: Blank()}),
                                  UpdateContext(
                                      {
                                          locErro: IsError(
                                              Patch(
                                                  tb_alocacoesMapa,
                                                  If(
                                                      locIdEdit = 0,
                                                      Defaults(tb_alocacoesMapa),
                                                      locRegistroBase
                                                  ),
                                                  {
                                                      aeroporto: varAero,
                                                      data_operacao: locDataIni,
                                                      data_fim: locDataFim,
                                                      id_posicao: locPos.id,
                                                      posicao_txt: locPos.posicao,
                                                      patio_txt: locPos.patio,
                                                      cia_sigla: locCia,
                                                      voo_chegada: txtVooIdaMap.Value,
                                                      voo_saida: txtVooVoltaMap.Value,
                                                      prefixo: txtPrefixoMap.Value,
                                                      hora_inicio: locIni,
                                                      hora_fim: locFim,
                                                      portao: locPortao,
                                                      tipo_registro: locTipo,
                                                      pesquisado: If(tglPesquisadoMap.Checked, 1, 0),
                                                      internacional: If(tglInternacionalMap.Checked, 1, 0),
                                                      equipamento: locEquip,
                                                      envergadura_m: locEnv,
                                                      condicao: Coalesce(LookUp(colCondicoes As _cs, _cs.rotulo = drpCondMap.Selected.Value).cond, "PREVISTO"),
                                                      responsavel: txtRespMap.Value,
                                                      contato: txtContatoMap.Value,
                                                      observacao: txtObsMap.Value,
                                                      ativo: 1
                                                  }
                                              )
                                          )
                                      }
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()});
                                  If(
                                      locErro,
                                      Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                      UpdateContext({locConfirmaConting: 0, locConfirmaExcluir: 0, locConfirmaPortao: "", locConfirmaEnv: 0});
                                      Select(btnAtualizarMap);
                                      Set(varAlocSel, Blank());
                                      Set(varPainelAberto, false);
                                      Notify(
                                          If(
                                              locDataIni <= varData And locDataFim >= varData,
                                              "Alocação gravada.",
                                              "Alocação gravada em " & Text(locDataIni, "dd/mm/yyyy") &
                                              If(locDias > 0, " a " & Text(locDataFim, "dd/mm/yyyy"), "") &
                                              ", fora da data aberta na grade."
                                          ),
                                          NotificationType.Success,
                                          If(locDataIni <= varData And locDataFim >= varData, 2500, 6000)
                                      )
                                  )
                              )
                          )
                        PaddingLeft: =14
                        PaddingRight: =14
                        Text: =If(locSalvando, "GRAVANDO…", "SALVAR")
                  - btnExcluirMap:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmVermelho
                        BorderRadius: =0
                        DisplayMode: =If(varPodeEditar And !IsBlank(varAlocSel.id), DisplayMode.Edit, DisplayMode.Disabled)
                        FillPortions: =1
                        FontColor: =thmVermelho
                        FontSize: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Icon: ="Delete"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              IsBlank(varAlocSel.id),
                              Notify("Selecione um registro da lista acima para excluir.", NotificationType.Warning, 4000),
                              locConfirmaExcluir <> varAlocSel.id,
                              UpdateContext({locConfirmaExcluir: varAlocSel.id});
                              Notify("Toque em CONFIRMAR para remover este registro do mapa.", NotificationType.Warning, 5000),
                              UpdateContext(
                                  {
                                      locErro: IsError(
                                          Patch(
                                              tb_alocacoesMapa,
                                              LookUp(tb_alocacoesMapa, ID = varAlocSel.id),
                                              {ativo: 0}
                                          )
                                      )
                                  }
                              );
                              UpdateContext({locConfirmaExcluir: 0});
                              If(
                                  locErro,
                                  Notify("Não foi possível excluir. Nada foi alterado.", NotificationType.Error, 7000),
                                  Select(btnAtualizarMap);
                                  Set(varAlocSel, Blank());
                                  Set(varPainelAberto, false);
                                  Notify("Registro removido do mapa.", NotificationType.Success, 2500)
                              )
                          )
                        PaddingLeft: =12
                        PaddingRight: =12
                        Text: =If(locConfirmaExcluir = Coalesce(varAlocSel.id, -1), "CONFIRMAR", "EXCLUIR")
                  - btnFecharMap:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoFraco
                        BorderRadius: =0
                        FillPortions: =1
                        FontColor: =thmTextoFraco
                        FontSize: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Icon: ="DismissCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varPainelAberto, false);
                          Set(varAlocSel, Blank());
                          UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locConfirmaPortao: "", locConfirmaEnv: 0, locNonce: locNonce + 1})
                        PaddingLeft: =12
                        PaddingRight: =12
                        Text: ="FECHAR"
