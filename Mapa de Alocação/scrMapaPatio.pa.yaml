                  - htmLegendaMap:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AutoHeight: =true
                        Color: =thmTexto
                        Fill: =thmSuperficie
                        Font: =thmFonte
                        HtmlText: |-
                          ="<table style='width:100%;border-collapse:collapse;" & htmlFonte & "border-top:1px solid " & hxBorda & ";'><tr>" &
                          "<td style='padding:8px 26px;font-size:9px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";white-space:nowrap;'>PREENCHIMENTO = COMPANHIA</td>" &
                          "<td style='padding:8px 0;'>" &
                          Concat(
                              Sort(colCias, ordem, SortOrder.Ascending) As _lc,
                              "<span style='display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;margin-right:6px;background:" &
                              _lc.cor_hex & ";color:" & _lc.cor_texto & ";'>" & _lc.sigla & "</span>"
                          ) &
                          "<span style='font-size:9px;color:" & hxTextoFraco & ";margin:0 10px 0 4px;'>AV. GERAL PELA CLASSE:</span>" &
                          Concat(
                              colClasses As _lk,
                              "<span style='display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;margin-right:6px;background:" &
                              _lk.cor_hex & ";color:" & _lk.cor_texto & ";'>" & _lk.rotulo & "</span>"
                          ) &
                          "</td>" &
                          "<td style='padding:8px 26px;font-size:9px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";white-space:nowrap;'>CONTORNO = PORTÃO</td>" &
                          "<td style='padding:8px 0;'>" &
                          Concat(
                              Sort(colPortoes, ordem, SortOrder.Ascending) As _lp,
                              "<span style='display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;margin-right:6px;background:" &
                              hxSuperficie & ";color:" & hxTexto & ";border:3px solid " & _lp.cor_hex & ";'>" & _lp.portao & "</span>"
                          ) &
                          "</td>" &
                          "<td style='padding:8px 26px 8px 0;font-size:9px;color:" & hxTextoFraco & ";white-space:nowrap;'>" &
                          "<span style='background:" & hxVermelho & ";color:" & hxTextoBarra & ";padding:0 4px;font-weight:700;'>P</span> voo pesquisado &nbsp;&middot;&nbsp; " &
                          "<span style='background:" & hxInternacional & ";color:" & hxTexto & ";padding:0 4px;font-weight:700;'>I</span> voo internacional &nbsp;&middot;&nbsp; " &
                          "<span style='background:" & hxTextoFraco & ";color:" & hxTextoBarra & ";padding:0 4px;font-weight:700;'>INTERDITADO</span> posição bloqueada &nbsp;&middot;&nbsp; " &
                          "<span style='font-weight:700;color:" & hxTexto & ";'>&laquo;&nbsp;&raquo;</span> continua noutro dia</td>" &
                          "</tr></table>"
                        Size: =10
                  - tmrSyncMap:
                      Control: Timer@2.1.0
                      Properties:
                        AutoPause: =false
                        AutoStart: =true
                        Duration: =mapSyncSegundos * 1000
                        OnTimerEnd: |-
                          =If(
                              varMapaVisivel,
                              UpdateContext(
                                  {
                                      locServidorAlt: First(
                                          Sort(
                                              Filter(
                                                  tb_alocacoesMapa,
                                                  aeroporto = varAero And data_operacao <= varData And data_fim >= varData And ativo = 1
                                              ),
                                              Modificado,
                                              SortOrder.Descending
                                          )
                                      ).Modificado
                                  }
                              );
                              UpdateContext({locDesatualizado: !IsBlank(locServidorAlt) And locServidorAlt <> varUltimaAlt})
                          )
                        Repeat: =true
                        Visible: =false
      - recVeuMap:
          Control: Rectangle@2.3.0
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =thmVeu
            Height: =Parent.Height
            OnSelect: =Set(varPainelAberto, false)
            Visible: =varPainelAberto
            Width: =Parent.Width
      - cntPainelMap:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =thmBorda
            BorderThickness: =1
