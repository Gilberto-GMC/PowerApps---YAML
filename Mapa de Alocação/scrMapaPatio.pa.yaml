                                ="<table style='width:99.3%;table-layout:fixed;border-collapse:separate;border-spacing:0;" & htmlFonte & "'><tr>" & "<td style='width:" & mapLarguraRotulo & "px;box-sizing:border-box;padding:0 8px 6px 12px;vertical-align:bottom;font-size:9px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>POSIÇÃO</td>" & "<td style='box-sizing:border-box;padding:0;" & mapFundoHoras & "'>" & "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;'><tr>" & Concat(
                                    colHoras As _h,
                                    "<td style='box-sizing:border-box;width:" & mapPctHora & "%;padding:2px 0 6px 4px;font-size:9px;font-weight:700;color:" & hxTextoFraco & ";'>" & If(
                                        varData = Today() And !IsBlank(varCarregadoEm) And Hour(varCarregadoEm) = _h.hora,
                                        "<span style='background:" & hxPrimaria & ";color:" & hxTextoBarra & ";padding:1px 4px;'>" & Text(
