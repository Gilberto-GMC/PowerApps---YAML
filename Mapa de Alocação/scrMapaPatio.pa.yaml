                  - drpCondMap:
                      Control: DropDown@0.0.45
                      Properties:
                        DefaultSelectedItems: =[Coalesce(varForm.cond, "Previsto")]
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        Height: =40
                        Items: =Filter(colCondicoesSel, locNonce >= 0)
                        Visible: =drpTipoMap.Selected.Value <> "Interdição"
                  - lblRespMap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =thmTextoFraco
                        Font: =thmFonte
                        FontWeight: =FontWeight.Bold
                        Height: =18
                        Size: =10
                        Text: ="RESPONSÁVEL PELA RESERVA"
                        Visible: =drpTipoMap.Selected.Value <> "Interdição"
                  - txtRespMap:
                      Control: TextInput@0.0.54
                      Properties:
                        AccessibleLabel: ="Responsável pela reserva"
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        Height: =40
                        Placeholder: ="quem pediu a posição"
