                        PaddingRight: =10
                        Text: |-
                          =Trim(Coalesce(ThisItem.cia, "") & " " & Coalesce(ThisItem.prefixo, "")) & " " & Coalesce(ThisItem.voo_ida, "") &
                          If(!IsBlank(ThisItem.voo_volta), "/" & ThisItem.voo_volta, "") &
                          If(ThisItem.tipo <> "VOO", " · " & ThisItem.tipo, "") &
                          "   " &
                          Text(Int(ThisItem.h_ini / 60), "00") & ":" & Text(Mod(ThisItem.h_ini, 60), "00") & "–" &
                          Text(Int(ThisItem.h_fim / 60), "00") & ":" & Text(Mod(ThisItem.h_fim, 60), "00") &
                          If(ThisItem.data_f <> ThisItem.data_ini, "   " & Text(ThisItem.data_ini, "dd/mm") & " → " & Text(ThisItem.data_f, "dd/mm"), "") &
                          If(!IsBlank(ThisItem.portao), "   PORTÃO " & ThisItem.portao, "") &
