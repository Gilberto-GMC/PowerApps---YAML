                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblEnvMap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Size: =10
                                    Text: ="ENVERGADURA (M)"
                              - txtEnvergaduraMap:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Envergadura em metros"
                                    DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    Placeholder: ="35,79"
                                    Value: =Coalesce(varForm.env, "")
                  - tglPesquisadoMap:
                      Control: Toggle@1.1.5
                      Properties:
                        AccessibleLabel: ="Voo pesquisado"
                        BasePaletteColor: =thmVermelho
                        Checked: =Coalesce(varForm.pesq, false)
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        FontColor: =thmTexto
                        Height: =44
                        Label: ="Voo pesquisado (pinta o bloco de vermelho)"
                        LabelPosition: ='Toggle.LabelPosition'.Before
                  - lblObsMap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =thmTextoFraco
                        Font: =thmFonte
                        FontWeight: =FontWeight.Bold
                        Height: =18
                        Size: =10
                        Text: ="OBSERVAÇÃO"
                  - txtObsMap:
                      Control: TextInput@0.0.54
                      Properties:
                        AccessibleLabel: ="Observação"
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        Height: =84
                        Mode: ='TextInputCanvas.Mode'.Multiline
                        Placeholder: ="Missão presidencial, obra, retorno ao hangar…"
                        Value: =Coalesce(varForm.obs, "")
            - cntAcoesMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnSalvarMap:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =thmPrimaria
                        BorderRadius: =0
                        DisplayMode: =If(varPodeEditar And !locSalvando, DisplayMode.Edit, DisplayMode.Disabled)
                        FillPortions: =1
                        FontColor: =thmTextoBarra
                        FontSize: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Icon: ="Save"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              !IsBlank(locOcupado) And DateDiff(locOcupado, Now(), TimeUnit.Seconds) < mapTravaSegundos,
                              Notify("Aguarde: a ação anterior ainda está sendo processada.", NotificationType.Warning, 3000),
                              UpdateContext(
                                  {
                                      locOcupado: Now(),
                                      locSalvando: true,
                                      locData: Coalesce(dtpDataFormMap.SelectedDate, varData),
                                      locIdEdit: Coalesce(varAlocSel.id, 0),
                                      locRegistroBase: If(
                                          Coalesce(varAlocSel.id, 0) = 0,
                                          Blank(),
                                          LookUp(tb_alocacoesMapa, ID = Coalesce(varAlocSel.id, 0))
                                      ),
                                      locPos: LookUp(colPosicoesAero As _p, _p.posicao = drpPosicaoMap.Selected.Value),
                                      locTipo: Coalesce(LookUp(colTiposReg As _t, _t.rotulo = drpTipoMap.Selected.Value).tipo, "VOO"),
                                      locCia: If(drpCiaMap.Selected.Value = "—", "", drpCiaMap.Selected.Value),
                                      locPortao: If(drpPortaoMap.Selected.Value = "—", "", drpPortaoMap.Selected.Value),
                                      locEnv: If(IsNumeric(txtEnvergaduraMap.Value), Value(txtEnvergaduraMap.Value), 0),
                                      locIni: If(
                                          IsMatch(txtIniMap.Value, "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"),
                                          Value(Left(txtIniMap.Value, 2)) * 60 + Value(Right(txtIniMap.Value, 2)),
                                          -1
                                      ),
                                      locFim: If(
                                          IsMatch(txtFimMap.Value, "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"),
                                          Value(Left(txtFimMap.Value, 2)) * 60 + Value(Right(txtFimMap.Value, 2)),
                                          -1
                                      )
                                  }
                              );
                              UpdateContext(
                                  {
                                      locConflito: If(
                                          locData = varData,
                                          LookUp(
                                              colDia As _o,
                                              _o.id_posicao = locPos.id And _o.id <> locIdEdit And _o.ini < locFim And _o.fim > locIni
                                          )
                                      ),
                                      locConflitoPortao: If(
                                          locData = varData,
                                          LookUp(
                                              colDia As _g,
                                              locPortao <> "" And _g.portao = locPortao And _g.id <> locIdEdit And _g.ini < locFim And _g.fim > locIni
                                          )
                                      )
                                  }
                              );
                              If(
                                  locIni < 0 Or locFim < 0,
                                  Notify("Horário inválido. Use HH:mm, entre 00:00 e 24:00.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locFim <= locIni,
                                  Notify("A saída tem que ser depois da chegada. Voo que vira o dia é lançado em dois registros, um até 24:00 e outro no dia seguinte.", NotificationType.Error, 7000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  IsBlank(locPos.id),
                                  Notify("Escolha a posição.", NotificationType.Error, 5000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locIdEdit <> 0 And IsBlank(locRegistroBase),
                                  Notify("Este registro não existe mais na lista — provavelmente foi excluído ou alterado por outra pessoa. Toque em ATUALIZAR e tente de novo.", NotificationType.Error, 8000);
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locConflito.id),
                                  Notify(
                                      "Posição " & locPos.posicao & " já ocupada das " &
                                      Text(Int(locConflito.ini / 60), "00") & ":" & Text(Mod(locConflito.ini, 60), "00") & " às " &
                                      Text(Int(locConflito.fim / 60), "00") & ":" & Text(Mod(locConflito.fim, 60), "00") & " por " &
                                      Trim(Coalesce(locConflito.cia, "") & " " & Coalesce(locConflito.prefixo, "") & " " & Coalesce(locConflito.voo_ida, "")) &
                                      ". Mude o horário ou a posição.",
                                      NotificationType.Error,
                                      8000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  !IsBlank(locConflitoPortao.id),
                                  Notify(
                                      "Portão " & locPortao & " já está em uso das " &
                                      Text(Int(locConflitoPortao.ini / 60), "00") & ":" & Text(Mod(locConflitoPortao.ini, 60), "00") & " às " &
                                      Text(Int(locConflitoPortao.fim / 60), "00") & ":" & Text(Mod(locConflitoPortao.fim, 60), "00") &
                                      " na posição " & locConflitoPortao.posicao_txt & ".",
                                      NotificationType.Error,
                                      8000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locPos.env_max > 0 And locEnv > locPos.env_max,
                                  Notify(
                                      "Envergadura de " & Text(locEnv) & " m acima do limite da posição " & locPos.posicao &
                                      " (" & Text(locPos.env_max) & " m).",
                                      NotificationType.Error,
                                      7000
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()}),
                                  locPos.contingencia = 1 And locConfirmaConting <> locPos.id,
                                  Notify(
                                      "A posição " & locPos.posicao & " é de contingência. Toque em SALVAR de novo para confirmar.",
                                      NotificationType.Warning,
                                      7000
                                  );
                                  UpdateContext({locConfirmaConting: locPos.id, locSalvando: false, locOcupado: Blank()}),
                                  UpdateContext(
                                      {
                                          locErro: IsError(
                                              Patch(
                                                  tb_alocacoesMapa,
                                                  If(
                                                      locIdEdit = 0,
                                                      Defaults(tb_alocacoesMapa),
                                                      locRegistroBase
                                                  ),
                                                  {
                                                      aeroporto: varAero,
                                                      data_operacao: locData,
                                                      id_posicao: locPos.id,
                                                      posicao_txt: locPos.posicao,
                                                      patio_txt: locPos.patio,
                                                      cia_sigla: locCia,
                                                      voo_chegada: txtVooIdaMap.Value,
                                                      voo_saida: txtVooVoltaMap.Value,
                                                      prefixo: txtPrefixoMap.Value,
                                                      hora_inicio: locIni,
                                                      hora_fim: locFim,
                                                      portao: locPortao,
                                                      tipo_registro: locTipo,
                                                      pesquisado: If(tglPesquisadoMap.Checked, 1, 0),
                                                      envergadura_m: locEnv,
                                                      observacao: txtObsMap.Value,
                                                      ativo: 1
                                                  }
                                              )
                                          )
                                      }
                                  );
                                  UpdateContext({locSalvando: false, locOcupado: Blank()});
                                  If(
                                      locErro,
                                      Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                      UpdateContext({locConfirmaConting: 0, locConfirmaExcluir: 0});
                                      Select(btnAtualizarMap);
                                      Set(varAlocSel, Blank());
                                      Notify(
                                          If(
                                              locData = varData,
                                              "Alocação gravada.",
                                              "Alocação gravada em " & Text(locData, "dd/mm/yyyy") & ". Como é outro dia, confira conflitos de posição e portão manualmente nessa data."
                                          ),
                                          NotificationType.Success,
                                          If(locData = varData, 2500, 7000)
                                      )
                                  )
                              )
                          )
                        PaddingLeft: =14
                        PaddingRight: =14
                        Text: =If(locSalvando, "GRAVANDO…", "SALVAR")
                  - btnExcluirMap:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmVermelho
                        BorderRadius: =0
                        DisplayMode: =If(varPodeEditar And !IsBlank(varAlocSel.id), DisplayMode.Edit, DisplayMode.Disabled)
                        FillPortions: =1
                        FontColor: =thmVermelho
                        FontSize: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Icon: ="Delete"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              IsBlank(varAlocSel.id),
                              Notify("Selecione um registro da lista acima para excluir.", NotificationType.Warning, 4000),
                              locConfirmaExcluir <> varAlocSel.id,
                              UpdateContext({locConfirmaExcluir: varAlocSel.id});
                              Notify("Toque em EXCLUIR de novo para confirmar a remoção.", NotificationType.Warning, 5000),
                              UpdateContext(
                                  {
                                      locErro: IsError(
                                          Patch(
                                              tb_alocacoesMapa,
                                              LookUp(tb_alocacoesMapa, ID = varAlocSel.id),
                                              {ativo: 0}
                                          )
                                      )
                                  }
                              );
                              UpdateContext({locConfirmaExcluir: 0});
                              If(
                                  locErro,
                                  Notify("Não foi possível excluir. Nada foi alterado.", NotificationType.Error, 7000),
                                  Select(btnAtualizarMap);
                                  Set(varAlocSel, Blank());
                                  Set(varPainelAberto, false);
                                  Notify("Registro removido do mapa.", NotificationType.Success, 2500)
                              )
                          )
                        PaddingLeft: =12
                        PaddingRight: =12
                        Text: =If(locConfirmaExcluir = Coalesce(varAlocSel.id, -1), "CONFIRMAR", "EXCLUIR")
                  - btnFecharMap:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmTextoFraco
                        BorderRadius: =0
                        FillPortions: =1
                        FontColor: =thmTextoFraco
                        FontSize: =13
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Icon: ="DismissCircle"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varPainelAberto, false);
                          Set(varAlocSel, Blank());
                          UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locNonce: locNonce + 1})
                        PaddingLeft: =12
                        PaddingRight: =12
                        Text: ="FECHAR"
