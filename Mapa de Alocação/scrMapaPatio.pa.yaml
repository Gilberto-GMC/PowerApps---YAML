                  - txtContatoMap:
                      Control: TextInput@0.0.54
                      Properties:
                        AccessibleLabel: ="Contato do responsável"
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        Height: =40
                        Placeholder: ="telefone ou e-mail"
