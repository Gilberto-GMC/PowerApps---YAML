                    "<div style='font-size:26px;font-weight:800;color:" & hxPrimaria & ";line-height:1.15;margin-top:4px;'>" &
                    Coalesce(varPosSel.posicao, "&mdash;") & "</div>" &
                    "<div style='font-size:11px;color:" & hxTexto & ";margin-top:2px;'>" &
                    Coalesce(varPosSel.restricao, "") & " &nbsp;&middot;&nbsp; " & Coalesce(varPosSel.qtd, 0) & " registro(s) no dia</div>" &
