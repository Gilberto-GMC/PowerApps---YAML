            - htmHangarCartoesMap:
                Control: HtmlViewer@2.1.0
                Properties:
                  AutoHeight: =true
                  Color: =thmTexto
                  Fill: =thmFundo
                  Font: =thmFonte
                  HtmlText: |-
                    ="<div style='" & htmlFonte & "'>" &
                    "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>HANGARES &nbsp;&middot;&nbsp; " & Upper(Text(varData, "ddd dd/mm/yyyy")) & "</div>" &
                    "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;'>Aeronaves dentro dos hangares nesta data. Sem posição, capacidade ou restrição: o hangar não é controlado por nós.</div>" &
                    "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:8px 8px;margin:4px -8px 0 -8px;'><tr>" &
                    // cartoes em linhas: 2 por linha no painel, 4 com EXPANDIR — com 10 hangares numa fileira so
                    // cada cartao ficaria com ~60 px
                    With(
                        {
                            _lst: Filter(Sort(colHangaresAero, ordem, SortOrder.Ascending) As _hf, drpHangarFiltroMap.Selected.Value = "TODOS OS HANGARES" Or _hf.posicao = drpHangarFiltroMap.Selected.Value),
                            _porLinha: If(locHangarExpandido, 4, 2)
                        },
                    Concat(
                        Sequence(CountRows(_lst)) As _n,
                        If(_n.Value > 1 And Mod(_n.Value - 1, _porLinha) = 0, "</tr><tr>", "") &
                        With(
                            { _h: Index(_lst, _n.Value) },
                        With(
                            {
                                _cor: Coalesce(LookUp(colPatiosTodos As _p, _p.patio = _h.patio And _p.aeroporto = _h.aeroporto).cor_hex, hxPrimaria),
                                _dentro: Sort(Filter(colHangarDia As _a, _a.id_posicao = _h.id And _a.abs_fim > varHangarRefMin And (IsBlank(Trim(txtHangarBuscaMap.Value)) Or Upper(Trim(txtHangarBuscaMap.Value)) in Upper(Coalesce(_a.prefixo, "")))), abs_ini, SortOrder.Ascending)
                            },
                            "<td style='vertical-align:top;width:" & Text(100 / Max(Min(_porLinha, CountRows(_lst)), 1), "0") & "%;background:" & hxSuperficie &
                            ";border:1px solid " & hxBorda & ";border-top:3px solid " & _cor & ";padding:10px 12px;'>" &
                            "<div style='font-size:20px;font-weight:800;color:" & hxPrimaria & ";'>" & _h.posicao & "</div>" &
                            "<div style='font-size:11px;color:" & hxTexto & ";margin-bottom:6px;'>" & CountRows(_dentro) & " aeronave(s)</div>" &
                            If(
                                IsEmpty(_dentro),
                                "<div style='font-size:11px;color:" & hxTextoFraco & ";'>vazio</div>",
                                Concat(
                                    _dentro As _a,
                                    With(
                                        {
                                            _aberto: _a.data_f = mapSaidaEmAberto,
                                            _min: DateDiff(
                                                DateAdd(_a.data_ini, _a.h_ini, TimeUnit.Minutes),
                                                If(_a.data_f = mapSaidaEmAberto, Now(), DateAdd(_a.data_f, _a.h_fim, TimeUnit.Minutes)),
                                                TimeUnit.Minutes
                                            )
                                        },
                                        "<div style='border-top:1px solid " & hxGradeLinha & ";padding:5px 0;font-size:11px;color:" & hxTexto & ";'>" &
                                        "<b style='font-size:12px;'>" & Coalesce(_a.prefixo, "&mdash;") & "</b>" &
                                        If(IsBlank(_a.equip), "", " &nbsp;&middot;&nbsp; " & _a.equip) &
                                        "<br>entrada " & Text(_a.data_ini, "dd/mm") & " " & Text(Int(_a.h_ini / 60), "00") & ":" & Text(Mod(_a.h_ini, 60), "00") &
                                        If(_aberto, " &nbsp;&middot;&nbsp; <span style='color:" & hxVerde & ";font-weight:700;'>em aberto</span>",
                                            " &nbsp;&middot;&nbsp; saída " & Text(_a.data_f, "dd/mm") & " " & Text(Int(_a.h_fim / 60), "00") & ":" & Text(Mod(_a.h_fim, 60), "00")) &
                                        If(_min >= 0, " &nbsp;&middot;&nbsp; " & If(_min >= 1440, Text(RoundDown(_min / 1440, 0)) & "d ", "") & Text(RoundDown(Mod(_min, 1440) / 60, 0)) & "h", "") &
                                        If(IsBlank(_a.obs), "", "<br><span style='color:" & hxTextoFraco & ";'>" & Substitute(Substitute(_a.obs, "&", "&amp;"), "<", "&lt;") & "</span>") &
                                        "</div>"
                                    )
                                )
                            ) &
                            "</td>"
                        )
                        )
                    )
                    ) &
                    "</tr></table></div>"
                  Size: =11
