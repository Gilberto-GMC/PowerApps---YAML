                                    DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    Items: =Filter(colEquipSel, locNonce >= 0 And locNonceEq >= 0)
                        - cntEnvMap:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblEnvMap:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Size: =10
                                    Text: ="ENVERGADURA (M)"
                              - txtEnvergaduraMap:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="Envergadura em metros, vinda do catálogo de equipamentos"
                                    DisplayMode: =DisplayMode.View
                                    Height: =40
                                    Placeholder: ="vem do equipamento"
                                    Value: |-
                                      =With(
                                          { _e: LookUp(colEquip As _q, _q.equip = drpEquipMap.Selected.Value) },
                                          If(
                                              Value(Text(_e.envergadura_m)) > 0,
                                              Text(_e.envergadura_m),
                                              Coalesce(varForm.env, "")
                                          )
                                      )
                  - tglPesquisadoMap:
                      Control: Toggle@1.1.5
                      Properties:
                        AccessibleLabel: ="Voo pesquisado"
                        BasePaletteColor: =thmVermelho
                        Checked: =Coalesce(varForm.pesq, false)
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        FontColor: =thmTexto
                        Height: =44
