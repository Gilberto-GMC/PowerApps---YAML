                        AccessibleLabel: ="Reserva de alternativa"
                        BasePaletteColor: =thmTextoFraco
                        Checked: =Coalesce(varForm.alt, false)
                        DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.View)
                        FontColor: =thmTexto
                        Height: =44
