                                =With(
                                    {
                                        _hora: If(
                                            IsMatch(txtHangarHoraMap.Value, "^([01][0-9]|2[0-3]):[0-5][0-9]$"),
                                            Value(Left(txtHangarHoraMap.Value, 2)) * 60 + Value(Right(txtHangarHoraMap.Value, 2)),
                                            -1
                                        ),
                                        _prefixo: Upper(Trim(txtHangarPrefixoMap.Value)),
                                        _novo: IsBlank(locHangarEdit.id)
                                    },
                                    If(
                                        locHangarSalvando,
                                        false,
                                        IsBlank(_prefixo),
                                        Notify("Informe o prefixo da aeronave.", NotificationType.Error, 5000),
                                        IsBlank(dtpHangarDataMap.SelectedDate),
                                        Notify("Informe a data de entrada.", NotificationType.Error, 5000),
                                        _hora < 0,
                                        Notify("Hora de entrada inválida. Use HH:MM, por exemplo 09:30.", NotificationType.Error, 5000),
                                        !_novo And (
                                            locHangarEdit.data_f < dtpHangarDataMap.SelectedDate Or
                                            (locHangarEdit.data_f = dtpHangarDataMap.SelectedDate And locHangarEdit.h_fim <= _hora)
                                        ),
                                        Notify("A entrada ficaria depois da saída já registrada.", NotificationType.Error, 6000),
