            - htmResListaMap:
                Control: HtmlViewer@2.1.0
                Properties:
                  AutoHeight: =true
                  Color: =thmTexto
                  Fill: =thmFundo
                  Font: =thmFonte
                  HtmlText: |-
                    ="<div style='" & htmlFonte & "'>" &
                    "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>RESERVAS DE PÁTIO &nbsp;&middot;&nbsp; DE " & Upper(Text(Today(), "dd/mm/yyyy")) & " EM DIANTE</div>" &
                    "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:4px;'>Todas as reservas lançadas para hoje e para os próximos meses. Hangares têm painel próprio e não entram aqui.</div>" &
                    With(
                        {
                            _lst: Filter(
                                colReservas As _f,
                                (drpResPatioMap.Selected.Value = "TODOS OS PÁTIOS" Or _f.patio = drpResPatioMap.Selected.Value) And
                                (
                                    drpResCondMap.Selected.Value = "TODAS" Or
                                    Coalesce(LookUp(colCondicoes As _cf, _cf.cond = _f.cond).rotulo, "Previsto") = drpResCondMap.Selected.Value
                                ) And
                                (
                                    IsBlank(Trim(txtResBuscaMap.Value)) Or
                                    Upper(Trim(txtResBuscaMap.Value)) in Upper(Coalesce(_f.prefixo, "")) Or
                                    Upper(Trim(txtResBuscaMap.Value)) in Upper(Coalesce(_f.resp, "")) Or
                                    Upper(Trim(txtResBuscaMap.Value)) in Upper(Coalesce(_f.posicao, ""))
                                )
                            )
                        },
                        If(
                            CountRows(_lst) = 0,
                            "<div style='margin-top:14px;font-size:12px;color:" & hxTextoFraco & ";'>Nenhuma reserva para o filtro escolhido.</div>",
                            "<div style='font-size:11px;color:" & hxTexto & ";margin:10px 0 4px 0;'><b>" & CountRows(_lst) & "</b> reserva(s)</div>" &
                            "<table style='width:100%;border-collapse:collapse;font-size:11px;color:" & hxTexto & ";'>" &
                            "<tr style='color:" & hxTextoFraco & ";text-align:left;'>" &
                            "<th style='padding:4px 6px;border-bottom:1px solid " & hxBorda & ";width:31%;'>QUANDO</th>" &
                            "<th style='padding:4px 6px;border-bottom:1px solid " & hxBorda & ";width:14%;'>POSIÇÃO</th>" &
                            "<th style='padding:4px 6px;border-bottom:1px solid " & hxBorda & ";width:19%;'>MATRÍCULA</th>" &
                            "<th style='padding:4px 6px;border-bottom:1px solid " & hxBorda & ";width:22%;'>RESPONSÁVEL</th>" &
                            "<th style='padding:4px 6px;border-bottom:1px solid " & hxBorda & ";width:14%;'>SITUAÇÃO</th>" &
                            "</tr>" &
                            Concat(
                                Sequence(CountRows(_lst)) As _n,
                                With(
                                    {
                                        _r: Index(_lst, _n.Value),
                                        _mesAnt: If(_n.Value = 1, "", Text(Index(_lst, _n.Value - 1).data_ini, "mm/yyyy"))
                                    },
                                    If(
                                        Text(_r.data_ini, "mm/yyyy") <> _mesAnt,
                                        "<tr><td colspan='5' style='padding:10px 6px 4px 6px;font-size:10px;font-weight:700;letter-spacing:.12em;color:" & hxPrimaria & ";'>" &
                                        Upper(Text(_r.data_ini, "mmmm yyyy")) & "</td></tr>",
                                        ""
                                    ) &
                                    "<tr style='border-top:1px solid " & hxGradeLinha & ";'>" &
                                    "<td style='padding:5px 6px;'>" &
                                    Text(_r.data_ini, "ddd dd/mm") & " " & Text(Int(_r.h_ini / 60), "00") & ":" & Text(Mod(_r.h_ini, 60), "00") &
                                    If(
                                        _r.data_f = mapSaidaEmAberto,
                                        " &rarr; <span style='color:" & hxVerde & ";font-weight:700;'>em aberto</span>",
                                        " &rarr; " & Text(_r.data_f, "ddd dd/mm") & " " & Text(Int(_r.h_fim / 60), "00") & ":" & Text(Mod(_r.h_fim, 60), "00")
                                    ) &
                                    "</td>" &
                                    "<td style='padding:5px 6px;'><b>" & Coalesce(_r.posicao, "&mdash;") & "</b><br><span style='color:" & hxTextoFraco & ";'>" & Coalesce(_r.patio, "") & "</span></td>" &
                                    "<td style='padding:5px 6px;'><b>" & Coalesce(_r.prefixo, "&mdash;") & "</b>" &
                                    If(IsBlank(_r.equip), "", "<br><span style='color:" & hxTextoFraco & ";'>" & _r.equip & "</span>") & "</td>" &
                                    "<td style='padding:5px 6px;'>" & Coalesce(_r.resp, "&mdash;") &
                                    If(IsBlank(_r.contato), "", "<br><span style='color:" & hxTextoFraco & ";'>" & _r.contato & "</span>") & "</td>" &
                                    "<td style='padding:5px 6px;'>" &
                                    Coalesce(LookUp(colCondicoes As _c, _c.cond = _r.cond).rotulo, "Previsto") &
                                    If(_r.alt = 1, "<br><span style='color:" & hxTextoFraco & ";'>alternativa</span>", "") &
                                    "</td></tr>" &
                                    If(
                                        IsBlank(_r.obs),
                                        "",
                                        "<tr><td colspan='5' style='padding:0 6px 6px 6px;color:" & hxTextoFraco & ";'>" &
                                        Substitute(Substitute(_r.obs, "&", "&amp;"), "<", "&lt;") & "</td></tr>"
                                    )
                                )
                            ) &
                            "</table>"
                        )
                    ) &
                    "</div>"
                  Size: =11
