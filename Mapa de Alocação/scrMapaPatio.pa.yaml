                        LabelPosition: ='Toggle.LabelPosition'.Before
                        Visible: =drpTipoMap.Selected.Value <> "Interdição"
                  - lblCondMap:
                      Control: Label@2.5.1
                      Properties:
                        Color: =thmTextoFraco
                        Font: =thmFonte
                        FontWeight: =FontWeight.Bold
