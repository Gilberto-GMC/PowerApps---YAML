                                        ) & "</span>",
                                        Text(
                                            _h.hora,
                                            "00"
                                        )
                                    ) & "</td>"
                                ) & "</tr></table></td></tr></table>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =mapLarguraBarra
                              PaddingTop: =0
                              Size: =9
