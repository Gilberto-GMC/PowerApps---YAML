Screens:
  scrMapaPatio:
    Properties:
      OnHidden: =Set(varMapaVisivel, false)
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, First(colAerosMapa).Aeroporto));
        If(IsBlank(varAeroNome), Set(varAeroNome, First(colAerosMapa).Aeroporto));
        Set(varMapaVisivel, true);
        Set(varPainelAberto, false);
        Set(varAlocSel, Blank());
        Set(varNovoIni, -1);
        UpdateContext(
            {
                locPatio: "TODOS",
                locNonce: 0,
                locConfirmaConting: 0,
                locConfirmaPortao: "", locConfirmaEnv: 0,
                locConfirmaExcluir: 0,
                locDesatualizado: false,
                locSalvando: false,
                locOcupado: Blank()
            }
        );
        ClearCollect(colEquip, Sort(Filter(tb_equipamentos, ativo = 1), ordem, SortOrder.Ascending));
        ClearCollect(colRegras, Filter(tb_regrasPosicao, aeroporto = varAero And ativo = 1));
        ClearCollect(colEquipSel, Table({ Value: "—" }));
        Collect(colEquipSel, ForAll(colEquip As _e, { Value: _e.nome_equip }));
        Select(btnAtualizarMap)
    Children:
      - btnAbrirEdicaoMap:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Set(
                  varForm,
                  {
                      tipo: Coalesce(LookUp(colTiposReg As _t, _t.tipo = varAlocSel.tipo).rotulo, "Voo"),
                      posicao: varAlocSel.posicao_txt,
                      data: varAlocSel.data_ini,
                      dataf: varAlocSel.data_f,
                      cia: If(IsBlank(varAlocSel.cia), "—", varAlocSel.cia),
                      voo_ida: varAlocSel.voo_ida,
                      voo_volta: varAlocSel.voo_volta,
                      prefixo: varAlocSel.prefixo,
                      portao: If(IsBlank(varAlocSel.portao), "—", varAlocSel.portao),
                      ini: Text(Int(varAlocSel.h_ini / 60), "00") & ":" & Text(Mod(varAlocSel.h_ini, 60), "00"),
                      fim: Text(Int(varAlocSel.h_fim / 60), "00") & ":" & Text(Mod(varAlocSel.h_fim, 60), "00"),
                      equip: Coalesce(LookUp(colEquip As _e, _e.equip = varAlocSel.equip).nome_equip, "—"),
                      env: If(Value(Text(varAlocSel.env)) > 0, Text(varAlocSel.env), ""),
                      obs: varAlocSel.obs,
                      pesq: varAlocSel.pesq = 1,
                      intl: varAlocSel.intl = 1,
                      cond: Coalesce(LookUp(colCondicoes As _c, _c.cond = varAlocSel.cond).rotulo, "Previsto"),
                      resp: varAlocSel.resp,
                      contato: varAlocSel.contato
                  }
              );
              Set(varPosSel, LookUp(colGrade As _g, _g.id_posicao = varAlocSel.id_posicao));
              UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locConfirmaPortao: "", locConfirmaEnv: 0, locNonce: locNonce + 1});
              Set(varPainelAberto, true)
            Text: =""
            Visible: =true
            Width: =1
            X: =0
            Y: =0
      - btnAbrirNovoMap:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Set(varAlocSel, Blank());
              Set(
                  varForm,
                  {
                      tipo: "Voo",
                      posicao: Coalesce(varPosSel.posicao, "T1"),
                      data: varData,
                      dataf: varData,
                      cia: "—",
                      voo_ida: "",
                      voo_volta: "",
                      prefixo: "",
                      portao: "—",
                      ini: If(
                          varNovoIni < 0,
                          "",
                          Text(Int(varNovoIni / 60), "00") & ":" & Text(Mod(varNovoIni, 60), "00")
                      ),
                      fim: If(
                          varNovoIni < 0,
                          "",
                          Text(Int((varNovoIni + mapDuracaoPadrao) / 60), "00") & ":" &
                          Text(Mod(varNovoIni + mapDuracaoPadrao, 60), "00")
                      ),
                      equip: "—",
                      env: "",
                      obs: "",
                      pesq: false,
                      intl: false,
                      cond: "Previsto",
                      resp: "",
                      contato: ""
                  }
              );
              UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locConfirmaPortao: "", locConfirmaEnv: 0, locNonce: locNonce + 1});
              Set(varPainelAberto, true)
            Text: =""
            Visible: =true
            Width: =1
            X: =0
            Y: =0
      - cntShellMap:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaMap:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>MOTIVA</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Select(btnAtualizarMap)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavCfgMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Settings"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuConfig, !varMenuConfig)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, If(varMenuConfig, "CONFIGURAÇÕES  ▾", "CONFIGURAÇÕES  ▸"), "")
                        - btnNavRefMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varMapaVisivel, false);
                                Navigate(scrMapaReferencia, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavEqpMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Airplane"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaEquip, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "EQUIPAMENTOS", "")
                        - btnNavRgrMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="LockClosed"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaRegra, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "RESTRIÇÕES", "")
                        - btnNavImpMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Upload"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaImport, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "IMPORTAR PROGRAMAÇÃO", "")
                        - btnNavInicioMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varMapaVisivel, false);
                                Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - cntMenuRodapeMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        FillPortions: =0
                        Height: =108
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmUsuarioMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimariaEscura
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    varMenuAberto,
                                    "<div style='" & htmlFonte & "color:" & hxTextoBarra & ";font-size:10px;line-height:1.5;border-top:1px solid " & hxBordaBarra & ";padding-top:10px;'>" &
                                    "<div style='font-weight:700;'>" & Upper(Coalesce(varUsuarioNome, "USUÁRIO")) & "</div>" &
                                    "<div style='opacity:.6;'>" & varAeroNome & " &nbsp;&middot;&nbsp; " & If(varPodeEditar, "EDIÇÃO", "SOMENTE LEITURA") & "</div>" &
                                    "</div>",
                                    ""
                                )
                              PaddingLeft: =4
                              PaddingRight: =4
                              Size: =10
                        - btnRecolherMap:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Start
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmBotaoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =11
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              LayoutMinHeight: =36
                              Icon: ="ChevronRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuAberto, !varMenuAberto)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>MAPA DE ALOCAÇÃO DE PÁTIO</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAeroNome & " &nbsp;&middot;&nbsp; " & Upper(Text(varData, "ddd dd/mm/yyyy")) &
                                " &nbsp;&middot;&nbsp; " & CountRows(colDia) & " registro(s)" &
                                " &nbsp;&middot;&nbsp; carregado às " & Text(varCarregadoEm, "HH:mm") &
                                "</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                        - htmKpiMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              Font: =thmFonte
                              HtmlText: |-
                                ="<table style='" & htmlFonte & "color:" & hxTextoBarra & ";border-spacing:14px 0;text-align:center;'><tr>" &
                                "<td style='text-align:center;'><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>VOOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, tipo = "VOO")) & "</div></td>" &
                                "<td style='text-align:center;'><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>PESQUISADOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, pesq = 1)) & "</div></td>" &
                                "<td style='text-align:center;'><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>INTERNACIONAIS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, intl = 1)) & "</div></td>" &
                                "<td style='text-align:center;'><div style='font-size:9px;letter-spacing:.14em;opacity:.7;'>BLOQUEIOS</div><div style='font-size:22px;font-weight:800;'>" & CountRows(Filter(colDia, tipo <> "VOO")) & "</div></td>" &
                                "</tr></table>"
                              Size: =11
                              Width: =440
                  - cntAvisoMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmAmbar
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =locDesatualizado
                      Children:
                        - htmAvisoMap:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmAmbar
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";font-size:12px;font-weight:700;'>A programação deste dia foi alterada por outra pessoa. Atualize para ver a versão mais recente.</div>"
                              LayoutMinWidth: =0
                              Size: =12
                        - btnVerNovoMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Select(btnAtualizarMap)
                              PaddingLeft: =14
                              PaddingRight: =14
                              Text: ="ATUALIZAR AGORA"
                              Width: =190
                  - cntFiltrosMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        FillPortions: =0
                        Height: =62
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - dtpDataMap:
                            Control: DatePicker@0.0.46
                            Properties:
                              AccessibleLabel: ="Data da operação"
                              Format: =DateTimeFormat.ShortDate
                              SelectedDate: =varData
                              Width: =150
                        - btnVerDiaMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =13
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="ArrowRight"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, dtpDataMap.SelectedDate);
                                Select(btnAtualizarMap)
                              PaddingLeft: =14
                              PaddingRight: =14
                              Text: ="VER DIA"
                              Width: =126
                        - btnOntemMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, DateAdd(varData, -1, TimeUnit.Days));
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="ONTEM"
                              Width: =88
                        - btnHojeMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, Today());
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="HOJE"
                              Width: =78
                        - btnAmanhaMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varData, DateAdd(varData, 1, TimeUnit.Days));
                                Select(btnAtualizarMap)
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="AMANHÃ"
                        - drpPatioMap:
                            Control: DropDown@0.0.45
                            Properties:
                              DefaultSelectedItems: =[Coalesce(LookUp(colPatiosAero As _q, _q.patio = locPatio).nome_patio, "TODOS OS PÁTIOS")]
                              Height: =40
                              Items: =Filter(colPatiosSel, locNonce >= 0)
                              Width: =210
                        - btnAplicarPatioMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmPrimaria
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =UpdateContext(
                                    {
                                        locPatio: Coalesce(
                                            LookUp(colPatiosAero As _p, _p.nome_patio = drpPatioMap.Selected.Value).patio,
                                            "TODOS"
                                        ),
                                        locNonce: locNonce + 1
                                    }
                                )
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="FILTRAR"
                              Width: =104
                        - btnAtualizarMap:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmOperacional
                              BorderRadius: =0
                              FontColor: =thmOperacional
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="ArrowClockwise"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =ClearCollect(
                                    colDia,
                                    ForAll(
                                        Filter(
                                            tb_alocacoesMapa,
                                            aeroporto = varAero And data_operacao <= varData And data_fim >= varData And ativo = 1
                                        ) As _r,
                                        With(
                                            {
                                                _dias: DateDiff(_r.data_operacao, _r.data_fim, TimeUnit.Days),
                                                _cia: LookUp(colCias As _cd, _cd.sigla = _r.cia_sigla),
                                                _pat: LookUp(colPatiosAero As _pt, _pt.patio = _r.patio_txt)
                                            },
                                            With(
                                                {
                                                    _dica: _r.posicao_txt & " - " & Coalesce(_pat.nome_patio, _r.patio_txt) & Char(10) &
                                                        Switch(
                                                            _r.tipo_registro,
                                                            "INTERDICAO", "POSIÇÃO INTERDITADA",
                                                            "RESERVA", "POSIÇÃO RESERVADA",
                                                            Trim(
                                                                Coalesce(_cia.nome_cia, _r.cia_sigla) & " " &
                                                                If(
                                                                    IsBlank(_r.voo_chegada) And IsBlank(_r.voo_saida),
                                                                    Coalesce(_r.prefixo, ""),
                                                                    Coalesce(_r.voo_chegada, "") &
                                                                    If(
                                                                        !IsBlank(_r.voo_saida),
                                                                        If(IsBlank(_r.voo_chegada), "", "/") & _r.voo_saida,
                                                                        ""
                                                                    )
                                                                )
                                                            )
                                                        ) &
                                                        If(!IsBlank(_r.prefixo) And !(_r.tipo_registro = "VOO" And IsBlank(_r.voo_chegada) And IsBlank(_r.voo_saida)), Char(10) & "Prefixo " & _r.prefixo, "") &
                                                        If(
                                                            Coalesce(_r.condicao, "PREVISTO") <> "PREVISTO",
                                                            Char(10) & Coalesce(LookUp(colCondicoes As _cq, _cq.cond = _r.condicao).rotulo, ""),
                                                            ""
                                                        ) &
                                                        If(!IsBlank(_r.responsavel), Char(10) & "Reserva de " & _r.responsavel &
                                                            If(!IsBlank(_r.contato), " - " & _r.contato, ""), "") &
                                                        If(
                                                            !IsBlank(_r.equipamento),
                                                            Char(10) & "Equipamento " & Coalesce(LookUp(colEquip As _eq, _eq.equip = _r.equipamento).nome_equip, _r.equipamento),
                                                            ""
                                                        ) &
                                                        If(Value(Text(_r.envergadura_m)) > 0, Char(10) & "Envergadura " & Text(_r.envergadura_m) & " m", "") &
                                                        If(_r.tipo_registro = "VOO" And IsBlank(_r.equipamento), Char(10) & "ATENCAO - sem equipamento", "") &
                                                        If(
                                                            _r.tipo_registro = "VOO" And IsBlank(_r.portao) And
                                                            LookUp(colPosicoesAero As _pw, _pw.id = _r.id_posicao).tipo = "PONTE",
                                                            Char(10) & "ATENCAO - sem portao",
                                                            ""
                                                        ) &
                                                        Char(10) & "De " & Text(_r.data_operacao, "dd/mm/yyyy") & " " &
                                                        Text(Int(_r.hora_inicio / 60), "00") & ":" & Text(Mod(_r.hora_inicio, 60), "00") &
                                                        " ate " & Text(_r.data_fim, "dd/mm/yyyy") & " " &
                                                        Text(Int(_r.hora_fim / 60), "00") & ":" & Text(Mod(_r.hora_fim, 60), "00") &
                                                        If(_dias > 0, "   (" & Text(_dias + 1) & " dias)", "") &
                                                        If(!IsBlank(_r.portao), Char(10) & "Portão " & _r.portao, "") &
                                                        If(_r.pesquisado = 1, Char(10) & "VOO PESQUISADO", "") &
                                                        If(_r.internacional = 1, Char(10) & "VOO INTERNACIONAL", "") &
                                                        If(!IsBlank(_r.observacao), Char(10) & "Obs: " & _r.observacao, "") &
                                                        Char(10) & "Alterado por " & Coalesce(_r.'Modificado por'.DisplayName, "-") &
                                                        " em " & Text(_r.Modificado, "dd/mm/yyyy") & " " &
                                                        Text(Hour(_r.Modificado), "00") & ":" & Text(Minute(_r.Modificado), "00")
                                                },
                                                {
                                                    id: _r.ID,
                                                id_posicao: _r.id_posicao,
                                                posicao_txt: _r.posicao_txt,
                                                patio_txt: _r.patio_txt,
                                                cia: _r.cia_sigla,
                                                voo_ida: _r.voo_chegada,
                                                voo_volta: _r.voo_saida,
                                                prefixo: _r.prefixo,
                                                ini: If(_r.data_operacao < varData, 0, _r.hora_inicio),
                                                fim: If(_r.data_fim > varData, mapMinutosDia, _r.hora_fim),
                                                data_ini: _r.data_operacao,
                                                data_f: _r.data_fim,
                                                h_ini: _r.hora_inicio,
                                                h_fim: _r.hora_fim,
                                                de_antes: If(_r.data_operacao < varData, 1, 0),
                                                para_depois: If(_r.data_fim > varData, 1, 0),
                                                abs_ini: DateDiff(mapDataBase, _r.data_operacao, TimeUnit.Days) * mapMinutosDia + _r.hora_inicio,
                                                abs_fim: DateDiff(mapDataBase, _r.data_fim, TimeUnit.Days) * mapMinutosDia + _r.hora_fim,
                                                portao: _r.portao,
                                                tipo: _r.tipo_registro,
                                                pesq: _r.pesquisado,
                                                intl: _r.internacional,
                                                cond: Coalesce(_r.condicao, "PREVISTO"),
                                                resp: _r.responsavel,
                                                contato: _r.contato,
                                                equip: _r.equipamento,
                                                env: _r.envergadura_m,
                                                obs: _r.observacao,
                                                alterado_em: _r.Modificado,
                                                alterado_por: _r.'Modificado por'.DisplayName,
                                                    dica_txt: _dica,
                                                    dica: Substitute(
                                                    Substitute(
                                                        Substitute(
                                                            Substitute(
                                                                Substitute(
                                                                    _dica,
                                                                    "&",
                                                                    "&amp;"
                                                                ),
                                                                "<",
                                                                "&lt;"
                                                            ),
                                                            ">",
                                                            "&gt;"
                                                        ),
                                                        "'",
                                                        "&#39;"
                                                    ),
                                                    Char(10),
                                                    "&#10;"
                                                )
                                            }
                                            )
                                        )
                                    )
                                );
                                Set(varUltimaAlt, Max(colDia, alterado_em));
                                Set(varCarregadoEm, Now());
                                ClearCollect(
                                    colGrade,
                                    ForAll(
                                        Sort(Filter(colPosicoesAero, IsBlank(ocupa)), ordem, SortOrder.Ascending) As _p,
                                        With(
                                            {
                                                _bl: Sort(
                                                    Filter(
                                                        colDia,
                                                        id_posicao = _p.id Or
                                                        !IsBlank(
                                                            Find(
                                                                "," & _p.posicao & ",",
                                                                "," &
                                                                Substitute(
                                                                    Coalesce(
                                                                        LookUp(colPosicoesAero As _q, _q.posicao = posicao_txt).ocupa,
                                                                        ""
                                                                    ),
                                                                    " ",
                                                                    ""
                                                                ) & ","
                                                            )
                                                        ) Or
                                                        !IsBlank(
                                                            LookUp(
                                                                colRegras As _rr,
                                                                _rr.tipo_regra = "BLOQUEIO" And
                                                                (
                                                                    (
                                                                        _rr.posicao = posicao_txt And
                                                                        !IsBlank(Find("," & _p.posicao & ",", "," & Substitute(Coalesce(_rr.vizinha, ""), " ", "") & ","))
                                                                    ) Or
                                                                    (
                                                                        _rr.posicao = _p.posicao And
                                                                        !IsBlank(Find("," & posicao_txt & ",", "," & Substitute(Coalesce(_rr.vizinha, ""), " ", "") & ","))
                                                                    )
                                                                )
                                                            ).posicao
                                                        )
                                                    ),
                                                    ini,
                                                    SortOrder.Ascending
                                                ),
                                                _corPatio: Switch(_p.patio, "PRINCIPAL", hxPrimaria, "PATIO3", hxOperacional, hxVerde),
                                                _restricao: If(
                                                    !IsBlank(_p.aeronave_max),
                                                    _p.aeronave_max,
                                                    If(_p.classe = "HELICOPTERO", "HELICÓPTERO", "CLASSE " & _p.classe)
                                                ),
                                                _topo: If(
                                                    _p.ordem = Min(Filter(colPosicoesAero As _q, _q.patio = _p.patio), ordem),
                                                    "2px solid " & hxBorda,
                                                    "1px solid " & hxGradeLinha
                                                )
                                            },
                                            With(
                                                {
                                                    _trechos: ForAll(
                                                        Sequence(CountRows(_bl)) As _i,
                                                        With(
                                                            {
                                                                _b: Index(_bl, _i.Value),
                                                                _ant: Min(Max(Coalesce(Max(FirstN(_bl, _i.Value - 1), Max(ini, fim)), 0), 0), mapMinutosDia)
                                                            },
                                                            With(
                                                                {
                                                                    _a: Min(Max(_b.ini, _ant), mapMinutosDia)
                                                                },
                                                                With(
                                                                    {
                                                                        _z: Min(Max(_b.fim, _a), mapMinutosDia),
                                                                        _cia: LookUp(colCias As _cc, _cc.sigla = _b.cia),
                                                                        _prt: LookUp(colPortoes As _pp, _pp.portao = _b.portao),
                                                                        _bloq: _b.tipo <> "VOO",
                                                                        _cls: LookUp(colClasses As _kc, _kc.classe = LookUp(colPosicoesAero As _kp, _kp.id = _b.id_posicao).classe),
                                                                        _imped:
                                                                            _b.posicao_txt <> _p.posicao And
                                                                            !IsBlank(
                                                                                LookUp(
                                                                                    colRegras As _ri,
                                                                                    _ri.tipo_regra = "BLOQUEIO" And
                                                                                    (
                                                                                        (
                                                                                            _ri.posicao = _b.posicao_txt And
                                                                                            !IsBlank(Find("," & _p.posicao & ",", "," & Substitute(Coalesce(_ri.vizinha, ""), " ", "") & ","))
                                                                                        ) Or
                                                                                        (
                                                                                            _ri.posicao = _p.posicao And
                                                                                            !IsBlank(Find("," & _b.posicao_txt & ",", "," & Substitute(Coalesce(_ri.vizinha, ""), " ", "") & ","))
                                                                                        )
                                                                                    )
                                                                                ).posicao
                                                                            ),
                                                                        _pend:
                                                                            _b.tipo = "VOO" And
                                                                            (
                                                                                IsBlank(_b.equip) Or
                                                                                !IsBlank(Find("CONFERIR", Upper(Coalesce(_b.obs, "")))) Or
                                                                                (
                                                                                    IsBlank(_b.portao) And
                                                                                    LookUp(colPosicoesAero As _pz, _pz.id = _b.id_posicao).tipo = "PONTE"
                                                                                )
                                                                            )
                                                                    },
                                                                    {
                                                                        ord: _i.Value,
                                                    id: _b.id,
                                                                        ini: _a,
                                                                        fim: _z,
                                                                        dur: _z - _a,
                                                                        dica_txt: _b.dica_txt,
                                                                        html: If(
                                                                            _a > _ant,
                                                                            "<td style='width:" & Text((_a - _ant) * 100 / mapMinutosDia, "0.000", "en-US") & "%;'>&nbsp;</td>",
                                                                            ""
                                                                        ) &
                                                                        "<td title='" & _b.dica & "' style='box-sizing:border-box;width:" & Text((_z - _a) * 100 / mapMinutosDia, "0.000", "en-US") & "%;height:" & (mapAlturaLinha - 14) & "px;" &
                                                                        "background:" & If(_imped, hxGradeLinha, _bloq, hxTextoFraco, _b.pesq = 1, hxVermelho, IsBlank(_b.cia) Or _b.cia = "GER", Coalesce(_cls.cor_hex, Coalesce(_cia.cor_hex, hxBorda)), Coalesce(_cia.cor_hex, hxBorda)) & ";" &
                                                                        "color:" & If(_imped, hxTextoFraco, _bloq Or _b.pesq = 1, hxTextoBarra, IsBlank(_b.cia) Or _b.cia = "GER", Coalesce(_cls.cor_texto, Coalesce(_cia.cor_texto, hxTexto)), Coalesce(_cia.cor_texto, hxTexto)) & ";" &
                                                                        "border:3px " & If(_imped, "dashed", _pend, "dashed", "solid") & " " &
                                                                        If(_imped, hxTextoFraco, _pend And IsBlank(_b.portao), hxAmbar, Coalesce(_prt.cor_hex, hxBorda)) & ";" &
                                                                        "font-size:10px;font-weight:700;line-height:1.15;padding:0 3px;text-align:center;overflow:hidden;'>" &
                                                                        "<div style='white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" &
                                                                        If(_b.de_antes = 1, "&laquo;&nbsp;", "") &
                                                                        If(
                                                                            !_imped And _b.pesq = 1,
                                                                            "<span style='background:" & hxTextoBarra & ";color:" & hxVermelho & ";padding:0 3px;margin-right:3px;'>P</span>",
                                                                            ""
                                                                        ) &
                                                                        If(
                                                                            !_imped And _b.intl = 1,
                                                                            "<span style='background:" & hxInternacional & ";color:" & hxTexto & ";padding:0 3px;margin-right:3px;'>I</span>",
                                                                            ""
                                                                        ) &
                                                                        With(
                                                                            { _cd: LookUp(colCondicoes As _cc, _cc.cond = _b.cond) },
                                                                            If(
                                                                                _imped Or IsBlank(_cd.cor_hex) Or _cd.cor_hex = "",
                                                                                "",
                                                                                "<span style='background:" & _cd.cor_hex & ";color:" & hxTextoBarra & ";padding:0 3px;margin-right:3px;'>" & _cd.selo & "</span>"
                                                                            )
                                                                        ) &
                                                                        If(
                                                                            _imped,
                                                                            "INDISPONÍVEL &middot; " & _b.posicao_txt,
                                                                            _bloq,
                                                                            If(_b.tipo = "INTERDICAO", "INTERDITADO", "RESERVADO") &
                                                                            If(IsBlank(_b.prefixo), "", " &middot; " & _b.prefixo),
                                                                            Trim(
                                                                                Coalesce(_b.cia, "") & " " &
                                                                                If(
                                                                                    IsBlank(_b.voo_ida) And IsBlank(_b.voo_volta),
                                                                                    Coalesce(_b.prefixo, ""),
                                                                                    Coalesce(_b.voo_ida, "") &
                                                                                    If(
                                                                                        !IsBlank(_b.voo_volta),
                                                                                        If(IsBlank(_b.voo_ida), "", "/") & _b.voo_volta,
                                                                                        ""
                                                                                    )
                                                                                )
                                                                            )
                                                                        ) &
                                                                        If(_b.para_depois = 1, "&nbsp;&raquo;", "") &
                                                                        "</div>" &
                                                                        "<div style='font-size:8px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" &
                                                                        Text(Int(_b.ini / 60), "00") & ":" & Text(Mod(_b.ini, 60), "00") & "&ndash;" &
                                                                        Text(Int(_b.fim / 60), "00") & ":" & Text(Mod(_b.fim, 60), "00") &
                                                                        If(!IsBlank(_b.portao), " &middot; P" & _b.portao, "") &
                                                                        "</div></td>"
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    ),
                                                    _ult: Min(Max(Coalesce(Max(_bl, Max(ini, fim)), 0), 0), mapMinutosDia)
                                                },
                                                {
                                                    id_posicao: _p.id,
                                                    posicao: _p.posicao,
                                                    patio: _p.patio,
                                                    qtd: CountRows(_bl),
                                                    restricao: _restricao,
                                                    cor_patio: _corPatio,
                                                    trechos: _trechos,
                                                    html: "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;" & htmlFonte & "'><tr>" &
                                                    "<td style='width:" & mapLarguraRotulo & "px;height:" & mapAlturaLinha & "px;box-sizing:border-box;padding:6px 8px;vertical-align:middle;border-top:" & _topo & ";border-left:4px solid " & _corPatio & ";border-right:1px solid " & hxGradeLinha & ";'>" &
                                                    "<div style='font-size:15px;font-weight:800;color:" & hxPrimaria & ";line-height:1.05;'>" & _p.posicao & "</div>" &
                                                    "<div style='font-size:8px;font-weight:700;letter-spacing:.08em;color:" & hxTextoFraco & ";margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" & _restricao & "</div>" &
                                                    "</td>" &
                                                    "<td style='height:" & mapAlturaLinha & "px;box-sizing:border-box;padding:0;border-top:" & _topo & ";" & mapFundoHoras & "'>" &
                                                    If(
                                                        CountRows(_bl) = 0,
                                                        "",
                                                        "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;'><tr>" &
                                                        Concat(_trechos As _t, _t.html) &
                                                        If(
                                                            _ult < mapMinutosDia,
                                                            "<td style='width:" & Text((mapMinutosDia - _ult) * 100 / mapMinutosDia, "0.000", "en-US") & "%;'>&nbsp;</td>",
                                                            ""
                                                        ) &
                                                        "</tr></table>"
                                                    ) &
                                                    "</td></tr></table>"
                                                }
                                            )
                                        )
                                    )
                                );
                                Set(varPosSel, LookUp(colGrade As _g, _g.id_posicao = varPosSel.id_posicao));
                                UpdateContext({locDesatualizado: false})
                              PaddingLeft: =12
                              PaddingRight: =12
                              Text: ="ATUALIZAR"
                              Width: =134
                        - btnNovoMap:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmAcao
                              BorderRadius: =0
                              DisplayMode: =If(varPodeEditar, DisplayMode.Edit, DisplayMode.Disabled)
                              FontColor: =thmTextoBarra
                              FontSize: =13
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              Icon: ="Add"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varNovoIni, -1);
                                Select(btnAbrirNovoMap)
                              PaddingLeft: =14
                              PaddingRight: =14
                              Text: ="NOVO REGISTRO"
                              Width: =186
                  - cntGradeMap:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmSuperficie
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
