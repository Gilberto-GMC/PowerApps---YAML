Screens:
  scrMapaPatio:
    Properties:
      OnHidden: =Set(varMapaVisivel, false)
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, usrAeroPadrao));
        If(IsBlank(varAeroNome), Set(varAeroNome, usrAeroPadrao));
        Set(varMapaVisivel, true);
        Set(varLegendaAberta, Coalesce(varLegendaAberta, true));
        Set(varPainelAberto, false);
        Set(varHangarAberto, false);
        Set(varAlocSel, Blank());
        Set(varNovoIni, -1);
        UpdateContext(
            {
                locPatio: "TODOS",
                locNonce: 0, locNonceEq: 0, locEquipSug: "",
                locResExpandido: false,
                locConfirmaConting: 0,
                locConfirmaPortao: "", locConfirmaEnv: 0, locConfirmaAlt: "",
                locConfirmaExcluir: 0,
                locSalvando: false,
                locHangarForm: false, locHangarExcluir: 0, locHangarSalvando: false, locHangarExpandido: false,
                locHangarPos: Blank(), locHangarEdit: Blank(),
                locHangarDados: { prefixo: "", equip: "—", data: Today(), hora: "", obs: "" },
                locOcupado: Blank()
            }
        );
        ClearCollect(colEquip, Sort(Filter(tb_equipamentos, ativo = 1), ordem, SortOrder.Ascending));
        ClearCollect(colRegras, Filter(tb_regrasPosicao, aeroporto = varAero And ativo = 1));
        Set(varVerFinalizados, Coalesce(varVerFinalizados, true));
        Set(varCliqueCel, "");
        Set(varCliqueEm, Now());
        Set(varJanelaMin, Coalesce(varJanelaMin, mapJanelaPadrao));
        Set(varJanelaIni, Coalesce(varJanelaIni, Min(mapMinutosDia - varJanelaMin, If(varData = Today(), Hour(Now()) * 60, 0))));
        ClearCollect(colEquipSel, Table({ Value: "—" }));
        Collect(colEquipSel, ForAll(Sort(colEquip, equip, SortOrder.Ascending) As _e, { Value: _e.equip }));
        Select(btnAtualizarMap)
    Children:
      - btnDesenharMap:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Set(varAgoraMin, If(varData = Today(), Hour(Now()) * 60 + Minute(Now()), -1));
              // O agora e congelado no desenho: regua e linhas leem daqui. O timer redesenha a cada 5 min no dia de hoje.
              ClearCollect(
                  colGrade,
                  ForAll(
                      Sort(Filter(colPosicoesAero, IsBlank(ocupa)), ordem, SortOrder.Ascending) As _p,
                      With(
                          {
                              _bl: Sort(
                                  Filter(
                                      colDia,
                                      id_posicao = _p.id Or
                                      // Finalizado libera: fica so na propria linha, sem ocupar nem bloquear vizinhas —
                                      // o mesmo que o SALVAR ja faz ao tirar FINALIZADO do colValida.
                                      cond <> "FINALIZADO" And (
                                      !IsBlank(
                                          Find(
                                              "," & _p.posicao & ",",
                                              "," &
                                              Substitute(
                                                  Coalesce(
                                                      LookUp(colPosicoesAero As _q, _q.posicao = posicao_txt).ocupa,
                                                      ""
                                                  ),
                                                  " ",
                                                  ""
                                              ) & ","
                                          )
                                      ) Or
                                      !IsBlank(
                                          LookUp(
                                              colRegras As _rr,
                                              _rr.tipo_regra = "BLOQUEIO" And IsBlank(_rr.equip_a) And IsBlank(_rr.equip_b) And
                                              (
                                                  (
                                                      _rr.posicao = posicao_txt And
                                                      !IsBlank(Find("," & _p.posicao & ",", "," & Substitute(Coalesce(_rr.vizinha, ""), " ", "") & ","))
                                                  ) Or
                                                  (
                                                      _rr.posicao = _p.posicao And
                                                      !IsBlank(Find("," & posicao_txt & ",", "," & Substitute(Coalesce(_rr.vizinha, ""), " ", "") & ","))
                                                  )
                                              )
                                          ).posicao
                                      )
                                      )
                                  ),
                                  ini,
                                  SortOrder.Ascending
                              ),
                              _corPatio: Coalesce(LookUp(colPatiosAero As _cp, _cp.patio = _p.patio).cor_hex, hxPrimaria),
                              _txtPatio: Coalesce(LookUp(colPatiosAero As _ct, _ct.patio = _p.patio).cor_texto, hxTextoBarra),
                              _sigla: Coalesce(LookUp(colPatiosAero As _cs, _cs.patio = _p.patio).sigla, ""),
                              // Quantas linhas o pátio ocupa na grade e qual e a posicao desta dentro dele — e o que
                              // permite espalhar as letras da sigla uma por linha, centradas no grupo.
                              _qtdPatio: CountRows(Filter(colPosicoesAero As _qa, _qa.patio = _p.patio And IsBlank(_qa.ocupa))),
                              _idxPatio: CountRows(Filter(colPosicoesAero As _qb, _qb.patio = _p.patio And IsBlank(_qb.ocupa) And _qb.ordem <= _p.ordem)),
                              // Posicao que consome esta: a T6C consome T5 e T6, e o operador precisa lembrar disso
                              // olhando a linha da T5, onde a T6C nunca aparece como rotulo.
                              _consome: Concat(
                                  Filter(
                                      colPosicoesAero As _qc,
                                      !IsBlank(Find("," & _p.posicao & ",", "," & Substitute(Coalesce(_qc.ocupa, ""), " ", "") & ","))
                                  ),
                                  posicao,
                                  "/"
                              ),
                              _restricao: If(
                                  !IsBlank(_p.aeronave_max),
                                  _p.aeronave_max,
                                  If(_p.classe = "HELICOPTERO", "HELICÓPTERO", "CLASSE " & _p.classe)
                              ),
                              _linha: Coalesce(LookUp(colClasses As _lc, _lc.classe = _p.classe).linha_hex, ""),
                              _topo: If(
                                  _p.ordem = Min(Filter(colPosicoesAero As _q, _q.patio = _p.patio), ordem),
                                  "2px solid " & hxBorda,
                                  "1px solid " & hxGradeLinha
                              )
                          },
                          With(
                              {
                                  _trechos: ForAll(
                                      Sequence(CountRows(_bl)) As _i,
                                      With(
                                          {
                                              _b: Index(_bl, _i.Value),
                                              _ant: Min(Max(Coalesce(Max(FirstN(_bl, _i.Value - 1), Max(ini, fim)), varJanelaIni), varJanelaIni), (varJanelaIni + varJanelaMin))
                                          },
                                          With(
                                              {
                                                  _a: Min(Max(_b.ini, _ant), (varJanelaIni + varJanelaMin))
                                              },
                                              With(
                                                  {
                                                      _z: Min(Max(_b.fim, _a), (varJanelaIni + varJanelaMin)),
                                                      _cia: LookUp(colCias As _cc, _cc.sigla = _b.cia),
                                                      _prt: LookUp(colPortoes As _pp, _pp.portao = _b.portao),
                                                      _bloq: _b.tipo <> "VOO",
                                                      // Voo que ja terminou sai da atencao como o finalizado. abs_fim e dia + hora, entao o voo que
                                                      // vira a noite nao fica cinza antes da hora.
                                                      _passou: _b.tipo = "VOO" And _b.abs_fim <= DateDiff(mapDataBase, Today(), TimeUnit.Days) * mapMinutosDia + Hour(Now()) * 60 + Minute(Now()),
                                                      _cls: LookUp(colClasses As _kc, _kc.classe = LookUp(colPosicoesAero As _kp, _kp.id = _b.id_posicao).classe),
                                                      _imped:
                                                          _b.posicao_txt <> _p.posicao And
                                                          !IsBlank(
                                                              LookUp(
                                                                  colRegras As _ri,
                                                                  _ri.tipo_regra = "BLOQUEIO" And IsBlank(_ri.equip_a) And IsBlank(_ri.equip_b) And
                                                                  (
                                                                      (
                                                                          _ri.posicao = _b.posicao_txt And
                                                                          !IsBlank(Find("," & _p.posicao & ",", "," & Substitute(Coalesce(_ri.vizinha, ""), " ", "") & ","))
                                                                      ) Or
                                                                      (
                                                                          _ri.posicao = _p.posicao And
                                                                          !IsBlank(Find("," & _b.posicao_txt & ",", "," & Substitute(Coalesce(_ri.vizinha, ""), " ", "") & ","))
                                                                      )
                                                                  )
                                                              ).posicao
                                                          ),
                                                      _pend:
                                                          _b.tipo = "VOO" And
                                                          (
                                                              IsBlank(_b.equip) Or
                                                              !IsBlank(Find("CONFERIR", Upper(Coalesce(_b.obs, "")))) Or
                                                              (
                                                                  IsBlank(_b.portao) And
                                                                  LookUp(colPosicoesAero As _pz, _pz.id = _b.id_posicao).tipo = "PONTE"
                                                              )
                                                          )
                                                  },
                                                  {
                                                      ord: _i.Value,
                                  id: _b.id,
                                                      ini: _a,
                                                      fim: _z,
                                                      dur: _z - _a,
                                                      dica_txt: _b.dica_txt,
                                                      html: If(
                                                          _a > _ant,
                                                          "<td style='width:" & Text((_a - _ant) * 100 / Max(varJanelaMin, 60), "0.000", "en-US") & "%;'>&nbsp;</td>",
                                                          ""
                                                      ) &
                                                      If(
                                                          _z > _a,
                                                      "<td title='" & _b.dica & "' style='box-sizing:border-box;width:" & Text((_z - _a) * 100 / Max(varJanelaMin, 60), "0.000", "en-US") & "%;height:" & (mapAlturaLinha - 14) & "px;" &
                                                      "background:" & If(_imped, hxGradeLinha, _b.cond = "FINALIZADO" Or _passou, hxFinalizado, _bloq, hxTextoFraco, _b.pesq = 1, hxVermelho, IsBlank(_b.cia) Or _b.cia = "GER", Coalesce(_cls.cor_hex, Coalesce(_cia.cor_hex, hxBorda)), Coalesce(_cia.cor_hex, hxBorda)) & ";" &
                                                      "color:" & If(_imped, hxTextoFraco, _b.cond = "FINALIZADO" Or _passou, hxTextoFraco, _bloq Or _b.pesq = 1, hxTextoBarra, IsBlank(_b.cia) Or _b.cia = "GER", Coalesce(_cls.cor_texto, Coalesce(_cia.cor_texto, hxTexto)), Coalesce(_cia.cor_texto, hxTexto)) & ";" &
                                                      "border:3px " & If(_imped, "dashed", _b.cond = "FINALIZADO" Or _passou, "solid", _pend, "dashed", "solid") & " " &
                                                      If(_imped, hxTextoFraco, _b.cond = "FINALIZADO" Or _passou, hxFinalizadoBorda, _pend And IsBlank(_b.portao), hxAmbar, Coalesce(_prt.cor_hex, hxBorda)) & ";" &
                                                      "font-size:10px;font-weight:700;line-height:1.15;padding:0 3px;text-align:center;overflow:hidden;" &
                                                      "'>" &
                                                      "<div style='white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" &
                                                      If(_b.de_antes = 1 Or _b.ini < varJanelaIni, "&laquo;&nbsp;", "") &
                                                      If(
                                                          !_imped And _b.pesq = 1,
                                                          "<span style='background:" & hxTextoBarra & ";color:" & hxVermelho & ";padding:0 3px;margin-right:3px;'>P</span>",
                                                          ""
                                                      ) &
                                                      If(
                                                          !_imped And _b.intl = 1,
                                                          "<span style='background:" & hxInternacional & ";color:" & hxTexto & ";padding:0 3px;margin-right:3px;'>I</span>",
                                                          ""
                                                      ) &
                                                      If(
                                                          !_imped And _b.alt = 1,
                                                          "<span style='background:" & hxAlternativa & ";color:" & hxTextoBarra & ";padding:0 3px;margin-right:3px;'>A</span>",
                                                          ""
                                                      ) &
                                                      With(
                                                          { _cd: LookUp(colCondicoes As _cc, _cc.cond = _b.cond) },
                                                          If(
                                                              _imped Or IsBlank(_cd.cor_hex) Or _cd.cor_hex = "",
                                                              "",
                                                              "<span style='background:" & _cd.cor_hex & ";color:" & hxTextoBarra & ";padding:0 3px;margin-right:3px;'>" & _cd.selo & "</span>"
                                                          )
                                                      ) &
                                                      If(
                                                          _imped,
                                                          "INDISPONÍVEL &middot; " & _b.posicao_txt,
                                                          _bloq,
                                                          If(IsBlank(_b.prefixo), "", _b.prefixo & " &middot; ") &
                                                          If(_b.tipo = "INTERDICAO", "INTERDITADO", _b.cond = "NO PATIO", "NO PÁTIO", _b.alt = 1, "ALTERNATIVA", "RESERVADO"),
                                                          Trim(
                                                              Coalesce(_b.cia, "") & " " &
                                                              If(
                                                                  IsBlank(_b.voo_ida) And IsBlank(_b.voo_volta),
                                                                  Coalesce(_b.prefixo, ""),
                                                                  Coalesce(_b.voo_ida, "") &
                                                                  If(
                                                                      !IsBlank(_b.voo_volta),
                                                                      If(IsBlank(_b.voo_ida), "", "/") & _b.voo_volta,
                                                                      ""
                                                                  )
                                                              )
                                                          )
                                                      ) &
                                                      If(_b.para_depois = 1 Or _b.fim > (varJanelaIni + varJanelaMin), "&nbsp;&raquo;", "") &
                                                      "</div>" &
                                                      "<div style='font-size:8px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" &
                                                      Text(Int(_b.ini / 60), "00") & ":" & Text(Mod(_b.ini, 60), "00") & "&ndash;" &
                                                      Text(Int(_b.fim / 60), "00") & ":" & Text(Mod(_b.fim, 60), "00") &
                                                      If(!IsBlank(_b.portao), " &middot; P" & _b.portao, "") &
                                                      "</div></td>",
                                                          ""
                                                      )
                                                  }
                                              )
                                          )
                                      )
                                  ),
                                  _ult: Min(Max(Coalesce(Max(_bl, Max(ini, fim)), varJanelaIni), varJanelaIni), (varJanelaIni + varJanelaMin))
                              },
                              {
                                  id_posicao: _p.id,
                                  posicao: _p.posicao,
                                  patio: _p.patio,
                                  qtd: CountRows(_bl),
                                  restricao: _restricao,
                                  cor_patio: _corPatio,
                                  trechos: _trechos,
                                  html: "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;" & htmlFonte & "'><tr>" &
                                  // A faixa e o rotulo somam os mesmos 132px que a regua reserva. Mexer num sem o outro
                                  // desalinha todas as colunas da grade.
                                  "<td style='width:22px;height:" & mapAlturaLinha & "px;box-sizing:border-box;padding:0;text-align:center;vertical-align:middle;background:" & _corPatio & ";border-top:" & _topo & ";'>" &
                                  With(
                                      { _ini: RoundDown((_qtdPatio - Len(_sigla)) / 2, 0) + 1 },
                                      If(
                                          _idxPatio >= _ini And _idxPatio < _ini + Len(_sigla),
                                          "<div style='font-size:12px;font-weight:800;line-height:1;color:" & _txtPatio & ";'>" & Mid(_sigla, _idxPatio - _ini + 1, 1) & "</div>",
                                          ""
                                      )
                                  ) &
                                  "</td>" &
                                  "<td style='" & If(_linha = "", "", "background:" & _linha & ";") & "width:" & (mapLarguraRotulo - 22) & "px;height:" & mapAlturaLinha & "px;box-sizing:border-box;padding:6px 8px;vertical-align:middle;border-top:" & _topo & ";border-right:1px solid " & hxGradeLinha & ";'>" &
                                  "<div style='font-size:15px;font-weight:800;color:" & hxPrimaria & ";line-height:1.05;'>" & _p.posicao & "</div>" &
                                  "<div style='font-size:8px;font-weight:700;letter-spacing:.08em;color:" & hxTextoFraco & ";margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>" & _restricao &
                                  If(IsBlank(_consome) Or _consome = "", "", " <span style='opacity:.55;'>(" & _consome & ")</span>") & "</div>" &
                                  "</td>" &
                                  "<td style='height:" & mapAlturaLinha & "px;box-sizing:border-box;padding:0;border-top:" & _topo & ";" & If(_linha = "", "", "background-color:" & _linha & ";") & "background-image:" & If(varAgoraMin >= varJanelaIni And varAgoraMin < varJanelaIni + varJanelaMin, "linear-gradient(to right,transparent " & Text((varAgoraMin - varJanelaIni) * 100 / Max(varJanelaMin, 60), "0.000", "en-US") & "%,rgba(185,28,28,.28) " & Text((varAgoraMin - varJanelaIni) * 100 / Max(varJanelaMin, 60), "0.000", "en-US") & "%,rgba(185,28,28,.28) " & Text((varAgoraMin - varJanelaIni) * 100 / Max(varJanelaMin, 60) + 0.15, "0.000", "en-US") & "%,transparent " & Text((varAgoraMin - varJanelaIni) * 100 / Max(varJanelaMin, 60) + 0.15, "0.000", "en-US") & "%),", "") & "repeating-linear-gradient(to right," & hxTextoFraco & " 0," & hxTextoFraco & " 1px,transparent 1px,transparent " & Text(RoundDown(6000 / Max(varJanelaMin, 60), 4), "0.0000", "en-US") & "%),repeating-linear-gradient(to right," & hxGradeLinha & " 0," & hxGradeLinha & " 1px,transparent 1px,transparent " & Text(RoundDown(1500 / Max(varJanelaMin, 60), 4), "0.0000", "en-US") & "%);" & "'>" &
                                  If(
                                      CountRows(_bl) = 0,
                                      "",
                                      "<table style='width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;'><tr>" &
                                      Concat(_trechos As _t, _t.html) &
                                      If(
                                          _ult < (varJanelaIni + varJanelaMin),
                                          "<td style='width:" & Text(((varJanelaIni + varJanelaMin) - _ult) * 100 / Max(varJanelaMin, 60), "0.000", "en-US") & "%;'>&nbsp;</td>",
                                          ""
                                      ) &
                                      "</tr></table>"
                                  ) &
                                  "</td></tr></table>"
                              }
                          )
                      )
                  )
              );
              Set(varPosSel, LookUp(colGrade As _g, _g.id_posicao = varPosSel.id_posicao))
            Text: =""
            Visible: =false
            Width: =1
      - btnAbrirEdicaoMap:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Set(
                  varForm,
                  {
                      tipo: Coalesce(LookUp(colTiposReg As _t, _t.tipo = varAlocSel.tipo).rotulo, "Voo"),
                      posicao: varAlocSel.posicao_txt,
                      data: varAlocSel.data_ini,
                      dataf: varAlocSel.data_f,
                      cia: If(IsBlank(varAlocSel.cia), "—", varAlocSel.cia),
                      voo_ida: varAlocSel.voo_ida,
                      voo_volta: varAlocSel.voo_volta,
                      prefixo: varAlocSel.prefixo,
                      portao: If(IsBlank(varAlocSel.portao), "—", varAlocSel.portao),
                      ini: Text(Int(varAlocSel.h_ini / 60), "00") & ":" & Text(Mod(varAlocSel.h_ini, 60), "00"),
                      fim: Text(Int(varAlocSel.h_fim / 60), "00") & ":" & Text(Mod(varAlocSel.h_fim, 60), "00"),
                      equip: Coalesce(LookUp(colEquip As _e, _e.equip = varAlocSel.equip).equip, "—"),
                      env: If(Value(Text(varAlocSel.env)) > 0, Text(varAlocSel.env), ""),
                      obs: varAlocSel.obs,
                      pesq: varAlocSel.pesq = 1,
                      intl: varAlocSel.intl = 1,
                      alt: varAlocSel.alt = 1,
                      cond: Coalesce(LookUp(colCondicoes As _c, _c.cond = varAlocSel.cond).rotulo, "Previsto"),
                      resp: varAlocSel.resp,
                      contato: varAlocSel.contato
                  }
              );
              Set(varPosSel, LookUp(colGrade As _g, _g.id_posicao = varAlocSel.id_posicao));
              UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locConfirmaPortao: "", locConfirmaEnv: 0, locNonce: locNonce + 1, locNonceEq: locNonceEq + 1, locEquipSug: ""});
              Set(varPainelAberto, true)
            Text: =""
            Visible: =true
            Width: =1
            X: =0
            Y: =0
      - btnAbrirNovoMap:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =Set(varAlocSel, Blank());
              Set(
                  varForm,
                  {
                      tipo: "Voo",
                      posicao: Coalesce(varPosSel.posicao, "T1"),
                      data: varData,
                      dataf: varData,
                      cia: "—",
                      voo_ida: "",
                      voo_volta: "",
                      prefixo: "",
                      portao: "—",
                      ini: If(
                          varNovoIni < 0,
                          "",
                          Text(Int(varNovoIni / 60), "00") & ":" & Text(Mod(varNovoIni, 60), "00")
                      ),
                      fim: If(
                          varNovoIni < 0,
                          "",
                          Text(Int((varNovoIni + mapDuracaoPadrao) / 60), "00") & ":" &
                          Text(Mod(varNovoIni + mapDuracaoPadrao, 60), "00")
                      ),
                      equip: "—",
                      env: "",
                      obs: "",
                      pesq: false,
                      intl: false,
                      alt: false,
                      cond: "Previsto",
                      resp: "",
                      contato: ""
                  }
              );
              UpdateContext({locConfirmaExcluir: 0, locConfirmaConting: 0, locConfirmaPortao: "", locConfirmaEnv: 0, locNonce: locNonce + 1, locNonceEq: locNonceEq + 1, locEquipSug: ""});
              Set(varPainelAberto, true)
            Text: =""
            Visible: =true
            Width: =1
            X: =0
            Y: =0
      - cntShellMap:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuMap:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaMap:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavMap:
