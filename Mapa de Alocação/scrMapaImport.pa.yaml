Screens:
  scrMapaImport:
    Properties:
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, usrAeroPadrao));
        If(IsBlank(varAeroNome), Set(varAeroNome, usrAeroPadrao));
        Set(varMenuConfig, true);
        Set(varMapaVisivel, false);
        Set(varPodeCatalogo, DataSourceInfo('tb_importacaoMapa', DataSourceInfo.EditPermission));
        ResetForm(frmImportImp);
        If(
            IsBlank(varImportId),
            Set(
                varImportId,
                First(
                    Sort(
                        Filter(tb_importacaoMapa, aeroporto = varAero And (status = "PRONTO" Or status = "PROCESSANDO")),
                        ID,
                        SortOrder.Descending
                    )
                ).ID
            )
        );
        If(
            !IsBlank(varImportId),
            UpdateContext({locImp: LookUp(tb_importacaoMapa, ID = varImportId)})
        )
    Children:
      - cntShellImp:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuImp:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaImp:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavImp:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaPatio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavCfgImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Settings"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuConfig, !varMenuConfig)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, If(varMenuConfig, "CONFIGURAÇÕES  ▾", "CONFIGURAÇÕES  ▸"), "")
                        - btnNavRefImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaReferencia, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavEqpImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Airplane"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaEquip, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "EQUIPAMENTOS", "")
                        - btnNavRgrImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="LockClosed"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaRegra, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "RESTRIÇÕES", "")
                        - btnNavImpImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Upload"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "IMPORTAÇÃO / EXPORTAÇÃO", "")
                        - btnNavInicioImp:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - btnRecolherImp:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Start
                        Width: =If(varMenuAberto, 180, 52)
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmBotaoBarra
                        BorderRadius: =0
                        FillPortions: =0
                        FontColor: =thmTextoBarra
                        FontSize: =11
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinHeight: =36
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizImp:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraImp:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>IMPORTAÇÃO / EXPORTAÇÃO</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAeroNome & " &nbsp;&middot;&nbsp; " & If(varPodeCatalogo, "lançar o mês a partir da planilha, ou tirar a movimentação em Excel", "SOMENTE LEITURA") & "</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                  - cntConteudoImp:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmAjudaImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmSuperficie
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "background:" & hxPrimariaClara & ";padding:12px 14px;font-size:11px;" &
                                "line-height:1.6;color:" & hxTexto & ";'>" &
                                "<b>Como funciona.</b> Anexe a planilha de programação do mês, escolha o mês e toque em GERAR. " &
                                "O pareamento de pouso com decolagem e a alocação de posição e portão são feitos automaticamente." &
                                "<br><br>" &
                                "O que entra é <b>pré-lançamento</b>: alguém deve conferir posição e portão na grade depois. " &
                                "Voo que não achar posição livre não é inventado — vira pendência e aparece no resumo." &
                                "<br><br>" &
                                "<b>Como a planilha precisa estar.</b> Uma linha por movimento, " &
                                "<b>pousos e decolagens na mesma aba</b> — é o par entre eles que forma a ocupação da posição. " &
                                "O arquivo é lido pela <b>primeira aba</b>, com os títulos na <b>linha 1</b>." &
                                "<br><br>" &
                                "<table style='border-collapse:collapse;font-size:11px;'>" &
                                "<tr><th style='text-align:left;padding:2px 14px 2px 0;border-bottom:1px solid " & hxBorda & ";'>COLUNA</th>" &
                                "<th style='text-align:left;padding:2px 0;border-bottom:1px solid " & hxBorda & ";'>O QUE VAI NELA</th></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Data</b></td><td>data do movimento, como data de verdade do Excel</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Horário</b></td><td>hora do movimento, como hora de verdade do Excel</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Empresa</b></td><td>GOL, LATAM, AZUL ou ABSA</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Voo</b></td><td>número do voo</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Rota</b></td><td>ex. NVT - GRU</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Aeronave</b></td><td>código IATA: 73H, 7M8, 320, 319, 295 ou 76V</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;'><b>Pouso</b></td><td>a palavra POUSO ou DECOLAGEM</td></tr>" &
                                "</table>" &
                                "<br>" &
                                "A ordem das colunas não importa — elas são achadas <b>pelo nome do título</b>, sem diferenciar " &
                                "maiúscula de minúscula nem acento. Colunas a mais são ignoradas." &
                                "<br><br>" &
                                "<b style='color:" & hxAmbar & ";'>Atenção:</b> se <b>Data</b> ou <b>Horário</b> vierem como texto " &
                                "em vez de data e hora do Excel, a linha é <b>ignorada em silêncio</b> — não vira pendência e não " &
                                "aparece em lugar nenhum. Se o total vier menor que o esperado, é o primeiro lugar a olhar. " &
                                "Empresa fora da lista e aeronave sem código conhecido, ao contrário, aparecem no resumo." &
                                "</div>"
                              Size: =11
                        - cntEntradaImp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblMesImp:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Size: =10
                                    Text: ="MÊS DE REFERÊNCIA *"
                              - dtpMesImp:
                                  Control: DatePicker@0.0.46
                                  Properties:
                                    AccessibleLabel: ="Mês da programação a importar"
                                    DisplayMode: =If(varPodeCatalogo And IsBlank(varImportId), DisplayMode.Edit, DisplayMode.View)
                                    FillPortions: =0
                                    Format: =DateTimeFormat.ShortDate
                                    Height: =40
                                    SelectedDate: =Coalesce(varMesImp, DateAdd(Date(Year(Today()), Month(Today()), 1), 1, TimeUnit.Months))
                                    Width: =200
                              - lblArqImp:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =thmTextoFraco
                                    Font: =thmFonte
                                    FontWeight: =FontWeight.Bold
                                    Height: =18
                                    Size: =10
                                    Text: ="PLANILHA DE PROGRAMAÇÃO *"
                              - frmImportImp:
                                  Control: Form@2.4.4
                                  Layout: Vertical
                                  Properties:
                                    BorderColor: =thmBorda
                                    DataSource: =tb_importacaoMapa
                                    DefaultMode: =FormMode.New
                                    Fill: =thmSuperficie
                                    FillPortions: =0
                                    Height: =210
                                    LayoutMinHeight: =0
                                    NumberOfColumns: =1
                                    OnFailure: |-
                                      =Notify(
                                          "Não foi possível enviar o arquivo. Confira se a planilha está anexada e tente de novo.",
                                          NotificationType.Error,
                                          7000
                                      )
                                    OnSuccess: |-
                                      =Set(varImportId, Self.LastSubmit.ID);
                                      Set(varMesImp, Date(Year(dtpMesImp.SelectedDate), Month(dtpMesImp.SelectedDate), 1));
                                      Patch(
                                          tb_importacaoMapa,
                                          LookUp(tb_importacaoMapa, ID = Self.LastSubmit.ID),
                                          {
                                              aeroporto: varAero,
                                              mes_ref: varMesImp,
                                              status: "PRONTO",
                                              total: 0,
                                              processados: 0,
                                              criados: 0,
                                              pendencias: 0,
                                              ativo: 1
                                          }
                                      );
                                      UpdateContext({locImp: LookUp(tb_importacaoMapa, ID = varImportId)});
                                      Notify("Arquivo enviado. O processamento começa em instantes.", NotificationType.Success, 4000)
                                    Width: =Parent.Width - 32
                                  Children:
                                    - cardAeroImp:
                                        Control: TypedDataCard@1.0.7
                                        Variant: TextualEdit
                                        Properties:
                                          BorderColor: =thmBorda
                                          DataField: ="aeroporto"
                                          Default: =ThisItem.aeroporto
                                          DisplayName: ="aeroporto"
                                          Height: =1
                                          Required: =true
                                          Update: =varAero
                                          Visible: =false
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =0
                                    - cardMesImp:
                                        Control: TypedDataCard@1.0.7
                                        Variant: DateTimeEdit
                                        Properties:
                                          BorderColor: =thmBorda
                                          DataField: ="mes_ref"
                                          Default: =ThisItem.mes_ref
                                          DisplayName: ="mes_ref"
                                          Height: =1
                                          Required: =true
                                          Update: =Date(Year(dtpMesImp.SelectedDate), Month(dtpMesImp.SelectedDate), 1)
                                          Visible: =false
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =1
                                    - cardAnexoImp:
                                        Control: TypedDataCard@1.0.7
                                        Variant: ClassicAttachmentsEdit
                                        Properties:
                                          BorderColor: =thmBorda
                                          DataField: ="{Attachments}"
                                          Default: =ThisItem.Anexos
                                          DisplayMode: =If(varPodeCatalogo And IsBlank(varImportId), DisplayMode.Edit, DisplayMode.View)
                                          DisplayName: ="Anexos"
                                          Height: =190
                                          Required: =true
                                          Update: =attImportImp.Attachments
                                          Width: =Parent.Width
                                          X: =0
                                          Y: =2
                                        Children:
                                          - lblCardAnexoImp:
                                              Control: Label@2.5.1
                                              MetadataKey: FieldName
                                              Properties:
                                                AutoHeight: =true
                                                Color: =thmTextoFraco
                                                Font: =thmFonte
                                                FontWeight: =FontWeight.Bold
                                                Height: =20
                                                PaddingLeft: =0
                                                Size: =10
                                                Text: ="arraste o .xlsx aqui ou use Anexar arquivo"
                                                Width: =Parent.Width - 60
                                                Wrap: =false
                                                Y: =0
                                          - attImportImp:
                                              Control: Attachments@2.3.0
                                              MetadataKey: FieldValue
                                              Properties:
                                                BorderColor: =thmBorda
                                                BorderThickness: =1
                                                DisplayMode: =Parent.DisplayMode
                                                Fill: =thmSuperficie
                                                Font: =thmFonte
                                                Height: =150
                                                ItemColor: =thmTexto
                                                ItemFill: =thmSuperficie
                                                Items: =Parent.Default
                                                MaxAttachments: =1
                                                NoAttachmentsText: ="nenhum arquivo anexado"
                                                Size: =11
                                                Width: =Parent.Width - 20
                                                X: =10
                                                Y: =24
                        - cntAcoesImp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnGerarImp:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =thmPrimaria
                                    BorderRadius: =0
                                    DisplayMode: =If(varPodeCatalogo And IsBlank(varImportId), DisplayMode.Edit, DisplayMode.Disabled)
                                    FillPortions: =1
                                    FontColor: =thmTextoBarra
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Icon: ="Play"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =If(
                                          IsBlank(dtpMesImp.SelectedDate),
                                          Notify("Escolha o mês de referência.", NotificationType.Error, 5000),
                                          CountRows(attImportImp.Attachments) = 0,
                                          Notify("Anexe a planilha de programação antes de gerar.", NotificationType.Error, 5000),
                                          SubmitForm(frmImportImp)
                                      )
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Text: |-
                                      =If(
                                          IsBlank(varImportId), "GERAR",
                                          Coalesce(locImp.status, "") in ["CONCLUIDO", "ERRO"], "IMPORTAÇÃO ENCERRADA",
                                          "AGUARDE…"
                                      )
                              - btnNovaImp:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =thmTextoFraco
                                    BorderRadius: =0
                                    DisplayMode: =If(varPodeCatalogo, DisplayMode.Edit, DisplayMode.Disabled)
                                    FillPortions: =1
                                    FontColor: =thmTextoFraco
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Icon: ="Add"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varImportId, Blank());
                                      UpdateContext({locImp: Blank()});
                                      ResetForm(frmImportImp)
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Text: ="NOVA IMPORTAÇÃO"
                        - htmProgressoImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "background:" & hxSuperficie & ";padding:14px 16px;'>" &
                                "<div style='font-size:11px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";'>" &
                                Upper(Switch(Coalesce(locImp.status, "-"), "PRONTO", "Na fila", "PROCESSANDO", "Gravando registros", "CONCLUIDO", "Concluído", "ERRO", "Erro", "Aguardando envio do arquivo")) & "</div>" &
                                "<div style='margin-top:8px;background:" & hxBorda & ";height:24px;'>" &
                                "<div style='background:" & hxPrimaria & ";height:24px;width:" & If(Coalesce(locImp.total, 0) = 0, 0, RoundDown(locImp.processados * 100 / locImp.total, 0)) & "%;'></div>" &
                                "</div>" &
                                "<div style='margin-top:6px;font-size:11px;color:" & hxTextoFraco & ";'>" &
                                Coalesce(locImp.processados, 0) & " de " & Coalesce(locImp.total, 0) & " registro(s) &nbsp;&middot;&nbsp; " &
                                If(Coalesce(locImp.total, 0) = 0, 0, RoundDown(locImp.processados * 100 / locImp.total, 0)) & "%</div>" &
                                "</div>"
                              Size: =11
                              Visible: =!IsBlank(varImportId)
                        - htmResultadoImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "background:" &
                                If(locImp.status = "ERRO", hxVermelhoSuave, hxAmbarSuave) &
                                ";border-left:4px solid " & If(locImp.status = "ERRO", hxVermelho, hxVerde) &
                                ";padding:12px 14px;font-size:11px;line-height:1.6;color:" & hxTexto & ";'>" &
                                "<b>" & Coalesce(locImp.criados, 0) & " registro(s) criado(s)</b>" &
                                If(
                                    Coalesce(locImp.pendencias, 0) > 0,
                                    " &nbsp;&middot;&nbsp; <b>" & locImp.pendencias & " pendência(s)</b> — voos sem par ou sem posição livre, que não entraram",
                                    " &nbsp;&middot;&nbsp; sem pendências"
                                ) &
                                If(IsBlank(locImp.mensagem), "", "<br><br>" & locImp.mensagem) &
                                "</div>"
                              Size: =11
                              Visible: =locImp.status = "CONCLUIDO" Or locImp.status = "ERRO"
                        - tmrImportImp:
                            Control: Timer@2.1.0
                            Properties:
                              AutoPause: =false
                              AutoStart: =true
                              Duration: =3000
                              OnTimerEnd: |-
                                =If(
                                    !IsBlank(varImportId) And !(Coalesce(locImp.status, "") in ["CONCLUIDO", "ERRO"]),
                                    UpdateContext({locImp: LookUp(tb_importacaoMapa, ID = varImportId)})
                                )
                              Repeat: =true
                              Visible: =false

                        - htmExpTituloImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "border-top:1px solid " & hxBorda & ";margin-top:18px;padding-top:18px;'>" &
                                "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>EXPORTAR</div>" &
                                "<div style='font-size:19px;font-weight:800;color:" & hxPrimaria & ";margin-top:4px;'>Movimentação em planilha</div>" &
                                "<div style='font-size:12px;color:" & hxTexto & ";margin-top:8px;line-height:1.6;max-width:760px;'>" &
                                "Gera um arquivo CSV com a movimentação do período escolhido — passado ou futuro — que abre direto no Excel. " &
                                "Serve para enviar a programação a quem não usa o app e para consultar o que já aconteceu. " &
                                "O pedido entra numa fila: toque em GERAR, espere alguns segundos e use ATUALIZAR para ver o arquivo pronto." &
                                "</div></div>"
                              Size: =12
                        - cntExpFiltrosImp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =thmBorda
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =thmSuperficie
                              FillPortions: =0
                              Height: =306
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =14
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - cntExpLinhaImp:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =thmSuperficie
                                    FillPortions: =0
                                    Height: =70
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - cntExpDeImp:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmSuperficie
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =230
                                        Children:
                                          - lblExpDeImp:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =thmTextoFraco
                                                Font: =thmFonte
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Size: =10
                                                Text: ="DE (data da operação) *"
                                          - dtpExpDeImp:
                                              Control: DatePicker@0.0.46
                                              Properties:
                                                AccessibleLabel: ="Data inicial da exportação"
                                                Format: =DateTimeFormat.ShortDate
                                                Height: =44
                                    - cntExpAteImp:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmSuperficie
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =230
                                        Children:
                                          - lblExpAteImp:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =thmTextoFraco
                                                Font: =thmFonte
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Size: =10
                                                Text: ="ATÉ *"
                                          - dtpExpAteImp:
                                              Control: DatePicker@0.0.46
                                              Properties:
                                                AccessibleLabel: ="Data final da exportação"
                                                Format: =DateTimeFormat.ShortDate
                                                Height: =44
                                    - cntExpPatioImp:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmSuperficie
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =260
                                        Children:
                                          - lblExpPatioImp:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =thmTextoFraco
                                                Font: =thmFonte
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Size: =10
                                                Text: ="PÁTIO"
                                          - drpExpPatioImp:
                                              Control: DropDown@0.0.45
                                              Properties:
                                                DefaultSelectedItems: =["TODOS OS PÁTIOS"]
                                                Height: =44
                                                Items: =colPatiosSel
                                    - cntExpBuscaImp:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmSuperficie
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =230
                                        Children:
                                          - lblExpBuscaImp:
                                              Control: Label@2.5.1
                                              Properties:
                                                Color: =thmTextoFraco
                                                Font: =thmFonte
                                                FontWeight: =FontWeight.Bold
                                                Height: =18
                                                Size: =10
                                                Text: ="VOO, PREFIXO OU CIA"
                                          - txtExpBuscaImp:
                                              Control: TextInput@0.0.54
                                              Properties:
                                                Height: =44
                                                MaxLength: =20
                                    - lblExpEspacoImp:
                                        Control: Label@2.5.1
                                        Properties:
                                          Fill: =thmTransparente
                                          FillPortions: =1
                                          LayoutMinWidth: =0
                                          Text: =""
                              - tglExpIntlImp:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    AccessibleLabel: ="Somente voos internacionais"
                                    BasePaletteColor: =thmAmbar
                                    FontColor: =thmTexto
                                    Height: =44
                                    Label: ="Somente voos internacionais"
                                    LabelPosition: ='Toggle.LabelPosition'.Before
                              - tglExpPesqImp:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    AccessibleLabel: ="Somente voos pesquisados"
                                    BasePaletteColor: =thmVermelho
                                    FontColor: =thmTexto
                                    Height: =44
                                    Label: ="Somente voos pesquisados"
                                    LabelPosition: ='Toggle.LabelPosition'.Before
                              - tglExpFinImp:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    AccessibleLabel: ="Incluir movimentos já finalizados"
                                    BasePaletteColor: =thmOperacional
                                    FontColor: =thmTexto
                                    Height: =44
                                    Label: ="Incluir movimentos já finalizados"
                                    LabelPosition: ='Toggle.LabelPosition'.Before
                              - tglExpHistImp:
                                  Control: Toggle@1.1.5
                                  Properties:
                                    AccessibleLabel: ="Com histórico de alterações, quem fez e quando, até 50 registros"
                                    BasePaletteColor: =thmPrimaria
                                    FontColor: =thmTexto
                                    Height: =44
                                    Label: ="Com histórico de alterações — quem fez e quando (até 50 registros)"
                                    LabelPosition: ='Toggle.LabelPosition'.Before
                        - htmExpResumoImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                =If(
                                    IsBlank(dtpExpDeImp.SelectedDate) Or IsBlank(dtpExpAteImp.SelectedDate),
                                    "<div style='" & htmlFonte & "font-size:12px;color:" & hxTextoFraco & ";padding:6px 0;'>Escolha as duas datas.</div>",
                                    dtpExpAteImp.SelectedDate < dtpExpDeImp.SelectedDate,
                                    "<div style='" & htmlFonte & "font-size:12px;font-weight:700;color:" & hxVermelho & ";padding:6px 0;'>A data final é anterior à inicial.</div>",
                                    DateDiff(dtpExpDeImp.SelectedDate, dtpExpAteImp.SelectedDate, TimeUnit.Days) > 62,
                                    "<div style='" & htmlFonte & "font-size:12px;font-weight:700;color:" & hxVermelho & ";padding:6px 0;'>" &
                                    "Período de " & Text(DateDiff(dtpExpDeImp.SelectedDate, dtpExpAteImp.SelectedDate, TimeUnit.Days) + 1) & " dias. O máximo por arquivo é 62 — gere um arquivo por mês." &
                                    "</div>",
                                    "<div style='" & htmlFonte & "font-size:12px;color:" & hxTexto & ";padding:6px 0;'>" &
                                    "<b>" & Text(CountRows(Filter(tb_alocacoesMapa, aeroporto = varAero And ativo = 1 And data_operacao >= dtpExpDeImp.SelectedDate And data_operacao <= dtpExpAteImp.SelectedDate))) & "</b> registro(s) no período" &
                                    " &nbsp;&middot;&nbsp; " & Text(DateDiff(dtpExpDeImp.SelectedDate, dtpExpAteImp.SelectedDate, TimeUnit.Days) + 1) & " dia(s)" &
                                    If(tglExpIntlImp.Checked Or tglExpPesqImp.Checked Or tglExpFinImp.Checked Or !IsBlank(Trim(txtExpBuscaImp.Value)), " &nbsp;&middot;&nbsp; os filtros abaixo ainda serão aplicados pelo fluxo", "") &
                                    If(
                                        tglExpHistImp.Checked,
                                        "<br><span style='color:" & hxAmbar & ";font-weight:700;'>Com histórico:</span> uma linha por alteração de cada registro, inclusive excluídos. " &
                                        "Só sai com até 50 registros depois dos filtros — use a busca por voo, prefixo ou companhia para chegar num movimento.",
                                        ""
                                    ) &
                                    "</div>"
                                )
                              Size: =12
                        - cntExpAcoesImp:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =0
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnExpGerarImp:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    BasePaletteColor: =thmAcao
                                    BorderRadius: =0
                                    DisplayMode: |-
                                      =If(
                                          varPodeEditar And !IsBlank(dtpExpDeImp.SelectedDate) And !IsBlank(dtpExpAteImp.SelectedDate) And
                                          dtpExpAteImp.SelectedDate >= dtpExpDeImp.SelectedDate And DateDiff(dtpExpDeImp.SelectedDate, dtpExpAteImp.SelectedDate, TimeUnit.Days) <= 62,
                                          DisplayMode.Edit,
                                          DisplayMode.Disabled
                                      )
                                    FontColor: =thmTextoBarra
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Icon: ="Download"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Patch(
                                          tb_exportacaoMapa,
                                          Defaults(tb_exportacaoMapa),
                                          {
                                              aeroporto: varAero,
                                              data_de: dtpExpDeImp.SelectedDate,
                                              data_ate: dtpExpAteImp.SelectedDate,
                                              patio: If(
                                                  drpExpPatioImp.Selected.Value = "TODOS OS PÁTIOS",
                                                  "",
                                                  Coalesce(LookUp(colPatiosAero As _p, _p.nome_patio = drpExpPatioImp.Selected.Value).patio, "")
                                              ),
                                              so_internacional: If(tglExpIntlImp.Checked, 1, 0),
                                              so_pesquisado: If(tglExpPesqImp.Checked, 1, 0),
                                              incluir_finalizados: If(tglExpFinImp.Checked, 1, 0),
                                              historico: If(tglExpHistImp.Checked, 1, 0),
                                              busca: Trim(txtExpBuscaImp.Value),
                                              solicitante: User().FullName,
                                              status: "PRONTO",
                                              total: 0,
                                              ativo: 1
                                          }
                                      );
                                      Refresh(tb_exportacaoMapa);
                                      Notify("Pedido enviado. Em alguns segundos toque em ATUALIZAR para ver o arquivo pronto.", NotificationType.Success, 6000)
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Text: ="GERAR ARQUIVO"
                                    Width: =190
                              - btnExpAtualizarImp:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =thmOperacional
                                    BorderRadius: =0
                                    FontColor: =thmOperacional
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Icon: ="ArrowClockwise"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinWidth: =0
                                    OnSelect: =Refresh(tb_exportacaoMapa)
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Text: ="ATUALIZAR"
                                    Width: =150
                              - btnExpAbrirImp:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =thmPrimaria
                                    BorderRadius: =0
                                    DisplayMode: =If(IsBlank(First(Sort(Filter(tb_exportacaoMapa, aeroporto = varAero And ativo = 1 And status = "CONCLUIDO"), ID, SortOrder.Descending)).arquivo_url), DisplayMode.Disabled, DisplayMode.Edit)
                                    FontColor: =thmPrimaria
                                    FontSize: =13
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Icon: ="Eye"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinWidth: =0
                                    OnSelect: =Launch(First(Sort(Filter(tb_exportacaoMapa, aeroporto = varAero And ativo = 1 And status = "CONCLUIDO"), ID, SortOrder.Descending)).arquivo_url)
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    Text: ="ABRIR O ÚLTIMO"
                                    Width: =180
                        - htmExpPedidosImp:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                =With(
                                    {
                                        _ped: FirstN(
                                            Sort(Filter(tb_exportacaoMapa, aeroporto = varAero And ativo = 1), ID, SortOrder.Descending),
                                            5
                                        )
                                    },
                                    If(
                                        CountRows(_ped) = 0,
                                        "<div style='" & htmlFonte & "font-size:11px;color:" & hxTextoFraco & ";padding:10px 0;'>Nenhum arquivo gerado ainda.</div>",
                                        "<table style='width:100%;border-collapse:collapse;" & htmlFonte & "'>" &
                                        "<tr><td colspan='4' style='font-size:9px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco &
                                        ";padding:10px 0 4px 0;'>ÚLTIMOS PEDIDOS</td></tr>" &
                                        Concat(
                                            _ped As _p,
                                            "<tr style='border-top:1px solid " & hxBorda & ";'>" &
                                            "<td style='padding:6px 10px 6px 0;font-size:11px;white-space:nowrap;'>" &
                                            Text(_p.data_de, "dd/mm/yyyy") & " a " & Text(_p.data_ate, "dd/mm/yyyy") & "</td>" &
                                            "<td style='padding:6px 10px 6px 0;font-size:10px;color:" & hxTextoFraco & ";'>" &
                                            Trim(
                                                If(IsBlank(_p.patio) Or _p.patio = "", "todos os pátios", _p.patio) &
                                                If(_p.so_internacional = 1, " &middot; internacionais", "") &
                                                If(_p.so_pesquisado = 1, " &middot; pesquisados", "") &
                                                If(_p.incluir_finalizados = 1, " &middot; com finalizados", "")
                                            ) & "</td>" &
                                            "<td style='padding:6px 10px 6px 0;font-size:10px;font-weight:700;white-space:nowrap;color:" &
                                            Switch(_p.status, "CONCLUIDO", hxPrimaria, "ERRO", hxVermelho, "PROCESSANDO", hxOperacional, hxAmbar) & ";'>" &
                                            _p.status & If(_p.status = "CONCLUIDO", " &middot; " & Text(Coalesce(_p.total, 0)) & " linha(s)", "") & "</td>" &
                                            "<td style='padding:6px 0;font-size:10px;color:" & hxTextoFraco & ";'>" &
                                            Coalesce(_p.arquivo_nome, "") & "</td></tr>" &
                                            If(
                                                _p.status = "ERRO" And !IsBlank(_p.mensagem),
                                                "<tr><td colspan='4' style='padding:0 0 8px 0;font-size:10px;color:" & hxVermelho & ";'>" & _p.mensagem & "</td></tr>",
                                                ""
                                            )
                                        ) &
                                        "</table>"
                                    )
                                )
                              Size: =11
