Screens:
  scrMapaReferencia:
    Properties:
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, First(colAerosMapa).Aeroporto));
        If(IsBlank(varAeroNome), Set(varAeroNome, First(colAerosMapa).Aeroporto));
        Set(varMenuConfig, true);
        Set(varMapaVisivel, false);
        Set(varPodeCadastro, DataSourceInfo('tb_posicoes', DataSourceInfo.EditPermission));
        Set(varModoRef, Coalesce(varModoRef, "POSICOES"));
        Set(varPosSelRef, Blank());
        Set(varPatSelRef, Blank());
        UpdateContext({ locErroRef: false });
        Select(btnRecarregarRef);
        Set(varFormPos, Blank());
        Set(varFormPat, Blank())
    Children:
      - btnRecarregarRef:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
                =ClearCollect(colPosRef, Sort(Filter(tb_posicoes, aeroporto = varAero), ordem, SortOrder.Ascending));
                ClearCollect(colPatRef, Sort(Filter(tb_patios, aeroporto = varAero), ordem, SortOrder.Ascending));
                ClearCollect(colPatiosSelRef, Table({ Value: "—" }));
                Collect(colPatiosSelRef, ForAll(colPatRef As _p, { Value: _p.nome_patio }));
                ClearCollect(colEquipSelRef, Table({ Value: "—" }));
                Collect(colEquipSelRef, ForAll(Sort(Filter(tb_equipamentos, ativo = 1), ordem, SortOrder.Ascending) As _e, { Value: _e.equip }));
                ClearCollect(colTiposPosRef, Table({ Value: "PONTE" }, { Value: "REMOTA" }, { Value: "HELIPONTO" }));
                ClearCollect(colClassesSelRef, Table({ Value: "—" }));
                Collect(colClassesSelRef, ForAll(colClasses As _c, { Value: _c.classe }))
            Text: =""
            Visible: =false
            Width: =1
      - cntShellRef:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaRef:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaPatio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavCfgRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Settings"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuConfig, !varMenuConfig)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, If(varMenuConfig, "CONFIGURAÇÕES  ▾", "CONFIGURAÇÕES  ▸"), "")
                        - btnNavRefRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavEqpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Airplane"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaEquip, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "EQUIPAMENTOS", "")
                        - btnNavRgrRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="LockClosed"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaRegra, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "RESTRIÇÕES", "")
                        - btnNavImpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Upload"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaImport, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "IMPORTAÇÃO / EXPORTAÇÃO", "")
                        - btnNavInicioRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - btnRecolherRef:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Start
                        Width: =If(varMenuAberto, 180, 52)
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmBotaoBarra
                        BorderRadius: =0
                        FillPortions: =0
                        FontColor: =thmTextoBarra
                        FontSize: =11
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinHeight: =36
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>POSIÇÕES E PÁTIOS</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAeroNome & " &nbsp;&middot;&nbsp; " & CountRows(colPosicoesAero) & " posições &nbsp;&middot;&nbsp; " &
                                CountRows(colPortoes) & " portões &nbsp;&middot;&nbsp; " & CountRows(colCias) & " companhias</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                  - cntConteudoRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =thmEspBloco
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =thmEspBloco
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =thmEspBloco
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntModoRef:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnModoPosRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "POSICOES", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "POSICOES", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "POSICOES")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="POSIÇÕES"
                                    Width: =150
                              - btnModoPatRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "PATIOS", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "PATIOS", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "PATIOS")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="PÁTIOS"
                                    Width: =130
                              - lblEspacoModoRef:
                                  Control: Label@2.5.1
                                  Properties:
                                    Fill: =thmTransparente
                                    FillPortions: =1
                                    LayoutMinWidth: =0
                                    Text: =""
                              - btnRecarregarVisRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =thmOperacional
                                    BorderRadius: =0
                                    FontColor: =thmOperacional
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Icon: ="ArrowClockwise"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnRecarregarRef)
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Text: ="RECARREGAR"
                                    Width: =150
                        - cntPosRef:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varModoRef = "POSICOES"
                            Children:
                              - cntListaPosRef:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =thmBorda
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =thmSuperficie
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - galPosRef:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          BorderColor: =thmBorda
                                          BorderStyle: =BorderStyle.None
                                          Fill: =thmSuperficie
                                          FillPortions: =1
                                          Items: =colPosRef
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TemplatePadding: =0
                                          TemplateSize: =46
                                        Children:
                                          - cntLinhaPosRef:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =thmTransparente
                                                Height: =44
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =4
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.Width - 18
                                              Children:
                                                - btnItemPosRef:
                                                    Control: Button@0.0.45
                                                    Properties:
                                                      Align: =Align.Left
                                                      Appearance: =If(varPosSelRef.ID = ThisItem.ID, 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Secondary)
                                                      BasePaletteColor: =If(ThisItem.ativo = 1, thmPrimaria, thmTextoFraco)
                                                      BorderRadius: =0
                                                      FillPortions: =1
                                                      FontSize: =12
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =44
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                          =Set(varPosSelRef, ThisItem);
                                                          Set(
                                                              varFormPos,
                                                              {
                                                                  id: ThisItem.id_posicao,
                                                                  posicao: ThisItem.posicao,
                                                                  patio: Coalesce(LookUp(colPatRef As _lp, _lp.patio = ThisItem.patio).nome_patio, "—"),
                                                                  ordem: Text(ThisItem.ordem),
                                                                  tipo: Coalesce(ThisItem.tipo, "REMOTA"),
                                                                  classe: If(IsBlank(ThisItem.classe) Or ThisItem.classe = "", "—", ThisItem.classe),
                                                                  aeronave_max: Coalesce(ThisItem.aeronave_max, ""),
                                                                  equip_max: If(IsBlank(ThisItem.equip_max) Or ThisItem.equip_max = "", "—", ThisItem.equip_max),
                                                                  comp: Text(Coalesce(ThisItem.comp_max, 0)),
                                                                  env: Text(Coalesce(ThisItem.env_max, 0)),
                                                                  ocupa: Coalesce(ThisItem.ocupa, ""),
                                                                  conting: ThisItem.contingencia = 1,
                                                                  ativo: ThisItem.ativo = 1
                                                              }
                                                          )
                                                      PaddingLeft: =12
                                                      PaddingRight: =12
                                                      Text: |-
                                                          =ThisItem.posicao & "   ·   " & Coalesce(LookUp(colPatRef As _lp2, _lp2.patio = ThisItem.patio).nome_patio, ThisItem.patio) &
                                                          If(ThisItem.ativo = 1, "", "   ·   INATIVA")
                              - cntFormPosRef:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =thmBorda
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =thmSuperficie
                                    FillPortions: =0
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =16
                                    PaddingLeft: =18
                                    PaddingRight: =18
                                    PaddingTop: =12
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =430
                                  Children:
                                    - htmAjudaPosRef:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =thmTexto
                                          Fill: =thmSuperficie
                                          Font: =thmFonte
                                          HtmlText: |-
                                              ="<div style='" & htmlFonte & "font-size:10px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";'>POSIÇÃO</div>" &
                                              "<div style='" & htmlFonte & "font-size:11px;color:" & hxTexto & ";line-height:1.5;padding:6px 0 4px 0;'>" &
                                              "Posição não se apaga: desligue <b>Ativa</b>. O número dela está gravado em cada lançamento, e apagar deixaria o histórico apontando para o vazio." &
                                              "</div>"
                                          Size: =11
                                    - htmIdPosRef:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =thmTexto
                                          Fill: =thmSuperficie
                                          Font: =thmFonte
                                          HtmlText: |-
                                              ="<div style='" & htmlFonte & "font-size:11px;color:" & hxTextoFraco & ";padding:2px 0 6px 0;'>" &
                                              If(
                                                  IsBlank(varPosSelRef.ID),
                                                  "Novo registro — o número da posição será " & Text(Max(colPosRef, id_posicao) + 1) & ", atribuído ao salvar.",
                                                  "Número da posição: <b>" & Text(varFormPos.id) & "</b> — gravado em mais de 700 lançamentos, não muda."
                                              ) & "</div>"
                                          Size: =11
                                    - lblPosRef:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =thmTextoFraco
                                          Font: =thmFonte
                                          FontWeight: =FontWeight.Bold
                                          Height: =18
                                          PaddingTop: =6
                                          Size: =10
                                          Text: ="POSIÇÃO *"
                                    - txtPosRef:
                                        Control: TextInput@0.0.54
                                        Properties:
                                          Default: =Coalesce(varFormPos.posicao, "")
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          Height: =40
                                          MaxLength: =20
                                    - lblPatPosRef:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =thmTextoFraco
                                          Font: =thmFonte
                                          FontWeight: =FontWeight.Bold
                                          Height: =18
                                          PaddingTop: =6
                                          Size: =10
                                          Text: ="PÁTIO *"
                                    - drpPatPosRef:
                                        Control: DropDown@0.0.45
                                        Properties:
                                          DefaultSelectedItems: =[Coalesce(varFormPos.patio, "—")]
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          Height: =40
                                          Items: =colPatiosSelRef
                                    - lblOrdemPosRef:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =thmTextoFraco
                                          Font: =thmFonte
                                          FontWeight: =FontWeight.Bold
                                          Height: =18
                                          PaddingTop: =6
                                          Size: =10
                                          Text: ="ORDEM NA GRADE *"
                                    - txtOrdemPosRef:
                                        Control: TextInput@0.0.54
                                        Properties:
                                          Default: =Coalesce(varFormPos.ordem, "")
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          Height: =40
                                          MaxLength: =6
                                    - lblTipoPosRef:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =thmTextoFraco
                                          Font: =thmFonte
                                          FontWeight: =FontWeight.Bold
                                          Height: =18
                                          PaddingTop: =6
                                          Size: =10
                                          Text: ="TIPO"
                                    - drpTipoPosRef:
                                        Control: DropDown@0.0.45
                                        Properties:
                                          DefaultSelectedItems: =[Coalesce(varFormPos.tipo, "REMOTA")]
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          Height: =40
