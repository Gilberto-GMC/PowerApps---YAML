                                          Font: =thmFonte
                                          HtmlText: |-
                                              ="<div style='" & htmlFonte & "font-size:10px;font-weight:700;letter-spacing:.12em;color:" & hxTextoFraco & ";'>COMPANHIA</div>" &
                                              "<div style='" & htmlFonte & "font-size:11px;color:" & hxTexto & ";line-height:1.5;padding:6px 0 4px 0;'>" &
                                              "Vale para <b>todos os aeroportos</b>. A <b>sigla</b> é gravada em cada lançamento (e é o que a importação usa) — mudar a sigla de uma companhia já usada deixa esses lançamentos sem cor. As cores pintam o bloco na grade." &
                                              "</div>"
                                          Size: =11
