                                        Properties:
                                          AccessibleLabel: ="Ativo"
                                          BasePaletteColor: =thmPrimaria
                                          Checked: =Coalesce(varFormPrt.ativo, true)
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          FontColor: =thmTexto
                                          Height: =44
                                          Label: ="Ativo"
                                          LabelPosition: ='Toggle.LabelPosition'.Before
                                    - cntAcoesPrtRef:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmFundo
                                          FillPortions: =0
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingTop: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - btnNovoPrtRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                BasePaletteColor: =thmAcao
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmAcao
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Add"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =Set(varPrtSelRef, Blank());
                                                    Set(varFormPrt, { patio: "", ordem: "", cor: "#0E7C8C", ativo: true })
                                                Text: ="NOVO"
                                          - btnSalvarPrtRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Primary
                                                BasePaletteColor: =thmPrimaria
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmTextoBarra
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Save"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =If(
                                                        IsBlank(Trim(txtCodPrtRef.Value)),
                                                        Notify("Informe o portão.", NotificationType.Error, 5000),
                                                        !IsNumeric(txtOrdemPrtRef.Value),
                                                        Notify("A ordem tem que ser número.", NotificationType.Error, 5000),
                                                        !IsMatch(txtCorPrtRef.Value, "^#[0-9A-Fa-f]{6}$"),
                                                        Notify("A cor tem que estar no formato #RRGGBB.", NotificationType.Error, 5000),
                                                        !IsBlank(
                                                            LookUp(colPrtRef As _op, Upper(_op.portao) = Upper(Trim(txtCodPrtRef.Value)) And _op.ID <> Coalesce(varPrtSelRef.ID, 0)).ID
                                                        ),
                                                        Notify("Já existe esse portão neste aeroporto. É ele que cada lançamento grava.", NotificationType.Error, 7000),
                                                        UpdateContext(
                                                            {
                                                                locErroRef: IsError(
                                                                    Patch(
                                                                        tb_portoes,
                                                                        If(IsBlank(varPrtSelRef.ID), Defaults(tb_portoes), LookUp(tb_portoes, ID = varPrtSelRef.ID)),
                                                                        {
                                                                            aeroporto: varAero,
                                                                            portao: Upper(Trim(txtCodPrtRef.Value)),
                                                                            ordem: Value(txtOrdemPrtRef.Value),
                                                                            cor_hex: Upper(txtCorPrtRef.Value),
                                                                            ativo: If(tglAtivoPrtRef.Checked, 1, 0)
                                                                        }
                                                                    )
                                                                )
                                                            }
                                                        );
                                                        If(
                                                            locErroRef,
                                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                                            Select(btnRecarregarRef);
                                                            Set(varPrtSelRef, Blank());
                                                            Notify("Portão gravado. A grade muda depois de ATUALIZAR.", NotificationType.Success, 4000)
                                                        )
                                                    )
                                                Text: ="SALVAR"
