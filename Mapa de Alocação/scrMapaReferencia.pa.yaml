                                                              varFormCia,
                                                              {
                                                                  patio: ThisItem.sigla,
                                                                  nome: ThisItem.nome_cia,
                                                                  ordem: Text(ThisItem.ordem),
                                                                  cor: Coalesce(ThisItem.cor_hex, ""),
                                                                  cor_txt: Coalesce(ThisItem.cor_texto, ""),
                                                                  ativo: ThisItem.ativo = 1
                                                              }
                                                          )
