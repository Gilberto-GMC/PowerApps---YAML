                                    - htmAmostraCiaRef:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AutoHeight: =true
                                          Color: =thmTexto
                                          Fill: =thmSuperficie
                                          Font: =thmFonte
                                          HtmlText: |-
                                              ="<div style='" & htmlFonte & "padding:8px 0;'><span style='display:inline-block;padding:6px 14px;font-weight:800;background:" &
                                              If(IsMatch(txtCorCiaRef.Value, "^#[0-9A-Fa-f]{6}$"), txtCorCiaRef.Value, hxTextoFraco) & ";color:" &
                                              If(IsMatch(txtCorTxtCiaRef.Value, "^#[0-9A-Fa-f]{6}$"), txtCorTxtCiaRef.Value, hxTextoBarra) & ";'>" &
                                              If(IsBlank(txtCodCiaRef.Value), "??", Upper(txtCodCiaRef.Value) & " 1234") & "</span>" &
                                              "<span style='font-size:11px;color:" & hxTextoFraco & ";margin-left:10px;'>amostra do bloco</span></div>"
                                          Size: =11
                                    - tglAtivoCiaRef:
                                        Control: Toggle@1.1.5
                                        Properties:
                                          AccessibleLabel: ="Ativo"
                                          BasePaletteColor: =thmPrimaria
                                          Checked: =Coalesce(varFormCia.ativo, true)
                                          DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.View)
                                          FontColor: =thmTexto
                                          Height: =44
                                          Label: ="Ativo"
                                          LabelPosition: ='Toggle.LabelPosition'.Before
                                    - cntAcoesCiaRef:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmFundo
                                          FillPortions: =0
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingTop: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - btnNovoCiaRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                BasePaletteColor: =thmAcao
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmAcao
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Add"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =Set(varCiaSelRef, Blank());
                                                    Set(varFormCia, { patio: "", nome: "", ordem: "", cor: "#0E7C8C", cor_txt: "#D6DDE0", ativo: true })
                                                Text: ="NOVO"
                                          - btnSalvarCiaRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Primary
                                                BasePaletteColor: =thmPrimaria
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmTextoBarra
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Save"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =If(
                                                        IsBlank(Trim(txtCodCiaRef.Value)),
                                                        Notify("Informe a sigla da companhia.", NotificationType.Error, 5000),
                                                        IsBlank(Trim(txtNomeCiaRef.Value)),
                                                        Notify("Informe o nome da companhia.", NotificationType.Error, 5000),
                                                        !IsNumeric(txtOrdemCiaRef.Value),
                                                        Notify("A ordem tem que ser número.", NotificationType.Error, 5000),
                                                        !IsMatch(txtCorCiaRef.Value, "^#[0-9A-Fa-f]{6}$") Or !IsMatch(txtCorTxtCiaRef.Value, "^#[0-9A-Fa-f]{6}$"),
                                                        Notify("As cores têm que estar no formato #RRGGBB.", NotificationType.Error, 5000),
                                                        !IsBlank(
                                                            LookUp(colCiaRef As _op, Upper(_op.sigla) = Upper(Trim(txtCodCiaRef.Value)) And _op.ID <> Coalesce(varCiaSelRef.ID, 0)).ID
                                                        ),
                                                        Notify("Já existe companhia com essa sigla. É ela que cada lançamento grava.", NotificationType.Error, 7000),
                                                        UpdateContext(
                                                            {
                                                                locErroRef: IsError(
                                                                    Patch(
                                                                        tb_companhias,
                                                                        If(IsBlank(varCiaSelRef.ID), Defaults(tb_companhias), LookUp(tb_companhias, ID = varCiaSelRef.ID)),
                                                                        {
                                                                            sigla: Upper(Trim(txtCodCiaRef.Value)),
                                                                            nome_cia: Upper(Trim(txtNomeCiaRef.Value)),
                                                                            ordem: Value(txtOrdemCiaRef.Value),
                                                                            cor_hex: Upper(txtCorCiaRef.Value),
                                                                            cor_texto: Upper(txtCorTxtCiaRef.Value),
                                                                            ativo: If(tglAtivoCiaRef.Checked, 1, 0)
                                                                        }
                                                                    )
                                                                )
                                                            }
                                                        );
                                                        If(
                                                            locErroRef,
                                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                                            Select(btnRecarregarRef);
                                                            Set(varCiaSelRef, Blank());
                                                            Notify("Companhia gravada. Vale para todos os aeroportos; a grade muda depois de ATUALIZAR.", NotificationType.Success, 4000)
                                                        )
                                                    )
                                                Text: ="SALVAR"
