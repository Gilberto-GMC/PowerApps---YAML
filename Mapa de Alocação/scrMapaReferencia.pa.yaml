                                        Properties:
                                          AutoHeight: =true
                                          Color: =thmTexto
                                          Fill: =thmSuperficie
                                          Font: =thmFonte
                                          HtmlText: |-
                                              ="<div style='" & htmlFonte & "padding:8px 0;'><span style='display:inline-block;padding:6px 14px;font-weight:800;background:" & hxSuperficie &
                                              ";border:3px solid " & If(IsMatch(txtCorPrtRef.Value, "^#[0-9A-Fa-f]{6}$"), txtCorPrtRef.Value, hxTextoFraco) & ";color:" & hxTexto & ";'>" &
                                              "GLO 1234 · P" & If(IsBlank(txtCodPrtRef.Value), "?", Upper(txtCodPrtRef.Value)) & "</span>" &
                                              "<span style='font-size:11px;color:" & hxTextoFraco & ";margin-left:10px;'>amostra do contorno</span></div>"
                                          Size: =11
                                    - tglAtivoPrtRef:
