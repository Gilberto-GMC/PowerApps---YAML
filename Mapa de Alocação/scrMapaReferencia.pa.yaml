                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Save"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =If(
                                                        IsBlank(Trim(txtCodPatRef.Value)),
                                                        Notify("Informe o código do pátio.", NotificationType.Error, 5000),
                                                        IsBlank(Trim(txtNomePatRef.Value)),
                                                        Notify("Informe o nome exibido.", NotificationType.Error, 5000),
                                                        !IsNumeric(txtOrdemPatRef.Value),
                                                        Notify("A ordem tem que ser número.", NotificationType.Error, 5000),
                                                        !IsMatch(txtCorPatRef.Value, "^#[0-9A-Fa-f]{6}$") Or !IsMatch(txtCorTxtPatRef.Value, "^#[0-9A-Fa-f]{6}$"),
                                                        Notify("As cores têm que estar no formato #RRGGBB.", NotificationType.Error, 5000),
                                                        !IsBlank(
                                                            LookUp(colPatRef As _op, Upper(_op.patio) = Upper(Trim(txtCodPatRef.Value)) And _op.ID <> Coalesce(varPatSelRef.ID, 0)).ID
                                                        ),
                                                        Notify("Já existe pátio com esse código. É ele que cada posição referencia.", NotificationType.Error, 7000),
                                                        UpdateContext(
                                                            {
                                                                locErroRef: IsError(
                                                                    Patch(
                                                                        tb_patios,
                                                                        If(IsBlank(varPatSelRef.ID), Defaults(tb_patios), LookUp(tb_patios, ID = varPatSelRef.ID)),
                                                                        {
                                                                            aeroporto: varAero,
                                                                            patio: Upper(Trim(txtCodPatRef.Value)),
                                                                            nome_patio: Trim(txtNomePatRef.Value),
                                                                            ordem: Value(txtOrdemPatRef.Value),
                                                                            sigla: Upper(Trim(txtSiglaPatRef.Value)),
                                                                            cor_hex: Upper(txtCorPatRef.Value),
                                                                            cor_texto: Upper(txtCorTxtPatRef.Value),
                                                                            ativo: If(tglAtivoPatRef.Checked, 1, 0)
                                                                        }
                                                                    )
                                                                )
                                                            }
                                                        );
                                                        If(
                                                            locErroRef,
                                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                                            Select(btnRecarregarRef);
                                                            Set(varPatSelRef, Blank());
                                                            Notify("Pátio gravado.", NotificationType.Success, 4000)
                                                        )
                                                    )
