Screens:
  scrMapaReferencia:
    Properties:
      OnVisible: =Set(varMapaVisivel, false)
    Children:
      - cntShellRef:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaRef:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>MOTIVA</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaPatio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavRefRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavEqpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Airplane"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaEquip, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "EQUIPAMENTOS", "")
                        - btnNavRgrRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="LockClosed"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaRegra, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "RESTRIÇÕES", "")
                        - btnNavImpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Upload"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaImport, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "IMPORTAR PROGRAMAÇÃO", "")
                        - btnNavInicioRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - btnRecolherRef:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmBotaoBarra
                        BorderRadius: =0
                        FillPortions: =0
                        FontColor: =thmTextoBarra
                        FontSize: =12
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>POSIÇÕES E CORES</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAeroNome & " &nbsp;&middot;&nbsp; " & CountRows(colPosicoesAero) & " posições &nbsp;&middot;&nbsp; " &
                                CountRows(colPortoes) & " portões &nbsp;&middot;&nbsp; " & CountRows(colCias) & " companhias</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                  - cntConteudoRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =thmEspBloco
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =thmEspBloco
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =thmEspBloco
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmCoresRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                ="<table style='width:100%;border-spacing:" & thmEsp & "px 0;" & htmlFonte & "'><tr>" &
                                "<td style='width:50%;vertical-align:top;'><div style='background:" & hxSuperficie & ";border:1px solid " & hxBorda &
                                ";border-top:3px solid " & hxPrimaria & ";padding:16px 18px 18px 18px;'>" &
                                "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>PREENCHIMENTO = COMPANHIA</div>" &
                                "<table style='width:100%;border-spacing:0;margin-top:12px;'>" &
                                Concat(
                                    Sort(colCias, ordem, SortOrder.Ascending) As _c,
                                    "<tr><td style='padding:4px 0;width:78px;'><span style='display:inline-block;min-width:52px;text-align:center;font-size:12px;font-weight:800;padding:4px 10px;background:" &
                                    _c.cor_hex & ";color:" & _c.cor_texto & ";'>" & _c.sigla & "</span></td>" &
                                    "<td style='padding:4px 0;font-size:12px;color:" & hxTexto & ";'>" & _c.nome_cia & "</td></tr>"
                                ) &
                                "</table></div></td>" &
                                "<td style='width:50%;vertical-align:top;'><div style='background:" & hxSuperficie & ";border:1px solid " & hxBorda &
                                ";border-top:3px solid " & hxOperacional & ";padding:16px 18px 18px 18px;'>" &
                                "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>CONTORNO = PORTÃO DE EMBARQUE</div>" &
                                "<table style='width:100%;border-spacing:0;margin-top:12px;'>" &
                                Concat(
                                    Sort(colPortoes, ordem, SortOrder.Ascending) As _p,
                                    "<tr><td style='padding:4px 0;width:78px;'><span style='display:inline-block;min-width:52px;text-align:center;font-size:12px;font-weight:800;padding:4px 10px;background:" &
                                    hxSuperficie & ";color:" & hxTexto & ";border:3px solid " & _p.cor_hex & ";'>" & _p.portao & "</span></td>" &
                                    "<td style='padding:4px 0;font-size:12px;color:" & hxTexto & ";'>PORTÃO " & _p.portao & "</td></tr>"
                                ) &
                                "</table>" &
                                "<div style='font-size:11px;color:" & hxTextoFraco & ";margin-top:12px;line-height:1.5;'>" &
                                "O portão 4 foi confirmado pela operação. Os demais seguem a ordem do frio para o quente; " &
                                "se a numeração for outra, é uma linha para corrigir.</div>" &
                                "</div></td></tr></table>"
                              Size: =11
                        - htmPosicoesRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='background:" & hxSuperficie & ";border:1px solid " & hxBorda & ";border-top:3px solid " & hxVerde &
                                ";padding:16px 18px 18px 18px;" & htmlFonte & "'>" &
                                "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>POSIÇÕES DO PÁTIO — NA ORDEM DA GRADE</div>" &
                                "<table style='width:100%;border-spacing:0;margin-top:12px;'>" &
                                "<tr>" &
                                "<td style='padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxBorda & ";'>POSIÇÃO</td>" &
                                "<td style='padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxBorda & ";'>PÁTIO</td>" &
                                "<td style='padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxBorda & ";'>AERONAVE MÁXIMA</td>" &
                                "<td style='padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxBorda & ";'>ENVERGADURA MÁX.</td>" &
                                "<td style='padding:6px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxBorda & ";'>OBSERVAÇÃO</td>" &
                                "</tr>" &
                                Concat(
                                    Sort(colPosicoesAero, ordem, SortOrder.Ascending) As _po,
                                    "<tr>" &
                                    "<td style='padding:5px 8px;font-size:13px;font-weight:800;color:" & hxPrimaria & ";border-bottom:1px solid " & hxGradeLinha & ";'>" & _po.posicao & "</td>" &
                                    "<td style='padding:5px 8px;font-size:11px;color:" & hxTexto & ";border-bottom:1px solid " & hxGradeLinha & ";'>" &
                                    Coalesce(LookUp(colPatiosAero As _pt, _pt.patio = _po.patio).nome_patio, _po.patio) & "</td>" &
                                    "<td style='padding:5px 8px;font-size:11px;color:" & hxTexto & ";border-bottom:1px solid " & hxGradeLinha & ";'>" &
                                    If(IsBlank(_po.aeronave_max), "&mdash;", _po.aeronave_max) & "</td>" &
                                    "<td style='padding:5px 8px;font-size:11px;color:" & hxTexto & ";border-bottom:1px solid " & hxGradeLinha & ";'>" &
                                    If(_po.env_max > 0, Text(_po.env_max) & " m", "sem limite") & "</td>" &
                                    "<td style='padding:5px 8px;font-size:11px;color:" & hxTextoFraco & ";border-bottom:1px solid " & hxGradeLinha & ";'>" &
                                    If(_po.contingencia = 1, "uso só em contingência", If(_po.classe = "HELICOPTERO", "heliponto", If(IsBlank(_po.classe), "", "classe " & _po.classe))) &
                                    "</td></tr>"
                                ) &
                                "</table></div>"
                              Size: =11
                        - htmNotaRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='background:" & hxAmbarSuave & ";border-left:4px solid " & hxAcao & ";padding:14px 18px;" & htmlFonte & "'>" &
                                "<div style='font-size:12px;font-weight:700;color:" & hxTexto & ";'>Estes dados são de implantação, não de operação.</div>" &
                                "<div style='font-size:11px;color:" & hxTexto & ";line-height:1.6;margin-top:6px;'>" &
                                "Posições, portões e companhias mudam uma ou duas vezes por ano, então ficam guardados dentro do próprio " &
                                "aplicativo — não em lista. Isso deixa a abertura instantânea e dispensa manutenção. " &
                                "Para incluir uma posição, um portão, uma companhia ou um aeroporto novo, peça a alteração à equipe " &
                                "de sistemas: é uma linha em App.Formulas e uma nova publicação." &
                                "</div></div>"
                              Size: =11
