Screens:
  scrMapaReferencia:
    Properties:
      OnVisible: |-
        =If(IsBlank(varAero), Set(varAero, First(colAerosMapa).Aeroporto));
        If(IsBlank(varAeroNome), Set(varAeroNome, First(colAerosMapa).Aeroporto));
        Set(varMenuConfig, true);
        Set(varMapaVisivel, false);
        Set(varPodeCadastro, DataSourceInfo('tb_posicoes', DataSourceInfo.EditPermission));
        Set(varModoRef, Coalesce(varModoRef, "POSICOES"));
        Set(varPosSelRef, Blank());
        Set(varPatSelRef, Blank());
        UpdateContext({ locErroRef: false });
        Select(btnRecarregarRef);
        Set(varFormPos, Blank());
        Set(varFormPat, { patio: "", nome: "", ordem: "", sigla: "", cor: "", cor_txt: "", ativo: true });
        Set(varPrtSelRef, Blank());
        Set(varCiaSelRef, Blank());
        Set(varFormPrt, { patio: "", ordem: "", cor: "", ativo: true });
        Set(varFormCia, { patio: "", nome: "", ordem: "", cor: "", cor_txt: "", ativo: true })
    Children:
      - btnRecarregarRef:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
                =ClearCollect(colPosRef, Sort(Filter(tb_posicoes, aeroporto = varAero), ordem, SortOrder.Ascending));
                ClearCollect(colPatRef, Sort(Filter(tb_patios, aeroporto = varAero), ordem, SortOrder.Ascending));
                ClearCollect(colPrtRef, Sort(Filter(tb_portoes, aeroporto = varAero), ordem, SortOrder.Ascending));
                ClearCollect(colCiaRef, Sort(tb_companhias, ordem, SortOrder.Ascending));
                ClearCollect(colPatiosSelRef, Table({ Value: "—" }));
                Collect(colPatiosSelRef, ForAll(colPatRef As _p, { Value: _p.nome_patio }));
                ClearCollect(colEquipSelRef, Table({ Value: "—" }));
                Collect(colEquipSelRef, ForAll(Sort(Filter(tb_equipamentos, ativo = 1), equip, SortOrder.Ascending) As _e, { Value: _e.equip }));
                ClearCollect(colTiposPosRef, Table({ Value: "PONTE" }, { Value: "REMOTA" }, { Value: "HELIPONTO" }, { Value: "HANGAR" }));
                ClearCollect(colClassesSelRef, Table({ Value: "—" }));
                Collect(colClassesSelRef, ForAll(colClasses As _c, { Value: _c.classe }))
            Text: =""
            Visible: =false
            Width: =1
      - cntShellRef:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =thmFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cntMenuRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmPrimariaEscura
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(varMenuAberto, 236, 76)
                Children:
                  - htmMarcaRef:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        AutoHeight: =true
                        Color: =thmTextoBarra
                        Fill: =thmPrimariaEscura
                        Font: =thmFonte
                        HtmlText: |-
                          ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                          If(
                              varMenuAberto,
                              "<div style='font-size:10px;letter-spacing:.24em;font-weight:700;opacity:.6;'>ASUR BRASIL</div><div style='font-size:16px;font-weight:800;letter-spacing:.01em;margin-top:2px;'>MAPA DE ALOCAÇÃO</div>",
                              "<div style='font-size:17px;font-weight:800;text-align:left;margin-left:12px;'>MA</div>"
                          ) &
                          "</div>"
                        PaddingBottom: =14
                        PaddingLeft: =4
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                  - cntNavRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimariaEscura
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnNavMapaRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Eye"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaPatio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "MAPA DO DIA", "")
                        - btnNavCfgRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Settings"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMenuConfig, !varMenuConfig)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, If(varMenuConfig, "CONFIGURAÇÕES  ▾", "CONFIGURAÇÕES  ▸"), "")
                        - btnNavRefRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =thmPrimaria
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Search"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "POSIÇÕES E CORES", "")
                        - btnNavEqpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Airplane"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaEquip, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "EQUIPAMENTOS", "")
                        - btnNavRgrRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="LockClosed"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaRegra, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "RESTRIÇÕES", "")
                        - btnNavImpRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.End
                              Width: =If(varMenuAberto, 180, 52)
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="Upload"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaImport, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Visible: =varMenuConfig
                              Text: =If(varMenuAberto, "IMPORTAÇÃO / EXPORTAÇÃO", "")
                        - btnNavInicioRef:
                            Control: Button@0.0.45
                            Properties:
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BasePaletteColor: =thmTextoBarra
                              BorderRadius: =0
                              FontColor: =thmTextoBarra
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Icon: ="ArrowExit"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrMapaInicio, ScreenTransition.Fade)
                              PaddingLeft: =18
                              Text: =If(varMenuAberto, "TROCAR CONTEXTO", "")
                  - btnRecolherRef:
                      Control: Button@0.0.45
                      Properties:
                        Align: =Align.Left
                        AlignInContainer: =AlignInContainer.Start
                        Width: =If(varMenuAberto, 180, 52)
                        Appearance: ='ButtonCanvas.Appearance'.Secondary
                        BasePaletteColor: =thmBotaoBarra
                        BorderRadius: =0
                        FillPortions: =0
                        FontColor: =thmTextoBarra
                        FontSize: =11
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinHeight: =36
                        Icon: ="ChevronRight"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMenuAberto, !varMenuAberto)
                        PaddingLeft: =18
                        Text: =If(varMenuAberto, "RECOLHER", "")
            - cntRaizRef:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmFundo
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntBarraRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmPrimaria
                        FillPortions: =0
                        Height: =thmAlturaBarra
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinWidth: =0
                        PaddingLeft: =26
                        PaddingRight: =26
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htmTituloRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTextoBarra
                              Fill: =thmPrimaria
                              FillPortions: =1
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "color:" & hxTextoBarra & ";'>" &
                                "<div style='font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.1;'>POSIÇÕES E PÁTIOS</div>" &
                                "<div style='font-size:11px;opacity:.75;margin-top:3px;'>" &
                                varAeroNome & " &nbsp;&middot;&nbsp; " & CountRows(colPosicoesAero) & " posições &nbsp;&middot;&nbsp; " &
                                CountRows(colPortoes) & " portões &nbsp;&middot;&nbsp; " & CountRows(colCias) & " companhias</div></div>"
                              LayoutMinWidth: =0
                              Size: =11
                  - cntConteudoRef:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =thmFundo
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =thmEspBloco
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =thmEspBloco
                        PaddingLeft: =26
                        PaddingRight: =26
                        PaddingTop: =thmEspBloco
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cntModoRef:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmFundo
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnModoPosRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "POSICOES", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "POSICOES", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "POSICOES")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="POSIÇÕES"
                                    Width: =150
                              - btnModoPatRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "PATIOS", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "PATIOS", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "PATIOS")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="PÁTIOS"
                                    Width: =130
                              - btnModoPrtRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "PORTOES", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "PORTOES", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "PORTOES")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="PORTÕES"
                                    Width: =130
                              - btnModoCiaRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varModoRef = "COMPANHIAS", thmAcao, thmTextoFraco)
                                    BorderRadius: =0
                                    FontColor: =If(varModoRef = "COMPANHIAS", thmAcao, thmTextoFraco)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                        =Set(varModoRef, "COMPANHIAS")
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: ="COMPANHIAS"
                                    Width: =150
                              - btnAjudaRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =If(varAjudaRef, thmAcao, thmPrimaria)
                                    BorderRadius: =0
                                    FontColor: =If(varAjudaRef, thmAcao, thmPrimaria)
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Icon: ="DocumentBulletList"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varAjudaRef, !varAjudaRef)
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Text: =If(varAjudaRef, "FECHAR GUIA", "COMO CADASTRAR")
                                    Width: =190
                              - lblEspacoModoRef:
                                  Control: Label@2.5.1
                                  Properties:
                                    Fill: =thmTransparente
                                    FillPortions: =1
                                    LayoutMinWidth: =0
                                    Text: =""
                              - btnRecarregarVisRef:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BasePaletteColor: =thmOperacional
                                    BorderRadius: =0
                                    FontColor: =thmOperacional
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =38
                                    Icon: ="ArrowClockwise"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    LayoutMinHeight: =38
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnRecarregarRef)
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Text: ="RECARREGAR"
                                    Width: =150
                        - htmAjudaRef:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Color: =thmTexto
                              Fill: =thmFundo
                              FillPortions: =0
                              Font: =thmFonte
                              HtmlText: |-
                                ="<div style='" & htmlFonte & "background:" & hxPrimariaClara & ";padding:14px 18px;font-size:12px;line-height:1.6;color:" & hxTexto & ";'>" &
                                "<div style='font-size:10px;font-weight:700;letter-spacing:.14em;color:" & hxTextoFraco & ";'>GUIA DE CADASTRO</div>" &
                                "<div style='margin-top:6px;'><b>A ordem importa: primeiro o pátio, depois as posições dele.</b> " &
                                "Tudo que se grava aqui vale para o aeroporto em uso (" & varAeroNome & "). Não há excluir: desmarque <b>Ativa</b>. " &
                                "Depois de salvar, toque em <b>ATUALIZAR</b> no Mapa do Dia; se não mudar, feche e abra o app.</div>" &

                                "<div style='margin-top:12px;font-weight:800;color:" & hxPrimaria & ";'>1. PÁTIO</div>" &
                                "<table style='border-collapse:collapse;font-size:12px;'>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;white-space:nowrap;'><b>Código do pátio</b></td><td>Único, em maiúsculas e sem espaço (ex. PRINCIPAL, PATIO3, HANGARES). É o que cada posição guarda — <b>não troque depois de ter posições</b>.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Nome exibido</b></td><td>O que aparece para o operador (ex. Pátio 3).</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Ordem</b></td><td>Posição do pátio na grade: 1 fica em cima.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Sigla</b></td><td>Até 4 letras, escritas na faixa vertical à esquerda da grade (ex. P1).</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Cores</b></td><td>Fundo da faixa e cor do texto — toque numa amostra da paleta.</td></tr>" &
                                "</table>" &

                                "<div style='margin-top:12px;font-weight:800;color:" & hxPrimaria & ";'>2. POSIÇÃO</div>" &
                                "<table style='border-collapse:collapse;font-size:12px;'>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;white-space:nowrap;'><b>Posição</b></td><td>Nome único no aeroporto (ex. T4, 6A). Fica gravado em cada lançamento — <b>não renomeie posição que já tem lançamento</b>. O número interno é dado sozinho ao salvar.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Pátio</b></td><td>A que pátio pertence.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Ordem na grade</b></td><td>Posição da linha dentro do pátio. Aceita decimal para encaixar entre duas: <b>6,5</b> fica entre a 6 e a 7.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Tipo</b></td><td><b>PONTE</b> tem portão (voo sem portão aparece tracejado) · <b>REMOTA</b> · <b>HELIPONTO</b> · <b>HANGAR</b> (ver item 3). " &
                                "<span style='color:" & hxVermelho & ";font-weight:700;'>O tipo vem REMOTA por padrão — confira antes de salvar.</span></td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Classe / Aeronave máxima</b></td><td>Rótulos de referência que aparecem na linha da posição (ex. CLASSE A, B-738).</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Equipamento máximo</b></td><td>Código do maior equipamento aceito (ex. B738).</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Comprimento / Envergadura</b></td><td>Travas físicas em metros. <b>0 desliga</b> a trava.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>OCUPA</b></td><td>Posições que esta consome quando usada, separadas por vírgula. Ex.: T6C ocupa <b>T5,T6</b> — ocupar uma bloqueia as outras. Cada nome precisa existir.</td></tr>" &
                                "<tr><td style='padding:2px 14px 2px 0;vertical-align:top;'><b>Contingência</b></td><td>Posição reservada para emergência (em Navegantes, a T7). Gravar nela pede um segundo toque em SALVAR para confirmar.</td></tr>" &
                                "</table>" &

                                "<div style='margin-top:12px;font-weight:800;color:" & hxPrimaria & ";'>3. HANGAR</div>" &
                                "<div>Hangar não é posição de pátio: não tem capacidade, restrição nem conflito, e <b>não aparece na grade</b>. " &
                                "Aparece no botão <b>HANGARES</b> do Mapa do Dia. Para criar:</div>" &
                                "<ol style='margin:4px 0 0 18px;padding:0;'>" &
                                "<li>Em PÁTIOS, crie um pátio para os hangares (ex. código HANGARES, nome Hangares).</li>" &
                                "<li>Em POSIÇÕES, crie uma posição por hangar (ex. HAVAN, POLY) nesse pátio, com <b>Tipo = HANGAR</b>.</li>" &
                                "<li>Classe, aeronave, equipamento, travas e OCUPA ficam em branco ou zero.</li>" &
                                "</ol>" &
