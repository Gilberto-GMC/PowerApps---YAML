                                          FontColor: =thmTexto
                                          Height: =44
                                          Label: ="Ativa"
                                          LabelPosition: ='Toggle.LabelPosition'.Before
                                    - cntAcoesPosRef:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =thmFundo
                                          FillPortions: =0
                                          Height: =60
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingTop: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - btnNovoPosRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                BasePaletteColor: =thmAcao
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmAcao
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Add"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =Set(varPosSelRef, Blank());
                                                    Set(
                                                        varFormPos,
                                                        {
                                                            id: Max(colPosRef, id_posicao) + 1, posicao: "", patio: "—", ordem: "",
                                                            tipo: "REMOTA", classe: "—", aeronave_max: "", equip_max: "—",
                                                            comp: "0", env: "0", ocupa: "", conting: false, ativo: true
                                                        }
                                                    )
                                                Text: ="NOVO"
                                          - btnSalvarPosRef:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Primary
                                                BasePaletteColor: =thmPrimaria
                                                BorderRadius: =0
                                                DisplayMode: =If(varPodeCadastro, DisplayMode.Edit, DisplayMode.Disabled)
                                                FillPortions: =1
                                                FontColor: =thmTextoBarra
                                                FontSize: =13
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Icon: ="Save"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                    =If(
                                                        IsBlank(Trim(txtPosRef.Value)),
                                                        Notify("Informe o nome da posição.", NotificationType.Error, 5000),
                                                        drpPatPosRef.Selected.Value = "—",
                                                        Notify("Escolha o pátio.", NotificationType.Error, 5000),
                                                        !IsNumeric(txtOrdemPosRef.Value),
                                                        Notify("A ordem tem que ser número. Use decimal para encaixar entre duas: 6,5 põe a posição entre a 6 e a 7.", NotificationType.Error, 7000),
                                                        !IsBlank(
                                                            LookUp(
                                                                colPosRef As _o,
                                                                Upper(_o.posicao) = Upper(Trim(txtPosRef.Value)) And _o.ID <> Coalesce(varPosSelRef.ID, 0)
                                                            ).ID
                                                        ),
                                                        Notify("Já existe posição com esse nome neste aeroporto. O nome é gravado em cada lançamento — duplicar embaralha a grade.", NotificationType.Error, 8000),
                                                        // Cada nome em OCUPA precisa existir, senão a regra fica muda: a posição não some
                                                        // da grade e ninguém descobre até duas aeronaves disputarem o mesmo espaço.
                                                        CountRows(
                                                            Filter(
                                                                Split(Substitute(Trim(txtOcupaRef.Value), " ", ""), ",") As _t,
                                                                _t.Value <> "" And IsBlank(LookUp(colPosRef As _pp, Upper(_pp.posicao) = Upper(_t.Value)).ID)
                                                            )
                                                        ) > 0,
                                                        Notify(
                                                            "OCUPA cita posição que não existe: " &
                                                            Concat(
                                                                Filter(
                                                                    Split(Substitute(Trim(txtOcupaRef.Value), " ", ""), ",") As _t2,
                                                                    _t2.Value <> "" And IsBlank(LookUp(colPosRef As _pp2, Upper(_pp2.posicao) = Upper(_t2.Value)).ID)
                                                                ),
                                                                Value,
                                                                ", "
                                                            ),
                                                            NotificationType.Error,
                                                            8000
                                                        ),
                                                        UpdateContext(
                                                            {
                                                                locErroRef: IsError(
                                                                    Patch(
                                                                        tb_posicoes,
                                                                        If(IsBlank(varPosSelRef.ID), Defaults(tb_posicoes), LookUp(tb_posicoes, ID = varPosSelRef.ID)),
                                                                        {
                                                                            aeroporto: varAero,
                                                                            id_posicao: If(IsBlank(varPosSelRef.ID), Max(colPosRef, id_posicao) + 1, varPosSelRef.id_posicao),
                                                                            posicao: Upper(Trim(txtPosRef.Value)),
                                                                            patio: Coalesce(LookUp(colPatRef As _lp3, _lp3.nome_patio = drpPatPosRef.Selected.Value).patio, ""),
                                                                            ordem: Value(txtOrdemPosRef.Value),
                                                                            tipo: drpTipoPosRef.Selected.Value,
                                                                            classe: If(drpClassePosRef.Selected.Value = "—", "", drpClassePosRef.Selected.Value),
                                                                            aeronave_max: Trim(txtAeroMaxRef.Value),
                                                                            equip_max: If(drpEquipMaxRef.Selected.Value = "—", "", drpEquipMaxRef.Selected.Value),
                                                                            comp_max: If(IsNumeric(txtCompPosRef.Value), Value(txtCompPosRef.Value), 0),
                                                                            env_max: If(IsNumeric(txtEnvPosRef.Value), Value(txtEnvPosRef.Value), 0),
                                                                            ocupa: Upper(Substitute(Trim(txtOcupaRef.Value), " ", "")),
                                                                            contingencia: If(tglContingRef.Checked, 1, 0),
                                                                            ativo: If(tglAtivoPosRef.Checked, 1, 0)
                                                                        }
                                                                    )
                                                                )
                                                            }
                                                        );
                                                        If(
                                                            locErroRef,
                                                            Notify("Não foi possível gravar. Nada foi alterado.", NotificationType.Error, 7000),
                                                            Select(btnRecarregarRef);
                                                            Set(varPosSelRef, Blank());
                                                            Notify("Posição gravada. A grade só muda depois de ATUALIZAR no Mapa do Dia.", NotificationType.Success, 5000)
                                                        )
                                                    )
                                                Text: ="SALVAR"
