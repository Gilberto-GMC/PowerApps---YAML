Screens:
  PresencaFauna:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =If(
            !varPresencaFaunaEstruturaCarregada || IsEmpty(colPresencaFaunaAeroportos),
            ClearCollect(
                colPresencaFaunaAeroportos,
                [
                    "BACACHERI", "BAGÉ", "CURITIBA", "FOZ DO IGUAÇU",
                    "GOIÂNIA", "IMPERATRIZ", "JOINVILLE", "LONDRINA",
                    "NAVEGANTES", "PALMAS", "PAMPULHA", "PELOTAS",
                    "PETROLINA", "SÃO LUIS", "TERESINA", "URUGUAIANA"
                ]
            );
            ClearCollect(colPresencaFaunaAeroportosFiltro, ["TODOS OS AEROPORTOS"]);
            Collect(colPresencaFaunaAeroportosFiltro, colPresencaFaunaAeroportos);
            ClearCollect(colPresencaFaunaClimas, ["Claro", "Poucas Nuvens", "Encoberto", "Chuva", "Nevoeiro", "Tempestade"]);
            ClearCollect(colPresencaFaunaLocaisPresenca, ["Área Operacional", "Área Patrimonial", "Área de Segurança Aeroportuária - ASA"]);
            ClearCollect(colPresencaFaunaTiposOcorrencia, ["Afugentamento", "Captura", "Manejo de Brando", "Coleta de Carcaça", "Nenhum", "Presença", "Vestígio"]);
            ClearCollect(colPresencaFaunaEvidencias, ["Escuta", "Ninho", "Fezes", "Ovos", "Presença", "Penas", "Pegadas"]);
            ClearCollect(colPresencaFaunaComportamentosPresenca, ["Buscando alimento", "Se alimentando", "Empoleirado", "Parado no chão", "Dentro do ninho", "Outros"]);
            Set(varPresencaFaunaEstruturaCarregada, true)
        );
        UpdateContext(
            {
                var_filterButtonAction: "TODOS",
                var_visible: "Novo Registro",
                var_acao: "new",
                var_visibleExcluir: false,
                var_visibleProcessando: false,
                var_dados_presencaFauna: Defaults(tb_presencaFauna)
            }
        );
        Reset(filtro_presenca_fauna_aeroporto);
        Reset(filtro_presenca_fauna_data_inicio);
        Reset(filtro_presenca_fauna_data_fim);
        ResetForm(FormPresencaFauna);
        NewForm(FormPresencaFauna)
    Children:
      - ScreenContainerDinamicHome_PresencaFauna:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - BottomContainerPresencaFauna:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =5
                  LayoutWrap: =true
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - ContainerPresencaFaunaBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Horizontal
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - SidebarContainerPresencaFauna:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(96, 70, 237, 1)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =1
                              FillPortions: =If(var_sideBarWidth = 230, 60, 0)
                              LayoutDirection: =LayoutDirection.Horizontal
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =250
                            Children:
                              - SideMenuPresencaFauna:
                                  Control: CanvasComponent
                                  ComponentName: SideMenu
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Fill: =RGBA(57, 22, 148, 1)
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =250
                                    avsec: =App.ActiveScreen
                                    bibliotecaProcedimentos: =App.ActiveScreen
                                    configuracoes: =App.ActiveScreen
                                    home: =Home
                                    liçõeAprendidas: =App.ActiveScreen
                                    operacoesAeroportuarias: =OperacoesAeroportuarias
                                    respostaEmergencia: =App.ActiveScreen
                                    sair: =Login
                                    segurancaOperacional: =App.ActiveScreen
                                    terminalPassageiros: =App.ActiveScreen
                        - ContainerPresencaFaunaContent:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - HeaderPresencaFauna:
                                  Control: CanvasComponent
                                  ComponentName: Header
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    CargoUsuario: =varFuncaoUser
                                    Height: =90
                                    LayoutMinWidth: =0
                                    NomeUsuario: =varNomeUser
                                    Width: =Max(App.Width, App.MinScreenWidth)
                              - ContainerPresencaFaunaVoltar:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =50
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Min(980, Parent.Width - 24)
                                  Children:
                                    - ContainerPresencaFaunaVoltarIcone:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0, 0, 0, 1)
                                          FillPortions: =0
                                          Height: =32
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          RadiusBottomLeft: =100
                                          RadiusBottomRight: =100
                                          RadiusTopLeft: =100
                                          RadiusTopRight: =100
                                          Width: =32
                                        Children:
                                          - btnPresencaFaunaVoltar:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Transparent
                                                BorderRadius: =100
                                                FontColor: =RGBA(255, 255, 255, 1)
                                                FontSize: =16
                                                Icon: ="ArrowLeft"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                OnSelect: |-
                                                  =Navigate(OperacoesAeroportuarias, ScreenTransition.Fade);
                                                  UpdateContext({varRegistroId: ""})
                                                Text: =""
                                                Width: =32
                                    - txtPresencaFaunaVoltarPainel:
                                        Control: Text@0.0.51
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontColor: =RGBA(148, 163, 184, 1)
                                          Height: =35
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingLeft: =15
                                          Size: =13
                                          Text: ="VOLTAR AO PAINEL"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Weight: ='TextCanvas.Weight'.Bold
                                          Width: =1000
                              - ContainerPresencaFaunaPrincipal:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =30
                                    PaddingLeft: =If(App.Width < 900, 12, 50)
                                    PaddingRight: =If(App.Width < 900, 12, 50)
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - ContainerPresencaFaunaCard:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(235, 240, 245, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =10
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          LayoutOverflowY: =LayoutOverflow.Scroll
                                          PaddingBottom: =8
                                          PaddingLeft: =If(App.Width < 900, 12, 30)
                                          PaddingRight: =If(App.Width < 900, 12, 8)
                                          PaddingTop: =40
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Min(980, Parent.Width - If(App.Width < 900, 24, 100))
                                        Children:
                                          - txtPresencaFaunaTitulo:
                                              Control: Text@0.0.51
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                AutoHeight: =true
                                                Font: =Font.'Segoe UI'
                                                FontColor: =RGBA(2, 16, 59, 1)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PaddingLeft: =0
                                                Size: =24
                                                Text: ="PRESENÇA DE FAUNA"
                                                Weight: ='TextCanvas.Weight'.Bold
                                                Width: =Parent.Width - 80
                                          - RectanglePresencaFaunaTitulo:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                DisplayMode: =DisplayMode.View
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                          - ContainerPresencaFaunaAbas:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                BorderColor: =RGBA(229, 229, 229, 1)
                                                BorderThickness: =1
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(248, 250, 252, 1)
                                                FillPortions: =0
                                                Height: =50
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                LayoutWrap: =true
                                                PaddingBottom: =2
                                                PaddingLeft: =10
                                                PaddingRight: =10
                                                PaddingTop: =2
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Min(350, Parent.Width - 20)
                                              Children:
                                                - btnPresencaFaunaNovo:
                                                    Control: Button@0.0.45
                                                    Properties:
                                                      Appearance: |-
                                                        =If(
                                                            IsBlank(var_visible) || var_visible = "Novo Registro",
                                                            'ButtonCanvas.Appearance'.Secondary,
                                                            'ButtonCanvas.Appearance'.Transparent
                                                        )
                                                      BorderColor: =RGBA(245, 245, 245, 1)
                                                      BorderRadius: =0
                                                      BorderStyle: =BorderStyle.Solid
                                                      BorderThickness: =1
                                                      FillPortions: =1
                                                      FontColor: |-
                                                        =If(
                                                            IsBlank(var_visible) || var_visible = "Novo Registro",
                                                            RGBA(57, 22, 148, 1),
                                                            RGBA(148, 163, 184, 1)
                                                        )
                                                      FontSize: =16
                                                      Height: =40
                                                      Icon: ="Add"
                                                      IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext(
                                                            {
                                                                var_visible: "Novo Registro",
                                                                var_acao: "new",
                                                                var_dados_presencaFauna: Defaults(tb_presencaFauna)
                                                            }
                                                        );
                                                        ResetForm(FormPresencaFauna);
                                                        NewForm(FormPresencaFauna);
                                                        SetFocus(cmbPresencaFaunaAeroporto)
                                                      Text: =If(var_acao = "edit", "Editar Registro", "Novo Registro")
                                                      Width: =150
                                                - btnPresencaFaunaRegistros:
                                                    Control: Button@0.0.45
                                                    Properties:
                                                      Appearance: |-
                                                        =If(
                                                            var_visible = "Registros",
                                                            'ButtonCanvas.Appearance'.Secondary,
                                                            'ButtonCanvas.Appearance'.Transparent
                                                        )
                                                      BorderColor: =RGBA(245, 245, 245, 1)
                                                      BorderRadius: =0
                                                      BorderStyle: =BorderStyle.Solid
                                                      BorderThickness: =1
                                                      FillPortions: =1
                                                      FontColor: |-
                                                        =If(
                                                            var_visible = "Registros",
                                                            RGBA(57, 22, 148, 1),
                                                            RGBA(148, 163, 184, 1)
                                                        )
                                                      FontSize: =16
                                                      Height: =40
                                                      Icon: ="History"
                                                      IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({var_visible: "Registros", var_acao: Blank()})
                                                      Text: ="Registros"
                                                      Width: =150
                                          - RectanglePresencaFaunaAbas:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                BorderColor: =RGBA(0, 18, 107, 1)
                                                DisplayMode: =DisplayMode.View
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                          - ContainerPresencaFaunaRegistros:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =30
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PaddingBottom: =2
                                                PaddingLeft: =2
                                                PaddingRight: =2
                                                PaddingTop: =2
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Visible: =var_visible = "Registros"
                                              Children:
                                                - ContainerPresencaFaunaFiltros:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(229, 229, 229, 1)
                                                      BorderThickness: =1
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(248, 250, 252, 1)
                                                      FillPortions: =0
                                                      Height: =70
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =10
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      LayoutWrap: =true
                                                      PaddingBottom: =2
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      PaddingTop: =2
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =Min(760, Parent.Width - 20)
                                                    Children:
                                                      - filtro_presenca_fauna_aeroporto:
                                                          Control: ComboBox@0.0.51
                                                          Properties:
                                                            Appearance: ='ComboboxCanvas.Appearance'.FilledLighter
                                                            BorderColor: =RGBA(229, 229, 229, 1)
                                                            BorderRadius: =0
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =1
                                                            DefaultSelectedItems: |-
                                                              =If(
                                                                  varPerfilUser = "Sede" || IsBlank(varAeroUser),
                                                                  ["TODOS OS AEROPORTOS"],
                                                                  [varAeroUser]
                                                              )
                                                            Height: =40
                                                            InputTextPlaceholder: ="Selecione o aeroporto"
                                                            IsSearchable: =false
                                                            Items: =colPresencaFaunaAeroportosFiltro
                                                            Width: =220
                                                      - filtro_presenca_fauna_data_inicio:
                                                          Control: DatePicker@0.0.46
                                                          Properties:
                                                            BorderColor: =RGBA(229, 229, 229, 1)
                                                            BorderRadius: =0
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =1
                                                            DateTimeZone: ='DatePickerCanvas.DateTimeZone'.UTC
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            Format: ='DatePickerCanvas.Format'.Short
                                                            Height: =40
                                                            Placeholder: ="dd/mm/aaaa"
                                                            SelectedDate: =DateAdd(Today(), -90, TimeUnit.Days)
                                                            Width: =130
                                                      - filtro_presenca_fauna_data_fim:
                                                          Control: DatePicker@0.0.46
                                                          Properties:
                                                            BorderColor: =RGBA(229, 229, 229, 1)
                                                            BorderRadius: =0
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =1
                                                            DateTimeZone: ='DatePickerCanvas.DateTimeZone'.UTC
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            Format: ='DatePickerCanvas.Format'.Short
                                                            Height: =40
                                                            Placeholder: ="dd/mm/aaaa"
                                                            SelectedDate: =Today()
                                                            Width: =130
                                                      - btnPresencaFaunaLimparFiltros:
                                                          Control: Button@0.0.45
                                                          Properties:
                                                            Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                            BorderColor: =RGBA(229, 229, 229, 1)
                                                            BorderRadius: =0
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =1
                                                            FontSize: =16
                                                            Height: =40
                                                            Icon: ="Eraser"
                                                            IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =Reset(filtro_presenca_fauna_aeroporto);
                                                              Reset(filtro_presenca_fauna_data_inicio);
                                                              Reset(filtro_presenca_fauna_data_fim)
                                                            Text: =""
                                                            Width: =40
                                                      - btnPresencaFaunaExportar:
                                                          Control: Button@0.0.45
                                                          Properties:
                                                            Appearance: ='ButtonCanvas.Appearance'.Primary
                                                            BorderRadius: =0
                                                            FontSize: =16
                                                            Height: =40
                                                            Icon: ="GridDots"
                                                            IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =Launch(
                                                                  "https://grupoccr.sharepoint.com/sites/AIRPORTNOW/Lists/tb_presencaFauna/AllItems.aspx?env=Embedded&isReadOnly=true",
                                                                  {},
                                                                  LaunchTarget.New
                                                              )
                                                            Text: ="Exportar"
                                                            Width: =110
                                                - ContainerPresencaFaunaTabela:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(229, 229, 229, 1)
                                                      BorderThickness: =1
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(255, 255, 255, 1)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutMinHeight: =320
                                                      LayoutMinWidth: =16
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =Parent.Width / 1.05
                                                    Children:
                                                      - lblPresencaFaunaNenhumRegistro:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            Align: =Align.Center
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            BorderColor: =RGBA(0, 18, 107, 1)
                                                            Color: =RGBA(173, 173, 173, 1)
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            FillPortions: =1
                                                            Font: =Font.'Open Sans'
                                                            FontWeight: =FontWeight.Lighter
                                                            LayoutMinHeight: =0
                                                            Size: =14
                                                            Text: ="Nenhum registro encontrado!"
                                                            Visible: =GalleryPresencaFauna.AllItemsCount = 0
                                                      - ContainerPresencaFaunaCabecalhoTabela:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Start
                                                            BorderColor: =RGBA(229, 229, 229, 1)
                                                            BorderThickness: =1
                                                            DropShadow: =DropShadow.None
                                                            Fill: =RGBA(248, 250, 252, 1)
                                                            FillPortions: =0
                                                            Height: =50
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =5
                                                            PaddingBottom: =5
                                                            PaddingLeft: =15
                                                            PaddingTop: =5
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Width: =Parent.Width
                                                            Visible: =GalleryPresencaFauna.AllItemsCount > 0
                                                          Children:
                                                            - lblPresencaFaunaCabId:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="ID"
                                                                  Width: =45
                                                            - lblPresencaFaunaCabData:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="DATA/HORA"
                                                                  Width: =130
                                                            - lblPresencaFaunaCabAeroportoLocal:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="AEROPORTO / LOCAL"
                                                                  Width: =200
                                                            - lblPresencaFaunaCabEspecie:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  FillPortions: =1
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="EVIDÊNCIA / COMPORTAMENTO"
                                                                  Width: =220
                                                            - lblPresencaFaunaCabTipo:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="OCORRÊNCIA"
                                                            - lblPresencaFaunaCabAcoes:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Center
                                                                  Color: =RGBA(0, 0, 0, 0.5)
                                                                  Font: =Font.'Open Sans'
                                                                  FontWeight: =FontWeight.Bold
                                                                  Size: =10
                                                                  Text: ="AÇÕES"
                                                                  Width: =70
                                                      - GalleryPresencaFauna:
                                                          Control: Gallery@2.15.0
                                                          Variant: Vertical
                                                          Properties:
                                                            BorderColor: =RGBA(0, 18, 107, 1)
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            Items: |-
                                                              =With(
                                                                  {
                                                                      _aeroporto: filtro_presenca_fauna_aeroporto.Selected.Value,
                                                                      _inicioLocal: Coalesce(
