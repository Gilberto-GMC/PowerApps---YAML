Screens:
  FocoAtracaoFauna:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(96, 70, 237, 1)
      OnVisible: |-
        =If(
            !varFocoAtracaoFaunaEstruturaCarregada || IsEmpty(colFocoAtracaoFaunaAeroportos),
            ClearCollect(
                colFocoAtracaoFaunaAeroportos,
                [
                    "BACACHERI", "BAGÉ", "CURITIBA", "FOZ DO IGUAÇU",
                    "GOIÂNIA", "IMPERATRIZ", "JOINVILLE", "LONDRINA",
                    "NAVEGANTES", "PALMAS", "PAMPULHA", "PELOTAS",
                    "PETROLINA", "SÃO LUIS", "TERESINA", "URUGUAIANA"
                ]
            );
            ClearCollect(colFocoAtracaoFaunaAeroportosFiltro, ["TODOS OS AEROPORTOS"]);
            Collect(colFocoAtracaoFaunaAeroportosFiltro, colFocoAtracaoFaunaAeroportos);
            ClearCollect(colFocoAtracaoFaunaClimas, ["Claro", "Poucas Nuvens", "Encoberto", "Chuva", "Nevoeiro", "Tempestade"]);
            ClearCollect(colFocoAtracaoFaunaLocais, ["Área Operacional", "Área Patrimonial", "Área de Segurança Aeroportuária - ASA"]);
            ClearCollect(
                colFocoAtracaoFaunaFocosAtrativos,
                [
                    "Acúmulo de água nas valas de drenagem",
                    "Acúmulo de materiais e entulhos",
                    "Atividade humana (pesqueiro,parques, etc.)",
                    "Disposição inadequada de resíduos",
                    "Edificações abandonadas",
                    "Gramado com apara de vegetação acumulada",
                    "Grama com o corte recente",
                    "Gramado lateral da pista produzindo sementes",
                    "Ponto de acúmulo temporário de água",
                    "Ponto de referência para empoleiramento de aves",
                    "Presença de carcaças",
                    "Presença de colônia de insetos",
                    "Vegetação com frutos e sementes",
                    "Vegetação servindo de poleiro",
                    "Nenhum",
                    "Ponto de acumulo permanente de agua",
                    "Outros"
                ]
            );
            ClearCollect(
                colFocoAtracaoFaunaVulnerabilidades,
                [
                    "Vulnerabilidade na cerca operacional",
                    "Vulnerabilidade na cerca/muro patrimonial",
                    "Vulnerabilidade nas entradas/saídas dos sistemas de drenagem",
                    "Nenhum"
                ]
            );
            Set(varFocoAtracaoFaunaEstruturaCarregada, true)
        );
        UpdateContext(
            {
                var_filterButtonAction: "TODOS",
                var_visible: "Novo Registro",
                var_acao: "new",
                var_visibleExcluir: false,
                var_visibleProcessando: false,
                var_dados_focoAtracaoFauna: Defaults(tb_focoAtracaoFauna)
            }
        );
        Reset(filtro_foco_atracao_fauna_aeroporto);
        Reset(filtro_foco_atracao_fauna_data_inicio);
        Reset(filtro_foco_atracao_fauna_data_fim);
        ResetForm(FormFocoAtracaoFauna);
        NewForm(FormFocoAtracaoFauna)
    Children:
      - ScreenContainerDinamicHome_FocoAtracaoFauna:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
