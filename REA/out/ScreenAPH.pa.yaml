      - HtmlText3:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =101
            HtmlText: "=\"<style>\n    body { font-family: Arial; font-size: 10px; margin: 0; }\n    .header { padding: 15px; }\n    .title { color: #4b0082; font-size: 20px; font-weight: bold; margin-bottom: 10px; }\n    .record { display: table; width: 100%; border-collapse: collapse; margin: 10px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; }\n    .field { display: table-row; }\n    .label, .value {\n        display: table-cell;\n        border: 0.5px solid #ddd;\n        padding: 6px;\n        vertical-align: top;\n    }\n    .label {\n        font-weight: bold;\n        color: #333;\n        width: 200px;\n        background-color: #f9f9f9;\n    }\n    .field:nth-child(even) .label, .field:nth-child(even) .value {\n        background-color: #f2f2f2;\n    }\n    .footer {\n        font-size: 10px;\n        text-align: right;\n        padding: 10px;\n        border-top: 1px solid #ccc;\n        color: #666;\n    }\n</style>\n<div class='header'>\n    <div class='title'>Relatório de Atendimento Pré-Hospitalar (APH)</div>\n</div>\" &\n\nWith({Registro: var_dadosAPH},\n\"<div class='record'>\" &\n\n    If(!IsBlank(Registro.AEROPORTO), \"<div class='field'><div class='label'>Aeroporto:</div><div class='value'>\" & Registro.AEROPORTO & \" - \" & Registro.IATA & \"</div></div>\") &\n    If(!IsBlank(Registro.PROTOCOLO), \"<div class='field'><div class='label'>Protocolo:</div><div class='value'>\" & Registro.PROTOCOLO & \"</div></div>\") &\n    If(!IsBlank(Registro.'ACIONADO POR'.Value), \"<div class='field'><div class='label'>Acionado por:</div><div class='value'>\" & Registro.'ACIONADO POR'.Value & \"</div></div>\") &\n    \n    If(Registro.'EM VOO',\n        \"<div class='field'><div class='label'>Em Voo:</div><div class='value'>Sim</div></div>\" &\n        If(!IsBlank(Registro.'NÚMERO DO VOO'), \"<div class='field'><div class='label'>Nº Voo:</div><div class='value'>\" & Registro.'NÚMERO DO VOO' & \"</div></div>\") &\n        If(!IsBlank(Registro.'HORÁRIO DE ACIONAMENTO EM VOO'), \"<div class='field'><div class='label'>Data/Hora Acionamento em Voo:</div><div class='value'>\" & Text(Registro.'HORÁRIO DE ACIONAMENTO EM VOO', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n        If(!IsBlank(Registro.'HORÁRIO DE CALÇO'), \"<div class='field'><div class='label'>Data/Hora de Abertura de Porta:</div><div class='value'>\" & Text(Registro.'HORÁRIO DE CALÇO', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\"),\n        \"\"\n    ) &\n\n    If(!IsBlank(Registro.'HORÁRIO DO ACIONAMENTO'), \"<div class='field'><div class='label'>Data/Hora do Acionamento da Equipe:</div><div class='value'>\" & Text(Registro.'HORÁRIO DO ACIONAMENTO', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DO ATENDIMENTO'), \"<div class='field'><div class='label'>Início do Atendimento:</div><div class='value'>\" & Text(Registro.'HORÁRIO DO ATENDIMENTO', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n\n    If(!IsBlank(Registro.LOCAL.Value), \"<div class='field'><div class='label'>Local:</div><div class='value'>\" & Registro.LOCAL.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.CATEGORIA.Value), \"<div class='field'><div class='label'>Categoria:</div><div class='value'>\" & Registro.CATEGORIA.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.'INFORME A EMPRESA/RAZÃO SOCIAL'), \"<div class='field'><div class='label'>Empresa:</div><div class='value'>\" & Registro.'INFORME A EMPRESA/RAZÃO SOCIAL' & \"</div></div>\") &\n    If(!IsBlank(Registro.CNPJ), \"<div class='field'><div class='label'>CNPJ:</div><div class='value'>\" & Registro.CNPJ & \"</div></div>\") &\n    If(!IsBlank(Registro.FUNÇÃO.Value) || !IsBlank(Registro.'ANTENDIDO POR'), \"<div class='field'><div class='label'>Atendido por:</div><div class='value'>\" & Registro.FUNÇÃO.Value & \" - \" & Registro.'ANTENDIDO POR' & \"</div></div>\") &\n    If(!IsBlank(Registro.'NOME DO PACIENTE'), \"<div class='field'><div class='label'>Nome do Paciente:</div><div class='value'>\" & Registro.'NOME DO PACIENTE' & \"</div></div>\") &\n    If(!IsBlank(Registro.'SEXO DO PACIENTE'.Value), \"<div class='field'><div class='label'>Sexo:</div><div class='value'>\" & Registro.'SEXO DO PACIENTE'.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.'MOTIVO DO ATENDIMENTO (Diagnóstico provável)'), \"<div class='field'><div class='label'>Motivo do Atendimento:</div><div class='value'>\" & Registro.'MOTIVO DO ATENDIMENTO (Diagnóstico provável)' & \"</div></div>\") &\n    If(!IsBlank(Registro.CRITICIDADE.Value), \"<div class='field'><div class='label'>Criticidade:</div><div class='value'>\" & Registro.CRITICIDADE.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.REMOÇÃO.Value), \"<div class='field'><div class='label'>Remoção:</div><div class='value'>\" & Registro.REMOÇÃO.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DE ACIONAMENTO DA AMBULÂNCIA'), \"<div class='field'><div class='label'>Acionamento da Ambulância:</div><div class='value'>\" & Text(Registro.'HORÁRIO DE ACIONAMENTO DA AMBULÂNCIA', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DA CHEGADA DA AMBULÂNCIA'), \"<div class='field'><div class='label'>Chegada da Ambulância no Local:</div><div class='value'>\" & Text(Registro.'HORÁRIO DA CHEGADA DA AMBULÂNCIA', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DA SAÍDA DA AMBULÂNCIA'), \"<div class='field'><div class='label'>Saída da Ambulância:</div><div class='value'>\" & Text(Registro.'HORÁRIO DA SAÍDA DA AMBULÂNCIA', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DO RETORNO DA AMBULÂNCIA'), \"<div class='field'><div class='label'>Retorno da Ambulância:</div><div class='value'>\" & Text(Registro.'HORÁRIO DO RETORNO DA AMBULÂNCIA', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n    If(!IsBlank(Registro.DESFECHO.Value), \"<div class='field'><div class='label'>Desfecho:</div><div class='value'>\" & Registro.DESFECHO.Value & \"</div></div>\") &\n    If(!IsBlank(Registro.OBSERVAÇÕES), \"<div class='field'><div class='label'>Observações:</div><div class='value'>\" & Registro.OBSERVAÇÕES & \"</div></div>\") &\n    If(!IsBlank(Registro.'HORÁRIO DO ENCERRAMENTO DO ATENDIMENTO'), \"<div class='field' ><div class='label'>Data/Hora Encerramento:</div><div class='value'>\" & Text(Registro.'HORÁRIO DO ENCERRAMENTO DO ATENDIMENTO', \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div></div>\") &\n\n    If(!IsBlank(Registro.VALOR_ATENDIMENTO), \"<div class='field'><div class='label'>Valor Atendimento:</div><div class='value'>\" & \"R$ \" & Text(Registro.VALOR_ATENDIMENTO, \"#,##0.00\", \"pt-BR\") & \"</div></div>\") &\n    If(!IsBlank(Registro.VALOR_REMOÇÃO), \"<div class='field'><div class='label'>Valor Remoção:</div><div class='value'>\" & \"R$ \" & Text(Registro.VALOR_REMOÇÃO, \"#,##0.00\", \"pt-BR\") & \"</div></div>\") &\n    If(!IsBlank(Registro.VALOR_ATENDIMENTO + Registro.VALOR_REMOÇÃO), \"<div class='field'><div class='label'>Valor Total:</div><div class='value'>\" & \"R$ \" & Text(Registro.VALOR_ATENDIMENTO + Registro.VALOR_REMOÇÃO, \"#,##0.00\", \"pt-BR\") & \"</div></div>\") &\n\n\"</div>\"\n) &\n\n\"<div class='footer'>Gerado em: \" & Text(Now(), \"[$-pt-BR]dd/mm/yyyy HH:mm\") & \"</div>\"\n"
            Size: =10
            Visible: =false
            Width: =432
            X: =934
            Y: =667
