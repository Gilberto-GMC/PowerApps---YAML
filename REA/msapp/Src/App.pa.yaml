                  ICAO: "SBUG",
                  Bloco: "SUL",
                  Aeroporto: "URUGUAIANA",
                  Cat: 5,
                  Classe: "I"
              }
          )
      );
      // 👤 Identificação do usuário
      Set(
          varIdUser,
          Coalesce(
              Param("USUARIO"), // GYN: 589;
              LookUp(
                  User,
                  usrNome = User().FullName
              ).ID
          )
      );
      // 🧾 Dados do usuário
      With(
          {
              usuario: LookUp(
                  User,
                  ID = Value(varIdUser)
              )
          },
          Set(
              varNomeUser,
              usuario.usrNome
          );
          Set(
              varEmailUser,
              usuario.Email
          );
          Set(
              varFuncaoUser,
              usuario.Funcao
          );
          Set(
              varBlocoUser,
              usuario.Bloco
          );
          Set(
              varClusterUser,
              usuario.Cluster
          );
          Set(
              varAeroUser,
              usuario.Aeroporto
          );
          Set(
              varPerfilUser,
              usuario.Perfil
          );
          Set(
              varAutUser,
              usuario.Autorizacao
          )
      );
      // 🏷️ Códigos ICAO e IATA do usuário
      With(
          {
              aero: LookUp(
                  colAeros,
                  Aeroporto = varAeroUser
              )
          },
          Set(
              varICAOUser,
              aero.ICAO
          );
          Set(
              varIATAUser,
              aero.IATA
          )
      );
      // 📜 Lista de cessionários
      If(
          varPerfilUser = "Base",
          ClearCollect(
              col_listaCessionarios,
              Sort(
                  Filter(
                      tbl_listaCessionarios,
                      'Aeroporto de concessão' = varIATAUser
                  ),
                  'Razão social',
                  SortOrder.Ascending
              )
          ),
          ClearCollect(
              col_listaCessionarios,
              Sort(
                  tbl_listaCessionarios,
                  'Razão social',
                  SortOrder.Ascending
              )
          )
      );
      // 📁 Menu principal
      ClearCollect(
          col_menu,
          {
              Icon: Icon.Location,
              Nome: "Painel Operacional",
              Tela: ScreenPainelOperacional
          },
          {
              Icon: Icon.Cars,
              Nome: "Gestão de Veículos",
              Tela: ScreenGestaoViaturas
          }
      );
      // 📚 Módulos ativos
      ClearCollect(
          col_menuModulos,
          Filter(
              tbl_Modulos,
              Menu.Value = "Resposta Emergência"
          )
      );
      // 🧭 Navegação por telas
      ClearCollect(
          col_NavTelas,
          Table(
