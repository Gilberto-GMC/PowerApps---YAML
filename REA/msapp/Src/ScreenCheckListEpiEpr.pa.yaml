                                    - HtmlText6_2:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(48, 48, 48, 1)
                                          DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                          Font: =Font.'Open Sans'
                                          HtmlText: "=With(\n    {\n        TABLE: \"style='font-family: Arial, Helvetica, sans-serif;  border-collapse: collapse;  width: 100%'\",\n        TD: \"style='border: 1px solid #ddd;  padding: 8px'\"\n    },\n    \"<h3> Protocolo: \" & GalleryCheckListEPI.Selected.PROTOCOLO & \"</h3>\n<h3> Aeroporto: \" & GalleryCheckListEPI.Selected.AEROPORTO & \"</h3>\n<h3> Equipe: \" & GalleryCheckListEPI.Selected.EQUIPE & \"</h3>\n<h3> Responsável pelo preenchimento: \" & GalleryCheckListEPI.Selected.RESPONSÁVEL & \"</h3>\n<table \" & TABLE & \">\n  <tr>\n    <th style='width: 250px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>ITEM</th>\n    <th style='width: 150px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>RESPOSTA</th>\n    <th style='padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>DESCRIÇÃO</th>\n    <th style='width: 150px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>STATUS</th>\n  </tr>\n  <tr>\n    <td \" & TD & \">TRAJES DE PROTEÇÃO DE COMBATE À INCÊNDIO</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'1. TRAJES DE PROTEÇÃO DE COMBATE À INCÊNDIO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'1. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"TRAJES DE PROTEÇÃO DE COMBATE À INCÊNDIO\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">BOTAS DE COMBATE À INCÊNDIO</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'2. BOTAS DE COMBATE À INCÊNDIO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'2. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"BOTAS DE COMBATE À INCÊNDIO\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">BALACLAVAS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'3. BALACLAVAS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'3. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"BALACLAVAS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">LUVAS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'4. LUVAS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'4. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"LUVAS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">CAPACETES</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'5. CAPACETES' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'5. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"CAPACETES\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">PROTETORES AURICULARES</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'6. PROTETORES AURICULARES' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'6. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"PROTETORES AURICULARES\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">EPR PARA TODOS OS BOMBEIROS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'7. EPR' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'7. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"EPR PARA TODOS OS BOMBEIROS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">EPR COMPATIVEIS COM O TP</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'8. EPR COMPATIVEIS TP' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'8. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"EPR COMPATIVEIS COM O TP\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">CILINDROS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'9. CILINDROS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'9. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"CILINDROS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">ARREIOS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'10. ARREIOS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'10. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"ARREIOS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \"MASCARÁS</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'11. MASCARÁS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'11. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"MASCARÁS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">VÁLVULA MANGUEIRA</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'12. VÁLVULA MANGUEIRA' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.'12. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"VÁLVULA MANGUEIRA\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">OUTROS</td>\n    <td \" & TD & \">\" & If(\n        GalleryCheckListEPI.Selected.OUTROS,\n        \"NÃO CONFORME\",\n        \"N/A\"\n    ) & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListEPI.Selected.OUTROS & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListEpiEprItens,\n        Item = \"OUTROS\" And ID_CheckList = GalleryCheckListEPI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n \n</table>\n\"\n)"
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
