                                                "<style>
                                                @page { size: A4 landscape; margin: 10mm; }
                                                * { box-sizing: border-box; margin: 0; padding: 0; }
                                                body {
                                                    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
                                                    color: #1E293B;
                                                    background: #FFFFFF;
                                                    font-size: 9px;
                                                    text-transform: uppercase;
                                                    -webkit-print-color-adjust: exact;
                                                }
                                                /* === CABEÇALHO EXECUTIVO === */
                                                .header-bar {
                                                    background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%);
                                                    padding: 16px 24px;
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: space-between;
                                                    margin-bottom: 0;
                                                }
                                                .header-brand {
                                                    display: flex;
                                                    align-items: center;
                                                    gap: 12px;
                                                }
                                                .brand-icon {
                                                    width: 36px; height: 36px;
                                                    background: #6366F1;
                                                    display: flex; align-items: center; justify-content: center;
                                                    font-size: 16px; font-weight: 900; color: #FFF;
                                                    letter-spacing: -1px;
                                                }
                                                .brand-name {
                                                    font-size: 20px; font-weight: 800; color: #FFFFFF;
                                                    letter-spacing: 2px;
                                                }
                                                .brand-sub {
                                                    font-size: 9px; color: #94A3B8; font-weight: 500;
                                                    letter-spacing: 1px; margin-top: 2px;
                                                }
                                                .header-title {
                                                    text-align: center;
                                                    flex: 1;
                                                }
                                                .header-title h1 {
                                                    font-size: 14px; font-weight: 700; color: #FFFFFF;
                                                    letter-spacing: 1.5px; margin: 0;
                                                }
                                                .header-title h2 {
                                                    font-size: 10px; font-weight: 400; color: #CBD5E1;
                                                    letter-spacing: 0.5px; margin: 4px 0 0 0;
                                                }
                                                .header-meta {
                                                    text-align: right;
                                                    color: #94A3B8;
                                                    font-size: 9px;
                                                    line-height: 1.6;
                                                }
                                                .header-meta strong {
                                                    color: #E2E8F0;
                                                }
                                                /* === FAIXA DE TIPOS === */
                                                .types-strip {
                                                    background: #F8FAFC;
                                                    border-top: 3px solid #6366F1;
                                                    border-bottom: 1px solid #E2E8F0;
                                                    padding: 10px 24px;
                                                    margin-bottom: 16px;
                                                }
                                                .types-label {
                                                    font-size: 8px; font-weight: 700; color: #6366F1;
                                                    letter-spacing: 1px; margin-bottom: 4px;
                                                }
                                                .types-list {
                                                    font-size: 8px; color: #475569; font-weight: 500;
                                                    line-height: 1.5; letter-spacing: 0.3px;
                                                }
                                                /* === KPIs === */
                                                .kpi-row {
                                                    display: flex; gap: 12px;
                                                    margin: 0 0 16px 0;
                                                }
                                                .kpi-card {
                                                    flex: 1;
                                                    background: #FFFFFF;
                                                    border: 1px solid #E2E8F0;
                                                    padding: 10px 16px;
                                                    text-align: center;
                                                }
                                                .kpi-value {
                                                    font-size: 22px; font-weight: 800; color: #0F172A;
                                                    line-height: 1;
                                                }
                                                .kpi-label {
                                                    font-size: 8px; color: #64748B; font-weight: 600;
                                                    letter-spacing: 0.8px; margin-top: 4px;
                                                }
                                                .kpi-accent { color: #6366F1; }
                                                /* === TABELA === */
                                                .table-wrapper {
                                                    border: 1px solid #E2E8F0;
                                                    background: #FFFFFF;
                                                }
                                                table {
                                                    width: 100%; border-collapse: collapse; table-layout: fixed;
                                                }
                                                thead th {
                                                    background: #0F172A;
                                                    color: #FFFFFF;
                                                    font-size: 9px;
                                                    font-weight: 700;
                                                    letter-spacing: 0.8px;
                                                    padding: 8px 10px;
                                                    text-align: left;
                                                    border-right: 1px solid #1E293B;
                                                }
                                                thead th:last-child { border-right: none; }
                                                tbody tr { page-break-inside: avoid; }
                                                tbody td {
                                                    padding: 7px 10px;
                                                    vertical-align: top;
                                                    line-height: 1.35;
                                                    font-size: 9px;
                                                    color: #1E293B;
                                                    border-top: 1px solid #F1F5F9;
                                                    border-right: 1px solid #F1F5F9;
                                                    word-break: break-word;
                                                }
                                                tbody td:last-child { border-right: none; }
                                                tbody tr:nth-child(even) td { background: #F8FAFC; }
                                                tbody tr:hover td { background: #EEF2FF; }
                                                /* === RODAPÉ === */
                                                .report-footer {
                                                    display: flex;
                                                    justify-content: space-between;
                                                    align-items: center;
                                                    padding: 8px 16px;
                                                    border-top: 2px solid #0F172A;
                                                    margin-top: 0;
                                                    font-size: 8px;
