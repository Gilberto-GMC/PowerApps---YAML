                  - TimerBlink:
                      Control: Timer@2.1.0
                      Properties:
                        AutoPause: =false
                        AutoStart: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Duration: =1000
                        HoverColor: =RGBA(255, 255, 255, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
