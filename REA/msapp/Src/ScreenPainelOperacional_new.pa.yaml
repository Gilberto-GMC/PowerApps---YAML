                  - TimerBlink_1:
                      Control: Timer@2.1.0
                      Properties:
                        AutoPause: =false
                        AutoStart: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Duration: =1000
                        HoverColor: =RGBA(255, 255, 255, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnTimerEnd: |-
                          =If(
                              var_visibleBlink = false,
                              UpdateContext({var_visibleBlink: true}),
                              UpdateContext({var_visibleBlink: false})
                          )
                        Repeat: =true
                        Visible: =false
                  - TimerRefresh_1:
                      Control: Timer@2.1.0
                      Properties:
                        AutoPause: =false
                        AutoStart: =true
                        Color: =RGBA(255, 255, 255, 1)
                        Duration: =300000
                        HoverColor: =RGBA(255, 255, 255, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnTimerEnd: |-
                          =// 1. Reset de variáveis
                          UpdateContext(
                              {
                                  var_visibleDetalhes: false,
                                  var_mapSelect: ""
                              }
                          );
                          // 2. Carrega CCI com veículo vinculado
                          ClearCollect(
                              col_dadosCCI,
                              AddColumns(
                                  Filter(
                                      'tbl_CHECK-LIST-ALL-ITENS',
                                      Modulo = "Check-list CCI" And Status.Value = "Em Atendimento"
                                  ),
                                  VEICULO,
                                  LookUp(
                                      'tbl_CHECK-LIST-VEICULO-CCI',
                                      ID_FORMS = ID_CheckList,
                                      'IDENTIFICAÇÃO DO VEÍCULO'
                                  )
                              )
                          );
                          // 3. Pré-carrega ocorrências abertas UMA única vez
                          //    → elimina N queries a tbl_ReaOcorrencias no loop abaixo
                          ClearCollect(
                              col_baixaCCIAberta,
                              Filter(
                                  tbl_ReaOcorrencias,
                                  (Tipo_ocorrencia.Value = "Baixa do CCI" Or Tipo_ocorrencia.Value = "Baixa do CRS") And Status.Value = "Aberto"
                              )
                          );
                          // 4. Patcha a collection em memória — zero queries ao Dataverse no loop
                          ForAll(
                              col_painelOperacionalVeiculos As _v,
                              Patch(
                                  col_painelOperacionalVeiculos,
                                  _v,
                                  {
                                      statusPainel: With(
                                          {
                                              _temCCI: CountRows(
                                                  Filter(
                                                      col_dadosCCI,
                                                      VEICULO = _v.identificacao
                                                  )
                                              ) > 0,
                                              _temBaixaCCI: CountRows(
                                                  Filter(
                                                      col_baixaCCIAberta,
                                                      Veiculo_identificacao = _v.identificacao
                                                  )
                                              ) > 0
                                          },
                                          If(
                                              _temBaixaCCI,
                                              "Crítico",
                                              _temCCI,
                                              "Média",
                                              "Operacional"
                                          )
                                      )
                                  }
                              )
                          )
                        Repeat: =true
                        Visible: =false
                  - HtmlText10_3:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        HtmlText: |+
                          ="<div style='
                              display: inline-flex;
                              align-items: center;
                              background-color: rgba(255, 255, 255, 0.08);
                              border-radius: 12px;
                              padding: 8px 12px;
                              font-family: Segoe UI, sans-serif;
                              gap: 0;
                          '>
                              <div style='text-align: center; padding: 0 20px;'>
                                  <div style='font-size: 11px; font-weight: 600; color: #9090b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;'>Veículos</div>
                                  <div style='font-size: 26px; font-weight: 700; color: #ffffff;'>" & CountRows(col_painelOperacionalVeiculos) & "</div>
                              </div>

                              <div style='width: 1px; height: 40px; background-color: rgba(255,255,255,0.15);'></div>

                              <div style='text-align: center; padding: 0 20px;'>
                                  <div style='font-size: 11px; font-weight: 600; color: #00d4ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;'>CCI</div>
                                  <div style='font-size: 26px; font-weight: 700; color: #ffffff;'>" & CountRows(Filter(col_painelOperacionalVeiculos, tipo.Value = "CCI")) & "</div>
                              </div>

                              <div style='width: 1px; height: 40px; background-color: rgba(255,255,255,0.15);'></div>

                              <div style='text-align: center; padding: 0 20px;'>
                                  <div style='font-size: 11px; font-weight: 600; color: #00e87a; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;'>CRS</div>
                                  <div style='font-size: 26px; font-weight: 700; color: #ffffff;'>" & CountRows(Filter(col_painelOperacionalVeiculos, tipo.Value = "CRS")) & "</div>
                              </div>
                          </div>"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingTop: =0
                        Width: =300
