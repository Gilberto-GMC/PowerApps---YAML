                                    - HtmlText6_3:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(48, 48, 48, 1)
                                          DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                          Font: =Font.'Open Sans'
                                          HtmlText: "=With(\n    {\n        TABLE: \"style='font-family: Arial, Helvetica, sans-serif;  border-collapse: collapse;  width: 100%'\",\n        TD: \"style='border: 1px solid #ddd;  padding: 8px'\"\n    },\n    \"<h3> Protocolo: \" & GalleryCheckListSme.Selected.PROTOCOLO & \"</h3>\n<h3> Aeroporto: \" & GalleryCheckListSme.Selected.AEROPORTO & \"</h3>\n<h3> Equipe: \" & GalleryCheckListSme.Selected.EQUIPE & \"</h3>\n<h3> Responsável pelo preenchimento: \" & GalleryCheckListSme.Selected.FUNÇÃO & \" - \" & GalleryCheckListSme.Selected.RESPONSÁVEL & \"</h3>\n<table \" & TABLE & \">\n  <tr>\n    <th style='width: 250px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>ITEM</th>\n    <th style='width: 150px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>RESPOSTA</th>\n    <th style='padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>DESCRIÇÃO</th>\n    <th style='width: 150px; padding-top: 12px;  padding-bottom: 12px;  text-align: center;  background-color: #04AA6D;  color: white;'>STATUS</th>\n  </tr>\n  <tr>\n    <td \" & TD & \">EQUIPAMENTOS DE RÁDIO - AMBULÂNCIA</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'1. EQUIPAMENTOS DE RÁDIO - AMBULÂNCIA' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'1. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"EQUIPAMENTOS DE RÁDIO - AMBULÂNCIA\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">ALARMES AUDIOVISUAIS DO VEÍCULO</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'2. ALARMES AUDIOVISUAIS DO VEÍCULO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'2. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"ALARMES AUDIOVISUAIS DO VEÍCULO\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">MAPAS DE GRADE INTERNO E EXTERNO AMBULÂNCIA</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'3. MAPAS DE GRADE INTERNO E EXTERNO AMBULÂNCIA' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'3. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"MAPAS DE GRADE INTERNO E EXTERNO AMBULÂNCIA\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">ESTADO GERAL DO VEÍCULO</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'4. ESTADO GERAL DO VEÍCULO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'4. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"ESTADO GERAL DO VEÍCULO\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">EQUIPAMENTOS AMBULÂNCIA</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'5. EQUIPAMENTOS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'5. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"EQUIPAMENTOS AMBULÂNCIA\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">EQUIPAMENTOS DE RÁDIO - PAPH</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'6. RÁDIO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'6. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"EQUIPAMENTOS DE RÁDIO - PAPH\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">MAPAS DE GRADE INTERNO E EXTERNO PAPH</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'7. MAPAS DE GRADE INTERNO E EXTERNO' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'7. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"MAPAS DE GRADE INTERNO E EXTERNO PAPH\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">EQUIPAMENTOS PAPH</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'8. EQUIPAMENTOS DO PAPH' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'8. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"EQUIPAMENTOS DO PAPH\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">MATERIAIS CLÍNICOS</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'9. MATERIAIS CLINICOS' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'9. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,\n        Item = \"MATERIAIS CLÍNICOS\" And ID_CheckList = GalleryCheckListSme.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">MATERIAIS DE TRAUMA</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'10. MATERIAIS DE TRAUMA' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListSme.Selected.'10. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListSmeItens,