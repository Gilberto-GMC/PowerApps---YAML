Screens:
  Index:
    Properties:
      OnVisible: |-
        =If(
            Mid(
                Param("LOGADO"),
                13,
                8
            ) = Text(
                Now(),
                "ddmmyyyy"
            ),
            Set(
                var_usuarioID,
                Param("USUARIO")
            );
            Select(NavInspecao),
            UpdateContext({var_visibleErro: true})
        )
    Children:
      - ScreenContainer1_8:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Max(App.Height, App.MinScreenHeight)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =40
            PaddingBottom: =16
            PaddingLeft: =50
            PaddingRight: =50
            PaddingTop: =100
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =var_visibleErro
            Width: =Max(App.Width, App.MinScreenWidth)
          Children:
            - Label3:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =RGBA(77, 77, 77, 1)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =50
                  Text: ="Erro"
            - Label3_1:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =RGBA(77, 77, 77, 1)
                  Fill: =RGBA(238, 204, 204, 0.52)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =24
                  Text: ="O usuário não está logado, por favor efetue o login acessando o botão abaixo:"
            - NavInspecao:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(255, 255, 255, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |-
                    =
                    Navigate(
                        ScreenREA,
                        ScreenTransition.Fade,
                        {
                            var_visibleMenu: true,
                            var_formHome: true
                        }
                    )
                  Text: ="Botão Navigate inspeção"
                  Visible: |-
                    =//true
                    false
            - LinkAirportNow:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(255, 255, 255, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |-
                    =Launch(
                        "/providers/Microsoft.PowerApps/apps/a5af3add-12da-4107-b027-23daea7b0056",
                        {LOGADO: ""},
                        LaunchTarget.Replace
                    )
                  Text: ="Botão Link Airport Now"
                  Visible: =false
            - ButtonCanvas1_8:
                Control: Button@0.0.45
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  Height: =50
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |-
                    =Launch(
                            "/providers/Microsoft.PowerApps/apps/a5af3add-12da-4107-b027-23daea7b0056",
                            {
                                LOGADO: ""
                            },
                            LaunchTarget.Replace
                        )
                  Text: ="Efetuar Login"
