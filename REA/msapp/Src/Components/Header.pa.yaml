ComponentDefinitions:
  Header:
    DefinitionType: CanvasComponent
    CustomProperties:
      CargoUsuario:
        PropertyKind: Input
        DisplayName: CargoUsuario
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Texto"
      NomeUsuario:
        PropertyKind: Input
        DisplayName: NomeUsuario
        Description: Uma propriedade personalizada
        DataType: Text
        Default: ="Texto"
    Properties:
      Height: =70
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Container79:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(235, 240, 245, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingLeft: =30
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Container85:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =32
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =400
                Children:
                  - TextInput2:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        BorderThickness: =0
                        Color: =RGBA(106, 122, 127, 1)
                        Default: =
                        Fill: =RGBA(180, 214, 250, 0.2)
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height + 2
                        HintText: ="Buscar módulo ou ferramenta..."
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverColor: =RGBA(106, 122, 127, 1)
                        HoverFill: =RGBA(186, 202, 226, 0.1)
                        PaddingLeft: =40
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =10
                        Width: =Parent.Width + 2
                        X: =-1
                        Y: =-1
                  - Icon31:
                      Control: Icon@0.0.7
                      Properties:
                        Height: =25
                        Icon: ="Search"
                        IconColor: =RGBA(9, 33, 98, 1)
                        Width: =25
                        X: =6
                        Y: =3
            - Container19_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.End
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - TextCanvas3_10:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.End
                        AlignInContainer: =AlignInContainer.End
                        AutoHeight: =true
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingRight: =5
                        Size: =12
                        Text: =Header.NomeUsuario
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Bold
                        Width: =500
                        Wrap: =false
                  - TextCanvas4_2:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.End
                        AlignInContainer: =AlignInContainer.End
                        AutoHeight: =true
                        Height: =30
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingRight: =5
                        Size: =12
                        Text: =Header.CargoUsuario
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =500
                        Wrap: =false
            - Image5_2:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =40
                  Image: =User().Image
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =100
                  RadiusBottomRight: =100
                  RadiusTopLeft: =100
                  RadiusTopRight: =100
                  Width: =40
