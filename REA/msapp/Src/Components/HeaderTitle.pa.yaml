ComponentDefinitions:
  HeaderTitle:
    DefinitionType: CanvasComponent
    CustomProperties:
      IconVisible:
        PropertyKind: Input
        DisplayName: IconVisible
        Description: Uma propriedade personalizada
        DataType: Boolean
        Default: =true
      ScreenNavigator:
        PropertyKind: Input
        DisplayName: ScreenNavigator
        Description: Uma propriedade personalizada
        DataType: Screen
        Default: =
      var_subtitulo1:
        PropertyKind: Input
        DisplayName: var_subtitulo1
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =
      var_subtitulo2:
        PropertyKind: Input
        DisplayName: var_subtitulo2
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =
      var_tituloModulo:
        PropertyKind: Input
        DisplayName: var_tituloModulo
        Description: Uma propriedade personalizada
        DataType: Text
        Default: =var_tituloModulo
    Properties:
      Height: =50
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Container83_89:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(30, 30, 100, 1)
            DropShadow: =DropShadow.None
            Fill: =RGBA(96, 70, 237, 1)
            Height: =50
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =1
            PaddingTop: =1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Icon2_3:
                Control: Classic/Icon@2.5.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =30
                  HoverColor: =RGBA(39, 113, 194, 1)
                  Icon: =Icon.BackArrow
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  OnSelect: |-
                    =If(
                        !IsBlank(HeaderTitle.ScreenNavigator),
                        Navigate(
                            HeaderTitle.ScreenNavigator,
                            ScreenTransition.Fade
                        ),
                        Back()
                    )
                  Visible: =HeaderTitle.IconVisible
                  Width: =50
            - Button21_88:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(255, 255, 255, 1)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(0, 18, 107, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(0, 0, 0, 0)
                  FillPortions: =1
                  Height: =30
                  HoverBorderColor: =
                  HoverColor: =RGBA(39, 113, 194, 1)
                  HoverFill: =
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =300
                  OnSelect: =
                  PaddingLeft: =If(!HeaderTitle.IconVisible, 20, 5)
                  PaddingTop: =2
                  PressedBorderColor: =
                  PressedColor: =RGBA(39, 113, 194, 1)
                  PressedFill: =
                  Size: =12
                  Text: |-
                    =HeaderTitle.var_tituloModulo & If(
                        !IsBlank(HeaderTitle.var_subtitulo1),
                        " > " & HeaderTitle.var_subtitulo1
                    ) & If(
                        !IsBlank(HeaderTitle.var_subtitulo2),
                        " > " & HeaderTitle.var_subtitulo2
                    )
                  Width: =500
            - Image3:
                Control: Image@2.2.3
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Image: =MOTIVA_WHITE
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  Width: =60
