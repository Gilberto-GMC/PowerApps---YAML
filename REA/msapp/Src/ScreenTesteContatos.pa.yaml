                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =!var_relatorio And GalleryTesteContatos.AllItemsCount = 0
                        Weight: ='TextCanvas.Weight'.Medium
                  - GalleryTesteContatos:
                      Control: Gallery@2.15.0
                      Variant: VariableHeight
                      Properties:
                        Items: |-
                          =Filter(
                              colContatosAero As CONTATO,
                              CONTATO.status = "Atualizado" &&
                              IsBlank(
                                  LookUp(
                                      colTestesExecucao,
                                      id_contato = CONTATO.ID &&
                                      status.Value = "Contato Realizado"
                                  )
                              ) &&
                              CountRows(
                                  Filter(
                                      colTestesExecucao,
                                      id_contato = CONTATO.ID &&
                                      status.Value = "Contato não Realizado"
                                  )
                              ) < 3
                          )
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        TemplatePadding: =4
                        TemplateSize: =150
                        Visible: =!var_relatorio And  Self.AllItemsCount > 0
                      Children:
                        - HtmlText7_1:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              Height: =200
                              HtmlText: |
                                =Concatenate(
                                  "<div style='font-family:Segoe UI, sans-serif; padding:10px; border:1px solid #ccc; border-radius:8px; background-color:#f9f9f9;'>",
                                    "<div style='font-weight:bold;margin-right:800px; font-size:16px; color:#6600ed;'>", ThisItem.nome, "</div>",
                                    "<div style='margin-top:4px;margin-right:800px; font-size:14px; color:#444;'>",
                                      ThisItem.tipo_entidade.Value, " | ", ThisItem.nome_orgao, " | ", ThisItem.cargo,
                                    "</div>",
                                    "<div style='margin-top:4px; margin-right:800px; font-size:14px; color:#666;'>📞 ", ThisItem.tel_principal,
                                      If(!IsBlank(ThisItem.tel_reserva), " | " & ThisItem.tel_reserva, ""),
                                    "</div>",
                                    "<div style='margin-top:40px; margin-right:800px; font-size:14px; color:#666;'>", 
                                    "</div>",
                                  "<br><br></div>"
                                )
