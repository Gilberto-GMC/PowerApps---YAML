                        HtmlText: "=With(\n    {\n        dadosBase: Sort(\n            colTestesRelatorio,\n            status.Value,\n            SortOrder.Ascending\n        )\n    },\n    With(\n        {\n            totalTestes: CountRows(dadosBase),\n\n            totalRealizados: CountRows(\n                Filter(\n                    dadosBase,\n                    status.Value = \"Contato Realizado\"\n                )\n            ),\n\n            totalNaoRealizados: CountRows(\n                Filter(\n                    dadosBase,\n                    status.Value = \"Contato não Realizado\"\n                )\n            ),\n\n            textoProtocolo: Coalesce(\n                varTesteSelecionado.Protocolo,\n                \"Teste ID \" & Text(varTesteSelecionado.ID)\n            ),\n\n            textoAeroporto: Coalesce(\n                varTesteSelecionado.Aeroporto,\n                varAeroportoRelatorio\n            ),\n\n            textoDataTeste: Text(\n                varTesteSelecionado.Data,\n                \"[$-pt-BR]dd/mm/yyyy HH:mm\"\n            )\n        },\n        \"<div style='font-family: Arial, sans-serif; color:#1f2937; font-size:13px; width:100%;'>\n\n            \n\n            <table style='width:100%; border-collapse:collapse; margin-bottom:14px;'>\n                <tr>\n                    <td style='width:33.33%; padding:10px; border:1px solid #e5e7eb; background:#f9fafb;'>\n                        <div style='font-size:11px; color:#6b7280;'>Total de registros</div>\n                        <div style='font-size:22px; font-weight:700; color:#111827;'>\" & totalTestes & \"</div>\n                    </td>\n\n                    <td style='width:33.33%; padding:10px; border:1px solid #bbf7d0; background:#f0fdf4;'>\n                        <div style='font-size:11px; color:#047857;'>Conformes</div>\n                        <div style='font-size:22px; font-weight:700; color:#027a48;'>\" & totalRealizados & \"</div>\n                    </td>\n\n                    <td style='width:33.33%; padding:10px; border:1px solid #fecdd3; background:#fff1f2;'>\n                        <div style='font-size:11px; color:#be123c;'>Não conformes</div>\n                        <div style='font-size:22px; font-weight:700; color:#b42318;'>\" & totalNaoRealizados & \"</div>\n                    </td>\n                </tr>\n            </table>\" &\n\n            If(\n                totalTestes = 0,\n\n                \"<div style='padding:14px; border:1px solid #e5e7eb; background:#f9fafb; border-radius:8px; color:#6b7280;'>\n                    Nenhum contato foi registrado para este teste.\n                </div>\",\n\n                \"<table style='border-collapse:collapse; width:100%; font-family:Arial, sans-serif; font-size:12px; border:1px solid #d1d5db;'>\n                    <thead>\n                        <tr style='background:#111827; color:#ffffff; text-align:left;'>\n                            <th style='padding:8px; border:1px solid #374151; width:26%;'>Contato / Entidade</th>\n                            <th style='padding:8px; border:1px solid #374151; width:10%; text-align:center;'>Tentativa</th>\n                            <th style='padding:8px; border:1px solid #374151; width:14%;'>Resultado</th>\n                            <th style='padding:8px; border:1px solid #374151; width:22%;'>Atendimento / Motivo</th>\n                            <th style='padding:8px; border:1px solid #374151; width:14%;'>Data</th>\n                            <th style='padding:8px; border:1px solid #374151; width:14%;'>Criado por</th>\n                        </tr>\n                    </thead>\n                    <tbody>\" &\n\n                    Concat(\n                        dadosBase As LINHA,\n                        With(\n                            {\n                                nomeCompleto: Coalesce(\n                                    LookUp(\n                                        colContatosAeroRelatorio,\n                                        ID = LINHA.id_contato,\n                                        nome_orgao & \" - \" & nome\n                                    ),\n                                    \"Contato ID \" & Text(LINHA.id_contato)\n                                ),\n\n                                numeroTentativa: CountRows(\n                                    Filter(\n                                        dadosBase As HIST,\n                                        HIST.id_contato = LINHA.id_contato &&\n                                        (\n                                            HIST.Criado < LINHA.Criado ||\n                                            (\n                                                HIST.Criado = LINHA.Criado &&\n                                                HIST.ID <= LINHA.ID\n                                            )\n                                        )\n                                    )\n                                ),\n\n                                corLinha: If(\n                                    LINHA.status.Value = \"Contato Realizado\",\n                                    \"#f0fdf4\",\n                                    \"#fff1f2\"\n                                ),\n\n                                corBadge: If(\n                                    LINHA.status.Value = \"Contato Realizado\",\n                                    \"#d1fae5\",\n                                    \"#fecdd3\"\n                                ),\n\n                                corTexto: If(\n                                    LINHA.status.Value = \"Contato Realizado\",\n                                    \"#027a48\",\n                                    \"#b42318\"\n                                ),\n\n                                textoResultado: If(\n                                    LINHA.status.Value = \"Contato Realizado\",\n                                    \"Conforme\",\n                                    \"Não conforme\"\n                                ),\n\n                                textoDetalhe: If(\n                                    LINHA.status.Value = \"Contato Realizado\",\n                                    \"Quem atendeu: \" & Coalesce(\n                                        LINHA.nome_contato,\n                                        \"Não informado\"\n                                    ),\n                                    \"Motivo: \" & Coalesce(\n                                        LINHA.motivo,\n                                        \"Não informado\"\n                                    )\n                                ),\n\n                                textoObservacao: If(\n                                    IsBlank(LINHA.observacoes),\n                                    \"\",\n                                    \"<br><span style='color:#6b7280;'>Observação: \" & LINHA.observacoes & \"</span>\"\n                                )\n                            },\n                            \"<tr style='background:\" & corLinha & \";'>\n                                <td style='padding:8px; border:1px solid #d1d5db; vertical-align:top;'>\n                                    <b>\" & nomeCompleto & \"</b>\n                                </td>\n\n                                <td style='padding:8px; border:1px solid #d1d5db; text-align:center; vertical-align:top;'>\n                                    <span style='display:inline-block; padding:4px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-weight:700;'>\n                                        \" & numeroTentativa & \"º teste\n                                    </span>\n                                </td>\n\n                                <td style='padding:8px; border:1px solid #d1d5db; vertical-align:top;'>\n                                    <span style='display:inline-block; padding:4px 8px; border-radius:999px; background:\" & corBadge & \"; color:\" & corTexto & \"; font-weight:700;'>\n                                        \" & textoResultado & \"\n                                    </span>\n                                    <br>\n                                    <span style='font-size:11px; color:#6b7280;'>\n                                        \" & LINHA.status.Value & \"\n                                    </span>\n                                </td>\n\n                                <td style='padding:8px; border:1px solid #d1d5db; vertical-align:top;'>\n                                    \" & textoDetalhe & textoObservacao & \"\n                                </td>\n\n                                <td style='padding:8px; border:1px solid #d1d5db; vertical-align:top;'>\n                                    \" & Text(\n                                        LINHA.Criado,\n                                        \"[$-pt-BR]dd/mm/yyyy HH:mm\"\n                                    ) & \"\n                                </td>\n\n                                <td style='padding:8px; border:1px solid #d1d5db; vertical-align:top;'>\n                                    \" & LINHA.'Criado por'.DisplayName & \"\n                                </td>\n                            </tr>\"\n                        )\n                    ) &\n\n                    \"</tbody>\n                </table>\"\n            ) &\n\n        \"</div>\"\n    )\n)"
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Visible: =var_relatorio
