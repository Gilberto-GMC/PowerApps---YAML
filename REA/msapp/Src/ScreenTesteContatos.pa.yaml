                              Size: =10
                              Width: =Parent.Width - 30
                              X: =10
                        - ButtonCanvas11_48:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BorderRadiusBottomLeft: =4
                              BorderRadiusBottomRight: =4
                              BorderRadiusTopLeft: =4
                              BorderRadiusTopRight: =4
                              DisplayMode: |-
                                =If(
                                    IsBlank(
                                        Coalesce(
                                            varTesteAtualID,
                                            var_dadosTesteContato.ID,
                                            FormNovoTeste.LastSubmit.ID
                                        )
                                    ) ||
                                    Coalesce(varConfirmando, false) ||
                                    Coalesce(varFinalizandoTeste, false),

                                    DisplayMode.View,
                                    DisplayMode.Edit
                                )
                              FontSize: =14
                              Icon: ="Checkmark"
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              OnSelect: |-
                                =Set(
                                    varTesteAtualID,
                                    Coalesce(
                                        varTesteAtualID,
                                        var_dadosTesteContato.ID,
                                        FormNovoTeste.LastSubmit.ID
                                    )
                                );

                                Set(
                                    varAeroportoTesteAtual,
                                    Coalesce(
                                        varAeroportoTesteAtual,
                                        var_dadosTesteContato.Aeroporto,
                                        FormNovoTeste.LastSubmit.Aeroporto,
                                        DataCardValue8.Value
                                    )
                                );

                                If(
                                    varConfirmando,

                                    false,

                                    Set(
                                        varConfirmando,
                                        true
                                    );

                                    If(
                                        IsBlank(varTesteAtualID),

                                        Notify(
                                            "Salve ou inicie o teste antes de registrar os contatos.",
                                            NotificationType.Error,
                                            3000
                                        );

                                        Set(
                                            varConfirmando,
                                            false
                                        ),

                                        IsBlank(DataCardValue3_10.Selected.Value),

                                        Notify(
                                            "Selecione o status do contato.",
                                            NotificationType.Error,
                                            3000
                                        );

                                        Set(
                                            varConfirmando,
                                            false
                                        ),

                                        DataCardValue3_10.Selected.Value = "Contato Realizado" &&
                                        IsBlank(
                                            Trim(DataCardValue4_4.Value)
                                        ),

                                        Notify(
                                            "Informe quem atendeu o contato.",
                                            NotificationType.Error,
                                            3000
                                        );

                                        Set(
                                            varConfirmando,
                                            false
                                        ),

                                        DataCardValue3_10.Selected.Value = "Contato não Realizado" &&
                                        IsBlank(DataCardValueMotivo.Selected.Value),

                                        Notify(
                                            "Informe o motivo do contato não realizado.",
                                            NotificationType.Error,
                                            3000
                                        );

                                        Set(
                                            varConfirmando,
                                            false
                                        ),

                                        With(
                                            {
                                                _idContato: ThisItem.ID,
                                                _nomeContato: ThisItem.nome,
                                                _blocoContato: ThisItem.Bloco,
                                                _statusContatoAntes: Coalesce(
                                                    ThisItem.status,
                                                    ""
                                                ),
                                                _statusTeste: DataCardValue3_10.Selected.Value,
                                                _nomeAtendente: Trim(DataCardValue4_4.Value),
                                                _motivoNaoRealizado: DataCardValueMotivo.Selected.Value,
                                                _observacoes: Trim(DataCardValue4_2.Value)
                                            },

                                            IfError(
                                                With(
                                                    {
                                                        _novoRegistro:
                                                            Patch(
                                                                tbl_testeContatos,
                                                                Defaults(tbl_testeContatos),
                                                                {
                                                                    id_teste_base: varTesteAtualID,
                                                                    aeroporto: varAeroportoTesteAtual,
                                                                    id_contato: _idContato,
                                                                    status: DataCardValue3_10.Selected,

                                                                    nome_contato: If(
                                                                        _statusTeste = "Contato Realizado",
                                                                        _nomeAtendente,
                                                                        Blank()
                                                                    ),

                                                                    motivo: If(
                                                                        _statusTeste = "Contato não Realizado",
                                                                        _motivoNaoRealizado,
                                                                        Blank()
                                                                    ),

                                                                    observacoes: _observacoes
                                                                }
                                                            )
                                                    },

                                                    Collect(
                                                        colTestesExecucao,
                                                        _novoRegistro
                                                    );

                                                    With(
                                                        {
                                                            _resultadoConforme:
                                                                _statusTeste = "Contato Realizado",

                                                            _qtdFalhasContato:
                                                                CountRows(
                                                                    Filter(
                                                                        colTestesExecucao,
                                                                        id_teste_base = varTesteAtualID &&
                                                                        id_contato = _idContato &&
                                                                        status.Value = "Contato não Realizado"
                                                                    )
                                                                )
                                                        },

                                                        Set(
                                                            varErroLogTeste,
                                                            false
                                                        );

                                                        Set(
                                                            varMensagemErroLogTeste,
                                                            ""
                                                        );

                                                        IfError(
                                                            Patch(
                                                                tbl_contatos_entidades_log,
                                                                Defaults(tbl_contatos_entidades_log),
                                                                {
                                                                    id_contato: _idContato,
                                                                    aeroporto: varAeroportoTesteAtual,
                                                                    bloco: _blocoContato,

                                                                    acao: If(
                                                                        _resultadoConforme,
                                                                        "Conformidade no teste",
                                                                        "Não conformidade no teste"
                                                                    ),

                                                                    origem: "Teste de Contatos",
                                                                    nome_contato: _nomeContato,

                                                                    status_anterior: _statusContatoAntes,
                                                                    status_novo: _statusContatoAntes,

                                                                    usuario_nome: User().FullName,
                                                                    usuario_email: User().Email,

                                                                    detalhes:
                                                                        If(
                                                                            _resultadoConforme,

                                                                            "Teste de contato conforme. " &
                                                                            "Contato realizado no teste ID " &
                                                                            Text(varTesteAtualID) &
                                                                            ". Atendido por: " &
                                                                            _nomeAtendente &
                                                                            If(
                                                                                IsBlank(_observacoes),
                                                                                ".",
                                                                                ". Observações: " & _observacoes
                                                                            ),

                                                                            "Teste de contato não conforme. " &
                                                                            "Contato não realizado no teste ID " &
                                                                            Text(varTesteAtualID) &
                                                                            ". Motivo: " &
                                                                            _motivoNaoRealizado &
                                                                            ". Tentativa sem sucesso número " &
                                                                            Text(_qtdFalhasContato) &
                                                                            If(
                                                                                IsBlank(_observacoes),
                                                                                ".",
                                                                                ". Observações: " & _observacoes
                                                                            )
                                                                        ),

                                                                    DetalhesHtml:
                                                                        "<table style='width:100%; border-collapse:collapse; font-family:Segoe UI,Arial,sans-serif; font-size:12px;'>" &

                                                                            "<thead>" &
                                                                                "<tr style='background:#111827; color:#ffffff; text-align:left;'>" &
                                                                                    "<th style='padding:7px; border:1px solid #374151; width:32%;'>Campo</th>" &
                                                                                    "<th style='padding:7px; border:1px solid #374151;'>Resultado</th>" &
                                                                                "</tr>" &
                                                                            "</thead>" &

                                                                            "<tbody>" &

                                                                                "<tr>" &
                                                                                    "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                        "Resultado do teste" &
                                                                                    "</td>" &

                                                                                    "<td style='padding:7px; border:1px solid #d1d5db; font-weight:700; color:" &

                                                                                        If(
                                                                                            _resultadoConforme,
                                                                                            "#027a48",
                                                                                            "#b42318"
                                                                                        ) &

                                                                                    ";'>" &

                                                                                        If(
                                                                                            _resultadoConforme,
                                                                                            "Conforme — contato realizado",
                                                                                            "Não conforme — contato não realizado"
                                                                                        ) &

                                                                                    "</td>" &
                                                                                "</tr>" &

                                                                                "<tr>" &
                                                                                    "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                        "Teste" &
                                                                                    "</td>" &

                                                                                    "<td style='padding:7px; border:1px solid #d1d5db;'>" &
                                                                                        "ID " &
                                                                                        Text(varTesteAtualID) &
                                                                                    "</td>" &
                                                                                "</tr>" &

                                                                                "<tr>" &
                                                                                    "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                        If(
                                                                                            _resultadoConforme,
                                                                                            "Atendido por",
                                                                                            "Motivo"
                                                                                        ) &
                                                                                    "</td>" &

                                                                                    "<td style='padding:7px; border:1px solid #d1d5db;'>" &

                                                                                        If(
                                                                                            _resultadoConforme,
                                                                                            Coalesce(
                                                                                                _nomeAtendente,
                                                                                                "Não informado"
                                                                                            ),
                                                                                            Coalesce(
                                                                                                _motivoNaoRealizado,
                                                                                                "Não informado"
                                                                                            )
                                                                                        ) &

                                                                                    "</td>" &
                                                                                "</tr>" &

                                                                                If(
                                                                                    !_resultadoConforme,

                                                                                    "<tr>" &
                                                                                        "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                            "Tentativa sem sucesso" &
                                                                                        "</td>" &

                                                                                        "<td style='padding:7px; border:1px solid #d1d5db;'>" &
                                                                                            Text(_qtdFalhasContato) &
                                                                                            " de 3" &
                                                                                        "</td>" &
                                                                                    "</tr>",

                                                                                    ""
                                                                                ) &

                                                                                If(
                                                                                    !IsBlank(_observacoes),

                                                                                    "<tr>" &
                                                                                        "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                            "Observações" &
                                                                                        "</td>" &

                                                                                        "<td style='padding:7px; border:1px solid #d1d5db;'>" &
                                                                                            _observacoes &
                                                                                        "</td>" &
                                                                                    "</tr>",

                                                                                    ""
                                                                                ) &

                                                                            "</tbody>" &
                                                                        "</table>"
                                                                }
                                                            ),

                                                            Set(
                                                                varErroLogTeste,
                                                                true
                                                            );

                                                            Set(
                                                                varMensagemErroLogTeste,
                                                                Coalesce(
                                                                    FirstError.Message,
                                                                    "Não foi possível registrar o resultado no histórico do contato."
                                                                )
                                                            )
                                                        );

                                                        If(
                                                            _resultadoConforme,

                                                            RemoveIf(
                                                                colContatosAero,
                                                                ID = _idContato
                                                            )
                                                        );

                                                        If(
                                                            !_resultadoConforme &&
                                                            _qtdFalhasContato >= 3,

                                                            If(
                                                                _statusContatoAntes = "Desatualizado",

                                                                RemoveIf(
                                                                    colContatosAero,
                                                                    ID = _idContato
                                                                ),

                                                                Set(
                                                                    varErroDesatualizarContato,
                                                                    false
                                                                );

                                                                IfError(
                                                                    Patch(
                                                                        tbl_contatos_entidades,
                                                                        LookUp(
                                                                            tbl_contatos_entidades,
                                                                            ID = _idContato
                                                                        ),
                                                                        {
                                                                            status: "Desatualizado"
                                                                        }
                                                                    ),

                                                                    Set(
                                                                        varErroDesatualizarContato,
                                                                        true
                                                                    );

                                                                    Notify(
                                                                        "O contato atingiu 3 tentativas sem sucesso, mas não foi possível atualizar o cadastro de origem. " &
                                                                        Coalesce(
                                                                            FirstError.Message,
                                                                            ""
                                                                        ),
                                                                        NotificationType.Error,
                                                                        6000
                                                                    )
                                                                );

                                                                If(
                                                                    !varErroDesatualizarContato,

                                                                    IfError(
                                                                        Patch(
                                                                            tbl_contatos_entidades_log,
                                                                            Defaults(tbl_contatos_entidades_log),
                                                                            {
                                                                                id_contato: _idContato,
                                                                                aeroporto: varAeroportoTesteAtual,
                                                                                bloco: _blocoContato,
                                                                                acao: "Desatualização automática",
                                                                                origem: "Teste de Contatos",
                                                                                nome_contato: _nomeContato,
                                                                                status_anterior: _statusContatoAntes,
                                                                                status_novo: "Desatualizado",
                                                                                usuario_nome: User().FullName,
                                                                                usuario_email: User().Email,

                                                                                detalhes:
                                                                                    "Contato marcado como Desatualizado após 3 tentativas não realizadas no teste ID " &
                                                                                    Text(varTesteAtualID) &
                                                                                    ".",

                                                                                DetalhesHtml:
                                                                                    "<table style='width:100%; border-collapse:collapse; font-family:Segoe UI,Arial,sans-serif; font-size:12px;'>" &

                                                                                        "<thead>" &
                                                                                            "<tr style='background:#111827; color:#ffffff; text-align:left;'>" &
                                                                                                "<th style='padding:7px; border:1px solid #374151;'>Campo</th>" &
                                                                                                "<th style='padding:7px; border:1px solid #374151;'>Antes</th>" &
                                                                                                "<th style='padding:7px; border:1px solid #374151;'>Depois</th>" &
                                                                                            "</tr>" &
                                                                                        "</thead>" &

                                                                                        "<tbody>" &

                                                                                            "<tr>" &
                                                                                                "<td style='padding:7px; border:1px solid #d1d5db; font-weight:600;'>" &
                                                                                                    "Status" &
                                                                                                "</td>" &

                                                                                                "<td style='padding:7px; border:1px solid #d1d5db; color:#6b7280;'>" &
                                                                                                    Coalesce(
                                                                                                        _statusContatoAntes,
                                                                                                        "Atualizado"
