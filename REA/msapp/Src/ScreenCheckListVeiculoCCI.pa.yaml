                                    - HtmlText6:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =RGBA(48, 48, 48, 1)
                                          DisabledBorderColor: =RGBA(56, 56, 56, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =0
                                          HtmlText: "=With(\n    {\n        TABLE_STYLE: \"font-family: Arial, Helvetica, sans-serif; border-collapse: collapse; width: 100%;\" ,\n        TH_STYLE: \"background-color: #008799; color: white; padding: 10px; text-align: center;\" ,\n        TD_STYLE: \"border: 1px solid #ddd; padding: 10px; vertical-align: top;\"\n    } ,\n    \"<div style='font-family: Arial, sans-serif; margin: 20px;'>\n        <header style='border-bottom: 2px solid #008799; margin-bottom: 20px; padding-bottom: 10px;'>\n    <h1 style='margin: 0; color: #008799; font-size: 20px;'>\n        \" & Upper(var_tituloModulo) & \" DO DIA \" & Text(GalleryCheckListVeiculoCCI.Selected.Criado, \"[$-pt-BR]dd/mm/yyyy\") & \"\n    </h1>\n    <p style='margin: 5px 0; font-size: 12px;'>\n        <strong>Protocolo:</strong> \" & GalleryCheckListVeiculoCCI.Selected.Protocolo & \"\n    </p>\n    <p style='margin: 5px 0; font-size: 11px;'>\n        <strong>Aeroporto:</strong> \" & GalleryCheckListVeiculoCCI.Selected.AEROPORTO & \" |\n        <strong>Veículo:</strong> \" & GalleryCheckListVeiculoCCI.Selected.'IDENTIFICAÇÃO DO VEÍCULO' & \" |\n        <strong>Equipe:</strong> \" & GalleryCheckListVeiculoCCI.Selected.EQUIPE & \"\n    </p>\n</header>\n\n        <section style='display:flex; flex-wrap:wrap; gap: 20px; margin-bottom: 30px;'>\n            <div style='flex:1; min-width:200px;'>\n                <strong>Odômetro inicial:</strong><br>\" & GalleryCheckListVeiculoCCI.Selected.'ODÔMETRO INICIAL' & \"\n            </div>\n            <div style='flex:1; min-width:200px;'>\n                <strong>Combustível (%):</strong><br>\" & GalleryCheckListVeiculoCCI.Selected.'COMBUSTÍVEL %' & \"% – \" & \n                If(\n                    Value(GalleryCheckListVeiculoCCI.Selected.'COMBUSTÍVEL %') < 50,\n                    \"<span style='color: #d9534f;'>NÃO CONFORME</span>\",\n                    \"<span style='color: #5cb85c;'>CONFORME</span>\"\n                ) & \"\n            </div>\n            <div style='flex:1; min-width:200px;'>\n                <strong>Responsável:</strong><br>\" & GalleryCheckListVeiculoCCI.Selected.RESPONSAVEL & \"\n            </div>\n            <div style='flex:1; min-width:200px;'>\n                <strong>Operacionalidade:</strong><br>\" & GalleryCheckListVeiculoCCI.Selected.'OPERACIONALIDADE DO VEÍCULO' & \"\n            </div>\n        </section>\n        <table style='\" & TABLE_STYLE & \"'>\n            <thead>\n                <tr>\n                    <th style='\" & TH_STYLE & \" width:30%'>Item</th>\n                    <th style='\" & TH_STYLE & \" width:15%'>Resposta</th>\n                    <th style='\" & TH_STYLE & \"'>Descrição</th>\n                    <th style='\" & TH_STYLE & \" width:15%'>Status</th>\n                </tr>\n            </thead>\n            <tbody>\n               \n                <tr>\n    <td style='\" & TD_STYLE & \"'>ESTADO GERAL DO VEÍCULO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'1. ESTADO GERAL DO VEÍCULO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'1. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"ESTADO GERAL DO VEÍCULO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>RÁDIO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'2. RÁDIO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'2. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"RÁDIO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMAS AUDIOS VISUAIS DO VEICULO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'3. SISTEMAS AUDIOS VISUAIS DO VEICULO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'3. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMAS AUDIOS VISUAIS DO VEICULO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>PNEUS</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'4. PNEUS' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'4. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"PNEUS\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>FREIOS DO VEÍCULO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'5. FREIOS DO VEÍCULO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'5. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"FREIOS DO VEÍCULO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>VÁLVULAS DOS SISTEMAS DE AGENTES EXTINTORES</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'6. VÁLVULAS' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'6. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"VÁLVULAS DOS SISTEMAS DE AGENTES EXTINTORES\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>CANHÕES</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'7. CANHÕES' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'7. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"CANHÕES\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA DE ABASTECIMENTO POR SUCÇÃO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'8. SISTEMA DE ABASTECIMENTO POR SUCÇÃO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'8. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA DE ABASTECIMENTO POR SUCÇÃO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>MANGUEIRAS, ESGUICHOS E ASPERSORES</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'9. MANGUEIRAS, ESGUICHOS E ASPERSORES' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'9. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"MANGUEIRAS, ESGUICHOS E ASPERSORES\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA DE PÓ QUIMICO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'10. SISTEMA DE PÓ QUIMICO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'10. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA DE PÓ QUIMICO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA DE LGE</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'11. SISTEMA DE LGE' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'11. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA DE LGE\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA ELETRICO DA SUPERESTRUTURA DO CAMINHÃO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'12. SISTEMA ELETRICO DA SUPERESTRUTURA DO CAMINHÃO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'12. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA ELETRICO DA SUPERESTRUTURA DO CAMINHÃO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>BOMBA DE INCENDIO DO CCI</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'13. BOMBA DE INCENDIO DO CCI' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'13. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"BOMBA DE INCENDIO DO CCI\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA DE AR COMPRIMIDO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'14. SISTEMA DE AR COMPRIMIDO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'14. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA DE AR COMPRIMIDO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>SISTEMA PNEUMÁTICO DA SUPERESTRUTURA</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'15. SISTEMA PNEUMÁTICO DA SUPERESTRUTURA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'15. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"SISTEMA PNEUMÁTICO DA SUPERESTRUTURA\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>MAPAS DE GRADE INTERNO E EXTERNO</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'16. MAPAS DE GRADE INTERNO E EXTERNO' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.'16. DESCREVA' & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"MAPAS DE GRADE INTERNO E EXTERNO\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n  <tr>\n    <td style='\" & TD_STYLE & \"'>OUTROS</td>\n    <td style='\" & TD_STYLE & \"'>\" & If(\n            GalleryCheckListVeiculoCCI.Selected.OUTROS,\n            \"NÃO CONFORME\",\n            \"N/A\"\n        ) & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & GalleryCheckListVeiculoCCI.Selected.OUTROS & \"</td>\n    <td style='\" & TD_STYLE & \"'>\" & LookUp(\n            col_checkListCCIitens,\n            Item = \"OUTROS\" And ID_CheckList = GalleryCheckListVeiculoCCI.Selected.ID_FORMS,\n            Status.Value & \"  \" & 'Data de normalização'\n        ) & \"</td>\n  </tr>\n            </tbody>\n        </table>\n    </div>\n    \n\n\n\n    <div style='font-family: Arial; font-size: 10px; padding: 10px; border-top: 1px solid #ccc; margin-top: 20px;'>\n  <strong>Legenda de critérios de conformidade utilizados no checklist:</strong>\n  <ul style='padding-left: 18px; margin-top: 8px; margin-bottom: 8px;'>\n    <li><strong>Combustível:</strong> Considerado conforme quando o nível está igual ou superior a 50%.</li>\n    <li><strong>Estado geral do veículo:</strong> Todos os sistemas básicos e estruturais (como ignição, retrovisores, suspensão, direção, buzina, bancos, portas, etc.) devem estar funcionais e sem danos.</li>\n    <li><strong>Sistemas de rádio e comunicação:</strong> Devem estar com bateria, botões e antena operando corretamente e com qualidade de transmissão (clareza 5/5).</li>\n    <li><strong>Itens visuais e sonoros:</strong> Inclui giroflex, faróis, sirene, buzina e luzes auxiliares — todos devem estar funcionais e visíveis/audíveis.</li>\n    <li><strong>Pneus:</strong> Devem estar íntegros, dentro da validade e livres de furos, fissuras ou avarias.</li>\n    <li><strong>Freios:</strong> Todos os sistemas (veicular, estacionamento, motor, ABS/EBS) devem estar em pleno funcionamento.</li>\n    <li><strong>Válvulas e sistemas pneumáticos:</strong> Devem ser testadas e estar operacionais, incluindo válvulas de LGE, PQ, acumuladoras e de retenção.</li>\n    <li><strong>Canhões:</strong> Devem operar com jato compacto/neblinado e atender aos critérios de alcance mínimo conforme modelo do veículo.</li>\n    <li><strong>Abastecimento por sucção:</strong> Verificado nos dias 01 e 16 do mês, deve estar livre de vazamentos e com bomba de escorva funcional.</li>\n    <li><strong>Mangueiras, esguichos e aspersores:</strong> Devem estar sem furos, com testes hidrostáticos válidos, estruturados e funcionais.</li>\n    <li><strong>Sistema de pó químico:</strong> Inclui painel, ciclo, cilindros e reservatórios com pressão e carga mínimas conforme modelo.</li>\n    <li><strong>Sistema LGE:</strong> Envolve painel, ciclos de água e LGE, indicadores 100%, reservatórios abastecidos e válvulas funcionais.</li>\n    <li><strong>Sistema elétrico da superestrutura:</strong> Todos os circuitos devem funcionar corretamente e sem falhas.</li>\n    <li><strong>Bomba de incêndio:</strong> Deve acionar corretamente, atingir pressão ≥ 10.5 BAR e manter estanqueidade nos testes.</li>\n    <li><strong>Sistema de ar comprimido:</strong> Reservatórios devem estar íntegros e sem avarias.</li>\n    <li><strong>Mapas de grade (interno/externo):</strong> Devem estar disponíveis, atualizados, plastificados e em tamanho mínimo A3.</li>\n    <li><strong>Outros:</strong> Devem ser descritas quaisquer não conformidades ou condições adversas observadas.</li>\n  </ul>\n  <div style='margin-top: 8px; font-style: italic; color: #555;'>\n    Todos os itens acima devem estar verificados, funcionais e sem evidência de avarias para que o veículo seja considerado conforme no relatório.\n  </div>\n</div>\n\n\n    \"\n)\n"
