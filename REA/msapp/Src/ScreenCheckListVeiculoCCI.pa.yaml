      - HtmlText3_1:
          Control: HtmlViewer@2.1.0
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =239
            HtmlText: |
              ="<style>
                  body {
                      font-family: Arial;
                      font-size: 10px;
                      margin: 0;
                  }
                  .header {
                      padding: 10px;
                      margin-bottom: 10px;
                  }
                  .title {
                      color: #6600ed;
                      font-size: 18px;
                      font-weight: bold;
                  }
                  .filters {
                      font-size: 10px;
                      margin-top: 5px;
                      color: #444;
                  }
                  .container {
                      border: 1px solid #d9d9d9;
                      border-radius: 6px;
                      padding: 10px;
                      margin-bottom: 20px;
                      background-color: #fefefe;
                  }
                  .top-info {
                      font-weight: bold;
                      font-size: 11px;
                      margin-bottom: 6px;
                      color: #2b579a;
                  }
                  .top-info-two {
                      font-weight: bold;
                      font-size: 11px;
                      margin-bottom: 6px;
                      color: #9A572B;
                  }
                  .sub-info {
                      font-size: 10px;
                      margin-bottom: 10px;
                  }
                  .data-grid {
                      display: flex;
                      flex-wrap: wrap;
                      gap: 15px;
                      font-size: 11px;
                  }
                  .data-grid div {
                      flex: 1;
                      min-width: 180px;
                  }
                  .subtable {
                      width: 100%;
                      border-collapse: collapse;
                      margin-top: 10px;
                      font-size: 9px;
                  }
                  .subtable th, .subtable td {
                      border: 1px solid #ccc;
                      padding: 4px;
                      text-align: left;
                  }
                  .subtable th {
                      background-color: #e9e9e9;
                  }
                  .footer {
                      font-size: 10px;
                      text-align: right;
                      padding: 5px 10px;
                      border-top: 1px solid #ccc;
                  }
              </style>

              <div class='header'>
                  <div class='title'>Relatório de Check-list CCI</div>
                  <div class='filters'>
                      <strong>Busca:</strong> " & txtBuscarCheckListVeiculoCCI.Value & " |
                      <strong>Data inicial:</strong> " & Text(dtpBuscarChkListCCIini.SelectedDate, "[$-pt-BR]dd/mm/yyyy") & " |
                      <strong>Data final:</strong> " & Text(dtpBuscarChkListCCIfin.SelectedDate, "[$-pt-BR]dd/mm/yyyy") & " |
                      <strong>Bloco:</strong> " & If(IsBlank(cmbCHKCCIbloco.Selected.Value), "Todos", cmbCHKCCIbloco.Selected.Value) & " |
                      <strong>Aeroporto:</strong> " & If(IsBlank(cmbCHKCCIaeroporto.Selected.Result), "Todos", cmbCHKCCIaeroporto.Selected.Result) & " |
                      <strong>Veículo:</strong> " & If(IsBlank(cmbCHKCCIveiculos.Selected.Value), "Todos", cmbCHKCCIveiculos.Selected.Value) & "
                  </div>
              </div>

              " &

              Concat(
                  Sort(
                      GalleryCheckListVeiculoCCI.AllItems,
                      ID,
                      SortOrder.Descending
                  ) As PRINCIPAL,
                  With(
                      {
                          ItensFiltrados: Filter(col_checkListCCIitens, ID_CheckList = PRINCIPAL.ID_FORMS)
                      },
                      "<div class='container'>
                          <div class='top-info'>Protocolo: " & PRINCIPAL.Protocolo & "</div>
                          <div class='sub-info'>
                              <strong>Data/Hora:</strong> " & Text(PRINCIPAL.'Hora de conclusão', "[$-pt-BR]dd/mm/yyyy HH:mm") & " |
                              <strong>Aeroporto:</strong> " & PRINCIPAL.AEROPORTO & " |
                              <strong>Veículo:</strong> <font class='top-info-two'> " & PRINCIPAL.'IDENTIFICAÇÃO DO VEÍCULO' & "</font> |
                              <strong>Equipe:</strong> " & PRINCIPAL.EQUIPE & " |
                              <strong>Responsável:</strong> " & PRINCIPAL.RESPONSAVEL & "
                          </div>
                          <div class='data-grid'>
                              <div>
                                  <strong>Odômetro inicial:</strong><br>" & PRINCIPAL.'ODÔMETRO INICIAL' & "
                              </div>
                              <div>
                                  <strong>Combustível (%):</strong><br>" & PRINCIPAL.'COMBUSTÍVEL %' & "% – " &
                                      If(
                                          Value(PRINCIPAL.'COMBUSTÍVEL %') < 50,
                                          "<span style='color: #d9534f;'>NÃO CONFORME</span>",
                                          "<span style='color: #5cb85c;'>CONFORME</span>"
                                      ) & "
                              </div>
                              <div>
                                  <strong>Operacionalidade:</strong><br>" & PRINCIPAL.'OPERACIONALIDADE DO VEÍCULO' & "
                              </div>
                          </div>" &

                          If(
                              CountRows(ItensFiltrados) > 0,
                              "<table class='subtable'>
                                  <thead>
                                      <tr>
                                          <th>Item</th>
                                          <th>Resposta</th>
                                          <th>Descrição</th>
                                          <th>Status</th>
                                          <th>Criticidade</th>
                                          <th>Plano de ação</th>
                                          <th>Resposta/Solução</th>
                                          <th>Nº Chamado</th>
                                          <th>Data de normalização</th>
                                      </tr>
                                  </thead>
                                  <tbody>" &

                                  Concat(
                                      ItensFiltrados,
                                      "<tr>" &
                                          "<td>" & Item & "</td>" &
                                          "<td>" & Resposta & "</td>" &
                                          "<td>" & Descrição & "</td>" &
                                          "<td>" & Status.Value & "</td>" &
                                          "<td>" & Criticidade.Value & "</td>" &
                                          "<td>" & 'Plano de ação' & "</td>" &
                                          "<td>" & 'Resposta/Solução' & "</td>" &
                                          "<td>" & 'Número do chamado' & "</td>" &
                                          "<td>" & Text('Data de normalização', "[$-pt-BR]dd/mm/yyyy") & "</td>" &
                                      "</tr>"
                                  ) &

                                  "</tbody>
                              </table>",
                              ""
                          ) &

                      "</div>"
                  )
              ) &

              "<div class='footer'>Gerado em: " & Text(Now(), "[$-pt-BR]dd/mm/yyyy HH:mm") & "</div>"
            Size: =10
            Visible: =false
            Width: =350
            X: =1016
            Y: =529
