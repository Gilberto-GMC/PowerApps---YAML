                                                      HtmlText: |-
                                                        =
                                                        "<div style='font-family: Segoe UI, sans-serif; background-color: #ffffff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);'>
                                                          <div style='display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;'>
                                                            <div style='font-size: 14px; color: #2b579a; font-weight: bold;'>
                                                              🛫 " & ThisItem.Aeroporto & " | <span style='color:#333;'>Protocolo: " & LookUp(
                                                                col_checkListCCI,
                                                                ID_FORMS = ThisItem.IdForms,
                                                                Protocolo
                                                              ) & "</span>
                                                            </div>
                                                            <div style='font-size: 12px; color: #555;'>
                                                             " & ThisItem.Data & "
                                                            </div>
