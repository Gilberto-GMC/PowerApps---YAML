            varPerfilUser <> "Base",
            ClearCollect(
                col_checkListERSCI,
                Sort(
                    'tbl_CHECK-LIST-EQUIP-RSCI',
                    ID,
                    SortOrder.Descending
                )
            );
            ClearCollect(
                col_checkListERSCIItens,
                Sort(
                    Filter(
                        'tbl_CHECK-LIST-ALL-ITENS',
                        Modulo = var_tituloModulo
                    ),
                    ID,
                    SortOrder.Descending
                )
            ),
            ClearCollect(
                col_checkListERSCI,
                Sort(
                    Filter(
                        'tbl_CHECK-LIST-EQUIP-RSCI',
                        AEROPORTO = varAeroUser
                    ),
                    ID,
                    SortOrder.Descending
                )
            );
            ClearCollect(
                col_checkListERSCIItens,
                Sort(
                    Filter(
                        'tbl_CHECK-LIST-ALL-ITENS',
                        Modulo = var_tituloModulo And Aeroporto = varAeroUser
