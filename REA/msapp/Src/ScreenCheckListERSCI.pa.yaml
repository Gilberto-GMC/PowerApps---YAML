R PARA CORTE PESADO DE METAL' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'2. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListERSCIItens,\n        Item = \"SERRA CIRCULAR PARA CORTE PESADO DE METAL\" And ID_CheckList = GalleryCheckListERSCI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">SERRA SABRE</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'3. SERRA SABRE' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'3. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListERSCIItens,\n        Item = \"SERRA SABRE\" And ID_CheckList = GalleryCheckListERSCI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">MACHADO DE RESGATE GRANDE SEM CUNHA</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'4. MACHADO DE RESGATE GRANDE SEM CUNHA' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'4. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListERSCIItens,\n        Item = \"MACHADO DE RESGATE GRANDE SEM CUNHA\" And ID_CheckList = GalleryCheckListERSCI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"</td>\n  </tr>\n  <tr>\n    <td \" & TD & \">CONJUNTO DE TALAS PARA IMOBILIZAÇÃO DE MEMBROS SUPERIORES E INFERIORES</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'5. CONJUNTO DE TALAS PARA IMOBILIZAÇÃO DE MEMBROS SUPERIORES E INFERIORES' & \"</td>\n    <td \" & TD & \">\" & GalleryCheckListERSCI.Selected.'5. DESCREVA' & \"</td>\n    <td \" & TD & \">\" & LookUp(\n        col_checkListERSCIItens,\n        Item = \"CONJUNTO DE TALAS PARA IMOBILIZAÇÃO DE MEMBROS SUPERIORES E INFERIORES\" And ID_CheckList = GalleryCheckListERSCI.Selected.ID_FORMS,\n        Status.Value & \"  \" & 'Data de normalização'\n    ) & \"