                        Width: =420
                        X: =16
                        Y: =12
                  - btnCriarPdfRea:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        DisplayMode: =If(varGerandoPdfRea, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 135, 154, 1)
                        Font: =Font.'Segoe UI'
                        Height: =48
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(0, 88, 100, 1)
                        OnSelect: |-
                          =UpdateContext({varUrlPdfRea: "", varGerandoPdfRea: true});
                          IfError(
                              With(
                                  {
                                      arquivoPdf: PDF(
                                          cntDocumentoRelatorioRea,
                                          {
                                              Size: "A4",
                                              DPI: 96,
                                              ExpandContainers: true,
                                              Orientation: "Portrait",
                                              Margin: "12mm"
                                          }
                                      )
                                  },
                                  With(
                                      {
                                          respostaPdf: 'PowerAppV2->Criararquivo,Criarlinkdecompartilhamentoparaum...'.Run(
                                              "Relatorio_REA_" & varRelatorioReaRegistro.TipodeOcorr_x00ea_ncia.Value,
                                              {
                                                  file: {
                                                      contentBytes: arquivoPdf,
                                                      name: "Relatorio.pdf"
                                                  }
                                              }
                                          )
                                      },
                                      If(
                                          IsBlank(respostaPdf.url),
                                          Notify("O fluxo não retornou o link do PDF.", NotificationType.Error),
                                          UpdateContext({varUrlPdfRea: respostaPdf.url});
                                          Notify("PDF criado. Clique em Abrir PDF.", NotificationType.Success)
                                      );
                                      true
                                  )
                              ),
                              Notify("Falha ao criar PDF: " & FirstError.Message, NotificationType.Error);
                              false
                          );
                          UpdateContext({varGerandoPdfRea: false})
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 88, 100, 1)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =11
                        Text: = "Criar PDF"
                        X: =Parent.Width - 352
                        Y: =8
                  - btnAbrirPdfRea:
