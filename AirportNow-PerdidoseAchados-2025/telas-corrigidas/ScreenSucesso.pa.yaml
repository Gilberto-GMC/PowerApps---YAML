Screens:
  ScreenSucesso:
    Properties:
      OnVisible: =Set(varUltimaAtividade, Now())
    Children:
      - iconCircle2:
          Control: Circle@2.3.0
          Properties:
            Fill: =RGBA(52, 152, 47, 1)
            X: =Parent.Width/2 - Self.Width/2
            Y: =(Parent.Height/2 - Self.Height/2) * .7
      - iconCheck2:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =iconCircle2.Height
            Icon: =Icon.Check
            PaddingBottom: =Self.PaddingTop
            PaddingLeft: =Self.PaddingTop
            PaddingRight: =Self.PaddingTop
            PaddingTop: =24
            PressedFill: =RGBA(255, 255, 255, 0.3)
            Width: =iconCircle2.Width
            X: =Parent.Width/2 - Self.Width/2
            Y: =(Parent.Height/2 - Self.Height/2) * .7
      - LblSuccessMsg2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            BorderColor: =RGBA(0, 0, 0, 1)
            Height: =iconCircle2.Height
            Size: =20
            Text: ="Operação realizada com sucesso!"
            Width: =Parent.Width * 0.75
            X: =Parent.Width/2 - Self.Width/2
            Y: =iconCheck2.Y + iconCheck2.Height + 50
      - Timer1:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =1500
            OnTimerEnd: =Navigate(var_navigateSucess,ScreenTransition.Fade)
            OnTimerStart: =Set(varUltimaAtividade, Now());
            Visible: =false
      - Timer2_5:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            OnTimerEnd: |+
              =
              If(
                  varSessaoAtiva &&
                  (
                      DateDiff(varUltimaAtividade, Now(), TimeUnit.Minutes) >= 15
                      || varForcarExpiracao
                  ),
                  Set(varSessaoAtiva, false);
                  Set(varForcarExpiracao, false);
                  Navigate(scrSessaoExpirada, ScreenTransition.Fade)
              )

            Repeat: =true
            Visible: =false
            X: =20
            Y: =80
