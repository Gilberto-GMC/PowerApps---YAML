        =Reset(TextInputNomeCliente);
        Reset(ComboboxCanvasDoc);
        Reset(TextInputNumDoc);
        Reset(TextInputEndereco);
        Reset(TextInputDataEntrega)
      OnVisible: |-
        =UpdateContext(
            {
                VAR_DADOS_ENTREGA: LookUp(
                    tbl_perdidosAchados,
                    ID = VAR_DADOS_ENTREGA_ID
                )
            }
        );
        ClearCollect(
            colItensEntregaReciboBase,
            FirstN(
                SortByColumns(
                    tbl_perdidosAchadosItens,
                    "ID",
                    SortOrder.Descending
                ),
                1500
            )
        );
        ClearCollect(
            colItensEntregaRecibo,
            Filter(
                colItensEntregaReciboBase,
                ID_fk = VAR_DADOS_ENTREGA.ID
                    And arquivar = 0
            )
        );
        Set(varUltimaAtividade, Now())
