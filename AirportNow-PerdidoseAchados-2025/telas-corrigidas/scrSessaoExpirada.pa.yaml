Screens:
  scrSessaoExpirada:
    Properties:
      OnVisible: |+
        =//Set(varUsuarioID; Blank());
        //Set(varUsuarioNome; Blank());
        Set(varSessaoAtiva, false);
        Set(varUltimaAtividade, Blank());


    Children:
      - Container12:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =300
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            X: =Parent.Width / 2 - Self.Width / 2
            Y: =Parent.Height / 2 - Self.Height / 2
          Children:
            - Text1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Height: =165
                  Size: =50
                  Text: ="Sua sessão expirou!"
                  Width: =Parent.Width
                  Y: =15
            - ButtonCanvas12:
                Control: Button@0.0.45
                Properties:
                  Height: =49
                  OnSelect: |-
                    =
                    Launch(
                            "https://apps.powerapps.com/play/providers/Microsoft.PowerApps/apps/a5af3add-12da-4107-b027-23daea7b0056?hideNavBar=true",
                            {},
                            LaunchTarget.Replace
                        )
                  Text: ="Voltar ao AirportNow"
                  Width: =Parent.Width
                  Y: =80
