                                    FontColor: =RGBA(184, 0, 0, 1)
                                    Height: =40
                                    Icon: ="DismissCircle"
                                    OnSelect: |-
                                      =Set(varUltimaAtividade, Now());
                                      If(
                                          CountRows(colSelecionadosDev) = 0,
                                          Notify(
                                              "Selecione ao menos um item.",
                                              NotificationType.Warning,
                                              5000
                                          ),
                                          If(
                                              Confirm(
                                                  "Confirma o retorno de " & CountRows(colSelecionadosDev) & " item(ns) ao status RECEBIDO? A separação para doação será desfeita e os itens retornarão à lista de recebidos.",
                                                  {
                                                      ConfirmButton: "Confirmar",
                                                      CancelButton: "Cancelar"
                                                  }
                                              ),
                                              Set(varAtualizandoDev, true);
                                              Patch(
                                                  tbl_perdidosAchadosItens,
                                                  ForAll(
                                                      colSelecionadosDev,
                                                      {
                                                          ID: Value(ThisRecord.ID),
                                                          status: "Recebido"
                                                      }
                                                  )
                                              );
                                              If(
                                                  !IsEmpty(Errors(tbl_perdidosAchadosItens)),
                                                  Notify(
                                                      "Ocorreu erro ao gravar no SharePoint.",
                                                      NotificationType.Error,
                                                      10000
                                                  ),
                                                  Notify(
                                                      "Status atualizado com sucesso.",
                                                      NotificationType.Success
                                                  );
                                                  Clear(colSelecionadosDev);
                                                  Refresh(tbl_perdidosAchadosItens);
                                                  Select(ButtonCanvas7_9)
                                              );
                                              Set(varAtualizandoDev, false)
                                          )
                                      )
                                    Text: ="Cancelar separação dos itens selecionados"
                                    Width: =350
                                    X: =10
                                    Y: =924
                              - Text5_3:
                                  Control: ModernText@1.0.0
                                  Properties:
