                  - Container14:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - ButtonCanvas13_4:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              BorderColor: =RGBA(122, 138, 143, 0.2)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =2
                              DisplayMode: =If(varAtualizando, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                              Height: =40
                              OnSelect: |
                                =
                                UpdateContext({ showConfirmacaoDoacao: false });
                                Reset(dpDataDoacao);
                                Reset(TextInputDoado)
                              Text: ="NÃO"
                              Width: =619
                              Y: =740
                        - ButtonCanvas13_2:
                            Control: Button@0.0.45
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BorderColor: =RGBA(122, 138, 143, 0.2)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =2
                              DisplayMode: =If(IsBlank(TextInputDoado.Text), DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                              Height: =40
                              OnSelect: |-
                                =Set(varUltimaAtividade, Now());
                                Set(varAtualizandoDev, true);
                                Clear(colErrosDoacao);
                                ForAll(
                                    colSelecionadosDev As sel,
                                    IfError(
                                        Patch(
                                            tbl_perdidosAchadosItens,
                                            LookUp(
                                                tbl_perdidosAchadosItens,
                                                ID = sel.ID
                                            ),
                                            {
                                                doado_usuario: varNomeUser,
                                                doado_em: dpDataDoacao.SelectedDate,
                                                doado_para: Trim(TextInputDoado.Text),
                                                status: "Doado"
                                            }
                                        ),
                                        Collect(
                                            colErrosDoacao,
                                            {
                                                ID: sel.ID,
                                                Mensagem: FirstError.Message
                                            }
                                        );
                                        Blank()
                                    )
                                );
                                If(
                                    !IsEmpty(colErrosDoacao),
                                    Notify(
                                        "Erro ao doar " & CountRows(colErrosDoacao) & " item(ns). A seleção foi mantida para tentar novamente.",
                                        NotificationType.Error,
                                        10000
                                    ),
                                    Refresh(tbl_perdidosAchadosItens);
                                    ForAll(
                                        Filter(
                                            Distinct(
                                                colSelecionadosDev,
                                                ID_fk
                                            ),
                                            !IsBlank(Value)
                                        ) As paiDistinto,
                                        If(
                                            IsBlank(
                                                LookUp(
                                                    Filter(
                                                        colItensComDataDevBase,
                                                        !(ID in colSelecionadosDev.ID)
                                                    ),
                                                    ID_fk = paiDistinto.Value
                                                        And arquivar = 0
                                                        And (
                                                            status = "Recebido"
                                                            Or status = "Separado"
                                                        )
                                                )
                                            ),
                                            IfError(
                                                Patch(
                                                    tbl_perdidosAchados,
                                                    LookUp(
                                                        tbl_perdidosAchados,
                                                        ID = paiDistinto.Value
                                                    ),
                                                    {status: "Finalizado"}
                                                ),
                                                Collect(
                                                    colErrosDoacao,
                                                    {
                                                        ID: paiDistinto.Value,
                                                        Mensagem: FirstError.Message
                                                    }
                                                );
                                                Blank()
                                            )
                                        )
                                    );
                                    If(
                                        !IsEmpty(colErrosDoacao),
                                        Notify(
                                            "Itens doados, mas houve erro ao finalizar registro(s) pai. Revise o status do atendimento.",
                                            NotificationType.Warning,
                                            10000
                                        ),
                                        UpdateContext({showConfirmacaoDoacao: false});
                                        Clear(colSelecionadosDev);
                                        Reset(dpDataDoacao);
                                        Reset(TextInputDoado);
                                        Notify(
                                            "Doação realizada!",
                                            NotificationType.Success
                                        );
                                        Select(ButtonCanvas7_9)
                                    )
                                );
                                Set(varAtualizandoDev, false)
                              Text: ="SIM"
                              Width: =619
                              Y: =740
