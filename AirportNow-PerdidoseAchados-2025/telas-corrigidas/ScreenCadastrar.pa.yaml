                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - ConfirmDeleteButton2:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Delete"
                                    FontWeight: =FontWeight.Normal
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =UpdateContext({deleteMode: false});
                                      UpdateContext({var_load: true});
                                      Switch(
                                          var_modulo,
                                          "Registro",////////////////////////////////////////////////////////////////////////////////
                                          Patch(
                                              tbl_perdidosAchados,
                                              LookUp(
                                                  tbl_perdidosAchados,
                                                  ID = selectedRecord.ID
                                              ),
                                              {arquivado: 1}
                                          );
                                          Patch(
                                              tbl_perdidosAchadosItens,
                                              ForAll(
                                                  Filter(
                                                      col_itensCadastradosBase,
                                                      ID_fk = selectedRecord.ID
                                                  ) As itemArquivar,
                                                  {
                                                      ID: itemArquivar.ID,
                                                      arquivar: 1
                                                  }
                                              )
                                          );
                                          Clear(col_itens);
                                          If(
                                              LookUp(
                                                  tbl_perdidosAchados,
                                                  ID = selectedRecord.ID
                                              ).arquivado = 1,
                                              Navigate(
                                                  ScreenSucesso,
                                                  ScreenTransition.Fade,
                                                  {var_navigateSucess: ScreenCadastrar}
                                              ),
                                              Navigate(
                                                  ScreenErro,
                                                  ScreenTransition.Fade,
                                                  {var_navigateErro: ScreenCadastrar}
                                              )
                                          ),
                                          "ItemRegistrado",////////////////////////////////////////////////////////////////////////////////
                                          Patch(
                                              tbl_perdidosAchadosItens,
                                              LookUp(
                                                  tbl_perdidosAchadosItens,
                                                  ID = selectedRecord.ID
                                              ),
                                              {arquivar: 1}
                                          );
                                          RemoveIf(
                                              col_itens,
                                              ID = selectedRecord.ID
                                          );
                                          If(
                                              LookUp(
                                                  tbl_perdidosAchadosItens,
                                                  ID = selectedRecord.ID
                                              ).arquivar = 1,
                                              Notify(
                                                  "Operação realizada com sucesso!",
                                                  NotificationType.Success
                                              ),
                                              Notify(
                                                  "Erro. tente novamente!",
                                                  NotificationType.Error
                                              )
                                          ),
                                          "ItemAdicionado",////////////////////////////////////////////////////////////////////////////////
                                          RemoveIf(
                                              col_itens,
                                              ID = selectedDeleteItem.ID
                                          );
                                          Notify(
                                              "Operação realizada com sucesso!",
                                              NotificationType.Success
                                          )
                                      );
                                      UpdateContext({var_load: false})
                                    Text: ="Excluir"
                              - CancelDeleteButton2:
