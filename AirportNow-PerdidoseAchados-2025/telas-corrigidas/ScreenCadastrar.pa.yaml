                                                  SortOrder.Descending
                                              ),
                                              1200
                                          )
                                      );
                                      With(
                                          {idBusca: IfError(Value(SearchInput2.Value), Blank())},
                                          If(
                                              !IsBlank(SearchInput2.Value) And !IsBlank(idBusca),
                                              ClearCollect(
                                                  col_perdidosRegistrados,
                                                  Filter(
                                                      tbl_perdidosAchados,
                                                      ID = idBusca
