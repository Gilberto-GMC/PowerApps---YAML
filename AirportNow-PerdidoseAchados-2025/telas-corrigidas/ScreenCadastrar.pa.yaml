                                                          )
                                                          And (
                                                              IsBlank(dtpFilterInicio.SelectedDate)
                                                              Or data >= dtpFilterInicio.SelectedDate
                                                          )
                                                          And (
                                                              IsBlank(dtpFilterTermino.SelectedDate)
                                                              Or data < DateAdd(
                                                                  dtpFilterTermino.SelectedDate,
                                                                  1,
                                                                  TimeUnit.Days
                                                              )
                                                          )
                                                  )
                                              )
                                          )
