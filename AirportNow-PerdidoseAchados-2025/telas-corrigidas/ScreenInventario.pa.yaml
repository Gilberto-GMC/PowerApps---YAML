                                                      Or aeroporto = ComboboxCanvasAeroporto_5.Selected.Value
                                                  )
                                                  And (
                                                      IsBlank(dtpFilterInicio_5.SelectedDate)
                                                      Or data >= dtpFilterInicio_5.SelectedDate
                                                  )
                                                  And (
                                                      IsBlank(dtpFilterTermino_5.SelectedDate)
                                                      Or data < DateAdd(
                                                          dtpFilterTermino_5.SelectedDate,
                                                          1,
                                                          TimeUnit.Days
