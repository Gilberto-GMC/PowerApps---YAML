                                                      Or StartsWith(marca, SearchInput2_5.Value)
                                                  )
                                          )
                                      );
                                      ClearCollect(
                                          col_perdidosFiltrados,
                                          Filter(
                                              colInventarioPaisBase,
                                              arquivado = 0
                                                  And status = "Em andamento"
                                                  And data <= DateAdd(Today(), -90, TimeUnit.Days)
